  @container (max-width: 520px) {
    .ss-row { gap: 8px 10px; }
    .stats-detail-summary { padding: 10px 8px; }
  }
  .stats-summary-label { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; display: flex; align-items: center; gap: 4px; }
  .stats-summary-value { font-size: 14px; font-weight: 700; }
  /* 요약 항목 = 카드 지표행과 동일 문법(아이콘·색·클릭→그래프·hover 민트 테두리) */
  .stats-summary-item[data-metric] { cursor: pointer; padding: 2px 6px; margin: -3px -7px; border: 1px solid transparent; transition: background 0.15s, border-color 0.15s; }
  .stats-summary-item[data-metric]:hover { background: var(--surface2); border-color: var(--accent); }
  /* 일별 요약 세션의 시청자(최고·평균) — 시간 우측 인라인, 글씨는 시간과 동일 톤(아이콘만 색).
     inline-flex 중앙정렬 = 카드 라벨(stats-card-label)과 동일 패턴 — 아이콘이 텍스트 흐름의 vertical-align:middle(x-height 의존)로 앉으면 폰트 따라 틀어짐 */
  .day-session-viewer { display: inline-flex; align-items: center; font-size: 12px; color: var(--text); font-weight: 600; white-space: nowrap; }
  .day-session-viewer .stats-row-icon { margin-right: 3px; }

  .stats-member-header {
    display: flex; flex-direction: column;   /* v2(2026-08-29): 선택기 줄 → 요약 줄 세로 적층 — 단일 컬럼 개편 */
    gap: 12px;
    margin-bottom: 16px;
  }

  /* [요약 | 종류 필터] 한 행(.ss-filter-row)은 2026-08-31 폐지 — 필터가 없어져 요약만 남으므로 래퍼가 필요 없다. */

  .stats-detail-body {
    display: flex; flex-direction: column; gap: 16px;
    /* v2(2026-08-29): 우측 상세 열 폐지 — 일별 요약은 달력의 해당 주 아래 확장(일정 모달 문법)으로 이동.
       단일 컬럼이라 PC·모바일 구조가 동일하고, 차이는 셀 썸네일 유무(달력 블록의 1360 분기)뿐. */
  }

  .calendar { background: var(--surface); border: 1px solid var(--border); padding: 12px; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }   /* minmax(0,·): 칸이 내용 폭으로 벌어지지 않게(2026-08-31) */
  .cal-weekdays { margin-bottom: 4px; }
  .cal-weekrow + .cal-weekrow { margin-top: 4px; }   /* 주 행 간격 = 셀 gap(4px)과 동일 — 연속된 그리드처럼 보이게 */
  .cal-week-detail { border: 1px solid var(--border); background: var(--bg); padding: 16px; margin-top: 4px; }   /* 주간 확장 슬롯 — 일정 모달 .sch-detail과 동일 문법 */
  .cal-week-detail:empty { display: none; }
  .calendar-weekday {
    text-align: center; font-size: 12px;
    color: var(--text); font-weight: 700; padding: 6px 0;   /* v11: 평일 라벨도 날짜 숫자와 같은 기본색(muted → text) — 통계·일정 공용 */
  }
  .calendar-weekday.sun { color: #f87171; }
  .calendar-weekday.sat { color: #60a5fa; }
  .calendar-day {
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1.5px solid transparent;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 13px; color: var(--text);
    cursor: pointer; transition: all 0.15s;
    padding: 4px; gap: 2px;
    font-family: inherit;
  }
  .calendar-day:hover { border-color: var(--accent); }
  .calendar-day.outside { opacity: 0.25; cursor: default; }
  .calendar-day.outside:hover { border-color: transparent; }
  /* (방송날 민트 배경·글자색은 v5에서 제거 — 정보는 칩·썸네일이 담당, 날짜색은 요일 규칙(Crenop 지정 2026-08-29).
     선택 테두리(.selected)와 오늘 표시(.today)는 유지) */
  .calendar-day.selected { border-color: var(--accent); }
  .calendar-day.today { box-shadow: inset 0 0 0 1.5px var(--time); }
  .calendar-daynum { font-weight: 700; font-size: 13px; }
  /* (구 "N회"·활동 점 표기 CSS는 v4에서 제거 — 컴팩트도 아이콘+숫자 칩으로 통일, 2026-08-29 Crenop 지정) */
  /* ── 썸네일 달력 v3(2026-08-29): 베이스=원형 컴팩트(공용 .calendar-day를 절대 오염시키지 않는다 — 일정 모달 회귀 교훈).
     PC 썸네일 폼은 통계 전용 스코프(.stats-detail-body) + min-width 1361 컨테이너에서만 켠다. ── */
  .cd-top { display: contents; }                 /* 컴팩트: 날짜 숫자를 셀 중앙 흐름에 그대로 */
  /* v4 컴팩트 칩: 2열 고정 슬롯 그리드(1행 숲|VOD · 2행 숲글|카페 · 3행 유튜브 — Crenop 지정).
     슬롯(grid-area) 고정이라 0으로 빠진 항목이 있어도 남은 칩의 자리가 안 흔들린다. */
  .cd-chips { min-width: 0; }   /* 폼별 배치는 분기에서: PC=flex 한 줄 / 컴팩트=display:contents(셀 그리드에 직접 배치, 아래 v7) */
  /* v12: 칩 = [컴팩트용 아이콘 단독 .cd-ic | PC·헤더용 합성 .cd-full] 이중 표현 — 폼별로 하나만 보인다.
     합성본은 아이콘+숫자가 한 SVG 좌표계(한 번에 래스터 → 반픽셀 편차 소멸), 숫자는 BADGE_GLYPHS 자산. */
  .cd-chip { display: inline-flex; color: var(--muted); }
  .cd-chip .cd-full { height: 11px; width: auto; display: block; }
  .cd-chip .cd-ic { display: none; }
  .cd-chip .cd-ic svg { width: 10px; height: 10px; display: block; }
  .cd-chip.broadcast { color: var(--ev-start); }   /* 숲 파랑 — 사이트 공통(--ev-start) */
  .cd-chip.post { color: var(--ev-post); }         /* 숲 게시글 고유 초록(--ev-post) */
  .cd-chip.youtube { color: var(--ev-youtube); }
  .cd-chip.cafe { color: #03C75A; }
  /* v6: 요일 날짜색을 전역 규칙으로 — 통계·일정 달력 공용(색만 얹는 무해 규칙, 리셋을 앞에 둬 주말색이 이긴다) */
  .stats-detail-body .calendar-daynum { color: var(--text); }
  .calendar-daynum.sun { color: #f87171; }
  .calendar-daynum.sat { color: #60a5fa; }
  /* v9: 컴팩트 셀 — Crenop 지정 슬롯 복원(제가 컨펌 없이 되돌렸던 것 원위치): 1행 [빈칸|유튜브] ·
     2행 [숲방송|숲게시글] · 3행 [빈칸|카페]. 1행1열 빈칸은 좌상단 고정 날짜와의 충돌 회피 — 묶음이 '셀 전체'
     정중앙(지정)에 앉아도 날짜 영역과 안 겹치는 이유가 이 빈칸이다. 0개 항목은 비표시하되 슬롯 고정.
     3행1열은 다시보기 칩 자리였다(2026-09-06 폐지 — 다시보기는 썸네일 탭 몫). 다른 칩의 자리는 그대로. */
  /* 폭 조건 없음(2026-08-31): 썸네일 폼이 사라져 폭으로 셀 모양을 가를 이유가 없다 — 어느 폭에서나 컴팩트 */
  .stats-detail-body .calendar-day { position: relative; padding: 3px; justify-content: center; align-items: center; gap: 0; }
  .stats-detail-body .calendar-day .calendar-daynum { position: absolute; top: 3px; left: 5px; line-height: 13px; }
  .stats-detail-body .cd-chips { display: grid; grid-template-columns: auto auto; gap: 2px 6px; justify-items: start; }
  .stats-detail-body .cd-s-yt   { grid-area: 1 / 2; }
  .stats-detail-body .cd-s-soop { grid-area: 2 / 1; }
  .stats-detail-body .cd-s-post { grid-area: 2 / 2; }
  .stats-detail-body .cd-s-cafe { grid-area: 3 / 2; }
  .stats-detail-body .calendar-day .cd-chip .cd-full { display: none; }   /* v13: '달력 셀'만 아이콘 단독(숫자 제거) — 일별 요약 헤더 숫자까지 사라지던 과대 스코프 교정(Crenop 적발) */
  .stats-detail-body .calendar-day .cd-chip .cd-ic { display: inline-flex; }
  /* 다시보기 타일 묶음 — 다시보기 고르기 모달·링크 고르기 모달(2026-09-06부터는 여기서만 — 일별 요약의 슬롯은 폐지). 타일은 200px 문법 */
  .ds-vods { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .ds-vod { width: 200px; text-decoration: none; color: inherit; display: block; }
  .ds-vod-thumb { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--surface2); }
  .ds-vod-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ds-vod:hover .ds-vod-thumb { outline: 1.5px solid var(--accent); }
  .ds-vod-title { display: flex; align-items: center; gap: 4px; min-height: 20px; margin-top: 4px; font-size: 12px; line-height: 1.35; color: var(--text); }   /* v13: 배지·글자 세로 중앙 + 배지 없는 타일도 같은 높이(20px 상시 확보 — 정렬 어긋남 예방, Crenop 지정) */
  .ds-vod-title .day-session-mode { flex: none; }
  .ds-vod-tt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* (.ds-vod-badge는 v12에서 폐기 — 기존 모드 배지 문법(day-session-mode + labelBadgeSvg) 재사용) */
  .ds-vod-none { font-size: 11px; color: var(--muted); }
  /* v4: 영상 길이는 썸네일을 가리지 않고 제목 아래 줄에 — 생방송/이벤트 탭의 clockTime 문법 그대로 */
  /* v5 색 분류: 인라인 시간 배지는 무채색 — 생방송 카드 .card-btime의 2026-07-17 확정("무채색, 경과 표시와 통일")과 동일 부류.
     파랑(--ev-start)은 '방송 시간' 지표 라벨 아이콘과 세션 행 시간 아이콘에만. */
  .ds-vod-dur { display: inline-flex; align-items: center; gap: 3px; margin-top: 2px; font-size: 11px; color: var(--text2); font-weight: 600; }   /* 사실 값(길이) = 2차 */
  .ds-vod-dur svg { width: 12px; height: 12px; display: block; flex: none; }
  /* 일별 요약 변경 로그의 경과 배지 — 이벤트 탭 .event-elapsed 재사용, 10px 라인에 맞게 축소 */
  .day-session-change .event-elapsed { font-size: 11px; margin-left: 2px; }
  .day-session-change .event-elapsed svg { width: 10px; height: 10px; vertical-align: -1px; }
  /* v5: 일별 요약 헤더 — 날짜는 요일색, 개수는 달력과 동일한 칩 문법(약간 키움) */
  .ddt-date { color: var(--text); }
  .ddt-chips { display: inline-flex; align-items: center; gap: 8px; }   /* v7: 배치는 부모 flex가 담당 — 구 margin/vertical-align 보정 제거 */
  .day-detail-title .cd-chip .cd-full { height: 13px; }   /* v12: 헤더 스케일 — 배치는 칩 내부 좌표가 담당 */
  .day-session-change .chg-after { display: inline-block; max-width: 100%; vertical-align: top; }   /* "구제목 →" 다음 새 제목부터 줄바꿈(안 넘치면 한 줄 유지) — 2026-08-29 확정 */
  .vod-pick-panel { width: 440px; max-width: calc(100vw - 32px); }   /* 좁은 폭(≤700, 휴대폰): 아래 2열 규칙 */
  /* 태블릿 이상(2026-09-06 Crenop: 폭이 넉넉하면 넓어도 된다 — 지표 그래프 모달처럼 가변): 타일은 일별 요약 규격 200px 고정으로 돌아가고
     패널은 타일이 필요한 만큼(fit-content)만 넓어진다 — 2개면 종전 440, 최대 5열 1074(= 200×5 + 간격 12×4 + 몸통 패딩 24 + 테두리 2) + 스크롤바 자리, 넘으면 줄바꿈. */
  /* 구획 이름(2026-09-06 Crenop): 그림 + 이름, 기둥 제목(.filter-title)과 같은 규격(13px·700·자간 1px). 그림 색은 사이트 배정색 — 유튜브 빨강·숲 ∞ 파랑(썸네일 탭 종류 버튼과 같다) */
  .vod-pick-sec { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; letter-spacing: 1px; color: var(--muted); margin: 10px 0 6px; }
  .vod-pick-sec svg { width: 14px; height: 14px; display: block; flex: none; }
  .vod-pick-sec[data-kind="youtube"] svg { color: var(--ev-youtube); }
  .vod-pick-sec[data-kind="post"] svg { color: var(--ev-post); }   /* 숲 게시글 — 최근 활동의 글 색 */
  .vod-pick-sec[data-kind="vod"] svg { color: var(--ev-start); }
  .vod-pick-sec:first-child { margin-top: 0; }   /* v13: 2타일 정합 — 고정 200px 딱맞춤은 패널 테두리 1~2px 산입에 1열로 무너졌다(Crenop 적발). 타일을 반폭 계산으로 */
  .vod-pick-panel .lr-body { padding: 12px; scrollbar-gutter: stable; }   /* 경계~영상 = 영상~영상(12px) 등간격 — 종전엔 lr-body 무패딩이라 썸네일이 경계에 붙었다.
     scrollbar-gutter: stable(2026-09-06 Crenop 지적): 세로로 넘쳐 스크롤바가 서면 그 폭(약 17px)만큼 안쪽이 줄어 5열이 4열로 접히고 오른쪽이 비었다 —
     자리를 늘 잡아 두면 패널 폭(fit-content)에 그 폭이 들어가 열 수가 안 흔들린다. 안 넘칠 땐 오른쪽 여백이 그만큼 더 있다(html과 같은 태도). */
  .vod-pick-panel .ds-vods { gap: 12px; margin-top: 0; }
  .vod-pick-panel .ds-vod { width: calc(50% - 6px); }   /* 12px gap 반분 — 어떤 테두리 오차에도 2열 유지, 홀수 개는 마지막 줄 좌측 */
  .vod-pick-panel .cal-vod { width: calc(50% - 6px); }   /* 링크 고르기(이름줄 감싸개) — 감싸개가 반폭을 맡고 안의 타일은 그 안을 다 쓴다(2026-09-04: 안 타일에 반폭이 또 걸려 1/4 크기가 되던 실사고) */
  .vod-pick-panel .cal-vod .ds-vod { width: 100%; }
  @media (min-width: 701px) {   /* 위 2열 규칙보다 뒤에 있어야 이긴다(같은 특이도) */
    .vod-pick-panel { width: fit-content; min-width: 440px; max-width: min(1092px, calc(100vw - 32px)); }   /* 1092 = 1074 + 스크롤바 자리 18 */
    .vod-pick-panel .ds-vod, .vod-pick-panel .cal-vod { width: 200px; }
    .vod-pick-panel .cal-vod .ds-vod { width: 100%; }
  }
  .vod-pick-empty { font-size: 13px; color: var(--muted); padding: 8px 0; }
  .vod-pick-empty a { color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .vod-pick-empty a svg { width: 12px; height: 12px; display: block; }
  /* 우측 일별 요약 패널 — 기본 숨김(≤800 모바일·PC는 주간 확장이 담당), 중간 폭 밴드에서만 표시 */
  .day-detail {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px;
    flex-direction: column;
  }
  /* 썸네일 폼 폐지(2026-08-31): 셀에 16:9 그림을 넣으려면 달력만 1450px가 필요해, 그 폭을 못 만드는
     화면에서는 아예 못 보는 기능이었다. 썸네일 모아보기는 달력 탭이 맡고, 여기는 통계 본분(컴팩트 셀)으로 돌아간다.
     남은 폼은 둘 — 넓으면 [달력 | 일별 요약] 좌우, 좁으면 위아래. */
  @container (min-width: 801px) {   /* 중간 폭 — 컴팩트 달력 + 우측 일별 요약(구형 2열 복원, Crenop 지정) */
    .stats-detail-body { display: grid; grid-template-columns: minmax(0, 500px) minmax(300px, 1fr); grid-template-areas: "cal detail" "heat detail"; grid-template-rows: auto 1fr; gap: 16px; align-items: start; }   /* rows auto·1fr(2026-08-29): 우측 요약이 두 행에 걸치는데 행 규칙이 없으면 요약의 남는 높이가 1행에도 배분돼 히트맵이 달력에서 밀려 내려갔다 — 1행은 달력 높이만, 나머지는 전부 2행이 흡수해 히트맵이 달력 바로 아래 고정 */
    .stats-detail-body .calendar { grid-area: cal; }
    .stats-detail-body .toh-wrap { grid-area: heat; margin: 0; }
    .stats-detail-body .day-detail { grid-area: detail; display: flex; }
    .stats-detail-body .cal-week-detail { display: none; }   /* 이 밴드에선 주간 확장 대신 우측 패널 */
  }
  /* (활동일 옅은 민트 음영도 v5에서 제거 — 음영 폐지, 칩이 활동 정보를 담당) */

  /* 시간대별 방송 분포 히트맵 (멤버 개별 화면) — v3(2026-08-29): 셀을 15×15 정사각으로 고정(열 폭=행 높이).
     래퍼는 내용 폭(31일≈490px)에 맞추고 중앙 배치 — 전폭에 늘리지 않는다(Crenop 지정). 좁은 화면은 내부 가로 스크롤. */
  .toh-wrap { margin: 16px auto 0; width: fit-content; max-width: 100%; }
  .toh-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
  .toh-title { font-size: 12px; font-weight: 600; color: var(--text2); }
  .toh-sub { font-size: 11px; color: var(--muted); }
  .toh-headright { display: inline-flex; align-items: center; gap: 10px; }
  .toh-tendency { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--muted); }   /* 성향 라벨: 아이콘·텍스트 단일 색 통일(여기 한 줄로 조절) */
  .toh-tendency svg { width: 12px; height: 12px; }
  .toh-body { display: flex; align-items: flex-start; padding: 7px 0; }
  .toh-yaxis { position: relative; width: 22px; flex: none; }
  .toh-ylabel { position: absolute; right: 4px; font-size: 11px; line-height: 12px; color: var(--text2); }   /* 축 숫자 = 2차 */
  .toh-right { flex: 1; min-width: 0; }   /* v4: 스크롤 제거 — 열을 minmax(0,15px)로 두어 좁으면 셀이 줄어든다(스크롤바 억제) */
  .toh-grid { display: grid; gap: 0; }
  .toh-xaxis { display: grid; gap: 0; margin-top: 3px; }
  .toh-xlabel { font-size: 11px; line-height: 12px; text-align: center; white-space: nowrap; }   /* 두 자리(20·26)가 세로로 쪼개지던 것 — 칸(15px)보다 넓어도 넘치게 두고 줄만 안 바꾼다 */

  .day-kind-icon {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    background: var(--surface);
    vertical-align: middle;
  }
  .day-kind-icon svg { width: 11px; height: 11px; display: block; vertical-align: middle; }
  .day-kind-icon.broadcast { color: var(--ev-start); background: rgba(96,165,250,0.15); }
  .day-kind-icon.post { color: var(--ev-post); background: rgba(52,211,153,0.15); }
  .day-kind-icon.youtube { color: var(--ev-youtube); background: rgba(239,68,68,0.15); }
  .day-kind-icon.cafe { color: #03C75A; background: rgba(3,199,90,0.15); }
  .day-session-row-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
    flex-wrap: wrap;   /* 시청자 스팬이 우측에 붙어 좁으면 다음 줄로 */
  }
  .day-item {
    display: flex;
    gap: 10px;
    padding: 8px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    margin-bottom: 6px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s;
    align-items: center;
  }
  .day-item:hover { border-color: var(--accent); }
  .day-item-time {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    flex-shrink: 0;
    min-width: 36px;
  }
  .day-item-title {
    flex: 1;
    font-size: 12px;
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: keep-all; overflow-wrap: anywhere;   /* v11: 어절 단위 줄바꿈(Crenop 지정) — 구 break-all(2줄 활용 최대화)을 대체, 긴 토큰만 비상 분절 */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  /* (.day-detail 컨테이너 CSS는 v2에서 제거 — 패널이 사라지고 내용물은 .cal-week-detail 확장 슬롯 안에서 렌더) */
  .day-detail-title {
    font-size: 14px; font-weight: 700;
    color: var(--accent);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;   /* v7: 날짜·칩을 flex 세로 중앙으로 — vertical-align 보정 폐기 */
    margin-bottom: 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .day-detail-empty {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px;
    text-align: center; line-height: 1.6;
  }
  .day-session {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 10px 12px; margin-bottom: 8px;
    display: block; text-decoration: none; color: inherit;
  }
  .day-session:hover { border-color: var(--accent); }
  button.day-session { width: 100%; font: inherit; text-align: left; color: inherit; cursor: pointer; }   /* 2개↑ 다시보기 → 선택 모달(2026-09-06) — <a> 행과 같은 모양 */
  .day-session-time {
    display: inline-flex; align-items: center;   /* 시계 아이콘을 flex 중앙으로 — vertical-align(x-height 의존) 탈피, day-session-viewer와 동일 사유 */
    font-size: 12px; color: var(--text);
    font-weight: 600;
  }
  .day-session-time .stats-row-icon { margin-right: 4px; }
  .day-session-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .day-session-mode {
    display: inline-block; margin-right: 6px;
    vertical-align: var(--daytag-valign);   /* 배지 박스 중심 = 세션 제목(600·13px) 잉크 중심 — calibrateBadgeValign()이 실측 주입 */
  }
  .day-session-mode.adult { color: var(--mode-adult); }
  .day-session-mode.subscription { color: var(--mode-subscription); }
  .day-session-mode.copyright { color: var(--mode-copyright); }
  .day-session-mode.password { color: var(--mode-password); }
  .day-session-mode.restricted { color: var(--mode-restricted); }
  .day-session-mode.normal { color: var(--ev-start); }
  .day-session-changes {
    margin-top: 8px; padding-top: 6px;
    border-top: 1px dashed var(--border);
    display: flex; flex-direction: column; gap: 4px;
  }
  .day-session-change {
    font-size: 11px; color: var(--text3);
    display: flex; align-items: center; gap: 6px;
  }
  .day-session-change-time { color: var(--text2); font-size: 11px; flex-shrink: 0; }   /* 사실 값(시각) = 2차 */
  .day-session-change-icon {
    flex-shrink: 0; width: 16px; display: flex; align-items: center; justify-content: center;
    color: var(--ev-yellow); font-weight: 700;
  }
  .day-session-change-icon svg { width: 16px; height: 16px; display: block; }

  /* === 관련 링크 탭 === */
  .links-wrap {
    padding: 20px 24px;
    max-width: 1600px; width: 100%; margin: 0 auto;
    flex: 1;
  }
  .links-section {
    background: var(--surface);
    border: 1px solid var(--border);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .links-table-wrap {
    overflow-x: auto;
  }
  .links-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    min-width: 780px;   /* 열당 60px × 13명 (2026-08-02 빙밍 합류로 720→780 재계산) */
  }
  .links-table th, .links-table td {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 6px 8px;
    text-align: center;
    vertical-align: top;
  }
  .links-table td.td-bottom { vertical-align: bottom; }   /* 노래책 단독 셀: 행 바닥 정렬로 노래책 줄 통일(rowEtc에서 부여) */
  .links-table th:last-child, .links-table td:last-child { border-right: none; }
  .links-table tr:last-child td { border-bottom: none; }
  .links-table th {
    background: var(--surface2);
    font-size: 12px;
    font-weight: 700;
    padding: 10px 6px;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .links-th-avatar {
    width: 56px;
    height: 56px;
    object-fit: cover;
    margin: 0 auto 6px;
    display: block;
    border: 1.5px solid var(--border);
  }
  .links-th-name { display: block; font-size: 12px; font-weight: 700; }
  .links-cell {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: stretch;
  }
  .link-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 6px 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.15s;
    line-height: 1.3;
    word-break: keep-all;
    overflow-wrap: break-word;
    text-align: center;
  }
  .link-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .link-icon svg {
    width: 16px;
    height: 16px;
    display: block;
  }
  .link-label {
    display: inline-block;
  }
  /* 테두리가 있는 요소 → 테두리색만(신호 규칙 ①). 글씨까지 바꾸던 것 폐지(2026-09-01) —
     아이콘은 브랜드색이 인라인으로 박혀 있어 hover에서 민트로 맞추는 아래 규칙을 그대로 둔다. */
  .link-btn:hover {
    background: rgba(97,255,236,0.10);
    border-color: var(--accent);
  }
  .link-btn:hover .link-icon { color: var(--accent) !important; }
  .link-btn.ogq-btn {
    display: flex;
    flex-direction: column;
    gap: 2px;
    justify-content: center;
  }
  .ogq-name {
    display: block;
    font-size: 11px;
    font-weight: 600;
    word-break: keep-all;
    overflow-wrap: break-word;
    text-wrap: balance;
  }
  .ogq-platform {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
  }
  .ogq-platform .link-icon svg {
    width: 10px;
    height: 10px;
  }
  .link-btn.ogq-btn:hover .ogq-platform { color: var(--accent); }
  .link-btn.ogq-btn:hover .ogq-platform .link-icon { color: var(--accent) !important; }
  /* 모바일: 멤버 가로 매트릭스 대신 멤버별 세로 블록 (가로 스크롤 제거). 데스크톱은 .links-table-wrap 유지 */
  .links-mobile { display: none; }
  .links-m-block {
    padding: 14px 14px;
    border-bottom: 1px solid var(--border);
  }
  .links-m-block:last-child { border-bottom: none; }
  .links-m-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 11px;
  }
  .links-m-avatar {
    width: 42px; height: 42px; object-fit: cover;
    border: 1.5px solid var(--border); flex-shrink: 0;
  }
  .links-m-name { font-size: 14px; font-weight: 700; }
  .links-m-btns {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 6px;
  }
  .links-m-btns .link-label { white-space: nowrap; }   /* 라벨 1줄 고정 → 일반 버튼 높이 통일(OGQ는 별도 행) */
  .links-m-ogq {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 6px;
    margin-top: 6px;
  }
  /* 표 min-width 780px + .links-wrap 좌우 패딩 48px → 뷰포트 828px 미만에서 표가 넘침. 그 지점에서 블록으로 전환 */
  /* 콘텐츠가 테이블 최소폭(780px) 밑으로 가기 전에 모바일 세로 블록으로 전환 → 가로스크롤 방지. 멤버=열이라 멤버 증가 시 테이블 min-width와 이 임계값을 함께 올려야 함(13인: 780/800) */
  @container (max-width: 800px) {   /* 표 min-width 780 + 여백 20 (빙밍 합류로 740→800 재계산) */
    .links-table-wrap { display: none; }
    .links-mobile { display: block; }
  }

  /* === 케미 탭 === */
  .chem-wrap {
    padding: 20px 24px;
    max-width: 1444px; width: 100%; margin: 0 auto;   /* 1444: 다른 기둥 탭과 같은 값(2026-09-03 Crenop — 종전엔 1444 뒤에 1400이 또 적혀 1400이 이기고 있었다) */
    flex: 1;
    display: grid; grid-template-columns: 1fr 280px;
    gap: 20px; align-items: start;
  }
  /* 칸을 비우는 규칙은 태블릿 블록(1150px)이 다른 탭들과 함께 가진다(2026-09-02 이동, 사유는 .events-wrap 쪽 주석) */
  .chem-content { container-type: inline-size; min-width: 0; }   /* 카드 열 수를 뷰포트가 아닌 이 콘텐츠 칸 폭 기준으로 판단(컨테이너 쿼리) */
  /* 케미 필터: 이벤트 .filter-panel과 동일 — 우측 사이드 sticky. 스크롤이 길어(2인+그룹) 필터 상시 노출이 이득 */
  .chem-filter-panel { position: sticky; top: calc(var(--head-h, 0px) + 20px); }
  .chem-filter-members {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    flex: 1; min-width: 0;
  }
  /* 그리드 = 섹션(라벨+카드 묶음) 세로 스택(2026-08-09 재구성: sticky 라벨을 위해 2인·모두 포함도 N인과 같은
     섹션 상자 구조로 통일). 카드 열수는 각 섹션 안의 .chem-group-grid가 컨테이너 쿼리로 판단한다. */
  .chem-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    /* 스크롤 고정(scroll anchoring) 해제(2026-08-10): '설명 보기' 토글은 카드 높이를 바꾸지 않지만(아래 실측으로 고정),
       카드 안에서 이름·설명 줄이 재배치되면 브라우저가 그 요소를 기준점으로 잡아 스크롤을 보정한다 →
       화면 위 경계에 카드가 걸쳐 있을 때만 목록이 위아래로 튀어 보였다. 문서 높이가 불변이므로 보정 자체가 불필요. */
    overflow-anchor: none;
  }
  .chem-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 14px;
    /* 내용 세로 중앙(명전 .hall-content와 동일): 높이는 아래 실측 min-height로 고정되므로
       꺼짐(짧음)·켬(긺) 어느 상태든 본문 덩어리가 카드 정중앙에 온다 — 위 붙고 아래 비는 상태 방지 */
    display: flex; flex-direction: column; justify-content: center;
  }
  .chem-name {
    font-size: 15px; font-weight: 700; line-height: 20px;   /* 15px(구 13, 2026-09-03 Crenop): 케미 이름이 카드의 주인공 — 멤버 이름(12px)보다 커야 한다 */
    text-align: center;
    color: var(--text);
  }
  /* 케미명 조각(2026-08-08): 이름마다 오버/클릭 대상. 강조는 사이트 규약대로 민트, 종류 필터 밖 이름은 흐림 */
  /* 케미명(2026-08-08 확정 체계): 설명은 상단 '설명 보기' 토글 소관 — 오버 공개·클릭 고정 전부 폐지.
     클릭은 링크 있는 이름(.has-link)에서만 동작하므로 그 이름만 손가락 커서·민트 오버. */
  .chem-name-part { transition: color 0.12s; }
  .chem-name-part.has-link { cursor: pointer; }
  .chem-name-part.has-link:hover, .chem-name-part.hl { color: var(--accent); }
  .chem-name-part.dim { opacity: 0.35; }
  .chem-name-sep { color: var(--muted); font-weight: 400; }
  /* 설명 보기 토글 ON: 좌열 케미명·우열 설명 세로 나열(2026-08-08 확정, 명전 2·3위 토글 방식 이식).
     이름 우측정렬·설명 좌측정렬로 짝을 붙인다. 설명은 한 줄 말줄임(두 줄이 되면 카드 높이가 행마다 출렁임).
     카드 높이는 아래 renderChemistry 끝의 실측(꺼짐·켬 최대)으로 종류별 고정 — 토글해도 크기 불변, 내용은 flex 중앙. */
  /* 설명 보기 토글 + 상단 바(2026-08-09 재조정): 바는 34px, sticky top:20(필터 패널과 동일 이격).
     스크롤 전에는 자연 위치(칸 최상단)라 우측 필터 패널과 같은 높이에서 시작하고, 붙었을 때만 20px 떠 있다.
     떠 있을 때 위 20px 틈으로 카드가 비치는 건 ::before 백드롭(페이지 배경색)이 차단 — 스크롤 전엔 그 자리가
     chem-wrap의 padding(20px, 원래 페이지 배경)이라 무해. margin-bottom:-34로 흐름을 밀지 않는다.
     라벨(z3)이 이 바(z2) 위로 슬라이드 인/아웃 — 라벨엔 배경이 없어 토글을 가리지 않는다. */
  .chem-toggle-sticky {
    position: sticky; top: 20px; z-index: 2;
    height: 34px; margin-bottom: -34px;
    background: var(--bg);
    display: flex; align-items: center; justify-content: flex-end;
  }
  .chem-toggle-sticky::before { content: ''; position: absolute; left: 0; right: 0; top: -20px; height: 20px; background: var(--bg); }
  .chem-bar { display: flex; align-items: center; gap: 8px; }
  /* 이름 영역(명전 메커니즘 그대로, 2026-08-08 재수정): 꺼짐(가로)·켬(2열) 두 변형을 함께 렌더해두고
     클래스(.chem-show-desc)로 전환 — 재렌더 없이 즉시 토글. 카드 높이는 렌더 뒤 두 상태를 '실측'해
     종류별 최댓값을 공통 min-height로 고정(renderChemistry 끝) — 본문 덩어리는 토글 따라 자연 이동, 카드 크기만 불변. */
  .chem-head { display: flex; justify-content: center; margin-bottom: 10px; }
  /* 켬 2열은 .chem-name 밖(형제)이라 폰트를 따로 명시해야 한다 — 빠뜨리면 body 기본(16px·400)으로 커지고 얇아짐 */
  .chem-nlist { display: none; font-size: 15px; font-weight: 700; color: var(--text); }   /* .chem-name과 같은 크기(15px) */
  .chem-grid.chem-show-desc .chem-head .chem-name:not(.chem-name-fallback):not(.chem-name-keep) { display: none; }   /* keep = 설명이 하나도 없는 카드의 이름줄 — 켬에서도 그대로(격자 전환 무의미) */
  /* ON 3열: 카드 중앙 블록(inline-grid) — [이름(우측정렬)] [아이콘 전용 칸] [설명(좌측정렬)].
     아이콘을 별도 칸으로 빼서 이름 텍스트 오른끝이 전부 같은 선에 맞는다(이름 뒤 인라인이던 2026-08-08 방식은
     아이콘 있는 이름만 왼쪽으로 밀려 정렬이 어긋났음). 아이콘 없는 행은 빈 칸이 폭만 유지.
     행높이·줄높이 19px 통일: 아이콘 유무로 줄간격이 흔들리지 않게. */
  .chem-grid.chem-show-desc .chem-nlist { display: inline-grid; grid-template-columns: auto auto auto; grid-auto-rows: 19px; gap: 3px 6px; align-items: center; }
  .chem-nlist .chem-name-part { justify-self: end; text-align: right; white-space: nowrap; line-height: 19px; }
  /* 행 래퍼(display:contents): 상자를 안 만들어 3칸이 그대로 grid에 배치되면서, 클릭·:hover는 행 전체가 한 덩어리로
     먹는다(이름·아이콘·설명 어디에 올려도 반응). 상자가 없으니 cursor·opacity는 자식에 건다. */
  .chem-nrow { display: contents; }
  .chem-nrow.has-link > * { cursor: pointer; }
  .chem-nrow.dim > * { opacity: 0.35; }
  .chem-nicon { color: var(--muted); transition: color 0.12s; justify-self: start; }
  .chem-nicon svg { width: 12px; height: 12px; display: block; }
  .chem-nrow.has-link:hover .chem-name-part, .chem-nrow.has-link:hover .chem-nicon, .chem-nrow.has-link:hover .chem-ndesc,
  .chem-nrow.hl .chem-name-part, .chem-nrow.hl .chem-nicon, .chem-nrow.hl .chem-ndesc { color: var(--accent); }
  .chem-ndesc {
    font-size: 11px; font-weight: 400; line-height: 19px; color: var(--text); opacity: 0.85;   /* 400 명시: 부모 .chem-nlist의 700 상속 차단 */
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;
  }
  /* 링크 아이콘(2026-08-08 확정): 이름 뒤 인라인 상시 표시 — 클릭 동작의 존재를 토글과 무관하게 알린다.
     구분자(·)는 별개의 것으로 그대로 유지(아이콘을 구분자로 쓰면 어느 이름 것인지 모호해진다). */
  .chem-name-link { display: inline-block; line-height: 0; margin-left: 3px; color: var(--muted); vertical-align: -1px; transition: color 0.12s; }   /* line-height:0 — 상자를 svg 12px로 잠가 줄높이(19px)를 못 키우게. 빠뜨리면 상자가 19px가 되어 아이콘 있는 카드만 꺼짐 제목이 1~2px 커지고 토글 시 하단 사진이 움직인다 */
  .chem-name-link svg { width: 12px; height: 12px; }
  .chem-name-part.has-link:hover .chem-name-link, .chem-name-part.hl .chem-name-link { color: var(--accent); }
  /* 연관 케미 도착 강조: 민트 테두리 잠깐 — transition으로 자연 소멸(제거 시 원색 복귀) */
  .chem-card { transition: border-color 0.35s, box-shadow 0.35s; }
  .chem-card.chem-flash { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  /* 종류 필터(2026-08-08): 이벤트 탭 .filter-type 재사용. 3열에 2×2 + 우측 열 빈칸, 아이콘은 전부 흰색 */
  .chem-filter-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1; min-width: 0; }
  .chem-filter-types .filter-type .filter-icon { color: var(--text); }
  .chem-body {
    display: flex; align-items: center;
    gap: 10px; justify-content: center;
    container-type: inline-size;   /* 카드 내 멤버 줄바꿈을 카드 폭 기준으로 판단 */
  }
  .chem-member {
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    min-width: 0;
  }
  .chem-member img {
    width: 48px; height: 48px;
    object-fit: cover;
    border: 1.5px solid var(--border);
  }
  .chem-member-name {
    font-size: 12px; font-weight: 700;   /* 12px(2026-09-03 Crenop: 케미 이름보다 작게 — 아침의 14는 케미 이름을 눌렀다) */
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; max-width: 60px;
    text-align: center;
  }
  .chem-arrows {
    display: flex; flex-direction: column;
    gap: 4px; align-items: center;
    flex-shrink: 0;
  }
  .chem-arrow-row {
    display: flex; align-items: center;
    gap: 4px; font-size: 12px; font-weight: 600;
    color: var(--muted);
  }
  .chem-arrow-row .chem-count { color: var(--text); font-weight: 700; }
  .chem-chat-ico { display: flex; align-items: center; }  /* 색은 보낸 멤버 고유색을 인라인으로 지정 */
  .chem-chat-ico svg { width: 12px; height: 12px; }
  .chem-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px; grid-column: 1 / -1; }
  .chem-group-section {
    grid-column: 1 / -1;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    /* 라벨 핸드오프 연속화(2026-08-09): sticky 라벨이 붙어 있는 범위 = 이 상자의 콘텐츠 박스라서,
       카드가 끝나면 다음 라벨이 도착하기 전에 먼저 밀려나갔다(섹션 사이 간격만큼 이른 이탈).
       ::after 스페이서로 콘텐츠 박스를 다음 라벨 시작점까지 연장하고 margin-bottom으로 상쇄 —
       배치는 픽셀 동일, 라벨만 들어오는 라벨에 직접 밀려나는 연속 열차가 된다.
       49 = 그리드 gap 12 + margin-top 20 + 테두리 1 + padding-top 16. 이 값들이 바뀌면 함께 갱신. */
    margin-bottom: -49px;
  }
  .chem-group-section::after { content: ''; display: block; height: 49px; }
  .chem-group-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 1px;
    /* sticky(2026-08-09): 스크롤 시 현재 섹션 라벨이 상단(여백 20px 아래 — 필터 패널과 동일 이격)에 붙고,
       다음 섹션 라벨이 올라오면 밀어내며 교체. 라벨이 카드 묶음(.chem-group-grid)과 같은 섹션 상자 안에
       있어야 붙을 구간이 생긴다(renderChemistry의 secBlock).
       높이 34px 상자에 flex 중앙 — 토글 스트립(.chem-toggle-sticky)의 바 구간과 같은 높이·같은 중앙이라
       폰트 크기가 달라도(12px 라벨·15px 트랙 제목) 토글과 세로로 어긋날 수 없다.
       배경 없음: 붙었을 땐 뒤의 백드롭 스트립이 바탕이고, 흐름 중엔 페이지 배경 그대로. */
    position: sticky; top: calc(var(--head-h, 0px) + 20px); z-index: 3;
    height: 34px; display: flex; align-items: center;
    margin-bottom: 0;
    pointer-events: none;   /* 라벨은 블록이라 폭이 그리드 전체 — 이 투명 상자(z3)가 스트립(z2) 안 토글을 덮어 클릭을 삼킨다. 라벨은 비인터랙티브라 통과시켜도 잃는 게 없다 */
  }
  /* 트랙 헤더(모두 포함·일부 포함): 하위 섹션 라벨(2인/3인 케미)보다 위계 ↑ — 더 크고 밝게 + 민트 바 */
  .chem-track-title {
    font-size: 16px;
    color: var(--text);
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chem-track-title::before {
    content: '';
    width: 3px;
    height: 15px;
    background: var(--accent);
    flex-shrink: 0;
  }
  .chem-group-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  /* 열수는 콘텐츠 칸 실제 폭 기준(컨테이너 쿼리) — 필터 사이드바(280px) 제외분에 맞춰 줄어듦. 콘텐츠 최대폭이
     ~1050px(1400-280-gap)라 4열은 가장 넓을 때만. (구: 뷰포트 @media 1100/800/500 — 사이드바 폭을 무시해
     .chem-grid의 컨테이너 쿼리와 기준이 갈렸음. 2026-08-09 전 섹션 통일하며 컨테이너 쿼리로 일원화) */
  @container (max-width: 1000px) { .chem-group-grid { grid-template-columns: repeat(3, 1fr); } }
  @container (max-width: 700px) { .chem-group-grid { grid-template-columns: repeat(2, 1fr); } }
  @container (max-width: 480px) { .chem-group-grid { grid-template-columns: 1fr; } }
  /* 높이 실측 중에만 행 늘림(stretch) 차단(2026-08-09): 그리드 기본값은 같은 행의 카드를 행 최대 높이로 늘리는데,
     그 상태로 offsetHeight를 재면 "옆 카드의 이름 행 수"가 내 몸통 높이로 오염되어(폭·열수에 따라 행 구성원이
     달라지니 기기마다 다르게) min-height가 이중 가산으로 부푼다. 측정 두 패스 동안만 이 클래스를 켠다. */
  .chem-grid.chem-measure .chem-group-grid { align-items: start; }
  .chem-group-members {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chem-group-members.large {
    display: grid;
    grid-template-columns: repeat(4, auto);
    justify-content: center;
    gap: 8px 12px;
  }
  .chem-group-members.large.cols3 { grid-template-columns: repeat(3, auto); }   /* 6인: 어떤 카드폭에서도 한 줄에 안 들어가 항상 3+3 */
  /* 4인: 카드가 4명 한 줄(≈4×40px+이름·gap)을 담으면 한 줄, 좁아지면 2+2 (3+1 방지) */
  @container (max-width: 215px) { .chem-group-members.large.n4 { grid-template-columns: repeat(2, auto); } }
  .chem-group-members .chem-member img { width: 40px; height: 40px; }

  /* === 컨텐츠 탭 === */
  .content-wrap {
    padding: 20px 24px;
    max-width: 1400px; width: 100%; margin: 0 auto;
    flex: 1;
    display: flex; flex-direction: column;
    gap: 16px;
  }
  /* ── 썸네일 탭 (2026-08-31 달력 탭 신설 · 2026-09-02 썸네일 모아보기 이관 · 2026-09-06 썸네일만 남기고 압축) ──────
     좌 = 달력 / 우 = 기둥(멤버 스트립 13 · 종류 다시보기/유튜브 · 연/월). 시트 행(컨텐츠·일정)은 이 탭에 없다(컨텐츠 탭·보조바 일정 목록 몫).
     두 폼 —
       ① PC 모드(>1150)에서 본문 폭 934px 이상(칸 130px~)이면 7열 썸네일 칸. 칸 = 대표 그림 1장 + 개수 칩.
          그림을 다 쌓지 않는 이유: 하루 여러 파트·여러 업로드면 칸 하나가 길어진다. 대표 = 고른 종류의 첫 것.
          눌렀을 때 그날 전부는 그 주 바로 아래.
       ② 그 밖(좁은 PC 창·태블릿·모바일)은 1열 목록: 행 = 날짜 · 대표 그림(작게) · 칩. 눌러야 그날 전부가 나온다 —
          폭이 남으면 오른쪽 열, 좁으면 그 행 바로 아래(지난 활동 탭의 넓으면 옆·좁으면 아래 문법).
     폭 상한을 두지 않는다(다른 탭의 1400은 그대로): 200px 칸 7열 = 1424px이라 1444 상한 아래선 어떤 화면에서도 7열이 못 섰다. */
  .cal-wrap {
    padding: 20px 24px; max-width: 1842px; width: 100%; margin: 0 auto; flex: 1;   /* 1842 = 격자 폼 상한 1450 + 본문 왼쪽 슬롯 44 + 간격 20 + 기둥 280 + 좌우 패딩 48. 묶음이 이보다 넓으면 격자는 1450에서 멈추는데
                                                                                       본문 영역은 계속 늘어나 기둥이 오른쪽 끝으로 떨어졌다(2026-09-03 Crenop: 기둥과의 간격을 다른 탭처럼 20px로). 칸 200px은 그대로 */
    display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; align-items: start;
  }
  .calendar-grid + .calendar-grid { margin-top: 4px; }
  .cal-detail { background: var(--surface2); border: 1px solid var(--border); padding: 12px; margin: 4px 0; min-width: 0; }
  /* 달력 '안'에 들어갈 때만 지난 활동의 주간 확장(.cal-week-detail)과 같은 배경·여백을 쓴다.
     오른쪽 열로 설 때는 종전 문법 그대로 — 안쪽 문법을 밖에까지 밀면 두 탭이 되레 갈린다(2026-09-01). */
  .cal-detail-week { background: var(--bg); padding: 16px; }
  .cal-di-none { color: var(--muted); font-size: 12px; text-align: center; padding: 24px 0; }
  .cal-loading { font-size: 11px; color: var(--muted); text-align: right; line-height: 14px; margin-bottom: 4px; }   /* 자료 도착 중 표시 — 자리를 잡아 두지 않아 다 오면 사라진다 */
  .cal-detail + .calendar-grid { margin-top: 4px; }   /* 상세가 끼면 '격자+격자' 규칙이 안 걸려 아래 주가 붙어 버린다 */
  /* 폼 전환 — 두 폼을 다 그려 두고 CSS가 하나만 보인다(상세 두 자리 장치와 같은 태도). 기본 = 1열 목록. */
  .cal-grid-form { display: none; max-width: 1450px; }   /* 200px 칸 ×7 + 간격 24 + .calendar 패딩 24 + 테두리 2(옛 폼 상한과 같은 값) — 본문이 더 넓어도 칸은 200에서 멈춘다 */
  .cal-list-form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  .cal-list-side { display: none; margin: 0; }
  @container (min-width: 720px) {   /* 목록 380 + 상세 320 + 간격 16 — 폭이 남으면 상세를 오른쪽 열로 */
    .cal-list-form { grid-template-columns: minmax(0, 1fr) 320px; }
    .cal-list-side { display: block; position: sticky; top: 20px; }
    .cal-detail-row { display: none; }
  }
  @media (min-width: 1151px) {   /* PC 모드에서만 7열 — 태블릿은 폭이 남아도 1열(Crenop 지정: PC=썸네일 격자 / 태블릿·모바일=1열) */
    @container (min-width: 934px) {   /* .calendar 안쪽 908 = 칸 약 126px. 1366 노트북(기둥 280 포함)에서 칸 약 132px — 피드백으로 조정하는 시작값 */
      .cal-grid-form { display: block; }
      .cal-list-form { display: none; }
    }
  }
  /* 7열 칸 — 옛 지난 활동 썸네일 폼(2026-08-29 v5) 규격: 상단 [날짜 | 칩], 아래 16:9 그림 상자.
     그림 없는 날도 상자를 예약해 행 높이가 안 흔들린다(목록 도착 전후·다시보기 없는 날 셀 크기 널뛰기 방지). */
  .cal-cell { aspect-ratio: auto; align-items: stretch; justify-content: flex-start; gap: 4px; padding: 5px; text-align: left; min-width: 0; overflow: hidden; }
  .cal-cell .cd-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 4px; width: 100%; }
  .cal-cell .cd-top .calendar-daynum { line-height: 14px; }
  .cal-cell .cd-chips { display: flex; flex-wrap: wrap; gap: 2px 6px; justify-content: flex-end; align-items: center; margin-top: 1px; min-width: 0; }
  .cal-thumb { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--surface); }
  .cal-thumb:empty { background: transparent; }   /* 빈 상자는 높이만 잡고 음영 없이(옛 폼 v5 Crenop 지정) */
  .cal-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cal-tag { display: inline-block; margin-right: 3px; color: var(--text2); }
  .cal-tag svg { width: 14px; height: 14px; vertical-align: -3px; }   /* 14px(구 12): 종류 그림 가독성(2026-09-02 Crenop) */
  /* 태그별 고유색(2026-09-02 Crenop 지정) — 달력 칸·목록·상세·일정 모달 어디서나 같은 색. 브랜드 색 출처는 응답 기록(69번).
     모르는 태그(이름표)와 롤은 위 .cal-tag 기본색(무채색) 그대로. */
  .cal-tag[data-tag="soccer"] { color: #ffffff; }
  .cal-tag[data-tag="minecraft"] .mc-handle { fill: #8B5A2B; }   /* 손잡이 = 나무 */
  .cal-tag[data-tag="minecraft"] .mc-head { fill: #4AEDD9; }     /* 날 = 다이아 */
  .cal-tag[data-tag="steam"] { color: #66C0F4; }                 /* Steam 밝은 파랑(스토어 강조색) */
  .cal-tag[data-tag="pubg"] { color: #F1AA03; }                  /* PUBG 브랜드 노랑주황 */
  .cal-tag[data-tag="overwatch"] .ow-top { fill: #F99E1A; }      /* 위 고리 = 오버워치 주황(Crenop 정정 2026-09-02) */
  .cal-tag[data-tag="overwatch"] .ow-body { fill: #ffffff; }     /* 몸통 = 하양 */
  .cal-tag[data-tag="wow"] { color: #EDE944; }                   /* WoW 노랑 */
  .cal-tag[data-tag="lol"] { color: #C89B3C; }                   /* 리그 오브 레전드 금색 */
  .cal-tag[data-tag="switch"] { color: #E60012; }                /* 닌텐도 빨강 */
  .cal-tag[data-tag="vrchat"], .cal-tag[data-tag="mocap"], .cal-tag[data-tag="fulltrack"] { color: #ffffff; }
  .cal-tag[data-tag="starcraft"] { color: #CCE1FF; }             /* 스타크래프트 — 주신 파일의 색 그대로(Crenop 지정 2026-09-04) */
  .cal-tag[data-tag="gta"] { color: #ffffff; }                   /* GTA 글자 — 하양. 로고의 테두리는 14px에서 못 살리므로 몸통만(Crenop 지정) */
  .cal-tag[data-tag="soop"] { color: #0388FF; }                  /* SOOP 파랑 — 프로필 숲 버튼(quick-soop)과 같은 값 */
  .cal-tag[data-tag="wak"] { color: #00C6A7; }
  .cal-tag[data-tag="chuntaverse"] { color: var(--accent); }
  .cal-tag[data-tag="music"] { color: var(--ev-yellow); }
  .cal-cell.has:hover { border-color: var(--accent); }
  .cal-cell.selected { border-color: var(--accent); background: var(--surface2); }
  /* 1열 목록 행 — 그림이 있는 날만. 날짜 · 대표 그림 96px · 칩 */
  .cal-rows { display: flex; flex-direction: column; gap: 6px; }
  .cal-row { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--surface); border: 1px solid var(--border); padding: 6px 8px; cursor: pointer; color: inherit; font-family: inherit; text-align: left; min-width: 0; transition: border-color 0.15s; }
  .cal-row:hover { border-color: var(--accent); }
  .cal-row.selected { border-color: var(--accent); background: var(--surface2); }
  .cal-row.today { box-shadow: inset 0 0 0 1.5px var(--time); }   /* 달력 칸의 오늘 표시(.calendar-day.today)와 같은 링 */
  .cal-row-date { flex: none; width: 88px; font-size: 12px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .cal-row-date.sun { color: #f87171; }   /* 요일색 규칙(.calendar-daynum.sun/.sat)과 같은 값 */
  .cal-row-date.sat { color: #60a5fa; }
  .cal-row-thumb { flex: none; width: 96px; aspect-ratio: 16 / 9; overflow: hidden; background: var(--surface2); }
  .cal-row-thumb:empty { background: transparent; }
  .cal-row-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cal-row-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .cal-row .cd-chips { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; min-width: 0; }
  .cal-detail-row { margin: 0; }
  /* 상세 = 그날 타일(고른 종류만). 타일은 일별 요약과 같던 200px 문법(.ds-vod). 이름줄(.cal-vod-who)은 링크 고르기 모달이 쓴다 */
  .cal-vods { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
  .cal-vod { width: 200px; }
  .cal-vod-who { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--text2); margin-bottom: 4px; }
  .cal-vod-who img { width: 18px; height: 18px; display: block; }
  /* 기둥의 종류 버튼 아이콘 색 = 그 아이콘의 사이트 배정색(2026-09-02 Crenop 지정): 숲 ∞ 파랑(--ev-start)·유튜브 빨강.
     칸의 칩도 같은 그림이라 같은 색 — 지난 활동의 .cd-chip.broadcast(숲=파랑)와 한 문법이 된다.
     글자는 통계 탭 종류 버튼과 같이 흐림→켜지면 민트(.hall-kind-btn). */
  #calKindBox .hall-kind-btn[data-kind="vod"] svg { color: var(--ev-start); }
  #calKindBox .hall-kind-btn[data-kind="youtube"] svg { color: var(--ev-youtube); }
  .cal-main .cd-chip.vod { color: var(--ev-start); }   /* 썸네일 탭의 다시보기 칩은 숲 ∞ 마크라 파랑 */
  @media (max-width: 1150px) { .cal-wrap { grid-template-columns: 1fr; } }
  /* 좁은 폭(스마트폰)에서만: 요청 목록과 순위를 같이 쌓으면 화면이 길어져 '요청 ↔ 순위' 토글로 쓴다.
     태블릿까지 걸면 폭이 남는데도 목록이 사라진다(실사고 — 순위만 보이던 화면). */
  /* 한 줄로 쌓이는 폭(≤1100)에서 순위를 켜면 '댓글 모음'만 순위로 갈린다(2026-09-01 재수정, Crenop 지정).
     묶음 머리와 그 안의 순위 버튼은 남는다 — 목록을 통째로 감췄더니 순위를 끄거나 다른 컨텐츠로 옮길
     길이 사라졌다(실사고). 순위는 머리 바로 아래에 오도록 조작부 묶음을 목록 뒤로 보낸다. */
  @media (max-width: 1100px) {
    /* 순위는 목록 안의 자리(.apply-rank-slot)에 나오고, 우측 칸은 통째로 감춘다 —
       안 골랐을 때 뜨던 '고르면 나옵니다' 상자도 이 규칙으로 같이 사라진다. */
    body .apply-side { display: none; }   /* 뒤에 오는 기본 규칙의 display:flex를 이겨야 한다(같은 특이도면 나중 선언이 이긴다) */
    .apply-rank-slot { margin: 12px; }
  }

  .content-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  @media (max-width: 1100px) { .content-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .content-grid { grid-template-columns: 1fr; } }
  .content-card {
    background: var(--surface);
    border: 1px solid var(--border);
    overflow: hidden;
    transition: border-color 0.15s, box-shadow 0.15s;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
  }
  a.content-card:hover, button.content-card:hover { border-color: var(--accent); box-shadow: 0 4px 12px rgba(97,255,236,0.12); }   /* 링크 있는 카드만 — hover 테두리=클릭 가능 문법 */
  /* 링크가 둘 이상인 카드는 버튼(고르기 모달, 2026-09-06) — <a>일 때와 같은 모양 */
  button.content-card { padding: 0; font: inherit; text-align: left; cursor: pointer; width: 100%; }
  .content-card-title .cal-tag { margin-right: 4px; }   /* 종류 그림(F열) — 일정 목록 제목 앞과 같은 그림, 카드 제목 앞 */
  .content-card-img {
    flex: 1;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--surface2);
  }
  .content-card-img img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }
  .content-card-info {
    padding: 10px 12px;
    min-height: 62px;   /* 아바타 최대 2행(20+2+20=42) + 상하 패딩 20 — 멤버 0·1·2행 무관 하단바 높이 고정(현수막 탭도 이 카드 공용) */
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .content-card-text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .content-card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .content-card-date {
    font-size: 11px;
    font-weight: 600;
    color: var(--text2);   /* 사실 값(날짜) = 2차(2026-09-04 대비 점검) */
  }
  .content-card-members {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
    flex-shrink: 0;
    justify-content: flex-end;
    max-width: 132px;
  }
  .content-card-members img {
    width: 20px; height: 20px;
    object-fit: cover;
    border: 1px solid var(--border);
  }

  /* === 현수막 탭 === */
  .banner-wrap {
    padding: 20px 24px;
    max-width: 1400px; width: 100%; margin: 0 auto;
    flex: 1;
    display: flex; flex-direction: column;
    gap: 16px;
  }
  /* === 명예의 전당 탭 === */
  /* 통계 탭 상단 — 크루 숫자 격자(통계 카드 재사용) + 멤버별 시간대 분포 */
  .hall-stats { margin-bottom: 24px; }
  .hall-heat { margin-bottom: 28px; }
  .hall-heat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 16px; }   /* 520이면 본문 폭(약 1052)에서 간격 때문에 한 열로 떨어졌다 — 두 열이 서도록 낮춘다(정사각은 고집하지 않음) */
  .hall-heat-cell { background: var(--surface); border: 1px solid var(--border); padding: 12px; min-width: 0; }
  .hall-heat-name { font-size: 14px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; row-gap: 4px; min-height: 33px; }   /* 14px·사진 28px(구 12·22 — 2026-09-02 Crenop: 작다). 통계 두 줄이 안 들어가는 좁은 카드에선 아랫줄로 내려간다.
     min-height 33 = 통계 두 줄 높이 — 통계가 없는 달·꺼진 상태에서도 줄 높이가 같다(카드 크기는 큰 쪽 기준으로 고정, 2·3위 보기와 같은 원칙 — 2026-09-02 Crenop) */
  .hall-heat-name img { width: 28px; height: 28px; flex: none; }   /* 사진+이름 — 케미·순위 화면과 같은 문법 */
  /* 격자 묶음(y축+일자 열)을 카드 가운데에 — 달마다 열 수가 달라 왼쪽 정렬이면 2월은 오른쪽이 비어 보였다(2026-09-02 Crenop).
     카드 안 히트맵은 .toh-wrap 없이 .toh-head/.toh-body만 있으므로(구 .toh-wrap 규칙은 닿는 곳이 없었다) 몸통에서 가운데 맞춤. */
  .hall-heat-cell .toh-body { justify-content: center; }
  .hall-heat-cell .toh-right { flex: 0 1 auto; }
  /* 이름 오른쪽 빈 폭에 그 달의 통계 두 줄(2026-09-02 Crenop 지정): 평균 시작·종료·시간 / 시간대·주중주말 분포 */
  .hall-heat-stats { margin-left: auto; text-align: right; font-size: 12px; font-weight: 500; color: var(--muted); line-height: 1.35; display: flex; flex-direction: column; min-width: 0; white-space: nowrap; font-variant-numeric: tabular-nums; visibility: hidden; }   /* 12px(구 11). '통계 보기' 토글이 켜졌을 때만 보이되 자리는 늘 차지한다(display가 아니라 visibility — 켜고 끌 때 카드 크기가 안 바뀐다, 2026-09-02 Crenop) */
  .hall-heat-grid.show-stats .hall-heat-stats { visibility: visible; }
  .hall-heat-stats .hl { color: #ffffff; font-weight: 700; }   /* 분포에서 가장 큰 항목과 그 숫자(시간대·주중주말 각각) — 흰색(민트는 아래 격자 색과 겹쳐 2026-09-02 Crenop이 흰색 지정) */

  .hall-main { min-width: 0; }
  .hall-kind { display: grid; gap: 6px; margin-bottom: 12px; }
  .hall-kind-btn {
    font-family: inherit; font-size: 12px; font-weight: 600;
    padding: 8px 10px; background: var(--surface2);
    border: 1.5px solid transparent; color: var(--muted);
    cursor: pointer; transition: all 0.15s; text-align: center;
  }
  .hall-kind-btn:hover { color: var(--accent); }
  .hall-kind-btn.active { border-color: var(--accent); color: var(--accent); }
  /* 명전 기간(통산·상/하반기)은 이 기둥으로 옮겨왔다 — 본문 sticky 바에 있던 시절의 규칙은 그 자리에서 죽었다 */
  .hall-kind + #hallPeriodSide .hall-period { display: grid; gap: 6px; }

  .hall-wrap {
    padding: 20px 24px;
    max-width: 1842px; width: 100%; margin: 0 auto;   /* 1842(달력 묶음과 같은 값, 2026-09-03 Crenop): 본문 1450에서 명전 4열·지표 5열(5+5+3)·시간대 3열. 1444에선 명전 3열·지표 4열(13인이 4+4+4+1)이었다.
                                                        본문 그리드는 전부 1fr로 채우므로 달력의 '고정폭 격자 옆 빈 공간' 문제는 여기선 생기지 않는다 */
    flex: 1;
    /* 좌 = 본문 / 우 = 고르는 기둥. 종전 세로 flex 선언이 뒤에 남아 이 grid를 덮고 있었다(2026-09-01 실사고 —
       같은 규칙 안에서 뒤 선언이 이긴다. 한 속성을 두 번 쓰지 말 것) */
    display: grid; grid-template-columns: minmax(0, 1fr) 280px;
    gap: 20px; align-items: start;
  }
  .hall-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  /* 2·3위 토글은 우측 기둥으로 옮겼다(2026-09-01) — 본문 sticky 바·백드롭·우측 묶음은 그 자리에서 죽었다.
     남은 것은 기둥 안 한 줄뿐이라 라벨과 최소 배치만 둔다. */
  .hall-bar { display: flex; align-items: center; gap: 8px; }
  .hall-bar-label { font-size: 13px; font-weight: 700; letter-spacing: 1px; color: var(--muted); user-select: none; }   /* .filter-title과 같은 규격 — 둘 다 '이 묶음이 무엇인가'를 말하는 층. 13px은 가독성 우선(Crenop) */
  .hall-period { display: flex; gap: 4px; flex-wrap: wrap; }
  .hall-period-btn { font-family: inherit; font-size: 12px; font-weight: 600; padding: 5px 10px; background: var(--surface2); border: 1.5px solid transparent; color: var(--muted); cursor: pointer; transition: all 0.15s; white-space: nowrap; }   /* inherit 없으면 버튼은 UA 기본 폰트라 Pretendard를 못 받는다 — 통계 탭 .stats-period-btn과 동일 처리(2026-08-10) */
  /* 문법 통일(2026-08-31): 같은 '기간 고르기'인데 여기만 평소 테두리 있음·hover=테두리·선택=배경교체라
     통계 기간 버튼과 다른 옷이었다. .stats-period-btn 문법에 맞춘다 — hover=글씨, 선택=테두리+글씨. */
  .hall-period-btn:hover { color: var(--accent); }
  .hall-period-btn.active { border-color: var(--accent); color: var(--accent); }
  .hall-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  /* 열 수는 2·3위 보기(수평형: 사진104px+순위행, 더 넓은 카드 필요) 켜진 상태 기준으로 통일 → 토글해도 열이 안 바뀜. 세로형은 같은 열수에서 카드만 더 여유 */
  @container (max-width: 1200px) { .hall-grid { grid-template-columns: repeat(3, 1fr); } }
  @container (max-width: 740px) { .hall-grid { grid-template-columns: repeat(2, 1fr); } }
  @container (max-width: 550px) { .hall-grid { grid-template-columns: 1fr; } }
  .hall-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px 14px;
    display: flex; flex-direction: column;
    gap: 10px;
  }
  .hall-cat {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 14px; font-weight: 700;
    color: var(--text); letter-spacing: 0.5px;
    text-align: center;
  }
  .hall-cat-icon { display: inline-flex; align-items: center; flex-shrink: 0; }
  .hall-cat-icon svg { width: 15px; height: 15px; display: block; }
  /* 카드 본문: 두 레이아웃 공존. 끔=세로(hall-v, 1위만), 켬=수평(hall-h, 1~3위). 토글로 전환, 높이는 JS 실측으로 통일 */
  .hall-content { display: flex; flex-direction: column; justify-content: center; }
  .hall-h { display: none; flex-direction: column; gap: 3px; padding-right: 20px; }   /* 우측 여백: 토글 ON에서 카드 간 기록 값(우측 정렬) 열을 맞추기 위해 단독·공동 모두 동일 적용 */
  .hall-h-body { display: flex; align-items: center; gap: 12px; }   /* 설명 제외 [사진 | 1·2·3행] — 사진 수직중앙이 행 블록(=2등 행) 중앙과 맞음 */
  /* show-ranks는 #hallBody에 붙는다 — 종전엔 그 요소가 .hall-wrap이기도 했으나 2026-09-01 마크업 분리로 갈렸다 */
  .show-ranks .hall-v { display: none; }
  .show-ranks .hall-h { display: flex; }
  /* 끔: 세로 (사진 + 이름 + 설명:값) — 기존의 그 화면 */
  .hall-v { display: flex; flex-direction: column; align-items: center; gap: 10px; }   /* 이름블록↔값 간격 — 실측 값 텍스트 위8px/아래17px 불균형이라 5→10으로 균형(13/12) */
  .hall-v-winners { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: flex-end; }
  .hall-v-w { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .hall-v-w img { object-fit: cover; box-sizing: border-box; border: 2px solid var(--time); }
  .hall-v-name { font-size: 13px; font-weight: 700; }
  .hall-v-val { font-size: 13px; font-weight: 700; color: var(--time); text-align: center; line-height: 1; }
  .hall-v-desc { color: var(--muted); font-weight: 600; font-size: 12px; }
  /* 켬: 수평 [좌: 1위 사진 | 우: 설명 헤더 + 금/은/동 1~3위 행] */
  .hall-photos {
    display: flex; flex-wrap: wrap; gap: 8px;
    width: 104px; flex-shrink: 0;            /* 사진 칸 고정폭: 단독 64px 또는 공동 48px 2개. 3~4명은 2줄(아래로) */
    justify-content: center; align-content: center;
  }
  .hall-photos img {
    object-fit: cover; box-sizing: border-box;
    border: 2px solid var(--time);           /* 공동 1위 = 금 테두리. 크기는 단독 64/공동 48, JS에서 인라인 지정 */
  }
  .hall-data { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .hall-desc { color: var(--muted); font-weight: 600; font-size: 12px; text-align: right; }
  .hall-row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    font-size: 13px; font-weight: 700; line-height: 18px;   /* 1.4(=18.2px 소수)면 행 피치 21.2px가 21/22px로 번갈아 라운딩 → 줄간격 비대칭(2026-08-02 스크린샷 실측). 정수 18px로 피치 21px 균일화 */
  }
  .hall-r-name { text-align: left; word-break: keep-all; }
  .hall-r-val { text-align: right; white-space: nowrap; flex-shrink: 0; }
  .hall-row.m1 .hall-r-val { color: var(--time); }
  .hall-row.m2 .hall-r-val { color: var(--text2); }
  .hall-row.m3 .hall-r-val { color: #d98e4d; }
  .hall-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px; padding: 16px 0;
  }

  /* === 구성원 탭 === */
  /* 좌=본문 / 우=고르는 기둥(2026-08-31). 이벤트·케미 필터와 같은 280px 규격을 쓴다 —
     사이트에서 '고르는 것'의 자리가 탭마다 다를 이유가 없다. */
  /* 본문과 기둥을 '한 덩어리'로 보고 그 덩어리를 가운데 정렬한다(2026-09-01 재수정).
     최근 이벤트·케미(.events-wrap)가 쓰던 문법으로 통일 — Crenop 지정.
     [왜 뒤집었나] 종전에는 묶음이 화면 폭을 다 쓰고 본문만 그 안에서 가운데였다. 그러면 기둥 안쪽의
     좌우 44px 빈 슬롯이 화면 오른쪽 여백에 그대로 얹혀 오른쪽 68px : 왼쪽 24px이 되고,
     본문이 왼쪽으로 쏠려 보인다(프로필 탭에서 특히 반복 지적됨). */
  .members-wrap, .stats-wrap {
    padding: 20px 24px;
    max-width: 1444px; width: 100%; margin: 0 auto;
    flex: 1;
    display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; align-items: start;
  }
  /* ── 우측 기둥 공통 문법(2026-09-01) ─────────────────────────────────────────
     감싸는 테두리를 두지 않는다: 묶음마다 좌우에 비는 슬롯(모두 해제 자리·연도 화살표 자리)이 있어서
     테두리를 두르면 그 여백이 '박스 안의 빈 곳'으로 도드라진다. 대신 최근 활동 탭 필터처럼 구분선으로 나눈다.
     칸 규격: 좌우 슬롯 38px + 간격 6px = 양쪽 44px을 비우고 남은 폭을 3열로 나눈다 → 어느 묶음이든 같은 칸.
       · 필터   : 왼쪽 = 모두 해제 / 오른쪽 = 빈칸
       · 스트립 : 양쪽 빈칸
       · 연·월  : 왼쪽·오른쪽 = 연도 화살표 */
  .side-pick { position: sticky; top: calc(var(--head-h, 0px) + 20px); min-width: 0; }
  /* 본문은 남은 폭 안에서 가운데 — 기둥이 오른쪽에 붙어도 본문이 치우쳐 보이지 않게 */
  /* 본문 왼쪽에 기둥의 빈 슬롯과 같은 44px을 둔다(2026-09-01, Crenop 지정).
     기둥 오른쪽 44px이 사실상 여백이므로, 왼쪽에 같은 값을 넣어야 덩어리 전체가 좌우 대칭으로 선다. */
  .members-wrap > #membersBody, .stats-wrap > #statsBody, .hall-main, .cal-main, .disco-main { width: 100%; min-width: 0; padding-left: 44px; }   /* 폭 상한은 묶음(.〜-wrap)이 갖는다 — 여기서 또 조이면 본문만 안쪽으로 밀린다 */
  /* 묶음 사이 = 여백 하나(20px)(2026-09-02 Crenop 지정). 구 '여백 20 + 구분선 1 + 여백 20'은 높이가 모자란 화면에서 기둥이 넘쳤다. */
  .side-pick > * + *, .side-pick .side-stack > * + * { margin-top: 20px; }
  /* .side-stack: 한 자리에서 내용을 갈아끼우는 묶음(#hallPeriodSide)도 안쪽 칸을 같은 간격으로 나눈다.
     종전엔 직계 자식만 걸려 2·3위 토글과 기간 버튼이 간격 0으로 붙어 있었다(반복 지적된 자리). */
  .side-pick .hall-bar { justify-content: flex-start; gap: 10px; margin-left: 44px; }   /* 위아래 버튼 묶음과 같은 왼쪽 기준 */
  .side-pick .filter-title { margin-left: 44px; }
  .members-tabs-wrap, .stats-tabs-wrap, .hall-kind, #hallPeriodSide .hall-period { margin: 0 44px; }
  .hall-kind, #hallPeriodSide .hall-period { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  /* 지난 활동 기둥의 기간 버튼과 같은 값(2026-09-02 Crenop 지적) — 칸이 60×60으로 똑같은데 여기만 10~11px이라
     한 사이트에서 같은 역할의 버튼이 작아 보였다. 둘 다 12px로 맞춘다. */
  .hall-period-btn .pb-y { font-size: 12px; opacity: 0.85; }
  .hall-period-btn .pb-m { font-size: 12px; font-weight: 700; }
  .hall-kind-btn, #hallPeriodSide .hall-period-btn {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2px; white-space: normal; text-align: center; font-size: 12px;
  }
  /* 줄 간격은 지난 활동 기간 버튼(.stats-period-btn)과 같은 값(2026-09-02 Crenop 지적) — 같은 두 줄 표기인데
     여기만 gap 4px·line-height 1.2라 '26년 / 상반기' 사이가 '26년 / 1월'보다 벌어져 보였다. */
  /* 아래 2px 보정: 한글은 라인박스 아래 여백을 안 써서 가운데정렬만으론 글자가 위로 뜬다(.page-title-link의 6/4와 같은 사유·같은 처방).
     글자만 있는 버튼에만 준다 — 아이콘이 위를 채우는 종류 버튼에 같이 주면 되레 아래로 처진다(2026-09-02 픽셀 실측으로 확인). */
  #hallPeriodSide .hall-period-btn { gap: 1px; line-height: 1.15; padding: 3px 2px 1px; }
  .hall-kind-btn { gap: 4px; line-height: 1.2; }   /* 아이콘과 글자 사이는 넓은 쪽을 유지 — 글자끼리가 아니다 */
  .hall-kind-btn svg { width: 16px; height: 16px; display: block; }
  .members-tabs-wrap {
    display: grid;
    grid-template-columns: repeat(3, 1fr);   /* 우측 기둥 규격 — 이벤트 필터(3열)와 같은 칸.
       종전 14열 가로 스트립은 본문 위에 눕혀 있을 때의 배치였다(2026-08-31 기둥 이전). */
    gap: 6px;
  }

  .members-tab {
    position: relative;
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1.5px solid transparent;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.15s;
    padding: 0;
    font-family: inherit;
    box-sizing: border-box;
  }
  .members-tab img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: opacity 0.15s, filter 0.15s;
  }
  .members-tab:not(.active) img { opacity: 0.25; filter: grayscale(1); }
  .members-tab:not(.active) { border-color: transparent; }
  .members-tab.active { border-color: var(--accent); }
  .members-tab:hover { border-color: var(--accent); }
  .members-tab-crew {
    position: relative;
  }
  .members-tab-crew img {
    width: 100%; height: 100%;
    object-fit: contain;
  }

  .members-crew {
    display: flex; gap: 16px;
    align-items: stretch;
  }
  /* 우측 활동/연혁 패널이 좁아져 가독성 무너지기 전에 세로 스택 — 콘텐츠 900px 밑(활동 패널 ~340px 밑)에서 전환(뷰포트 아닌 실제 폭 기준) */
  @container (max-width: 900px) {
    .members-crew { flex-direction: column; }
    .members-crew-intro, .members-crew-activities { flex: none; }
  }
  /* 비율 1.6:1 (2026-08-07, 구 2.4:1) — 근거는 우측이 필요한 폭이다.
     연혁의 현재 최장 줄이 327px인데 구 비율에선 안쪽 폭이 330px으로 여유가 3px뿐이었고,
     반대로 좌측은 소개문 최장 줄 604px에 842px을 쓰고 있었다(238px을 못 씀).
     1.6:1이면 우측 446px(여유 35%)·좌측 732px(여유 128px)로 양쪽이 다 맞는다.
     ※ 구 max-width:720px(소개문)은 제거했다 — 소개문은 세 줄이 <br>로 고정돼 최장 604px이라
       720이든 800이든 접히지 않았다. 실효 상한은 604px이고 문구는 이 파일에서만 바뀐다. */
  .members-crew-intro {
    flex: 2.2; min-width: 0;   /* 소개글 마지막 줄이 한 줄에 들어가도록 폭을 더 준다(2026-09-01) */
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 28px 32px;
    text-align: center;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  /* 로고가 남는 세로 공간을 먹는다(2026-08-07).
     [배경] 두 패널은 stretch라 높이가 같은데, 우측 연혁은 계속 늘고 좌측은 고정이다.
       구 방식(max-width 380 고정)은 늘어난 높이를 전부 위아래 여백으로 흘려보내, 연혁이 길어질수록
       좌측이 비어 보였다. flex-basis를 0으로 두면 로고 상자가 '남는 높이'만 받고,
       object-fit: contain이 가로세로비를 지킨 채 그 높이에 맞춰 로고를 키운다.
     [지금 크기] 좌우 자연 높이가 거의 같은 현재는 남는 높이 ≈ 기존 로고 높이라 보이는 크기가 사실상 그대로다.
     [상한] 560px — 연혁이 아주 길어져도 로고가 무한정 커지지 않게 하는 천장. */
  .members-crew-intro-img {
    flex: 1 1 0; min-height: 0;
    object-fit: contain;
    max-width: 560px;
    width: 100%;
    margin: 0 auto 32px;
    display: block;
  }
  /* 세로 스택 구간의 로고 복구(2026-08-10) — 반드시 위 base 규칙 '뒤'에 와야 한다(둘 다 클래스 1개라 뒤에 온 쪽이 이김).
     [증상] 모바일에서 로고가 안 보이고 설명문 위 여백만 남음.
     [원인] 세로 스택에선 높이를 맞출 상대 패널이 없어 좌측 높이가 내용 기준으로 정해진다 → 위 flex:1 1 0(기본 높이 0,
       남는 높이만 받기)이 받을 여유가 구조적으로 0 → 로고 높이 0(min-height:0이 최소 크기 보호까지 해제).
     [수정] 이 구간만 basis를 auto로 되돌려 원본 비율대로 표시. 폭 규칙(width:100%·max-width:560px)은 그대로 상속. */
  @container (max-width: 900px) {
    .members-crew-intro-img { flex: none; }
  }
  .members-crew-intro p {
    font-size: 14px; color: var(--muted);
    line-height: 1.8;
    margin: 0 auto; word-break: keep-all;
  }
  /* 글 묶음은 가운데(2026-09-01, Crenop 지정) — 본문이 왼쪽으로 쏠려 보이던 인상의 한 축.
     각 줄 안의 글자는 좌측정렬 그대로 두고, 줄들이 이루는 덩어리만 가운데 세운다. */
  .members-crew-activities {
    flex: 1; min-width: 0; align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 22px 24px;
    display: flex; flex-direction: column;
  }
  /* 소제목(크루 연혁 구획 + 영상 목록 제목 공용). 2026-08-10 개편: 구 12px/700/자간1.5는 제목이 자기 본문(연혁 14px·설명 15px)보다
     작아 위계가 뒤집혀 있었고, 그 존재감을 굵기·넓은 자간으로 메우다 보니 작은 한글이 뭉쳐 보였다.
     크기를 본문에 맞추고 굵기·자간을 낮춰 구분은 색(accent)과 600이 담당. 자간 1.5는 영문 대문자 라벨용 값이라 한글엔 과했다. */
  .crew-act-sub {
    font-size: 14px; font-weight: 600; color: var(--accent);
    letter-spacing: 0; margin: 16px 0 10px;   /* 아래 여백 7→10: 글자가 커진 만큼 제목-목록 간격 재조정 */
  }
  .crew-act-sub:first-child { margin-top: 0; }
  /* 프로필 하단 영상 스트립. 폭(max-width)은 인라인으로 호출부가 준다 — 크루 1300 / 멤버 1000으로 위 블록과 좌우를 맞춘다. */
  .video-strip-section { margin: 20px auto 0; }
  /* 컨텐츠 신청 — 좌: 요청 목록 / 우: 컨텐츠 버튼 + 그 컨텐츠의 순위.
     좌우를 반씩 나눈다 — 둘 다 읽는 내용이라 한쪽을 좁은 기둥으로 밀 이유가 없다. */
  .apply-wrap {
    padding: 20px 24px; max-width: 1400px; width: 100%; margin: 0 auto; flex: 1;
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start;   /* 요청 목록과 순위는 둘 다 본문 — 한쪽을 기둥 취급하지 않는다 */
  }
  .apply-main { background: var(--surface); border: 1px solid var(--border); min-width: 0; }
  .apply-side { position: sticky; top: calc(var(--head-h, 0px) + 20px); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  /* 묶음 머리 우측의 순위 버튼 — 그 글의 집계가 시트에 있을 때만 나온다 */
  .lrg-rank-btn {
    display: inline-flex; align-items: center; gap: 4px; flex: none; margin-left: auto;
    padding: 5px 12px; font-family: inherit; font-size: 12px; font-weight: 600;
    background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    cursor: pointer; transition: color 0.15s, border-color 0.15s;
  }
  .lrg-rank-btn:hover { border-color: var(--accent); }   /* 테두리가 있는 요소 → 테두리색 (상호작용 신호 규칙 ①) */
  .lrg-rank-btn.on { border-color: var(--accent); color: var(--accent); }
  .lrg-rank-btn svg { width: 14px; height: 14px; display: block; }
  .lrg-head { display: flex; align-items: center; gap: 8px; }
  .apply-rank { background: var(--surface); border: 1px solid var(--border); padding: 12px; min-width: 0; }
  @media (max-width: 1100px) {
    /* 순위·버튼은 조작부라 위로 — 요청 목록이 길어 아래에 두면 스크롤로 내려가야 닿는다.
       필터가 아니므로 우측 서랍으로 보내지 않는다(서랍은 걸러내기 전용). */
    .apply-wrap { grid-template-columns: 1fr; }
    .apply-side { position: static; order: -1; }

  }

  /* 디스코그래피 — 멤버별 묶음. 스트립 자체는 프로필에서 쓰던 것을 그대로 쓴다(문법 통일) */
  /* 좌 = 본문(줄 상한 1200) / 우 = 기둥 280(2026-09-06 기둥 신설 — 썸네일·지난 활동과 같은 두 열 문법). 1548 = 1200 + 왼쪽 슬롯 44 + 간격 20 + 기둥 280 + 좌우 패딩 48 */
  .disco-wrap { padding: 20px 24px; max-width: 1548px; width: 100%; margin: 0 auto; flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; align-items: start; }
  @media (max-width: 1150px) { .disco-wrap { grid-template-columns: 1fr; } }
  /* 플레이리스트 버튼(2026-09-02): 종전 상단바 시트 버튼으로 제공하던 것을 음악 탭 우상단 붙박이로 옮겼다.
     생김새는 시트 버튼(.tb-sheet-btn) 그대로 — 자리만 바뀌었지 같은 것이라 옷을 갈아입힐 이유가 없다. */
  .disco-head { display: flex; justify-content: flex-end; max-width: 1200px; margin: 0 auto 16px; }   /* 곡이 하나도 없을 때만 쓰는 홀로 선 버튼 자리(폭·가운데정렬은 멤버 이름과 같은 값) */
  .disco-member-name .disco-playlist { margin-left: auto; }   /* 첫 이름 행의 오른쪽 끝 — 이름 줄과 같은 행(2026-09-02 Crenop 지정) */
  .disco-member + .disco-member { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--border); }
  .disco-member-name {
    display: flex; align-items: center; gap: 10px;
    font-size: 16px; font-weight: 700; color: var(--text);
    margin: 0 auto; max-width: 1200px;
  }
  .disco-member-name img { width: 32px; height: 32px; object-fit: cover; flex: none; }
  .disco-member-id { display: inline-flex; align-items: center; gap: 10px; padding: 2px 8px 2px 2px; margin: -2px -8px -2px -2px; }   /* 최애 도착 강조가 이름(사진+글자)만 감싸게 — 이름줄 전체는 폭이 넓어 어색했다(2026-09-04 Crenop) */
  .disco-member .video-strip-section { margin-top: 12px; }
  /* 화살표를 absolute로 띄워 스트립 폭 바깥에 세운다 — flex 형제로 두면 등장/퇴장할 때마다
     스크롤 영역 폭이 변해 타일이 흔들린다. 이제 .vs-scroll은 항상 온전한 폭을 쓴다. */
  .vs-row { position: relative; }
  /* 스크롤바는 감춘다 — 사이트에 가로 스크롤바 관례가 없고, 늘 넘치는 목록이라 상시 노출이 지저분하다. 대신 화살표가 신호다. */
  .vs-scroll {
    display: flex; gap: 10px; overflow-x: auto; scroll-behavior: smooth;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .vs-scroll::-webkit-scrollbar { display: none; }
  .vs-tile { width: 200px; flex: 0 0 200px; text-decoration: none; color: inherit; }
  .vs-thumb {
    aspect-ratio: 16 / 9; background: var(--bg);
    border: 1px solid var(--border); overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .vs-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 대체 이미지는 아바타라 16:9에 cover로 넣으면 잘린다 → 오프라인 카드와 같은 처리(contain + 흐리게).
     '영상 그림이 아니라 자리 채움'이 바로 읽힌다. */
  .vs-thumb img.ph { object-fit: contain; opacity: 0.4; }
  .vs-tile:hover .vs-thumb { border-color: var(--accent); }
  .vs-title {
    margin-top: 6px; font-size: 12px; line-height: 1.4; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  /* 폭 바깥에 선다. 22px + 오프셋 22px는 .members-wrap의 좌우 패딩(24px) 안에 들어가므로
     섹션이 컨테이너를 꽉 채워 여백이 0인 폭에서도 페이지 가로 넘침이 없다.
     세로는 썸네일(200px의 16:9) 한가운데 — 제목 두 줄까지 포함한 타일 전체 기준이 아니다. */
  .vs-arrow {
    position: absolute; top: calc((200px * 9 / 16 - 60px) / 2);
    width: 22px; height: 60px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;   /* 텍스트 ‹›→SVG 전환(2026-08-08)에 맞춘 중앙 정렬 */
  }
  .vs-arrow svg { width: 15px; height: 15px; }
  .vs-arrow[hidden] { display: none; }
  .vs-prev { left: -22px; }
  .vs-next { right: -22px; }
  .vs-arrow:hover { border-color: var(--accent); }   /* 테두리가 있는 요소이므로 테두리색만 — 둘 다 바꾸던 사이트 유일 예외 제거(2026-08-31) */
  /* 700px 이하에서 .members-wrap 패딩이 16px로 줄어 22px 버튼을 못 받는다. 그 폭은 터치가 주라
     스와이프로 넘기면 되므로 화살표를 아예 숨긴다(컨테이너 900 ≈ 뷰포트 948 — 패딩 24px 구간 안). */
  @container (max-width: 900px) { .vs-arrow { display: none; } }
  .crew-act-body { width: 100%; max-width: 760px; }   /* 글줄 길이 상한 — 넓은 화면에서 한 줄이 지나치게 길어지지 않게 */
  .crew-act-li {
    display: flex; gap: 9px;
    font-size: 14px; color: var(--text3);
    line-height: 1.5; padding: 4px 0;
  }
  .crew-act-li .dot { color: var(--accent); flex: none; }
  .crew-act-li .d { color: var(--text2); font-weight: 700; }
  .crew-act-li .tag { color: var(--muted); font-size: 12px; }
  /* 컨텐츠 모아보기 링크 행(E열 검색어 보유 행): [data-mi] 행 처방 그대로 — 평상시 무장식, hover에서 surface2 + 민트 인셋 링.
     상시 표지는 무채색 link SVG 하나. */
  .crew-act-link {
    display: inline-flex; align-items: center; gap: 7px;
    font: inherit; line-height: inherit; text-align: left;
    color: inherit; cursor: pointer;
    background: none; border: none;
    padding: 2px 6px; margin: -2px -6px;   /* hover 링이 글자를 살짝 감싸도록 — 음수 마진으로 행 리듬은 그대로([data-mi] 기법) */
    transition: background 0.15s, box-shadow 0.15s;
  }
  .crew-act-link:hover { background: var(--surface2); box-shadow: inset 0 0 0 1px var(--accent); }
  .crew-act-link svg { width: 12px; height: 12px; flex: none; color: var(--muted); }   /* 행 내 인라인 아이콘은 무채색 — 시계 아이콘 규약(2026-07-17)과 통일 */
  /* 모아보기 모달: 폭은 그래프 모달과 동급(740px — 2열이 컨텐츠 탭 카드 크기에 근접), 카드는 컨텐츠 탭 재사용 */
  .lr-panel.cc-modal { max-width: 740px; }
  .cc-collect-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
  /* 1열 전환 700px — 탭(600px)보다 엄격: 모달은 오버레이 패딩 40 + 패널 테두리 2만큼 좁고, 모바일은 hover 불가라 말줄임 제목을 펼칠 수단이 없다(2026-08-24) */
  @media (max-width: 700px) { .cc-collect-grid { grid-template-columns: 1fr; } }
  .cc-collect-empty { color: var(--muted); font-size: 14px; text-align: center; padding: 28px 12px; }

  .members-profile {

    /* max-width 폐지(2026-09-01): 우측 기둥이 생긴 뒤로는 본문 칸이 이미 폭을 정한다 — 여기서 또 줄이면
       크루 소개(1300)와 멤버 소개(1000)의 폭이 갈려 한쪽만 기둥에서 멀어진다. */
  }
  .members-profile-photo {

  }
  @container (max-width: 640px) {   /* 통계 멤버탭과 동일 방식: 정보컬럼이 좁아지기 전에 1열 스택(좌300+gap+우~300 기준) */

  /* 직함 명패(2026-08-24, V2·높이22): 인라인 박스 바닥이 베이스라인에 앉아 잉크중심 base+11px(기하 중앙).
     이름 22px 잉크중심은 base+7.5~7.9px(문모모 7.54·임하밍 7.81 실측) → -3.3px 강하가 미니맥스(잔차 ±0.15px대 — 이름 잉크 높이 차의 물리 한계).
     좁은 화면에서 이름 옆이 모자라면 명패가 이름 아래 줄로 내려앉는다(인라인 랩 — 의도된 동작). 실기기에서 어긋나면 이 값만 조정 */
  .members-profile-title { display: inline-block; margin-left: 10px; vertical-align: -3.3px; }
  .members-profile-eng {

  @container (max-width: 520px) { .members-profile-quick { display: grid; grid-template-columns: repeat(2, auto); } }   /* 정보 컬럼 ≤520px면(폰/태블릿 2단 무관) 이름 우측 버튼 2×2 */

  .members-info-label {

  .members-info-row[data-mi], .members-info-row-full[data-mi] {

  /* 프로필/통계 상단 셀렉터: 1행(14칸, max-width 980 공통)이 폭 좁아지면 버튼이 작아짐. 메인 사이드바가 상단으로 가는 700px보다 앞서, 1100px부터 2행으로 전환(버튼 크게 유지). 멤버/통계=크루(일반 크기)+13을 7열 2행(줄바꿈: 카푸|캬앙) */
  @media (max-width: 1100px) {
    /* 폭맞춤 포기(2026-08-31): 7열이 남은 폭을 꽉 채우려 해서, 1100px 직전(타일 54px)에서 접히는 순간
       타일이 114px로 뛰어 넓은 PC(63px)보다 커졌다 — 화면이 좁아졌는데 버튼이 커지는 역전.
       496 = 7×63.14(PC 타일) + 6×6(간격) + 16(패딩) + 2(테두리). 여기서 멈추고 더 좁아지면 같이 줄어든다.
       PC 타일 값이 바뀌면(14열·max-width 980·gap 6) 이 496도 다시 계산할 것. */
  
    /* 크루/통합 버튼 2행 스팬 제거(2026-08-02): 12인 시절엔 스팬+12명이 7×2로 맞아떨어졌으나
       13인부턴 스팬이 마지막 1명을 3행으로 밀어냄 → 일반 크기 14타일 = 정확히 7×2 */
    /* 연/월 폭 분기 폐지(2026-08-31): 우측 기둥으로 옮겨 폭이 항상 280px이라 갈릴 이유가 없다 */
  }

  /* 상단바 우측 갱신정보: 좁은 폭에선 '주기 · 시각'을 2줄로 분리(주기/시각/비공식문구=3줄). 넓으면 스팬 inline이라 1줄 유지.
     900px: 가이드 버튼 추가로 701~900px 구간에서 갱신줄이 말줄임(…)되던 것 → 모바일과 동일한 분리로 해소 */
  @media (max-width: 900px) {

    /* 미리 잡아둔 두 줄 높이는 한 줄일 때 그대로 빈칸이 됐다(철회). 대신 시각 숫자를 등폭으로 고정해
       초가 바뀔 때 폭이 흔들리지 않게 한다 — 줄바꿈이 오락가락하지 않으면 높이도 안 움직인다. */

  /* ══ 세로형 배치(≤1150px) ═══════════════════════════════════════════════════
     상단 띠(로고 가운데 + 문구)는 그대로 두고, 탭 목록만 왼쪽 기둥으로 내린다.
     태블릿(701~1150) = 그 기둥이 상시 보이며 본문을 밀어낸다.
     모바일(≤700)     = 같은 기둥이 화면 밖으로 나가 ☰로 여는 서랍이 된다.
     즉 두 모드는 '기둥이 밀어내느냐 덮느냐'만 다르고 나머지는 같다. 기둥 폭은 --drawer-w 하나로 묶는다.
     띠 높이는 문구 줄바꿈에 따라 달라져 JS가 --strip-h에 실측값을 넣는다(고정값이면 기둥이 띠를 덮거나 뜬다). */
  @media (max-width: 1150px) {
    /* 상단바 모달: PC처럼 중앙 + 내부 스크롤 유지. 헤더(X)가 고정돼야 내용 스크롤 중에도 닫기 가능 */
