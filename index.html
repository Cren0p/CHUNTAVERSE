<!DOCTYPE html>
<!-- ══════════════════════════════════════════════════════════════════════════════════
     아이콘(SVG)은 전부 SVG_ICONS 한 표에 모은다. 마크업에 직접 박지 말 것.
     찾기: 스크립트에서 `const SVG_ICONS = {` — 새 아이콘은 그 표에 추가하고 마크업은 비운 뒤
     아래쪽 아이콘 주입 블록(`const map = { nav...Icon: SVG_ICONS.xxx }`)에 id를 등록한다.
     규격도 표의 기존 항목에 맞춘다: viewBox 0 0 24 24 · width/height 16 · stroke-width 2 · round.
     (직접 박아 넣으면 다음 사람이 표에서 못 찾고, 규격이 제각각이 된다 — 반복된 실수라 여기 못박음)
     ══════════════════════════════════════════════════════════════════════════════════ -->

<!-- Pretendard Variable: 다이내믹 서브셋(화면에 쓰인 글자의 woff2만 로드) — 기기별 시스템 한글폰트 메트릭 차이(배지 세로정렬 등) 제거 목적. CDN 장애 시 아래 스택의 시스템 폰트로 폴백(font-display: swap). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root {
    --tag-valign: -6px;      /* 타임라인 모드 배지(19px SVG) 줄 정렬 — 배지 박스 중심을 제목(400·12px) 잉크 중심에. calibrateBadgeValign() 실측 주입, 폴백은 정적 근사 */
    --daytag-valign: -5.5px; /* 통계 일별 모드 배지 줄 정렬 — 제목(600·13px) 문맥. 상동 */
    --bg: #070a14;
    --surface: #0d1120;
    --surface2: #131929;
    --border: #1e2740;
    --live: #ff3b3b;
    --live-glow: rgba(255,59,59,0.25);
    --accent: #61FFEC;
    /* 무채색 텍스트 4계층 — '덜 중요할수록 어둡게'. 새 화면은 이 표에서 골라 쓴다(색값 직접 기입 금지).
       1차 --text  : 제목·이름·수치 등 그 화면의 주된 값
       2차 --text2 : 본문에 딸린 강조 보조 — 괄호 안 대상, 소제목, 날짜
       3차 --text3 : 읽는 보조 텍스트 — 방송 제목, 채팅 메시지, 이벤트 상세
       4차 --muted : 스캔용 메타 — 시각, 개수, 라벨, 비활성
       --muted는 2026-08-31 #64748b → #7c8aa3 상향(어두운 배경 대비 3.95 → 5.39, 본문 판독 기준 4.5 미달 해소).
       3·4차 간격이 1.36배로 좁지만 두 층은 항상 글자 크기 차(10~11px vs 12px)를 동반하므로 유지 가능. */
    --text: #e2e8f0;
    --text2: #cbd5e1;
    --text3: #94a3b8;
    --muted: #7c8aa3;
    --rk-in: #34d399;    /* 좋아요 순위 — 컷 위(안정권) */
    --rk-out: #f87171;
    --rk-cut: #fb923c;              /* 컷 경계 — 탈락(빨강)과 구분되는 주황. '기준선'이지 '결과'가 아니므로 색을 나눈다 */
    --rk-cut-line: rgba(251,146,60,0.5);     /* 경계선은 글자보다 옅게 — 값이 아니라 기준선이라는 신호 */   /* 좋아요 순위 — 컷 아래. 모달 배경(#0d1120) 대비 6.79로 묻히지 않는 빨강(사이트 빨간점과 동일 색) */
    --time: #fbbf24;
    --ev-start: #60a5fa;
    --ev-end: #f87171;
    --ev-yellow: #fbbf24;
    --ev-post: #34d399;
    --ev-youtube: #ef4444;
    --ev-unread: #61FFEC;
    --mode-adult: #f87171;
    --mode-subscription: #f59e0b;
    --mode-copyright: #38bdf8;
    --mode-password: #cbd5e1;
    --mode-restricted: #a78bfa;
    --filter-post: #2EF5E1;
    --drawer-w: 300px;   /* 세로형에서 탭 기둥 폭 — 태블릿은 이만큼 본문을 밀고, 모바일은 이만큼 덮는다 */
    --tab-w: 64px;      /* 탭 한 칸 폭 — 상단바와 보조바가 공유(칸 정렬의 단일 소스).
                           가장 긴 라벨은 '최근 활동·지난 활동·관련 링크' = 글자 4 + 공백 1.
                           4×12 + 공백 약 3 + 좌우 여백 12 ≈ 63 → 64. 라벨이 길어지면 이 값과 전환점을 함께 다시 잡을 것. */
    --nav-row-h: 40px;  /* 드로어 한 행 높이 — 탭과 부속이 같은 행에 서려면 두 쪽이 같은 값을 써야 한다 */
  }
  /* 대비 접근성(2026-09-04 Crenop): 운영체제 '고대비'를 켠 사람에게만 4차 글자색을 한 단계 밝힌다 — 기본 화면은 그대로.
     --muted #7c8aa3은 바탕 대비 5.0~5.7:1(기준 4.5 통과, 여유 적음) → #9aa8bf는 7.3~8.2:1. 대비 감도가 떨어진 사용자(망막색소변성·백내장 등)를 위한 것 */
  @media (prefers-contrast: more) { :root { --muted: #9aa8bf; } }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 전역 미니멀 스크롤바 (초미니 6px·거의 안 보이다 hover 시 진해짐). webkit=Edge/Chrome/Safari, scrollbar-*=Firefox */
  * { scrollbar-width: thin; scrollbar-color: rgba(226,232,240,0.14) transparent; }
  *::-webkit-scrollbar { width: 6px; height: 6px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: rgba(226,232,240,0.14); }   /* 각진 정책 정합: 썸도 사각(원형은 상태 점에만 허용) */
  *::-webkit-scrollbar-thumb:hover { background: rgba(226,232,240,0.3); }
  /* ── 상호작용 신호 규칙(2026-08-31 확정) — 새 요소를 만들 때 아래 넷 중 하나를 고른다 ──
     ① 테두리가 있는 요소            → :hover에서 border-color를 --accent로
     ② 테두리가 없는 글자·아이콘 링크 → :hover에서 color를 --accent로
     ③ 테두리가 없는데 줄 전체를 누르는 행 → background: --surface2 + box-shadow: inset 0 0 0 1px --accent
        (테두리를 새로 만들면 요소가 2px 커져 아래 줄이 전부 밀린다 — inset 그림자는 크기를 안 바꾼다)
     ④ 선택(.active) 표시는 hover와 반드시 다른 신호를 쓴다. 같으면 마우스를 올린 동안 어느 쪽이
        선택된 것인지 구별이 사라진다.
     기간 버튼류 표준형 = .stats-period-btn (테두리 투명 / hover=글씨 / 선택=테두리+글씨). */

  /* 키보드 포커스 표시(2026-08-31) — hover의 민트 신호를 Tab 이동에도 준다.
     :focus-visible라 마우스 클릭에는 안 뜬다(키보드로 들어왔을 때만). border가 아니라 outline인 이유:
     ① .nav-item은 border-left를 활성 탭 표시로 이미 쓰고 있어 테두리가 겹친다 ② .lr-close는 테두리가 없다
     ③ outline은 레이아웃 공간을 차지하지 않아 포커스가 들어와도 주변이 밀리지 않는다(위치 고정 원칙).

     기본을 '안쪽'으로 뒤집은 이유(2026-08-31): 바깥 링은 요소 밖 4px(offset 2 + 굵기 2)에 그려져
     ㉠ 잘라내는 부모(overflow — overflow-x:auto만 줘도 세로축까지 잘린다) ㉡ 위에 덮이는 sticky 백드롭
     (::before)에 지워진다. 실제로 명전 기간버튼(.hall-bar 여백 0)·프로필 영상 스트립(.vs-scroll)·
     모달 본문(.lr-body)에서 링이 사라졌다. 안 잘린 자리들은 안쪽 여백(이벤트 헤더바 8px, 케미 토글바 7px,
     링크 표 6/8px)이 있어 우연히 살아남은 것이라, 나중에 그 여백을 줄이면 조용히 재발한다.
     안쪽 링은 요소 자기 박스 안에 그려져 부모도 형제도 건드리지 못한다 — 여백과 무관해진다.
     바깥이 필요한 예외는 아래 한 줄에만 둔다. 늘릴 때는 '안쪽이 왜 안 맞는지'를 그 자리에 함께 적을 것. */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  /* 예외: 36×20 토글은 안쪽 링이 손잡이(::after)와 겹친다. 부모에 잘라내기·백드롭이 없어 바깥이 안전. */
  .notify-switch:focus-visible { outline-offset: 2px; }
  html, body { min-height: 100vh; }
  html { scrollbar-gutter: stable; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard Variable', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;   /* 2026-08-31 개편: 세로 사이드바 → 가로 상단바. 모바일에서만 좌측 드로어로 돌아간다 */
    min-height: 100vh;
    /* 어절 단위 줄바꿈(2026-08-06 전역화). 한글 기본값은 음절 단위로 끊겨 '…함께하실 분 / 을 구합니다'처럼
       낱말이 쪼개진다. 그동안 .hall-r-name·.members-crew-intro 등 5곳에 개별로 붙여 왔는데, 새 화면을
       만들 때마다 빠뜨렸다(좋아요 요청 카드가 그 예) — 상속되는 속성이니 뿌리에서 한 번 건다.
       overflow-wrap을 같이 두는 이유: keep-all만 걸면 컨테이너보다 긴 낱말(URL·긴 영문)이 통째로 삐져나간다.
       기존 개별 선언은 특이도가 높아 그대로 유효하다 — 반대 의도인 word-break: break-all(2줄 클램프 제목)도 안 덮인다. */
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  /* 배경은 단색(--bg). 화면에 고정된 별 점 6개(body::before의 radial-gradient)는 2026-09-03 Crenop 지정으로 제거 — 지저분해 보였다. */

  /* ── 상단바 (2026-08-31 개편) ─────────────────────────────────────────────────────
     PC와 모바일의 탐색 UI를 맞바꿨다. 여기(가로 · 아이콘 위 · 글자 아래)가 종전 모바일 모양이고,
     1100px 이하 블록의 세로 목록이 종전 PC 사이드바 모양이다. 즉 새 문법을 만든 게 아니라
     이미 검증된 두 모양의 담당 폭만 서로 바꾼 것.
     얻는 것: 사이드바가 먹던 가로 200px를 전 탭이 되찾는다(1280~1600px 구간에서 크루 그리드·명전
     열 수가 한 칸씩 늘어나는 구간). 치르는 것: 세로 68 → 상단바 54 + 보조바 44 = 98px.
     전환점 1100px 근거: 로고 120 + 탭 11개 792 = 912px이 필요한데, 글자폭 추정이 ±10% 틀려도
     되도록 1.2배(1094)를 잡고 코드에 이미 있는 1100을 그대로 썼다. 탭이 늘면 이 값을 재계산할 것.
     탭 12개(2026-09-06 헤드리스 실측, 탭 줄 802px): 실제 전환은 서랍 규칙과 같은 1150이고, 그 위에서는 로고와 오른쪽 문구가
     남는 폭을 반씩 나눠 줄어든다(1200px에서 로고 170 · 1280에서 210 · 1366부터 원래 크기 248). 탭 칸·간격은 그대로(보조바 칸 규격과 공용). */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: stretch;
    position: sticky;
    top: 0;
    z-index: 6;   /* 보조바(5)보다 위 — 둘 다 붙어 있으므로 띠가 앞에 와야 한다 */
  }
  /* 양옆에 같은 몫(flex: 1 1 0)을 주면 남는 폭이 정확히 반씩 갈려 탭 묶음이 화면 정중앙에 선다.
     로고(약 85px)와 문구(약 200px)는 폭이 다르지만, 칸이 같으니 가운데는 안 밀린다.
     min-width:0이 없으면 문구가 자기 폭만큼 칸을 밀어 중앙이 어긋난다. */
  .topbar-logo {
    padding: 6px 12px;   /* 보조바(.main-header)와 같은 좌우 여백 — 다르면 두 줄의 시작점이 어긋난다 */
    display: flex; align-items: center; justify-content: flex-start;
    flex: 1 1 0; min-width: 0;
  }
  .topbar-logo img { max-width: 100%; max-height: 32px; height: auto; display: block; cursor: pointer; }
  /* 탭 묶음이 남는 폭을 전부 먹고 그 안에서 가운데 정렬된다 — 로고(좌)와 문구·가이드(우)의 폭이
     서로 달라 화면 정중앙은 아니지만, 양쪽 끝에 내용이 붙어 있어 가운데로 읽힌다.
     엄밀한 정중앙을 쓰려면 양옆에 같은 폭의 빈 칸을 둬야 하는데, 좁은 폭에서 그 빈 칸이 탭을 먼저 밀어낸다. */
  .sidebar { flex: 0 0 auto; display: flex; align-items: stretch; }
  /* 탭 균등 폭(2026-08-31): 글자 길이와 무관하게 전부 --tab-w. 보조바가 같은 칸 규격을 써서
     각 부속(방송 숫자·알림 벨·일정)이 자기 탭 바로 아래에 서려면 두 줄의 칸이 같아야 한다.
     --tab-w는 가장 긴 라벨(6글자 × 12px = 72) + 좌우 여백. 라벨을 더 길게 만들면 이 값을 다시 잡을 것. */
  .nav-list { padding: 0 6px; display: grid; grid-auto-flow: column; grid-auto-columns: var(--tab-w); gap: 2px; align-items: stretch; }
  .drawer-extra { display: none; }   /* PC에서는 보조바가 이 몫을 한다 */
  .topbar-right { display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 0 12px; flex: 1 1 0; min-width: 0; }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    padding: 8px 6px; color: var(--muted);
    cursor: pointer; font-size: 12px; font-weight: 600;
    border: none; background: none; text-align: center;
    font-family: inherit; white-space: nowrap;
    border-bottom: 3px solid transparent;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
    position: relative;
  }
  .nav-item:hover { color: var(--text); background: var(--surface2); }
  /* 새 좋아요 요청 표시 — 구 보조바 버튼의 점을 탭으로 옮긴 것(2026-08-31). 생방송 점과 같은 자리·크기 */
  .nav-item.has-new::after {
    content: ''; position: absolute; top: 4px; right: 6px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ev-unread);
  }
  .nav-item.active { color: var(--accent); background: var(--surface2); border-bottom-color: var(--accent); }
  .nav-icon {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    vertical-align: middle;
  }
  .nav-icon svg { width: 16px; height: 16px; display: block; vertical-align: middle; }
  /* 라벨 + 뱃지(+벨)를 한 줄로 묶는 칸. 상단바는 세로 배치라 이 묶음이 없으면 뱃지가 라벨 '아래'로
     떨어져 칸이 3단이 된다. 구 .nav-events-label을 이름만 일반화해 라이브 탭도 같이 쓴다. */
  .nav-lbl { position: relative; display: inline-flex; align-items: center; gap: 6px; }
  /* 안읽음 숫자 배지: SVG 도형 렌더(2026-07-13) — 박스(rect)와 숫자(패스)가 한 좌표계의 기하라 배율 무관 정중앙.
     폰트 텍스트는 글리프 힌팅이 ppem마다 착지를 ±1px 스냅(배율 따라 반전 실측 — geometricPrecision 실험도 무효)해 어떤 보정으로도 불가했음.
     크기 문법(높이14=구 lh12+상하패딩2 · min-width16 · 좌우패딩5 · 숫자 10px 상당)은 navBadgeSvg()가 동일 유지. */
  /* 상단바에선 배지가 '칸' 우상단(아이콘 옆)에 선다. .nav-lbl이 relative면 배지가 라벨에 앵커돼
     글자 위에 겹친다(실사고) — 그래서 상단바에서는 .nav-lbl의 기준점을 풀어 .nav-item에 붙인다. */
  .nav-lbl { position: static; }
  /* 자리 계산(2026-09-02): 네 자리 '1000' 배지 폭 34.49px(navBadgeSvg 실측), 탭 칸 64px →
     right = (64 - 34.49) / 2 = 14.75px. 그 자리에 두면 네 자리일 때 칸 가운데(아이콘과 같은 중심)에 서고,
     오른쪽 경계가 고정이라 자릿수가 줄면 왼쪽으로만 짧아진다. */
  .nav-badge { position: absolute; top: 2px; right: 14.75px; }
  .nav-badge svg { display: block; }
  .nav-badge rect { fill: var(--ev-unread); }
  .nav-badge path { fill: var(--bg); }
  .nav-live-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    background: var(--surface2);
    min-height: 17px;   /* 구 높이 앵커 — 텍스트 라인박스(11px×lh normal≈13)+패딩4가 만들던 17px을, 숫자가 SVG(≈8px)로 바뀌며 명시값으로 대체 */
    color: var(--muted);
    transition: color 0.15s;
  }
  /* 카운트 숫자 = SVG 도형(nav-badge와 동일 사유). SVG 박스=숫자 잉크 경계라 flex 중앙정렬이 곧 잉크 중앙정렬. 색은 currentColor로 on/off 상태 상속 */
  .nav-live-count svg { display: block; }
  .nav-live-count path { fill: currentColor; }
  .nav-live-dot {
    width: 7px;
    height: 7px;
    background: var(--muted);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .nav-live-badge.on {
    color: var(--text);
    background: rgba(255,59,59,0.12);
  }
  .nav-live-badge.on .nav-live-dot {
    background: var(--live);
    box-shadow: 0 0 6px var(--live-glow);
    animation: pulse 1.8s ease-in-out infinite;
  }

  .nav-notify-bell {
    display: inline-flex;         /* 보조바 줄(생방송 수 배지·일정 버튼 옆) */
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--muted);         /* 무채색 = 알림 꺼짐 */
    cursor: pointer;
    transition: color 0.15s;
    /* 상자(2026-09-03 Crenop): 같은 줄의 다른 버튼(.page-title-link)과 같은 옷 — 테두리는 앰버로 고정, 켬/끔은 종 색과 바탕색(무채↔앰버 반투명) */
    padding: 5px 8px;
    --btn-rgb: 251,191,36;         /* 앰버 — 테두리 비율(40%)은 다른 버튼과 공통 */
    background: var(--surface2);   /* 끔: 무채 바탕(Crenop 지정) */
    border: 1px solid rgba(var(--btn-rgb), 0.4);
    font-size: 11px; line-height: 1.4;   /* .page-title-link과 같은 글줄 → 상자 높이가 같다(아래 ::after의 빈 글줄이 높이를 만든다) */
  }
  .nav-notify-bell::after { content: '\200B'; }   /* 글자 없는 상자에 글줄 하나를 세워 .page-title-link과 높이를 맞춘다(어느 배치에서나 같은 규칙으로 따라간다) */
  .nav-notify-bell svg { width: 16px; height: 16px; display: block; overflow: visible; margin-top: -1px; }   /* 16px(구 20): 상자 안 다른 아이콘과 같은 크기. -1px: .page-title-link svg와 같은 되감기 */
  /* ON/OFF를 색(앰버↔무채)·모양(웨이브 선 유무)으로 구별 + 켤 때 1회 애니메이션 */
  .nav-notify-bell .ring-wave { opacity: 0; }                   /* OFF: 양옆 웨이브 선 숨김 (모양 단서) */
  .nav-notify-bell.on { color: #fbbf24; background: rgba(var(--btn-rgb), 0.12); }   /* ON: 종·바탕 앰버(색 단서, 민트 아닌 별도색) */
  .nav-notify-bell.on .ring-wave { opacity: 1; }                /* ON 정지: 양옆 웨이브 선 정적 표시 (currentColor=앰버) */
  .nav-notify-bell:not(.on):hover { color: var(--text); }
  /* 클릭으로 켤 때 1회만 (.ringing은 JS가 붙였다 뗌) — 상시 흔들리지 않음 */
  .nav-notify-bell.ringing svg { transform-origin: 50% 12%; animation: bell-ring 0.9s ease-in-out; }
  .nav-notify-bell.ringing .ring-wave { animation: ring-wave-flash 0.9s ease-out; }
  @keyframes bell-ring {
    0%   { transform: rotate(0); }
    15%  { transform: rotate(17deg); }
    30%  { transform: rotate(-15deg); }
    45%  { transform: rotate(11deg); }
    60%  { transform: rotate(-7deg); }
    75%  { transform: rotate(4deg); }
    88%  { transform: rotate(-2deg); }
    100% { transform: rotate(0); }
  }
  @keyframes ring-wave-flash {
    0%   { opacity: 0; }
    20%  { opacity: 1; }
    60%  { opacity: 0.8; }
    100% { opacity: 1; }                                        /* ON 정지값(1)으로 안착 — 끝에서 사라졌다 튀지 않게 */
  }
  /* 모션 감소(OS 설정: iOS 동작 줄이기 / Android 애니메이션 제거 / Windows 애니메이션 효과 끄기).
     켠 사람에게만 적용되고 나머지 화면은 그대로다. 움직임으로 어지럼을 느끼는 경우를 위한 대비. */
  @media (prefers-reduced-motion: reduce) {
    .nav-notify-bell.ringing svg, .nav-notify-bell.ringing .ring-wave { animation: none; }
    .nav-live-badge.on .nav-live-dot { animation: none; }        /* 생방송 표시 점 깜빡임 */
    .card:hover, .card.live:hover { transform: none; }            /* 카드 튀어오름 — 테두리·그림자 신호는 유지 */
    .vs-scroll { scroll-behavior: auto; }                         /* 영상 스트립 가로 스크롤 */
  }
  .notify-switch {
    position: relative;
    width: 36px;
    height: 20px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
    padding: 0;
    box-sizing: border-box;
  }
  .notify-switch::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    background: var(--muted);
    top: 50%;
    left: 2px;
    transform: translateY(-50%);
    transition: transform 0.18s, left 0.18s, background 0.18s;
  }
  .notify-switch.on { border-color: var(--accent); }
  .notify-switch.on::after { left: 19px; transform: translateY(-50%); background: var(--accent); }

  .main {
    flex: 1; min-width: 0;
    position: relative;   /* z-index 없음(2026-08-31): 값을 주면 이 안쪽 z-index가 전부 그 값으로 묶여,
       우측 드로어(.filter-panel, z-index 40)가 상단바 안 가림막(30)을 못 이기고 덮였다 — 좌측에서 겪은 것과 같은 사고.
       뺀 뒤에도 순서는 유지된다: 본문은 흐름층, 상단바는 5, 가림막은 상단바 안 30, 양쪽 드로어는 40. */
    display: flex; flex-direction: column;
  }
  /* ── 보조바 (2026-08-31) ────────────────────────────────────────────────────────
     탭 줄이 위로 올라가면서 종전 상단바가 맡던 것(탭별 버튼 · 갱신/경고 문구 · 가이드)이 내려온 자리.
     문구·가이드는 상단바 우측(노는 자리)으로 올라갔고 여기엔 탭별 버튼만 남는다.
     반드시 '한 줄'이다: 버튼이 늘거나(좋아요 순위는 대회 수만큼 생긴다) 줄어도 본문 시작 높이가
     안 움직여야 한다(위치 일관성). 그래서 줄바꿈 대신 가로 스크롤로 흘린다. */
  /* overflow: hidden이 없으면 안쪽 버튼(.page-title-link는 flex-shrink:0)이 칸을 밀어 넓히고,
     그만큼 가운데 묶음이 옆으로 밀려 위 탭 줄과 어긋난다(2026-08-31 실사고). */
  .subbar-lead, .subbar-right { display: flex; align-items: center; gap: 8px; flex: 1 1 0; min-width: 0; overflow: hidden; }
  /* 중간 폭(950~1150): 갱신 문구를 보조바 우측으로 내려 상단바를 [로고 + 탭]만으로 줄인다.
     탭 11칸(770) + 로고(120) = 890이라 950px까지 버틴다 — 태블릿·폴더블을 모바일 UI로 보내지 않기 위한 단계.
     탭을 2행으로 접는 대신 이 길을 택한 이유: 2행이 되면 보조바 부속이 '어느 행 아래'에 서야 하는지가
     사라져 칸 정렬이 무너지고, 아낀 가로만큼 세로(54→108)를 잃어 이득이 상쇄된다. */

  .subbar-right { justify-content: flex-end; }
  /* 왼쪽 묶음은 왼쪽 끝(로고 왼쪽 선)부터 일정 줄 → 시트 왼쪽 버튼 순으로 선다(2026-09-06 Crenop). 종전(2026-09-04) '기념일 바로 왼쪽에 붙는다'는 철회 —
     일정 줄이 이 묶음에 들어오면서 기준이 기념일이 아니라 일정 줄이 됐다. 기념일과 부딪히면 기념일 문구가 약식으로 줄고(syncLeadGap), 그래도 겹치면 버튼이 줄어든다. */
  .subbar-lead { justify-content: flex-start; }
  /* 탭 줄과 같은 칸 규격 — 부속이 자기 탭 아래에 정확히 선다 */
  .subbar-mid { display: grid; grid-auto-flow: column; grid-auto-columns: var(--tab-w); gap: 2px; padding: 0 6px; }
  .tab-aux { display: flex; align-items: center; justify-content: center; min-width: 0; }
  /* 닫기 버튼 — ☰와 같은 규격. 모양을 여기(기본)에 두지 않으면 폭 구간에 따라 배경·테두리가 빠진다(실사고) */
  .drawer-close {
    display: none; align-items: center; justify-content: center;
    width: 34px; height: 34px; flex-shrink: 0; margin-left: 10px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); cursor: pointer;
  }
  .drawer-close svg { width: 18px; height: 18px; display: block; }
  /* 우측 서랍 닫기 — 서랍이 열렸을 때만, 여는 버튼(깔때기)과 같은 자리에 겹쳐 띄운다.
     상단바 '밖'에 있어야 한다: 안에 두면 z-index가 상단바(5)로 묶여 서랍(40)에 가린다. */
  .drawer-close-r { position: fixed; top: 6px; right: 10px; z-index: 45; margin: 0; }
  body.drawer-r .drawer-close-r { display: flex; }
  .drawer-close:hover { border-color: var(--accent); }   /* 테두리가 있는 요소 → 테두리색만 (신호 규칙 ①) */
  .main-header {
    position: sticky; top: var(--topbar-h, 0px); z-index: 5;   /* 띠 아래에 붙는다 — 기둥·버튼바가 이 아래에서 멈춘다 */
    background: var(--surface);   /* 상단바와 같은 면(2026-09-02): 없으면 붙어 있는 동안 스크롤한 본문이 이 줄을 뚫고 비친다 */
    padding: 3px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    min-height: 34px;   /* 상단바(54)의 절반 남짓 — 부속 한 줄이라 그 이상 필요 없다. 민트 그라데이션은 폐지(2026-09-01) */
    flex-wrap: nowrap;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
  }
  .main-header::-webkit-scrollbar { display: none; }
  /* 보조바 버튼은 한 줄 — 종전 2줄 줄바꿈(<br class="tb-br">)을 접는다. 원문에 br 앞 공백을 넣어 뒀으므로
     접어도 낱말이 붙지 않는다. 모바일에서는 짧은 라벨(.tb-t-mb)로 갈아끼우므로 이 규칙과 무관. */
  .tb-br { display: none; }
  .page-title-link, .celebration-box, .celebration-box * { white-space: nowrap; }   /* 문구의 <br>도 함께 제거했다 — 줄바꿈 금지만으로는 <br>을 못 막는다(2026-09-02) */
  .page-title { flex-wrap: nowrap; }   /* 보조바가 한 줄이므로 버튼 묶음도 안 접힌다 */
  /* 일정 줄 → 다시 버튼(2026-09-02): 2026-08-31에 '표시'로 바꾸며 벗겼던 버튼 모양(민트 박스·달력 아이콘, 옛 .sch-btn)을
     되돌렸다 — 누르면 다가올 일정 목록 모달이 뜨므로 눌리게 보여야 한다(Crenop 지적). 한 줄(제목 · 남은 시간)은 유지,
     같은 날 2건+는 +N 없이 첫 건만(옛 두 줄 격자는 사이트의 한 줄 버튼 규칙에 어긋나 복원하지 않는다). 칸을 넘치면 제목만 말줄임. */
  .sch-line { min-width: 0; }
  .sch-line-txt, .sch-line-shell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sch-line-when, .sch-line-mb { flex: none; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .sch-line-mb { display: none; }   /* 세로 배치 전용 D-day 칸 — 기념일의 PC 문구/약식 문구와 같은 갈아끼우기 문법 */
  /* 일정 버튼의 종류 그림(2026-09-04): 달력 칸의 태그 그림(.cal-tag — 태그별 고유색)을 그대로 쓰되, 버튼 안에서는 다른 버튼 아이콘과 같은 자리·크기(16px·-1px 되감기·gap 10) */
  .sch-btn .cal-tag { display: contents; }
  .sch-btn .cal-tag svg { width: 16px; height: 16px; margin-top: -1px; flex-shrink: 0; }
  /* 일정 줄은 좌우 한 칸씩 더 쓴다 — 양옆 탭(통계·현수막)은 보조바를 안 쓰므로 자리가 비어 있고,
     제목이 잘리면 표시의 뜻이 사라진다. 흐름에서 빼내야(absolute) 칸 폭(64px)에 눌리지 않는다. */
  /* 기념일은 프로필 칸의 오른쪽 끝에 붙는다 — 오른쪽 경계가 프로필 탭의 오른쪽 경계와 일치한다.
     문구가 칸(64px)보다 넓으므로 흐름에서 빼내 왼쪽으로 넘치게 둔다(일정 줄과 같은 문법). */
  .tab-aux[data-for="members"] { overflow: visible; position: relative; }
  .tab-aux[data-for="members"] .celeb-wrap {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; gap: 6px;   /* 여럿이면 왼쪽으로 나열된다(오른쪽 경계 고정) */
  }
  /* 약식 문구로 — 둘 이상이면(celeb-many: 전체 문구를 여러 개 늘어놓으면 옆 칸을 침범한다), 또는 왼쪽 묶음과 부딪히면(celeb-tight, 2026-09-06 Crenop:
     폭이 전체 문구를 보여주기에 모자라면 기념일을 줄인다 — 판정은 syncLeadGap이 실측으로) */
  .tab-aux.celeb-many .celebration-box .tb-t-pc, .tab-aux.celeb-tight .celebration-box .tb-t-pc { display: none; }
  .tab-aux.celeb-many .celebration-box .tb-t-mb, .tab-aux.celeb-tight .celebration-box .tb-t-mb { display: inline; }
  /* 일정 줄(왼쪽 묶음 맨 앞, 2026-09-06): 제목이 길어도 묶음을 다 먹지 않게 탭 세 칸 폭에서 자른다(달력 탭 칸에 있을 때와 같은 상한).
     자리는 묶음의 왼쪽 끝 = 로고 왼쪽 선(2026-09-06 Crenop 배포본 확인 후 지정: 기념일 옆에 붙이니 자리가 애매했다), 시트 버튼은 그 오른쪽에 차례로.
     묶음이 좁아지면 시트 버튼이 먼저(3배) 줄고 글자는 말줄임, 일정 줄은 그다음. */
  .subbar-lead .sch-line { flex: 0 1 auto; min-width: 0; max-width: calc(var(--tab-w) * 3 + 4px); }
  .subbar-lead .tb-sheet-btn { flex: 0 3 auto; min-width: 0; }
  .tb-t-pc { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }   /* 줄어들 때 글자 말줄임(왼쪽 묶음에서만 줄어든다). 잘린 글은 ELLIPSIS_TIP_SEL 글상자 */

  /* 드로어 여닫이 — 상단바가 화면 밖으로 나가는 폭에서만 나타난다 */
  .drawer-btn {
    display: none; align-items: center; justify-content: center;
    width: 34px; height: 34px; flex-shrink: 0;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); cursor: pointer; position: relative;
    transition: color 0.15s, border-color 0.15s;
  }
  .drawer-btn:hover { border-color: var(--accent); }
  .drawer-btn svg { width: 18px; height: 18px; display: block; }
  /* 필터가 걸려 있으면(화면에 남은 항목 수 < 원래 수 — 전부 꺼져 0이어도 같다) 체크박스 안쪽 면만 절반 투명(2026-09-03 Crenop 확정).
     비율만큼 옅어지던 방식(2026-09-02)은 폐지 — 본문이 걸러진 상태라는 것만 알리면 되고, 텅 비면 걸러졌음을 모를 수 없다.
     색은 바꾸지 않는다(민트 없음). 점선 체크(.cb-check)는 2026-09-03 아이콘에서 제거(다른 곳에서 쓰면 점선 윤곽이 지저분하게 드러났다). */
  .drawer-btn .funnel-fill { opacity: 1; }
  .drawer-btn.filtered .funnel-fill { opacity: 0.5; }
  #drawerBtnR svg { width: 22px; height: 22px; }   /* 체크박스는 상자 2~22 + 22px(66번 확정) — 18px에선 상자가 좁게 읽혔다 */
  /* 드로어 뒤 가림막 — 누르면 닫힌다(우측 드로어의 유일한 닫기 경로이므로 값이 싸야 한다) */
  .drawer-scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    opacity: 0; pointer-events: none; transition: opacity 0.22s;
    z-index: 30;
  }
  body.drawer-l .drawer-scrim, body.drawer-r .drawer-scrim { opacity: 1; pointer-events: auto; }
  body.drawer-l, body.drawer-r { overflow: hidden; }   /* 덮는 서랍일 때만 뒤 본문 스크롤 잠금 */
  @media (min-width: 701px) and (max-width: 1150px) { body.drawer-l, body.drawer-r { overflow: visible; } }   /* 태블릿은 덮지 않고 밀어내므로 본문을 계속 굴릴 수 있어야 한다 */
  .page-title {
    flex-shrink: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;   /* 간격 일원화(2026-08-09): 버튼 사이도 경계 간격과 같은 12px */
    flex-wrap: wrap;
  }
    /* 아래 여백 보정: 한글은 폰트 descent 공간을 안 쓰는데 라인박스는 그대로 잡는다 →
       위·아래 padding을 같게 두면 아래가 더 넓어 보인다(2026-08-05 스크린샷 실측: 위 14px vs 아래 18~20px ≒ 2.4 CSS px 차).
       아래만 2px 줄여 광학적으로 맞춘다. 모바일(세로 배치)은 별도 규칙이라 여기 영향을 받지 않는다. */
  .page-title-link {
    display: flex;
    align-items: center;
    gap: 10px;   /* 내부 간격 일원화(2026-08-09 비교 확정): 좌경계~아이콘~텍스트~우경계 전부 10px. 바 레벨(경계·버튼 사이)은 12px 별도. 모바일은 세로 미니 별도 규칙 */
    padding: 5px 10px;   /* 위/아래 대칭(2026-09-02 실측 확정). 구 6/4(한글 1px 하향 보정, 2026-08-09)는 Crenop Windows 100% 스크린샷 실측에서
                            글자가 1px 아래로 치우쳐 철회 — 잉크 9행이 안쪽 25px에 위8/아래8이 되려면 밀지 않는 것이 맞다. 같은 스크린샷으로 아이콘도 잼(아래 svg) */
    /* 버튼 색은 한 변수로(2026-09-04 세션 70 일괄화): --btn-rgb 하나에 바탕 12%·테두리 40%·호버 22%/70%. 변형(일정 민트·좋아요 에메랄드·시트 버튼·기념일·최애)은
       색 변수와 글자색만 바꾼다 — 종전엔 변형마다 네 줄씩 같은 비율을 따로 적어 새 버튼을 만들 때마다 어긋났다 */
    --btn-rgb: 96,165,250;   /* 기본 파랑 */
    background: rgba(var(--btn-rgb), 0.12);
    border: 1px solid rgba(var(--btn-rgb), 0.4);
    color: #93c5fd;
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
    transition: background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .page-title-link:hover, .celebration-box:hover { background: rgba(var(--btn-rgb), 0.22); border-color: rgba(var(--btn-rgb), 0.7); }
  /* margin-top -2px: 위 6/아래 4 비대칭 패딩(한글 텍스트 광학 보정)이 콘텐츠 중심을 테두리 중심보다 1px 내리는데,
     아이콘까지 딸려 내려가 위 여백이 2px 더 넓어진다 — 아이콘만 상쇄해 테두리 기준 정중앙(텍스트 보정은 유지). 모바일은 패딩 대칭이라 리셋 */
  .page-title-link svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: -1px; }   /* 아이콘 그림이 16px 상자 아래쪽에 치우쳐 있어(실측: 잉크 14행이 위 1.3/아래 0.7) 1px 되감음 — 구 -2px는 6/4 패딩 시절 값(2026-09-02 재실측) */
  /* 가이드 버튼 아이콘 래퍼(JS 주입 대상): 투명화해 svg가 다른 버튼처럼 직접 flex 아이템이 되게 —
     span 인라인 배치는 svg 아래에 폰트 descent(~4px)를 붙여 물음표가 ~2px 위로 뜬다(아래 여백만 커지던 원인) */
  #guideIcon { display: contents; }
  /* 좋아요 요청 모아보기 버튼: page-title-link 골격에 comment_recommend 색(에메랄드, --ev-post 계열) 적용 */
  button.page-title-link.like-req-btn {
    --btn-rgb: 52,211,153;
    color: #6ee7b7;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    position: relative;
  }
  /* 안 본 새 좋아요 요청이 있으면 버튼 우상단 빨간 점 */
  .like-req-btn.has-new::after {
    content: ''; position: absolute; top: -3px; right: -3px;
    width: 9px; height: 9px; border-radius: 50%;
    background: #f87171; box-shadow: 0 0 0 1.5px var(--bg);
  }
  /* 일정 버튼: 천타버스 메인 민트(--accent) 박스 — 좋아요(에메랄드)·블루발(파랑)과 색으로 구분.
     2026-08-31 표시화로 잠시 안 쓰이다 2026-09-02 목록 모달 버튼으로 복원 */
  button.page-title-link.sch-btn {
    --btn-rgb: 97,255,236;
    color: var(--accent);
    cursor: pointer;
    font-family: inherit;
    text-align: left;
  }
  /* 시트 기반 상단바 버튼(구 cover2-btn 대체): 색은 F열 hex → 인라인 --btn-rgb·color(topbarLinksHtml). 비율은 .page-title-link 공통 */
  .lr-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.65);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .lr-overlay[hidden] { display: none; }
  .lr-panel {
    background: var(--surface);
    border: 1px solid rgba(52,211,153,0.4);
    width: 100%; max-width: 560px;
    max-height: 80vh;
    display: flex; flex-direction: column;
  }
  .lr-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px; font-weight: 700; color: var(--ev-post);
  }
  .lr-head > span:first-child { display: inline-flex; align-items: center; gap: 6px; }
  .lr-head svg { width: 15px; height: 15px; display: block; }
  .lr-close {
    background: none; border: none; color: var(--muted);
    font-family: inherit;   /* ✕ 글리프도 사이트 폰트로 — 버튼은 UA 기본 폰트라 상속이 끊긴다(좋아요·일정·통계 그래프·모아보기 등 5개 모달 공용, 2026-08-10) */
    font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 6px;
  }
  .lr-close:hover { color: var(--text); }
  .lr-body { overflow-y: auto; }
  .lr-msg { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 12px; }
  /* 최애 고르기(세션 70): 프로필 기둥의 얼굴 칸(.members-tab)을 그대로 7열로. 발 줄엔 해제 버튼 하나 */
  .fav-pick { display: grid; grid-template-columns: repeat(7, 52px); gap: 6px; justify-content: center; padding: 8px 16px 12px; }
  .fav-pick-foot { display: flex; justify-content: center; padding: 0 16px 16px; }
  button.page-title-link#favBtn { cursor: pointer; font-family: inherit; }   /* 다른 button.page-title-link과 같은 초기화(.rank-btn·.tbm-btn 규칙과 동일) */
  /* 최애 버튼 색 = 인라인 --btn-rgb·color(설정 전 노랑, 설정 후 멤버 고유색) — 비율은 .page-title-link 공통 */
  #favBtn svg { fill: currentColor; }
  .fav-lbl { display: inline-grid; justify-items: center; }   /* 겹친 후보 글자 중 가장 넓은 것이 칸 폭 — 실제 글자는 그 가운데(남는 폭이 양쪽에 고르게) */
  .fav-lbl > span { grid-area: 1 / 1; white-space: nowrap; }
  .fav-lbl > .fav-lbl-w { visibility: hidden; }
  /* 최애 도착 표시(세션 70 2단계, 2026-09-04 개정): 탭에 들어와 최애 자리로 내려간 뒤 1.4초 강조하고 사라진다 — 케미의 '관련 케미로 이동'(.chem-flash)과 같은 문법.
     상시 외곽선은 폐지(음악 이름줄처럼 감쌀 범위가 애매한 곳에서 넓거나 좁게 보였다). 색은 멤버 고유색 — 생방송 카드의 민트 테두리(방송 중)와 섞이지 않게. 붙어 있는 머리 아래에 서도록 scroll-margin */
  [data-member] { scroll-margin-top: calc(var(--head-h, 0px) + 20px); }
  .fav-flash { outline: 1.5px solid var(--fav-color, var(--accent)); outline-offset: -1.5px; transition: outline-color 0.35s; }
  .fav-col { position: absolute; pointer-events: none; z-index: 3; }   /* 관련 링크 가로 표의 열 덧그림(favColumnOverlay) — 크기는 JS가 잰다. z-index 3: 머리 칸(.links-table th, sticky z-index 2)이 덧그림의 위·양옆을 덮던 것(2026-09-04 Crenop 적발) 위로 */
  /* 좋아요 순위 모달 — lr-panel 골격 재사용. 행은 grid로 열을 고정(flex는 값 길이에 따라 열이 흔들려 눈금이 안 맞음) */
  .rk-ev { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .rk-ev:last-child { border-bottom: none; }
  /* 제목 + 컷라인 한 줄. 좁은 폭에서만 컷이 다음 줄로 접힘 */
  .rk-ev-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .rk-ev-title { font-size: 12px; font-weight: 700; color: var(--text); }
  .rk-ev-sub { font-size: 11px; color: var(--muted); }
  /* 열 폭 고정. 이름 칸을 1fr로 두면 남는 폭을 이름이 다 먹어 전형이 멀리 밀려난다(2026-08-04 지적) →
     좌측(사진·이름·전형)은 붙이고, 남는 폭은 숫자 블록 사이로 보낸다. 전형 없는 대회는 열 자체를 뺀다. */
  /* 좌측(사진·이름·전형)은 고정폭으로 붙이고, 남는 폭은 숫자 3열이 균등하게 나눠 갖는다.
     이전엔 1fr이 좋아요 칸 하나에 몰려 순위-좋아요 사이만 벌어지고 컷은 붙어 보였다(2026-08-04 지적). */
  .rk-row {
    display: grid;
    grid-template-columns: 28px 60px 32px 1fr 1fr 1.1fr;   /* 사진 이름 전형 | 순위 좋아요 컷차이 */
    align-items: center; gap: 6px; padding: 3px 0; font-size: 12px;
  }
  .rk-ev.no-group .rk-row { grid-template-columns: 28px 60px 1fr 1fr 1.1fr; }
  .rk-av { width: 28px; height: 28px; object-fit: cover; }
  .rk-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 댓글 바로가기: 행 전체가 링크. 호버 표시는 글씨색이 아니라 민트 테두리(2026-08-05 Crenop) —
     이름색은 멤버 정체성이라 호버가 갈아치우지 않는다. 외부링크 아이콘도 넣지 않는다(열 폭 고정 → 이름 칸이 잘림).
     [2026-08-05 재수정] 처음엔 box-shadow + border-radius:4px로 그렸는데 사이트에서 유일한 둥근 모서리였고,
     그림자 spread는 모서리가 뭉툭하고 번져 보인다. 사이트의 다른 테두리 40곳과 같은 border 1px solid로 통일한다.
     레이아웃 밀림은 '항상 투명 테두리 + padding으로 상쇄'로 막는다(호버 때 새로 생기는 두께가 없다):
       세로 border 1 + padding 2 = div 행의 padding 3  · 가로 border 1 + padding 5 = margin 상쇄값 6
     → 링크 행과 일반 행의 칸 위치·행 높이가 완전히 같고, 테두리만 좌우로 6px 넉넉하게 둘린다.
     color:inherit이 필요한 이유 — .rk-like/.rk-gap은 지정색이 없어 a의 기본 링크색을 물려받는다. */
  a.rk-row { text-decoration: none; color: inherit; border: 1px solid transparent; padding: 2px 5px; margin: 0 -6px; }
  a.rk-row:hover { border-color: var(--accent); }
  /* 팀 병합(2026-08-20): 이어지는 팀 행은 위 간격을 붙여 한 덩어리로 — 행 사이 구분감 제거. 숫자 칸은 렌더러가 비운다 */
  .rk-row.rk-teamcont { padding-top: 0; margin-top: -1px; }
  .rk-grp { color: var(--muted); font-size: 11px; }
  .rk-rank, .rk-like, .rk-gap { font-variant-numeric: tabular-nums; text-align: right; }
  /* 순위·컷은 대회 색을 따르지 않는다 — '안정권이냐 탈락권이냐'가 한눈에 보여야 하므로 고정 의미색을 쓴다.
     대회 색(--rk-c)은 정체성 표시(테두리·헤더·제목)에만 쓴다. 둘을 섞으면 색이 두 가지 뜻을 갖게 된다. */
  .rk-rank { font-weight: 700; color: var(--text); }
  .rk-row.in .rk-rank, .rk-row.in .rk-gap { color: var(--rk-in); }
  .rk-row.out .rk-rank, .rk-row.out .rk-gap { color: var(--rk-out); }
  .rk-ev-title { color: var(--rk-c, var(--text)); }
  .rk-head-right { display: inline-flex; align-items: center; gap: 10px; }
  /* 순위 모달일 때만 패널 테두리·헤더가 대회 색을 따른다(좋아요 요청·일정 모달은 기존 에메랄드 유지) */
  /* 테두리는 다른 모달과 같은 40% 강도로 — 원색 100%는 화면을 압도한다(2026-08-04 지적).
     헤더 밑줄은 기본 --border 유지(색이 두 겹으로 겹치면 과해짐). 대회 색은 아이콘·제목 글자에만 남긴다. */
  .lr-panel.rk-modal, .lr-panel.tbm-modal { border-color: rgba(var(--rk-rgb, 52,211,153), 0.4); }
  .lr-panel.rk-modal .lr-head, .lr-panel.tbm-modal .lr-head { color: var(--rk-c, var(--ev-post)); }
  .rk-like { color: var(--text); }
  .rk-gap { font-size: 11px; }
  /* 컷 경계 행 — 좋아요 내림차순 목록에서 그 전형의 컷 값이 놓일 자리에 끼워 넣는다.
     전형마다 컷이 다르므로 경계선 하나로는 표현할 수 없다(남자 1,424 / 여자 2,239) → 전형별로 각자의 자리에 한 줄씩.
     높이·글씨 크기는 멤버 행과 동일하게 맞춘다(2026-08-04 지적) — 눈금이 어긋나면 표로 안 읽힌다. */
  .rk-cut-row { min-height: 34px; position: relative; color: var(--rk-cut); }   /* 34px = 아바타 28 + 상하 여백 6 */
  .rk-cut-row::before {   /* 행 전체를 가로지르는 경계선. 글자 칸이 배경색으로 선을 끊어 라벨이 선 위에 놓인 것처럼 보인다 */
    content: ''; position: absolute; left: 0; right: 0; top: 50%;
    border-top: 1px dashed var(--rk-cut-line);
  }
  /* 좌우 여백 -3px/+3px: 인접한 글자 칸의 배경이 6px 그리드 간격에서 정확히 맞닿아 선이 끊긴다.
     (이전엔 칸 사이로 선 토막이 비쳐 "붙었다 떨어졌다" 하는 간격이 생겼다 — 2026-08-04 지적) */
  /* 배경이 칸 전체가 아니라 글자만 감싸게 한다(justify-self로 폭=글자). 그러면 칸의 남는 공간으로 선이 지나가
     "글씨 사이에 선"이 되고, 좌우 여백도 8px로 넉넉해진다. margin -8px은 padding을 상쇄해 글자 위치를 그대로 둔다
     (안 하면 우측정렬이 8px 밀려 위아래 숫자와 축이 어긋난다). 2026-08-04 지적 반영. */
  .rk-cut-row > span { position: relative; background: var(--surface); padding: 0 8px; margin: 0 -8px; }
  /* 멤버 행과 같은 클래스·같은 열을 쓴다 → 전형은 전형 칸에, "33위"는 등수 칸에, 수치는 좋아요 칸에 자동 정렬 */
  .rk-cut-row .rk-grp { grid-column: 3; justify-self: start; }
  .rk-cut-row .rk-rank { grid-column: 4; justify-self: end; }
  .rk-cut-row .rk-like { grid-column: 5; justify-self: end; }
  .rk-ev.no-group .rk-cut-row .rk-rank { grid-column: 3; }
  .rk-ev.no-group .rk-cut-row .rk-like { grid-column: 4; }
  /* 색은 등수에만. 멤버 행도 색이 들어가는 곳은 등수·컷차이 두 군데뿐이고, 전형은 회색·좋아요는 흰색이다.
     컷값을 흰색으로 두면 위아래 좋아요 숫자와 같은 축이 되어 바로 비교된다(이 행의 본래 목적).
     컷 행에서 색이 들어가는 두 번째 자리는 경계선이 맡는다 — 멤버 행의 컷차이에 대응. */
  .rk-cut-row .rk-rank { color: var(--rk-cut); }
  .rk-in { color: var(--rk-in); }
  .rk-out { color: var(--rk-out); }
  .rk-note { font-size: 11px; color: var(--muted); padding: 4px 0 0; }
  /* 순위 버튼: 색은 시트 G열 hex(tb-sheet-btn과 동일 방식). button은 기본 가운데정렬이라 text-align 명시 필요 */
  button.page-title-link.rank-btn, button.page-title-link.tbm-btn { cursor: pointer; font-family: inherit; text-align: left; }
  /* 상단바 시트 모달 — lr-panel 골격 재사용. 한 행 = 항목 하나를 세로로 쌓는다(사진·링크·안내문이 한 모달에 섞인다).
     배치는 제목 → 설명 → 이미지. 항목이 링크면 <a>, 아니면 <div>라 hover 반응도 링크일 때만 준다(누를 수 있는지가 보여야 함). */
  .tbm-item { display: block; padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text); text-decoration: none; }
  .tbm-item:last-child { border-bottom: none; }
  a.tbm-item:hover { background: rgba(255,255,255,0.04); }
  /* 제목 줄 끝 externalLink = 링크 있음. 규격(12px·0.7·gap 6px)은 일정 항목(.sch-item-title)과 동일 — 같은 뜻이면 같게 보여야 한다 */
  .tbm-title { font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .tbm-title svg { width: 12px; height: 12px; opacity: 0.7; flex-shrink: 0; }
  .tbm-desc { display: block; font-size: 12px; color: var(--muted); white-space: pre-line; }   /* pre-line: 시트 셀 안 줄바꿈(Alt+Enter)을 그대로 보여준다 */
  .tbm-title + .tbm-desc { margin-top: 4px; }
  .tbm-img { display: block; width: 100%; }
  .tbm-title + .tbm-img, .tbm-desc + .tbm-img { margin-top: 8px; }
  /* 좋아요 요청 모달 v2(2026-08-10 전면 개편): 같은 글끼리 묶어 [컨텐츠 헤더]+[요청 행]으로 표시.
     이벤트 탭 카드(renderEvent)를 안 쓰는 이유: 탭은 이벤트가 섞여 있어 요청 하나에 전체 정보가 필요하지만,
     모달은 요청만 모이므로 컨텐츠 정보를 헤더로 병합 — 행마다 반복되던 대상 태그와 과확보 높이(구 min-height 60)를 없앤다. */
  .lrg-head {
    display: flex; align-items: center;
    padding: 10px 16px 10px 14px;          /* 1줄 고정: 줄높이 17 + 상하 10 + 테두리 2 = 39px 균일 */
    border-left: 4px solid transparent;    /* 행의 신규 표시 자리(4px)와 좌변 통일 — 헤더·행 글 시작점 = 18px 일치 */
    background: var(--surface2);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    font-size: 12px; font-weight: 700; color: var(--text2);
  }
  .lrg-head:first-child { border-top: none; }   /* 첫 묶음은 모달 헤더 밑선과 겹선 방지 */
  .lrg-head-txt { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 17px; color: inherit; text-decoration: none; }   /* 1줄 말줄임(구 2줄 클램프 폐지 — 2026-08-10 확정) */
  a.lrg-head-txt:hover { color: var(--accent); }
  .lrq-row {
    position: relative;
    border-left: 4px solid transparent;    /* 신규(안읽음) 표시 자리 — 이벤트 탭 .event.unread와 동일 방식 */
  }
  .lrq-row + .lrq-row { border-top: 1px solid rgba(30,39,64,0.5); }
  .lrq-row:hover { background: var(--surface2); }
  .lrq-row.unread { border-left-color: var(--ev-unread); background: rgba(97, 255, 236, 0.10); box-shadow: inset 4px 0 12px -4px rgba(97, 255, 236, 0.35); }
  .lrq-row.unread:hover { background: rgba(97, 255, 236, 0.16); }
  .lrq-link {
    display: flex; align-items: center; gap: 10px;
    min-height: 58px;                      /* 요청 행 2줄 고정: 19+2+17 + 상하 10 = 58 — 둘째 줄이 없어도 같은 높이 */
    padding: 10px 48px 10px 14px;          /* 상하 10(2026-08-10 여백 확대, 구 6) · 우측 48 = 체크박스(우측 가운데) 자리 */
    text-decoration: none; color: var(--text);
  }
  .lrq-avatar { width: 26px; height: 26px; object-fit: cover; border: 1px solid var(--border); flex-shrink: 0; }
  .lrq-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .lrq-l1 { font-size: 13px; font-weight: 700; line-height: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrq-l1 .lrq-label { font-size: 11px; color: var(--muted); font-weight: 600; margin-left: 6px; }   /* 멤버명-라벨 간격 6px — 이벤트 탭 .event-member 규칙과 동일 */
  .lrq-l2 { color: var(--text3); font-size: 12px; line-height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* 이벤트 탭 .event-detail과 동일 톤·1줄 말줄임 */
  .lrq-link:hover .lrq-l2 { color: var(--accent); }
  /* 체크박스(구 ✕ 대체): '확인함/좋아요 눌러줌' 토글 저장 — 행은 목록에 남고 재클릭으로 해제 가능(✕는 캐시 삭제 없이는 복구 불가였음) */
  .lrq-check {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 20px; height: 20px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(7,10,20,0.72); border: 1px solid var(--border);
    color: transparent; cursor: pointer;    /* 체크 글리프는 상시 렌더·미체크 땐 투명 — 토글이 행 클래스 하나로 끝난다 */
  }
  .lrq-check svg { width: 14px; height: 14px; display: block; }
  .lrq-check:hover { background: var(--surface2); border-color: var(--muted); }
  .lrq-row.checked .lrq-check { border-color: rgba(52, 211, 153, 0.7); background: rgba(52, 211, 153, 0.10); color: #6ee7b7; }
  .lrq-row.checked .lrq-link { opacity: 0.5; }   /* 처리한 요청은 살짝 가라앉힘(목록엔 남음) */
  /* 다가오는 일정: 버튼 카운트다운 + 모달 리스트(좋아요 모달의 lr-overlay 골격 재사용) */
  /* 같은 날 2건+ 일정 묶음: 제목 행 위 / 각 제목 아래 같은 열에 그 일정의 dtime(열 정렬). 폭은 내용으로 관리(컷·말줄임 없음). */
  .sch-grid { display: grid; column-gap: 6px; row-gap: 1px; }   /* 점이 자체 칸 → gap이 점 양옆에 붙으므로 6px(점 포함 총 ~16px, 점 추가 전 간격과 동일) */
  .sch-grid .sch-col-title { white-space: nowrap; }   /* 색 미지정 = 버튼 기본색(민트) 상속, 단일 일정 제목과 동일 */
  .sch-grid .sch-btn-dtime { color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sch-grid .sch-dtime-merged { grid-column: 1 / -1; }   /* dtime이 전부 같을 때 한 칸으로 병합(전 열 span) */
  .sch-grid .sch-sep { opacity: .55; }   /* 일정 사이 가운뎃점 — 민트 상속, 구분자로 읽히게 약간 옅게 */
  .sch-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 16px;
    min-height: 66px;   /* 아바타 최대 2행(42) + 상하 패딩 24 — 멤버 0·1·2행 무관 행 높이 고정(content-card-info와 동일 사유) */
    border-bottom: 1px solid var(--border);
  }
  .sch-item:last-child { border-bottom: none; }
  .sch-item-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .sch-item-when { font-size: 11px; color: var(--text2); font-weight: 600; }   /* 사실 값(시각) = 2차(2026-09-04 대비 점검: 11px 캡션 중 시각·날짜·길이·축 숫자는 4차 회색이 아니라 2차 — 무채색은 유지) */
  .sch-item-title {
    font-size: 14px; color: var(--text); font-weight: 700;
    text-decoration: none; display: inline-flex; align-items: center; gap: 4px; min-width: 0;   /* gap 4(구 6): 종류 그림끼리·그림-제목 사이가 넓어 보였다(2026-09-03 Crenop) */
  }
  a.sch-item-title:hover { color: var(--accent); }
  .sch-item-title svg { width: 12px; height: 12px; opacity: 0.7; flex-shrink: 0; }
  .sch-item-title .cal-tag { margin-right: 0; display: inline-flex; }   /* 달력 칸용 오른쪽 3px 여백은 여기선 flex gap이 맡는다 — 겹치면 9px이 됐다 */
  .sch-item-title .cal-tag svg { opacity: 1; width: 16px; height: 16px; vertical-align: -3px; }   /* 종류 그림은 흐리지 않게 — 0.7은 바깥 화살표용. 16px = 제목 14px 글자 높이에 맞춤(2026-09-02 Crenop) */
  .sch-item-members {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
    flex-shrink: 0;
    justify-content: flex-end;
    max-width: 132px;   /* 20px×6 + gap 2px×5 = 130 → 7명째부터 2행 (컨텐츠·현수막 카드와 동일, 7명+는 membersRowStyle이 인라인으로 좁힘) */
    margin-left: auto;  /* 멤버 블록을 D-day 쪽으로 붙임 — 제목이 짧아도 오른쪽 정렬 유지 */
  }
  .sch-item-members img {
    width: 20px; height: 20px;
    object-fit: cover;
    border: 1px solid var(--border);
  }
  /* ── 일정 모달 달력 뷰(2026-08-10) ──
     통계 탭 .calendar-* 부품을 그대로 쓰고, 월 단위가 아니라 '오늘 주 ~ 마지막 일정 주'를 세로로 잇는다(월 경계 없음).
     한 칸이 74px(모바일 50px)뿐이라 칸에는 점만 두고, 날짜를 누르면 그 주 아래로 상세가 펼쳐진다.
     스크롤바 자리(both-edges): 스크롤 유무로 달력 폭이 바뀌지 않게 좌우에 같은 폭을 비워둔다 — 일정 모달에서만(다른 모달 레이아웃 불변). */
  /* 두 뷰 높이 통일(2026-08-11 재작업) — 반드시 '패널의 height'로 준다.
     [폐기된 방식] 본문(.lr-body)에 min-height를 박으면, flex 자식의 min-height가 부모의 max-height(80vh)를 이겨
       본문이 패널을 뚫고 나온다(실제 발생). height는 max-height가 이기므로 상한이 저절로 지켜진다.
     본문은 flex로 남는 공간을 채우고, 내용이 넘치면 자기 스크롤로 처리(min-height:0 = flex 자식이 콘텐츠보다 작아질 수 있게). */
  /* 목록 끝 표시: 짧은 뷰 아래 빈 공간이 남을 때 '내용은 여기까지'를 알린다.
     목록은 행마다 구분선이 이어지는 구조라 자연스럽지만, 달력은 선이 없는 구조라 붙이지 않는다(2026-08-11 확정).
     자체 border-top은 두지 않는다 — 끝 표시가 붙으면 마지막 .sch-item이 :last-child가 아니게 되어 그 행의 밑선이 살아나므로,
     여기서 윗선을 또 그으면 1px 두 개가 맞닿아 그 선만 굵어 보인다(2026-08-11 수정). */
  .sch-end { padding: 12px 0; text-align: center; color: var(--muted); font-size: 11px; font-weight: 600; }   /* 달력 접힘 안내(.sch-gap)와 같은 톤 — 두 뷰가 같은 말투로 '없음'을 알린다 */
  .sch-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    padding: 10px 12px 2px; position: sticky; top: 0; background: var(--surface); z-index: 2;
  }
  .sch-week { padding: 0 12px; }
  .sch-week + .sch-week { margin-top: 4px; }
  .sch-week .calendar-day { cursor: default; }                                        /* 통계 달력은 모든 칸이 클릭 대상이지만 여기선 일정 있는 날만 */
  .sch-week .calendar-day:not(.sch-has):hover { border-color: transparent; }
  .sch-week .calendar-day.past { opacity: 0.25; }                                     /* 이번 주 중 지나간 날 */
  .sch-week .calendar-day.sch-has { cursor: pointer; }   /* v7: 민트 음영 제거(Crenop 지정) — film+N 칩이 컨텐츠 유무를 담당 */
  .sch-week .calendar-day.sch-has:hover { border-color: var(--accent); }
  .sch-week .calendar-day.sch-open { border-color: var(--accent); }
  .calendar-daynum.sch-mo { font-size: 12px; }                                        /* 그 달이 처음 등장하는 칸: 9/1 형태(두 토막이라 살짝 작게) */
  .sch-week .calendar-daynum { color: var(--text); }   /* v6: 평일 날짜는 기본색 — sch-has 민트 상속 차단(요일색 문법, 셀 배경 민트는 유지) */
  .sch-cnt { margin-top: 1px; }   /* v6: 점 → film+실개수 칩(통계 문법) — .cd-chip.vod 공용 스타일 사용 */
  .sch-detail { border: 1px solid var(--border); background: var(--bg); margin-top: 4px; }   /* 윗변 포함 사방 테두리(2026-08-11) — 주 그리드와 상세를 확실히 가른다 */
  .sch-detail:empty { display: none; }
  .sch-gap {
    margin: 8px 12px; padding: 8px 0; text-align: center;
    border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border);
    color: var(--muted); font-size: 11px; font-weight: 600;
  }
  .sch-item-dday {
    font-size: 13px; color: var(--accent); font-weight: 700;
    white-space: nowrap; flex-shrink: 0; font-variant-numeric: tabular-nums;
    /* 폭 고정(2026-08-07): 'D-DAY'(5자)와 'D-1'(3자)의 폭이 18px쯤 달라 그만큼 앞의 아바타 줄이
       좌우로 밀렸다. 가장 넓은 'D-DAY' 기준으로 바닥을 깔고 오른쪽 정렬 — 'D-999'까지 여유 있게 들어간다. */
    min-width: 44px; text-align: right;
  }
  .celebration-box {
    display: flex;
    align-items: center;
    gap: 10px;   /* .page-title-link과 동일 — 내부 간격 10px(2026-08-09 비교 확정) */
    padding: 5px 10px;   /* .page-title-link과 같은 값 — 같은 줄에 서므로 높이가 어긋나면 안 된다 */
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
    flex-shrink: 0;
    text-decoration: none;
    cursor: pointer;
    background: rgba(var(--btn-rgb), 0.12);   /* 색은 인라인 --btn-rgb(멤버색) — .page-title-link과 같은 비율표, 호버도 공통 규칙 */
    border: 1px solid rgba(var(--btn-rgb), 0.4);
    transition: background 0.15s, border-color 0.15s;
  }
  .celebration-box svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: -1px; }   /* .page-title-link svg와 동일 사유 */
  /* 보조바 버튼의 PC↔모바일 변형 토글 (기본=PC 긴 라벨, 짧은 라벨은 1100px 미디어쿼리에서 표시).
     함께 있던 .nav-label-mb·.nav-live-dot-m은 탐색 UI 맞바꾸기로 쓰임이 사라져 폐지(2026-08-31). */
  .tb-t-mb { display: none; }
  .header-center {
    text-align: right; color: var(--muted);
    font-size: 12px; min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }
  .header-center-line {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 100%;
  }
  .header-disclaimer {
    font-size: 11px;
    opacity: 0.75;
  }

  /* 컨테이너 쿼리 기준점: 각 탭 콘텐츠 영역(뷰포트가 아닌 실제 폭) 기준으로 열 수/전환 판단 → 좌측 사이드바·패딩 자동 반영 + 멤버 증가 대응 */
  #app, #statsBody, #linksBody, #membersBody, .hall-main, .cal-main { container-type: inline-size; }   /* .hall-main: 기둥을 뺀 본문 폭 기준(2026-09-01) — .hall-wrap이면 기둥 폭까지 세어 카드가 기둥 위로 넘쳤다 */

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px; padding: 22px 30px;
    max-width: 1520px; width: 100%; margin: 0 auto;
    flex: 1;
  }
  /* ── 정전 타이머(2026-08-07) — 전원 오프라인일 때 카드 묶음을 흐리고 그 위에 경과 시간을 얹는다 ──
     흐림은 .grid에만 건다. #app에 걸면 문구까지 같이 흐려진다(문구는 .grid의 형제).
     문구를 sticky로 두는 이유: 카드 13장이 두 화면 넘게 이어져서, 오버레이 한가운데에 두면
     스크롤 안 한 첫 화면에서는 문구가 화면 밖에 있다. sticky면 어디를 보고 있든 화면 중앙에 붙는다. */
  #app { position: relative; }
  .grid.blackout { filter: blur(5px) grayscale(0.35); }
  .blackout-overlay { position: absolute; inset: 0; z-index: 2; cursor: pointer; }
  .blackout-msg {
    position: sticky; top: 42vh;
    width: fit-content; margin: 0 auto;         /* 내용 크기만큼 감싸고 가로 중앙 — sticky는 세로만 담당 */
    text-align: center; padding: 20px 32px;     /* 여백 확대(2026-08-10 2차: 구 14/26이 좁다는 피드백) */
    background: rgba(7, 10, 20, 0.45);          /* 테두리 없는 순수 스크림(3차 확정): 뒤가 어두우면 어둡게, 밝은 썸네일이면 비쳐 보임. 조절은 이 알파값 하나 */
    font-size: 22px; font-weight: 800; color: var(--text);
    line-height: 1.25;                          /* 1.45→1.25: 반행간이 위(22px줄 +5px)·아래(30px줄 +7px)에 다르게 붙어 여백이 불균일해 보이던 원인 — 조여서 패딩이 여백을 지배하게 */
    text-shadow: 0 2px 14px rgba(0,0,0,0.85);
  }
  .blackout-time {
    display: block; margin-top: 12px;
    font-size: 30px; color: var(--accent);
    font-variant-numeric: tabular-nums;   /* 초가 흘러도 글자 폭이 안 흔들리게 */
  }
  @container (min-width: 1500px) { .grid { grid-template-columns: repeat(5, 1fr); } }   /* 13인 홈 역할: 넓은 화면에서 전원 한눈에(5+5+3) — 2026-08-02 확정 */
  @container (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @container (max-width: 800px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @container (max-width: 520px) { .grid { grid-template-columns: 1fr; } }

  .card {

    text-decoration: none; color: inherit;

    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;

  .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 8px 24px rgba(97,255,236,0.18); }
  .card.live { border-color: var(--accent); }
  .card.live:hover { border-color: var(--accent); box-shadow: 0 8px 24px rgba(97,255,236,0.18); }


  .card.offline .card-thumb { opacity: 0.4; }
  .card.offline .card-name { color: var(--muted) !important; }
  .card.vacation .card-thumb { opacity: 0.85; filter: saturate(0.75); }
  .card.vacation .card-thumb .placeholder img { max-width: 100%; max-height: 100%; opacity: 1; object-fit: cover; }

  .card-thumb {
    width: 100%; aspect-ratio: 16/9;

  .card-thumb .placeholder {

  .placeholder-mode-text {
    font-size: 12px; font-weight: 600;

  }
  /* 모드 배지 3종(.badge-mode/.event-mode-tag/.day-session-mode): SVG 도형 렌더(2026-07-13) — nav 숫자 배지와 동일 사유.
     테두리(rect)·글자(패스)가 한 SVG 좌표계의 기하라 배율 무관 정중앙이며, 각 배지가 자기 라벨의 잉크를 박스 중앙에 둠(라벨별 광학 중앙 — 확정).
     크기도 3곳 통일: 높이19 · min-width46 · 글자 11px 상당 · 테두리1.5 · 자간0.3 (구 3종은 20/19/~15px로 근거 없이 달랐음 — 통합 확정, 산정은 modeBadgeSvg()).
     색은 기존 색 클래스(currentColor 상속) 그대로. */
  .badge-mode {

  }

  .card-btime {
    font-size: 11px;

  .events-wrap {
    padding: 20px 24px;

  }
  /* 필터를 서랍으로 보내며 칸을 비우는 규칙은 아래 태블릿 블록(1150px)이 다른 탭들과 함께 가진다(2026-09-02 이동) —
     여기 1100px으로 따로 두었더니 1101~1150 구간에서만 필터는 서랍인데 격자는 280px 칸을 그대로 비워
     본문이 300px 좁아진 채 왼쪽으로 쏠렸다(Crenop 실사고 보고: 최근 활동·케미만 그랬던 이유가 이것).
     구 규칙(필터를 이벤트 위 strip으로, position:static !important)은 2026-08-31 폐지 — !important가 남으면
     서랍의 position:fixed를 덮어 서랍이 안 열린다(실제로 그랬음). */
  .timeline { background: var(--surface); border: 1px solid var(--border); border-top: none; min-width: 0; }   /* 윗변은 sticky 헤더가 가짐(2026-08-09) — 헤더가 20px 떠 있어도 rest 상태 박스 윗변이 그대로 */
  .timeline-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px; }

  /* 기둥은 테두리를 두지 않는다(2026-09-01) — .side-pick과 같은 규칙.
     종전엔 여기 background·border·padding이 그대로 남아 최근 활동·케미만 박스가 보였다(실사고). */
  .filter-panel { position: sticky; top: calc(var(--head-h, 0px) + 20px); }
  /* 기둥 오른쪽 44px 빈 슬롯과 짝이 되는 왼쪽 44px — 기둥을 쓰는 탭 전부에 같은 값(2026-09-01 전수 적용) */
  .events-wrap > .timeline, .chem-wrap > .chem-content { margin-left: 44px; }
  .filter-section + .filter-section {
    margin-top: 20px; padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .filter-title {
    font-size: 13px; font-weight: 700;   /* 토글 설명(.hall-bar-label)과 같은 값 — 가독성 우선(2026-09-01 Crenop) */
    color: var(--muted); letter-spacing: 1px;
    margin-bottom: 6px;   /* 필터 항목 간격(grid/flex gap 6px)과 일치 */
  }
  /* 멤버/종류 그리드 좌측에 '모두 선택/해제' 버튼 — 버튼은 그리드 높이만큼 stretch. 전체 관련 액션이라 좌측 배치(크루소개 등과 동일 패턴) */
  .filter-row { display: flex; gap: 6px; align-items: stretch; padding-right: 44px; }   /* 오른쪽 44px = 연/월의 '›' 슬롯 — 비워 두어야 칸 크기가 같아진다 */
  /* 외곽선 알약 버튼. 좁은 세로 버튼 — 폭 좁으면 '모두/선택' 2줄(keep-all) 자동 분리. 이벤트·케미 필터 공용 */
  .filter-toggle-all {
    width: 38px;
    flex-shrink: 0;

  }

  /* 3열 고정(2026-08-31): 좁은 폭에서 7열로 눕히던 규칙 3개(멤버·종류·케미멤버)를 폐지했다.
     그건 필터가 '위쪽 가로 띠'였을 때의 배치인데, 이제 그 폭에서 필터는 우측 서랍(세로)이라 근거가 사라졌다.
     서랍 폭도 PC 기둥과 같은 280px라 칸 크기가 PC와 같아진다. */
  .filter-members { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1; min-width: 0; }
  .filter-member {
    position: relative;
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer; overflow: hidden;
    transition: all 0.15s; padding: 0;
  }
  .filter-member img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: opacity 0.15s;
  }
  .filter-member:not(.on) img { opacity: 0.25; filter: grayscale(1); }
  .filter-member:not(.on) { border-color: transparent; }
  .filter-member.on { border-color: var(--accent); }
  .filter-member:hover { border-color: var(--accent); }

  /* 종류 필터: 멤버와 동일한 정사각 셀(아이콘 위·라벨 아래). 열 수를 멤버와 맞춰 셀 크기 일치(PC 3열/모바일 6열). 5종 + 모두선택 좌측 */
  /* 종류 필터: 아이콘 전용(텍스트 제거). 정사각 셀에 SVG만 크게 강조, 의미는 title 툴팁으로 보존. PC 3열·모바일 6열로 멤버 그리드와 셀 크기 동일 */
  .filter-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1; min-width: 0; }
  .filter-type {
    display: flex; align-items: center; justify-content: center;
    color: var(--text);   /* 이 규칙에만 색 선언이 빠져 있어 버튼의 UA 기본색(검정)이 나왔다. 같은 판의 다른 글자 버튼(모두 해제)은 색을 갖고 있어 멀쩡했다 */
    aspect-ratio: 1;
    min-height: 0; overflow: hidden;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer; transition: all 0.15s;
  }
  /* 케미 종류 = 아이콘 위 · 글자 아래. 아이콘은 '무엇 계열인지', 글자는 '정확히 무엇인지'를 맡는다 */
  .filter-type:has(.filter-lbl) { flex-direction: column; gap: 3px; }
  .filter-type:has(.filter-lbl) .filter-icon { width: 40%; height: 40%; }
  .filter-type .filter-lbl { font-size: 12px; font-weight: 600; line-height: 1; }
  .filter-type:hover { border-color: var(--accent); }
  .filter-type.on { border-color: var(--accent); }
  .filter-type:not(.on) { opacity: 0.35; }
  .filter-type:not(.on):hover { opacity: 0.6; }
  .filter-type .filter-icon { width: 55%; height: 55%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .filter-type .filter-icon svg { width: 100%; height: 100%; }   /* SVG에 박힌 width/height 무시하고 셀 비례로 스케일(비율은 meet로 유지) */
  /* 모바일 strip: 종류도 멤버와 동일 6열(5종 + 우측 빈칸 1) */
  .filter-type[data-type="soop"] .filter-icon { color: var(--ev-start); }
  .filter-type[data-type="chat"] .filter-icon { color: #a78bfa; }
  .filter-type[data-type="post"] .filter-icon { color: var(--ev-post); }
  .filter-type[data-type="youtube"] .filter-icon { color: var(--ev-youtube); }
  .filter-type[data-type="cafe"] .filter-icon { color: #03C75A; }

  .event-elapsed svg { width: 12px; height: 12px; vertical-align: -1.5px; }   /* 시계 아이콘(구 ⏱) — 인라인 흐름 유지(밖 텍스트와 베이스라인 공유), 아이콘만 눈맞춤 오프셋 */
  .event-action { color: var(--muted); }
  .event-target { color: var(--text2); margin-left: 4px; display: inline-block; text-wrap: balance; }   /* 괄호는 하나의 덩어리 — inline이면 앞 텍스트와 섞여 중간에서 끊기므로 inline-block으로 묶음. 한 줄에 안 들어가면 통째로 다음 줄로, 카페명처럼 길면 본문 폭 안에서 덩어리 내부 줄바꿈(좁은 모바일 가로 overflow 방지). 짧은 '(X 방송)'은 공간 되면 앞 조각과 같은 줄. balance(2026-08-09): 여러 줄로 꺾일 때 줄 길이를 반반씩 균등 분배 — "…모집합니다 / ~!!")"처럼 꼬리만 남는 고아 줄 방지. 줄 수는 안 늘어 카드 높이 불변, 미지원 브라우저는 기존 동작 그대로 */
  /* 멤버명·액션라벨·경과시간은 짧으니 각각 한 줄 고정(조각 내부 중간이 안 끊김). */
  .event-member, .event-action-label, .event-elapsed { white-space: nowrap; }
  .event-mode-tag {
    display: inline-block;
    margin-left: 0; margin-right: 6px;

  }
  .event-mode-tag.adult { color: var(--mode-adult); }
  .event-mode-tag.subscription { color: var(--mode-subscription); }
  .event-mode-tag.copyright { color: var(--mode-copyright); }
  .event-mode-tag.password { color: var(--mode-password); }
  .event-mode-tag.restricted { color: var(--mode-restricted); }
  .event-detail {

    white-space: nowrap;   /* 기본 1줄 고정(PC·일반 모바일) — 날짜/시간 inline */
  }
  /* 좁은 화면(≤480px)에서만 날짜·시간 2줄 분리. '좁을때'를 480px로 정의 — 이 숫자만 바꾸면 조정됨 */
  @media (max-width: 480px) {
    .event-time-abs .ev-abs-d { display: block; }
  }
  /* 채팅 묶음: 같은 채널에서 감지 주기 연속(25초 이내)으로 이어진 대화를 한 아이템으로. 내부는 과거→최신, 클릭 없이 전체 노출 */
  .chat-bundle-rows {
    margin-top: 6px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .chat-bundle-row {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 12px; line-height: 1.45;
    color: inherit; text-decoration: none;
  }
  .chat-bundle-row:hover .cbr-msg { color: var(--accent); }
  .cbr-time { color: var(--text2); font-size: 11px; flex-shrink: 0; }   /* 사실 값(시각) = 2차 */
  .cbr-name { font-weight: 700; flex-shrink: 0; }
  .cbr-msg { color: var(--text3); min-width: 0; overflow-wrap: anywhere; }
  /* 아이콘+텍스트 뱃지: align-items가 center면 baseline 참여 아이템이 없어 박스 하단이 기준선으로 합성 →
     행(baseline 정렬)에서 텍스트가 디센더만큼 위로 뜸. baseline+아이콘만 center로 채팅 행과 기준선 일치 */
  .cbr-don { display: inline-flex; align-items: baseline; gap: 4px; color: #a78bfa; font-weight: 700; }   /* 후원 계열 보라 — 노란색 비선호(Crenop) */
  .cbr-don svg { width: 12px; height: 12px; align-self: center; }
  .cbr-sanction { display: inline-flex; align-items: baseline; gap: 4px; color: #FFA94D; font-weight: 700; }
  .cbr-sanction svg { width: 12px; height: 12px; align-self: center; }
  .cbr-mission { display: inline-flex; align-items: baseline; gap: 4px; color: #a78bfa; font-weight: 700; }
  .cbr-mission svg { width: 12px; height: 12px; align-self: center; }
  .cbr-mtitle { color: var(--muted); }
  .cbr-chan { text-decoration: none; }
  .cbr-chan:hover { text-decoration: underline; }
  .event.chat-bundle { align-items: flex-start; }   /* 다행 묶음: center면 아이콘·아바타·시간이 세로 중앙에 떠 헤더와 분리돼 보임 */
  .chat-bundle-avatars { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }   /* 발화자 사진 세로 나열(겹침 없음) — 묶음이 세로로 자라는 아이템이라 사진 열도 세로가 공간 문법에 맞음 */
  .timeline-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;   /* 좁은 폰: 맨 위로 추가로 4버튼이 한 줄 ~410px 필요 — 안 들어가면 우측 묶음이 다음 줄로 */
    /* sticky(2026-08-09): 이벤트가 최대 1000건이라 중간에서도 조작 가능해야 함 — 모두 읽음·맨 위/아래·정렬이
       스크롤 내내 붙는다. 하단바는 이걸로 완전 중복이 되어 제거(맨 위로 버튼은 이리로 이사).
       top:20px = 필터 패널과 동일 이격. 위 20px 틈으로 카드가 비치는 건 ::before 백드롭(페이지 배경색)이 차단 —
       rest 상태에선 그 자리가 원래 페이지 배경이라 무해. 윗변 테두리는 .timeline에서 이리로 이전. */
    position: sticky; top: calc(var(--head-h, 0px) + 20px); z-index: 3;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  /* 좌표는 패딩 박스 기준: top -21 = 테두리(1px) 위 20px 지점부터.
     높이 21 + border-bottom(2026-08-10): 구 height 20은 아래 끝이 부모 border-top과 '맞닿기만' 해서, 소수 픽셀 배율(모바일 고DPI)에서
     그 경계가 반픽셀 어긋나면 1px 틈으로 카드가 비쳤다. 백드롭이 윗변 선까지 직접 그려 두 면이 한 요소가 되면 벌어질 수 없다.
     부모 border-top은 같은 자리·같은 색으로 남겨 폴백. box-sizing:border-box라 21 = 배경 20 + 선 1. */
  .timeline-header::before { content: ''; position: absolute; left: -1px; right: -1px; top: -21px; height: 21px; background: var(--bg); border-bottom: 1px solid var(--border); }
  .timeline-bar-left, .timeline-bar-right { display: flex; align-items: center; gap: 8px; }   /* 간격 통일(2026-08-09): 버튼 사이·가장자리·행간 전부 상하 패딩과 같은 8px */
  .timeline-scroll-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    transition: color 0.15s, border-color 0.15s;
  }
  .timeline-scroll-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .timeline-scroll-btn svg { width: 12px; height: 12px; display: block; flex-shrink: 0; }   /* 세로는 flex 중앙 = 테두리 기준 정중앙(실측 ±0.5px 이내). 텍스트 쪽이 폰트 특성으로 반픽셀 위에 앉지만, 아이콘을 그에 맞추면 테두리 기준이 틀어진다(2026-08-09 실측 확정 — 정렬 기준은 테두리) */
  .sort-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    transition: color 0.15s, border-color 0.15s;
  }
  .sort-toggle:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .sort-toggle svg { width: 12px; height: 12px; display: block; flex-shrink: 0; }   /* 세로는 flex 중앙 = 테두리 기준 정중앙(실측 ±0.5px 이내). 텍스트 대비 보정은 하지 않는다 — 한글 글리프가 반픽셀 위에 앉는 폰트 특성이라 아이콘을 옮기면 테두리 기준이 틀어짐(2026-08-09 실측 확정) */



  .stats-tabs-wrap {
    display: grid;
    grid-template-columns: repeat(3, 1fr);   /* 우측 기둥 규격 — 이벤트 필터(3열)와 같은 칸.
       종전 14열 가로 스트립은 본문 위에 눕혀 있을 때의 배치였다(2026-08-31 기둥 이전). */
    gap: 6px;
  }

  /* 기간 선택줄: ‹연도› 스테퍼 + [전체][1월..12월] 13버튼(통합탭) / 12버튼(멤버탭, 전체 없음) */
  /* 통합탭 기간줄: ‹연도› 스테퍼 박스 + [전체][1~12월] 13버튼 */
  .stats-period-wrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1; min-width: 0; }   /* 기둥 규격 — 전체1+12칸이 3열로 쌓인다(2026-08-31) */
  /* 정사각형 — 같은 기둥의 멤버 타일·종류 필터와 같은 칸 모양(Crenop 지정). 격자가 전폭이라 78px로 일치한다 */
  .stats-period-wrap { flex: 1; min-width: 0; }
  .stats-period-wrap .stats-period-btn {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    white-space: normal; line-height: 1.15; padding: 3px 2px 1px;   /* 아래 2px 보정 — 명전 기간 버튼과 같은 값(한글 라인박스 아래 여백) */
  }
  .stats-period-btn .pb-y { font-size: 12px; opacity: 0.85; }   /* 월과 같은 크기 — 굵기·농도 차이만으로 위계를 준다 */
  .stats-period-btn .pb-m { font-size: 12px; font-weight: 700; }
  /* 멤버 개별탭: 스테퍼 줄(전폭) + 6열 2행 월 버튼 — 블록 외곽만 달력·요약과 정렬(내부 7열 정렬은 폐기) */
  /* 연도 화살표는 격자 좌우(2026-09-01, 음악 탭 스트립과 같은 자리 문법).

  .stats-period-row { display: flex; align-items: stretch; gap: 6px; }
  .stats-period-row .stats-month-btn { width: 38px; height: auto; align-self: center; }

  .stats-period-btn {

    position: relative;

  /* .stats-tab-all 폐지(2026-08-31): 통합 칸이 통계 탭으로 옮겨가 지난 활동 스트립에서 사라졌다 */

  .stats-grid {

    grid-template-columns: repeat(5, 1fr);   /* 13인: 6열=6+6+1 고아 → 5열(5+5+3). 7열은 카드 라벨이 비좁아 5열 채택(2026-08-02) */

  @container (max-width: 480px) { .stats-grid { grid-template-columns: 1fr; } }   /* 카드 행이 nowrap이라 셀이 ~220px 밑이면 그리드가 넘쳐 가로스크롤 → 항상 그 이상 유지되도록 열 감소 */

    justify-content: center;   /* v2(2026-08-29): 항목 무리는 가운데, 각 항목 내부 텍스트는 좌측정렬 유지 — Crenop 지정 */

     두 장의 창폭↔임계 비율 정합에서 역산한 "8항목이 실제로 안 들어가는 폭"(환산계수 1.515, 배율 무가정).
