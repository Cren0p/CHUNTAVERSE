<!-- Pretendard Variable: 다이내믹 서브셋(화면에 쓰인 글자의 woff2만 로드) — 기기별 시스템 한글폰트 메트릭 차이(배지 세로정렬 등) 제거 목적. CDN 장애 시 아래 스택의 시스템 폰트로 폴백(font-display: swap). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root {
    --tag-valign: -6px;      /* 타임라인 모드 배지(19px SVG) 줄 정렬 — 배지 박스 중심을 제목(400·12px) 잉크 중심에. calibrateBadgeValign() 실측 주입, 폴백은 정적 근사 */
    --daytag-valign: -5.5px; /* 통계 일별 모드 배지 줄 정렬 — 제목(600·13px) 문맥. 상동 */
    --bg: #070a14;
    --surface: #0d1120;
    --surface2: #131929;
    --border: #1e2740;
    --live: #ff3b3b;
    --live-glow: rgba(255,59,59,0.25);
    --accent: #61FFEC;
    --accent2: #61FFEC;
    --text: #e2e8f0;
    --muted: #64748b;
    --time: #fbbf24;
    --ev-start: #60a5fa;
    --ev-end: #f87171;
    --ev-yellow: #fbbf24;
    --ev-post: #34d399;
    --ev-youtube: #ef4444;
    --ev-unread: #61FFEC;
    --mode-adult: #f87171;
    --mode-subscription: #f59e0b;
    --mode-copyright: #38bdf8;
    --mode-password: #cbd5e1;
    --mode-restricted: #a78bfa;
    --filter-post: #2EF5E1;
    --sidebar-w: 200px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 전역 미니멀 스크롤바 (초미니 6px·거의 안 보이다 hover 시 진해짐). webkit=Edge/Chrome/Safari, scrollbar-*=Firefox */
  * { scrollbar-width: thin; scrollbar-color: rgba(226,232,240,0.14) transparent; }
  *::-webkit-scrollbar { width: 6px; height: 6px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: rgba(226,232,240,0.14); }   /* 각진 정책 정합: 썸도 사각(원형은 상태 점에만 허용) */
  *::-webkit-scrollbar-thumb:hover { background: rgba(226,232,240,0.3); }
  html, body { min-height: 100vh; }
  html { scrollbar-gutter: stable; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard Variable', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 35%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(2px 2px at 15% 50%, rgba(97,255,236,0.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    z-index: 2;
    flex-shrink: 0;
  }
  .sidebar-logo {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    text-align: center;
    min-height: 66px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sidebar-logo img { max-width: 100%; max-height: 32px; height: auto; display: block; cursor: pointer; }
  .nav-list { padding: 8px 0; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 20px; color: var(--muted);
    cursor: pointer; font-size: 14px; font-weight: 600;
    border: none; background: none; text-align: left;
    width: 100%; font-family: inherit;
    border-left: 3px solid transparent;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
    position: relative;
  }
  .nav-item:hover { color: var(--text); background: var(--surface2); }
  .nav-item.active { color: var(--accent2); background: var(--surface2); border-left-color: var(--accent); }
  .nav-icon {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    vertical-align: middle;
  }
  .nav-icon svg { width: 16px; height: 16px; display: block; vertical-align: middle; }
  .nav-events-label { position: relative; display: inline-flex; align-items: center; }
  /* 안읽음 숫자 배지: SVG 도형 렌더(2026-07-13) — 박스(rect)와 숫자(패스)가 한 좌표계의 기하라 배율 무관 정중앙.
     폰트 텍스트는 글리프 힌팅이 ppem마다 착지를 ±1px 스냅(배율 따라 반전 실측 — geometricPrecision 실험도 무효)해 어떤 보정으로도 불가했음.
     크기 문법(높이14=구 lh12+상하패딩2 · min-width16 · 좌우패딩5 · 숫자 10px 상당)은 navBadgeSvg()가 동일 유지. */
  .nav-badge {
    position: absolute;
    top: -6px; right: -10px;   /* 라벨 우상단 위로(superscript) — 흐름을 차지하지 않아 라벨이 밀리거나 줄바꿈되지 않음 */
  }
  .nav-badge svg { display: block; }
  .nav-badge rect { fill: var(--ev-unread); }
  .nav-badge path { fill: var(--bg); }
  .nav-live-badge {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    background: var(--surface2);
    min-height: 17px;   /* 구 높이 앵커 — 텍스트 라인박스(11px×lh normal≈13)+패딩4가 만들던 17px을, 숫자가 SVG(≈8px)로 바뀌며 명시값으로 대체 */
    color: var(--muted);
    transition: color 0.15s;
  }
  /* 카운트 숫자 = SVG 도형(nav-badge와 동일 사유). SVG 박스=숫자 잉크 경계라 flex 중앙정렬이 곧 잉크 중앙정렬. 색은 currentColor로 on/off 상태 상속 */
  .nav-live-count svg { display: block; }
  .nav-live-count path { fill: currentColor; }
  .nav-live-dot {
    width: 7px;
    height: 7px;
    background: var(--muted);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .nav-live-badge.on {
    color: var(--text);
    background: rgba(255,59,59,0.12);
  }
  .nav-live-badge.on .nav-live-dot {
    background: var(--live);
    box-shadow: 0 0 6px var(--live-glow);
    animation: pulse 1.8s ease-in-out infinite;
  }

  .nav-notify-bell {
    margin-left: auto;            /* events 행 우측 끝으로 */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--muted);         /* 무채색 = 알림 꺼짐 */
    cursor: pointer;
    transition: color 0.15s;
  }
  .nav-notify-bell svg { width: 20px; height: 20px; display: block; overflow: visible; }
  /* ON/OFF를 색(앰버↔무채)·모양(웨이브 선 유무)으로 구별 + 켤 때 1회 애니메이션 */
  .nav-notify-bell .ring-wave { opacity: 0; }                   /* OFF: 양옆 웨이브 선 숨김 (모양 단서) */
  .nav-notify-bell.on { color: #fbbf24; }                       /* ON: 앰버색 (색 단서, 민트 아닌 별도색) */
  .nav-notify-bell.on .ring-wave { opacity: 1; }                /* ON 정지: 양옆 웨이브 선 정적 표시 (currentColor=앰버) */
  .nav-notify-bell:not(.on):hover { color: var(--text); }
  /* 클릭으로 켤 때 1회만 (.ringing은 JS가 붙였다 뗌) — 상시 흔들리지 않음 */
  .nav-notify-bell.ringing svg { transform-origin: 50% 12%; animation: bell-ring 0.9s ease-in-out; }
  .nav-notify-bell.ringing .ring-wave { animation: ring-wave-flash 0.9s ease-out; }
  @keyframes bell-ring {
    0%   { transform: rotate(0); }
    15%  { transform: rotate(17deg); }
    30%  { transform: rotate(-15deg); }
    45%  { transform: rotate(11deg); }
    60%  { transform: rotate(-7deg); }
    75%  { transform: rotate(4deg); }
    88%  { transform: rotate(-2deg); }
    100% { transform: rotate(0); }
  }
  @keyframes ring-wave-flash {
    0%   { opacity: 0; }
    20%  { opacity: 1; }
    60%  { opacity: 0.8; }
    100% { opacity: 1; }                                        /* ON 정지값(1)으로 안착 — 끝에서 사라졌다 튀지 않게 */
  }
  @media (prefers-reduced-motion: reduce) {
    .nav-notify-bell.ringing svg, .nav-notify-bell.ringing .ring-wave { animation: none; }
  }
  .notify-switch {
    position: relative;
    width: 36px;
    height: 20px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
    padding: 0;
    box-sizing: border-box;
  }
  .notify-switch::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    background: var(--muted);
    top: 50%;
    left: 2px;
    transform: translateY(-50%);
    transition: transform 0.18s, left 0.18s, background 0.18s;
  }
  .notify-switch.on { border-color: var(--accent); }
  .notify-switch.on::after { left: 19px; transform: translateY(-50%); background: var(--accent); }

  .main {
    flex: 1; min-width: 0;
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
  }
  .main-header {
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(97,255,236,0.05) 0%, transparent 100%);
    display: flex; align-items: center; gap: 16px;
    min-height: 66px;
  }
  .page-title {
    flex-shrink: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .page-title-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: rgba(96,165,250,0.12);
    border: 1px solid rgba(96,165,250,0.4);
    color: #93c5fd;
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
    transition: background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .page-title-link:hover { background: rgba(96,165,250,0.22); border-color: rgba(96,165,250,0.7); }
  .page-title-link svg { width: 16px; height: 16px; flex-shrink: 0; }
  /* 좋아요 요청 모아보기 버튼: page-title-link 골격에 comment_recommend 색(에메랄드, --ev-post 계열) 적용 */
  button.page-title-link.like-req-btn {
    background: rgba(52,211,153,0.12);
    border: 1px solid rgba(52,211,153,0.4);
    color: #6ee7b7;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    position: relative;
  }
  button.page-title-link.like-req-btn:hover { background: rgba(52,211,153,0.22); border-color: rgba(52,211,153,0.7); }
  /* 안 본 새 좋아요 요청이 있으면 버튼 우상단 빨간 점 */
  .like-req-btn.has-new::after {
    content: ''; position: absolute; top: -3px; right: -3px;
    width: 9px; height: 9px; border-radius: 50%;
    background: #f87171; box-shadow: 0 0 0 1.5px var(--bg);
  }
  /* 일정 버튼: 천타버스 메인 민트(--accent) 박스 — 좋아요(에메랄드)·블루발(파랑)과 색으로 구분 */
  button.page-title-link.sch-btn {
    background: rgba(97,255,236,0.12);
    border: 1px solid rgba(97,255,236,0.4);
    color: var(--accent);
    cursor: pointer;
    font-family: inherit;
    text-align: left;
  }
  button.page-title-link.sch-btn:hover { background: rgba(97,255,236,0.22); border-color: rgba(97,255,236,0.7); }
  /* 두번째 커버곡 버튼: 핑크(#ec4899 계열) — 첫 커버곡(파랑)·좋아요(에메랄드)·일정(민트)과 구분 */
  /* 시트 기반 상단바 버튼(구 cover2-btn 대체): 색은 F열 hex → --tb-rgb 인라인 변수, 배경 12%·테두리 40%·호버 22%/70% */
  .page-title-link.tb-sheet-btn {
    background: rgba(var(--tb-rgb), 0.12);
    border: 1px solid rgba(var(--tb-rgb), 0.4);
  }
  .page-title-link.tb-sheet-btn:hover { background: rgba(var(--tb-rgb), 0.22); border-color: rgba(var(--tb-rgb), 0.7); }
  .lr-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.65);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .lr-overlay[hidden] { display: none; }
  .lr-panel {
    background: var(--surface);
    border: 1px solid rgba(52,211,153,0.4);
    width: 100%; max-width: 560px;
    max-height: 80vh;
    display: flex; flex-direction: column;
  }
  .lr-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px; font-weight: 700; color: var(--ev-post);
  }
  .lr-head > span:first-child { display: inline-flex; align-items: center; gap: 6px; }
  .lr-head svg { width: 15px; height: 15px; display: block; }
  .lr-close {
    background: none; border: none; color: var(--muted);
    font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 6px;
  }
  .lr-close:hover { color: var(--text); }
  .lr-body { overflow-y: auto; }
  .lr-msg { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 12px; }
  /* 좋아요 요청 개별 숨김 ✕ (카드 우상단 오버레이) */
  .lr-item { position: relative; }
  .lr-item .event { padding-right: 38px; }   /* ✕(우상단) 자리 확보 — 상대시간과 겹침 방지 */
  .lr-item .event-icon { display: none; }   /* 모달엔 좋아요 요청만 모이므로 타입 구분용 따봉 아이콘 불필요(이벤트 탭은 유지). flex 항목 제거라 좌측 빈칸·gap 안 남음 */
  .lr-dismiss {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(7,10,20,0.72); border: 1px solid var(--border);
    color: var(--muted); font-size: 12px; line-height: 1; cursor: pointer;
  }
  .lr-dismiss:hover { color: var(--text); background: var(--surface2); border-color: var(--muted); }
  /* 다가오는 일정: 버튼 카운트다운 + 모달 리스트(좋아요 모달의 lr-overlay 골격 재사용) */
  .sch-btn-dday { color: var(--accent); font-variant-numeric: tabular-nums; }
  /* 같은 날 2건+ 일정 묶음: 제목 행 위 / 각 제목 아래 같은 열에 그 일정의 dtime(열 정렬). 폭은 내용으로 관리(컷·말줄임 없음). */
  .sch-grid { display: grid; column-gap: 6px; row-gap: 1px; }   /* 점이 자체 칸 → gap이 점 양옆에 붙으므로 6px(점 포함 총 ~16px, 점 추가 전 간격과 동일) */
  .sch-grid .sch-col-title { white-space: nowrap; }   /* 색 미지정 = 버튼 기본색(민트) 상속, 단일 일정 제목과 동일 */
  .sch-grid .sch-btn-dtime { color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sch-grid .sch-dtime-merged { grid-column: 1 / -1; }   /* dtime이 전부 같을 때 한 칸으로 병합(전 열 span) */
  .sch-grid .sch-sep { opacity: .55; }   /* 일정 사이 가운뎃점 — 민트 상속, 구분자로 읽히게 약간 옅게 */
  .sch-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 16px;
    min-height: 66px;   /* 아바타 최대 2행(42) + 상하 패딩 24 — 멤버 0·1·2행 무관 행 높이 고정(content/banner-card-info와 동일 사유) */
    border-bottom: 1px solid var(--border);
  }
  .sch-item:last-child { border-bottom: none; }
  .sch-item-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .sch-item-when { font-size: 11px; color: var(--muted); font-weight: 600; }
  .sch-item-title {
    font-size: 14px; color: var(--text); font-weight: 700;
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-width: 0;
  }
  a.sch-item-title:hover { color: var(--accent); }
  .sch-item-title svg { width: 12px; height: 12px; opacity: 0.7; flex-shrink: 0; }
  .sch-item-members {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
    flex-shrink: 0;
    justify-content: flex-end;
    max-width: 132px;   /* 20px×6 + gap 2px×5 = 130 → 7명째부터 2행 (컨텐츠·현수막 카드와 동일, 7명+는 membersRowStyle이 인라인으로 좁힘) */
    margin-left: auto;  /* 멤버 블록을 D-day 쪽으로 붙임 — 제목이 짧아도 오른쪽 정렬 유지 */
  }
  .sch-item-members img {
    width: 20px; height: 20px;
    object-fit: cover;
    border: 1px solid var(--border);
  }
  .sch-item-dday {

  /* 모드 배지 3종(.badge-mode/.event-mode-tag/.day-session-mode): SVG 도형 렌더(2026-07-13) — nav 숫자 배지와 동일 사유.
     테두리(rect)·글자(패스)가 한 SVG 좌표계의 기하라 배율 무관 정중앙이며, 각 배지가 자기 라벨의 잉크를 박스 중앙에 둠(라벨별 광학 중앙 — 확정).
     크기도 3곳 통일: 높이19 · min-width46 · 글자 11px 상당 · 테두리1.5 · 자간0.3 (구 3종은 20/19/~15px로 근거 없이 달랐음 — 통합 확정, 산정은 modeBadgeSvg()).
     색은 기존 색 클래스(currentColor 상속) 그대로. */
  .badge-mode {

  .card-info { padding: 12px 14px 14px; display: flex; align-items: center; gap: 10px; }

  .card-btime {
    font-size: 11px;

  .loading { text-align: center; padding: 80px 20px; color: var(--muted); flex: 1; }

  .events-wrap {
    padding: 20px 24px;

    flex: 1;
    display: grid; grid-template-columns: 1fr 280px;
    gap: 20px; align-items: start;
  }
  /* 1100px: 채팅 묶음 도입 후 타임라인 실폭 기준 상향 — 900px에선 필터를 내리기 직전 타임라인이 ~350px까지 좁아짐(사이드바 200+패딩 48+필터 280+갭 20 차감). 1100px 전환이면 최소 ~550px 확보. 1100은 탭 접힘과 같은 기존 브레이크포인트 어휘 */
  @media (max-width: 1100px) {
    .events-wrap { grid-template-columns: 1fr; }
    .filter-panel { position: static !important; order: -1; }   /* 최신순(기본): 필터를 이벤트 위로 */
    .events-wrap.evt-sort-asc .filter-panel { order: 0; }        /* 오래된순: 필터를 아래로(DOM 순서 복귀) */
  }
  .timeline { background: var(--surface); border: 1px solid var(--border); min-width: 0; }
  .timeline-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px; }

  .filter-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px;
    position: sticky; top: 20px;
  }
  .filter-section + .filter-section {
    margin-top: 20px; padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .filter-title {
    font-size: 12px; font-weight: 700;
    color: var(--muted); letter-spacing: 1px;
    margin-bottom: 6px;   /* 필터 항목 간격(grid/flex gap 6px)과 일치 */
  }
  /* 멤버/종류 그리드 좌측에 '모두 선택/해제' 버튼 — 버튼은 그리드 높이만큼 stretch. 전체 관련 액션이라 좌측 배치(크루소개 등과 동일 패턴) */
  .filter-row { display: flex; gap: 6px; align-items: stretch; }
  /* 외곽선 알약 버튼. 좁은 세로 버튼 — 폭 좁으면 '모두/선택' 2줄(keep-all) 자동 분리. 이벤트·케미 필터 공용 */
  .filter-toggle-all {
    width: 38px;
    flex-shrink: 0;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    color: var(--accent);
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 2px;
    line-height: 1.25;
    white-space: normal;
    word-break: keep-all;
    transition: all 0.15s;
  }
  .filter-toggle-all:hover { border-color: var(--accent); }

  .filter-members { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1; min-width: 0; }
  @media (max-width: 1100px) { .filter-members { grid-template-columns: repeat(6, calc((100% - 30px) / 6)); } }   /* 상단 strip: 6열(12명=6×2) — 필터 상단 전환(1100px)과 한 세트. 종류 필터와 동일한 calc 고정(1fr은 배율에 따라 칸별 1px 차 발생 + 같은 패널의 종류 그리드와 셀 폭 어긋남) */
  .filter-member {
    position: relative;
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer; overflow: hidden;
    transition: all 0.15s; padding: 0;
  }
  .filter-member img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: opacity 0.15s;
  }
  .filter-member:not(.on) img { opacity: 0.25; filter: grayscale(1); }
  .filter-member:not(.on) { border-color: transparent; }
  .filter-member.on { border-color: var(--accent); }
  .filter-member:hover { border-color: var(--accent); }

  /* 종류 필터: 멤버와 동일한 정사각 셀(아이콘 위·라벨 아래). 열 수를 멤버와 맞춰 셀 크기 일치(PC 3열/모바일 6열). 5종 + 모두선택 좌측 */
  /* 종류 필터: 아이콘 전용(텍스트 제거). 정사각 셀에 SVG만 크게 강조, 의미는 title 툴팁으로 보존. PC 3열·모바일 6열로 멤버 그리드와 셀 크기 동일 */
  .filter-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1; min-width: 0; }
  .filter-type {
    display: flex; align-items: center; justify-content: center;
    aspect-ratio: 1;
    min-height: 0; overflow: hidden;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer; transition: all 0.15s;
  }
  .filter-type:hover { border-color: var(--accent); }
  .filter-type.on { border-color: var(--accent); }
  .filter-type:not(.on) { opacity: 0.35; }
  .filter-type:not(.on):hover { opacity: 0.6; }
  .filter-type .filter-icon { width: 55%; height: 55%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .filter-type .filter-icon svg { width: 100%; height: 100%; }   /* SVG에 박힌 width/height 무시하고 셀 비례로 스케일(비율은 meet로 유지) */
  /* 모바일 strip: 종류도 멤버와 동일 6열(5종 + 우측 빈칸 1) */
  @media (max-width: 1100px) { .filter-types { grid-template-columns: repeat(6, calc((100% - 30px) / 6)); } }   /* 필터 상단 전환(1100px)과 한 세트. 1fr은 나머지 1px를 일부 칸에만 줘 박스 크기가 갈림 → 모든 칸 동일 calc값으로 고정(gap 6px×5=30px). 남는 px는 우측 여백 */
  .filter-type[data-type="soop"] .filter-icon { color: var(--ev-start); }
  .filter-type[data-type="chat"] .filter-icon { color: #a78bfa; }
  .filter-type[data-type="post"] .filter-icon { color: var(--ev-post); }
  .filter-type[data-type="youtube"] .filter-icon { color: var(--ev-youtube); }
  .filter-type[data-type="cafe"] .filter-icon { color: #03C75A; }

  .filter-summary {

  .event-icon {

  .event-icon.post { background: rgba(52,211,153,0.15); color: var(--ev-post); }
  .event-icon.comment_recommend { background: rgba(52,211,153,0.15); color: var(--ev-post); }
  .event-icon.youtube { background: rgba(239,68,68,0.15); color: var(--ev-youtube); }
  .event-icon.cafe_post { background: rgba(3,199,90,0.15); color: #03C75A; }
  .event-icon.chat { background: rgba(167,139,250,0.15); color: #a78bfa; }
  .event-icon.chat_emoticon { background: rgba(167,139,250,0.15); color: #a78bfa; }
  .event-icon.donation { background: rgba(167,139,250,0.15); color: #a78bfa; }
  .event-icon.sanction { background: rgba(255,169,77,0.15); color: #FFA94D; }
  .event-icon.mission_gift { background: rgba(167,139,250,0.15); color: #a78bfa; }
  .event-icon.battle { background: rgba(167,139,250,0.15); color: #a78bfa; }
  .battle-result { font-size: 13px; }
  .battle-sep { color: var(--muted); }
  .battle-win { color: #34D399; font-weight: 700; }
  .battle-lose { color: #F87171; font-weight: 700; }
  .battle-draw { color: var(--muted); font-weight: 700; }
  .event a.event-link { color: inherit; text-decoration: none; display: contents; }
  .event a.event-link:hover .event-detail { color: var(--accent2); }
  .event-avatar { width: 28px; height: 28px; object-fit: cover; flex-shrink: 0; }
  .event-body { flex: 1; min-width: 0; font-size: 14px; min-height: 38px; display: flex; flex-direction: column; justify-content: center; }
  .event-member { font-weight: 700; margin-right: 6px; }
  .event-elapsed { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .event-elapsed svg { width: 12px; height: 12px; vertical-align: -1.5px; }   /* 시계 아이콘(구 ⏱) — 인라인 흐름 유지(밖 텍스트와 베이스라인 공유), 아이콘만 눈맞춤 오프셋 */
  .event-action { color: var(--muted); }
  .event-target { color: #cbd5e1; margin-left: 4px; display: inline-block; }   /* 괄호는 하나의 덩어리 — inline이면 앞 텍스트와 섞여 중간에서 끊기므로 inline-block으로 묶음. 한 줄에 안 들어가면 통째로 다음 줄로, 카페명처럼 길면 본문 폭 안에서 덩어리 내부 줄바꿈(좁은 모바일 가로 overflow 방지). 짧은 '(X 방송)'은 공간 되면 앞 조각과 같은 줄. */
  /* 멤버명·액션라벨·경과시간은 짧으니 각각 한 줄 고정(조각 내부 중간이 안 끊김). */
  .event-member, .event-action-label, .event-elapsed { white-space: nowrap; }
  .event-mode-tag {
    display: inline-block;
    margin-left: 0; margin-right: 6px;
    vertical-align: var(--tag-valign);   /* 배지 박스 중심 = 제목(12px) 잉크 중심 — calibrateBadgeValign()이 실측 주입 */
  }
  .event-mode-tag.adult { color: var(--mode-adult); }
  .event-mode-tag.subscription { color: var(--mode-subscription); }
  .event-mode-tag.copyright { color: var(--mode-copyright); }
  .event-mode-tag.password { color: var(--mode-password); }
  .event-mode-tag.restricted { color: var(--mode-restricted); }
  .event-detail {
    color: #94a3b8; font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-top: 3px;
  }
  .event-time {
    font-size: 12px; color: var(--muted);
    flex-shrink: 0; text-align: right; line-height: 1.4;
  }
  .event-time-rel { display: block; }
  .event-time-abs {
    display: block; font-size: 10px;
    color: var(--muted); opacity: 0.7;
    white-space: nowrap;   /* 기본 1줄 고정(PC·일반 모바일) — 날짜/시간 inline */
  }
  /* 좁은 화면(≤480px)에서만 날짜·시간 2줄 분리. '좁을때'를 480px로 정의 — 이 숫자만 바꾸면 조정됨 */
  @media (max-width: 480px) {
    .event-time-abs .ev-abs-d { display: block; }
  }
  /* 채팅 묶음: 같은 채널에서 감지 주기 연속(25초 이내)으로 이어진 대화를 한 아이템으로. 내부는 과거→최신, 클릭 없이 전체 노출 */
  .chat-bundle-rows {
    margin-top: 6px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .chat-bundle-row {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 12px; line-height: 1.45;
    color: inherit; text-decoration: none;
  }
  .chat-bundle-row:hover .cbr-msg { color: var(--accent2); }
  .cbr-time { color: var(--muted); font-size: 11px; flex-shrink: 0; }
  .cbr-name { font-weight: 700; flex-shrink: 0; }
  .cbr-msg { color: #94a3b8; min-width: 0; overflow-wrap: anywhere; }
  /* 아이콘+텍스트 뱃지: align-items가 center면 baseline 참여 아이템이 없어 박스 하단이 기준선으로 합성 →
     행(baseline 정렬)에서 텍스트가 디센더만큼 위로 뜸. baseline+아이콘만 center로 채팅 행과 기준선 일치 */
  .cbr-don { display: inline-flex; align-items: baseline; gap: 4px; color: #a78bfa; font-weight: 700; }   /* 후원 계열 보라 — 노란색 비선호(Crenop) */
  .cbr-don svg { width: 12px; height: 12px; align-self: center; }
  .cbr-sanction { display: inline-flex; align-items: baseline; gap: 4px; color: #FFA94D; font-weight: 700; }
  .cbr-sanction svg { width: 12px; height: 12px; align-self: center; }
  .cbr-mission { display: inline-flex; align-items: baseline; gap: 4px; color: #a78bfa; font-weight: 700; }
  .cbr-mission svg { width: 12px; height: 12px; align-self: center; }
  .cbr-mtitle { color: var(--muted); }
  .cbr-chan { text-decoration: none; }
  .cbr-chan:hover { text-decoration: underline; }
  .event.chat-bundle { align-items: flex-start; }   /* 다행 묶음: center면 아이콘·아바타·시간이 세로 중앙에 떠 헤더와 분리돼 보임 */
  .chat-bundle-avatars { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }   /* 발화자 사진 세로 나열(겹침 없음) — 묶음이 세로로 자라는 아이템이라 사진 열도 세로가 공간 문법에 맞음 */
  .timeline-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
  }
  .timeline-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 8px 14px;
    border-top: 1px solid var(--border);
  }
  .timeline-bar-left, .timeline-bar-right { display: flex; align-items: center; gap: 6px; }
  .timeline-scroll-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    transition: color 0.15s, border-color 0.15s;
  }
  .timeline-scroll-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .timeline-scroll-btn svg { width: 12px; height: 12px; display: block; flex-shrink: 0; }
  .sort-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    transition: color 0.15s, border-color 0.15s;
  }
  .sort-toggle:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .sort-toggle svg { width: 12px; height: 12px; display: block; flex-shrink: 0; }

  .stats-wrap {
    padding: 20px 24px;
    max-width: 1600px; width: 100%; margin: 0 auto;
    flex: 1;
  }

  .stats-tabs-wrap {
    display: grid;
    grid-template-columns: repeat(13, 1fr);
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px;
    margin: 0 auto 16px;
    max-width: 980px;
  }
  /* 기간 선택줄: ‹연도› 스테퍼 + [전체][1월..12월] 13버튼(통합탭) / 12버튼(멤버탭, 전체 없음) */
  /* 통합탭 기간줄: ‹연도› 스테퍼 박스 + [전체][1~12월] 13버튼 */
  .stats-period-bar { display: flex; align-items: stretch; gap: 8px; margin-bottom: 16px; }
  .stats-period-wrap { display: grid; grid-template-columns: repeat(13, 1fr); gap: 6px; flex: 1; min-width: 0; }
  /* 멤버 개별탭: 스테퍼 줄(전폭) + 6열 2행 월 버튼 — 블록 외곽만 달력·요약과 정렬(내부 7열 정렬은 폐기) */
  .stats-member-period { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .stats-period-wrap.no-all { grid-template-columns: repeat(6, 1fr); }
  .stats-period-btn {
    background: var(--surface2);
    border: 1.5px solid transparent;
    color: var(--muted);
    font-family: inherit; font-size: 12px; font-weight: 700;
    padding: 0; min-height: 32px; cursor: pointer;   /* 스테퍼 박스와 32px 통일. height 고정 금지 — [전체]의 2행 스팬(<1100px) stretch가 깨짐 */
    transition: all 0.15s;
  }
  .stats-period-btn:hover { color: var(--accent); }
  .stats-period-btn.active { border-color: var(--accent); color: var(--accent); }
  .stats-period-btn:disabled { color: var(--border); cursor: not-allowed; }
  .stats-tabs-side {
    display: contents;
  }
  .stats-tabs-members {
    display: contents;
  }
  .stats-tab {
    position: relative;
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1.5px solid transparent;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.15s;
    padding: 0;
    font-family: inherit;
    box-sizing: border-box;
  }
  .stats-tab img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.15s, filter 0.15s;
  }
  .stats-tab:not(.active) img { opacity: 0.25; filter: grayscale(1); }
  .stats-tab:not(.active) { border-color: transparent; }
  .stats-tab.active { border-color: var(--accent); }
  .stats-tab:hover { border-color: var(--accent); }
  .stats-tab-all {
    position: relative;
  }
  .stats-tab-all img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .stats-tab-all span {
    position: absolute;
    bottom: 3px;
    left: 4px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-shadow: 0 0 4px var(--bg), 0 0 4px var(--bg);
    transition: color 0.15s;
  }
  .stats-tab-all.active span { color: #fff; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 16px;
  }
  @container (max-width: 1400px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
  @container (max-width: 930px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
  @container (max-width: 700px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  @container (max-width: 480px) { .stats-grid { grid-template-columns: 1fr; } }   /* 카드 행이 nowrap이라 셀이 ~220px 밑이면 그리드가 넘쳐 가로스크롤 → 항상 그 이상 유지되도록 열 감소 */

  .stats-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    text-align: left;
    font-family: inherit;
    color: inherit;
  }
  .stats-card-header { display: flex; align-items: center; gap: 10px; }
  .stats-card-avatar {
    width: 40px; height: 40px;
    object-fit: cover;
    border: 1.5px solid var(--border);
    flex-shrink: 0;
  }
  .stats-card-name { font-size: 16px; font-weight: 700; }
  .stats-card-rows { display: flex; flex-direction: column; gap: 6px; }
  .stats-card-row {
    display: flex; justify-content: space-between;
    align-items: center; font-size: 13px;
    white-space: nowrap;
  }
  .stats-card-label { color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .stats-row-icon { display: inline-flex; align-items: center; flex-shrink: 0; vertical-align: middle; }
  .stats-row-icon svg { width: 11px; height: 11px; display: block; vertical-align: middle; }
  .medal-ico svg { width: 13px; height: 13px; vertical-align: -2px; }   /* 지표값 옆 순위 트로피(구 🥇🥈🥉 이모지) — 금·은·동은 명전 순위색 */
  .stats-card-value { color: var(--text); font-weight: 700; flex-shrink: 0; }

  .stats-detail-month {
    display: flex; align-items: center; gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 0 8px;
    box-sizing: border-box;
    height: 100%;
    min-height: 32px;   /* <1100px 세로 배치에선 height:100%가 auto(콘텐츠 30px)로 무력화 — 월 버튼(min-height:32)과 높이 통일 */
    justify-content: center;
  }
  .stats-month-btn {
    background: none;
    border: none;
    color: var(--muted);
    width: 28px; height: 28px;
    cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: color 0.15s;
    padding: 0;
  }
  .stats-month-btn svg { display: block; }
  .stats-month-btn:hover { color: var(--accent); }
  .stats-month-btn:disabled { color: var(--border); cursor: not-allowed; }
  .stats-month-text { font-size: 14px; font-weight: 700; min-width: 110px; text-align: center; }
  .stats-detail-summary {
    display: flex; flex: 1; flex-wrap: wrap; gap: 16px;
    padding: 8px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    align-items: center;
    box-sizing: border-box;
  }
  .stats-summary-item { display: flex; flex-direction: column; gap: 2px; }
  .stats-summary-label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; display: flex; align-items: center; gap: 4px; }
  .stats-summary-value { font-size: 14px; font-weight: 700; }
  /* 요약 항목 = 카드 지표행과 동일 문법(아이콘·색·클릭→그래프·hover 민트 테두리) */
  .stats-summary-item[data-metric] { cursor: pointer; padding: 2px 6px; margin: -3px -7px; border: 1px solid transparent; transition: background 0.15s, border-color 0.15s; }
  .stats-summary-item[data-metric]:hover { background: var(--surface2); border-color: var(--accent); }
  /* 일별 요약 세션의 시청자(최고·평균) — 시간 우측 인라인, 글씨는 시간과 동일 톤(아이콘만 색).
     inline-flex 중앙정렬 = 카드 라벨(stats-card-label)과 동일 패턴 — 아이콘이 텍스트 흐름의 vertical-align:middle(x-height 의존)로 앉으면 폰트 따라 틀어짐 */
  .day-session-viewer { display: inline-flex; align-items: center; font-size: 12px; color: var(--text); font-weight: 600; white-space: nowrap; }
  .day-session-viewer .stats-row-icon { margin-right: 3px; }

  .stats-member-header {
    display: grid;
    grid-template-columns: minmax(0, 480px) 1fr;
    gap: 16px;
    margin-bottom: 16px;
    align-items: stretch;
  }
  @container (max-width: 800px) { .stats-member-header { grid-template-columns: 1fr; } }   /* 우측 열이 ~300px 밑으로 가기 전에 1단(달력 480 + gap 16 기준) */

  .stats-detail-body {
    display: grid;
    grid-template-columns: minmax(0, 480px) 1fr;
    gap: 16px; align-items: start;
  }
  @container (max-width: 800px) { .stats-detail-body { grid-template-columns: 1fr; } }

  .calendar { background: var(--surface); border: 1px solid var(--border); padding: 12px; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .calendar-weekday {
    text-align: center; font-size: 11px;
    color: var(--muted); font-weight: 700; padding: 6px 0;
  }
  .calendar-weekday.sun { color: #f87171; }
  .calendar-weekday.sat { color: #60a5fa; }
  .calendar-day {
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1.5px solid transparent;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 13px; color: var(--text);
    cursor: pointer; transition: all 0.15s;
    padding: 4px; gap: 2px;
    font-family: inherit;
  }
  .calendar-day:hover { border-color: var(--accent); }
  .calendar-day.outside { opacity: 0.25; cursor: default; }
  .calendar-day.outside:hover { border-color: transparent; }
  .calendar-day.has-broadcast { background: rgba(97,255,236,0.18); color: var(--accent); }
  .calendar-day.has-broadcast:hover { background: rgba(97,255,236,0.30); }
  .calendar-day.selected { border-color: var(--accent); }
  .calendar-day.today { box-shadow: inset 0 0 0 1.5px var(--time); }
  .calendar-daynum { font-weight: 700; font-size: 13px; }
  .calendar-daycount { font-size: 9px; opacity: 0.8; }
  .calendar-day-dots {
    display: flex;
    gap: 3px;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }
  .calendar-day-dot {
    width: 5px;
    height: 5px;
  }
  .calendar-day-dot.post { background: var(--filter-post); }
  .calendar-day-dot.youtube { background: var(--ev-youtube); }
  .calendar-day-dot.cafe { background: #03C75A; }
  .calendar-day.has-activity:not(.has-broadcast) {
    background: rgba(46, 245, 225, 0.06);
  }
  .calendar-day.has-activity:not(.has-broadcast):hover {
    background: rgba(46, 245, 225, 0.12);
  }

  /* 시간대별 방송 분포 히트맵 (멤버 개별 화면) */
  .stats-detail-left { min-width: 0; }
  .toh-wrap { margin-top: 16px; }
  .toh-mb { display: none; }
  @media (max-width: 900px) {
    .toh-pc { display: none; }
    .toh-mb { display: block; }
  }
  .toh-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
  .toh-title { font-size: 12px; font-weight: 600; color: #cbd5e1; }
  .toh-sub { font-size: 11px; color: var(--muted); }
  .toh-headright { display: inline-flex; align-items: center; gap: 10px; }
  .toh-tendency { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--muted); }   /* 성향 라벨: 아이콘·텍스트 단일 색 통일(여기 한 줄로 조절) */
  .toh-tendency svg { width: 12px; height: 12px; }
  .toh-body { display: flex; align-items: flex-start; padding: 7px 0; }
  .toh-yaxis { position: relative; width: 22px; flex: none; }
  .toh-ylabel { position: absolute; right: 4px; font-size: 11px; line-height: 12px; color: var(--muted); }
  .toh-right { flex: 1; min-width: 0; }
  .toh-grid { display: grid; gap: 0; }
  .toh-xaxis { display: grid; gap: 0; margin-top: 3px; }
  .toh-xlabel { font-size: 11px; line-height: 12px; text-align: center; }

  .day-kind-icon {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    background: var(--surface);
    vertical-align: middle;
  }
  .day-kind-icon svg { width: 11px; height: 11px; display: block; vertical-align: middle; }
  .day-kind-icon.broadcast { color: var(--ev-start); background: rgba(96,165,250,0.15); }
  .day-kind-icon.post { color: var(--ev-post); background: rgba(52,211,153,0.15); }
  .day-kind-icon.youtube { color: var(--ev-youtube); background: rgba(239,68,68,0.15); }
  .day-kind-icon.cafe { color: #03C75A; background: rgba(3,199,90,0.15); }
  .day-session-row-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
    flex-wrap: wrap;   /* 시청자 스팬이 우측에 붙어 좁으면 다음 줄로 */
  }
  .day-item {
    display: flex;
    gap: 10px;
    padding: 8px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    margin-bottom: 6px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s;
    align-items: center;
  }
  .day-item:hover { border-color: var(--accent); }
  .day-item-time {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    flex-shrink: 0;
    min-width: 36px;
  }
  .day-item-title {
    flex: 1;
    font-size: 12px;
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: break-all;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .day-detail {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
  }
  .day-detail-title {
    font-size: 14px; font-weight: 700;
    color: var(--accent);
    margin-bottom: 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .day-detail-empty {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px;
    text-align: center; line-height: 1.6;
  }
  .day-session {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 10px 12px; margin-bottom: 8px;
    display: block; text-decoration: none; color: inherit;
  }
  .day-session:hover { border-color: var(--accent); }
  .day-session-time {
    display: inline-flex; align-items: center;   /* 시계 아이콘을 flex 중앙으로 — vertical-align(x-height 의존) 탈피, day-session-viewer와 동일 사유 */
    font-size: 12px; color: var(--text);
    font-weight: 600;
  }
  .day-session-time .stats-row-icon { margin-right: 4px; }
  .day-session-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .day-session-mode {
    display: inline-block; margin-right: 6px;
    vertical-align: var(--daytag-valign);   /* 배지 박스 중심 = 세션 제목(600·13px) 잉크 중심 — calibrateBadgeValign()이 실측 주입 */
  }
  .day-session-mode.adult { color: var(--mode-adult); }
  .day-session-mode.subscription { color: var(--mode-subscription); }
  .day-session-mode.copyright { color: var(--mode-copyright); }
  .day-session-mode.password { color: var(--mode-password); }
  .day-session-mode.restricted { color: var(--mode-restricted); }
  .day-session-mode.normal { color: var(--ev-start); }
  .day-session-changes {
    margin-top: 8px; padding-top: 6px;
    border-top: 1px dashed var(--border);
    display: flex; flex-direction: column; gap: 4px;
  }
  .day-session-change {
    font-size: 11px; color: #94a3b8;
    display: flex; align-items: center; gap: 6px;
  }
  .day-session-change-time { color: var(--muted); font-size: 10px; flex-shrink: 0; }
  .day-session-change-icon {
    flex-shrink: 0; width: 16px; display: flex; align-items: center; justify-content: center;
    color: var(--ev-yellow); font-weight: 700;
  }
  .day-session-change-icon svg { width: 16px; height: 16px; display: block; }

  /* === 관련 링크 탭 === */
  .links-wrap {
    padding: 20px 24px;
    max-width: 1600px; width: 100%; margin: 0 auto;
    flex: 1;
  }
  .links-section {
    background: var(--surface);
    border: 1px solid var(--border);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .links-table-wrap {
    overflow-x: auto;
  }
  .links-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    min-width: 720px;
  }
  .links-table th, .links-table td {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 6px 8px;
    text-align: center;
    vertical-align: top;
  }
  .links-table td.td-bottom { vertical-align: bottom; }   /* 노래책 단독 셀: 행 바닥 정렬로 노래책 줄 통일(rowEtc에서 부여) */
  .links-table th:last-child, .links-table td:last-child { border-right: none; }
  .links-table tr:last-child td { border-bottom: none; }
  .links-table th {
    background: var(--surface2);
    font-size: 12px;
    font-weight: 700;
    padding: 10px 6px;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .links-th-avatar {
    width: 56px;
    height: 56px;
    object-fit: cover;
    margin: 0 auto 6px;
    display: block;

    box-sizing: border-box;
  }
  .members-tab img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: opacity 0.15s, filter 0.15s;
  }
  .members-tab:not(.active) img { opacity: 0.25; filter: grayscale(1); }
  .members-tab:not(.active) { border-color: transparent; }
  .members-tab.active { border-color: var(--accent); }
  .members-tab:hover { border-color: var(--accent); }
  .members-tab-crew {
    position: relative;
  }
  .members-tab-crew img {
    width: 100%; height: 100%;
    object-fit: contain;
  }

  .members-crew {
    display: flex; gap: 16px;
    max-width: 1300px;   /* 전체폭 확대 — 비율 2.4:1 유지한 채 우측 활동 패널 절대폭 확보(가장 긴 줄 한 줄 수용). 좌측 소개도 함께 넓어짐 */
    margin: 0 auto;
    align-items: stretch;
  }
  /* 우측 활동/연혁 패널이 좁아져 가독성 무너지기 전에 세로 스택 — 콘텐츠 900px 밑(활동 패널 ~265px 밑)에서 전환(뷰포트 아닌 실제 폭 기준) */
  @container (max-width: 900px) {
    .members-crew { flex-direction: column; }
    .members-crew-intro, .members-crew-activities { flex: none; }
  }
  .members-crew-intro {
    flex: 2.4; min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 28px 32px;
    text-align: center;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  .members-crew-intro-img {
    max-width: 380px;
    width: 100%;
    margin: 0 auto 32px;
    display: block;
  }
  .members-crew-intro p {
    font-size: 15px; color: var(--muted);
    line-height: 1.8; max-width: 720px;
    margin: 0 auto; word-break: keep-all;
  }
  .members-crew-activities {
    flex: 1; min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 22px 24px;
    display: flex; flex-direction: column;
  }
  .crew-act-sub {
    font-size: 12px; font-weight: 700; color: var(--accent);
    letter-spacing: 1.5px; margin: 16px 0 7px;
  }
  .crew-act-sub:first-child { margin-top: 0; }
  .crew-act-li {
    display: flex; gap: 9px;
    font-size: 14px; color: #94a3b8;
    line-height: 1.5; padding: 4px 0;
  }
  .crew-act-li .dot { color: var(--accent); flex: none; }
  .crew-act-li .d { color: #cbd5e1; font-weight: 700; }
  .crew-act-li .tag { color: var(--muted); font-size: 12px; }
  .crew-act-more { margin-top: auto; padding-top: 16px; text-align: right; }
  .crew-act-more button {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 700; color: var(--accent);
    background: rgba(97,255,236,0.08); border: 1px solid rgba(97,255,236,0.35);
    padding: 7px 14px; cursor: pointer; font-family: inherit;
  }
  .crew-act-more button:hover { background: rgba(97,255,236,0.16); border-color: rgba(97,255,236,0.6); }

  .members-profile {
    display: grid;
    grid-template-columns: minmax(0, 300px) 1fr;
    gap: 16px;
    max-width: 1000px;
    margin: 0 auto;
    align-items: stretch;   /* 사진 높이를 우측 표 높이에 맞춤(아래끝 일치). 폭 300 + 표높이≈402 → 박스≈3:4 */
  }
  .members-profile-photo {
    position: relative;
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
  }
  .members-profile-photo img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .members-profile-main {
    display: flex; flex-direction: column; gap: 16px;
    min-width: 0;
    container-type: inline-size;   /* 헤더 버튼 2×2 전환을 정보 컬럼 폭 기준으로(뷰포트 아님) */
  }
  @container (max-width: 640px) {   /* 통계 멤버탭과 동일 방식: 정보컬럼이 좁아지기 전에 1열 스택(좌300+gap+우~300 기준) */
    .members-profile { grid-template-columns: 1fr; }
    .members-profile-photo { width: 70%; max-width: 300px; margin: 0 auto; aspect-ratio: 3 / 4; }   /* 1열일 땐 옆에 맞출 표가 없어 비율로 높이를 줘야 함(2열일 땐 stretch가 표 높이를 줌) */
  }
  .members-profile-header {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px;
    display: flex; align-items: center; gap: 20px;
  }
  .members-profile-avatar {
    width: 72px; height: 72px;
    object-fit: cover;
    border: 3px solid var(--border);
    flex-shrink: 0;
  }
  .members-profile-info { display: flex; flex-direction: column; gap: 4px; }
  .members-profile-name { font-size: 22px; font-weight: 800; }
  .members-profile-eng {
    font-size: 12px; color: var(--muted); font-weight: 600;
    letter-spacing: 1.5px; opacity: 0.7;
  }
  .members-profile-quick {
    margin-left: auto;
    display: flex; gap: 6px;
    flex-shrink: 0;
  }
  .members-quick-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(97,255,236,0.08);
    border: 1px solid var(--accent);
    color: var(--accent);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    padding: 0;
    font-family: inherit;
  }
  /* 상시 유색(브랜드색, 관련링크 버튼은 위 기본=민트) — hover는 배경 농도만 상승(클릭 가능 피드백) */
  .members-quick-btn:hover { background: rgba(97,255,236,0.18); }
  .members-quick-btn.quick-soop { border-color: #0388FF; color: #0388FF; background: rgba(3,136,255,0.10); }
  .members-quick-btn.quick-soop:hover { background: rgba(3,136,255,0.22); }
  .members-quick-btn.quick-youtube { border-color: #FF0000; color: #FF0000; background: rgba(255,0,0,0.10); }
  .members-quick-btn.quick-youtube:hover { background: rgba(255,0,0,0.22); }
  .members-quick-btn.quick-naver { border-color: #03C75A; color: #03C75A; background: rgba(3,199,90,0.10); }
  .members-quick-btn.quick-naver:hover { background: rgba(3,199,90,0.22); }
  .members-quick-btn svg { width: 16px; height: 16px; display: block; }
  @container (max-width: 520px) { .members-profile-quick { display: grid; grid-template-columns: repeat(2, auto); } }   /* 정보 컬럼 ≤520px면(폰/태블릿 2단 무관) 이름 우측 버튼 2×2 */
  .members-info-section {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 20px 24px;
  }
  .members-info-title {
    font-size: 12px; font-weight: 700;
    color: var(--muted); letter-spacing: 1px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .members-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    column-gap: 24px;
  }
  @container (max-width: 500px) { .members-info-grid { grid-template-columns: 1fr; column-gap: 0; } }   /* 정보컬럼(.members-profile-main) 폭 기준 — 좁아지면 1열로 떨어져 긴 값(다른 소속 등)이 전체 폭 사용해 2열 반칸 넘침 방지 */
  .members-info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(30,39,64,0.5);
    gap: 8px;
    min-height: 36px;
  }
  .members-info-row-full {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(30,39,64,0.5);
    gap: 8px;
    grid-column: 1 / -1;
    min-height: 36px;
  }
  .members-info-label {
    font-size: 13px; color: var(--muted); font-weight: 600;
    flex-shrink: 0; line-height: 20px;
  }
  .members-info-value {
    font-size: 14px; color: var(--text); font-weight: 700;
    text-align: right; white-space: normal; line-height: 20px;
  }
  /* 항목 모아보기: data-mi 행 클릭 → 모달. hover 링은 box-shadow(inset) — border를 쓰면 쇼트핸드가 행 구분선(border-bottom)을 지움 */
  .members-info-row[data-mi], .members-info-row-full[data-mi] {
    cursor: pointer; padding-left: 6px; padding-right: 6px; margin-left: -6px; margin-right: -6px;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .members-info-row[data-mi]:hover, .members-info-row-full[data-mi]:hover { background: var(--surface2); box-shadow: inset 0 0 0 1px var(--accent); }
  .mi-collect-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .mi-collect-row:last-child { border-bottom: none; }
  .mi-collect-row img { width: 26px; height: 26px; object-fit: cover; border: 1px solid var(--border); flex-shrink: 0; }
  .mi-collect-name { font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .mi-collect-val { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--text); text-align: right; }
  .mi-collect-row.me { background: var(--surface2); box-shadow: inset 2px 0 0 var(--accent); }   /* 현재 보던 멤버 강조 — 좌측 민트 바 */

  /* 프로필/통계 상단 셀렉터: 1행(13칸, max-width 980 공통)이 폭 좁아지면 버튼이 작아짐. 메인 사이드바가 상단으로 가는 700px보다 앞서, 1100px부터 2행으로 전환(버튼 크게 유지). 멤버=크루(좌측 2행)+12를 7열, 통계=연간/월간 좌측 세로 스택 */
  @media (max-width: 1100px) {
    .stats-tabs-wrap { grid-template-columns: repeat(7, 1fr); }
    .members-tabs-wrap { grid-template-columns: repeat(7, 1fr); }
    .stats-tab-all { grid-column: 1; grid-row: 1 / span 2; aspect-ratio: auto; }
    .members-tab-crew { grid-column: 1; grid-row: 1 / span 2; aspect-ratio: auto; }
    .stats-period-wrap:not(.no-all) { grid-template-columns: repeat(7, 1fr); }
    .stats-period-wrap .stats-period-btn[data-period="all"] { grid-column: 1; grid-row: 1 / span 2; }
    .stats-period-bar { flex-direction: column; align-items: stretch; }   /* 좁으면 스테퍼가 위, 버튼 그리드가 아래 */
  }

  /* 상단바 우측 갱신정보: 좁은 폭에선 '주기 · 시각'을 2줄로 분리(주기/시각/비공식문구=3줄). 넓으면 스팬 inline이라 1줄 유지.
     900px: 가이드 버튼 추가로 701~900px 구간에서 갱신줄이 말줄임(…)되던 것 → 모바일과 동일한 분리로 해소 */
  @media (max-width: 900px) {
    .header-center-line { white-space: normal; }
    .header-center-line .hc-period, .header-center-line .hc-stamp { display: block; }
    .header-center-line .hc-mid { display: none; }
  }

  @media (max-width: 700px) {
    body { flex-direction: column; }
    /* 상단바 모달(모바일): PC처럼 중앙 + 내부 스크롤 유지(패널 max-height:80vh, lr-body 스크롤). 헤더(X)가 고정돼야 내용 스크롤 중에도 닫기 가능 → 페이지 스크롤 대신 내부 스크롤. 짧으면 중앙 정렬 */
    .lr-overlay { align-items: center; }
    .sidebar {
      width: 100%; height: auto;
      position: relative;
      flex-direction: column; padding: 0;
    }
    .sidebar-logo { padding: 8px; min-height: 0; }
    .nav-list { flex-direction: row; flex: none; padding: 8px; flex-wrap: wrap; align-items: center; justify-content: center; }
    .nav-item {
      flex-direction: column; gap: 4px;
      border-left: none;
      border-bottom: 3px solid transparent;
      padding: 8px 2px; white-space: nowrap;
      flex: 1 1 0;   /* 9칸 균등폭으로 가로 꽉 채움 — 기본 min-width:auto라 라벨보다 좁아지진 않고, 320px 미만 등 극협폭이면 flex-wrap으로 잘림 없이 다음 줄로 */
      font-size: 10px; line-height: 1.2;
    }
    .nav-item.active { border-left: none; border-bottom-color: var(--accent); }
    .nav-events-label { position: static; }   /* 모바일: 뱃지를 nav-item(아이콘 위 우상단)에 앵커 — 현행 유지 */
    .nav-badge { position: absolute; right: 6px; top: 4px; }
    .nav-notify-bell { display: none; }
    .main-header { padding: 12px 16px; min-height: 0; flex-wrap: wrap; gap: 10px; }
    /* 3열(상단바): 버튼 좌 · 설명 우 — width:100% 스택 해제, header-center는 base의 margin-left:auto로 우측. 좁으면 wrap으로 설명이 아래로 */
    .page-title { gap: 6px; align-items: stretch; }
    /* 탭별 상단바 높이 통일: 갱신줄 유무로 1~3줄 차가 나 높이가 변하던 문제 → 3줄 높이 예약(모든 탭 동일 클램프) + 세로 가운데정렬(짧은 탭은 비공식문구가 중앙). PC는 main-header min-height:66px로 이미 통일. */
    .header-center { min-height: 52px; justify-content: center; }
    /* 상단바 버튼: 세로 미니(아이콘 위 · 짧은 텍스트 아래) + PC/모바일 토글 */
    .page-title-link, .celebration-box {
      flex-direction: column; gap: 2px; justify-content: center;
      padding: 6px 8px; font-size: 9px;
      text-align: center; line-height: 1.3;
      min-width: 60px;   /* 전 버튼 동일 폭 — 가장 긴 라벨 기준 floor (좋아요·커버곡·N주년!·N일! 등 모두 수용) */
    }
    .tb-t-pc { display: none; }
    .tb-t-mb { display: block; }
    /* 기념일 박스 모바일(C안): 아이콘 + "이름 종류" 한 줄, 폭 가변(긴 이름은 넓어짐) */
    .celebration-box .tb-t-mb { white-space: nowrap; font-weight: 700; }
    /* 사이드바 라벨: 긴 것만 축약본으로 교체 */
    .nav-label-pc { display: none; }
    .nav-label-mb { display: inline; }
    /* 라이브: PC 뱃지 제거 → 생방송 아이콘 우상단 점(회색=없음 / 빨강=방송중) */
    .nav-live-badge { display: none; }
    .nav-live-dot-m {
      display: block; position: absolute; top: 4px; right: 8px;
      width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
    }
    .nav-live-badge.on ~ .nav-live-dot-m {
      background: var(--live); box-shadow: 0 0 5px var(--live-glow);
    }
    .grid, .events-wrap, .stats-wrap, .chem-wrap, .content-wrap, .members-wrap, .hall-wrap { padding: 16px; }
    .stats-tabs-members, .stats-tabs-side { display: contents; }
  }
  /* 통합탭 카드: 지표 행 클릭=그래프 모달 (헤더→멤버 이동은 폐지 — 멤버 상세는 상단 아바타 탭이 유일 동선).
     hover 민트 테두리 = 사이트 공통 '클릭 가능' 문법. 투명 기본 테두리+마진 보정으로 레이아웃 시프트 없음 */
  .stats-card-row-link { cursor:pointer; padding:2px 6px; margin:-3px -7px; border:1px solid transparent; transition: background 0.15s, border-color 0.15s; }
  .stats-card-row-link:hover { background:var(--surface2); border-color:var(--accent); }
  /* 차트(SVG) — 그래프 모달에서 사용 */
  .graph-svg { width:100%; height:auto; display:block; }
  .g-grid { stroke:rgba(255,255,255,0.08); stroke-width:1; }
  .g-xlabel { fill:var(--muted); font-size:12px; text-anchor:middle; }
  .g-vlabel { font-size:12px; font-weight:700; paint-order:stroke; stroke:var(--bg); stroke-width:4px; stroke-linejoin:round; }
  /* 이벤트 종류 필터: 6열(1행) 전환 시 2/3행 그룹용 빈칸 숨김 — 그리드 전환(1100px)과 반드시 한 세트(900px이던 시절 900~1100 구간에서 1행 중간에 구멍 잔존 버그, 2026-07-13 수정) */
  @media (max-width:1100px){ .evt-type-spacer { display:none; } }
  /* 모바일(narrow viewBox 380×300): 차트 월·값 글씨 키움(작은 화면 가독성) */
  @media (max-width:900px){ .g-xlabel { font-size:14px; } .g-vlabel { font-size:14px; } }
  /* 그래프 모달 (좋아요 모달 lr-panel 골격 재사용, 폭·글씨 키움) */
  .graph-modal-panel { max-width:740px; max-height:90vh; }
  .graph-modal-panel .lr-head { color:var(--text); font-size:14px; padding:14px 18px; }
  .graph-modal-panel .lr-head > span:first-child { flex-wrap: wrap; row-gap: 2px; min-width: 0; }   /* 제목(이름·지표·기간)이 좁은 폭에서 ✕를 밀지 않고 줄바꿈되게 */
  .graph-modal-panel .lr-body { padding:22px 20px; }
  .graph-modal-panel .sg-dot { width:11px; height:11px; display:inline-block; }
  /* 그래프 모달 본문: [‹][차트][›] — ‹›는 한 달 이동(기간줄 스테퍼와 동일 버튼 문법) */
  .graph-modal-panel .lr-body { display: flex; align-items: center; gap: 2px; }
  .graph-modal-panel .sg-chart { flex: 1; min-width: 0; }
  .graph-modal-panel .sg-nav { flex-shrink: 0; }
  .graph-modal-panel .sg-nav:disabled { color: var(--border); cursor: not-allowed; }
  /* 차트가 뷰포트 높이를 넘지 않게(세로 스크롤 방지). meet라 비율 유지하며 축소 */
  .graph-modal-panel .graph-svg { max-height: calc(90vh - 100px); }
</style>

const MODE_LABEL = {
  normal: '일반', adult: '19+',
  subscription: '구독+', copyright: '저작권', password: '비번', restricted: '기타',
};
const MODE_PLACEHOLDER_TEXT = {
  adult: '19금 방송', subscription: '구독플러스 전용 방송',
  copyright: '저작권 방송', password: '비밀번호 방송', restricted: '기타 제한 방송',
};
// mode는 활성 속성 조합 문자열('adult_subscription' 등) — '_'로 분해해 각각 배지로. 단일/normal/레거시 'adult_copyright'도 그대로 분해됨.
function modeParts(mode) {
  return (mode || 'normal').split('_');
}
// 조합 문자열을 사람이 읽는 라벨로(예: 'adult_subscription' → '19+ · 구독+'). mode_change before/after 표시용.
function modeLabel(mode) {
  return modeParts(mode).map(p => MODE_LABEL[p] || p).join(' · ');
}
// 썸네일 없는 제한방송의 안내 텍스트(조합 대응). 예: 'adult_password' → '19금 방송 · 비밀번호 방송'.
function modePlaceholder(mode) {
  if (!mode || mode === 'normal') return '';
  return modeParts(mode).map(p => MODE_PLACEHOLDER_TEXT[p] || MODE_LABEL[p] || p).join(' · ');
}

// 숫자 union 잉크 경계(라이닝·오버슈트 포함) — 전 숫자가 한 베이스라인을 공유해 값이 바뀌어도 세로 위치 불변
const DIGIT_INK = (() => { let y0 = Infinity, y1 = -Infinity; for (const c of '0123456789') { y0 = Math.min(y0, BADGE_GLYPHS.g[c].y0); y1 = Math.max(y1, BADGE_GLYPHS.g[c].y1); } return { y0, y1 }; })();
// numStr을 advance 폭대로 나열한 <g>. s=CSSpx/upem, (x0,yBase)=SVG 좌표의 시작 x·베이스라인 y(SVG는 y-down이라 scale Y 반전)
function navDigitsGroup(numStr, s, x0, yBase) {
  let x = 0;
  const parts = [];
  for (const ch of String(numStr)) {
    parts.push(`<path d="${BADGE_GLYPHS.g[ch].d}"${x ? ` transform="translate(${x} 0)"` : ''}/>`);
    x += BADGE_GLYPHS.g[ch].a;
  }
  return `<g transform="translate(${x0.toFixed(3)} ${yBase.toFixed(3)}) scale(${s} ${-s})">${parts.join('')}</g>`;
}
// 민트 안읽음 배지 전체(rect 박스 + 숫자). 크기 문법은 구 CSS 동일: 높이14 · min-width16 · 좌우패딩5 · 숫자 10px 상당. 색은 CSS(.nav-badge rect/path)가 담당.
function navBadgeSvg(n) {
  const s = 10 / BADGE_GLYPHS.upem;
  const str = String(n);
  let aw = 0;
  for (const ch of str) aw += BADGE_GLYPHS.g[ch].a;
  const H = 14;
  const W = Math.max(16, aw * s + 10);
  const yBase = H / 2 + (DIGIT_INK.y0 + DIGIT_INK.y1) / 2 * s;   // 잉크(union) 중심 = 박스 중심
  return `<svg width="${W.toFixed(2)}" height="${H}" viewBox="0 0 ${W.toFixed(2)} ${H}" aria-hidden="true"><rect width="${W.toFixed(2)}" height="${H}"/>${navDigitsGroup(str, s, (W - aw * s) / 2, yBase)}</svg>`;
}
// 빨강 라이브 카운트(숫자만, 11px 상당). SVG 박스 = 잉크 경계 그 자체 → 컨테이너 flex 중앙정렬이 곧 잉크 중앙정렬(점과 중심 일치).
function liveCountSvg(n) {
  const s = 11 / BADGE_GLYPHS.upem;
  const str = String(n);
  let aw = 0;
  for (const ch of str) aw += BADGE_GLYPHS.g[ch].a;
  const w = (aw * s).toFixed(2);
  const h = ((DIGIT_INK.y1 - DIGIT_INK.y0) * s).toFixed(2);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${navDigitsGroup(str, s, 0, DIGIT_INK.y1 * s)}</svg>`;
}
// 모드 배지 1개 전체(테두리 rect + 라벨 패스). 각 배지가 자기 라벨의 잉크 union을 박스 정중앙에(라벨별 광학 중앙 — 확정).
// 크기 문법(3곳 공통 통일): 높이19 · min-width46 · 글자 11px 상당 · 좌우패딩6 · 테두리1.5(stroke는 중앙정렬이라 rect를 0.75 인셋) · 자간0.3px(글자 사이만 — CSS와 달리 끝 자간 없음, 중앙정렬에 유리).
// 각진 모서리(rx 없음) = 사각 박스 정책 그대로. 색은 rect stroke·글자 fill 모두 currentColor(기존 색 클래스 상속).
function modeBadgeSvg(part) {
  const label = MODE_LABEL[part] || '';
  const s = 11 / BADGE_GLYPHS.upem;
  const LSU = 0.3 / s;   // 자간 0.3px의 폰트단위 환산
  let awu = 0, y0 = Infinity, y1 = -Infinity;
  const chars = [...label];
  chars.forEach((ch, i) => {
    const g = BADGE_GLYPHS.g[ch];
    if (!g) return;
    awu += g.a + (i < chars.length - 1 ? LSU : 0);
    y0 = Math.min(y0, g.y0); y1 = Math.max(y1, g.y1);
  });
  const H = 19, W = Math.max(46, awu * s + 15);   // 좌우 패딩 6×2 + 테두리 1.5×2
  const yBase = H / 2 + (y0 + y1) / 2 * s - 0.5;   // 라벨 잉크(bbox) 중심 = 박스 중심, 거기서 0.5px 광학 리프트(2026-07-13 실기기 판정: 한글 윗획 끝이 가늘어 bbox 정중앙이 눈에는 +0.3~0.5px 낮게 보임). SVG 좌표계 상수라 배지와 함께 선형 스케일 — 배율 안전. 과/부족하면 이 숫자만 조정
  let xu = ((W - awu * s) / 2) / s;
  const paths = chars.map(ch => {
    const g = BADGE_GLYPHS.g[ch];
    if (!g) return '';
    const p = `<path d="${g.d}"${xu ? ` transform="translate(${xu.toFixed(1)} 0)"` : ''}/>`;
    xu += g.a + LSU;
    return p;
  }).join('');
  return `<svg width="${W.toFixed(2)}" height="${H}" viewBox="0 0 ${W.toFixed(2)} ${H}" aria-hidden="true"><rect x="0.75" y="0.75" width="${(W - 1.5).toFixed(2)}" height="${H - 1.5}" fill="none" stroke="currentColor" stroke-width="1.5"/><g fill="currentColor" transform="translate(0 ${yBase.toFixed(3)}) scale(${s} ${-s})">${paths}</g></svg>`;
}

// 케미명·그룹은 구글 시트에서 로드 (A열 케미명, B~L열 멤버 이름 — 2명 행은 쌍, 3명 이상 행은 그룹)
const CHEM_NAME_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=574378390';
const LS_CHEMNAME_CACHE = 'chuntaverse_chem_names_v1';
let CHEM_NAMES = {};
let CHEM_GROUPS = [];
function applyChemNameRows(rows) {
  const names = {};
  const groups = [];
  const memberIndex = {};
  MEMBERS.forEach((m, i) => { memberIndex[m.id] = i; });
  for (const r of (rows || [])) {
    const name = (r[0] || '').trim().replace(/\s*,\s*/g, ' · ');  // 시트엔 쉼표로 적고 표시는 사이트 규약인 가운뎃점
    if (!name || name === '케미명') continue;  // 빈 행·헤더 행 무시
    // B열~ 멤버 칸: 현수막·컨텐츠와 동일하게 칸에 적힌 이름으로 멤버 매칭(열 위치 무관, 빈 칸·미상 이름은 스킵)
    const ids = r.slice(1)
      .map(c => (c || '').trim())
      .filter(c => c.length > 0)
      .map(nm => (MEMBERS.find(x => x.name === nm) || {}).id)
      .filter(Boolean);
    // 쌍 키는 renderChemistry의 케미 카드 조회 키(`m1.id:m2.id`, MEMBERS 순서라 i<j)와 맞아야 하므로 MEMBERS 인덱스 순으로 정렬
    ids.sort((a, b) => memberIndex[a] - memberIndex[b]);
    if (ids.length === 2) {
      const k = `${ids[0]}:${ids[1]}`;
      names[k] = names[k] ? names[k] + ' · ' + name : name;   // 같은 쌍 여러 행 → 가운뎃점 나열
    } else if (ids.length >= 3) {
      const gkey = ids.join(':');
      const ex = groups.find(g => g.members.join(':') === gkey);
      if (ex) ex.name += ' · ' + name;   // 같은 조합 여러 행 → 가운뎃점 나열
      else groups.push({ members: ids, name });
    }
  }
  CHEM_NAMES = names;
  CHEM_GROUPS = groups;
}

async function loadChemNames() {
  if (Object.keys(CHEM_NAMES).length === 0 && CHEM_GROUPS.length === 0) {
    const cached = lsGet(LS_CHEMNAME_CACHE, null);
    if (cached) {
      try { applyChemNameRows(JSON.parse(cached)); if (currentPage === 'chemistry') renderChemistry(); } catch (e) {}
    }
  }
  try {
    const res = await fetch(CHEM_NAME_SHEET_URL);
    if (!res.ok) throw new Error('no data');
    const rows = parseCSV(await res.text());
    applyChemNameRows(rows);
    lsSet(LS_CHEMNAME_CACHE, JSON.stringify(rows));
    if (currentPage === 'chemistry') renderChemistry();
  } catch (e) {}
}

const CREW_ACT_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=1295776995';
const MEMBER_INFO_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=446600674';
const VACATION_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=964295196';
const LS_CREWACT_CACHE = 'chuntaverse_crewact_cache_v1';
const LS_MEMBERINFO_CACHE = 'chuntaverse_memberinfo_cache_v1';
const LS_VACATION_CACHE = 'chuntaverse_vacation_cache_v1';
let crewActs = [];       // [{section, date, text, tag}] — 시트 행 순서 = 표시 순서
let crewSheetsDone = false;   // 최초 fetch 시도 완료 여부 — 크루탭의 '불러오는 중'/'불러올 수 없어요' 구분
let MEMBER_INFO = {};    // { id: {engName, fanName, age, height, mbti, group, firstStream, vote, election2026} }

// 파서 3종(순수 함수 — verify_crew_sheets 스위트가 검증). 헤더 스킵은 행 위치가 아니라 내용 기반(케미 파서 관례) — 시트에 헤더 행이 없어도 첫 데이터 행을 삼키지 않음.
function parseCrewActRows(rows) {
  return rows.filter(r => r[0] && r[2] && r[0] !== '섹션').map(r => ({ section: r[0], date: r[1] || '', text: r[2], tag: r[3] || '' }));
}
function parseMemberInfoRows(rows) {
  const o = {};
  rows.forEach(r => {
    const m = MEMBERS.find(x => x.name === (r[0] || '').trim());   // A열 = 멤버 이름(케미·배너 등 다른 시트와 동일 관례) — 미등록 이름(헤더 포함)은 자연 무시, 내부 키는 id
    if (m) o[m.id] = { engName: r[1] || '', fanName: r[2] || '', age: r[3] || '', height: r[4] || '', mbti: r[5] || '', group: r[6] || '', firstStream: r[7] || '', vote: r[8] || '', election2026: r[9] || '' };   // J열 = 2026 반장선거 득표수/득표율
  });
  return o;
}
function parseVacationRows(rows) {
  const o = {};
  rows.forEach(r => {
    const m = MEMBERS.find(x => x.name === (r[0] || '').trim());   // A열 = 멤버 이름(동일 관례)
    if (m && r[2]) o[m.id] = { img: r[1] || '', until: r[2] };
  });
  return o;
}

async function loadCrewSheets() {
  // 캐시 선표시(재방문 첫 페인트) — 배너 패턴과 동일
  try { const c = JSON.parse(lsGet(LS_CREWACT_CACHE, 'null')); if (c) crewActs = parseCrewActRows(c); } catch (e) {}
  try { const c = JSON.parse(lsGet(LS_MEMBERINFO_CACHE, 'null')); if (c) MEMBER_INFO = parseMemberInfoRows(c); } catch (e) {}
  try { const c = JSON.parse(lsGet(LS_VACATION_CACHE, 'null')); if (c) VACATION = parseVacationRows(c); } catch (e) {}
  if (currentPage === 'members') renderMembersBody();
  // 최신 fetch(병렬, 실패 격리) — 실패 시 캐시본 유지(확정: 시트 단일 소스, 첫 방문+장애 조합만 해당 섹션 공백)
  const pull = (url, lsKey, apply) => fetch(url)
    .then(r => { if (!r.ok) throw new Error('no data'); return r.text(); })
    .then(t => { const rows = parseCSV(t); lsSet(lsKey, JSON.stringify(rows)); apply(rows); });
  await Promise.allSettled([
    pull(CREW_ACT_SHEET_URL, LS_CREWACT_CACHE, rows => { crewActs = parseCrewActRows(rows); }),
    pull(MEMBER_INFO_SHEET_URL, LS_MEMBERINFO_CACHE, rows => { MEMBER_INFO = parseMemberInfoRows(rows); }),
    pull(VACATION_SHEET_URL, LS_VACATION_CACHE, rows => { VACATION = parseVacationRows(rows); }),   // 카드 반영은 다음 loadLive 폴링(≤10초)
  ]);
  crewSheetsDone = true;
  if (currentPage === 'members') renderMembersBody();
  updatePageTitle();   // 상단바 축하 박스(N번째 생일·방송 N주년)가 MEMBER_INFO를 읽음 — 시트 도착 후 재구성
}

function calcAge(memberId, ageStr) {
  if (!ageStr) return '';
  if (ageStr === '비공개') return '비공개';
  if (ageStr === '700살') return '700세';
  const match = ageStr.match(/^(\d{4})년생$/);
  if (!match) return ageStr;
  const birthYear = parseInt(match[1]);
  const bd = MEMBER_BIRTHDAYS[memberId];
  const kst = new Date(Date.now() + 9 * 3600 * 1000);
  const cy = kst.getUTCFullYear(), cm = kst.getUTCMonth() + 1, cd = kst.getUTCDate();
  let age = cy - birthYear;
  if (bd && (cm < bd.month || (cm === bd.month && cd < bd.day))) age--;
  return `${age}세 (${ageStr})`;
}

function calcDaysSince(dateStr) {
  if (!dateStr) return '';
  const match = dateStr.match(/^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일$/);
  if (!match) return dateStr;
  const startDate = new Date(Date.UTC(parseInt(match[1]), parseInt(match[2]) - 1, parseInt(match[3])));
  const kst = new Date(Date.now() + 9 * 3600 * 1000);
  const today = new Date(Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), kst.getUTCDate()));
  const diffDays = Math.floor((today - startDate) / 86400000);
  if (diffDays < 0) return dateStr;
  return `${dateStr} (D+${diffDays}일)`;
}

const CT_FORMATION = new Date(Date.UTC(2025, 10, 30));

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return `${parseInt(h.substring(0,2),16)},${parseInt(h.substring(2,4),16)},${parseInt(h.substring(4,6),16)}`;
}

// 축하박스 아이콘 — 실물은 SVG_ICONS로 통합(산포 정리), 여기는 용도→도형 의미 매핑만 유지(호출부 무변경)
const CELEB_SVG = {
  birthday: SVG_ICONS.birthday,
  chuntaverse: SVG_ICONS.chuntaverse,
  broadcast: SVG_ICONS.soop,
};

function celebBox(svg, pcText, mbName, mbType, hexColor, hash) {
  const rgb = hexToRgb(hexColor);
  // 아이콘 PC·모바일 공통. PC: 전체 문구 / 모바일: "이름 종류" 한 줄(C안 — 높이는 다른 버튼과 동일, 폭만 가변)
  return `<a class="celebration-box" href="#${hash}" style="--cb-rgb:${rgb};color:${hexColor}">${svg}<span class="tb-t-pc">${pcText}</span><span class="tb-t-mb">${mbName} ${mbType}</span></a>`;
}

function getTodayCelebrations() {
  const kst = new Date(Date.now() + 9 * 3600 * 1000);
  const cy = kst.getUTCFullYear(), cm = kst.getUTCMonth() + 1, cd = kst.getUTCDate();
  const todayMs = Date.UTC(cy, cm - 1, cd);
  const results = [];

  for (const m of MEMBERS) {
    const bd = MEMBER_BIRTHDAYS[m.id];
    if (!bd || bd.month !== cm || bd.day !== cd) continue;
    const info = MEMBER_INFO[m.id];
    const birthMatch = info?.age?.match(/^(\d{4})년생$/);
    const nthText = birthMatch ? `${cy - parseInt(birthMatch[1])}번째 ` : '';
    results.push(celebBox(CELEB_SVG.birthday, `${m.name}님의 ${nthText}생일을<br>축하합니다!`, m.name, '생축!', m.color, `members:${m.id}`));
  }

  if (cm === 11 && cd === 30 && cy > 2025) {
    results.push(celebBox(CELEB_SVG.chuntaverse, `천타버스 결성 ${cy - 2025}주년을<br>축하합니다!`, '천타버스', `${cy - 2025}주년!`, '#61FFEC', 'members:crew'));
  }
  const ctDays = Math.floor((todayMs - CT_FORMATION.getTime()) / 86400000);
  if (ctDays > 0 && ctDays % 100 === 0 && !(cm === 11 && cd === 30)) {
    results.push(celebBox(CELEB_SVG.chuntaverse, `천타버스 결성 ${ctDays}일을<br>축하합니다!`, '천타버스', `${ctDays}일!`, '#61FFEC', 'members:crew'));
  }

  for (const m of MEMBERS) {
    const info = MEMBER_INFO[m.id];
    if (!info?.firstStream) continue;
    const match = info.firstStream.match(/^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일$/);
    if (!match) continue;
    const fy = parseInt(match[1]), fm = parseInt(match[2]), fd = parseInt(match[3]);
    if (fm === cm && fd === cd && cy > fy) {
      results.push(celebBox(CELEB_SVG.broadcast, `${m.name}님의 숲 방송 ${cy - fy}주년을<br>축하합니다!`, m.name, `${cy - fy}주년!`, m.color, `members:${m.id}`));
    } else {
      const days = Math.floor((todayMs - Date.UTC(fy, fm - 1, fd)) / 86400000);
      if (days > 0 && days % 100 === 0) {
        results.push(celebBox(CELEB_SVG.broadcast, `${m.name}님의 숲 방송 ${days}일을<br>축하합니다!`, m.name, `${days}일!`, m.color, `members:${m.id}`));
      }
    }
  }

  return results;
}

// ── 상단바 링크 버튼 (구글 시트 gid=981813639) — 커버곡 하드코딩(구 BV_LINK) 대체: 곡·이벤트 교체를 배포 없이 시트에서 ──
// 열: A=링크(https만) B=아이콘 이름(SVG_ICONS 키, 빈칸/미지=youtube) C=모바일 라벨 D=PC 첫줄 E=PC 둘째줄(빈칸=한 줄) F=hex 색(#RRGGBB, 빈칸/무효=커버곡 핑크)
// 헤더 없음(1행부터 데이터), 행 수만큼 버튼 생성(0행=버튼 없음). 로드는 크루 시트와 동일 정책: 캐시 선표시 → fetch → 실패 시 캐시 유지.
const TOPBAR_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=981813639';
const LS_TOPBAR_CACHE = 'chuntaverse_topbar_links_v1';
let topbarLinks = [];

function parseTopbarRows(rows) {
  const out = [];
  for (const r of (rows || [])) {
    const url = (r[0] || '').trim();
    if (!/^https?:\/\//.test(url)) continue;   // 빈 행·메모성 행 자동 제외 + 프로토콜 화이트리스트(javascript: 등 차단 — 채팅 링크와 동일 정책)
    const iconKey = (r[1] || '').trim();
    const hexRaw = (r[5] || '').trim();
    out.push({
      url,
      icon: Object.prototype.hasOwnProperty.call(SVG_ICONS, iconKey) ? iconKey : 'youtube',
      mb: (r[2] || '').trim(),
      l1: (r[3] || '').trim(),
      l2: (r[4] || '').trim(),
      hex: /^#[0-9A-Fa-f]{6}$/.test(hexRaw) ? hexRaw : '#EC4899',
    });
  }
  return out;
}

function topbarLinksHtml() {
  return topbarLinks.map(b => {
    const pc = escapeHtml(b.l1) + (b.l2 ? '<br>' + escapeHtml(b.l2) : '');
    return `<a class="page-title-link tb-sheet-btn" href="${escapeHtml(b.url)}" target="_blank" rel="noopener" style="--tb-rgb:${hexToRgb(b.hex)};color:${b.hex}">${SVG_ICONS[b.icon]}<span class="tb-t-pc">${pc}</span><span class="tb-t-mb">${escapeHtml(b.mb)}</span></a>`;
  }).join('');
}

async function loadTopbarLinks() {
  try { const c = JSON.parse(lsGet(LS_TOPBAR_CACHE, 'null')); if (c) { topbarLinks = parseTopbarRows(c); updatePageTitle(); } } catch (e) {}
  try {
    const res = await fetch(TOPBAR_SHEET_URL);
    if (!res.ok) throw new Error('no data');
    const rows = parseCSV(await res.text());
    lsSet(LS_TOPBAR_CACHE, JSON.stringify(rows));
    topbarLinks = parseTopbarRows(rows);
    updatePageTitle();
  } catch (e) {}   // 실패 시 캐시본 유지 — 첫 방문+시트 장애 조합에서만 버튼 공백(크루 시트와 동일 수용)
}

// ── 좋아요 요청 모아보기 모달 ──
// 좋아요 요청 숨김 목록 — 시트 A열에 게시글 URL(# 앞부분)을 적으면 해당 글의 요청이 모두 숨김.
// 댓글 단위가 아닌 게시글(컨텐츠) 단위 차단 — 같은 글의 추가 요청 댓글도 함께 숨겨짐.
const LIKE_HIDE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=66286785';
const LS_LIKEHIDE_CACHE = 'chuntaverse_like_hide_v3';   // v3: u에 댓글 앵커(#comment_noti) 보존 — v2(앵커 제거)와 저장 의미 달라 무효화. A=URL, B=만료일(YYYY-MM-DD) → {u,d} 객체배열로 캐시
const normLikeUrl = (u) => (u || '').split('#')[0].trim().replace(/\/$/, '');
// dedup·✕·빨간점 키용: 댓글 앵커(#comment_noti…) 보존 — 같은 글이라도 서로 다른 댓글/링크는 별개 요청으로 취급(이벤트 탭과 동일). CSV 숨김은 앵커 있으면 그 댓글만(fullLikeUrl 매칭), 앵커 없으면 글 전체(normLikeUrl 매칭) 숨김.
const fullLikeUrl = (u) => (u || '').trim().replace(/\/$/, '');
// ── 유저 단위 좋아요 요청 상태(localStorage) — CSV 숨김(글 단위·Crenop 관리)과 별개 ──
const LS_LIKE_DISMISS = 'chuntaverse_like_dismiss_v1';    // 유저가 ✕로 숨긴 댓글(멤버+URL 단위, 영구)
const LS_LIKE_SEEN = 'chuntaverse_like_seen_v1';          // 유저가 모달에서 본 댓글(멤버+URL 단위, 빨간 점 끔용)
const LS_LIKEREQ_CACHE = 'chuntaverse_like_req_cache_v1'; // 점 계산용 마지막 목록 캐시
let likeReqCache = [];   // 마지막으로 받은 like_requests(빨간 점 계산용)
const likeReqKey = (e) => `${e.member_id || ''}|${fullLikeUrl(e.url)}`;   // dedup과 동일 키(멤버+전체 URL, 댓글 앵커 포함). dismiss·seen·빨간점이 '같은 링크'를 시간 무관 동일 취급 → X했거나 본 링크는 재요청돼도 다시 안 켜짐
function lsKeySet(key) { try { return new Set(JSON.parse(lsGet(key, '[]'))); } catch (e) { return new Set(); } }
function lsKeyAdd(key, keys) { const s = lsKeySet(key); let ch = false; keys.forEach(k => { if (!s.has(k)) { s.add(k); ch = true; } }); if (ch) lsSet(key, JSON.stringify([...s])); }
// 좋아요 숨김 B열(만료일) 판정: B 비었거나 날짜 형식 밖이면 즉시 숨김, 날짜면 그날(KST)까지 노출하고 지나면 숨김.
// 날짜는 일정 시트와 동일 YYYY-MM-DD 기준(. / 구분·한 자리 월일·뒤따르는 구분자 허용). B엔 날짜만 적을 것(여분 텍스트는 형식 밖→즉시 숨김).
function likeHideActiveOn(dateRaw, todayKst) {
  const m = String(dateRaw || '').trim().replace(/\s+/g, '').replace(/[.\/]/g, '-').replace(/-+$/, '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (!m) return true;
  const due = `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  return todayKst > due;
}
// 캐시 엔트리({u: 정규화URL, d: 만료일})에서 "지금 숨겨야 할" URL Set 생성. 날짜는 호출 시점 KST로 매번 재평가(자정 넘기면 자동 반영).
function buildLikeHideSet(entries) {
  const kst = new Date(Date.now() + 9 * 3600 * 1000);
  const todayKst = `${kst.getUTCFullYear()}-${String(kst.getUTCMonth() + 1).padStart(2, '0')}-${String(kst.getUTCDate()).padStart(2, '0')}`;
  const s = new Set();
  for (const e of (entries || [])) {
    if (e && e.u && likeHideActiveOn(e.d, todayKst)) s.add(e.u);
  }
  return s;
}
function lsHideSet() {
  try { return buildLikeHideSet(JSON.parse(lsGet(LS_LIKEHIDE_CACHE, '[]'))); } catch (e) { return new Set(); }
}
// 같은 멤버가 같은 링크에 보낸 좋아요 요청만 dedup: 멤버 + fullLikeUrl(댓글 앵커 #comment_noti 포함) 기준 최신 1건(과거 건 숨김). 한 글에 링크 여러 개면 각각 별개 요청으로 모두 유지(이벤트 탭과 동일).
// 다른 멤버가 같은 링크를 요청한 건은 별개 요청이므로 각각 유지(달타·캬앙이 같은 컨텐츠 좋아요를 요청한 경우 둘 다 노출).
function dedupeLikeReqs(list) {
  const byKey = new Map();
  for (const e of (list || [])) {
    const k = `${e.member_id || ''}|${fullLikeUrl(e.url)}`;
    const prev = byKey.get(k);
    if (!prev || new Date(e.time) > new Date(prev.time)) byKey.set(k, e);
  }
  return [...byKey.values()].sort((a, b) => new Date(b.time) - new Date(a.time));
}
async function loadLikeHideSet() {
  let entries = [];
  try {
    const res = await fetch(LIKE_HIDE_SHEET_URL);
    if (!res.ok) throw new Error('no data');
    entries = parseCSV(await res.text())
      .map(r => ({ u: fullLikeUrl((r[0] || '').trim()), d: (r[1] || '').trim() }))   // 앵커 보존: 앵커 있으면 그 댓글만, 없으면 글 URL(글단위 매칭은 대조 시 normLikeUrl로)
      .filter(e => e.u.startsWith('http'));
    lsSet(LS_LIKEHIDE_CACHE, JSON.stringify(entries));
  } catch (e) {
    try { entries = JSON.parse(lsGet(LS_LIKEHIDE_CACHE, '[]')); } catch (e2) { entries = []; }
  }
  return buildLikeHideSet(entries);
}

// 숨김목록 선로딩분(모달 1회용). hover/클릭에서 호출하되 한 번 받기 시작하면 그 약속을 재사용(중복 fetch 방지).
// 모달을 닫을 때 폐기 → 다음 열기는 그 시점 시트를 새로 읽음(stale 없음). loadLikeHideSet은 실패해도 Set을 돌려주므로 reject 없음.
let likeHidePreload = null;
function preloadLikeHide() {
  if (!likeHidePreload) likeHidePreload = loadLikeHideSet();
  return likeHidePreload;
}

async function openLikeRequests() {
  const ov = document.getElementById('lrOverlay');
  const head = document.getElementById('lrHead');
  const body = document.getElementById('lrBody');
  if (!ov || !body) return;
  head.innerHTML = `<span>${SVG_ICONS.thumbsup}멤버들의 좋아요 요청 모아보기</span><button class="lr-close" type="button" onclick="closeLikeRequests()">✕</button>`;
  ov.hidden = false;
  syncBodyScrollLock();
  body.innerHTML = '<div class="lr-msg">불러오는 중…</div>';
  try {
    // hover로 이미 받는 중/받아둔 게 있으면 그걸, 아니면 지금 시작. 숨김목록을 손에 쥔 뒤 렌더하므로 "보였다 사라짐" 없음.
    const [res, hideSet] = await Promise.all([fetch(WORKER_URL + '/like-requests'), preloadLikeHide()]);
    const data = await res.json();
    likeReqCache = dedupeLikeReqs(data.like_requests || []);          // 점 계산용 갱신(같은 글 최신만)
    lsSet(LS_LIKEREQ_CACHE, JSON.stringify(likeReqCache));
    const dismiss = lsKeySet(LS_LIKE_DISMISS);
    const list = likeReqCache.filter(e => !(hideSet.has(fullLikeUrl(e.url)) || hideSet.has(normLikeUrl(e.url))) && !dismiss.has(likeReqKey(e)));
    if (list.length === 0) {
      body.innerHTML = '<div class="lr-msg">기록된 좋아요 요청이 없습니다.</div>';
    } else {
      body.innerHTML = list.map(e => `<div class="lr-item" data-lrkey="${escapeHtml(likeReqKey(e))}">${renderEvent(e, [])}<button class="lr-dismiss" type="button" aria-label="숨기기">✕</button></div>`).join('');
    }
    lsKeyAdd(LS_LIKE_SEEN, list.map(likeReqKey));                     // 본 것으로 표시 → 점 끔
    refreshLikeDot();
  } catch (err) {
    body.innerHTML = '<div class="lr-msg">불러오기에 실패했습니다. 잠시 후 다시 시도해주세요.</div>';
  }
}
// 모달 열림 중 배경 스크롤 잠금 — 열린 오버레이(lrOverlay=좋아요·일정 공용, statGraphOverlay=그래프)가
// 하나라도 있으면 body 스크롤 차단, 모두 닫히면 복원. open/close 5지점에서 호출.
function syncBodyScrollLock() {
  const anyOpen = ['lrOverlay', 'statGraphOverlay'].some(id => { const el = document.getElementById(id); return el && !el.hidden; });
  document.body.style.overflow = anyOpen ? 'hidden' : '';
}

function closeLikeRequests() {
  const ov = document.getElementById('lrOverlay');
  if (ov) ov.hidden = true;
  syncBodyScrollLock();
  likeHidePreload = null;  // 선로딩분은 모달 1회용 — 다음 열기는 그 시점 최신으로
  schedulePreload = null;  // 일정 모달도 lrOverlay를 공유 — 선로딩분 동일하게 폐기
}
// 빨간 점: 안 숨김(dismiss)·안 가려짐(CSV 캐시)·안 본(seen) 요청이 1개+면 표시
function computeLikeDot() {
  const dismiss = lsKeySet(LS_LIKE_DISMISS), seen = lsKeySet(LS_LIKE_SEEN), hide = lsHideSet();
  return likeReqCache.some(e => {
    const k = likeReqKey(e);
    return !dismiss.has(k) && !seen.has(k) && !(hide.has(fullLikeUrl(e.url)) || hide.has(normLikeUrl(e.url)));
  });
}
function refreshLikeDot() {
  const btn = document.getElementById('likeReqBtn');
  if (btn) btn.classList.toggle('has-new', computeLikeDot());
}
// 페이지 로드 시 점 계산용 목록 1회 로드(엣지 캐시 max-age=60 → 대부분 히트, 비용 미미). 캐시 우선으로 점 즉시 반영.
async function loadLikeReqForDot() {
  try { likeReqCache = dedupeLikeReqs(JSON.parse(lsGet(LS_LIKEREQ_CACHE, '[]'))); } catch (e) { likeReqCache = []; }
  refreshLikeDot();
  try {
    const res = await fetch(WORKER_URL + '/like-requests');
    const data = await res.json();
    likeReqCache = dedupeLikeReqs(data.like_requests || []);
    lsSet(LS_LIKEREQ_CACHE, JSON.stringify(likeReqCache));
    refreshLikeDot();
  } catch (e) {}
}
// ✕ 개별 숨김 — localStorage에 요청 키 저장(영구), 열린 모달에서 해당 카드 제거
function dismissLikeRequest(key) {
  lsKeyAdd(LS_LIKE_DISMISS, [key]);
  const body = document.getElementById('lrBody');
  if (body) {
    body.querySelectorAll('.lr-item').forEach(it => { if (it.dataset.lrkey === key) it.remove(); });
    if (!body.querySelector('.lr-item') && !body.querySelector('.lr-msg')) {
      body.innerHTML = '<div class="lr-msg">기록된 좋아요 요청이 없습니다.</div>';
    }
