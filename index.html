<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>천타버스</title>
<link rel="icon" type="image/webp" href="Favicon.webp">
<style>
  :root {
    --bg: #070a14;
    --surface: #0d1120;
    --surface2: #131929;
    --border: #1e2740;
    --live: #ff3b3b;
    --live-glow: rgba(255,59,59,0.25);
    --accent: #61FFEC;
    --accent2: #61FFEC;
    --text: #e2e8f0;
    --muted: #64748b;
    --time: #fbbf24;
    --ev-start: #34d399;
    --ev-end: #f87171;
    --ev-yellow: #fbbf24;
    --ev-blue: #60a5fa;
    --ev-comment: #ec4899;
    --ev-post: #60a5fa;
    --ev-youtube: #ef4444;
    --mode-adult: #ec4899;
    --mode-subscription: #f59e0b;
    --mode-copyright: #94a3b8;
    --filter-soop: #0388FF;
    --filter-post: #2EF5E1;
    --sidebar-w: 200px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100vh; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 35%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(2px 2px at 15% 50%, rgba(97,255,236,0.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    z-index: 2;
    flex-shrink: 0;
  }
  .sidebar-logo {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    text-align: center;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sidebar-logo img { max-width: 100%; max-height: 32px; height: auto; display: block; }
  .nav-list { padding: 8px 0; display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 20px; color: var(--muted);
    cursor: pointer; font-size: 14px; font-weight: 600;
    border: none; background: none; text-align: left;
    width: 100%; font-family: inherit;
    border-left: 3px solid transparent;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
  }
  .nav-item:hover { color: var(--text); background: var(--surface2); }
  .nav-item.active { color: var(--accent2); background: var(--surface2); border-left-color: var(--accent); }
  .nav-icon { font-size: 16px; width: 18px; text-align: center; }

  .main {
    flex: 1; min-width: 0;
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
  }
  .main-header {
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(97,255,236,0.05) 0%, transparent 100%);
    display: flex; align-items: center; gap: 16px;
    min-height: 56px;
  }
  .page-title { font-size: 18px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; }
  .header-center {
    flex: 1; text-align: center; color: var(--muted);
    font-size: 12px; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .live-status {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 7px 16px; font-size: 13px;
  }
  .live-dot {
    width: 8px; height: 8px;
    background: var(--live);
    box-shadow: 0 0 6px var(--live-glow);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .live-dot.none { background: var(--muted); box-shadow: none; animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .page { display: none; flex: 1; flex-direction: column; }
  .page.active { display: flex; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px; padding: 24px 32px;
    max-width: 1600px; width: 100%; margin: 0 auto;
    flex: 1;
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 800px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 500px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    overflow: hidden;
    text-decoration: none; color: inherit;
    display: block;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    opacity: 0;
    animation: fadeIn 0.4s ease forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 8px 24px rgba(97,255,236,0.18); }
  .card.live { border-color: var(--accent); }
  .card.live:hover { border-color: var(--accent2); box-shadow: 0 8px 24px rgba(97,255,236,0.18); }
  .card.offline .card-thumb { opacity: 0.4; }
  .card.offline .card-name { color: var(--muted) !important; }

  .card-thumb {
    width: 100%; aspect-ratio: 16/9;
    background: var(--surface2);
    position: relative; overflow: hidden;
  }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-thumb .placeholder {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden; gap: 8px;
  }
  .card-thumb .placeholder img {
    max-width: 50%; max-height: 60%;
    width: auto; height: auto;
    object-fit: contain; opacity: 0.4;
  }
  .placeholder-mode-text {
    font-size: 12px; font-weight: 600;
    color: var(--muted); letter-spacing: 0.5px;
    text-align: center;
  }
  .badge-live {
    position: absolute; top: 10px; left: 10px;
    background: var(--live); color: white;
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    padding: 4px 10px;
    box-shadow: 0 2px 8px rgba(255,59,59,0.5);
  }
  .badge-mode {
    position: absolute; top: 10px; right: 10px;
    color: white; font-size: 11px; font-weight: 700;
    letter-spacing: 0.5px; padding: 4px 10px;
  }
  .badge-mode.adult { background: var(--mode-adult); box-shadow: 0 2px 8px rgba(236,72,153,0.45); }
  .badge-mode.subscription { background: var(--mode-subscription); box-shadow: 0 2px 8px rgba(245,158,11,0.45); }
  .badge-mode.copyright { background: var(--mode-copyright); box-shadow: 0 2px 8px rgba(148,163,184,0.45); }
  .badge-mode.restricted { background: var(--muted); }

  .card-info { padding: 12px 14px 14px; display: flex; align-items: center; gap: 10px; }
  .card-avatar {
    width: 36px; height: 36px;
    object-fit: cover; flex-shrink: 0;
    border: 1.5px solid var(--border);
  }
  .card-text { min-width: 0; flex: 1; }
  /* 이름 + 방송 시간을 같은 줄에 */
  .card-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 3px;
    min-width: 0;
  }
  .card-name {
    font-size: 15px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0;
  }
  .card-btime {
    font-size: 11px;
    color: var(--time);
    font-weight: 600;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }
  .card-title {
    font-size: 12px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    line-height: 1.3;
  }
  .card-title.is-live { color: #94a3b8; }

  .loading { text-align: center; padding: 80px 20px; color: var(--muted); flex: 1; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .events-wrap {
    padding: 20px 24px;
    max-width: 1400px; width: 100%; margin: 0 auto;
    flex: 1;
    display: grid; grid-template-columns: 1fr 280px;
    gap: 20px; align-items: start;
  }
  @media (max-width: 900px) {
    .events-wrap { grid-template-columns: 1fr; }
    .filter-panel { position: static !important; }
  }
  .timeline { background: var(--surface); border: 1px solid var(--border); min-width: 0; }
  .timeline-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px; }

  .filter-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px;
    position: sticky; top: 20px;
  }
  .filter-section + .filter-section {
    margin-top: 20px; padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .filter-title {
    font-size: 12px; font-weight: 700;
    color: var(--muted); letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .filter-members-block { display: flex; flex-direction: column; gap: 10px; }

  /* 멤버 필터 전체 버튼: 이미지(Title.webp) 사용 */
  .filter-member-all {
    display: flex; align-items: center; justify-content: center;
    padding: 8px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    width: 100%;
    height: 40px;
    box-sizing: border-box;
  }
  .filter-member-all:hover { border-color: var(--accent); }
  .filter-member-all.on { border-color: var(--accent); }
  .filter-member-all img {
    max-height: 22px;
    max-width: 100%;
    width: auto;
    height: auto;
    display: block;
    transition: opacity 0.15s, filter 0.15s;
  }
  .filter-member-all:not(.on) img { opacity: 0.4; filter: grayscale(0.6); }

  .filter-members { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .filter-member {
    position: relative;
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer; overflow: hidden;
    transition: all 0.15s; padding: 0;
  }
  .filter-member img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: opacity 0.15s;
  }
  .filter-member:not(.on) img { opacity: 0.25; filter: grayscale(1); }
  .filter-member.on { border-color: var(--accent); }
  .filter-member:hover { border-color: var(--accent); }

  .filter-types { display: flex; flex-direction: column; gap: 6px; }
  .filter-type {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer; font-size: 13px; font-weight: 600;
    color: var(--muted); transition: all 0.15s;
    font-family: inherit; text-align: left; width: 100%;
  }
  .filter-type:hover { color: var(--text); border-color: var(--accent); }
  .filter-type.on { border-color: var(--accent); color: var(--text); }
  .filter-type .dot { width: 12px; height: 12px; flex-shrink: 0; }
  .filter-type[data-type="all"] .dot { background: #ffffff; }
  .filter-type[data-type="soop"] .dot { background: var(--filter-soop); }
  .filter-type[data-type="post"] .dot { background: var(--filter-post); }
  .filter-type[data-type="youtube"] .dot { background: var(--ev-youtube); }

  .filter-summary {
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted); text-align: center;
  }
  .event {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    transition: background 0.15s;
  }
  .event:hover { background: var(--surface2); }
  .event + .event { border-top: 1px solid var(--border); }
  .event-icon {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
    background: var(--surface2); font-weight: 700;
  }
  .event-icon.start { background: rgba(52,211,153,0.15); color: var(--ev-start); }
  .event-icon.end { background: rgba(248,113,113,0.15); color: var(--ev-end); }
  .event-icon.title { background: rgba(251,191,36,0.15); color: var(--ev-yellow); }
  .event-icon.category { background: rgba(251,191,36,0.15); color: var(--ev-yellow); }
  .event-icon.mode_change { background: rgba(251,191,36,0.15); color: var(--ev-yellow); }
  .event-icon.post { background: rgba(96,165,250,0.15); color: var(--ev-post); }
  .event-icon.comment_recommend { background: rgba(96,165,250,0.15); color: var(--ev-post); }
  .event-icon.youtube { background: rgba(239,68,68,0.15); color: var(--ev-youtube); }
  .event a.event-link { color: inherit; text-decoration: none; display: contents; }
  .event a.event-link:hover .event-detail { color: var(--accent2); }
  .event-avatar { width: 28px; height: 28px; object-fit: cover; flex-shrink: 0; }
  .event-body { flex: 1; min-width: 0; font-size: 14px; }
  .event-member { font-weight: 700; margin-right: 6px; }
  .event-action { color: var(--muted); }
  .event-target { color: #cbd5e1; margin-left: 4px; }
  .event-mode-tag {
    display: inline-block; margin-left: 6px;
    padding: 1px 7px; font-size: 11px;
    font-weight: 600; color: white;
    letter-spacing: 0.3px; vertical-align: 1px;
  }
  .event-mode-tag.adult { background: var(--mode-adult); }
  .event-mode-tag.subscription { background: var(--mode-subscription); }
  .event-mode-tag.copyright { background: var(--mode-copyright); }
  .event-mode-tag.restricted { background: var(--muted); }
  .event-detail {
    color: #94a3b8; font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-top: 3px;
  }
  .event-time {
    font-size: 12px; color: var(--muted);
    flex-shrink: 0; text-align: right; line-height: 1.4;
  }
  .event-time-rel { display: block; }
  .event-time-abs {
    display: block; font-size: 10px;
    color: var(--muted); opacity: 0.7;
  }

  .stats-wrap {
    padding: 20px 24px;
    max-width: 1600px; width: 100%; margin: 0 auto;
    flex: 1;
  }

  /* 통계 탭: "전체" 우측 분리 + 멤버 12명 6+6 두 줄 */
  .stats-tabs-wrap {
    display: flex;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px;
    margin: 0 auto 16px;
    align-items: stretch;
    max-width: 880px;
  }
  .stats-tabs-members {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .stats-tabs-side {
    display: flex;
    align-items: stretch;
  }
  .stats-tab {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    padding: 6px 8px;
    color: var(--muted); cursor: pointer;
    font-size: 13px; font-weight: 700;
    font-family: inherit;
    transition: all 0.15s;
    text-align: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    box-sizing: border-box;
    min-height: 36px;
  }
  .stats-tab:hover { color: var(--text); border-color: var(--accent); }
  .stats-tab.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .stats-tab img {
    width: 18px; height: 18px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .stats-tab-all {
    width: 70px;
    height: 100%;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  @media (max-width: 1100px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 800px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 500px) { .stats-grid { grid-template-columns: 1fr; } }

  .stats-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .stats-card-header { display: flex; align-items: center; gap: 10px; }
  .stats-card-avatar {
    width: 40px; height: 40px;
    object-fit: cover;
    border: 1.5px solid var(--border);
    flex-shrink: 0;
  }
  .stats-card-name { font-size: 16px; font-weight: 700; }
  .stats-card-rows { display: flex; flex-direction: column; gap: 6px; }
  .stats-card-row {
    display: flex; justify-content: space-between;
    align-items: baseline; font-size: 13px;
  }
  .stats-card-label { color: var(--muted); font-weight: 600; }
  .stats-card-value { color: var(--text); font-weight: 700; }
  .stats-card-value.accent { color: var(--accent); }

  .stats-detail-header {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .stats-detail-month {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 12px;
  }
  .stats-month-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 28px; height: 28px;
    cursor: pointer; font-family: inherit; font-weight: 700;
  }
  .stats-month-btn:hover { border-color: var(--accent); color: var(--accent); }
  .stats-month-btn:disabled { color: var(--muted); cursor: not-allowed; opacity: 0.4; }
  .stats-month-text { font-size: 14px; font-weight: 700; min-width: 110px; text-align: center; }
  .stats-detail-summary {
    display: flex; flex: 1; flex-wrap: wrap; gap: 16px;
    padding: 8px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    align-items: center;
  }
  .stats-summary-item { display: flex; flex-direction: column; gap: 2px; }
  .stats-summary-label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; }
  .stats-summary-value { font-size: 14px; font-weight: 700; }

  .stats-detail-body {
    display: grid;
    grid-template-columns: minmax(0, 480px) 1fr;
    gap: 16px; align-items: start;
  }
  @media (max-width: 900px) { .stats-detail-body { grid-template-columns: 1fr; } }

  .calendar { background: var(--surface); border: 1px solid var(--border); padding: 12px; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .calendar-weekday {
    text-align: center; font-size: 11px;
    color: var(--muted); font-weight: 700; padding: 6px 0;
  }
  .calendar-weekday.sun { color: #f87171; }
  .calendar-weekday.sat { color: #60a5fa; }
  .calendar-day {
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1.5px solid transparent;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 13px; color: var(--text);
    cursor: pointer; transition: all 0.15s;
    padding: 4px; gap: 2px;
    font-family: inherit;
  }
  .calendar-day:hover { border-color: var(--accent); }
  .calendar-day.outside { opacity: 0.25; cursor: default; }
  .calendar-day.outside:hover { border-color: transparent; }
  .calendar-day.has-broadcast { background: rgba(97,255,236,0.18); color: var(--accent); }
  .calendar-day.has-broadcast:hover { background: rgba(97,255,236,0.30); }
  .calendar-day.selected { border-color: var(--accent); }
  .calendar-day.today { box-shadow: inset 0 0 0 1.5px var(--time); }
  .calendar-daynum { font-weight: 700; font-size: 13px; }
  .calendar-daycount { font-size: 9px; opacity: 0.8; }

  .day-detail {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px; min-height: 200px;
  }
  .day-detail-title {
    font-size: 14px; font-weight: 700;
    color: var(--accent);
    margin-bottom: 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .day-detail-empty {
    text-align: center; padding: 40px 0;
    color: var(--muted); font-size: 13px;
  }
  .day-session {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 10px 12px; margin-bottom: 8px;
  }
  .day-session-time {
    font-size: 12px; color: var(--time);
    font-weight: 600; margin-bottom: 4px;
  }
  .day-session-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .day-session-mode {
    display: inline-block;
    padding: 1px 6px; font-size: 10px;
    font-weight: 600; color: white;
    letter-spacing: 0.3px; margin-right: 6px;
  }
  .day-session-mode.adult { background: var(--mode-adult); }

function switchPage(page) {

function formatBtime(seconds) {
  if (!seconds || seconds <= 0) return null;
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (h > 0) return h + '시간 ' + m + '분';
  return m + '분';
}
function formatRelTime(iso) {
  const now = new Date();
  const t = new Date(iso);
  const diff = Math.floor((now - t) / 1000);
  if (diff < 60) return '방금 전';
  if (diff < 3600) return Math.floor(diff / 60) + '분 전';
  if (diff < 86400) return Math.floor(diff / 3600) + '시간 전';
  return Math.floor(diff / 86400) + '일 전';
}
function formatAbsTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd} ${hh}:${mi}`;
}
function formatHHMM(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${hh}:${mi}`;
}
function formatDuration(ms) {
  if (!ms || ms <= 0) return '0분';
  const totalMin = Math.floor(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h > 0) return `${h}시간 ${m}분`;
  return `${m}분`;
}
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}
function soopProfileUrl(userId) {
  const prefix = userId.substring(0, 2);
  return `https://profile.img.sooplive.com/LOGO/${prefix}/${userId}/${userId}.jpg`;
}
function isoToKstDateKey(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}
function ymdKey(year, month1, day) {
  return `${year}-${String(month1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function daysInMonth(year, month1) {
  return new Date(year, month1, 0).getDate();
}

function buildCard(m, info, delay) {
  const tag = info.live ? 'a' : 'div';
  const card = document.createElement(tag);
  card.className = 'card ' + (info.live ? 'live' : 'offline');
  card.style.animationDelay = delay + 'ms';
  if (info.live) {
    card.href = 'https://play.sooplive.co.kr/' + info.id;
    card.target = '_blank';
    card.rel = 'noopener';
  }
  const btime = formatBtime(info.btime);
  const mode = info.mode || (info.live ? 'normal' : null);
  const isNormalLive = info.live && mode === 'normal';
  const hasThumb = info.thumb && isNormalLive;
  const thumbHtml = hasThumb
    ? `<img src="${info.thumb}" alt="${m.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';
  const placeholderInner = info.live && mode && mode !== 'normal'
    ? `<img src="${m.img}" alt="${m.name}"><div class="placeholder-mode-text">${MODE_PLACEHOLDER_TEXT[mode] || ''}</div>`
    : `<img src="${m.img}" alt="${m.name}">`;
  const modeBadge = info.live && mode && mode !== 'normal'
    ? `<span class="badge-mode ${mode}">${MODE_BADGE_LABEL[mode] || ''}</span>`
    : '';
  const profileUrl = soopProfileUrl(m.id);
  const avatarHtml = profileUrl
    ? `<img class="card-avatar" src="${profileUrl}" alt="${m.name}" onerror="this.onerror=null;this.src='${m.img}'">`
    : `<img class="card-avatar" src="${m.img}" alt="${m.name}">`;
  let titleText;
  if (!info.live) titleText = '오프라인';
  else if (info.title) titleText = info.title;
  else if (mode && mode !== 'normal') titleText = MODE_PLACEHOLDER_TEXT[mode] || '방송 중';
  else titleText = '방송 중';

  // 방송 시간을 이름 우측에
  const btimeHtml = btime ? `<span class="card-btime"><span>⏱</span><span>${btime}</span></span>` : '';
  // 라이브일 때 멤버 색상 적용 (오프라인이면 muted)
  const nameColorStyle = info.live ? `color: ${m.color}` : '';

  card.innerHTML = `
    <div class="card-thumb">
      ${thumbHtml}
      <div class="placeholder" style="display:${hasThumb ? 'none' : 'flex'}">${placeholderInner}</div>
      ${modeBadge}
    </div>
    <div class="card-info">
      ${avatarHtml}
      <div class="card-text">
        <div class="card-name-row">
          <span class="card-name" style="${nameColorStyle}">${m.name}</span>
          ${btimeHtml}
        </div>
        <div class="card-title ${info.live ? 'is-live' : ''}">${escapeHtml(titleText)}</div>
      </div>
    </div>
  `;
  return card;
}

function renderEvent(e) {
  const iconMap = {
    start: '▶', end: '■',
    title: '✎', category: '#', mode_change: '◆',
    post: '✉', comment_recommend: '↑',
    youtube: '▶'
  };
  const actionMap = {
    start: '방송 시작', end: '방송 종료',
    title: '방제 변경', category: '카테고리 변경', mode_change: '방송 모드 변경',
    post: '숲 게시글', comment_recommend: '댓글 추천',
    youtube: '유튜브 영상',
  };
  const member = findMember(e.member_id);
  const avatarSrc = member ? member.img : '';
  const memberColor = member ? member.color : '#fff';

  let modeTag = '';
  if ((e.type === 'start' || e.type === 'end') && e.mode && e.mode !== 'normal') {
    const label = MODE_BADGE_LABEL[e.mode] || '';
    if (label) modeTag = `<span class="event-mode-tag ${e.mode}">${label}</span>`;
  }
  let targetTag = '';
  if (e.type === 'comment_recommend' && e.target_name) {
    targetTag = `<span class="event-target">(${escapeHtml(e.target_name)} 컨텐츠)</span>`;
  }
  let detail = '';
  if (e.type === 'start' && e.title) {
    detail = `<div class="event-detail">${escapeHtml(e.title)}</div>`;
  } else if (e.type === 'title' || e.type === 'category') {
    detail = `<div class="event-detail">${escapeHtml(e.before)} → ${escapeHtml(e.after)}</div>`;
  } else if (e.type === 'mode_change') {
    const beforeLabel = MODE_LABEL[e.before] || e.before;
    const afterLabel = MODE_LABEL[e.after] || e.after;
    detail = `<div class="event-detail">${escapeHtml(beforeLabel)} → ${escapeHtml(afterLabel)}</div>`;
  } else if ((e.type === 'post' || e.type === 'youtube' || e.type === 'comment_recommend') && e.title) {
    detail = `<div class="event-detail">${escapeHtml(e.title)}</div>`;
  }
  const inner = `
    <div class="event-icon ${e.type}">${iconMap[e.type] || '•'}</div>
    ${avatarSrc ? `<img class="event-avatar" src="${avatarSrc}" alt="${escapeHtml(e.member_name)}">` : ''}
    <div class="event-body">
      <div>
        <span class="event-member" style="color: ${memberColor}">${escapeHtml(e.member_name)}</span>
        <span class="event-action">${actionMap[e.type] || e.type}</span>
        ${targetTag}
        ${modeTag}
      </div>
      ${detail}
    </div>
    <div class="event-time">
      <span class="event-time-rel">${formatRelTime(e.time)}</span>
      <span class="event-time-abs">${formatAbsTime(e.time)}</span>
    </div>
  `;
  if (e.url) {
    return `<div class="event"><a class="event-link" href="${escapeHtml(e.url)}" target="_blank" rel="noopener">${inner}</a></div>`;
  }
  return `<div class="event">${inner}</div>`;
}

function initFilterUI() {
  const allBtn = document.getElementById('filterMemberAll');
  const mc = document.getElementById('filterMembers');
  if (mc && !mc.dataset.inited) {
    mc.innerHTML = MEMBERS.map(m => `
      <button class="filter-member" data-id="${m.id}" title="${m.name}">
        <img src="${m.img}" alt="${m.name}">
      </button>
    `).join('');
    const setSelected = (id) => {
      filterState.member = id;
      allBtn.classList.toggle('on', id === 'all');
      mc.querySelectorAll('.filter-member').forEach(b => {
        b.classList.toggle('on', b.dataset.id === id);
      });
      applyFilter();
    };
    allBtn.addEventListener('click', () => setSelected('all'));
    mc.querySelectorAll('.filter-member').forEach(btn => {
      btn.addEventListener('click', () => setSelected(btn.dataset.id));
    });
    mc.dataset.inited = '1';
  }
  const tc = document.getElementById('filterTypes');
  if (tc && !tc.dataset.inited) {
    tc.querySelectorAll('.filter-type').forEach(btn => {
      btn.addEventListener('click', () => {
        filterState.type = btn.dataset.type;
        tc.querySelectorAll('.filter-type').forEach(b => {
          b.classList.toggle('on', b.dataset.type === filterState.type);
        });
        applyFilter();
      });
    });
    tc.dataset.inited = '1';
  }
}

function applyFilter() {
  const tl = document.getElementById('timeline');
  if (!tl) return;
  const typeToCat = (et) => {
    if (et === 'post' || et === 'comment_recommend') return 'post';
    if (et === 'youtube') return 'youtube';
    return 'soop';
  };
  const filtered = allEvents.filter(e => {
    if (filterState.member !== 'all' && e.member_id !== filterState.member) return false;
    if (filterState.type !== 'all' && typeToCat(e.type) !== filterState.type) return false;
    return true;
  });
  if (filtered.length === 0) {
    if (allEvents.length === 0) {
      tl.innerHTML = '<div class="timeline-empty">아직 기록된 이벤트가 없어요<br><br>방송, 게시글, 유튜브 영상 등이 올라오면 여기에 표시됩니다</div>';
    } else {
      tl.innerHTML = '<div class="timeline-empty">필터 조건에 맞는 이벤트가 없어요</div>';
    }
  } else {
    tl.innerHTML = filtered.map(renderEvent).join('');
  }
  const summary = document.getElementById('filterSummary');
  if (summary) summary.textContent = `${filtered.length} / ${allEvents.length}개 표시 중`;
}

function initStatsTabs() {
  const memberBox = document.getElementById('statsTabsMembers');
  const sideBox = document.getElementById('statsTabsSide');
  if (!memberBox || !sideBox) return;

  // 멤버 12명: 그리드로 6+6
  memberBox.innerHTML = MEMBERS.map(m => `
    <button class="stats-tab" data-tab="${m.id}">
      <img src="${m.img}" alt="${m.name}"><span>${m.name}</span>
    </button>
  `).join('');
  // 전체: 우측 분리
  sideBox.innerHTML = `<button class="stats-tab stats-tab-all active" data-tab="all">전체</button>`;

  const allTabs = [
    ...memberBox.querySelectorAll('.stats-tab'),
    ...sideBox.querySelectorAll('.stats-tab'),
  ];
  allTabs.forEach(btn => {
    btn.addEventListener('click', () => {
      statsState.selectedTab = btn.dataset.tab;
      allTabs.forEach(b => {
        b.classList.toggle('active', b.dataset.tab === statsState.selectedTab);
      });
      if (statsState.selectedTab !== 'all') {
        const now = new Date();
        statsState.viewMonth = { year: now.getFullYear(), month: now.getMonth() + 1 };
        statsState.selectedDate = null;
      }
      renderStatsBody();
    });
  });
  if (statsState.data) renderStatsBody();
}

function computeMonthSummary(memberStats, year, month1) {
  const result = {
    daysWithBroadcast: 0,
    totalDaysInMonth: daysInMonth(year, month1),
    totalDurationMs: 0,
    postCount: 0,
    youtubeCount: 0,
    sessionsByDate: {},
  };
  if (!memberStats) return result;
  const monthStart = new Date(year, month1 - 1, 1, 0, 0, 0).getTime();
  const monthEnd = new Date(year, month1, 1, 0, 0, 0).getTime();
  const dateSet = new Set();
  for (const s of (memberStats.sessions || [])) {
    const startMs = new Date(s.start).getTime();
    if (isNaN(startMs)) continue;
    if (startMs < monthStart || startMs >= monthEnd) continue;
    const dateKey = isoToKstDateKey(s.start);
    if (!dateKey) continue;
    dateSet.add(dateKey);
    if (!result.sessionsByDate[dateKey]) result.sessionsByDate[dateKey] = [];
    result.sessionsByDate[dateKey].push(s);
    if (s.end) {
      const endMs = new Date(s.end).getTime();
      if (!isNaN(endMs) && endMs > startMs) {
        result.totalDurationMs += (endMs - startMs);
      }
    }
  }
  result.daysWithBroadcast = dateSet.size;
  for (const p of (memberStats.posts || [])) {
    const t = new Date(p.time).getTime();
    if (!isNaN(t) && t >= monthStart && t < monthEnd) result.postCount++;
  }
  for (const y of (memberStats.youtube || [])) {
    const t = new Date(y.time).getTime();
    if (!isNaN(t) && t >= monthStart && t < monthEnd) result.youtubeCount++;
  }
  return result;
}

function renderStatsBody() {
  const body = document.getElementById('statsBody');
  if (!body) return;
  if (!statsState.data) {
    body.innerHTML = '<div class="loading"><div class="spinner"></div><div>통계 불러오는 중...</div></div>';
    return;
  }
  if (statsState.selectedTab === 'all') {
    renderStatsAll(body);
  } else {
    renderStatsMember(body, statsState.selectedTab);
  }
}

function renderStatsAll(body) {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  const cards = MEMBERS.map(m => {
    const ms = statsState.data[m.id];
    const sum = computeMonthSummary(ms, year, month);
    return `
      <div class="stats-card">
        <div class="stats-card-header">
          <img class="stats-card-avatar" src="${m.img}" alt="${m.name}">
          <div class="stats-card-name" style="color: ${m.color}">${m.name}</div>
        </div>
        <div class="stats-card-rows">
          <div class="stats-card-row">
            <span class="stats-card-label">방송 일수</span>
            <span class="stats-card-value accent">${sum.daysWithBroadcast}일 / ${sum.totalDaysInMonth}일</span>
          </div>
          <div class="stats-card-row">
            <span class="stats-card-label">방송 시간</span>
            <span class="stats-card-value">${formatDuration(sum.totalDurationMs)}</span>
          </div>
          <div class="stats-card-row">
            <span class="stats-card-label">숲 게시글</span>
            <span class="stats-card-value">${sum.postCount}개</span>
          </div>
          <div class="stats-card-row">
            <span class="stats-card-label">유튜브 업로드</span>
            <span class="stats-card-value">${sum.youtubeCount}개</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
  body.innerHTML = `
    <div style="margin-bottom: 12px; color: var(--muted); font-size: 13px; text-align: center;">
      ${year}년 ${month}월 기준
    </div>
    <div class="stats-grid">${cards}</div>
  `;
}

function renderStatsMember(body, memberId) {
  const m = MEMBER_BY_ID[memberId];
  if (!m) { body.innerHTML = ''; return; }
  if (!statsState.viewMonth) {
    const now = new Date();
    statsState.viewMonth = { year: now.getFullYear(), month: now.getMonth() + 1 };
  }
  const { year, month } = statsState.viewMonth;
  const ms = statsState.data[memberId];
  const sum = computeMonthSummary(ms, year, month);
  const now = new Date();
  const isCurrentMonth = (year === now.getFullYear() && month === now.getMonth() + 1);

  let html = `
    <div class="stats-detail-header">
      <div class="stats-detail-month">
        <button class="stats-month-btn" data-dir="prev">‹</button>
        <span class="stats-month-text">${year}년 ${month}월</span>
        <button class="stats-month-btn" data-dir="next" ${isCurrentMonth ? 'disabled' : ''}>›</button>
      </div>
      <div class="stats-detail-summary">
        <div class="stats-summary-item">
          <span class="stats-summary-label">방송 일수</span>
          <span class="stats-summary-value" style="color: var(--accent)">${sum.daysWithBroadcast}일 / ${sum.totalDaysInMonth}일</span>
        </div>
        <div class="stats-summary-item">
          <span class="stats-summary-label">방송 시간</span>
          <span class="stats-summary-value">${formatDuration(sum.totalDurationMs)}</span>
        </div>
        <div class="stats-summary-item">
          <span class="stats-summary-label">숲 게시글</span>
          <span class="stats-summary-value">${sum.postCount}개</span>
        </div>
        <div class="stats-summary-item">
          <span class="stats-summary-label">유튜브 업로드</span>
          <span class="stats-summary-value">${sum.youtubeCount}개</span>
        </div>
      </div>
    </div>
    <div class="stats-detail-body">
      ${renderCalendar(year, month, sum.sessionsByDate)}
      <div class="day-detail" id="dayDetail">${renderDayDetail(year, month, sum.sessionsByDate)}</div>
    </div>
  `;
  body.innerHTML = html;

  body.querySelectorAll('.stats-month-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const dir = btn.dataset.dir;
      let { year: y, month: mo } = statsState.viewMonth;
      if (dir === 'prev') {
        mo -= 1;
        if (mo < 1) { mo = 12; y -= 1; }
      } else {
        mo += 1;
        if (mo > 12) { mo = 1; y += 1; }
      }
      const nowD = new Date();
      const futureCheck = new Date(y, mo - 1, 1).getTime() > new Date(nowD.getFullYear(), nowD.getMonth(), 1).getTime();
      if (futureCheck) return;
      statsState.viewMonth = { year: y, month: mo };
      statsState.selectedDate = null;
      renderStatsBody();
    });
  });
  body.querySelectorAll('.calendar-day').forEach(btn => {
    if (btn.classList.contains('outside')) return;
    btn.addEventListener('click', () => {
      const date = btn.dataset.date;
      statsState.selectedDate = (statsState.selectedDate === date) ? null : date;
      body.querySelectorAll('.calendar-day').forEach(d => {
        d.classList.toggle('selected', d.dataset.date === statsState.selectedDate);
      });
      const dd = document.getElementById('dayDetail');
      if (dd) dd.innerHTML = renderDayDetail(year, month, sum.sessionsByDate);
    });
  });
}

function renderCalendar(year, month1, sessionsByDate) {
  const totalDays = daysInMonth(year, month1);
  const firstDow = new Date(year, month1 - 1, 1).getDay();
  const todayKey = isoToKstDateKey(new Date().toISOString());
  const weekdays = ['일','월','화','수','목','금','토'];
  let html = `<div class="calendar"><div class="calendar-grid">`;
  weekdays.forEach((w, i) => {
    const cls = i === 0 ? 'sun' : (i === 6 ? 'sat' : '');
    html += `<div class="calendar-weekday ${cls}">${w}</div>`;
  });
  for (let i = 0; i < firstDow; i++) {
    html += `<div class="calendar-day outside"></div>`;
  }
  for (let day = 1; day <= totalDays; day++) {
    const dateKey = ymdKey(year, month1, day);
    const sessions = sessionsByDate[dateKey] || [];
    const has = sessions.length > 0;
    const isToday = dateKey === todayKey;
    const selected = statsState.selectedDate === dateKey;
    const classes = ['calendar-day'];
    if (has) classes.push('has-broadcast');
    if (isToday) classes.push('today');
    if (selected) classes.push('selected');
    html += `<button class="${classes.join(' ')}" data-date="${dateKey}">
      <span class="calendar-daynum">${day}</span>
      ${has ? `<span class="calendar-daycount">${sessions.length}회</span>` : ''}
    </button>`;
  }
  const totalCells = firstDow + totalDays;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let i = 0; i < trailing; i++) {
    html += `<div class="calendar-day outside"></div>`;
  }
  html += `</div></div>`;
  return html;
}

function renderDayDetail(year, month1, sessionsByDate) {
  const date = statsState.selectedDate;
  if (!date) {
    return `<div class="day-detail-empty">달력에서 날짜를 선택하면<br>해당 일의 방송 기록을 볼 수 있습니다</div>`;
  }
  const sessions = sessionsByDate[date] || [];
  if (sessions.length === 0) {
    return `<div class="day-detail-title">${date}</div><div class="day-detail-empty">이 날은 방송 기록이 없어요</div>`;
  }
  const sorted = [...sessions].sort((a, b) => new Date(a.start) - new Date(b.start));
  let html = `<div class="day-detail-title">${date} · ${sessions.length}회 방송</div>`;
  for (const s of sorted) {
    const startStr = formatHHMM(s.start);
    const endStr = s.end ? formatHHMM(s.end) : '진행 중';
    let durStr = '';
    if (s.end) {
      const ms = new Date(s.end).getTime() - new Date(s.start).getTime();
      durStr = ` · ${formatDuration(ms)}`;
    }
    const modeBadge = `<span class="day-session-mode ${s.mode || 'normal'}">${MODE_LABEL[s.mode] || '일반 방송'}</span>`;
    let changesHtml = '';
    if (s.changes && s.changes.length > 0) {
      const items = s.changes.map(c => {
        let icon, label, valHtml;
        if (c.type === 'title') {
          icon = '✎'; label = '방제';
          valHtml = `${escapeHtml(c.before || '')} → ${escapeHtml(c.after || '')}`;
        } else if (c.type === 'category') {
          icon = '#'; label = '카테고리';
          valHtml = `${escapeHtml(c.before || '')} → ${escapeHtml(c.after || '')}`;
        } else if (c.type === 'mode_change') {
          icon = '◆'; label = '방송 모드';
          valHtml = `${MODE_LABEL[c.before] || c.before} → ${MODE_LABEL[c.after] || c.after}`;
        } else {
          icon = '•'; label = c.type;
          valHtml = `${escapeHtml(c.before || '')} → ${escapeHtml(c.after || '')}`;
        }
        return `<div class="day-session-change">
          <span class="day-session-change-time">${formatHHMM(c.time)}</span>
          <span class="day-session-change-icon">${icon}</span>
          <span><b>${label}</b> ${valHtml}</span>
        </div>`;
      }).join('');
      changesHtml = `<div class="day-session-changes">${items}</div>`;
    }
    html += `
      <div class="day-session">
        <div class="day-session-time">${startStr} ~ ${endStr}${durStr}</div>
        <div class="day-session-title">${modeBadge}${escapeHtml(s.title || '(방제 없음)')}</div>
        ${changesHtml}
      </div>
    `;
  }
  return html;
}

async function loadEvents() {
  try {
    const res = await fetch(WORKER_URL + '/events?t=' + Date.now());
    if (!res.ok) throw new Error('no events');
    const data = await res.json();
    allEvents = data.events || [];
    initFilterUI();
    applyFilter();
    lastEventsUpdate = new Date();
    updateHeaderCenter();
  } catch (e) {
    document.getElementById('timeline').innerHTML =
      '<div class="timeline-empty">이벤트 데이터를 불러올 수 없어요</div>';
  }
}

async function loadStats() {
  try {
    const res = await fetch(WORKER_URL + '/stats?t=' + Date.now());
    if (!res.ok) throw new Error('no stats');
    const data = await res.json();
    statsState.data = data.stats || {};
    if (currentPage === 'stats') renderStatsBody();
    lastStatsUpdate = new Date();
    updateHeaderCenter();
  } catch (e) {
    if (currentPage === 'stats') {
      const body = document.getElementById('statsBody');
      if (body) body.innerHTML = '<div class="loading"><div>통계 데이터를 불러올 수 없어요</div></div>';
    }
  }
}

async function loadLive() {
  try {
    const res = await fetch(WORKER_URL + '/?t=' + Date.now());
    const data = await res.json();
    const infoMap = {};
    data.members.forEach(m => { infoMap[m.id] = m; });
    const sorted = [...MEMBERS].sort((a, b) => {
      const al = (infoMap[a.id] && infoMap[a.id].live) ? 1 : 0;
      const bl = (infoMap[b.id] && infoMap[b.id].live) ? 1 : 0;
      return bl - al;
    });
    const grid = document.createElement('div');
    grid.className = 'grid';
    let liveCount = 0;
    sorted.forEach((m, i) => {
      const info = infoMap[m.id] || { id: m.id, live: false };
      grid.appendChild(buildCard(m, info, i * 35));
      if (info.live) liveCount++;
    });
    document.getElementById('app').innerHTML = '';
    document.getElementById('app').appendChild(grid);
    const dot = document.getElementById('liveDot');
    const text = document.getElementById('liveText');
    if (liveCount > 0) {
      dot.className = 'live-dot';
      text.textContent = liveCount + '명 방송 중';
    } else {
      dot.className = 'live-dot none';
      text.textContent = '방송 중인 멤버 없음';
    }
    const updated = new Date(data.updated_at);
    lastLiveUpdate = updated;
    updateHeaderCenter();
  } catch (e) {
    document.getElementById('app').innerHTML =
      '<div class="loading"><div>데이터를 불러올 수 없어요</div></div>';
    console.error(e);
  }
}

loadLive();
loadEvents();
loadStats();
setInterval(loadLive, 60 * 1000);
setInterval(loadEvents, 60 * 1000);
setInterval(loadStats, 60 * 1000);
</script>
