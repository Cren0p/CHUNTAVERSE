// ── 그래프 표시 범위 산정 (순수 함수 — verify_graph_range 스위트가 검증) ──
function ymShift(ym, k) {   // 'yyyy-mm'을 k개월 이동(음수 가능)
  const [y, m] = ym.split('-').map(Number);
  const t = y * 12 + (m - 1) + k;
  return `${Math.floor(t / 12)}-${String(((t % 12) + 12) % 12 + 1).padStart(2, '0')}`;
}
function ymDiff(a, b) {   // a - b (개월 수)
  const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number);
  return (ay * 12 + am) - (by * 12 + bm);
}
// 그래프에 표시할 연속 n개월 산정. 연 단위로 자르지 않음(추세 연속성) — 2026-07-06 확정.
// anchor: { center: ym } 선택 달 중심(경계에 닿으면 시프트) | { end: ym } 그 달을 오른쪽 끝으로(왼쪽을 과거 달로 채움 — '전체'용)
// n: 표시 개수(화면 폭에서 산정). 가용(minYm~maxYm) 총 개월이 n 미만이면 전부 반환.
function computeGraphRange(anchor, n, minYm, maxYm) {
  const total = ymDiff(maxYm, minYm) + 1;
  if (n > total) n = total;
  let start = anchor.center
    ? ymShift(anchor.center, -Math.floor((n - 1) / 2))
    : ymShift(anchor.end, -(n - 1));
  if (ymDiff(ymShift(start, n - 1), maxYm) > 0) start = ymShift(maxYm, -(n - 1));   // 우경계 초과 → 좌로 밀기
  if (ymDiff(start, minYm) < 0) start = minYm;                                      // 좌경계 미달 → min으로
  const out = [];
  for (let i = 0; i < n; i++) out.push(ymShift(start, i));
  return out;
}

// 그래프 탭: 멤버 다중 필터 + 종류 단일 필터 → 켠 멤버들의 월별 추이 라인(SVG). 연 단위.
// 월별 추이 라인 차트(SVG). 단일 멤버 라인(멤버 색). x=range의 연속 개월('yyyy-mm' 배열, 해 걸침 가능), y=메트릭값. 값 없는 월은 라인 끊김. (그래프 모달에서 호출)
function drawGraphChart(wrap, memberId, range, metric) {
  if (!wrap) return;
  const id = memberId;
  const m = MEMBER_BY_ID[id];
  if (!m) { wrap.innerHTML = ''; return; }
  const color = m.color;

  const valueOf = (ym) => {
    const [y, mo] = ym.split('-').map(Number);
    if (metric.special) return fancntMonthEnd(id, y, mo);   // 애청자(월말 누적), 없으면 null → 라인 끊김
    const ms = statsState.data[ym] && statsState.data[ym][id];
    if (!ms) return 0;
    return metric.get(computeMonthSummary(ms, y, mo));
  };
  const pts = range.map(ym => valueOf(ym));
  const showVal = (v) => metric.fmt ? metric.fmt(v) : (v.toLocaleString() + (metric.unit || ''));

  // Y축: 데이터 min~max 기준으로 살짝 여유(변화폭 강조). 최소값이 0보다 높게 잡힐 수 있음.
  const vals = pts.filter(v => v != null);
  let minV = vals.length ? Math.min(...vals) : 0;
  let maxV = vals.length ? Math.max(...vals) : 1;
  if (minV === maxV) { minV = Math.max(0, minV - 1); maxV = maxV + 1; }
  const span = maxV - minV;
  const step = niceNum(span / 4);
  let yMin = Math.floor((minV - span * 0.12) / step) * step;
  let yMax = Math.ceil((maxV + span * 0.12) / step) * step;
  if (yMin < 0) yMin = 0;
  if (yMax <= yMin) yMax = yMin + step;

  // 폭 실측(viewBox 1:1) — 표시 개수(n)는 호출부가 같은 폭으로 산정했으므로 라벨은 솎지 않고 전 표시
  const W = wrap.clientWidth || (typeof window !== 'undefined' && window.innerWidth <= 900 ? 380 : 720);
  const narrow = W < 500;
  const H = narrow ? 300 : 380;
  const padL = narrow ? 16 : 32, padR = narrow ? 16 : 32, padT = narrow ? 22 : 30, padB = 36;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const xOf = (i) => range.length <= 1 ? padL + plotW / 2 : padL + (i / (range.length - 1)) * plotW;
  const yOf = (v) => padT + (1 - (v - yMin) / (yMax - yMin)) * plotH;

  // 그리드 가로선만(Y축 숫자는 없음 — 값은 점마다 표기)
  let grid = '';
  for (let v = yMin; v <= yMax + step * 0.001; v += step) {
    const y = yOf(v);
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" class="g-grid"/>`;
  }
  // X라벨: 범위가 해를 걸치면 1월(및 첫 점)에 연도 병기("'27 1월") — 어느 해인지 모호함 방지
  const spansYears = range[0].slice(0, 4) !== range[range.length - 1].slice(0, 4);
  let xlab = '';
  range.forEach((ym, i) => {
    const [y, mo] = ym.split('-').map(Number);
    const withYear = spansYears && (mo === 1 || i === 0);
    xlab += `<text x="${xOf(i).toFixed(1)}" y="${H - padB + 22}" class="g-xlabel">${withYear ? `'${String(y).slice(2)} ` : ''}${mo}월</text>`;
  });

  // 라인 + 각진 마커 + 값 텍스트(멤버색, 상시 표시). 양끝 점은 앵커로 잘림 방지.
  let d = '', started = false, marks = '', vlabels = '';
  pts.forEach((v, i) => {
    if (v == null) { started = false; return; }
    const x = xOf(i), y = yOf(v);
    d += (started ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    started = true;
    marks += `<rect x="${(x - 3).toFixed(1)}" y="${(y - 3).toFixed(1)}" width="6" height="6" fill="${color}"/>`;
    const anchor = i === 0 ? 'start' : (i === range.length - 1 ? 'end' : 'middle');
    vlabels += `<text x="${x.toFixed(1)}" y="${(y - 11).toFixed(1)}" text-anchor="${anchor}" class="g-vlabel" fill="${color}">${showVal(v)}</text>`;
  });
  const line = d ? `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : '';

  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="graph-svg" preserveAspectRatio="xMidYMid meet">${grid}${line}${marks}${vlabels}${xlab}</svg>`;
}

// 카드 지표 행·멤버탭 요약 항목 클릭 → 그 멤버 × 그 지표의 월별 추이 모달. 연 단위로 자르지 않음(2026-07-06 확정):
// 표시 개수 n = 화면 폭에서 산정(점 간격이 값 라벨 최악 폭 이상 — 라벨 솎기 없이 데이터 개수 자체를 줄임).
// 앵커 = 월 선택 상태면 그 달 중심 / '전체'(통합탭 연간 뷰)면 그 연도 마지막 가용 달을 오른쪽 끝으로(부족분은 과거 달로 채움).
// 그래프 좌우 ‹ ›로 한 달씩 이동(가용 경계에서 disabled).
function openStatGraphModal(memberId, metricKey) {
  const m = MEMBER_BY_ID[memberId];
  const metric = GRAPH_METRICS.find(g => g.key === metricKey);
  if (!m || !metric) return;
  const ov = document.getElementById('statGraphOverlay');
  const head = document.getElementById('statGraphHead');
  const body = document.getElementById('statGraphBody');
  if (!ov || !head || !body) return;
  ov.hidden = false;   // clientWidth 측정을 위해 먼저 표시
  syncBodyScrollLock();
  const chevSvg = (pts) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="${pts}"/></svg>`;
  body.innerHTML = `
    <button class="stats-month-btn sg-nav" data-dir="-1" type="button">${chevSvg('15 18 9 12 15 6')}</button>
    <div class="sg-chart"></div>
    <button class="stats-month-btn sg-nav" data-dir="1" type="button">${chevSvg('9 18 15 12 9 6')}</button>`;
  const chart = body.querySelector('.sg-chart');

  // 표시 개수: 점 간격(plotW/(n-1))이 슬롯 폭 이상이 되는 최대 n. 슬롯 = 값 라벨 최악 "12,345"(6자)의
  // 근사 폭(폰트×0.6×6: 14px≈50 / 12px≈43) + 최소 간극 8. 폰트 분기는 g-vlabel 미디어쿼리(900px)와 동일 기준.
  const narrow = window.innerWidth <= 900;
  const SLOT = narrow ? 58 : 51;
  const cw = chart.clientWidth || (narrow ? 380 : 720);
  const plotW = cw - (cw < 500 ? 16 : 32) * 2;
  const n = Math.max(3, Math.min(12, Math.floor(plotW / SLOT) + 1));

  const now = kstNow();
  const maxYm = `${now.getUTCFullYear()}-${String(now.getUTCMonth() + 1).padStart(2, '0')}`;
  const minYm = `${STATS_START_YEAR}-${String(STATS_START_MONTH).padStart(2, '0')}`;
  const vm = statsState.viewMonth || { year: now.getUTCFullYear(), month: now.getUTCMonth() + 1 };
  const isAll = statsState.periodAll && statsState.selectedTab === 'all';
  let range = isAll
    ? computeGraphRange({ end: vm.year >= now.getUTCFullYear() ? maxYm : `${vm.year}-12` }, n, minYm, maxYm)
    : computeGraphRange({ center: `${vm.year}-${String(vm.month).padStart(2, '0')}` }, n, minYm, maxYm);

  const iconSvg = metric.key === 'fan' ? FAN_ICON : SVG_ICONS[metric.ic];
  const btns = body.querySelectorAll('.sg-nav');
  const sync = () => {
    // 'yyyy-mm' 사전순 = 시간순이라 문자열 비교로 경계 판정
    btns[0].disabled = range[0] <= minYm;
    btns[1].disabled = range[range.length - 1] >= maxYm;
    head.innerHTML = `<span><span class="sg-dot" style="background:${m.color}"></span><span>${m.name}</span><span>·</span><span class="stats-row-icon" style="color:${metric.icColor}">${iconSvg}</span><span>${metric.label}</span><span>·</span><span>${range[0].replace('-', '.')} ~ ${range[range.length - 1].replace('-', '.')}</span></span><button class="lr-close" type="button" onclick="closeStatGraph()">✕</button>`;
  };
  const draw = () => {
    if (ov.hidden) return;
    sync();
    // special(애청자)=fancnt 전체 1회, 그 외=범위 내 미보유 월만 로드(해 걸침 가능 — annualMonthsToLoad 대신 범위 기반)
    const pending = metric.special
      ? (statsState.fancnt ? [] : [loadFancnt()])
      : range.filter(ym => !statsState.data[ym] && !statsState.loadingMonths.has(ym)).map(ym => loadStatsMonth(ym));
    if (pending.length) {
      chart.innerHTML = '<div class="lr-msg">불러오는 중...</div>';
      const cur = range;
      Promise.all(pending).then(() => { if (!ov.hidden && range === cur) drawGraphChart(chart, memberId, range, metric); });
    } else {
      drawGraphChart(chart, memberId, range, metric);
    }
  };
  btns.forEach(b => b.addEventListener('click', () => {
    const d = Number(b.dataset.dir);
    const s2 = ymShift(range[0], d);
    if (ymDiff(s2, minYm) < 0 || ymDiff(ymShift(s2, range.length - 1), maxYm) > 0) return;
    range = range.map(ym => ymShift(ym, d));
    draw();
  }));
  draw();
}
function closeStatGraph() {
  const ov = document.getElementById('statGraphOverlay');
  if (ov) ov.hidden = true;
  syncBodyScrollLock();
}

// 축 눈금 간격을 보기 좋은 값(1·2·2.5·5·10 ×10ⁿ)으로
function niceNum(v) {
  if (v <= 0) return 1;
  const exp = Math.floor(Math.log10(v));
  const base = Math.pow(10, exp);
  const f = v / base;
  const nice = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
  return nice * base;
}
function renderCalendar(year, month1, sum) {
  const { sessionsByDate={}, postsByDate={}, youtubeByDate={}, cafeByDate={}, broadcastDateSet } = sum;
  const totalDays = daysInMonth(year, month1);
  const firstDow = new Date(year, month1 - 1, 1).getDay();
  const todayKey = isoToKstDateKey(new Date().toISOString());
  const weekdays = ['일','월','화','수','목','금','토'];
  let html = `<div class="calendar"><div class="calendar-grid">`;
  weekdays.forEach((w, i) => {
    html += `<div class="calendar-weekday ${i===0?'sun':i===6?'sat':''}">${w}</div>`;
  });
  for (let i = 0; i < firstDow; i++) html += `<div class="calendar-day outside"></div>`;
  for (let day = 1; day <= totalDays; day++) {
    const dateKey = ymdKey(year, month1, day);
    const sessions = sessionsByDate[dateKey] || [];
    const posts = postsByDate[dateKey] || [];
    const youtubes = youtubeByDate[dateKey] || [];
    const cafes = cafeByDate[dateKey] || [];
    const hasBroadcast = broadcastDateSet ? broadcastDateSet.has(dateKey) : sessions.length > 0;   // 걸친 날도 채움
    const hasPost = posts.length > 0;
    const hasYoutube = youtubes.length > 0;
    const hasCafe = cafes.length > 0;
    const hasActivity = hasBroadcast || hasPost || hasYoutube || hasCafe;
    const classes = ['calendar-day'];
    if (hasBroadcast) classes.push('has-broadcast');
    if (hasActivity) classes.push('has-activity');
    if (dateKey === todayKey) classes.push('today');
    if (statsState.selectedDate === dateKey) classes.push('selected');
    let bottomLine = '';
    if (sessions.length > 0) {                     // 회수 라벨은 그날 '시작'한 방송 수 — 이어진 날은 채움만
      bottomLine = `<span class="calendar-daycount">${sessions.length}회</span>`;
    } else if (!hasBroadcast && (hasPost || hasYoutube || hasCafe)) {
      const dots = [];
      if (hasPost) dots.push('<span class="calendar-day-dot post"></span>');
      if (hasYoutube) dots.push('<span class="calendar-day-dot youtube"></span>');
      if (hasCafe) dots.push('<span class="calendar-day-dot cafe"></span>');
      bottomLine = `<div class="calendar-day-dots">${dots.join('')}</div>`;
    }
    html += `<button class="${classes.join(' ')}" data-date="${dateKey}"><span class="calendar-daynum">${day}</span>${bottomLine}</button>`;
  }
  const trailing = (7 - ((firstDow + totalDays) % 7)) % 7;
  for (let i = 0; i < trailing; i++) html += `<div class="calendar-day outside"></div>`;
  html += `</div></div>`;
  return html;
}

function renderDayDetail(year, month1, sum, memberId) {
  const { sessionsByDate={}, postsByDate={}, youtubeByDate={}, cafeByDate={} } = sum;
  const date = statsState.selectedDate;
  if (!date) return `<div class="day-detail-empty">달력에서 날짜를 선택하면<br>해당 일의 활동 기록을 볼 수 있습니다</div>`;
  const sessions = sessionsByDate[date] || [];
  const posts = postsByDate[date] || [];
  const youtubes = youtubeByDate[date] || [];
  const cafes = cafeByDate[date] || [];
  const totalActivities = sessions.length + posts.length + youtubes.length + cafes.length;
  if (totalActivities === 0) return `<div class="day-detail-title">${date}</div><div class="day-detail-empty">이 날은 활동 기록이 없어요</div>`;
  const summaryParts = [];
  if (sessions.length > 0) summaryParts.push(`방송 ${sessions.length}회`);
  if (posts.length > 0) summaryParts.push(`게시글 ${posts.length}개`);
  if (youtubes.length > 0) summaryParts.push(`유튜브 ${youtubes.length}개`);
  if (cafes.length > 0) summaryParts.push(`카페 ${cafes.length}개`);
  let html = `<div class="day-detail-title">${date} · ${summaryParts.join(' · ')}</div>`;
  const items = [];
  for (const s of sessions) {
    const t = new Date(s.start).getTime();
    if (!isNaN(t)) items.push({ kind: 'session', time: t, data: s });
  }
  for (const p of posts) {
    const t = new Date(p.time).getTime();
    if (!isNaN(t)) items.push({ kind: 'post', time: t, data: p });
  }
  for (const y of youtubes) {
    const t = new Date(y.time).getTime();
    if (!isNaN(t)) items.push({ kind: 'youtube', time: t, data: y });
  }
  for (const c of cafes) {
    const t = new Date(c.time).getTime();
    if (!isNaN(t)) items.push({ kind: 'cafe', time: t, data: c });
  }
  items.sort((a, b) => a.time - b.time);
  for (const item of items) {
    if (item.kind === 'session') {
      const s = item.data;
      const startStr = formatHHMM(s.start);
      const endStr = s.end ? formatHHMM(s.end) : '진행 중';
      let durStr = '';
      if (s.end) {
        const ms = new Date(s.end).getTime() - new Date(s.start).getTime();
        durStr = ` · ${formatDuration(ms)}`;
      }
      const modeBadge = (s.mode && s.mode !== 'normal') ? modeParts(s.mode).map(p => `<span class="day-session-mode ${p}" role="img" aria-label="${MODE_LABEL[p] || ''}">${modeBadgeSvg(p)}</span>`).join('') : '';
      // 세션별 시청자(최고=viewer_peak, 평균=viewer_sum/viewer_count) — 표본 없는 세션(진행 중·감지 공백)은 항목 생략
      const vp = s.viewer_peak > 0 ? `<span class="day-session-viewer"><span class="stats-row-icon" style="color:#FF8C00">${SVG_ICONS.arrowUp}</span>${s.viewer_peak.toLocaleString()}명</span>` : '';
      const va = s.viewer_count > 0 ? `<span class="day-session-viewer"><span class="stats-row-icon" style="color:#FF8C00">${SVG_ICONS.barChart}</span>${Math.round(s.viewer_sum / s.viewer_count).toLocaleString()}명</span>` : '';
      let changesHtml = '';
      if (s.changes && s.changes.length > 0) {
        changesHtml = `<div class="day-session-changes">${s.changes.map(c => {
          let icon, label, valHtml;
          if (c.type === 'title') { icon = SVG_ICONS.pencil; label = '방송 제목'; valHtml = `${escapeHtml(c.before||'')} → ${escapeHtml(c.after||'')}`; }
          else if (c.type === 'category') { icon = SVG_ICONS.tag; label = '카테고리'; valHtml = `${escapeHtml(c.before||'')} → ${escapeHtml(c.after||'')}`; }
          else if (c.type === 'mode_change') { icon = SVG_ICONS.rotate; label = '방송 모드'; valHtml = `${modeLabel(c.before)} → ${modeLabel(c.after)}`; }
          else { icon = '•'; label = c.type; valHtml = `${escapeHtml(c.before||'')} → ${escapeHtml(c.after||'')}`; }
          return `<div class="day-session-change"><span class="day-session-change-time">${formatHHMM(c.time)}</span><span class="day-session-change-icon">${icon}</span><span><b>${label}</b> ${valHtml}</span></div>`;
        }).join('')}</div>`;
      }
      const sessionUrl = s.end
        ? `https://www.sooplive.com/station/${memberId}/vod`
        : `https://play.sooplive.co.kr/${memberId}`;
      const sessionInner = `<div class="day-session-row-head"><span class="day-kind-icon broadcast">${SVG_ICONS.soop}</span><span class="day-session-time"><span class="stats-row-icon" style="color:var(--ev-start)">${SVG_ICONS.clockTime}</span>${startStr} ~ ${endStr}${durStr}</span>${vp}${va}</div><div class="day-session-title">${modeBadge}${escapeHtml(s.title||'')}</div>${changesHtml}`;
      html += memberId
        ? `<a class="day-session" href="${escapeHtml(sessionUrl)}" target="_blank" rel="noopener">${sessionInner}</a>`
        : `<div class="day-session">${sessionInner}</div>`;
    } else if (item.kind === 'post') {
      const p = item.data;
      const inner = `<span class="day-kind-icon post">${SVG_ICONS.board}</span><span class="day-item-time">${formatHHMM(p.time)}</span><span class="day-item-title">${escapeHtml(p.title||'(제목 없음)')}</span>`;
      html += p.url ? `<a class="day-item" href="${escapeHtml(withTextFragment(p.url, p.title))}" target="_blank" rel="noopener">${inner}</a>` : `<div class="day-item">${inner}</div>`;
    } else if (item.kind === 'youtube') {
      const y = item.data;
      const inner = `<span class="day-kind-icon youtube">${SVG_ICONS.youtube}</span><span class="day-item-time">${formatHHMM(y.time)}</span><span class="day-item-title">${escapeHtml(y.title||'(제목 없음)')}</span>`;
      html += y.url ? `<a class="day-item" href="${escapeHtml(y.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="day-item">${inner}</div>`;
    } else if (item.kind === 'cafe') {
      const c = item.data;
      const cafeNameEsc = escapeHtml(c.cafe_name || '');
      const inner = `<span class="day-kind-icon cafe">${SVG_ICONS.coffee}</span><span class="day-item-time">${formatHHMM(c.time)}</span><span class="day-item-title">${cafeNameEsc ? `[${cafeNameEsc}] ` : ''}${escapeHtml(c.title||'(제목 없음)')}</span>`;
      html += c.url ? `<a class="day-item" href="${escapeHtml(c.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="day-item">${inner}</div>`;
    }
  }
  return html;
}

// 시간대별 방송 분포: 세션 [start,end]를 KST 기준 일·3시간밴드 경계로 쪼개 분 단위 누적.
// 자정 넘는 방송은 양일에 나눠 들어가고, 표시 월 밖으로 넘어가는 구간은 잘라낸다(클립). 진행 중 세션은 현재 월에서만 now까지 집계.
function computeTimeOfDayMinutes(sessionsByDate, year, month1, isCurrentMonth) {
  const dim = daysInMonth(year, month1);
  const grid = [];
  for (let i = 0; i < dim; i++) grid.push([0, 0, 0, 0, 0, 0, 0, 0]);
  const nowMs = Date.now();
  const sessions = [];
  for (const arr of Object.values(sessionsByDate || {})) {
    for (const s of arr) sessions.push(s);
  }
  for (const s of sessions) {
    const startMs = new Date(s.start).getTime();
    if (isNaN(startMs)) continue;
    let endMs;
    if (s.end) endMs = new Date(s.end).getTime();
    else if (isCurrentMonth) endMs = nowMs;   // 진행 중 세션은 현재 월에서만 now까지
    else continue;                            // 과거 월의 끝나지 않은 세션(고아)은 제외
    if (isNaN(endMs) || endMs <= startMs) continue;
    let cursor = startMs;
    let guard = 0;
    while (cursor < endMs && guard < 400) {
      guard++;
      const k = new Date(cursor + 9 * 3600 * 1000);   // KST 벽시계 성분
      const yr = k.getUTCFullYear();
      const mo = k.getUTCMonth() + 1;
      const dom = k.getUTCDate();
      const band = Math.floor(k.getUTCHours() / 3);    // 0..7 (3시간 단위, 자정=밴드0 시작과 일치)
      const boundaryKst = Date.UTC(yr, mo - 1, dom, 0, 0, 0) + (band + 1) * 3 * 3600 * 1000;
      const segEnd = Math.min(endMs, boundaryKst - 9 * 3600 * 1000);   // 이 밴드 끝(=다음 경계)까지
      if (yr === year && mo === month1 && dom >= 1 && dom <= dim) {
        grid[dom - 1][band] += (segEnd - cursor) / 60000;
      }
      cursor = segEnd;
    }
  }
  return grid;
}

// 방송 성향(월별): 방송 시간을 KST 시각 기준 3구간(새벽 1~9 / 낮 9~17 / 저녁 17~익일 1)에 분 단위 배분 —
// computeTimeOfDayMinutes와 동일한 세션 클립 규칙(진행 중 세션은 현재 월만 now까지, 과거 월 고아 제외, 타월 분 미산입)을 1시간 경계로 걷는다.
// 우세 구간이 그 달 방송 시간의 과반(50%) 이상이면 그 성향, 미만(동률 포함)이면 무작위형. 방송 0분이면 null(라벨 미표시).
function computeBroadcastTendency(sessionsByDate, year, month1, isCurrentMonth) {
  const buckets = { dawn: 0, day: 0, evening: 0 };
  const nowMs = Date.now();
  for (const arr of Object.values(sessionsByDate || {})) {
    for (const s of arr) {
      const startMs = new Date(s.start).getTime();
      if (isNaN(startMs)) continue;
      let endMs;
      if (s.end) endMs = new Date(s.end).getTime();
      else if (isCurrentMonth) endMs = nowMs;
      else continue;
      if (isNaN(endMs) || endMs <= startMs) continue;
      let cursor = startMs;
      let guard = 0;
      while (cursor < endMs && guard < 999) {
        guard++;
        const k = new Date(cursor + 9 * 3600 * 1000);   // KST 벽시계 성분
        const yr = k.getUTCFullYear(), mo = k.getUTCMonth() + 1, hr = k.getUTCHours();
        const boundaryKst = Date.UTC(yr, mo - 1, k.getUTCDate(), hr + 1, 0, 0);
        const segEnd = Math.min(endMs, boundaryKst - 9 * 3600 * 1000);   // 다음 정시(KST)까지
        if (yr === year && mo === month1) {
          const key = (hr >= 1 && hr < 9) ? 'dawn' : (hr >= 9 && hr < 17) ? 'day' : 'evening';
          buckets[key] += (segEnd - cursor) / 60000;
        }
        cursor = segEnd;
      }
    }
  }
  const total = buckets.dawn + buckets.day + buckets.evening;
  if (total <= 0) return null;
  const top = Object.entries(buckets).sort((a, b) => b[1] - a[1])[0];
  return top[1] / total >= 0.5 ? top[0] : 'random';
}

// 히트맵 렌더: 가로=일(월별, 1fr로 폭은 달력에 맞춤), 세로=3시간 8밴드(경계눈금 00..24), 농도=선형 min(분/180,1).
// 주말만 날짜를 색으로 표기(토 파랑·일 빨강), 간격 없이 연속. 세션이 전혀 없는 달은 '' 반환(숨김).
function renderTimeOfDayHeatmap(year, month1, sum, isCurrentMonth) {
  const grid = computeTimeOfDayMinutes(sum.sessionsByDate, year, month1, isCurrentMonth);
  let hasAny = false;
  for (const day of grid) { for (const v of day) { if (v > 0) { hasAny = true; break; } } if (hasAny) break; }
  if (!hasAny) return '';
  const dim = grid.length;
  const R = 15, H = R * 8;
  const ylab = ['00', '03', '06', '09', '12', '15', '18', '21', '24'];
  let yc = `<div class="toh-yaxis" style="height:${H}px;">`;
  for (let i = 0; i < 9; i++) yc += `<span class="toh-ylabel" style="top:${i * R - 6}px;">${ylab[i]}</span>`;
  yc += `</div>`;
  let cells = `<div class="toh-grid" style="grid-template-columns:repeat(${dim},1fr);grid-auto-rows:${R}px;">`;
  for (let b = 0; b < 8; b++) {
    for (let d = 1; d <= dim; d++) {
      const minutes = grid[d - 1][b];
      const v = Math.min(minutes / 180, 1);
      const bg = v <= 0 ? '#101a2c' : `rgba(97,255,236,${(0.14 + 0.68 * v).toFixed(3)})`;
      const tip = minutes > 0 ? ` title="${month1}/${d} ${ylab[b]}–${ylab[b + 1]}시 · ${Math.round(minutes)}분"` : '';
      cells += `<div${tip} style="background:${bg};"></div>`;
    }
  }
  cells += `</div>`;
  let xa = `<div class="toh-xaxis" style="grid-template-columns:repeat(${dim},1fr);">`;
  for (let d = 1; d <= dim; d++) {
    const g = new Date(year, month1 - 1, d).getDay();
    const c = g === 0 ? '#f87171' : (g === 6 ? '#60a5fa' : '');
    xa += `<div class="toh-xlabel" style="color:${c || 'transparent'};">${c ? d : ''}</div>`;
  }
  xa += `</div>`;
  // 방송 성향 라벨 — 비활성화(2026-07-04, Crenop): 실데이터가 거의 전원 저녁형이라 변별력 없음. 컷오프 재설계 시 재활성 후보라 계산 함수·아이콘·CSS 포함 보존.
  const tendHtml = '';
  /*
  const tendency = computeBroadcastTendency(sum.sessionsByDate, year, month1, isCurrentMonth);
  const TENDENCY = {
    dawn: { icon: SVG_ICONS.moon, label: '새벽형' },
    day: { icon: SVG_ICONS.sun, label: '낮방형' },
    evening: { icon: SVG_ICONS.flame, label: '저녁형' },
    random: { icon: SVG_ICONS.help, label: '무작위형' },
  };
  const tendHtml = tendency ? `<span class="toh-tendency" title="새벽 1~9시 · 낮 9~17시 · 저녁 17~익일 1시 — 방송 시간의 과반을 차지한 구간">${TENDENCY[tendency].icon}${TENDENCY[tendency].label}</span>` : '';
  */
  return `<div class="toh-head"><span class="toh-title">시간대별 방송 분포</span><span class="toh-headright">${tendHtml}<span class="toh-sub">방송시간 기준</span></span></div><div class="toh-body">${yc}<div class="toh-right">${cells}${xa}</div></div>`;
}

async function loadStatsMonth(yyyymm) {
  if (!yyyymm) return;
  if (!isCurrentMonth(yyyymm)) {
    const cached = lsGetMonthCache(yyyymm);
    if (cached) { statsState.data[yyyymm] = cached; return; }
  }
  if (statsState.loadingMonths.has(yyyymm)) return;
  statsState.loadingMonths.add(yyyymm);
  try {
    const res = await fetch(`${WORKER_URL}/stats?month=${yyyymm}`);
    if (!res.ok) throw new Error('stats fetch failed');
    const data = await res.json();
    const monthData = data.stats || {};
    statsState.data[yyyymm] = monthData;
    // 미종료 세션(end 없음)이 하나라도 있으면 캐시 보류 — 자정 걸친 방송이 끝나기 전에 월이 바뀌어 이 달을 받으면
    // '진행 중' 상태로 영구 동결됨(그 사용자 화면에서 방송 시간 누락 + 명전 정전위원회 최대 48h 오염).
    // 서버가 세션을 닫은 뒤의 응답부터 캐시(보류 동안의 재요청 비용은 60s 엣지캐시가 흡수).
    const hasOpenSession = Object.values(monthData).some(ms => (ms.sessions || []).some(s => s.start && !s.end));
    if (!isCurrentMonth(yyyymm) && !hasOpenSession) lsSetMonthCache(yyyymm, monthData);
  } catch (e) {
  } finally {
    statsState.loadingMonths.delete(yyyymm);
  }
}

async function loadStats() {
  try {
    const now = kstNow();
    const cur = `${now.getUTCFullYear()}-${String(now.getUTCMonth() + 1).padStart(2, '0')}`;
    await Promise.all([loadStatsMonth(cur), loadFancnt()]);
    // 무변화 스킵: 현재월 데이터가 직전 렌더 시점과 같으면 재구축 생략(타임라인·배너와 정책 통일 — 무변화 틱마다 텍스트 선택 풀림·DOM 낭비 방지).
    // 미종료 세션이 있으면 분 버킷을 sig에 섞음 — '진행 중' 시간 합계는 렌더 시점 now까지 집계라, 뷰어 표본이 안 잡히는 방송
    // (fetchStationInfo null 지속)이나 전월 시작 자정 걸친 방송(표본이 전월 키에 기록돼 당월 무변)에서 표시가 동결되는 것 방지.
    // 즉 생방송 중엔 기존처럼 매 틱 렌더, 전원 오프라인일 때만 스킵. sig는 stats 탭에 있을 때만 갱신 —
    // 탭 밖에서의 변화를 재진입 후 첫 틱이 감지해 렌더(switchPage는 stats 재진입 시 렌더하지 않고 DOM 유지에 의존).
    if (currentPage === 'stats') {
      const hasOpen = Object.values(statsState.data[cur] || {}).some(ms => (ms.sessions || []).some(s => s.start && !s.end));
      const sig = JSON.stringify(statsState.data[cur] || null) + '|' + fancntLoadedDate + (hasOpen ? '|' + Math.floor(Date.now() / 60000) : '');   // fancntLoadedDate: 자정 fancnt 재조회가 sig를 1회 바꿔 애청자 셀·그래프에 반영되게(월 데이터만 보면 fancnt 갱신이 화면에 안 실림)
      if (sig !== lastStatsSig) renderStatsBody();
      lastStatsSig = sig;
    }
    lastStatsUpdate = new Date();
    updateHeaderCenter();
  } catch (e) {
    if (currentPage === 'stats') {
      const body = document.getElementById('statsBody');
      if (body) body.innerHTML = '<div class="loading"><div>통계 데이터를 불러올 수 없어요</div></div>';
    }
  }
}

async function loadLive() {
  try {
    const res = await fetch(WORKER_URL + '/');
    const data = await res.json();
    const infoMap = {};
    data.members.forEach(m => { infoMap[m.id] = m; });
    const sorted = [...MEMBERS].sort((a, b) => {
      const al = (infoMap[a.id] && infoMap[a.id].live) ? 1 : 0;
      const bl = (infoMap[b.id] && infoMap[b.id].live) ? 1 : 0;
      return bl - al;
    });
    const grid = document.createElement('div');
    grid.className = 'grid';
    let liveCount = 0;
    sorted.forEach(m => {
      const info = infoMap[m.id] || { id: m.id, live: false };
      grid.appendChild(buildCard(m, info));
      if (info.live) liveCount++;
    });
    document.getElementById('app').innerHTML = '';
    document.getElementById('app').appendChild(grid);
    const liveBadge = document.getElementById('navLiveBadge');
    const liveCountEl = document.getElementById('navLiveCount');
    if (liveBadge && liveCountEl) {
      liveCountEl.innerHTML = liveCountSvg(liveCount);
      liveCountEl.setAttribute('aria-label', `방송 중 ${liveCount}명`);
      liveBadge.classList.toggle('on', liveCount > 0);
      liveBadge.classList.toggle('off', liveCount === 0);
    }
    lastLiveUpdate = new Date();
    if (data.last_detect_at) lastServerDetect = new Date(data.last_detect_at);
    updateHeaderCenter();
  } catch (e) {
    // 일시적 폴링 실패: 이미 카드 그리드가 그려져 있으면 유지하고 이번 실패는 무시
    const app = document.getElementById('app');
    if (app && !app.querySelector('.grid')) {
      app.innerHTML = '<div class="loading"><div>데이터를 불러올 수 없어요</div></div>';
    }
    console.error(e);
    updateHeaderCenter();   // fetch 자체가 죽어도 10초마다 감지 지연 판정이 다시 그려지게(성공 경로에만 있으면 경고가 안 뜸)
  }
}

// ── 텍스트 잉크 세로중심 실측(캔버스 픽셀 스캔) — calibrateBadgeValign()의 제목 잉크 계측용 ──
// (구 모드 배지 내부 보정(--badge-vnudge)은 2026-07-13 SVG 전환으로 소멸 — 지금은 줄 정렬 축만 이 함수를 씀)
// 잉크 위치는 measureText(아웃라인 메트릭)를 쓰지 않고 캔버스에 실제로 그려 픽셀을 스캔 —
// Windows에서 actualBoundingBox가 래스터라이즈 결과와 ~0.8px 어긋나는 것이 실측됨(vnudge 0.50px 주입 상태에서 잔차 -0.79px 역산).
// 반환: 베이스라인 대비 잉크 세로중심(CSS px, +=베이스라인 아래). 실패 시 null.
function scanInkCenter(fontDecl, text, fontPx) {
  const SCALE = 8;   // 스캔 정밀도 ≈ 1/8 px
  const cv = document.createElement('canvas');
  const w = Math.min(4000, Math.ceil((fontPx * text.length * 1.3 + 20) * SCALE));
  const h = Math.ceil(fontPx * 3 * SCALE);
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.scale(SCALE, SCALE);
  ctx.font = fontDecl;
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#fff';
  const baselineY = fontPx * 1.5;
  ctx.fillText(text, 5, baselineY);
  const data = ctx.getImageData(0, 0, w, h).data;
  let top = -1, bot = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (data[(y * w + x) * 4 + 3] > 16) { if (top < 0) top = y; bot = y; break; }
    }
  }
  if (top < 0) return null;
  return (top + bot + 1) / 2 / SCALE - baselineY;
}
// ── 모드 배지 줄 정렬 실측 ──
// 배지 자체는 SVG(박스 19px 고정·내부는 기하 중앙)라 내부 보정 축은 소멸(2026-07-13 SVG 전환 — 구 --badge-vnudge·measureLineInkOffset 제거).
// 남은 축은 "배지 박스 중심을 이웃 제목 텍스트의 잉크 중심에 맞추는 vertical-align" 하나:
// 배지(inline-block, 자식 svg는 block → 인라인 라인박스 없음)는 하단 모서리가 베이스라인 → v만큼 올리면 박스 중심 = 베이스라인 위 (v + 9.5).
// 제목 잉크 중심(베이스라인 위) = -scanInkCenter(캔버스 y-down 부호 반전). ∴ v = -ink - 9.5.
// 한계(정직 고지): 제목은 여전히 폰트 텍스트라 캔버스-화면 래스터 갭 ±0.5px가 남음 — 제목까지 SVG화하지 않는 한 물리적 바닥.
function calibrateBadgeValign() {
  try {
    const fam = getComputedStyle(document.body).fontFamily;
    const evtInk = scanInkCenter(`400 12px ${fam}`, '방송제목가힣19+', 12);   // .event-detail 문맥(400·12px) — CSS 변경 시 함께 갱신
    const dayInk = scanInkCenter(`600 13px ${fam}`, '방송제목가힣19+', 13);   // .day-session-title 문맥(600·13px)
    if (evtInk !== null) document.documentElement.style.setProperty('--tag-valign', Math.max(-12, Math.min(0, -evtInk - 9.5)).toFixed(2) + 'px');
    if (dayInk !== null) document.documentElement.style.setProperty('--daytag-valign', Math.max(-12, Math.min(0, -dayInk - 9.5)).toFixed(2) + 'px');
  } catch (e) { /* 계측 실패 시 CSS 폴백(정적 근사) 유지 */ }
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(calibrateBadgeValign);   // 웹폰트 적용 후 계측(폴백 폰트 오계측 방지)

function parseCSV(text) {
  // 문자 스트림 파서 — 따옴표 셀 안의 줄바꿈(시트 셀 내 Alt+Enter)을 셀 내용으로 처리.
  // (구현 주의: 줄 단위로 먼저 쪼개는 방식은 그런 셀에서 행이 두 동강 나 조용히 소실됐음)
  const rows = [];
  let row = [];
  let current = '';
  let inQuotes = false;
  const endRow = () => {
    row.push(current.trim());
    current = '';
    if (!(row.length === 1 && row[0] === '')) rows.push(row);   // 빈 줄 스킵 (기존 line.trim() 스킵과 동치)
    row = [];
  };
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"' && text[i+1] === '"') { current += '"'; i++; }
      else if (ch === '"') inQuotes = false;
      else current += ch;
    } else {
      if (ch === '"' && current === '') inQuotes = true;   // 여는 따옴표는 셀 시작에서만 — 셀 중간의 낱개 따옴표(비표준 인코딩)는 리터럴로 통과시켜 행 파괴 방지
      else if (ch === ',') { row.push(current.trim()); current = ''; }
      else if (ch === '\n') endRow();
      else current += ch;
    }
  }
  if (row.length > 0 || current !== '') endRow();
  return rows;
}

function parseBannerDate(url) {
  const match = url.match(/(\d{6})(?:-\d+)?\.webp/);
  if (!match) return null;
  const s = match[1];
  const yy = parseInt(s.substring(0, 2));
  const mm = s.substring(2, 4);
  const dd = s.substring(4, 6);
  // sort key: full match including suffix for stable ordering (컨텐츠와 동일 — 같은 날짜 YYMMDD-N 중복 대비)
  const fullMatch = url.match(/(\d{6}(?:-\d+)?)\.webp/);
  return { sort: fullMatch ? fullMatch[1] : s, display: koDate(2000 + yy, parseInt(mm), parseInt(dd)) };
}

  for (let i = 0; i < MEMBERS.length; i++) {
    for (let j = i + 1; j < MEMBERS.length; j++) {
      const m1 = MEMBERS[i], m2 = MEMBERS[j];
      const c1 = chemCounts[`${m1.id}:${m2.id}`] || 0;
      const c2 = chemCounts[`${m2.id}:${m1.id}`] || 0;
      pairs.push({ m1, m2, c1, c2, total: c1 + c2 });
    }
  }
  pairs.sort((a, b) => b.total - a.total);

  // 그룹(N인) 주고받은 채팅 합 — 정렬용 (2인 케미와 동일 산식)
  const groupChatTotal = (g) => {
    let t = 0;
    for (let a = 0; a < g.members.length; a++)
      for (let b = 0; b < g.members.length; b++)
        if (a !== b) t += chemCounts[`${g.members[a]}:${g.members[b]}`] || 0;
    return t;
  };

  // 카드 HTML 빌더 — 상단(모두 포함)·하단(일부 포함) 두 트랙이 동일 카드를 쓰도록 분리(두 경로 드리프트 방지)
  const pairCardHtml = (p) => {
    const chemKey = `${p.m1.id}:${p.m2.id}`;
    const customName = CHEM_NAMES[chemKey];
    const displayName = customName || `${escapeHtml(p.m1.name)} × ${escapeHtml(p.m2.name)}`;
    return `
    <div class="chem-card">
      <div class="chem-name">${customName ? escapeHtml(customName) : displayName}</div>
      <div class="chem-body">
        <div class="chem-member">
          <img src="${p.m1.img}" alt="${escapeHtml(p.m1.name)}">
          <span class="chem-member-name" style="color:${p.m1.color}">${escapeHtml(p.m1.name)}</span>
        </div>
        <div class="chem-arrows">
          <div class="chem-arrow-row"><span class="chem-chat-ico" style="color:${p.m1.color}">${SVG_ICONS.chatBubble}</span><span class="chem-count">${p.c1.toLocaleString()}</span> →</div>
          <div class="chem-arrow-row">← <span class="chem-count">${p.c2.toLocaleString()}</span><span class="chem-chat-ico" style="color:${p.m2.color}">${SVG_ICONS.chatBubble}</span></div>
        </div>
        <div class="chem-member">
          <img src="${p.m2.img}" alt="${escapeHtml(p.m2.name)}">
          <span class="chem-member-name" style="color:${p.m2.color}">${escapeHtml(p.m2.name)}</span>
        </div>
      </div>
    </div>
  `;
  };
  const groupCardHtml = (g) => {
    const membersHtml = g.members.map(id => {
      const m = MEMBER_BY_ID[id];
      if (!m) return '';
      return `<div class="chem-member"><img src="${m.img}" alt="${escapeHtml(m.name)}"><span class="chem-member-name" style="color:${m.color}">${escapeHtml(m.name)}</span></div>`;
    }).join('');
    const memN = g.members.length;
    const memCls = memN >= 7 ? ' large' : memN === 6 ? ' large cols3' : memN === 4 ? ' large n4' : '';
    return `<div class="chem-card"><div class="chem-name">${escapeHtml(g.name)}</div><div class="chem-body"><div class="chem-group-members${memCls}">${membersHtml}</div></div></div>`;
  };

  // 섹션 제목. firstNoBorder=true면 위 구분선·여백 제거 (그리드 첫 줄, 또는 우산 라벨 바로 아래용)
  const sec = (label, firstNoBorder, isTrack) =>
    `<div class="chem-group-section"${firstNoBorder ? ' style="margin-top:0;padding-top:0;border-top:none"' : ''}><div class="chem-group-title${isTrack ? ' chem-track-title' : ''}">${label}</div></div>`;

  // 상단 트랙(모두 포함)은 2~11명 선택일 때만 작동. 1명·전원·0명은 제외 → 그 경우 화면은 기존(일부 포함 OR)과 동일.
  const selArr = [...chemFilterMembers];
  const topActive = selArr.length >= 2 && selArr.length <= MEMBERS.length - 1;
  const allIncluded = (ids) => selArr.every(id => ids.includes(id));   // 선택집합 ⊆ 조합
  const excluded = (ids) => topActive && allIncluded(ids);             // 상단에 올라간 카드는 하단에서 중복 제외

  // ── 상단: 모두 포함 — 선택 멤버가 전부 든 조합만, 2인·그룹 통합 평면 나열(인원수 적은 순 → 같은 인원수면 채팅 합 내림차순) ──
  let topHtml = '';
  if (topActive) {
    const matched = [];
    for (const p of pairs) if (allIncluded([p.m1.id, p.m2.id])) matched.push({ size: 2, total: p.total, html: pairCardHtml(p) });
    for (const g of CHEM_GROUPS) if (allIncluded(g.members)) matched.push({ size: g.members.length, total: groupChatTotal(g), html: groupCardHtml(g) });
    matched.sort((a, b) => a.size - b.size || b.total - a.total);
    // 2명 선택 시 그 쌍이 항상 매칭되므로, '없음'은 사실상 3~11명에서만 발생
    const matchedBody = matched.length > 0
      ? matched.map(x => x.html).join('')
      : '<div class="chem-empty">조건에 맞는 케미가 없어요</div>';
    topHtml = sec('모두 포함', true, true) + matchedBody;
  }

  // ── 하단: 일부 포함 — 기존 OR 결과(상단에 올라간 카드는 제외). 우산 라벨은 상단이 떴을 때만. ──
  const botPairCards = pairs
    .filter(p => (chemFilterMembers.has(p.m1.id) || chemFilterMembers.has(p.m2.id)) && !excluded([p.m1.id, p.m2.id]))
    .map(pairCardHtml).join('');
  const botGroupSections = [...new Set(CHEM_GROUPS.map(g => g.members.length))].sort((a, b) => a - b).map(n => {
    const groups = CHEM_GROUPS
      .filter(g => g.members.length === n && g.members.some(id => chemFilterMembers.has(id)) && !excluded(g.members))
      .sort((a, b) => groupChatTotal(b) - groupChatTotal(a));   // 2인 케미와 동일하게 주고받은 채팅 합 내림차순
    if (groups.length === 0) return '';
    return `<div class="chem-group-section"><div class="chem-group-title">${n}인 케미</div><div class="chem-group-grid">${groups.map(groupCardHtml).join('')}</div></div>`;
  }).join('');

  let botHtml = '';
  if (topActive) botHtml += sec('일부 포함', false, true);   // 우산 라벨(상단과 구분하는 트랙 구분선)
  botHtml += sec('2인 케미', true);                     // 그리드 첫 줄(또는 우산 라벨 바로 아래)이라 구분선 제거
  botHtml += (botPairCards.length > 0 ? botPairCards : '<div class="chem-empty">필터 조건에 맞는 케미가 없어요</div>');
  botHtml += botGroupSections;

  const allOn = chemFilterMembers.size === MEMBERS.length;
  const memberBtns = MEMBERS.map(m => `
    <button class="filter-member ${chemFilterMembers.has(m.id) ? 'on' : ''}" data-id="${m.id}">
      <img src="${m.img}" alt="${escapeHtml(m.name)}">
    </button>
  `).join('');

  body.innerHTML = `
    <div class="chem-content">
      <div class="chem-grid">
        ${topHtml}
        ${botHtml}
      </div>
    </div>
    <div class="chem-filter-panel">
      <div class="filter-title">멤버</div>
      <div class="filter-row">
        <button class="filter-toggle-all" id="chemFilterToggle">${allOn ? '모두 해제' : '모두 선택'}</button>
        <div class="chem-filter-members" id="chemFilterMembers">${memberBtns}</div>
      </div>
    </div>
  `;

  body.querySelectorAll('#chemFilterMembers .filter-member').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      if (chemFilterMembers.has(id)) chemFilterMembers.delete(id); else chemFilterMembers.add(id);
      renderChemistry();
    });
  });
  const toggleBtn = document.getElementById('chemFilterToggle');
  if (toggleBtn) toggleBtn.addEventListener('click', () => {
    if (chemFilterMembers.size === MEMBERS.length) chemFilterMembers.clear(); else MEMBERS.forEach(m => chemFilterMembers.add(m.id));
    renderChemistry();
  });
}

// ── 명예의 전당 ── 전 항목 통산(개시 이래) 집계. 연간 경쟁은 통계 탭 연간 메달이 담당.
// 방송일수·방송시간·게시글·유튜브 = 연간 합(computeAnnualSums, 연간 탭과 동일 산식 + seed 포함)을 전 연도 누적,
// 개근·마라톤·정전 위원회 2종 = 세션 기록 기반(과거 세션 시딩으로 2026-01부터, seed 합계는 미사용),
// 멤버 채팅 쌍·컨텐츠·현수막 = 누적 카운터.
// 정전 위원회: 다른 멤버 방송 구간(고아 세션은 48h 상한)과의 시점·구간 겹침으로 판정 — 간섭 구간은 기간 밖 세션도 포함(경계 걸침 역전 방지).

// 구간 목록 병합 (정렬된 비중첩 구간으로)
function mergeIntervals(list) {
  const arr = [...list].sort((a, b) => a.s - b.s);
  const out = [];
  for (const iv of arr) {
    const last = out[out.length - 1];
    if (last && iv.s <= last.e) { if (iv.e > last.e) last.e = iv.e; }
    else out.push({ s: iv.s, e: iv.e });
  }
  return out;
}
// 시각 t가 병합 구간 위에 있는지 (구간은 [s, e) 반개구간)
function coversPoint(merged, t) {
  for (const o of merged) {
    if (o.s <= t && t < o.e) return true;
    if (o.s > t) break;
  }
  return false;
}
// 구간 iv에서 병합 구간과 겹치는 부분을 뺀 길이(ms)
function soloMsOf(iv, merged) {
  let total = iv.e - iv.s;
  for (const o of merged) {
    if (o.e <= iv.s) continue;
    if (o.s >= iv.e) break;
    total -= Math.min(iv.e, o.e) - Math.max(iv.s, o.s);
  }
  return total;
}

// 가장 긴 연속 방송일 (달력 날짜 키 집합 → 최장 연속 구간)
function longestStreak(dateSet) {
  const days = [...dateSet].sort();
  let best = 0, cur = 0, prev = null;
  for (const d of days) {
    const [y, mo, da] = d.split('-').map(Number);
    const t = Date.UTC(y, mo - 1, da);
    cur = (prev !== null && t - prev === 86400000) ? cur + 1 : 1;
    if (cur > best) best = cur;
    prev = t;
  }
  return best;
}

// 명전 토글 상태(세로↔수평). 세션 내 유지, localStorage 저장 안 함(새로고침 시 끔=세로로 복귀)
let hallShowRanks = false;
// 값 내림차순 dense 순위로 상위 3개 그룹 추출(값 같으면 동순위, 0은 제외). [{rank,value,members}] 최대 3개.
function hallTopRanks(getVal) {
  const distinct = [...new Set(MEMBERS.map(m => getVal(m.id)))].filter(v => v > 0).sort((a, b) => b - a);
  return distinct.slice(0, 3).map((v, i) => ({ rank: i + 1, value: v, members: MEMBERS.filter(m => getVal(m.id) === v) }));
}

// 명전 기간 분할 — 통산 / 2026 상반기 / 2026 하반기. 기본 통산(7월 초 하반기가 빌 동안 통산 노출).
let hallPeriod = 'total';
const HALL_PERIODS = [
  { key: 'total', label: '통산' },
  { key: 'h1',    label: '2026 상반기' },
  { key: 'h2',    label: '2026 하반기' },
];
const HALL_H1_CHAT_MONTH  = '2026-06';                 // 상반기 채팅 버킷(채팅 수집 6/5 개시 → 6월=상반기 전체)
const HALL_H2_START_MONTH = '2026-07';                 // 하반기 채팅 버킷 시작월(from)
const HALL_H1_LO = kstMonthStartMs(2026, 1);           // 2026-01-01 KST 자정 (세션·시트 상반기 하한) — 로컬 Date 생성자는 뷰어 TZ에 따라 경계가 밀려 금지(KST 정렬 정책)
const HALL_H2_LO = kstMonthStartMs(2026, 7);           // 2026-07-01 KST 자정 (상/하반기 경계)
const HALL_H2_HI = kstMonthStartMs(2027, 1);           // 2027-01-01 KST 자정 (하반기 상한)
const hallChemCache = {};

// 명전 기간 채팅 데이터 로드 — 통산=전체누적, h1=2026-06 버킷, h2=2026-07~현재 합산. 기간별 캐시.
async function loadHallChem(period) {
  let url = WORKER_URL + '/chat-counts';
  if (period === 'h1') url += '?month=' + HALL_H1_CHAT_MONTH;
  else if (period === 'h2') url += '?from=' + HALL_H2_START_MONTH;
  try {
    const res = await fetch(url);
    hallChemCache[period] = res.ok ? await res.json() : {};
  } catch (e) { hallChemCache[period] = {}; }
}

// 탭 진입 시 현재 기간 재조회('열람 시 갱신') — loadHallChem을 재사용하지 않는 이유: 저 함수는 실패 시 캐시를 {}로
// 덮는 첫 조회 전용 설계(renderHall 스피너 무한루프 방지)라, 재조회 실패가 멀쩡한 캐시를 지우면 안 됨. 미보유 기간은
// renderHall의 기존 로딩 경로가 담당. URL 산식은 loadHallChem과 반드시 동일하게 유지할 것.
async function refreshHallChem() {
  const period = hallPeriod;
  const cached = hallChemCache[period];
  if (!cached) return;
  let url = WORKER_URL + '/chat-counts';
  if (period === 'h1') url += '?month=' + HALL_H1_CHAT_MONTH;
  else if (period === 'h2') url += '?from=' + HALL_H2_START_MONTH;
  try {
    const res = await fetch(url);
    if (!res.ok) return;   // 실패 시 기존 캐시 유지
    const fresh = await res.json();
    if (JSON.stringify(fresh) === JSON.stringify(cached)) return;   // 무변화면 재렌더 생략
    hallChemCache[period] = fresh;
    if (currentPage === 'hall' && hallPeriod === period) renderHall();
  } catch (e) {}
}

// 기간 월 목록의 월 stats 합산 (연간탭 computeAnnualSums와 동일 월별 산식 — viewer 제외 + seed 포함)
// 진행 중 세션의 '진짜 방송 중' 판정용 라이브 스냅샷(broad_no) — 명전 착시 방지용, 실패 시 빈 맵 → 48h 상한 폴백
let hallLiveCache = null, hallLiveAt = 0;
async function loadHallLive() {
  hallLiveAt = Date.now();
  try {
    const r = await fetch(WORKER_URL + '/');
    const map = {};
    ((await r.json()).members || []).forEach(x => { if (x.live && x.broad_no) map[x.id] = String(x.broad_no); });
    hallLiveCache = map;
  } catch (e) { if (!hallLiveCache) hallLiveCache = {}; }
}
function hallSumMonths(monthList, nowMs = Date.now()) {
  const sums = {};
  MEMBERS.forEach(m => { sums[m.id] = { sessions: 0, totalDurationMs: 0, postCount: 0, cafeCount: 0, youtubeCount: 0 }; });
  for (const ym of monthList) {
    const [y, mo] = ym.split('-').map(Number);
    const monthStart = kstMonthStartMs(y, mo);
    const monthEnd = kstMonthStartMs(y, mo + 1);
    MEMBERS.forEach(m => {
      const ms = statsState.data[ym]?.[m.id];
      if (!ms) return;
      const t = sums[m.id];
      // sessions = '방송 일수'(그 달 방송한 날짜 수) — 연간탭 computeAnnualSums와 동일 기준(하루 2회도 1일)
      const daySet = new Set();
      (ms.sessions || []).forEach(s => { const x = new Date(s.start).getTime(); if (isNaN(x) || x < monthStart || x >= monthEnd) return; for (const dk of sessionDateKeys(s, ym, nowMs)) daySet.add(dk); });   // 걸침 규칙 공용
      t.sessions += daySet.size;
      (ms.sessions || []).forEach(s => {
        const x = new Date(s.start).getTime();
        if (isNaN(x) || x < monthStart || x >= monthEnd) return;
        if (s.end) { const e = new Date(s.end).getTime(); if (!isNaN(e) && e > x) t.totalDurationMs += (e - x); }
      });
      t.postCount    += (ms.posts   || []).filter(p => { const x = new Date(p.time).getTime(); return !isNaN(x) && x >= monthStart && x < monthEnd; }).length;
      t.youtubeCount += (ms.youtube || []).filter(yv => { const x = new Date(yv.time).getTime(); return !isNaN(x) && x >= monthStart && x < monthEnd; }).length;
      t.cafeCount    += (ms.cafe    || []).filter(c => { const x = new Date(c.time).getTime(); return !isNaN(x) && x >= monthStart && x < monthEnd; }).length;
      if (ms.seed) {
        t.sessions        += ms.seed.sessions    || 0;
        t.totalDurationMs += ms.seed.broadcastMs || 0;
        t.postCount       += ms.seed.posts       || 0;
        t.youtubeCount    += ms.seed.youtube     || 0;
        t.cafeCount       += ms.seed.cafe        || 0;
      }
    });
  }
  return sums;
}

function renderHall() {
  const body = document.getElementById('hallBody');
  if (!body) return;
  const now = kstNow();
  const year = now.getUTCFullYear();
  // 역대 집계(개근·마라톤)를 위해 통계 개시(2026-01)부터 현재까지 전 월을 적재 (과거 월은 localStorage 캐시)
  const monthsToLoad = [];
  const allMonths = [];
  for (let y = STATS_START_YEAR; y <= year; y++) {
    const maxMo = (y === year) ? now.getUTCMonth() + 1 : 12;
    for (let mo = 1; mo <= maxMo; mo++) {
      const ym = `${y}-${String(mo).padStart(2,'0')}`;
      allMonths.push(ym);
      if (!statsState.data[ym] && !statsState.loadingMonths.has(ym)) monthsToLoad.push(ym);
    }
  }
  if (monthsToLoad.length > 0) {
    body.innerHTML = '<div class="loading"><div class="spinner"></div><div>명예의 전당 불러오는 중...</div></div>';
    Promise.all(monthsToLoad.map(ym => loadStatsMonth(ym))).then(() => {
      if (currentPage === 'hall') renderHall();
    });
    return;
  }

  // 기간(통산/2026 상반기/2026 하반기) 결정 + 채팅 기간 데이터 게이트
  const period = hallPeriod;
  if (!hallChemCache[period]) {
    body.innerHTML = '<div class="loading"><div class="spinner"></div><div>명예의 전당 불러오는 중...</div></div>';
    loadHallChem(period).then(() => { if (currentPage === 'hall') renderHall(); });
    return;
  }
  const chem = hallChemCache[period];
  // 기간별 월 목록(월 stats 합산용) / 세션·시트 시각 경계
  const periodMonths = period === 'h1' ? allMonths.filter(ym => ym >= '2026-01' && ym <= '2026-06')
                     : period === 'h2' ? allMonths.filter(ym => ym >= '2026-07' && ym <= '2026-12')
                     : allMonths;
  const inPeriodTs  = t    => period === 'h1' ? (t >= HALL_H1_LO && t < HALL_H2_LO)
                            : period === 'h2' ? (t >= HALL_H2_LO && t < HALL_H2_HI) : true;
  const inPeriodYmd = sort => period === 'h1' ? (sort >= '260101' && sort < '260701')   // YYMMDD
                            : period === 'h2' ? (sort >= '260701' && sort < '270101') : true;

  // 라이브 스냅샷(60초 캐시) — 도착하면 재렌더, 그 전엔 빈 맵(=기존 48h 상한 동작)
  if (Date.now() - hallLiveAt > 60000) loadHallLive().then(() => { if (currentPage === 'hall') renderHall(); });
  const liveBn = hallLiveCache || {};

  // 통산/기간 합산: 월 stats를 기간 월 목록만큼 합산 (연간탭 산식과 동일, seed 포함)
  const totalSums = hallSumMonths(periodMonths);

  // 세션 단위 역대 집계 (개근·마라톤·정전 위원회) — '올해' 항목이 아니므로 연도 제한 없음, 연말~연초 연속 방송도 안 끊김.
  // seed 합계는 세션별 기록이 없어 미사용(과거 구간은 시딩된 세션이 담당)
  const ORPHAN_CAP_MS = 48 * 3600000; // 종료 누락 고아 세션이 '영원히 방송 중'으로 남아 전원 판정을 오염시키는 것 방지
  const nowMs = Date.now();
  const extra = {};
  const intervals = {};      // 기간 내 시작 세션 (점수 대상)
  const intervalsAll = {};   // 전 월 세션 (간섭 판정 전용) — 기간 경계에 걸친 세션의 겹침도 반영해 '기간 solo > 통산 solo' 역전 방지
  MEMBERS.forEach(m => { extra[m.id] = { marathonMs: 0, dates: new Set() }; intervals[m.id] = []; intervalsAll[m.id] = []; });
  for (const ym of allMonths) {   // 간섭 판정용으로 기간 밖 월도 순회 (renderHall이 전 월을 이미 적재해 추가 fetch 없음)
    MEMBERS.forEach(m => {
      const ms = statsState.data[ym]?.[m.id];
      if (!ms) return;
      for (const s of (ms.sessions || [])) {
        const t = new Date(s.start).getTime();
        if (isNaN(t)) continue;
        const scored = inPeriodTs(t);   // 기간 편입은 시작 시각 기준(방송일수·마라톤과 동일 귀속)
        if (scored) {
          // 연속 방송 일수: 걸침 규칙(24h당 +1일, sessionDateKeys와 동일 기준) — 스트릭은 월경계 없이 산입
          for (const dk of sessionDateKeys(s, null, nowMs)) extra[m.id].dates.add(dk);
        }
        let e = null;
        if (s.end) {
          e = new Date(s.end).getTime();
          if (isNaN(e) || e <= t) e = null;
        } else if (liveBn[m.id] && s.broad_no && liveBn[m.id] === String(s.broad_no)) {
          // 지금 실제로 방송 중인 바로 그 방송이면 현재 시각까지 인정 — 48h+ 마라톤 중 '정전 위원회' 착시 방지(2026-07-16 확정)
          e = nowMs > t ? nowMs : null;
        } else {
          e = Math.min(nowMs, t + ORPHAN_CAP_MS); // 그 외 진행 중(고아 의심) 세션은 48h 상한 — 전원 판정 오염 방지
          if (e <= t) e = null;
        }
        if (e === null) continue;
        intervalsAll[m.id].push({ s: t, e });
        if (!scored) continue;
        intervals[m.id].push({ s: t, e });
        if (s.end) {
          const dur = e - t;
          if (dur > extra[m.id].marathonMs) extra[m.id].marathonMs = dur;
        }
      }
    });
  }

  // 정전 중단 위원회(아무도 없을 때 시작한 방송 횟수) / 정전 방지 위원회(아무도 없을 때 방송한 시간)
  const solo = {};
  MEMBERS.forEach(m => { solo[m.id] = { starts: 0, ms: 0 }; });
  MEMBERS.forEach(m => {
    const others = [];
    MEMBERS.forEach(o => { if (o.id !== m.id) others.push(...intervalsAll[o.id]); });   // 간섭은 기간 밖 세션 포함 — 자기 점수 구간(intervals)만 기간 한정
    const merged = mergeIntervals(others);
    for (const iv of intervals[m.id]) {
      if (!coversPoint(merged, iv.s)) solo[m.id].starts++;
      const sm = soloMsOf(iv, merged);
      if (sm > 0) solo[m.id].ms += sm;
    }
  });

  // 멤버들을 좋아하는(다른 멤버 방송에 보낸 채팅) / 멤버들이 좋아하는(자기 방송에 받은 멤버 채팅) — chat_counts 양방향 합산
  const chemOut = {};
  const chemIn = {};
  MEMBERS.forEach(m => { chemOut[m.id] = 0; chemIn[m.id] = 0; });
  for (const [key, cnt] of Object.entries(chem || {})) {
    const [fromId, toId] = key.split(':');
    if (chemOut[fromId] !== undefined) chemOut[fromId] += cnt;
    if (chemIn[toId] !== undefined) chemIn[toId] += cnt;
  }

  // 컨텐츠·현수막 왕: 시트 데이터의 멤버 표기 횟수 누적 (각 탭 랭킹과 동일 기준)
  const bannerCounts = {};
  const contentCounts = {};
  MEMBERS.forEach(m => { bannerCounts[m.id] = 0; contentCounts[m.id] = 0; });
  bannerData.forEach(b => { if (!inPeriodYmd(b.date?.sort || '')) return; b.members.forEach(name => { const m = MEMBERS.find(x => x.name === name); if (m) bannerCounts[m.id]++; }); });
  contentData.forEach(c => { if (!inPeriodYmd(c.date?.sort || '')) return; c.members.forEach(name => { const m = MEMBERS.find(x => x.name === name); if (m) contentCounts[m.id]++; }); });

  const categories = [
    { label: '천타버스 공무원',           desc: '방송 일수',          icon: SVG_ICONS.calendar, color: 'var(--ev-start)',   get: id => totalSums[id].sessions,                              fmt: v => `${v}일` },
    { label: '엉덩이가 무거운',           desc: '방송 시간',          icon: SVG_ICONS.clockTime,    color: 'var(--ev-start)',   get: id => totalSums[id].totalDurationMs,                       fmt: v => formatDuration(v) },
    { label: '휴방하는 것을 까먹은',       desc: '연속 방송 일수',          icon: SVG_ICONS.flame,        color: '#FF8C00',           get: id => longestStreak(extra[id].dates),                       fmt: v => `${v}일` },
    { label: '방종하는 것을 까먹은',       desc: '단일 방송 시간',          icon: SVG_ICONS.hourglass,    color: '#FF8C00',           get: id => extra[id].marathonMs,                                 fmt: v => formatDuration(v) },
    { label: '천타버스 정전 중단 위원회',  desc: '아무도 없을 때 시작한 방송',    icon: SVG_ICONS.sun,          color: '#FFDD00',           get: id => solo[id].starts,                                      fmt: v => `${v}회` },
    { label: '천타버스 정전 방지 위원회',  desc: '아무도 없을 때 방송한 시간', icon: SVG_ICONS.moon,         color: '#FFDD00',           get: id => solo[id].ms,                                          fmt: v => formatDuration(v) },
    { label: '팬과 자주 소통하는',         desc: '숲·카페 게시글',     icon: SVG_ICONS.board,        color: 'var(--ev-post)',    icon2: SVG_ICONS.coffee, color2: '#03C75A', get: id => totalSums[id].postCount + totalSums[id].cafeCount, fmt: v => `${v}개` },
    { label: '유튜브도 놓치지 않는',       desc: '유튜브 업로드',      icon: SVG_ICONS.youtube,      color: 'var(--ev-youtube)', get: id => totalSums[id].youtubeCount,                          fmt: v => `${v}개` },
    { label: '멤버들을 좋아하는',          desc: '다른 멤버 방송에서 보낸 채팅',  icon: SVG_ICONS.send,         color: '#a78bfa',           get: id => chemOut[id],                                          fmt: v => `${v.toLocaleString()}회` },
    { label: '멤버들이 좋아하는',          desc: '본인 방송에서 받은 멤버 채팅',  icon: SVG_ICONS.heartBubble,  color: '#a78bfa',           get: id => chemIn[id],                                           fmt: v => `${v.toLocaleString()}회` },
    { label: '천타버스에 충실한',          desc: '천타버스 컨텐츠 참여 횟수',    icon: SVG_ICONS.film,         color: 'var(--accent)',     get: id => contentCounts[id],                                    fmt: v => `${v}회` },
    { label: '천타버스의 위상을 드높인',    desc: '천타버스 현수막 게시 횟수',    icon: SVG_ICONS.flag,         color: 'var(--accent)',     get: id => bannerCounts[id],                                     fmt: v => `${v}회` },
  ];

  const ranksByCat = categories.map(cat => hallTopRanks(cat.get));

  const cards = categories.map((cat, ci) => {
    const ranks = ranksByCat[ci];
    let content;
    if (ranks.length === 0) {
      content = '<div class="hall-empty">아직 집계 전이에요</div>';
    } else {
      const g1 = ranks[0], g2 = ranks[1], g3 = ranks[2];
      const isSolo = g1.members.length === 1;
      const psV = 64;                 // 끔(세로): 단독·공동 모두 64
      const psH = isSolo ? 64 : 48;   // 켬(수평): 단독 64 / 공동 48
      // 끔(세로): 1위 사진+이름 + "설명: 값"
      const vWinners = g1.members.map(w => `
            <div class="hall-v-w">
              <img style="width:${psV}px;height:${psV}px" src="${w.img}" alt="${escapeHtml(w.name)}">
              <span class="hall-v-name" style="color:${w.color}">${escapeHtml(w.name)}</span>
            </div>`).join('');
      const vLayout = `
          <div class="hall-v">
            <div class="hall-v-winners">${vWinners}</div>
            <div class="hall-v-val"><span class="hall-v-desc">${cat.desc}:</span> ${cat.fmt(g1.value)}</div>
          </div>`;
      // 켬(수평): 설명(상단 전체폭, 우측정렬) + [1위 사진 | 금/은/동 1~3위 행(이름 좌·기록 우)]
      const photos = g1.members.map(w => `<img style="width:${psH}px;height:${psH}px" src="${w.img}" alt="${escapeHtml(w.name)}">`).join('');
      const row = (g, cls) => g ? `
            <div class="hall-row ${cls}">
              <span class="hall-r-name">${g.members.map(w => `<span style="color:${w.color}">${escapeHtml(w.name)}</span>`).join(' · ')}</span>
              <span class="hall-r-val">${cat.fmt(g.value)}</span>
            </div>` : '';
      const hLayout = `
          <div class="hall-h">
            <div class="hall-desc">${cat.desc}</div>
            <div class="hall-h-body">
              <div class="hall-photos">${photos}</div>
              <div class="hall-data">
                ${row(g1, 'm1')}${row(g2, 'm2')}${row(g3, 'm3')}
              </div>
            </div>
          </div>`;
      content = vLayout + hLayout;
    }
    return `
      <div class="hall-card">
        <div class="hall-cat"><span class="hall-cat-icon" style="color:${cat.color}">${cat.icon}</span>${cat.icon2 ? `<span class="hall-cat-icon" style="color:${cat.color2}">${cat.icon2}</span>` : ''}<span>${cat.label}</span></div>
        <div class="hall-content">${content}</div>
      </div>
    `;
  }).join('');

  const periodBtns = HALL_PERIODS.map(p => `<button class="hall-period-btn ${p.key === period ? 'active' : ''}" data-period="${p.key}" type="button">${p.label}</button>`).join('');
  body.innerHTML = `
    <div class="hall-bar">
      <div class="hall-period">${periodBtns}</div>
      <div class="hall-bar-right">
        <span class="hall-bar-label">2 · 3위 보기</span>
        <button class="notify-switch ${hallShowRanks ? 'on' : ''}" id="hallRankToggle" type="button" aria-label="2 · 3위 보기"></button>
      </div>
    </div>
    <div class="hall-grid">${cards}</div>
  `;
  // 끔(세로)·켬(수평) 양쪽에서 각 카드 콘텐츠 높이를 실측해, 가장 큰 값을 전 카드 공통 높이로 → 토글해도·카드끼리도 높이 동일
  const contentEls = body.querySelectorAll('.hall-content');
  contentEls.forEach(el => { el.style.minHeight = ''; });
  let maxH = 0;
  body.classList.remove('show-ranks');
  contentEls.forEach(el => { if (el.offsetHeight > maxH) maxH = el.offsetHeight; });
  body.classList.add('show-ranks');
  contentEls.forEach(el => { if (el.offsetHeight > maxH) maxH = el.offsetHeight; });
  contentEls.forEach(el => { el.style.minHeight = maxH + 'px'; });
  body.classList.toggle('show-ranks', hallShowRanks);   // 실제 토글 상태로 복원
  const rankToggle = document.getElementById('hallRankToggle');
  if (rankToggle) rankToggle.addEventListener('click', () => {
    hallShowRanks = !hallShowRanks;
    body.classList.toggle('show-ranks', hallShowRanks);
    rankToggle.classList.toggle('on', hallShowRanks);
  });
  body.querySelectorAll('.hall-period-btn').forEach(btn => btn.addEventListener('click', () => {
    if (btn.dataset.period === hallPeriod) return;
    hallPeriod = btn.dataset.period;
    renderHall();
  }));
  lastHallUpdate = new Date();
  updateHeaderCenter();
}

function initMembersTabs() {
  const wrap = document.getElementById('membersTabsWrap');
  if (!wrap) return;
  const crewTab = `<button class="members-tab members-tab-crew active" data-tab="crew"><img src="Favicon.webp" alt="크루"></button>`;
  const memberTabs = MEMBERS.map(m => `<button class="members-tab" data-tab="${m.id}" title="${m.name}"><img src="${m.img}" alt="${m.name}"></button>`).join('');
  wrap.innerHTML = crewTab + memberTabs;
  wrap.querySelectorAll('.members-tab').forEach(btn => {
    btn.addEventListener('click', () => selectMembersTab(btn.dataset.tab));
  });
  renderMembersBody();
}

function selectMembersTab(tabId) {
  membersState.selectedTab = tabId;
  document.querySelectorAll('.members-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tabId);
  });
  renderMembersBody();
}

function renderMembersBody() {
  const body = document.getElementById('membersBody');
  if (!body) return;
  if (membersState.selectedTab === 'crew') {
    renderMembersCrew(body);
  } else {
    renderMembersProfile(body, membersState.selectedTab);
  }
}

// 크루탭 활동 리스트(시트 '크루활동' 탭 소스). 태그가 YYYY-MM-DD 날짜면 오늘(KST)까지 경과일을 (D+N일)로 동적 표기 — 결성 D+ 산식과 동일.
function crewTagHtml(tag) {
  if (!tag) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(tag)) {
    const k = new Date(Date.now() + 9 * 3600 * 1000);
    const days = Math.floor((Date.UTC(k.getUTCFullYear(), k.getUTCMonth(), k.getUTCDate()) - Date.parse(tag)) / 86400000);
    return days > 0 ? ` <span class="tag">(D+${days}일)</span>` : '';
  }
  return ` <span class="tag">${escapeHtml(tag)}</span>`;
}

function renderMembersCrew(body) {
  // 데이터 없음 = 아직 로드 전('불러오는 중') 또는 실패('불러올 수 없어요'). 재시도 발화는 switchPage(탭 진입)에서만 —
  // 여기서 발화하면 로더 완료→재렌더→재발화의 무한 fetch 루프(시트 장애 지속 시).
  let actsHtml = '';
  if (crewActs.length === 0) {
    actsHtml = `<div class="crew-act-li"><span>${crewSheetsDone ? '크루 활동을 불러올 수 없어요' : '크루 활동 불러오는 중...'}</span></div>`;
  } else {
    let lastSec = '';
    crewActs.forEach(a => {
      if (a.section !== lastSec) { actsHtml += `<div class="crew-act-sub">${escapeHtml(a.section)}</div>`; lastSec = a.section; }
      actsHtml += `<div class="crew-act-li"><span class="dot">•</span><span>${a.date ? `<span class="d">${escapeHtml(a.date)}</span> — ` : ''}${escapeHtml(a.text)}${crewTagHtml(a.tag)}</span></div>`;
    });
  }
  body.innerHTML = `
    <div class="members-crew">
      <div class="members-crew-intro">
        <img class="members-crew-intro-img" src="CHUNTAVERSE.webp" alt="CHUNTAVERSE">
        <p>천타버스는 원래 천양님이 크루 콘텐츠에 참가하기 위해 결성한 '위장 크루'로 시작했으나<br><br>지속적인 합방과 다채로운 자체 콘텐츠를 통해<br><br>이제는 그 누구도 대체할 수 없는 독보적인 매력을 뽐내는 버추얼 크루로 당당히 성장해 나가는 중입니다.</p>
      </div>
      <div class="members-crew-activities">
        ${actsHtml}
        <div class="crew-act-more"><button type="button" onclick="history.replaceState(null,'','#content');switchPage('content')">컨텐츠 더보기 →</button></div>
      </div>
    </div>
  `;
}

// ── 프로필 항목 모아보기: 행(data-mi) 클릭 → 전 멤버의 해당 항목을 lrOverlay(좋아요·일정 공용)에 정렬 표시 ──
// 정렬은 원문 문자열(+생일 보조)로 판정하는 순수 함수(verify_mi_collect 스위트가 검증). 파싱 불가값(비공개·해당 없음·불참 등)은 하단, 각 구간 내 멤버 기본순(안정 정렬).
// 나이=연장자순(700살 최상단·동년생은 생일 빠른 쪽 먼저), MBTI=알파벳순(같은 유형 자연 묶음).
function miSortKey(kind, raw, bd) {
  if (!raw) return null;
  if (kind === 'age') {
    if (raw === '700살') return -Infinity;   // 컨셉 존중 — 최연장자로 최상단
    const m = raw.match(/^(\d{4})년생$/);
    if (!m) return null;
    return +m[1] * 10000 + (bd ? bd.month * 100 + bd.day : 1300);   // 동년생은 생일 빠른 쪽이 연장(만 나이 순서와 항상 일치). 생일 미상은 연내 최후순
  }
  if (kind === 'height') { const m = raw.match(/([\d.]+)\s*cm/); return m ? -parseFloat(m[1]) : null; }   // 내림차순
  if (kind === 'date') { const m = raw.match(/(\d{4})년(?:\s*(\d{1,2})월)?(?:\s*(\d{1,2})일)?/); return m ? +m[1] * 10000 + (+m[2] || 1) * 100 + (+m[3] || 1) : null; }   // 고참순(연도만 있으면 1/1 취급)
  if (kind === 'rank') { const m = raw.match(/(\d+)\s*위/); return m ? +m[1] : null; }
  if (kind === 'birthday') { const m = raw.match(/(\d{1,2})월\s*(\d{1,2})일/); return m ? +m[1] * 100 + +m[2] : null; }   // 달력순
  return null;
}
function buildMiCollect(kind, entries) {
  // entries: [{raw, base, bd?}] — base = 멤버 기본순 인덱스, bd = 생일(나이 정렬 보조)
  if (kind === 'mbti') {
    // 알파벳순 — 같은 유형이 자연히 묶이고 유사 계열(I***끼리 등)도 인접. 빈값 하단. (구: 인원 내림차순 묶음 → 2026-07-11 피드백으로 변경)
    return entries.slice().sort((a, b) => {
      const ta = (a.raw || '').trim(), tb = (b.raw || '').trim();
      if (!ta && !tb) return a.base - b.base;
      if (!ta) return 1;
      if (!tb) return -1;
      return ta < tb ? -1 : ta > tb ? 1 : a.base - b.base;
    });
  }
  if (!kind) return entries.slice();   // 자유 텍스트(팬네임·소속 등) = 기본순
  return entries.slice().sort((a, b) => {
    const ka = miSortKey(kind, a.raw, a.bd), kb = miSortKey(kind, b.raw, b.bd);
    if (ka === null && kb === null) return a.base - b.base;
    if (ka === null) return 1;
    if (kb === null) return -1;
    return ka - kb || a.base - b.base;
  });
}
const MI_COLLECT_FIELDS = {
  age:          { label: '나이', kind: 'age', raw: (id, i) => i.age, display: (id, i) => calcAge(id, i.age) },
  birthday:     { label: '생일', kind: 'birthday', raw: id => (MEMBER_BIRTHDAYS[id] || {}).display || '', display: id => (MEMBER_BIRTHDAYS[id] || {}).display || '' },
  height:       { label: '키', kind: 'height', raw: (id, i) => i.height, display: (id, i) => i.height },
  mbti:         { label: 'MBTI', kind: 'mbti', raw: (id, i) => i.mbti, display: (id, i) => i.mbti },
  fanName:      { label: '팬네임', kind: null, raw: (id, i) => i.fanName, display: (id, i) => i.fanName },
  group:        { label: '다른 소속', kind: null, raw: (id, i) => i.group, display: (id, i) => i.group },
  firstStream:  { label: '첫 방송일', kind: 'date', raw: (id, i) => i.firstStream, display: (id, i) => calcDaysSince(i.firstStream) },   // 완전한 날짜만 (D+N일) 자동 병기(calcDaysSince 재사용)
  vote:         { label: '면접 득표수/득표율', kind: 'rank', raw: (id, i) => i.vote, display: (id, i) => i.vote },
  election2026: { label: '2026 반장선거 득표수/득표율', kind: 'rank', raw: (id, i) => i.election2026, display: (id, i) => i.election2026 },
};
function openMiCollect(fieldKey, currentId) {
  const f = MI_COLLECT_FIELDS[fieldKey];
  const ov = document.getElementById('lrOverlay');
  const head = document.getElementById('lrHead');
  const body = document.getElementById('lrBody');
  if (!f || !ov || !body) return;
  const entries = MEMBERS.map((m, base) => {
    const info = MEMBER_INFO[m.id] || {};
    return { m, base, info, bd: MEMBER_BIRTHDAYS[m.id], raw: (f.raw(m.id, info) || '').trim() };
  });
  const ordered = buildMiCollect(f.kind, entries);
  head.innerHTML = `<span style="color:var(--accent)">${escapeHtml(f.label)}</span><button class="lr-close" type="button" onclick="closeLikeRequests()">✕</button>`;
  body.innerHTML = ordered.map(e => {
    const disp = e.raw ? (f.display(e.m.id, e.info) || e.raw) : '—';
    return `<div class="mi-collect-row${e.m.id === currentId ? ' me' : ''}">
      <img src="${e.m.img}" alt="${escapeHtml(e.m.name)}">
      <span class="mi-collect-name" style="color:${e.m.color}">${escapeHtml(e.m.name)}</span>
      <span class="mi-collect-val">${escapeHtml(disp)}</span>
    </div>`;
  }).join('');
  ov.hidden = false;
  syncBodyScrollLock();
}

function renderMembersProfile(body, memberId) {
  const m = MEMBER_BY_ID[memberId];
  if (!m) { body.innerHTML = '<div class="loading"><div>멤버 정보를 찾을 수 없어요</div></div>'; return; }
  const bd = MEMBER_BIRTHDAYS[memberId];
  const info = MEMBER_INFO[memberId];
  const links = MEMBER_LINKS[memberId];

  let quickHtml = '';
  if (links) {
    const qLinks = [];
    const station = links.common?.['방송국'];
    if (station) qLinks.push({ url: typeof station === 'string' ? station : station.url, icon: SVG_ICONS.soop, title: '방송국', cls: 'quick-soop' });
    const yt = links.common?.['유튜브'];
    if (yt) qLinks.push({ url: typeof yt === 'string' ? yt : yt.url, icon: SVG_ICONS.youtube, title: '유튜브', cls: 'quick-youtube' });
    const cafe = links.common?.['팬카페'];
    if (cafe) qLinks.push({ url: typeof cafe === 'string' ? cafe : cafe.url, icon: SVG_ICONS.coffee, title: '팬카페', cls: 'quick-naver' });
    quickHtml = qLinks.map(l => `<a class="members-quick-btn ${l.cls}" href="${escapeHtml(l.url)}" target="_blank" rel="noopener" title="${l.title}">${l.icon}</a>`).join('');
    quickHtml += `<button class="members-quick-btn" id="membersGoLinks" title="관련 링크">${SVG_ICONS.link}</button>`;
  }

  const headerHtml = `
    <div class="members-profile-header">
      <img class="members-profile-avatar" src="${m.img}" alt="${escapeHtml(m.name)}" style="border-color:${m.color}">
      <div class="members-profile-info">
        <div class="members-profile-name" style="color:${m.color}">${escapeHtml(m.name)}</div>
        ${info ? `<div class="members-profile-eng">${escapeHtml(info.engName)}</div>` : ''}
      </div>
      ${quickHtml ? `<div class="members-profile-quick">${quickHtml}</div>` : ''}
    </div>
  `;

  let infoHtml = '';
  if (info) {
    const skip = v => !v || v.includes('해당없음') || v.includes('알려져있지');
    const pairedRows = [
      ['나이', 'age', calcAge(memberId, info.age)],
      ['생일', 'birthday', bd ? bd.display : ''],
      ['키', 'height', info.height],
      ['MBTI', 'mbti', info.mbti],
      ['팬네임', 'fanName', info.fanName],
      ['다른 소속', 'group', info.group],
    ].filter(r => !skip(r[2]));
    const firstStreamVal = calcDaysSince(info.firstStream);
    const pairedHtml = pairedRows.map(([label, key, value]) => `<div class="members-info-row" data-mi="${key}"><span class="members-info-label">${escapeHtml(label)}</span><span class="members-info-value">${escapeHtml(value)}</span></div>`).join('');
    const firstStreamHtml = !skip(firstStreamVal) ? `<div class="members-info-row-full" data-mi="firstStream"><span class="members-info-label">첫 방송일</span><span class="members-info-value">${escapeHtml(firstStreamVal)}</span></div>` : '';
    const interviewHtml = info.vote ? `<div class="members-info-row-full" data-mi="vote"><span class="members-info-label">면접 득표수/득표율</span><span class="members-info-value">${escapeHtml(info.vote)}</span></div>` : '';
    const electionHtml = info.election2026 ? `<div class="members-info-row-full" data-mi="election2026"><span class="members-info-label">2026 반장선거 득표수/득표율</span><span class="members-info-value">${escapeHtml(info.election2026)}</span></div>` : '';
    infoHtml = `<div class="members-info-section"><div class="members-info-title">프로필</div><div class="members-info-grid">${pairedHtml}${firstStreamHtml}${interviewHtml}${electionHtml}</div></div>`;
  }

  const photoSrc = m.img.replace('members/', 'profile/');
  body.innerHTML = `
    <div class="members-profile">
      <div class="members-profile-photo"><img src="${photoSrc}" alt="${escapeHtml(m.name)}" onerror="this.parentNode.style.display='none'"></div>
      <div class="members-profile-main">
        ${headerHtml}
        ${infoHtml}
      </div>
    </div>
  `;

  const goLinksBtn = document.getElementById('membersGoLinks');
  if (goLinksBtn) goLinksBtn.addEventListener('click', () => { history.replaceState(null, '', '#links'); switchPage('links'); });
  body.querySelectorAll('[data-mi]').forEach(row => row.addEventListener('click', () => openMiCollect(row.dataset.mi, memberId)));   // 항목 모아보기
}
</script>

  <div class="lr-overlay" id="lrOverlay" hidden>
    <div class="lr-panel">
      <div class="lr-head" id="lrHead"></div>
      <div class="lr-body" id="lrBody"></div>
    </div>
  </div>
  <div class="lr-overlay" id="statGraphOverlay" hidden onclick="if(event.target===this)closeStatGraph()">
    <div class="lr-panel graph-modal-panel">
      <div class="lr-head" id="statGraphHead"></div>
      <div class="lr-body" id="statGraphBody"></div>
    </div>
  </div>
