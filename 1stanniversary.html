<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>천타버스의 첫 1년</title>
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAAlklEQVR4nO3QsQ2AMBRDQTokahZkf3YIM3wBMSFXvN6+5Whnm7klPSAdgPSAdADSA9IBSA9I1x1g3fZSAAAAGBugehgAAABjA9w9DAAAgLEAqgcAAADwL4CnwQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA3wWoHno7AAAAAAAAAEA/gNEDkB6QDkB6QDoA6QHppge4AIoLkXT2Opv5AAAAAElFTkSuQmCC">
<style>
/* 둘째 판(2026-11-20 Crenop '만들어 줘') — 내용·셈은 첫 판(year_template.html)과 같고 모양만 사이트(chuntaverse.com) 문법으로.
   색·그림자·유리 값은 사이트 :root에서 옮긴 것(사이트가 바꾸면 같이 본다). */
:root {
  --bg: #070a14;
  --surface: #101628;
  --surface2: #171f33;
  --border: #242e4c;
  --divider: rgba(36,46,76,0.6);
  --text: #e2e8f0;
  --text2: #cbd5e1;
  --text3: #94a3b8;
  --muted: #7c8aa3;
  --accent: #61FFEC;
  --amber: #fbbf24;
  --medal-gold: #fbbf24;
  --medal-silver: #cbd5e1;
  --medal-bronze: #d98e4d;
  /* 명전 칸 그림 색 — 사이트 :root의 같은 이름 토큰(사이트가 var(--이름)으로 칠한다) */
  --ev-start: #60a5fa; --ic-orange: #FF8C00; --ev-yellow: #fbbf24; --ev-post: #34d399; --ev-cafe: #03C75A; --ev-youtube: #ef4444; --ev-chat: #a78bfa;
  /* 분야 그림 색 — 사이트 종류 그림(.cal-tag)의 태그별 고유색 */
  --tag-white: #ffffff; --tag-mc-handle: #8B5A2B; --tag-mc-head: #4AEDD9; --tag-steam: #66C0F4; --tag-pubg: #F1AA03; --tag-lol: #C89B3C; --tag-wak: #00C6A7; --tag-music: #fbbf24;
  --cell: #172238;                        /* 잔디의 빈 칸 · 비율 막대 바탕 */
  --cell-future: rgba(255,255,255,0.16);
  --g1: rgba(97,255,236,0.22);
  --g2: rgba(97,255,236,0.42);
  --g3: rgba(97,255,236,0.66);
  --sh-box: 0 1px 2px rgba(0,0,0,0.55), 0 8px 24px rgba(0,0,0,0.38);
  --sh-panel: 0 30px 80px rgba(0,0,0,0.75), 0 4px 14px rgba(0,0,0,0.5);
  --glass-panel: rgba(16,22,40,0.7);
  --glass-sat: 1.7;
  --content-glow: rgba(97,255,236,0.12);
  --lb-overlay: rgba(3,5,10,0.78);        /* 크게 보기 뒤 가림막 — 사진을 보는 창이라 사이트 창(0.5)보다 짙게 */
  --scrub: rgba(97,255,236,0.22);         /* 이동 막대에서 지금 보이는 구간 */
  /* 멤버 색 — 사이트 MEMBERS와 같은 값·같은 차례 */
  --m0: #43EAF6; --m1: #FFDE9B; --m2: #DBDCE5; --m3: #F5D3FE; --m4: #8D4BD6; --m5: #FFCFB7; --m6: #EA4335;
  --m7: #BFEF90; --m8: #366CD8; --m9: #F8C24F; --m10: #FFFFFF; --m11: #A8D6FF; --m12: #30BBBA;
}
* { box-sizing: border-box; }
html { background: var(--bg); scrollbar-gutter: stable; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: inherit; text-decoration: none; }
button { font: inherit; }
.wrap { width: min(1560px, calc(100% - 80px)); margin: 0 auto; }
.eyebrow { font-size: 13px; letter-spacing: 0.18em; color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }
.sec { margin: 12px 0 0; font-size: 40px; font-weight: 800; line-height: 1.3; font-variant-numeric: tabular-nums; }
.sec em { font-style: normal; color: var(--accent); }

/* 첫 화면 — 왼쪽 이름, 오른쪽 한 해 잔디 */
.hero { display: grid; grid-template-columns: 380px minmax(0, 1fr); column-gap: 56px; align-items: center; padding: 64px 0 80px; }
.hero-logo { display: block; width: 100%; height: auto; margin-bottom: 36px; }
h1 { font-size: 46px; font-weight: 800; line-height: 1.2; margin: 10px 0 14px; letter-spacing: -0.01em; white-space: nowrap; }
.today { margin: 0; color: var(--text2); font-variant-numeric: tabular-nums; }
.year { display: grid; row-gap: 4px; }
.row { display: grid; grid-template-columns: 48px repeat(31, minmax(0, 1fr)); column-gap: 4px; align-items: center; }
.row .lab { grid-column: 1; font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1; }
.row a.lab:hover { color: var(--accent); }
.row .note { font-size: 12px; line-height: 1; color: var(--muted); text-align: right; padding-right: 6px; white-space: nowrap; }
.row.cap { margin-top: 6px; }
.row.cap .note { grid-column: 2 / 32; padding-right: 0; color: var(--amber); font-size: 13px; }
.cell { display: block; aspect-ratio: 1; background: var(--cell); }
.cell.fut { background: transparent; box-shadow: inset 0 0 0 1px var(--cell-future); }
/* 잔디: 그날 방송을 시작한 멤버 ÷ 그날 총원 — 50% 밑 · 50% · 75% · 모두. 오늘 칸은 따로 칠하지 않는다(칠한 칸이 테두리만 남은 칸으로 바뀌는 자리가 오늘) */
.cell.g1 { background: var(--g1); }
.cell.g2 { background: var(--g2); }
.cell.g3 { background: var(--g3); }
.cell.g4 { background: var(--accent); }
.cell.bday { box-shadow: inset 0 0 0 2px var(--amber); }

/* 열세 달 — 왼쪽 달 이름은 그 달을 읽는 동안 붙어 있다. 위에 붙는 띠(로고 · 달 고르기 · 남은 날)는 뺐다(2026-11-21 Crenop '제일위 상단바는 없어도 되지 않나') — 달로 가는 길은 첫 화면 잔디의 달 이름 */
/* 열세 달이 가로 띠 하나(2026-11-24 Crenop '사진들은 천천히 우측으로 넘어가는 형태로 수동도 되고 자동도 되고 그건 유저가 선택하도록' → 목업을 보고 '괜찮은것 같아' · '코드에 넣어주고').
   사진 구역(.story)은 띠 길이만큼 길고, 그 안의 한 화면(.pin)이 붙어 있는 동안 내린 만큼 띠(.track)가 왼쪽으로 간다. 자동 = 페이지가 스스로 내려가는 것.
   달 머리(.mh — 달 이름 · 머리 문장)는 그 달이 지나가는 동안 왼쪽에 붙어 있다(스크립트가 민다 — 띠를 transform으로 옮겨서 sticky가 안 먹는다) */
.story { position: relative; }
.pin { position: sticky; top: 0; height: 100vh; overflow: hidden; }
.track { position: relative; display: flex; align-items: flex-start; width: max-content; will-change: transform; }
.month { flex: none; }
.month + .month { margin-left: 56px; padding-left: 56px; border-left: 1px solid var(--border); }
.mh { display: flex; align-items: center; column-gap: 24px; width: max-content; height: 64px; }
.ml { display: flex; flex: none; align-items: baseline; column-gap: 8px; }
.ml b { font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.ml .y { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mt { min-width: 0; }
.mt h3 { margin: 0; font-size: 20px; font-weight: 700; line-height: 28px; white-space: nowrap; }
.said { margin: 0; font-size: 14px; line-height: 22px; color: var(--text2); white-space: nowrap; }
/* 조작부 — 붙은 화면의 오른쪽 위. 바탕을 화면 오른쪽 끝까지 깔아, 다음 달 머리가 오른쪽에서 올 때 이 밑에 가려 있다가 왼쪽 끝에서 나온다(오른쪽 여백은 스크립트가 띠 여백과 맞춘다) */
.ctl { position: absolute; top: 0; right: 0; z-index: 2; display: flex; align-items: center; column-gap: 16px; height: 92px; padding: 16px 40px 12px 24px; background: var(--bg); }
.btn { display: inline-flex; align-items: center; justify-content: center; column-gap: 8px; height: 36px; padding: 0 14px; font-size: 13px; font-weight: 700; line-height: 1; color: var(--text); background: var(--surface2); border: 1px solid var(--border); cursor: pointer; }
.btn:hover, .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.btn svg { display: block; width: 12px; height: 12px; fill: currentColor; }
.spd { display: flex; align-items: center; column-gap: 4px; font-size: 12px; color: var(--muted); }
.spd span { margin-right: 4px; }
.spd .btn { width: 36px; padding: 0; }
#auto { min-width: 88px; }
#auto .i-pause, html.auto #auto .i-play { display: none; }
html.auto #auto .i-pause { display: block; }
.hero-auto { margin-top: 28px; height: 40px; }
/* 배경음악(2026-11-24 Crenop '유튜브 배경음악을 넣었으면 해 음소거 가능하도록 하고' → '그냥 배경음악 음소거랑 볼륨 조절 기능만 있으면 되는데') — 조작은 음소거 단추와 볼륨 막대뿐(.vol).
   유튜브 약관: 플레이어는 200×200 이상으로 페이지에 보여야 하고, 가리거나 숨긴 채 소리만 틀 수 없다 — 그래서 플레이어(.bgm)는 첫 화면의 '자동으로 보기' 아래에 보이게 둔다.
   조작 칸(.vol)은 화면 오른쪽 아래에 늘 떠 있다. 사진 구역에서는 아래 줄(.nav)의 오른쪽 끝 자리와 겹치게 맞췄다(높이 24 · 아래 10 — 아래 줄은 그만큼 짧아진다) */
.bgm { width: 356px; height: 200px; margin-top: 20px; background: var(--surface2); }
.bgm[hidden], .vol[hidden] { display: none; }
.bgm iframe { display: block; }
.vol { position: fixed; right: 40px; bottom: 10px; z-index: 45; display: flex; align-items: center; column-gap: 6px; height: 24px; padding-right: 10px; background: var(--surface2); border: 1px solid var(--border); }
.vol button { display: flex; align-items: center; justify-content: center; width: 26px; height: 22px; padding: 0; color: var(--text2); background: transparent; border: 0; cursor: pointer; }
.vol button:hover, html.snd .vol button { color: var(--accent); }
.vol svg { display: block; width: 14px; height: 14px; fill: currentColor; }
#snd .i-on, html.snd #snd .i-off { display: none; }
html.snd #snd .i-on { display: block; }
.vol input { width: 88px; height: 22px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
.vol input::-webkit-slider-runnable-track { height: 4px; background: var(--border); }
.vol input::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 14px; margin-top: -5px; background: var(--text2); }
.vol input::-moz-range-track { height: 4px; background: var(--border); }
.vol input::-moz-range-thumb { width: 8px; height: 14px; background: var(--text2); border: 0; }
html.snd .vol input::-webkit-slider-thumb { background: var(--accent); }
html.snd .vol input::-moz-range-thumb { background: var(--accent); }
/* 아래 줄 — 왼쪽 끝 '첫 화면'(띠의 앞) · 이동 막대 · 오른쪽 끝 '통계'(띠의 뒤). 이동 막대는 띠 전체를 줄인 것: 칸 = 달(폭은 그 달의 길이만큼), 민트 틀 = 지금 화면에 보이는 구간.
   누르거나 끌면 그 자리로 간다(2026-11-24 Crenop '스크롤바를 두거나 해서 수동으로 원하는 곳으로 이동도 가능하게' · '초기화면과 아래쪽 통계 화면으로 바로 갈수 있는 버튼') */
.nav { position: absolute; left: 40px; right: 40px; bottom: 10px; z-index: 2; display: flex; column-gap: 12px; height: 24px; }
.nav .btn { flex: none; height: 24px; padding: 0 10px; font-size: 12px; }
.bar { position: relative; flex: 1; min-width: 0; display: flex; background: var(--surface); border: 1px solid var(--border); cursor: pointer; touch-action: none; user-select: none; }
.seg { flex: none; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 12px; font-weight: 600; line-height: 1; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none; }
.seg + .seg { border-left: 1px solid var(--border); }
.seg.on { color: var(--text); }
.thumb { position: absolute; top: -1px; bottom: -1px; left: 0; border: 1px solid var(--accent); background: var(--scrub); pointer-events: none; }
/* 사진 칸 — 사이트 컨텐츠 카드와 같은 문법(칸 · 테두리 · 그림 아래 제목과 날짜). 사진은 자르지 않는다(2026-11-15 Crenop).
   그림 아래는 어느 칸이나 이름 · 날짜뿐 — 나온 멤버 얼굴은 뺐다(2026-11-21 Crenop '날짜와 이름만 나오게 통일하자 참여 멤버는 빼는걸로').
   자리와 크기는 layoutStrip이 잡는다(칸 · 그림 모두 px로): 세로로 긴 그림 · 여러 장 칸 · 그 달의 가장 큰 일(.main)은 띠 높이를 다 쓰고, 가로 사진 한 장짜리 칸은 세로로 쌓인다.
   같은 일의 기념 사진은 그 칸 안에 묶는다(2026-11-21 Crenop '기념사진도 활용하면 좋을것같은데 같은거끼리 묶어서') — 칸 안에서 단을 나눠 단마다 폭을 맞춘다(자르지 않는다) */
.tiles { position: relative; margin-top: 12px; }
.tile { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--sh-box); overflow: hidden; transition: border-color 0.15s, box-shadow 0.15s; }
.tile:has(button.pic:hover) { border-color: var(--accent); box-shadow: var(--sh-box), 0 4px 12px var(--content-glow); }
.pics { position: relative; display: block; flex: none; background: var(--surface2); }
.pic { position: absolute; display: block; margin: 0; padding: 0; border: 0; background: var(--surface2); }
button.pic { cursor: zoom-in; }
button.pic:focus-visible { outline-offset: -2px; }   /* 칸이 넘치는 것을 자르므로 테두리를 안쪽에 */
.pic img { display: block; width: 100%; height: 100%; }
.tile.none .pics, .pic.none { background: transparent; }
.pic.none { box-shadow: inset 0 0 0 1px var(--cell-future); }
.info { display: block; min-width: 0; padding: 10px 12px 11px; }
/* 이름은 한 줄 — 칸 높이가 띠 높이에 맞춰져 있어 줄 수가 달라지면 안 된다. 잘린 이름은 그림을 누르면 창 머리에 다 나온다 */
.tt { display: block; font-size: 13px; font-weight: 700; line-height: 18px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { font-style: normal; margin-right: 6px; color: var(--accent); }
.info .d { display: block; margin-top: 4px; font-size: 12px; font-weight: 600; line-height: 18px; color: var(--text2); font-variant-numeric: tabular-nums; }
.main .info { padding: 12px 14px 13px; }
.main .tt { font-size: 15px; line-height: 22px; }

/* 지금까지 */
.together { padding: 120px 0 0; text-align: center; }
.stats { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); column-gap: 12px; margin-top: 12px; }
.sec + .stats { margin-top: 44px; }
.stat { padding: 24px 8px 20px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--sh-box); }
.stat b { display: block; font-size: 36px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat b small { font-size: 0.5em; font-weight: 600; color: var(--text2); margin: 0 1px 0 2px; }
.stat span { display: block; margin-top: 8px; font-size: 13px; color: var(--muted); }

/* 1년 통계 — 맨 위 사이트 명전 통산 1위(사이트 명전 카드 문법: 금 테두리 얼굴 · 멤버 색 이름 · 금색 값), 그 아래 추가 통계 */
.hall { padding: 120px 0 0; }
.hall > .sec { text-align: center; }
.sub { margin: 44px 0 14px; font-size: 17px; font-weight: 700; line-height: 1.4; }
.hgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-top: 44px; }
.hc { display: flex; flex-direction: column; align-items: center; row-gap: 10px; padding: 16px 10px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--sh-box); }
.hc-cat { display: flex; align-items: center; justify-content: center; column-gap: 6px; min-height: 36px; font-size: 13px; line-height: 18px; text-align: center; }
.hc-cat b { font-weight: 700; text-wrap: balance; word-break: keep-all; }
/* 칸 이름 앞 그림 = 사이트 것 그대로(2026-11-21 Crenop '명전에 사이트에서 쓰는 아이콘은 없네'): 명전 12칸은 dl_hall.js가 사이트 화면에서 읽은 그림과 색(var(--이름) — 같은 이름의 토큰이 :root에 있다),
   더한 칸과 분야는 묶을 때 사이트 아이콘 표에서 읽은 그림. 크기 15px는 사이트 명전의 것 */
.hc-ic { display: flex; flex: none; color: var(--text2); }
.hc-ic svg { display: block; width: 15px; height: 15px; }
/* 공동 1등도 얼굴 크기는 혼자일 때와 같다(2026-11-21 Crenop '공동1등 크기가 줄어드는데 1명일때랑 크기 같아도 될것같애') — 한 줄에 안 들어가면 다음 줄로 */
.hc-w { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center; gap: 8px 10px; min-height: 88px; }
.hc-p { display: flex; flex-direction: column; align-items: center; row-gap: 6px; }
.hc-p img { display: block; width: 64px; height: 64px; object-fit: cover; border: 2px solid var(--medal-gold); background: var(--surface2); }
.hc-p b { font-size: 13px; font-weight: 700; line-height: 18px; }
.hc-val { font-size: 13px; font-weight: 700; line-height: 18px; color: var(--medal-gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hc-sub { min-height: 16px; margin-top: -4px; font-size: 12px; line-height: 16px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }   /* 아랫줄: 2위와의 차이 · 기간 */
/* 분야별 활약 — 명전 칸과 같은 세로 차례(분야 · 얼굴 · 이름 · 횟수)를 한 칸 안에 가로로 아홉(2026-11-21 Crenop '명전이랑 비슷하게 수직배치 수평나열'). 공동 1등인 단은 그 수만큼 넓혀(flex-grow) 얼굴을 옆으로 놓는다 — 아래로 쌓으면 그 단만 길어져 다른 단 아래가 빈다 */
.kds { display: flex; padding: 16px 0; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--sh-box); }

function renderYear() {
  let h = '';
  for (const ym of GRID) {
    const y = +ym.slice(0, 4), m = +ym.slice(5, 7), last = new Date(Date.UTC(y, m, 0)).getUTCDate();
    let cells = '';

      const s = String(y).slice(2) + String(m).padStart(2, '0') + String(d).padStart(2, '0'), i = idxOf(s);
      if (i < 0 || i > BDAY) continue;
      // 잔디 = 그날 방송을 시작한 멤버 ÷ 그날의 총원(체비·플리 전 10명 → 12명 → 빙밍 뒤 13명). 사이트 컨텐츠는 크루 컨텐츠뿐이라 다른 날의 활동이 안 보였다(2026-11-15 Crenop).
      //   모두 방송한 날이 가장 밝다 — 처음엔 명수로 칠해 10명 시절에 10명 모두 방송한 날이 가장 밝지 않았다(같은 날 Crenop).
      const list = C.filter(c => c.i === i), n = (DATA.days[s] || []).length, cls = ['cell'];
      const roster = rosterOn(s), r = n / roster;
      if (i > TODAY) cls.push('fut');
      else if (n) cls.push('g' + (r >= 1 ? 4 : r >= 0.75 ? 3 : r >= 0.5 ? 2 : 1));
      if (i === BDAY) cls.push('bday');
      const tip = md(s) + (i <= TODAY ? ` · 방송 ${n} / ${roster}명` : '') + (list.length ? ' · ' + list.map(c => c.t).join(' / ') : '');
      cells += `<i class="${cls.join(' ')}" style="grid-column:${d + 1}" title="${esc(tip)}"></i>`;
    }

    h += `<div class="row"><a class="lab" href="#m${ym}">${ym.slice(2, 4)}.${ym.slice(5, 7)}</a>${note}${cells}</div>`;

}

function topOf(vals) { const s = [...new Set(vals.filter(v => v > 0))].sort((a, b) => b - a); return s.length ? [vals.map((v, i) => (v === s[0] ? i : -1)).filter(i => i >= 0), s[0], s.length > 1 ? s[1] : null] : null; }

//   연속 방송 일수 = 그 기간 · 단일 방송 시간 = 그 방송의 날짜(둘 다 방송 기록에서 다시 찾아, 사이트 값과 길이가 맞을 때만) · 그 밖 = 2위와의 차이(사이트의 2위 값에서)
const hallNum = v => { const t = /(\d+)시간 (\d+)분/.exec(v); return t ? { n: +t[1] * 60 + +t[2], time: true } : { n: parseInt(v), unit: String(v).replace(/^[\d\s]+/, '') }; };
function streakOf(i) {   // 멤버 i의 가장 긴 연속 방송: [일수, 첫날, 끝날]
  let best = [0, '', ''], run = 0, st = '';

function hallSub(c, ids) {

}

  if (pal) cards.push(hc(hcIcon(ui.people), '가장 자주 함께한 둘', pal.ids, Math.round(pal.r * 100) + '%', `${pal.t} / ${pal.u}번`));
  if (duo.length) cards.push(hc(hcIcon(ui.chatBubble, 'var(--ev-chat)'), '채팅을 가장 많이 나눈 둘', duo[0].ids, duo[0].n + '회', gap(duo[0].n, duo[1] ? duo[1].n : null, '회')));
  // 분야별 활약: 분야(종류)마다 그 종류의 컨텐츠·현수막에 가장 많이 나온 멤버만(같으면 모두 — 그 단을 넓혀 옆으로). 2026-11-21 Crenop '각 분야별 1등만' · '명전이랑 비슷하게 수직배치 수평나열'
  const both = cs.concat(bs);
  const kds = KINDS.map(k => { const t = topOf(all.map(i => both.filter(x => x.m.includes(i) && x.ks.includes(k)).length)), ic = DATA.icons[k]; if (!t) return '';
    return `<div class="kdc"${t[0].length > 1 ? ` style="flex-grow:${t[0].length}"` : ''}><div class="hc-cat">${ic ? hcIcon(ic[1], '', ic[0]) : ''}<b>${k}</b></div>${hcFaces(t[0])}<div class="hc-val">${t[1]}회</div></div>`; }).join('');
  document.getElementById('hall').innerHTML = '<h2 class="sec">1년 통계</h2>'
    + `<div class="hgrid fx">${cards.join('')}</div>`   // 열여덟 칸 위의 작은 제목('명전 통산 1위')은 뺐다(2026-11-21 Crenop '제목 빼고' — 뒤 여섯 칸은 사이트 명전이 아니다)
    + `<h3 class="sub">분야별 활약</h3><div class="kds fx">${kds}</div>`;
}

// 사진 크게 보기: 그림(data-ph)을 누르면 창. ← → 로 앞뒤 사진, 닫기 = ✕ · 바깥 누르기 · Esc · 뒤로 가기(창을 열 때 방문 기록 한 칸).
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbBody = document.getElementById('lbBody');
let lbAt = -1, lbFrom = null;
function lbShow(k) {
  lbAt = (k + PH.length) % PH.length;
  const p = PH[lbAt], z = DATA.sizes[p.src] || [1200, 800], r = z[1] / z[0];
  // 화면에 다 들어오게 맞춘다. 그러면 폭이 560보다 좁아지는 긴 그림은 폭 760까지 키우고 창 안에서 내려 본다.
  const availH = innerHeight - 48 - 54, availW = Math.min(1400, innerWidth - 176);
  let w = Math.min(z[0], availW, availH / r);
  if (r > 1.6 && w < 560) w = Math.min(z[0], 760, availW);
  lbImg.removeAttribute('src');   // 앞 사진이 새 크기로 늘어나 보이지 않게
  lbImg.width = Math.round(w); lbImg.height = Math.round(w * r); lbImg.style.width = Math.round(w) + 'px';
  lbImg.src = SITE + p.src; lbImg.alt = p.t;
  lbBody.style.maxHeight = availH + 'px'; lbBody.scrollTop = 0;
  document.getElementById('lbD').textContent = md(p.d);
  document.getElementById('lbT').textContent = p.t;
  document.getElementById('lbN').textContent = (lbAt + 1) + ' / ' + PH.length;
}
function lbOpen(k, from) {
  lbFrom = from; lbShow(k); lb.hidden = false; document.documentElement.classList.add('lock');
  history.pushState({ lb: 1 }, ''); document.getElementById('lbX').focus();
}
function lbHide() { if (lb.hidden) return; lb.hidden = true; document.documentElement.classList.remove('lock'); lbImg.removeAttribute('src'); if (lbFrom) lbFrom.focus({ preventScroll: true }); lbFrom = null; }
const lbClose = () => { if (!lb.hidden) history.back(); };   // 방문 기록 한 칸을 되돌리면 popstate가 창을 닫는다
addEventListener('popstate', lbHide);
document.getElementById('story').addEventListener('click', e => { const t = e.target.closest('[data-ph]'); if (t) lbOpen(+t.dataset.ph, t); });
lb.addEventListener('click', e => { if (e.target === lb) lbClose(); });
document.getElementById('lbX').addEventListener('click', lbClose);
document.getElementById('lbPrev').addEventListener('click', () => lbShow(lbAt - 1));
document.getElementById('lbNext').addEventListener('click', () => lbShow(lbAt + 1));
addEventListener('keydown', e => { if (lb.hidden) return;
  if (e.key === 'Escape') lbClose(); else if (e.key === 'ArrowLeft') lbShow(lbAt - 1); else if (e.key === 'ArrowRight') lbShow(lbAt + 1); });

// 나타나기
const still = /[?&]still\b/.test(location.search) || matchMedia('(prefers-reduced-motion: reduce)').matches;
if (still) document.documentElement.classList.add('still');
const io = !still && 'IntersectionObserver' in window
  ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -12% 0px' })
  : null;

renderToday();
renderYear();
renderStory();
renderTogether();
renderHall();
renderEnd();
// 띠는 화면 크기가 바뀌면 · 글꼴이 늦게 읽혀 글 폭이 바뀌면 다시 자리 잡는다
if ('ResizeObserver' in window) { let was = pin.clientWidth + 'x' + pin.clientHeight;
  new ResizeObserver(() => { const now = pin.clientWidth + 'x' + pin.clientHeight; if (now !== was) { was = now; layoutStrip(); sync(); } }).observe(pin); }
if (document.fonts) document.fonts.ready.then(() => { layoutStrip(); sync(); });
addEventListener('scroll', () => { if (!auto) sync(); }, { passive: true });
document.getElementById('auto').addEventListener('click', toggleAuto);
document.getElementById('heroAuto').addEventListener('click', toggleAuto);
document.getElementById('spd').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return;
  speed = +b.dataset.v; document.querySelectorAll('#spd [data-v]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
// 잔디의 달 이름 → 그 달이 띠의 왼쪽에 오는 자리로
document.getElementById('year').addEventListener('click', e => { const a = e.target.closest('a.lab'), o = a && MS.find(o => '#' + o.m.id === a.getAttribute('href')); if (!o) return;
  e.preventDefault(); jump(storyTop + Math.min(travel, o.L - pad)); });
// 사진 구역에서 첫 화면 · 통계로(통계 = 띠 바로 아래 '지금까지'부터 — 작은 제목이 위에서 48px에 오게)
document.getElementById('toTop').addEventListener('click', () => jump(0));
document.getElementById('toStats').addEventListener('click', () => jump(document.getElementById('together').offsetTop + 72));
// 이동 막대: 민트 틀을 잡으면 잡은 자리 그대로 끌고, 틀 밖을 누르면 틀 가운데가 그 자리로 온 뒤 끌린다
bar.addEventListener('pointerdown', e => {
  if (e.button || barW <= thumbW) return;
  e.preventDefault();
  const x0 = bar.getBoundingClientRect().left + bar.clientLeft, at = travel ? sx / travel * (barW - thumbW) : 0, px = e.clientX - x0;
  const off = px >= at && px <= at + thumbW ? px - at : thumbW / 2;
  const move = ev => jump(storyTop + Math.min(Math.max((ev.clientX - x0 - off) / (barW - thumbW), 0), 1) * travel);
  move(e); bar.setPointerCapture(e.pointerId);
  bar.onpointermove = move; bar.onlostpointercapture = () => { bar.onpointermove = null; };
});
// 적어 둔 크기와 실제 그림의 비율이 다르면(사이트가 같은 이름으로 그림을 바꿈 — 2026-11-24 content/261125.webp) 실제 비율로 다시 자리 잡는다. 띠는 가로 · 세로를 다 정해 놓아서, 그대로 두면 그림이 찌그러진다
let fixT = 0;
track.addEventListener('load', e => { const i = e.target, b = i.parentElement; if (i.tagName !== 'IMG' || !i.naturalWidth || !b.dataset.a) return;
  const a = i.naturalWidth / i.naturalHeight; if (Math.abs(a / b.dataset.a - 1) <= 0.01) return;
  b.dataset.a = a.toFixed(4); clearTimeout(fixT); fixT = setTimeout(() => { layoutStrip(); sync(); }, 50); }, true);
document.querySelectorAll('.fx').forEach(el => io ? io.observe(el) : el.classList.add('in'));
</script>
</body>
