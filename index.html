<!-- Pretendard Variable: 다이내믹 서브셋(화면에 쓰인 글자의 woff2만 로드) — 기기별 시스템 한글폰트 메트릭 차이(배지 세로정렬 등) 제거 목적. CDN 장애 시 아래 스택의 시스템 폰트로 폴백(font-display: swap). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root {
    --tag-valign: -6px;      /* 타임라인 모드 배지(19px SVG) 줄 정렬 — 배지 박스 중심을 제목(400·12px) 잉크 중심에. calibrateBadgeValign() 실측 주입, 폴백은 정적 근사 */
    --daytag-valign: -5.5px; /* 통계 일별 모드 배지 줄 정렬 — 제목(600·13px) 문맥. 상동 */
    --bg: #070a14;
    --surface: #0d1120;
    --surface2: #131929;
    --border: #1e2740;
    --live: #ff3b3b;
    --live-glow: rgba(255,59,59,0.25);
    --accent: #61FFEC;
    --accent2: #61FFEC;
    --text: #e2e8f0;
    --muted: #64748b;
    --rk-in: #34d399;    /* 좋아요 순위 — 컷 위(안정권) */
    --rk-out: #f87171;
    --rk-cut: #fb923c;              /* 컷 경계 — 탈락(빨강)과 구분되는 주황. '기준선'이지 '결과'가 아니므로 색을 나눈다 */
    --rk-cut-line: rgba(251,146,60,0.5);     /* 경계선은 글자보다 옅게 — 값이 아니라 기준선이라는 신호 */   /* 좋아요 순위 — 컷 아래. 모달 배경(#0d1120) 대비 6.79로 묻히지 않는 빨강(사이트 빨간점과 동일 색) */
    --time: #fbbf24;
    --ev-start: #60a5fa;
    --ev-end: #f87171;
    --ev-yellow: #fbbf24;
    --ev-post: #34d399;
    --ev-youtube: #ef4444;
    --ev-unread: #61FFEC;
    --mode-adult: #f87171;
    --mode-subscription: #f59e0b;
    --mode-copyright: #38bdf8;
    --mode-password: #cbd5e1;
    --mode-restricted: #a78bfa;
    --filter-post: #2EF5E1;
    --sidebar-w: 200px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 전역 미니멀 스크롤바 (초미니 6px·거의 안 보이다 hover 시 진해짐). webkit=Edge/Chrome/Safari, scrollbar-*=Firefox */
  * { scrollbar-width: thin; scrollbar-color: rgba(226,232,240,0.14) transparent; }
  *::-webkit-scrollbar { width: 6px; height: 6px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: rgba(226,232,240,0.14); }   /* 각진 정책 정합: 썸도 사각(원형은 상태 점에만 허용) */
  *::-webkit-scrollbar-thumb:hover { background: rgba(226,232,240,0.3); }
  html, body { min-height: 100vh; }
  html { scrollbar-gutter: stable; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard Variable', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    min-height: 100vh;
    /* 어절 단위 줄바꿈(2026-08-06 전역화). 한글 기본값은 음절 단위로 끊겨 '…함께하실 분 / 을 구합니다'처럼
       낱말이 쪼개진다. 그동안 .hall-r-name·.members-crew-intro 등 5곳에 개별로 붙여 왔는데, 새 화면을
       만들 때마다 빠뜨렸다(좋아요 요청 카드가 그 예) — 상속되는 속성이니 뿌리에서 한 번 건다.
       overflow-wrap을 같이 두는 이유: keep-all만 걸면 컨테이너보다 긴 낱말(URL·긴 영문)이 통째로 삐져나간다.
       기존 개별 선언은 특이도가 높아 그대로 유효하다 — 반대 의도인 word-break: break-all(2줄 클램프 제목)도 안 덮인다. */
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 35%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(2px 2px at 15% 50%, rgba(97,255,236,0.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    z-index: 2;
    flex-shrink: 0;
  }
  .sidebar-logo {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    text-align: center;
    min-height: 68px;   /* main-header와 동일 값으로 결속(2026-08-10 유격 수정) — 버튼 여백 개편(08-09)으로 상단바 자연 높이가 67.8px(버튼 42.8+패딩 24+테두리 1)이 되며 66 고정이던 이 칸과 어긋났다. 양쪽 68 클램프로 경계선 재정렬. 버튼 높이 규칙 변경 시 두 값을 같이 재계산할 것 */
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sidebar-logo img { max-width: 100%; max-height: 32px; height: auto; display: block; cursor: pointer; }
  .nav-list { padding: 8px 0; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 20px; color: var(--muted);
    cursor: pointer; font-size: 14px; font-weight: 600;
    border: none; background: none; text-align: left;
    width: 100%; font-family: inherit;
    border-left: 3px solid transparent;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
    position: relative;
  }
  .nav-item:hover { color: var(--text); background: var(--surface2); }
  .nav-item.active { color: var(--accent2); background: var(--surface2); border-left-color: var(--accent); }
  .nav-icon {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    vertical-align: middle;
  }
  .nav-icon svg { width: 16px; height: 16px; display: block; vertical-align: middle; }
  .nav-events-label { position: relative; display: inline-flex; align-items: center; }
  /* 안읽음 숫자 배지: SVG 도형 렌더(2026-07-13) — 박스(rect)와 숫자(패스)가 한 좌표계의 기하라 배율 무관 정중앙.
     폰트 텍스트는 글리프 힌팅이 ppem마다 착지를 ±1px 스냅(배율 따라 반전 실측 — geometricPrecision 실험도 무효)해 어떤 보정으로도 불가했음.
     크기 문법(높이14=구 lh12+상하패딩2 · min-width16 · 좌우패딩5 · 숫자 10px 상당)은 navBadgeSvg()가 동일 유지. */
  .nav-badge {
    position: absolute;
    top: -6px; right: -10px;   /* 라벨 우상단 위로(superscript) — 흐름을 차지하지 않아 라벨이 밀리거나 줄바꿈되지 않음 */
  }
  .nav-badge svg { display: block; }
  .nav-badge rect { fill: var(--ev-unread); }
  .nav-badge path { fill: var(--bg); }
  .nav-live-badge {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    background: var(--surface2);
    min-height: 17px;   /* 구 높이 앵커 — 텍스트 라인박스(11px×lh normal≈13)+패딩4가 만들던 17px을, 숫자가 SVG(≈8px)로 바뀌며 명시값으로 대체 */
    color: var(--muted);
    transition: color 0.15s;
  }
  /* 카운트 숫자 = SVG 도형(nav-badge와 동일 사유). SVG 박스=숫자 잉크 경계라 flex 중앙정렬이 곧 잉크 중앙정렬. 색은 currentColor로 on/off 상태 상속 */
  .nav-live-count svg { display: block; }
  .nav-live-count path { fill: currentColor; }
  .nav-live-dot {
    width: 7px;
    height: 7px;
    background: var(--muted);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .nav-live-badge.on {
    color: var(--text);
    background: rgba(255,59,59,0.12);
  }
  .nav-live-badge.on .nav-live-dot {
    background: var(--live);
    box-shadow: 0 0 6px var(--live-glow);
    animation: pulse 1.8s ease-in-out infinite;
  }

  .nav-notify-bell {
    margin-left: auto;            /* events 행 우측 끝으로 */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--muted);         /* 무채색 = 알림 꺼짐 */
    cursor: pointer;
    transition: color 0.15s;
  }
  .nav-notify-bell svg { width: 20px; height: 20px; display: block; overflow: visible; }
  /* ON/OFF를 색(앰버↔무채)·모양(웨이브 선 유무)으로 구별 + 켤 때 1회 애니메이션 */
  .nav-notify-bell .ring-wave { opacity: 0; }                   /* OFF: 양옆 웨이브 선 숨김 (모양 단서) */
  .nav-notify-bell.on { color: #fbbf24; }                       /* ON: 앰버색 (색 단서, 민트 아닌 별도색) */
  .nav-notify-bell.on .ring-wave { opacity: 1; }                /* ON 정지: 양옆 웨이브 선 정적 표시 (currentColor=앰버) */
  .nav-notify-bell:not(.on):hover { color: var(--text); }
  /* 클릭으로 켤 때 1회만 (.ringing은 JS가 붙였다 뗌) — 상시 흔들리지 않음 */
  .nav-notify-bell.ringing svg { transform-origin: 50% 12%; animation: bell-ring 0.9s ease-in-out; }
  .nav-notify-bell.ringing .ring-wave { animation: ring-wave-flash 0.9s ease-out; }
  @keyframes bell-ring {
    0%   { transform: rotate(0); }
    15%  { transform: rotate(17deg); }
    30%  { transform: rotate(-15deg); }
    45%  { transform: rotate(11deg); }
    60%  { transform: rotate(-7deg); }
    75%  { transform: rotate(4deg); }
    88%  { transform: rotate(-2deg); }
    100% { transform: rotate(0); }
  }
  @keyframes ring-wave-flash {
    0%   { opacity: 0; }
    20%  { opacity: 1; }
    60%  { opacity: 0.8; }
    100% { opacity: 1; }                                        /* ON 정지값(1)으로 안착 — 끝에서 사라졌다 튀지 않게 */
  }
  @media (prefers-reduced-motion: reduce) {
    .nav-notify-bell.ringing svg, .nav-notify-bell.ringing .ring-wave { animation: none; }
  }
  .notify-switch {
    position: relative;
    width: 36px;
    height: 20px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
    padding: 0;
    box-sizing: border-box;
  }
  .notify-switch::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    background: var(--muted);
    top: 50%;
    left: 2px;
    transform: translateY(-50%);
    transition: transform 0.18s, left 0.18s, background 0.18s;
  }
  .notify-switch.on { border-color: var(--accent); }
  .notify-switch.on::after { left: 19px; transform: translateY(-50%); background: var(--accent); }

  .main {
    flex: 1; min-width: 0;
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
  }
  .main-header {
    /* 간격 일원화(2026-08-09): 상하·좌우 경계-버튼, 요소 사이 전부 12px.
       세로 12는 padding으로 선언 — 버튼(≈43px)+상하 24로 자연 높이 ≈67이 구 min-height(66)를 넘어 padding이 간격을 지배했다.
       min-height 68(2026-08-10): 자연 높이 67.8을 다시 덮는 값 — 탭별 높이 통일 안전망 복원 + sidebar-logo(동일 68)와 경계선 정렬. 모바일(≤700px)은 별도 체계. */
    padding: 12px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(97,255,236,0.05) 0%, transparent 100%);
    display: flex; align-items: center; gap: 12px;
    min-height: 68px;
  }
  .page-title {
    flex-shrink: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;   /* 간격 일원화(2026-08-09): 버튼 사이도 경계 간격과 같은 12px */
    flex-wrap: wrap;
  }
    /* 아래 여백 보정: 한글은 폰트 descent 공간을 안 쓰는데 라인박스는 그대로 잡는다 →
       위·아래 padding을 같게 두면 아래가 더 넓어 보인다(2026-08-05 스크린샷 실측: 위 14px vs 아래 18~20px ≒ 2.4 CSS px 차).
       아래만 2px 줄여 광학적으로 맞춘다. 모바일(세로 배치)은 별도 규칙이라 여기 영향을 받지 않는다. */
  .page-title-link {
    display: flex;
    align-items: center;
    gap: 10px;   /* 내부 간격 일원화(2026-08-09 비교 확정): 좌경계~아이콘~텍스트~우경계 전부 10px. 바 레벨(경계·버튼 사이)은 12px 별도. 모바일은 세로 미니 별도 규칙 */
    padding: 6px 10px 4px;
    background: rgba(96,165,250,0.12);
    border: 1px solid rgba(96,165,250,0.4);
    color: #93c5fd;
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
    transition: background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .page-title-link:hover { background: rgba(96,165,250,0.22); border-color: rgba(96,165,250,0.7); }
  /* margin-top -2px: 위 6/아래 4 비대칭 패딩(한글 텍스트 광학 보정)이 콘텐츠 중심을 테두리 중심보다 1px 내리는데,
     아이콘까지 딸려 내려가 위 여백이 2px 더 넓어진다 — 아이콘만 상쇄해 테두리 기준 정중앙(텍스트 보정은 유지). 모바일은 패딩 대칭이라 리셋 */
  .page-title-link svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: -2px; }
  /* 가이드 버튼 아이콘 래퍼(JS 주입 대상): 투명화해 svg가 다른 버튼처럼 직접 flex 아이템이 되게 —
     span 인라인 배치는 svg 아래에 폰트 descent(~4px)를 붙여 물음표가 ~2px 위로 뜬다(아래 여백만 커지던 원인) */
  #guideIcon { display: contents; }
  /* 좋아요 요청 모아보기 버튼: page-title-link 골격에 comment_recommend 색(에메랄드, --ev-post 계열) 적용 */
  button.page-title-link.like-req-btn {
    background: rgba(52,211,153,0.12);
    border: 1px solid rgba(52,211,153,0.4);
    color: #6ee7b7;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    position: relative;
  }
  button.page-title-link.like-req-btn:hover { background: rgba(52,211,153,0.22); border-color: rgba(52,211,153,0.7); }
  /* 안 본 새 좋아요 요청이 있으면 버튼 우상단 빨간 점 */
  .like-req-btn.has-new::after {
    content: ''; position: absolute; top: -3px; right: -3px;
    width: 9px; height: 9px; border-radius: 50%;
    background: #f87171; box-shadow: 0 0 0 1.5px var(--bg);
  }
  /* 일정 버튼: 천타버스 메인 민트(--accent) 박스 — 좋아요(에메랄드)·블루발(파랑)과 색으로 구분 */
  button.page-title-link.sch-btn {
    background: rgba(97,255,236,0.12);
    border: 1px solid rgba(97,255,236,0.4);
    color: var(--accent);
    cursor: pointer;
    font-family: inherit;
    text-align: left;
  }
  button.page-title-link.sch-btn:hover { background: rgba(97,255,236,0.22); border-color: rgba(97,255,236,0.7); }
  /* 두번째 커버곡 버튼: 핑크(#ec4899 계열) — 첫 커버곡(파랑)·좋아요(에메랄드)·일정(민트)과 구분 */
  /* 시트 기반 상단바 버튼(구 cover2-btn 대체): 색은 F열 hex → --tb-rgb 인라인 변수, 배경 12%·테두리 40%·호버 22%/70% */
  .page-title-link.tb-sheet-btn {
    background: rgba(var(--tb-rgb), 0.12);
    border: 1px solid rgba(var(--tb-rgb), 0.4);
  }
  .page-title-link.tb-sheet-btn:hover { background: rgba(var(--tb-rgb), 0.22); border-color: rgba(var(--tb-rgb), 0.7); }
  .lr-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.65);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .lr-overlay[hidden] { display: none; }
  .lr-panel {
    background: var(--surface);
    border: 1px solid rgba(52,211,153,0.4);
    width: 100%; max-width: 560px;
    max-height: 80vh;
    display: flex; flex-direction: column;
  }
  .lr-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px; font-weight: 700; color: var(--ev-post);
  }
  .lr-head > span:first-child { display: inline-flex; align-items: center; gap: 6px; }
  .lr-head svg { width: 15px; height: 15px; display: block; }
  .lr-close {
    background: none; border: none; color: var(--muted);
    font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 6px;
  }
  .lr-close:hover { color: var(--text); }
  .lr-body { overflow-y: auto; }
  .lr-msg { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 12px; }
  /* 좋아요 순위 모달 — lr-panel 골격 재사용. 행은 grid로 열을 고정(flex는 값 길이에 따라 열이 흔들려 눈금이 안 맞음) */
  .rk-ev { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .rk-ev:last-child { border-bottom: none; }
  /* 제목 + 컷라인 한 줄. 좁은 폭에서만 컷이 다음 줄로 접힘 */
  .rk-ev-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .rk-ev-title { font-size: 12px; font-weight: 700; color: var(--text); }
  .rk-ev-sub { font-size: 11px; color: var(--muted); }
  /* 열 폭 고정. 이름 칸을 1fr로 두면 남는 폭을 이름이 다 먹어 전형이 멀리 밀려난다(2026-08-04 지적) →
     좌측(사진·이름·전형)은 붙이고, 남는 폭은 숫자 블록 사이로 보낸다. 전형 없는 대회는 열 자체를 뺀다. */
  /* 좌측(사진·이름·전형)은 고정폭으로 붙이고, 남는 폭은 숫자 3열이 균등하게 나눠 갖는다.
     이전엔 1fr이 좋아요 칸 하나에 몰려 순위-좋아요 사이만 벌어지고 컷은 붙어 보였다(2026-08-04 지적). */
  .rk-row {
    display: grid;
    grid-template-columns: 28px 60px 32px 1fr 1fr 1.1fr;   /* 사진 이름 전형 | 순위 좋아요 컷차이 */
    align-items: center; gap: 6px; padding: 3px 0; font-size: 12px;
  }
  .rk-ev.no-group .rk-row { grid-template-columns: 28px 60px 1fr 1fr 1.1fr; }
  .rk-av { width: 28px; height: 28px; object-fit: cover; }
  .rk-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 댓글 바로가기: 행 전체가 링크. 호버 표시는 글씨색이 아니라 민트 테두리(2026-08-05 Crenop) —
     이름색은 멤버 정체성이라 호버가 갈아치우지 않는다. 외부링크 아이콘도 넣지 않는다(열 폭 고정 → 이름 칸이 잘림).
     [2026-08-05 재수정] 처음엔 box-shadow + border-radius:4px로 그렸는데 사이트에서 유일한 둥근 모서리였고,
     그림자 spread는 모서리가 뭉툭하고 번져 보인다. 사이트의 다른 테두리 40곳과 같은 border 1px solid로 통일한다.
     레이아웃 밀림은 '항상 투명 테두리 + padding으로 상쇄'로 막는다(호버 때 새로 생기는 두께가 없다):
       세로 border 1 + padding 2 = div 행의 padding 3  · 가로 border 1 + padding 5 = margin 상쇄값 6
     → 링크 행과 일반 행의 칸 위치·행 높이가 완전히 같고, 테두리만 좌우로 6px 넉넉하게 둘린다.
     color:inherit이 필요한 이유 — .rk-like/.rk-gap은 지정색이 없어 a의 기본 링크색을 물려받는다. */
  a.rk-row { text-decoration: none; color: inherit; border: 1px solid transparent; padding: 2px 5px; margin: 0 -6px; }
  a.rk-row:hover { border-color: var(--accent); }
  .rk-grp { color: var(--muted); font-size: 11px; }
  .rk-rank, .rk-like, .rk-gap { font-variant-numeric: tabular-nums; text-align: right; }
  /* 순위·컷은 대회 색을 따르지 않는다 — '안정권이냐 탈락권이냐'가 한눈에 보여야 하므로 고정 의미색을 쓴다.
     대회 색(--rk-c)은 정체성 표시(테두리·헤더·제목)에만 쓴다. 둘을 섞으면 색이 두 가지 뜻을 갖게 된다. */
  .rk-rank { font-weight: 700; color: var(--text); }
  .rk-row.in .rk-rank, .rk-row.in .rk-gap { color: var(--rk-in); }
  .rk-row.out .rk-rank, .rk-row.out .rk-gap { color: var(--rk-out); }
  .rk-ev-title { color: var(--rk-c, var(--text)); }
  .rk-head-right { display: inline-flex; align-items: center; gap: 10px; }
  .rk-refresh { font-size: 10px; font-weight: 400; color: var(--muted); white-space: nowrap; }
  /* 순위 모달일 때만 패널 테두리·헤더가 대회 색을 따른다(좋아요 요청·일정 모달은 기존 에메랄드 유지) */
  /* 테두리는 다른 모달과 같은 40% 강도로 — 원색 100%는 화면을 압도한다(2026-08-04 지적).
     헤더 밑줄은 기본 --border 유지(색이 두 겹으로 겹치면 과해짐). 대회 색은 아이콘·제목 글자에만 남긴다. */
  .lr-panel.rk-modal { border-color: rgba(var(--rk-rgb, 52,211,153), 0.4); }
  .lr-panel.rk-modal .lr-head { color: var(--rk-c, var(--ev-post)); }
  .rk-like { color: var(--text); }
  .rk-gap { font-size: 11px; }
  /* 컷 경계 행 — 좋아요 내림차순 목록에서 그 전형의 컷 값이 놓일 자리에 끼워 넣는다.
     전형마다 컷이 다르므로 경계선 하나로는 표현할 수 없다(남자 1,424 / 여자 2,239) → 전형별로 각자의 자리에 한 줄씩.
     높이·글씨 크기는 멤버 행과 동일하게 맞춘다(2026-08-04 지적) — 눈금이 어긋나면 표로 안 읽힌다. */
  .rk-cut-row { min-height: 34px; position: relative; color: var(--rk-cut); }   /* 34px = 아바타 28 + 상하 여백 6 */
  .rk-cut-row::before {   /* 행 전체를 가로지르는 경계선. 글자 칸이 배경색으로 선을 끊어 라벨이 선 위에 놓인 것처럼 보인다 */
    content: ''; position: absolute; left: 0; right: 0; top: 50%;
    border-top: 1px dashed var(--rk-cut-line);
  }
  /* 좌우 여백 -3px/+3px: 인접한 글자 칸의 배경이 6px 그리드 간격에서 정확히 맞닿아 선이 끊긴다.
     (이전엔 칸 사이로 선 토막이 비쳐 "붙었다 떨어졌다" 하는 간격이 생겼다 — 2026-08-04 지적) */
  /* 배경이 칸 전체가 아니라 글자만 감싸게 한다(justify-self로 폭=글자). 그러면 칸의 남는 공간으로 선이 지나가
     "글씨 사이에 선"이 되고, 좌우 여백도 8px로 넉넉해진다. margin -8px은 padding을 상쇄해 글자 위치를 그대로 둔다
     (안 하면 우측정렬이 8px 밀려 위아래 숫자와 축이 어긋난다). 2026-08-04 지적 반영. */
  .rk-cut-row > span { position: relative; background: var(--surface); padding: 0 8px; margin: 0 -8px; }
  /* 멤버 행과 같은 클래스·같은 열을 쓴다 → 전형은 전형 칸에, "33위"는 등수 칸에, 수치는 좋아요 칸에 자동 정렬 */
  .rk-cut-row .rk-grp { grid-column: 3; justify-self: start; }
  .rk-cut-row .rk-rank { grid-column: 4; justify-self: end; }
  .rk-cut-row .rk-like { grid-column: 5; justify-self: end; }
  .rk-ev.no-group .rk-cut-row .rk-rank { grid-column: 3; }
  .rk-ev.no-group .rk-cut-row .rk-like { grid-column: 4; }
  /* 색은 등수에만. 멤버 행도 색이 들어가는 곳은 등수·컷차이 두 군데뿐이고, 전형은 회색·좋아요는 흰색이다.
     컷값을 흰색으로 두면 위아래 좋아요 숫자와 같은 축이 되어 바로 비교된다(이 행의 본래 목적).
     컷 행에서 색이 들어가는 두 번째 자리는 경계선이 맡는다 — 멤버 행의 컷차이에 대응. */
  .rk-cut-row .rk-rank { color: var(--rk-cut); }
  .rk-in { color: var(--rk-in); }
  .rk-out { color: var(--rk-out); }
  .rk-note { font-size: 11px; color: var(--muted); padding: 4px 0 0; }
  /* 순위 버튼: 색은 시트 G열 hex(tb-sheet-btn과 동일 방식). button은 기본 가운데정렬이라 text-align 명시 필요 */
  button.page-title-link.rank-btn { cursor: pointer; font-family: inherit; text-align: left; }
  /* 좋아요 요청 모달 v2(2026-08-10 전면 개편): 같은 글끼리 묶어 [컨텐츠 헤더]+[요청 행]으로 표시.
     이벤트 탭 카드(renderEvent)를 안 쓰는 이유: 탭은 이벤트가 섞여 있어 요청 하나에 전체 정보가 필요하지만,
     모달은 요청만 모이므로 컨텐츠 정보를 헤더로 병합 — 행마다 반복되던 대상 태그와 과확보 높이(구 min-height 60)를 없앤다. */
  .lrg-head {
    display: flex; align-items: center;
    padding: 10px 16px 10px 14px;          /* 1줄 고정: 줄높이 17 + 상하 10 + 테두리 2 = 39px 균일 */
    border-left: 4px solid transparent;    /* 행의 신규 표시 자리(4px)와 좌변 통일 — 헤더·행 글 시작점 = 18px 일치 */
    background: var(--surface2);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    font-size: 12px; font-weight: 700; color: #cbd5e1;
  }
  .lrg-head:first-child { border-top: none; }   /* 첫 묶음은 모달 헤더 밑선과 겹선 방지 */
  .lrg-head-txt { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 17px; color: inherit; text-decoration: none; }   /* 1줄 말줄임(구 2줄 클램프 폐지 — 2026-08-10 확정) */
  a.lrg-head-txt:hover { color: var(--accent); }
  .lrq-row {
    position: relative;
    border-left: 4px solid transparent;    /* 신규(안읽음) 표시 자리 — 이벤트 탭 .event.unread와 동일 방식 */
  }
  .lrq-row + .lrq-row { border-top: 1px solid rgba(30,39,64,0.5); }
  .lrq-row:hover { background: var(--surface2); }
  .lrq-row.unread { border-left-color: var(--ev-unread); background: rgba(97, 255, 236, 0.10); box-shadow: inset 4px 0 12px -4px rgba(97, 255, 236, 0.35); }
  .lrq-row.unread:hover { background: rgba(97, 255, 236, 0.16); }
  .lrq-link {
    display: flex; align-items: center; gap: 10px;
    min-height: 58px;                      /* 요청 행 2줄 고정: 19+2+17 + 상하 10 = 58 — 둘째 줄이 없어도 같은 높이 */
    padding: 10px 48px 10px 14px;          /* 상하 10(2026-08-10 여백 확대, 구 6) · 우측 48 = 체크박스(우측 가운데) 자리 */
    text-decoration: none; color: var(--text);
  }
  .lrq-avatar { width: 26px; height: 26px; object-fit: cover; border: 1px solid var(--border); flex-shrink: 0; }
  .lrq-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .lrq-l1 { font-size: 13px; font-weight: 700; line-height: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrq-l1 .lrq-label { font-size: 11px; color: var(--muted); font-weight: 600; margin-left: 6px; }   /* 멤버명-라벨 간격 6px — 이벤트 탭 .event-member 규칙과 동일 */
  .lrq-l2 { color: #94a3b8; font-size: 12px; line-height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* 이벤트 탭 .event-detail과 동일 톤·1줄 말줄임 */
  .lrq-link:hover .lrq-l2 { color: var(--accent2); }
  /* 체크박스(구 ✕ 대체): '확인함/좋아요 눌러줌' 토글 저장 — 행은 목록에 남고 재클릭으로 해제 가능(✕는 캐시 삭제 없이는 복구 불가였음) */
  .lrq-check {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 20px; height: 20px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(7,10,20,0.72); border: 1px solid var(--border);
    color: transparent; cursor: pointer;    /* 체크 글리프는 상시 렌더·미체크 땐 투명 — 토글이 행 클래스 하나로 끝난다 */
  }
  .lrq-check svg { width: 14px; height: 14px; display: block; }
  .lrq-check:hover { background: var(--surface2); border-color: var(--muted); }
  .lrq-row.checked .lrq-check { border-color: rgba(52, 211, 153, 0.7); background: rgba(52, 211, 153, 0.10); color: #6ee7b7; }
  .lrq-row.checked .lrq-link { opacity: 0.5; }   /* 처리한 요청은 살짝 가라앉힘(목록엔 남음) */
  /* 다가오는 일정: 버튼 카운트다운 + 모달 리스트(좋아요 모달의 lr-overlay 골격 재사용) */
  .sch-btn-dday { color: var(--accent); font-variant-numeric: tabular-nums; }
  /* 같은 날 2건+ 일정 묶음: 제목 행 위 / 각 제목 아래 같은 열에 그 일정의 dtime(열 정렬). 폭은 내용으로 관리(컷·말줄임 없음). */
  .sch-grid { display: grid; column-gap: 6px; row-gap: 1px; }   /* 점이 자체 칸 → gap이 점 양옆에 붙으므로 6px(점 포함 총 ~16px, 점 추가 전 간격과 동일) */
  .sch-grid .sch-col-title { white-space: nowrap; }   /* 색 미지정 = 버튼 기본색(민트) 상속, 단일 일정 제목과 동일 */
  .sch-grid .sch-btn-dtime { color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sch-grid .sch-dtime-merged { grid-column: 1 / -1; }   /* dtime이 전부 같을 때 한 칸으로 병합(전 열 span) */
  .sch-grid .sch-sep { opacity: .55; }   /* 일정 사이 가운뎃점 — 민트 상속, 구분자로 읽히게 약간 옅게 */
  .sch-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 16px;
    min-height: 66px;   /* 아바타 최대 2행(42) + 상하 패딩 24 — 멤버 0·1·2행 무관 행 높이 고정(content/banner-card-info와 동일 사유) */
    border-bottom: 1px solid var(--border);
  }
  .sch-item:last-child { border-bottom: none; }
  .sch-item-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .sch-item-when { font-size: 11px; color: var(--muted); font-weight: 600; }
  .sch-item-title {
    font-size: 14px; color: var(--text); font-weight: 700;
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-width: 0;
  }
  a.sch-item-title:hover { color: var(--accent); }
  .sch-item-title svg { width: 12px; height: 12px; opacity: 0.7; flex-shrink: 0; }
  .sch-item-members {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
    flex-shrink: 0;
    justify-content: flex-end;
    max-width: 132px;   /* 20px×6 + gap 2px×5 = 130 → 7명째부터 2행 (컨텐츠·현수막 카드와 동일, 7명+는 membersRowStyle이 인라인으로 좁힘) */
    margin-left: auto;  /* 멤버 블록을 D-day 쪽으로 붙임 — 제목이 짧아도 오른쪽 정렬 유지 */
  }
  .sch-item-members img {
    width: 20px; height: 20px;
    object-fit: cover;
    border: 1px solid var(--border);
  }
  .sch-item-dday {
    font-size: 13px; color: var(--accent); font-weight: 700;
    white-space: nowrap; flex-shrink: 0; font-variant-numeric: tabular-nums;
    /* 폭 고정(2026-08-07): 'D-DAY'(5자)와 'D-1'(3자)의 폭이 18px쯤 달라 그만큼 앞의 아바타 줄이
       좌우로 밀렸다. 가장 넓은 'D-DAY' 기준으로 바닥을 깔고 오른쪽 정렬 — 'D-999'까지 여유 있게 들어간다. */
    min-width: 44px; text-align: right;
  }
  .celebration-box {
    display: flex;
    align-items: center;
    gap: 10px;   /* .page-title-link과 동일 — 내부 간격 10px(2026-08-09 비교 확정) */
    padding: 6px 10px 4px;   /* .page-title-link과 같은 보정 — 같은 줄에 서므로 높이가 어긋나면 안 된다 */
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
    flex-shrink: 0;
    text-decoration: none;
    cursor: pointer;
    background: rgba(var(--cb-rgb), 0.12);
    border: 1px solid rgba(var(--cb-rgb), 0.4);
    transition: background 0.15s, border-color 0.15s;
  }
  .celebration-box:hover { background: rgba(var(--cb-rgb), 0.22); border-color: rgba(var(--cb-rgb), 0.7); }
  .celebration-box svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: -2px; }   /* -2px: .page-title-link svg와 동일 사유(비대칭 패딩 6/4 상쇄 → 테두리 정중앙) */
  /* 상단바/사이드바 PC↔모바일 변형 토글 (기본=PC, 모바일 변형은 700px 미디어쿼리에서 표시) */

  .header-right {
    /* 설명 문구+가이드 묶음(2026-08-10): 우측 밀기(margin-left:auto)를 개별 요소가 아닌 이 래퍼가 담당 —
       상단바가 wrap될 때 둘이 한 덩어리로 함께 줄바꿈된다. gap은 상단바 값(PC 12/모바일 10) 상속으로 기존 간격 유지. */
    margin-left: auto;

  /* 컨테이너 쿼리 기준점: 각 탭 콘텐츠 영역(뷰포트가 아닌 실제 폭) 기준으로 열 수/전환 판단 → 좌측 사이드바·패딩 자동 반영 + 멤버 증가 대응 */
  #app, #statsBody, #linksBody, #membersBody, .hall-wrap { container-type: inline-size; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px; padding: 22px 30px;
    max-width: 1520px; width: 100%; margin: 0 auto;
    flex: 1;
  }
  /* ── 정전 타이머(2026-08-07) — 전원 오프라인일 때 카드 묶음을 흐리고 그 위에 경과 시간을 얹는다 ──
     흐림은 .grid에만 건다. #app에 걸면 문구까지 같이 흐려진다(문구는 .grid의 형제).
     문구를 sticky로 두는 이유: 카드 13장이 두 화면 넘게 이어져서, 오버레이 한가운데에 두면
     스크롤 안 한 첫 화면에서는 문구가 화면 밖에 있다. sticky면 어디를 보고 있든 화면 중앙에 붙는다. */
  #app { position: relative; }
  .grid.blackout { filter: blur(5px) grayscale(0.35); }
  .blackout-overlay { position: absolute; inset: 0; z-index: 2; cursor: pointer; }
  .blackout-msg {
    position: sticky; top: 42vh;
    text-align: center; padding: 0 16px;
    font-size: 22px; font-weight: 800; color: var(--text);
    line-height: 1.45; text-shadow: 0 2px 14px rgba(0,0,0,0.85);
  }
  .blackout-time {
    display: block; margin-top: 10px;
    font-size: 30px; color: var(--accent);
    font-variant-numeric: tabular-nums;   /* 초가 흘러도 글자 폭이 안 흔들리게 */
  }
  @container (min-width: 1500px) { .grid { grid-template-columns: repeat(5, 1fr); } }   /* 13인 홈 역할: 넓은 화면에서 전원 한눈에(5+5+3) — 2026-08-02 확정 */
  @container (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @container (max-width: 800px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @container (max-width: 520px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);

    text-decoration: none; color: inherit;
    display: block;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  }


  .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 8px 24px rgba(97,255,236,0.18); }
  .card.live { border-color: var(--accent); }
  .card.live:hover { border-color: var(--accent2); box-shadow: 0 8px 24px rgba(97,255,236,0.18); }


  .card.offline .card-thumb { opacity: 0.4; }
  .card.offline .card-name { color: var(--muted) !important; }
  .card.vacation .card-thumb { opacity: 0.85; filter: saturate(0.75); }
  .card.vacation .card-thumb .placeholder img { max-width: 100%; max-height: 100%; opacity: 1; object-fit: cover; }

  .card-thumb {
    width: 100%; aspect-ratio: 16/9;

    position: relative; overflow: hidden;
  }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-thumb .placeholder {

  .placeholder-mode-text {
    font-size: 12px; font-weight: 600;

  }
  /* 모드 배지 3종(.badge-mode/.event-mode-tag/.day-session-mode): SVG 도형 렌더(2026-07-13) — nav 숫자 배지와 동일 사유.
     테두리(rect)·글자(패스)가 한 SVG 좌표계의 기하라 배율 무관 정중앙이며, 각 배지가 자기 라벨의 잉크를 박스 중앙에 둠(라벨별 광학 중앙 — 확정).
     크기도 3곳 통일: 높이19 · min-width46 · 글자 11px 상당 · 테두리1.5 · 자간0.3 (구 3종은 20/19/~15px로 근거 없이 달랐음 — 통합 확정, 산정은 modeBadgeSvg()).
     색은 기존 색 클래스(currentColor 상속) 그대로. */
  .badge-mode {
    position: absolute; top: 10px; right: 10px;
    display: inline-block;
  }
  .badge-mode svg, .event-mode-tag svg, .day-session-mode svg { display: block; }
  .badge-mode.adult { color: var(--mode-adult); }
  .badge-mode.subscription { color: var(--mode-subscription); }
  .badge-mode.copyright { color: var(--mode-copyright); }
  .badge-mode.password { color: var(--mode-password); }
  .badge-mode.restricted { color: var(--mode-restricted); }
  .badge-mode-wrap {
    position: absolute; top: 10px; right: 10px;
    display: flex; gap: 4px;
  }
  .badge-mode-wrap .badge-mode { position: static; top: auto; right: auto; }

  .card-info { padding: 12px 14px 14px; display: flex; align-items: center; gap: 10px; }

    width: 36px; height: 36px;

  .card-btime {
    font-size: 11px;
    color: var(--muted);   /* 무채색 — 이벤트 목록 경과 표시와 통일(2026-07-17 확정, 구 앰버 var(--time)) */
    font-weight: 600;

    display: inline-flex;

    gap: 3px;

  .card-title {

  .loading { text-align: center; padding: 80px 20px; color: var(--muted); flex: 1; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;

  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .events-wrap {
    padding: 20px 24px;
    max-width: 1400px; width: 100%; margin: 0 auto;
    flex: 1;
    display: grid; grid-template-columns: 1fr 280px;
    gap: 20px; align-items: start;
  }
  /* 1100px: 채팅 묶음 도입 후 타임라인 실폭 기준 상향 — 900px에선 필터를 내리기 직전 타임라인이 ~350px까지 좁아짐(사이드바 200+패딩 48+필터 280+갭 20 차감). 1100px 전환이면 최소 ~550px 확보. 1100은 탭 접힘과 같은 기존 브레이크포인트 어휘 */
  @media (max-width: 1100px) {
    .events-wrap { grid-template-columns: 1fr; }
    .filter-panel { position: static !important; order: -1; }   /* 최신순(기본): 필터를 이벤트 위로 */
    .events-wrap.evt-sort-asc .filter-panel { order: 0; }        /* 오래된순: 필터를 아래로(DOM 순서 복귀) */
  }
  .timeline { background: var(--surface); border: 1px solid var(--border); border-top: none; min-width: 0; }   /* 윗변은 sticky 헤더가 가짐(2026-08-09) — 헤더가 20px 떠 있어도 rest 상태 박스 윗변이 그대로 */
  .timeline-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px; }

  .filter-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px;
    position: sticky; top: 20px;
  }
  .filter-section + .filter-section {
    margin-top: 20px; padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .filter-title {
    font-size: 12px; font-weight: 700;
    color: var(--muted); letter-spacing: 1px;
    margin-bottom: 6px;   /* 필터 항목 간격(grid/flex gap 6px)과 일치 */
  }
  /* 멤버/종류 그리드 좌측에 '모두 선택/해제' 버튼 — 버튼은 그리드 높이만큼 stretch. 전체 관련 액션이라 좌측 배치(크루소개 등과 동일 패턴) */
  .filter-row { display: flex; gap: 6px; align-items: stretch; }
  /* 외곽선 알약 버튼. 좁은 세로 버튼 — 폭 좁으면 '모두/선택' 2줄(keep-all) 자동 분리. 이벤트·케미 필터 공용 */
  .filter-toggle-all {
    width: 38px;
    flex-shrink: 0;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    color: var(--accent);
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 2px;
    line-height: 1.25;
    white-space: normal;
    word-break: keep-all;
    transition: all 0.15s;
  }
  .filter-toggle-all:hover { border-color: var(--accent); }

  .filter-members { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1; min-width: 0; }
  @media (max-width: 1100px) { .filter-members { grid-template-columns: repeat(7, calc((100% - 36px) / 7)); } }   /* 상단 strip: 7열(13명=7+6, 크루 탭과 동일 줄바꿈 — 2026-08-02) — 필터 상단 전환(1100px)과 한 세트. 종류 필터와 동일한 calc 고정(1fr은 배율에 따라 칸별 1px 차 발생 + 같은 패널의 종류 그리드와 셀 폭 어긋남). gap 6px×6=36px */
  .filter-member {
    position: relative;
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer; overflow: hidden;
    transition: all 0.15s; padding: 0;
  }
  .filter-member img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: opacity 0.15s;
  }
  .filter-member:not(.on) img { opacity: 0.25; filter: grayscale(1); }
  .filter-member:not(.on) { border-color: transparent; }
  .filter-member.on { border-color: var(--accent); }
  .filter-member:hover { border-color: var(--accent); }

  /* 종류 필터: 멤버와 동일한 정사각 셀(아이콘 위·라벨 아래). 열 수를 멤버와 맞춰 셀 크기 일치(PC 3열/모바일 6열). 5종 + 모두선택 좌측 */
  /* 종류 필터: 아이콘 전용(텍스트 제거). 정사각 셀에 SVG만 크게 강조, 의미는 title 툴팁으로 보존. PC 3열·모바일 6열로 멤버 그리드와 셀 크기 동일 */
  .filter-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1; min-width: 0; }
  .filter-type {
    display: flex; align-items: center; justify-content: center;
    aspect-ratio: 1;
    min-height: 0; overflow: hidden;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer; transition: all 0.15s;
  }
  .filter-type:hover { border-color: var(--accent); }
  .filter-type.on { border-color: var(--accent); }
  .filter-type:not(.on) { opacity: 0.35; }
  .filter-type:not(.on):hover { opacity: 0.6; }
  .filter-type .filter-icon { width: 55%; height: 55%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .filter-type .filter-icon svg { width: 100%; height: 100%; }   /* SVG에 박힌 width/height 무시하고 셀 비례로 스케일(비율은 meet로 유지) */
  /* 모바일 strip: 종류도 멤버와 동일 6열(5종 + 우측 빈칸 1) */
  @media (max-width: 1100px) { .filter-types { grid-template-columns: repeat(7, calc((100% - 36px) / 7)); } }   /* 필터 상단 전환(1100px)과 한 세트 — 멤버 필터와 열수·calc 동일(버튼 크기 일관, 종류 5개+빈칸 2). 1fr은 나머지 1px를 일부 칸에만 줘 박스 크기가 갈림 → 모든 칸 동일 calc값으로 고정(gap 6px×6=36px). 남는 px는 우측 여백 */
  .filter-type[data-type="soop"] .filter-icon { color: var(--ev-start); }
  .filter-type[data-type="chat"] .filter-icon { color: #a78bfa; }
  .filter-type[data-type="post"] .filter-icon { color: var(--ev-post); }
  .filter-type[data-type="youtube"] .filter-icon { color: var(--ev-youtube); }
  .filter-type[data-type="cafe"] .filter-icon { color: #03C75A; }

  .event-icon.chat { background: rgba(167,139,250,0.15); color: #a78bfa; }
  .event-icon.chat_emoticon { background: rgba(167,139,250,0.15); color: #a78bfa; }
  .event-icon.donation { background: rgba(167,139,250,0.15); color: #a78bfa; }

  .event-elapsed svg { width: 12px; height: 12px; vertical-align: -1.5px; }   /* 시계 아이콘(구 ⏱) — 인라인 흐름 유지(밖 텍스트와 베이스라인 공유), 아이콘만 눈맞춤 오프셋 */
  .event-action { color: var(--muted); }
  .event-target { color: #cbd5e1; margin-left: 4px; display: inline-block; text-wrap: balance; }   /* 괄호는 하나의 덩어리 — inline이면 앞 텍스트와 섞여 중간에서 끊기므로 inline-block으로 묶음. 한 줄에 안 들어가면 통째로 다음 줄로, 카페명처럼 길면 본문 폭 안에서 덩어리 내부 줄바꿈(좁은 모바일 가로 overflow 방지). 짧은 '(X 방송)'은 공간 되면 앞 조각과 같은 줄. balance(2026-08-09): 여러 줄로 꺾일 때 줄 길이를 반반씩 균등 분배 — "…모집합니다 / ~!!")"처럼 꼬리만 남는 고아 줄 방지. 줄 수는 안 늘어 카드 높이 불변, 미지원 브라우저는 기존 동작 그대로 */
  /* 멤버명·액션라벨·경과시간은 짧으니 각각 한 줄 고정(조각 내부 중간이 안 끊김). */
  .event-member, .event-action-label, .event-elapsed { white-space: nowrap; }
  .event-mode-tag {
    display: inline-block;
    margin-left: 0; margin-right: 6px;
    vertical-align: var(--tag-valign);   /* 배지 박스 중심 = 제목(12px) 잉크 중심 — calibrateBadgeValign()이 실측 주입 */
  }
  .event-mode-tag.adult { color: var(--mode-adult); }
  .event-mode-tag.subscription { color: var(--mode-subscription); }
  .event-mode-tag.copyright { color: var(--mode-copyright); }
  .event-mode-tag.password { color: var(--mode-password); }
  .event-mode-tag.restricted { color: var(--mode-restricted); }
  .event-detail {
    color: #94a3b8; font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-top: 3px;
  }
  .event-time {
    font-size: 12px; color: var(--muted);
    flex-shrink: 0; text-align: right; line-height: 1.4;
  }
  .event-time-rel { display: block; }
  .event-time-abs {
    display: block; font-size: 10px;
    color: var(--muted); opacity: 0.7;
    white-space: nowrap;   /* 기본 1줄 고정(PC·일반 모바일) — 날짜/시간 inline */
  }
  /* 좁은 화면(≤480px)에서만 날짜·시간 2줄 분리. '좁을때'를 480px로 정의 — 이 숫자만 바꾸면 조정됨 */
  @media (max-width: 480px) {
    .event-time-abs .ev-abs-d { display: block; }
  }
  /* 채팅 묶음: 같은 채널에서 감지 주기 연속(25초 이내)으로 이어진 대화를 한 아이템으로. 내부는 과거→최신, 클릭 없이 전체 노출 */
  .chat-bundle-rows {
    margin-top: 6px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .chat-bundle-row {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 12px; line-height: 1.45;
    color: inherit; text-decoration: none;
  }
  .chat-bundle-row:hover .cbr-msg { color: var(--accent2); }
  .cbr-time { color: var(--muted); font-size: 11px; flex-shrink: 0; }
  .cbr-name { font-weight: 700; flex-shrink: 0; }
  .cbr-msg { color: #94a3b8; min-width: 0; overflow-wrap: anywhere; }
  /* 아이콘+텍스트 뱃지: align-items가 center면 baseline 참여 아이템이 없어 박스 하단이 기준선으로 합성 →
     행(baseline 정렬)에서 텍스트가 디센더만큼 위로 뜸. baseline+아이콘만 center로 채팅 행과 기준선 일치 */
  .cbr-don { display: inline-flex; align-items: baseline; gap: 4px; color: #a78bfa; font-weight: 700; }   /* 후원 계열 보라 — 노란색 비선호(Crenop) */
  .cbr-don svg { width: 12px; height: 12px; align-self: center; }
  .cbr-sanction { display: inline-flex; align-items: baseline; gap: 4px; color: #FFA94D; font-weight: 700; }
  .cbr-sanction svg { width: 12px; height: 12px; align-self: center; }
  .cbr-mission { display: inline-flex; align-items: baseline; gap: 4px; color: #a78bfa; font-weight: 700; }
  .cbr-mission svg { width: 12px; height: 12px; align-self: center; }
  .cbr-mtitle { color: var(--muted); }
  .cbr-chan { text-decoration: none; }
  .cbr-chan:hover { text-decoration: underline; }
  .event.chat-bundle { align-items: flex-start; }   /* 다행 묶음: center면 아이콘·아바타·시간이 세로 중앙에 떠 헤더와 분리돼 보임 */
  .chat-bundle-avatars { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }   /* 발화자 사진 세로 나열(겹침 없음) — 묶음이 세로로 자라는 아이템이라 사진 열도 세로가 공간 문법에 맞음 */
  .timeline-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;   /* 좁은 폰: 맨 위로 추가로 4버튼이 한 줄 ~410px 필요 — 안 들어가면 우측 묶음이 다음 줄로 */
    /* sticky(2026-08-09): 이벤트가 최대 1000건이라 중간에서도 조작 가능해야 함 — 모두 읽음·맨 위/아래·정렬이
       스크롤 내내 붙는다. 하단바는 이걸로 완전 중복이 되어 제거(맨 위로 버튼은 이리로 이사).
       top:20px = 필터 패널과 동일 이격. 위 20px 틈으로 카드가 비치는 건 ::before 백드롭(페이지 배경색)이 차단 —
       rest 상태에선 그 자리가 원래 페이지 배경이라 무해. 윗변 테두리는 .timeline에서 이리로 이전. */
    position: sticky; top: 20px; z-index: 3;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .timeline-header::before { content: ''; position: absolute; left: -1px; right: -1px; top: -21px; height: 20px; background: var(--bg); }   /* 좌표는 패딩 박스 기준: top -21 = 테두리(1px) 위 20px 지점부터, height 20 = 테두리 직전까지. 21로 두면 border-top을 덮어 윗변이 사라진다 */
  .timeline-bar-left, .timeline-bar-right { display: flex; align-items: center; gap: 8px; }   /* 간격 통일(2026-08-09): 버튼 사이·가장자리·행간 전부 상하 패딩과 같은 8px */
  .timeline-scroll-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    transition: color 0.15s, border-color 0.15s;
  }
  .timeline-scroll-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .timeline-scroll-btn svg { width: 12px; height: 12px; display: block; flex-shrink: 0; }   /* 세로는 flex 중앙 = 테두리 기준 정중앙(실측 ±0.5px 이내). 텍스트 쪽이 폰트 특성으로 반픽셀 위에 앉지만, 아이콘을 그에 맞추면 테두리 기준이 틀어진다(2026-08-09 실측 확정 — 정렬 기준은 테두리) */
  .sort-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    transition: color 0.15s, border-color 0.15s;
  }
  .sort-toggle:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .sort-toggle svg { width: 12px; height: 12px; display: block; flex-shrink: 0; }   /* 세로는 flex 중앙 = 테두리 기준 정중앙(실측 ±0.5px 이내). 텍스트 대비 보정은 하지 않는다 — 한글 글리프가 반픽셀 위에 앉는 폰트 특성이라 아이콘을 옮기면 테두리 기준이 틀어짐(2026-08-09 실측 확정) */

  .stats-wrap {
    padding: 20px 24px;
    max-width: 1600px; width: 100%; margin: 0 auto;
    flex: 1;
  }

  .stats-tabs-wrap {
    display: grid;
    grid-template-columns: repeat(14, 1fr);   /* 통합1 + 멤버13 (2026-07-31 빙밍 합류) */
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px;
    margin: 0 auto 16px;
    max-width: 980px;
  }
  /* 기간 선택줄: ‹연도› 스테퍼 + [전체][1월..12월] 13버튼(통합탭) / 12버튼(멤버탭, 전체 없음) */
  /* 통합탭 기간줄: ‹연도› 스테퍼 박스 + [전체][1~12월] 13버튼 */
  .stats-period-bar { display: flex; align-items: stretch; gap: 8px; margin-bottom: 16px; }
  .stats-period-wrap { display: grid; grid-template-columns: repeat(13, 1fr); gap: 6px; flex: 1; min-width: 0; }
  /* 멤버 개별탭: 스테퍼 줄(전폭) + 6열 2행 월 버튼 — 블록 외곽만 달력·요약과 정렬(내부 7열 정렬은 폐기) */
  .stats-member-period { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .stats-period-wrap.no-all { grid-template-columns: repeat(6, 1fr); }
  .stats-period-btn {
    background: var(--surface2);
    border: 1.5px solid transparent;
    color: var(--muted);
    font-family: inherit; font-size: 12px; font-weight: 700;
    padding: 0; min-height: 32px; cursor: pointer;   /* 스테퍼 박스와 32px 통일. height 고정 금지 — [전체]의 2행 스팬(<1100px) stretch가 깨짐 */
    transition: all 0.15s;
  }
  .stats-period-btn:hover { color: var(--accent); }
  .stats-period-btn.active { border-color: var(--accent); color: var(--accent); }
  .stats-period-btn:disabled { color: var(--border); cursor: not-allowed; }
  .stats-tabs-side {
    display: contents;
  }
  .stats-tabs-members {
    display: contents;
  }
  .stats-tab {
    position: relative;
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1.5px solid transparent;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.15s;
    padding: 0;
    font-family: inherit;
    box-sizing: border-box;
  }
  .stats-tab img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.15s, filter 0.15s;
  }
  .stats-tab:not(.active) img { opacity: 0.25; filter: grayscale(1); }
  .stats-tab:not(.active) { border-color: transparent; }
  .stats-tab.active { border-color: var(--accent); }
  .stats-tab:hover { border-color: var(--accent); }
  .stats-tab-all {
    position: relative;
  }
  .stats-tab-all img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .stats-tab-all span {
    position: absolute;
    bottom: 3px;
    left: 4px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-shadow: 0 0 4px var(--bg), 0 0 4px var(--bg);
    transition: color 0.15s;
  }
  .stats-tab-all.active span { color: #fff; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);   /* 13인: 6열=6+6+1 고아 → 5열(5+5+3). 7열은 카드 라벨이 비좁아 5열 채택(2026-08-02) */
    gap: 16px;
  }
  @container (max-width: 1400px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
  @container (max-width: 930px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
  @container (max-width: 700px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  @container (max-width: 480px) { .stats-grid { grid-template-columns: 1fr; } }   /* 카드 행이 nowrap이라 셀이 ~220px 밑이면 그리드가 넘쳐 가로스크롤 → 항상 그 이상 유지되도록 열 감소 */

  .stats-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    text-align: left;
    font-family: inherit;
    color: inherit;
  }
  .stats-card-header { display: flex; align-items: center; gap: 10px; }
  .stats-card-avatar {
    width: 40px; height: 40px;
    object-fit: cover;
    border: 1.5px solid var(--border);
    flex-shrink: 0;
  }
  .stats-card-name { font-size: 16px; font-weight: 700; }
  .stats-card-rows { display: flex; flex-direction: column; gap: 6px; }
  .stats-card-row {
    display: flex; justify-content: space-between;
    align-items: center; font-size: 13px;
    white-space: nowrap;
  }
  .stats-card-label { color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .stats-row-icon { display: inline-flex; align-items: center; flex-shrink: 0; vertical-align: middle; }
  .stats-row-icon svg { width: 11px; height: 11px; display: block; vertical-align: middle; }
  .medal-ico svg { width: 13px; height: 13px; vertical-align: -2px; }   /* 지표값 옆 순위 트로피(구 🥇🥈🥉 이모지) — 금·은·동은 명전 순위색 */
  .stats-card-value { color: var(--text); font-weight: 700; flex-shrink: 0; }

  .stats-detail-month {
    display: flex; align-items: center; gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 0 8px;
    box-sizing: border-box;
    height: 100%;
    min-height: 32px;   /* <1100px 세로 배치에선 height:100%가 auto(콘텐츠 30px)로 무력화 — 월 버튼(min-height:32)과 높이 통일 */
    justify-content: center;
  }
  .stats-month-btn {
    background: none;
    border: none;
    color: var(--muted);
    width: 28px; height: 28px;
    cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: color 0.15s;
    padding: 0;
  }
  .stats-month-btn svg { display: block; }
  .stats-month-btn:hover { color: var(--accent); }
  .stats-month-btn:disabled { color: var(--border); cursor: not-allowed; }
  .stats-month-text { font-size: 14px; font-weight: 700; min-width: 110px; text-align: center; }
  .stats-detail-summary {
    display: flex; flex: 1; flex-wrap: wrap; gap: 16px;
    padding: 8px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    align-items: center;
    box-sizing: border-box;
  }
  .stats-summary-item { display: flex; flex-direction: column; gap: 2px; }
  .stats-summary-label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; display: flex; align-items: center; gap: 4px; }
  .stats-summary-value { font-size: 14px; font-weight: 700; }
  /* 요약 항목 = 카드 지표행과 동일 문법(아이콘·색·클릭→그래프·hover 민트 테두리) */
  .stats-summary-item[data-metric] { cursor: pointer; padding: 2px 6px; margin: -3px -7px; border: 1px solid transparent; transition: background 0.15s, border-color 0.15s; }
  .stats-summary-item[data-metric]:hover { background: var(--surface2); border-color: var(--accent); }
  /* 일별 요약 세션의 시청자(최고·평균) — 시간 우측 인라인, 글씨는 시간과 동일 톤(아이콘만 색).
     inline-flex 중앙정렬 = 카드 라벨(stats-card-label)과 동일 패턴 — 아이콘이 텍스트 흐름의 vertical-align:middle(x-height 의존)로 앉으면 폰트 따라 틀어짐 */
  .day-session-viewer { display: inline-flex; align-items: center; font-size: 12px; color: var(--text); font-weight: 600; white-space: nowrap; }
  .day-session-viewer .stats-row-icon { margin-right: 3px; }

  .stats-member-header {
    display: grid;
    grid-template-columns: minmax(0, 480px) 1fr;
    gap: 16px;
    margin-bottom: 16px;
    align-items: stretch;
  }
  @container (max-width: 800px) { .stats-member-header { grid-template-columns: 1fr; } }   /* 우측 열이 ~300px 밑으로 가기 전에 1단(달력 480 + gap 16 기준) */

  .stats-detail-body {
    display: grid;
    grid-template-columns: minmax(0, 480px) 1fr;
    gap: 16px; align-items: start;
  }
  @container (max-width: 800px) { .stats-detail-body { grid-template-columns: 1fr; } }

  .calendar { background: var(--surface); border: 1px solid var(--border); padding: 12px; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .calendar-weekday {
    text-align: center; font-size: 11px;
    color: var(--muted); font-weight: 700; padding: 6px 0;
  }
  .calendar-weekday.sun { color: #f87171; }
  .calendar-weekday.sat { color: #60a5fa; }
  .calendar-day {
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1.5px solid transparent;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 13px; color: var(--text);
    cursor: pointer; transition: all 0.15s;
    padding: 4px; gap: 2px;
    font-family: inherit;
  }
  .calendar-day:hover { border-color: var(--accent); }
  .calendar-day.outside { opacity: 0.25; cursor: default; }
  .calendar-day.outside:hover { border-color: transparent; }
  .calendar-day.has-broadcast { background: rgba(97,255,236,0.18); color: var(--accent); }
  .calendar-day.has-broadcast:hover { background: rgba(97,255,236,0.30); }
  .calendar-day.selected { border-color: var(--accent); }
  .calendar-day.today { box-shadow: inset 0 0 0 1.5px var(--time); }
  .calendar-daynum { font-weight: 700; font-size: 13px; }
  .calendar-daycount { font-size: 9px; opacity: 0.8; }
  .calendar-day-dots {
    display: flex;
    gap: 3px;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }
  .calendar-day-dot {
    width: 5px;
    height: 5px;
  }
  .calendar-day-dot.post { background: var(--filter-post); }
  .calendar-day-dot.youtube { background: var(--ev-youtube); }
  .calendar-day-dot.cafe { background: #03C75A; }
  .calendar-day.has-activity:not(.has-broadcast) {
    background: rgba(46, 245, 225, 0.06);
  }
  .calendar-day.has-activity:not(.has-broadcast):hover {
    background: rgba(46, 245, 225, 0.12);
  }

  /* 시간대별 방송 분포 히트맵 (멤버 개별 화면) */
  .stats-detail-left { min-width: 0; }
  .toh-wrap { margin-top: 16px; }
  .toh-mb { display: none; }
  @media (max-width: 900px) {
    .toh-pc { display: none; }
    .toh-mb { display: block; }
  }
  .toh-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }

  /* 모바일: 멤버 가로 매트릭스 대신 멤버별 세로 블록 (가로 스크롤 제거). 데스크톱은 .links-table-wrap 유지 */

  /* 콘텐츠가 테이블 최소폭(780px) 밑으로 가기 전에 모바일 세로 블록으로 전환 → 가로스크롤 방지. 멤버=열이라 멤버 증가 시 테이블 min-width와 이 임계값을 함께 올려야 함(13인: 780/800) */
  @container (max-width: 800px) {   /* 표 min-width 780 + 여백 20 (빙밍 합류로 740→800 재계산) */

  /* === 케미 탭 === */
  .chem-wrap {
    padding: 20px 24px;
    max-width: 1400px; width: 100%; margin: 0 auto;
    flex: 1;
    display: grid; grid-template-columns: 1fr 280px;
    gap: 20px; align-items: start;
  }
  @media (max-width: 900px) {
    .chem-wrap { grid-template-columns: 1fr; }
    .chem-filter-panel { position: static !important; order: -1; }   /* 모바일: 필터를 케미 위 strip으로 */
  }
  .chem-content { container-type: inline-size; min-width: 0; }   /* 카드 열 수를 뷰포트가 아닌 이 콘텐츠 칸 폭 기준으로 판단(컨테이너 쿼리) */
  /* 케미 필터: 이벤트 .filter-panel과 동일 — 우측 사이드 sticky. 스크롤이 길어(2인+그룹) 필터 상시 노출이 이득 */
  .chem-filter-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px;
    position: sticky; top: 20px;
  }
  .chem-filter-members {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    flex: 1; min-width: 0;
  }
  @media (max-width: 900px) { .chem-filter-members { grid-template-columns: repeat(7, calc((100% - 36px) / 7)); } }   /* 모바일 strip: 7열(13명=7+6, 이벤트 필터와 동일 — 2026-08-02) — calc 고정(1fr 배율 라운딩 차단). gap 6px×6=36px */
  /* 그리드 = 섹션(라벨+카드 묶음) 세로 스택(2026-08-09 재구성: sticky 라벨을 위해 2인·모두 포함도 N인과 같은
     섹션 상자 구조로 통일). 카드 열수는 각 섹션 안의 .chem-group-grid가 컨테이너 쿼리로 판단한다. */
  .chem-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .chem-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 14px;
    /* 내용 세로 중앙(명전 .hall-content와 동일): 높이는 아래 실측 min-height로 고정되므로
       꺼짐(짧음)·켬(긺) 어느 상태든 본문 덩어리가 카드 정중앙에 온다 — 위 붙고 아래 비는 상태 방지 */
    display: flex; flex-direction: column; justify-content: center;
  }
  .chem-name {
    font-size: 13px; font-weight: 700; line-height: 19px;
    text-align: center;
    color: var(--text);
  }
  /* 케미명 조각(2026-08-08): 이름마다 오버/클릭 대상. 강조는 사이트 규약대로 민트, 종류 필터 밖 이름은 흐림 */
  /* 케미명(2026-08-08 확정 체계): 설명은 상단 '설명 보기' 토글 소관 — 오버 공개·클릭 고정 전부 폐지.
     클릭은 링크 있는 이름(.has-link)에서만 동작하므로 그 이름만 손가락 커서·민트 오버. */
  .chem-name-part { transition: color 0.12s; }
  .chem-name-part.has-link { cursor: pointer; }
  .chem-name-part.has-link:hover, .chem-name-part.hl { color: var(--accent); }
  .chem-name-part.dim { opacity: 0.35; }
  .chem-name-sep { color: var(--muted); font-weight: 400; }
  /* 설명 보기 토글 ON: 좌열 케미명·우열 설명 세로 나열(2026-08-08 확정, 명전 2·3위 토글 방식 이식).
     이름 우측정렬·설명 좌측정렬로 짝을 붙인다. 설명은 한 줄 말줄임(두 줄이 되면 카드 높이가 행마다 출렁임).
     카드 높이는 아래 renderChemistry 끝의 실측(꺼짐·켬 최대)으로 종류별 고정 — 토글해도 크기 불변, 내용은 flex 중앙. */
  /* 설명 보기 토글 + 상단 바(2026-08-09 재조정): 바는 34px, sticky top:20(필터 패널과 동일 이격).
     스크롤 전에는 자연 위치(칸 최상단)라 우측 필터 패널과 같은 높이에서 시작하고, 붙었을 때만 20px 떠 있다.
     떠 있을 때 위 20px 틈으로 카드가 비치는 건 ::before 백드롭(페이지 배경색)이 차단 — 스크롤 전엔 그 자리가
     chem-wrap의 padding(20px, 원래 페이지 배경)이라 무해. margin-bottom:-34로 흐름을 밀지 않는다.
     라벨(z3)이 이 바(z2) 위로 슬라이드 인/아웃 — 라벨엔 배경이 없어 토글을 가리지 않는다. */
  .chem-toggle-sticky {
    position: sticky; top: 20px; z-index: 2;
    height: 34px; margin-bottom: -34px;
    background: var(--bg);
    display: flex; align-items: center; justify-content: flex-end;
  }
  .chem-toggle-sticky::before { content: ''; position: absolute; left: 0; right: 0; top: -20px; height: 20px; background: var(--bg); }
  .chem-bar { display: flex; align-items: center; gap: 8px; }
  /* 이름 영역(명전 메커니즘 그대로, 2026-08-08 재수정): 꺼짐(가로)·켬(2열) 두 변형을 함께 렌더해두고
     클래스(.chem-show-desc)로 전환 — 재렌더 없이 즉시 토글. 카드 높이는 렌더 뒤 두 상태를 '실측'해
     종류별 최댓값을 공통 min-height로 고정(renderChemistry 끝) — 본문 덩어리는 토글 따라 자연 이동, 카드 크기만 불변. */
  .chem-head { display: flex; justify-content: center; margin-bottom: 10px; }
  /* 켬 2열은 .chem-name 밖(형제)이라 폰트를 따로 명시해야 한다 — 빠뜨리면 body 기본(16px·400)으로 커지고 얇아짐 */
  .chem-nlist { display: none; font-size: 13px; font-weight: 700; color: var(--text); }
  .chem-grid.chem-show-desc .chem-head .chem-name:not(.chem-name-fallback):not(.chem-name-keep) { display: none; }   /* keep = 설명이 하나도 없는 카드의 이름줄 — 켬에서도 그대로(격자 전환 무의미) */
  /* ON 3열: 카드 중앙 블록(inline-grid) — [이름(우측정렬)] [아이콘 전용 칸] [설명(좌측정렬)].
     아이콘을 별도 칸으로 빼서 이름 텍스트 오른끝이 전부 같은 선에 맞는다(이름 뒤 인라인이던 2026-08-08 방식은
     아이콘 있는 이름만 왼쪽으로 밀려 정렬이 어긋났음). 아이콘 없는 행은 빈 칸이 폭만 유지.
     행높이·줄높이 19px 통일: 아이콘 유무로 줄간격이 흔들리지 않게. */
  .chem-grid.chem-show-desc .chem-nlist { display: inline-grid; grid-template-columns: auto auto auto; grid-auto-rows: 19px; gap: 3px 6px; align-items: center; }
  .chem-nlist .chem-name-part { justify-self: end; text-align: right; white-space: nowrap; line-height: 19px; }
  /* 행 래퍼(display:contents): 상자를 안 만들어 3칸이 그대로 grid에 배치되면서, 클릭·:hover는 행 전체가 한 덩어리로
     먹는다(이름·아이콘·설명 어디에 올려도 반응). 상자가 없으니 cursor·opacity는 자식에 건다. */
  .chem-nrow { display: contents; }
  .chem-nrow.has-link > * { cursor: pointer; }
  .chem-nrow.dim > * { opacity: 0.35; }
  .chem-nicon { color: var(--muted); transition: color 0.12s; justify-self: start; }
  .chem-nicon svg { width: 12px; height: 12px; display: block; }
  .chem-nrow.has-link:hover .chem-name-part, .chem-nrow.has-link:hover .chem-nicon, .chem-nrow.has-link:hover .chem-ndesc,
  .chem-nrow.hl .chem-name-part, .chem-nrow.hl .chem-nicon, .chem-nrow.hl .chem-ndesc { color: var(--accent); }
  .chem-ndesc {
    font-size: 11px; font-weight: 400; line-height: 19px; color: var(--text); opacity: 0.85;   /* 400 명시: 부모 .chem-nlist의 700 상속 차단 */
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;
  }
  /* 링크 아이콘(2026-08-08 확정): 이름 뒤 인라인 상시 표시 — 클릭 동작의 존재를 토글과 무관하게 알린다.
     구분자(·)는 별개의 것으로 그대로 유지(아이콘을 구분자로 쓰면 어느 이름 것인지 모호해진다). */
  .chem-name-link { display: inline-block; line-height: 0; margin-left: 3px; color: var(--muted); vertical-align: -1px; transition: color 0.12s; }   /* line-height:0 — 상자를 svg 12px로 잠가 줄높이(19px)를 못 키우게. 빠뜨리면 상자가 19px가 되어 아이콘 있는 카드만 꺼짐 제목이 1~2px 커지고 토글 시 하단 사진이 움직인다 */
  .chem-name-link svg { width: 12px; height: 12px; }
  .chem-name-part.has-link:hover .chem-name-link, .chem-name-part.hl .chem-name-link { color: var(--accent); }
  /* 연관 케미 도착 강조: 민트 테두리 잠깐 — transition으로 자연 소멸(제거 시 원색 복귀) */
  .chem-card { transition: border-color 0.35s, box-shadow 0.35s; }
  .chem-card.chem-flash { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  /* 종류 필터(2026-08-08): 이벤트 탭 .filter-type 재사용. 3열에 2×2 + 우측 열 빈칸, 아이콘은 전부 흰색 */
  .chem-filter-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1; min-width: 0; }
  .chem-filter-types .filter-type .filter-icon { color: var(--text); }
  @media (max-width: 900px) {
    .chem-filter-types { grid-template-columns: repeat(7, calc((100% - 36px) / 7)); }   /* 멤버 strip과 버튼 크기 통일 */
    .chem-filter-types .chem-type-spacer { display: none; }   /* 한 줄 전환 시 빈칸 없이 4개 연속 */
  }
  .chem-body {
    display: flex; align-items: center;
    gap: 10px; justify-content: center;
    container-type: inline-size;   /* 카드 내 멤버 줄바꿈을 카드 폭 기준으로 판단 */
  }
  .chem-member {
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    min-width: 0;
  }
  .chem-member img {
    width: 48px; height: 48px;
    object-fit: cover;
    border: 1.5px solid var(--border);
  }
  .chem-member-name {
    font-size: 11px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; max-width: 60px;
    text-align: center;
  }
  .chem-arrows {
    display: flex; flex-direction: column;
    gap: 4px; align-items: center;
    flex-shrink: 0;
  }
  .chem-arrow-row {
    display: flex; align-items: center;
    gap: 4px; font-size: 12px; font-weight: 600;
    color: var(--muted);
  }
  .chem-arrow-row .chem-count { color: var(--text); font-weight: 700; }
  .chem-chat-ico { display: flex; align-items: center; }  /* 색은 보낸 멤버 고유색을 인라인으로 지정 */
  .chem-chat-ico svg { width: 12px; height: 12px; }
  .chem-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px; grid-column: 1 / -1; }
  .chem-group-section {
    grid-column: 1 / -1;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    /* 라벨 핸드오프 연속화(2026-08-09): sticky 라벨이 붙어 있는 범위 = 이 상자의 콘텐츠 박스라서,
       카드가 끝나면 다음 라벨이 도착하기 전에 먼저 밀려나갔다(섹션 사이 간격만큼 이른 이탈).
       ::after 스페이서로 콘텐츠 박스를 다음 라벨 시작점까지 연장하고 margin-bottom으로 상쇄 —
       배치는 픽셀 동일, 라벨만 들어오는 라벨에 직접 밀려나는 연속 열차가 된다.
       49 = 그리드 gap 12 + margin-top 20 + 테두리 1 + padding-top 16. 이 값들이 바뀌면 함께 갱신. */
    margin-bottom: -49px;
  }
  .chem-group-section::after { content: ''; display: block; height: 49px; }
  .chem-group-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 1px;
    /* sticky(2026-08-09): 스크롤 시 현재 섹션 라벨이 상단(여백 20px 아래 — 필터 패널과 동일 이격)에 붙고,
       다음 섹션 라벨이 올라오면 밀어내며 교체. 라벨이 카드 묶음(.chem-group-grid)과 같은 섹션 상자 안에
       있어야 붙을 구간이 생긴다(renderChemistry의 secBlock).
       높이 34px 상자에 flex 중앙 — 토글 스트립(.chem-toggle-sticky)의 바 구간과 같은 높이·같은 중앙이라
       폰트 크기가 달라도(12px 라벨·15px 트랙 제목) 토글과 세로로 어긋날 수 없다.
       배경 없음: 붙었을 땐 뒤의 백드롭 스트립이 바탕이고, 흐름 중엔 페이지 배경 그대로. */
    position: sticky; top: 20px; z-index: 3;
    height: 34px; display: flex; align-items: center;
    margin-bottom: 0;
    pointer-events: none;   /* 라벨은 블록이라 폭이 그리드 전체 — 이 투명 상자(z3)가 스트립(z2) 안 토글을 덮어 클릭을 삼킨다. 라벨은 비인터랙티브라 통과시켜도 잃는 게 없다 */
  }
  /* 트랙 헤더(모두 포함·일부 포함): 하위 섹션 라벨(2인/3인 케미)보다 위계 ↑ — 더 크고 밝게 + 민트 바 */
  .chem-track-title {
    font-size: 15px;
    color: var(--text);
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chem-track-title::before {
    content: '';
    width: 3px;
    height: 15px;
    background: var(--accent);
    flex-shrink: 0;
  }
  .chem-group-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  /* 열수는 콘텐츠 칸 실제 폭 기준(컨테이너 쿼리) — 필터 사이드바(280px) 제외분에 맞춰 줄어듦. 콘텐츠 최대폭이
     ~1050px(1400-280-gap)라 4열은 가장 넓을 때만. (구: 뷰포트 @media 1100/800/500 — 사이드바 폭을 무시해
     .chem-grid의 컨테이너 쿼리와 기준이 갈렸음. 2026-08-09 전 섹션 통일하며 컨테이너 쿼리로 일원화) */
  @container (max-width: 1000px) { .chem-group-grid { grid-template-columns: repeat(3, 1fr); } }
  @container (max-width: 700px) { .chem-group-grid { grid-template-columns: repeat(2, 1fr); } }
  @container (max-width: 480px) { .chem-group-grid { grid-template-columns: 1fr; } }
  /* 높이 실측 중에만 행 늘림(stretch) 차단(2026-08-09): 그리드 기본값은 같은 행의 카드를 행 최대 높이로 늘리는데,
     그 상태로 offsetHeight를 재면 "옆 카드의 이름 행 수"가 내 몸통 높이로 오염되어(폭·열수에 따라 행 구성원이
     달라지니 기기마다 다르게) min-height가 이중 가산으로 부푼다. 측정 두 패스 동안만 이 클래스를 켠다. */
  .chem-grid.chem-measure .chem-group-grid { align-items: start; }
  .chem-group-members {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chem-group-members.large {
    display: grid;
    grid-template-columns: repeat(4, auto);
    justify-content: center;
    gap: 8px 12px;
  }
  .chem-group-members.large.cols3 { grid-template-columns: repeat(3, auto); }   /* 6인: 어떤 카드폭에서도 한 줄에 안 들어가 항상 3+3 */
  /* 4인: 카드가 4명 한 줄(≈4×40px+이름·gap)을 담으면 한 줄, 좁아지면 2+2 (3+1 방지) */
  @container (max-width: 215px) { .chem-group-members.large.n4 { grid-template-columns: repeat(2, auto); } }
  .chem-group-members .chem-member img { width: 40px; height: 40px; }

  /* === 명예의 전당 탭 === */
  .hall-wrap {
    padding: 20px 24px;
    max-width: 1400px; width: 100%; margin: 0 auto;
    flex: 1;
    display: flex; flex-direction: column;
    gap: 16px;
  }
  .hall-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .hall-bar-right { display: flex; align-items: center; gap: 8px; }
  .hall-bar-label { font-size: 13px; font-weight: 600; color: var(--muted); user-select: none; }
  .hall-period { display: flex; gap: 4px; flex-wrap: wrap; }
  .hall-period-btn { font-size: 12px; font-weight: 600; padding: 5px 10px; background: var(--surface2); border: 1.5px solid var(--border); color: var(--muted); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .hall-period-btn:hover { border-color: var(--accent); }

  .hall-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  /* 열 수는 2·3위 보기(수평형: 사진104px+순위행, 더 넓은 카드 필요) 켜진 상태 기준으로 통일 → 토글해도 열이 안 바뀜. 세로형은 같은 열수에서 카드만 더 여유 */
  @container (max-width: 1200px) { .hall-grid { grid-template-columns: repeat(3, 1fr); } }
  @container (max-width: 740px) { .hall-grid { grid-template-columns: repeat(2, 1fr); } }
  @container (max-width: 550px) { .hall-grid { grid-template-columns: 1fr; } }
  .hall-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px 14px;
    display: flex; flex-direction: column;
    gap: 10px;
  }
  .hall-cat {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 14px; font-weight: 700;
    color: var(--text); letter-spacing: 0.5px;
    text-align: center;
  }
  .hall-cat-icon { display: inline-flex; align-items: center; flex-shrink: 0; }
  .hall-cat-icon svg { width: 15px; height: 15px; display: block; }
  /* 카드 본문: 두 레이아웃 공존. 끔=세로(hall-v, 1위만), 켬=수평(hall-h, 1~3위). 토글로 전환, 높이는 JS 실측으로 통일 */
  .hall-content { display: flex; flex-direction: column; justify-content: center; }
  .hall-h { display: none; flex-direction: column; gap: 3px; padding-right: 20px; }   /* 우측 여백: 토글 ON에서 카드 간 기록 값(우측 정렬) 열을 맞추기 위해 단독·공동 모두 동일 적용 */
  .hall-h-body { display: flex; align-items: center; gap: 12px; }   /* 설명 제외 [사진 | 1·2·3행] — 사진 수직중앙이 행 블록(=2등 행) 중앙과 맞음 */
  .hall-wrap.show-ranks .hall-v { display: none; }
  .hall-wrap.show-ranks .hall-h { display: flex; }

  .hall-v { display: flex; flex-direction: column; align-items: center; gap: 10px; }   /* 이름블록↔값 간격 — 실측 값 텍스트 위8px/아래17px 불균형이라 5→10으로 균형(13/12) */
  .hall-v-winners { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: flex-end; }

  }

  .hall-desc { color: var(--muted); font-weight: 600; font-size: 11px; text-align: right; }

    padding: 8px;
    margin: 0 auto 16px;
    max-width: 980px;   /* 통계 스트립과 동일값 통일(2026-07-13) — 쌍둥이 컴포넌트인데 근거 없이 920으로 달랐던 표류 해소. 두 스트립은 1100px 미디어쿼리도 공유하므로 이제 전 폭에서 동일 반응 */
  }
  .members-tab {
    position: relative;
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1.5px solid transparent;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.15s;
    padding: 0;
    font-family: inherit;
    box-sizing: border-box;
  }
  .members-tab img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: opacity 0.15s, filter 0.15s;
  }
  .members-tab:not(.active) img { opacity: 0.25; filter: grayscale(1); }
  .members-tab:not(.active) { border-color: transparent; }
  .members-tab.active { border-color: var(--accent); }
  .members-tab:hover { border-color: var(--accent); }
  .members-tab-crew {
    position: relative;
  }
  .members-tab-crew img {
    width: 100%; height: 100%;
    object-fit: contain;
  }

  .members-crew {
    display: flex; gap: 16px;
    max-width: 1300px;   /* 전체폭 확대 — 비율 2.4:1 유지한 채 우측 활동 패널 절대폭 확보(가장 긴 줄 한 줄 수용). 좌측 소개도 함께 넓어짐 */
    margin: 0 auto;
    align-items: stretch;
  }
  /* 우측 활동/연혁 패널이 좁아져 가독성 무너지기 전에 세로 스택 — 콘텐츠 900px 밑(활동 패널 ~340px 밑)에서 전환(뷰포트 아닌 실제 폭 기준) */
  @container (max-width: 900px) {
    .members-crew { flex-direction: column; }
    .members-crew-intro, .members-crew-activities { flex: none; }
  }
  /* 비율 1.6:1 (2026-08-07, 구 2.4:1) — 근거는 우측이 필요한 폭이다.
     연혁의 현재 최장 줄이 327px인데 구 비율에선 안쪽 폭이 330px으로 여유가 3px뿐이었고,
     반대로 좌측은 소개문 최장 줄 604px에 842px을 쓰고 있었다(238px을 못 씀).
     1.6:1이면 우측 446px(여유 35%)·좌측 732px(여유 128px)로 양쪽이 다 맞는다.
     ※ 구 max-width:720px(소개문)은 제거했다 — 소개문은 세 줄이 <br>로 고정돼 최장 604px이라
       720이든 800이든 접히지 않았다. 실효 상한은 604px이고 문구는 이 파일에서만 바뀐다. */
  .members-crew-intro {
    flex: 1.6; min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 28px 32px;
    text-align: center;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  /* 로고가 남는 세로 공간을 먹는다(2026-08-07).
     [배경] 두 패널은 stretch라 높이가 같은데, 우측 연혁은 계속 늘고 좌측은 고정이다.
       구 방식(max-width 380 고정)은 늘어난 높이를 전부 위아래 여백으로 흘려보내, 연혁이 길어질수록
       좌측이 비어 보였다. flex-basis를 0으로 두면 로고 상자가 '남는 높이'만 받고,
       object-fit: contain이 가로세로비를 지킨 채 그 높이에 맞춰 로고를 키운다.
     [지금 크기] 좌우 자연 높이가 거의 같은 현재는 남는 높이 ≈ 기존 로고 높이라 보이는 크기가 사실상 그대로다.
     [상한] 560px — 연혁이 아주 길어져도 로고가 무한정 커지지 않게 하는 천장. */
  .members-crew-intro-img {
    flex: 1 1 0; min-height: 0;
    object-fit: contain;
    max-width: 560px;
    width: 100%;
    margin: 0 auto 32px;
    display: block;
  }
  .members-crew-intro p {
    font-size: 15px; color: var(--muted);
    line-height: 1.8;
    margin: 0 auto; word-break: keep-all;
  }
  .members-crew-activities {
    flex: 1; min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 22px 24px;
    display: flex; flex-direction: column;
  }
  .crew-act-sub {
    font-size: 12px; font-weight: 700; color: var(--accent);
    letter-spacing: 1.5px; margin: 16px 0 7px;
  }
  .crew-act-sub:first-child { margin-top: 0; }
  /* 프로필 하단 영상 스트립. 폭(max-width)은 인라인으로 호출부가 준다 — 크루 1300 / 멤버 1000으로 위 블록과 좌우를 맞춘다. */
  .video-strip-section { margin: 20px auto 0; }
  /* 화살표를 absolute로 띄워 스트립 폭 바깥에 세운다 — flex 형제로 두면 등장/퇴장할 때마다
     스크롤 영역 폭이 변해 타일이 흔들린다. 이제 .vs-scroll은 항상 온전한 폭을 쓴다. */
  .vs-row { position: relative; }
  /* 스크롤바는 감춘다 — 사이트에 가로 스크롤바 관례가 없고, 늘 넘치는 목록이라 상시 노출이 지저분하다. 대신 화살표가 신호다. */
  .vs-scroll {
    display: flex; gap: 10px; overflow-x: auto; scroll-behavior: smooth;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .vs-scroll::-webkit-scrollbar { display: none; }
  .vs-tile { width: 200px; flex: 0 0 200px; text-decoration: none; color: inherit; }
  .vs-thumb {
    aspect-ratio: 16 / 9; background: var(--bg);
    border: 1px solid var(--border); overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .vs-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 대체 이미지는 아바타라 16:9에 cover로 넣으면 잘린다 → 오프라인 카드와 같은 처리(contain + 흐리게).
     '영상 그림이 아니라 자리 채움'이 바로 읽힌다. */
  .vs-thumb img.ph { object-fit: contain; opacity: 0.4; }
  .vs-tile:hover .vs-thumb { border-color: var(--accent); }
  .vs-title {
    margin-top: 6px; font-size: 12px; line-height: 1.4; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  /* 폭 바깥에 선다. 22px + 오프셋 22px는 .members-wrap의 좌우 패딩(24px) 안에 들어가므로
     섹션이 컨테이너를 꽉 채워 여백이 0인 폭에서도 페이지 가로 넘침이 없다.
     세로는 썸네일(200px의 16:9) 한가운데 — 제목 두 줄까지 포함한 타일 전체 기준이 아니다. */
  .vs-arrow {
    position: absolute; top: calc((200px * 9 / 16 - 60px) / 2);
    width: 22px; height: 60px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;   /* 텍스트 ‹›→SVG 전환(2026-08-08)에 맞춘 중앙 정렬 */
  }
  .vs-arrow svg { width: 15px; height: 15px; }
  .vs-arrow[hidden] { display: none; }
  .vs-prev { left: -22px; }
  .vs-next { right: -22px; }
  .vs-arrow:hover { border-color: var(--accent); color: var(--accent); }
  /* 700px 이하에서 .members-wrap 패딩이 16px로 줄어 22px 버튼을 못 받는다. 그 폭은 터치가 주라
     스와이프로 넘기면 되므로 화살표를 아예 숨긴다(컨테이너 900 ≈ 뷰포트 948 — 패딩 24px 구간 안). */
  @container (max-width: 900px) { .vs-arrow { display: none; } }
  .crew-act-li {
    display: flex; gap: 9px;
    font-size: 14px; color: #94a3b8;
    line-height: 1.5; padding: 4px 0;
  }
  .crew-act-li .dot { color: var(--accent); flex: none; }
  .crew-act-li .d { color: #cbd5e1; font-weight: 700; }
  .crew-act-li .tag { color: var(--muted); font-size: 12px; }

  .members-profile {
    display: grid;
    grid-template-columns: minmax(0, 300px) 1fr;
    gap: 16px;
    max-width: 1000px;
    margin: 0 auto;
    align-items: stretch;   /* 사진 높이를 우측 표 높이에 맞춤(아래끝 일치). 폭 300 + 표높이≈402 → 박스≈3:4 */
  }
  .members-profile-photo {
    position: relative;
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
  }
  .members-profile-photo img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .members-profile-main {
    display: flex; flex-direction: column; gap: 16px;
    min-width: 0;
    container-type: inline-size;   /* 헤더 버튼 2×2 전환을 정보 컬럼 폭 기준으로(뷰포트 아님) */
  }
  @container (max-width: 640px) {   /* 통계 멤버탭과 동일 방식: 정보컬럼이 좁아지기 전에 1열 스택(좌300+gap+우~300 기준) */
    .members-profile { grid-template-columns: 1fr; }
    .members-profile-photo { width: 70%; max-width: 300px; margin: 0 auto; aspect-ratio: 3 / 4; }   /* 1열일 땐 옆에 맞출 표가 없어 비율로 높이를 줘야 함(2열일 땐 stretch가 표 높이를 줌) */
  }
  .members-profile-header {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px;
    display: flex; align-items: center; gap: 20px;
  }
  .members-profile-avatar {
    width: 72px; height: 72px;
    object-fit: cover;
    border: 3px solid var(--border);
    flex-shrink: 0;
  }
  .members-profile-info { display: flex; flex-direction: column; gap: 4px; }
  .members-profile-name { font-size: 22px; font-weight: 800; }
  .members-profile-eng {
    font-size: 12px; color: var(--muted); font-weight: 600;
    letter-spacing: 1.5px; opacity: 0.7;
  }
  .members-profile-quick {
    margin-left: auto;
    display: flex; gap: 6px;
    flex-shrink: 0;
  }
  .members-quick-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(97,255,236,0.08);
    border: 1px solid var(--accent);
    color: var(--accent);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    padding: 0;
    font-family: inherit;
  }
  /* 상시 유색(브랜드색, 관련링크 버튼은 위 기본=민트) — hover는 배경 농도만 상승(클릭 가능 피드백) */
  .members-quick-btn:hover { background: rgba(97,255,236,0.18); }
  .members-quick-btn.quick-soop { border-color: #0388FF; color: #0388FF; background: rgba(3,136,255,0.10); }
  .members-quick-btn.quick-soop:hover { background: rgba(3,136,255,0.22); }
  .members-quick-btn.quick-youtube { border-color: #FF0000; color: #FF0000; background: rgba(255,0,0,0.10); }
  .members-quick-btn.quick-youtube:hover { background: rgba(255,0,0,0.22); }
  .members-quick-btn.quick-naver { border-color: #03C75A; color: #03C75A; background: rgba(3,199,90,0.10); }
  .members-quick-btn.quick-naver:hover { background: rgba(3,199,90,0.22); }
  .members-quick-btn svg { width: 16px; height: 16px; display: block; }
  @container (max-width: 520px) { .members-profile-quick { display: grid; grid-template-columns: repeat(2, auto); } }   /* 정보 컬럼 ≤520px면(폰/태블릿 2단 무관) 이름 우측 버튼 2×2 */
  .members-info-section {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 20px 24px;
  }
  .members-info-title {
    font-size: 12px; font-weight: 700;
    color: var(--muted); letter-spacing: 1px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .members-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    column-gap: 24px;
  }
  @container (max-width: 500px) { .members-info-grid { grid-template-columns: 1fr; column-gap: 0; } }   /* 정보컬럼(.members-profile-main) 폭 기준 — 좁아지면 1열로 떨어져 긴 값(다른 소속 등)이 전체 폭 사용해 2열 반칸 넘침 방지 */
  .members-info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(30,39,64,0.5);
    gap: 8px;
    min-height: 36px;
  }
  .members-info-row-full {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(30,39,64,0.5);
    gap: 8px;
    grid-column: 1 / -1;
    min-height: 36px;
  }
  .members-info-row.mi-split-a { grid-column-start: 1; }   /* 첫 방송일·(숲 기준) 분할 쌍의 좌측 셀 — 위 짝 셀이 홀수여도 쌍이 같은 줄에 붙도록 항상 1열에서 시작(그리드 1열 전환 시엔 자연 스택) */
  .members-info-label {
    font-size: 13px; color: var(--muted); font-weight: 600;
    flex-shrink: 0; line-height: 20px;
  }
  .members-info-value {
    font-size: 14px; color: var(--text); font-weight: 700;
    text-align: right; white-space: normal; line-height: 20px;
  }
  /* 항목 모아보기: data-mi 행 클릭 → 모달. hover 링은 box-shadow(inset) — border를 쓰면 쇼트핸드가 행 구분선(border-bottom)을 지움 */
  .members-info-row[data-mi], .members-info-row-full[data-mi] {
    cursor: pointer; padding-left: 6px; padding-right: 6px; margin-left: -6px; margin-right: -6px;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .members-info-row[data-mi]:hover, .members-info-row-full[data-mi]:hover { background: var(--surface2); box-shadow: inset 0 0 0 1px var(--accent); }
  .mi-collect-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .mi-collect-row:last-child { border-bottom: none; }
  .mi-collect-row img { width: 26px; height: 26px; object-fit: cover; border: 1px solid var(--border); flex-shrink: 0; }
  .mi-collect-name { font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .mi-collect-val { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--text); text-align: right; }
  .mi-collect-row.me { background: var(--surface2); box-shadow: inset 2px 0 0 var(--accent); }   /* 현재 보던 멤버 강조 — 좌측 민트 바 */

  /* 프로필/통계 상단 셀렉터: 1행(14칸, max-width 980 공통)이 폭 좁아지면 버튼이 작아짐. 메인 사이드바가 상단으로 가는 700px보다 앞서, 1100px부터 2행으로 전환(버튼 크게 유지). 멤버/통계=크루(일반 크기)+13을 7열 2행(줄바꿈: 카푸|캬앙) */
  @media (max-width: 1100px) {
    .stats-tabs-wrap { grid-template-columns: repeat(7, 1fr); }
    .members-tabs-wrap { grid-template-columns: repeat(7, 1fr); }
    /* 크루/통합 버튼 2행 스팬 제거(2026-08-02): 12인 시절엔 스팬+12명이 7×2로 맞아떨어졌으나
       13인부턴 스팬이 마지막 1명을 3행으로 밀어냄 → 일반 크기 14타일 = 정확히 7×2 */
    .stats-period-wrap:not(.no-all) { grid-template-columns: repeat(7, 1fr); }
    .stats-period-wrap .stats-period-btn[data-period="all"] { grid-column: 1; grid-row: 1 / span 2; }
    .stats-period-bar { flex-direction: column; align-items: stretch; }   /* 좁으면 스테퍼가 위, 버튼 그리드가 아래 */
  }

  /* 상단바 우측 갱신정보: 좁은 폭에선 '주기 · 시각'을 2줄로 분리(주기/시각/비공식문구=3줄). 넓으면 스팬 inline이라 1줄 유지.
     900px: 가이드 버튼 추가로 701~900px 구간에서 갱신줄이 말줄임(…)되던 것 → 모바일과 동일한 분리로 해소 */
  @media (max-width: 900px) {
    .header-center-line { white-space: normal; }
    .header-center-line .hc-period, .header-center-line .hc-stamp { display: block; }
    .header-center-line .hc-mid { display: none; }
  }

  @media (max-width: 700px) {
    body { flex-direction: column; }
    /* 상단바 모달(모바일): PC처럼 중앙 + 내부 스크롤 유지(패널 max-height:80vh, lr-body 스크롤). 헤더(X)가 고정돼야 내용 스크롤 중에도 닫기 가능 → 페이지 스크롤 대신 내부 스크롤. 짧으면 중앙 정렬 */
    .lr-overlay { align-items: center; }
    .sidebar {
      width: 100%; height: auto;
      position: relative;
      flex-direction: column; padding: 0;
    }
    .sidebar-logo { padding: 8px; min-height: 0; }
    .nav-list { flex-direction: row; flex: none; padding: 8px; flex-wrap: wrap; align-items: center; justify-content: center; }
    .nav-item {
      flex-direction: column; gap: 4px;
      border-left: none;
      border-bottom: 3px solid transparent;
      padding: 8px 2px; white-space: nowrap;
      flex: 1 1 0;   /* 9칸 균등폭으로 가로 꽉 채움 — 기본 min-width:auto라 라벨보다 좁아지진 않고, 320px 미만 등 극협폭이면 flex-wrap으로 잘림 없이 다음 줄로 */
      font-size: 10px; line-height: 1.2;
    }
    .nav-item.active { border-left: none; border-bottom-color: var(--accent); }
    .nav-events-label { position: static; }   /* 모바일: 뱃지를 nav-item(아이콘 위 우상단)에 앵커 — 현행 유지 */
    .nav-badge { position: absolute; right: 6px; top: 4px; }
    .nav-notify-bell { display: none; }

    .main-header { padding: 12px 16px; min-height: 0; flex-wrap: wrap; gap: 10px; }

    .header-center { min-height: 52px; justify-content: center; }

     hover 민트 테두리 = 사이트 공통 '클릭 가능' 문법. 투명 기본 테두리+마진 보정으로 레이아웃 시프트 없음 */
  .stats-card-row-link { cursor:pointer; padding:2px 6px; margin:-3px -7px; border:1px solid transparent; transition: background 0.15s, border-color 0.15s; }

const MODE_LABEL = {
  normal: '일반', adult: '19+',
  subscription: '구독+', copyright: '저작권', password: '비번', restricted: '기타',
};
const MODE_PLACEHOLDER_TEXT = {
  adult: '19금 방송', subscription: '구독플러스 전용 방송',
  copyright: '저작권 방송', password: '비밀번호 방송', restricted: '기타 제한 방송',
};
// mode는 활성 속성 조합 문자열('adult_subscription' 등) — '_'로 분해해 각각 배지로. 단일/normal/레거시 'adult_copyright'도 그대로 분해됨.
function modeParts(mode) {
  return (mode || 'normal').split('_');
}
// 조합 문자열을 사람이 읽는 라벨로(예: 'adult_subscription' → '19+ · 구독+'). mode_change before/after 표시용.
function modeLabel(mode) {
  return modeParts(mode).map(p => MODE_LABEL[p] || p).join(' · ');
}
// 썸네일 없는 제한방송의 안내 텍스트(조합 대응). 예: 'adult_password' → '19금 방송 · 비밀번호 방송'.
function modePlaceholder(mode) {
  if (!mode || mode === 'normal') return '';
  return modeParts(mode).map(p => MODE_PLACEHOLDER_TEXT[p] || MODE_LABEL[p] || p).join(' · ');
}

const CHEM_NAME_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=574378390';
