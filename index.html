function formatBtime(seconds) {
  if (!seconds || seconds <= 0) return null;
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (h > 0) return h + '시간 ' + m + '분';
  return m + '분';
}
function formatRelTime(iso) {
  const now = new Date();
  const t = new Date(iso);
  const diff = Math.floor((now - t) / 1000);
  if (diff < 60) return '방금 전';
  if (diff < 3600) return Math.floor(diff / 60) + '분 전';
  if (diff < 86400) return Math.floor(diff / 3600) + '시간 전';
  return Math.floor(diff / 86400) + '일 전';
}
// 사이트 날짜 표시 통일(한글 'YYYY년 M월 D일'). 연도 없는 생일(M월 D일)·월 단위 라벨(YYYY년 M월)은 별도 범주라 미적용.
function koDate(y, m, d) { return `${y}년 ${m}월 ${d}일`; }
function formatAbsTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `<span class="ev-abs-d">${koDate(d.getFullYear(), d.getMonth() + 1, d.getDate())}</span> <span class="ev-abs-t">${hh}:${mi}</span>`;   // 날짜·시간 분리 span. 기본 1줄, 좁은 화면(≤480px)에서만 CSS로 2줄
}
function formatHHMM(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function formatDuration(ms) {
  if (!ms || ms <= 0) return '0분';
  const totalMin = Math.floor(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h > 0) return `${h}시간 ${m}분`;
  return `${m}분`;
}
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
// SOOP 게시판(/board) 폴백 링크에 텍스트 조각(#:~:text=)을 부착 → 브라우저가 게시판 목록에서 해당 글 제목으로 스크롤·강조.
// 대상: 애청자 전용 글 등 정밀 링크로 업그레이드되지 않는 board형 링크. 미지원 브라우저·제목 미표시 시 fragment는 조용히 무시됨.
function withTextFragment(url, title) {
  if (!url || !title || !/\/board$/.test(url)) return url;
  const frag = encodeURIComponent(title).replace(/-/g, '%2D');  // '-'는 텍스트 조각 문법의 prefix/suffix 구분자라 추가 인코딩 필요
  return `${url}#:~:text=${frag}`;
}
function soopProfileUrl(userId) {
  const prefix = userId.substring(0, 2);
  return `https://profile.img.sooplive.com/LOGO/${prefix}/${userId}/${userId}.jpg`;
}
function isoToKstDateKey(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function ymdKey(year, month1, day) {
  return `${year}-${String(month1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function daysInMonth(year, month1) {
  return new Date(year, month1, 0).getDate();
}

function buildCard(m, info) {
  const tag = 'a';   // 생방송=시청 페이지, 오프라인=방송국 페이지 — 둘 다 SOOP 새 탭 링크
  const card = document.createElement(tag);
  const vacSrc = !info.live && VACATION[m.id] && (() => { const n = new Date(Date.now() + 9*3600*1000); return `${n.getUTCFullYear()}-${String(n.getUTCMonth()+1).padStart(2,'0')}-${String(n.getUTCDate()).padStart(2,'0')}` <= VACATION[m.id].until; })() ? VACATION[m.id].img : null;
  card.className = 'card ' + (info.live ? 'live' : 'offline') + (vacSrc ? ' vacation' : '');
  card.dataset.member = info.id;
  card.href = info.live
    ? 'https://play.sooplive.co.kr/' + info.id           // 방송 중: 시청 페이지
    : 'https://www.sooplive.com/station/' + info.id;     // 오프라인: 방송국(다시보기·게시판)
  card.target = '_blank';
  card.rel = 'noopener';
  const btime = formatBtime(info.btime);
  const mode = info.mode || (info.live ? 'normal' : null);
  const isNormalLive = info.live && mode === 'normal';
  const hasThumb = info.thumb && isNormalLive;
  const thumbTs = Math.floor(Date.now() / 60000);
  const thumbHtml = hasThumb
    ? `<img src="${info.thumb}?t=${thumbTs}" alt="${m.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : '';
  const placeholderInner = info.live && mode && mode !== 'normal'
    ? `<img src="${m.img}" alt="${m.name}"><div class="placeholder-mode-text">${modePlaceholder(mode)}</div>`
    : `<img src="${vacSrc || m.img}" alt="${m.name}">`;
  let modeBadge = '';
  if (info.live && mode && mode !== 'normal') {
    const parts = modeParts(mode);
    const spans = parts.map(p => `<span class="badge-mode ${p}">${MODE_LABEL[p] || ''}</span>`).join('');
    modeBadge = parts.length > 1 ? `<span class="badge-mode-wrap">${spans}</span>` : spans;
  }
  const profileUrl = soopProfileUrl(m.id);
  const avatarHtml = profileUrl
    ? `<img class="card-avatar" src="${profileUrl}" alt="${m.name}" onerror="this.onerror=null;this.src='${m.img}'">`
    : `<img class="card-avatar" src="${m.img}" alt="${m.name}">`;
  let titleText;
  if (!info.live) titleText = '오프라인';
  else if (info.title) titleText = info.title;
  else if (mode && mode !== 'normal') titleText = modePlaceholder(mode) || '방송 중';
  else titleText = '방송 중';
  const btimeHtml = btime ? `<span class="card-btime"><span>⏱</span><span>${btime}</span></span>` : '';
  const nameColorStyle = info.live ? `color: ${m.color}` : '';
  card.innerHTML = `
    <div class="card-thumb">
      ${thumbHtml}
      <div class="placeholder" style="display:${hasThumb ? 'none' : 'flex'}">${placeholderInner}</div>
      ${modeBadge}
    </div>
    <div class="card-info">
      ${avatarHtml}
      <div class="card-text">
        <div class="card-name-row">
          <span class="card-name" style="${nameColorStyle}">${m.name}</span>
          ${btimeHtml}
        </div>
        <div class="card-title ${info.live ? 'is-live' : ''}">${escapeHtml(titleText)}</div>
      </div>
    </div>
  `;
  return card;
}

function getBroadcastElapsed(e, allEvents) {
  const targets = ['title', 'category', 'mode_change', 'end', 'chat', 'chat_emoticon', 'donation'];
  if (!targets.includes(e.type)) return '';
  const evTime = new Date(e.time).getTime();
  let startTime = null;
  if (e.broad_start) {
    startTime = new Date(e.broad_start).getTime();
  } else {
    const isChat = ['chat', 'chat_emoticon', 'donation'].includes(e.type);
    const targetMemberId = isChat ? e.channel_id : e.member_id;
    let startEv = null;
    for (const ev of allEvents) {
      if (ev.type === 'start' && ev.member_id === targetMemberId) {
        const t = new Date(ev.time).getTime();
        if (t <= evTime && (!startEv || t > new Date(startEv.time).getTime())) startEv = ev;
      }
    }
    if (!startEv) return '';
    startTime = new Date(startEv.time).getTime();
  }
  const diff = Math.floor((evTime - startTime) / 1000);
  if (diff < 0) return '';
  if (diff < 60) return `${diff}초`;
  const h = Math.floor(diff / 3600);
  const m = Math.floor((diff % 3600) / 60);
  return h > 0 ? `${h}시간 ${m}분` : `${m}분`;
}

function renderEvent(e, allEvents) {
  const iconMap = {
    start: SVG_ICONS.soop, end: SVG_ICONS.soop,
    title: SVG_ICONS.pencil, category: SVG_ICONS.tag, mode_change: SVG_ICONS.rotate,
    post: SVG_ICONS.board, comment_recommend: SVG_ICONS.thumbsup,
    youtube: SVG_ICONS.youtube, cafe_post: SVG_ICONS.coffee,
    chat: SVG_ICONS.chatBubble, chat_emoticon: SVG_ICONS.chatBubble,
    donation: SVG_ICONS.starBalloon,
  };
  const actionMap = {
    start: '방송 시작', end: '방송 종료',
    title: '방송 제목 변경', category: '카테고리 변경', mode_change: '방송 모드 변경',
    post: '숲 게시글', comment_recommend: '좋아요 요청',
    youtube: '유튜브 업로드', cafe_post: '카페 게시글',
    chat: '채팅', chat_emoticon: '채팅',
    donation: '후원',
  };
  const member = findMember(e.member_id);
  const avatarSrc = member ? member.img : '';
  const memberColor = member ? member.color : '#fff';
  let modeTag = '';
  if ((e.type === 'start' || e.type === 'end') && e.mode && e.mode !== 'normal') {
    modeTag = modeParts(e.mode)
      .map(p => { const label = MODE_LABEL[p] || ''; return label ? `<span class="event-mode-tag ${p}">${label}</span>` : ''; })
      .join('');
  }
  let targetTag = '';
  if (e.type === 'comment_recommend' && e.target_name) {
    targetTag = `<span class="event-target">(${escapeHtml(e.target_name)} 컨텐츠)</span>`;
  }
  if (e.type === 'cafe_post' && e.cafe_name) {
    targetTag = `<span class="event-target">(${escapeHtml(e.cafe_name)})</span>`;
  }
  if (['chat', 'chat_emoticon', 'donation'].includes(e.type) && e.channel_name) {
    const channelMember = MEMBERS.find(m => m.id === e.channel_id);
    const channelColor = channelMember ? channelMember.color : '#cbd5e1';
    targetTag = `<span class="event-target">(<span style="color: ${channelColor}">${escapeHtml(e.channel_name)}</span> 방송)</span>`;
  }
  let detail = '';
  if (e.type === 'start') {
    const titleText = e.title ? escapeHtml(e.title) : '';
    detail = `<div class="event-detail">${modeTag}${modeTag && titleText ? ' ' : ''}${titleText}</div>`;
  } else if (e.type === 'end') {
    const evTime = new Date(e.time).getTime();
    let lastTitleEv = null;
    for (const ev of (allEvents || [])) {
      if (ev.member_id === e.member_id && (ev.type === 'title' || ev.type === 'start')) {
        const t = new Date(ev.time).getTime();
        if (t <= evTime && (!lastTitleEv || t > new Date(lastTitleEv.time).getTime())) lastTitleEv = ev;
      }
    }
    const lastTitle = lastTitleEv ? (lastTitleEv.type === 'title' ? lastTitleEv.after : lastTitleEv.title) : '';
    const titleText2 = lastTitle ? escapeHtml(lastTitle) : '';
    detail = `<div class="event-detail">${modeTag}${modeTag && titleText2 ? ' ' : ''}${titleText2}</div>`;
  } else if (e.type === 'title' || e.type === 'category') {
    detail = `<div class="event-detail">${escapeHtml(e.before)} → ${escapeHtml(e.after)}</div>`;
  } else if (e.type === 'mode_change') {
    detail = `<div class="event-detail">${escapeHtml(modeLabel(e.before))} → ${escapeHtml(modeLabel(e.after))}</div>`;
  } else if ((e.type === 'post' || e.type === 'youtube' || e.type === 'comment_recommend' || e.type === 'cafe_post') && e.title) {
    detail = `<div class="event-detail">${escapeHtml(e.title)}</div>`;
  } else if (e.type === 'chat' && e.message) {
    detail = `<div class="event-detail">${escapeHtml(e.message)}</div>`;
  } else if (e.type === 'chat_emoticon') {
    detail = `<div class="event-detail">(이모티콘)</div>`;
  } else if (e.type === 'donation' && e.amount) {
    detail = `<div class="event-detail">별풍선 ${e.amount}개</div>`;
  }
  if (e.type === 'end' && !e.url && e.member_id) {
    e = { ...e, url: `https://www.sooplive.com/station/${e.member_id}/vod` };
  }
  const eventTime = new Date(e.time).getTime() || 0;
  const iconHtml = iconMap[e.type] || '•';
  const inner = `
    <div class="event-icon ${e.type}">${iconHtml}</div>
    ${avatarSrc ? `<img class="event-avatar" src="${avatarSrc}" alt="${escapeHtml(e.member_name)}">` : ''}
    <div class="event-body">
      <div>
        <span class="event-member" style="color: ${memberColor}">${escapeHtml(e.member_name)}</span>
        <span class="event-action"><span class="event-action-label">${actionMap[e.type] || e.type}</span>${(() => { const el = getBroadcastElapsed(e, allEvents||[]); return el ? ` <span class="event-elapsed">⏱ ${el}</span>` : ''; })()}</span>
        ${targetTag}
      </div>
      ${detail}
    </div>
    <div class="event-time">
      <span class="event-time-rel">${formatRelTime(e.time)}</span>
      <span class="event-time-abs">${formatAbsTime(e.time)}</span>
    </div>
  `;
  const LIVE_NAV_TYPES = new Set(['start', 'title', 'category', 'mode_change']);
  if (LIVE_NAV_TYPES.has(e.type)) {
    const liveUrl = `https://play.sooplive.co.kr/${e.member_id}`;
    return `<div class="event" data-time="${eventTime}"><a class="event-link" href="${escapeHtml(liveUrl)}" target="_blank" rel="noopener">${inner}</a></div>`;
  }
  if (['chat', 'chat_emoticon', 'donation'].includes(e.type) && e.channel_id) {
    // 채팅 본문이 http(s) 링크로 시작하면 방송이 아니라 그 링크로 연결 (뒤에 글자가 붙어 있으면 앞 URL 토큰만)
    if (e.type === 'chat' && e.message) {
      const urlMatch = e.message.match(/^(https?:\/\/\S+)/);
      if (urlMatch) {
        return `<div class="event" data-time="${eventTime}"><a class="event-link" href="${escapeHtml(urlMatch[1])}" target="_blank" rel="noopener">${inner}</a></div>`;
      }
    }
    const liveUrl = `https://play.sooplive.co.kr/${e.channel_id}`;
    return `<div class="event" data-time="${eventTime}"><a class="event-link" href="${escapeHtml(liveUrl)}" target="_blank" rel="noopener">${inner}</a></div>`;
  }
  if (e.url) {
    return `<div class="event" data-time="${eventTime}"><a class="event-link" href="${escapeHtml(withTextFragment(e.url, e.title))}" target="_blank" rel="noopener">${inner}</a></div>`;
  }
  return `<div class="event" data-time="${eventTime}">${inner}</div>`;
}

function initFilterUI() {
  const mc = document.getElementById('filterMembers');
  if (mc && !mc.dataset.inited) {
    mc.innerHTML = MEMBERS.map(m => `
      <button class="filter-member" data-id="${m.id}" title="${m.name}">
        <img src="${m.img}" alt="${m.name}">
      </button>
    `).join('');
    mc.querySelectorAll('.filter-member').forEach(btn => {
      const id = btn.dataset.id;
      btn.classList.toggle('on', filterState.members.has(id));
      btn.addEventListener('click', () => {
        if (filterState.members.has(id)) filterState.members.delete(id);
        else filterState.members.add(id);
        btn.classList.toggle('on', filterState.members.has(id));
        lsSetSet(LS_FILTER_MEMBERS, filterState.members);
        updateMemberAllToggle();
        applyFilter();
      });
    });
    mc.dataset.inited = '1';
  }
  const mAll = document.getElementById('filterMemberToggleAll');
  if (mAll && !mAll.dataset.inited) {
    mAll.addEventListener('click', () => {
      const allSelected = filterState.members.size === MEMBERS.length;
      filterState.members = allSelected ? new Set() : new Set(MEMBERS.map(m => m.id));
      lsSetSet(LS_FILTER_MEMBERS, filterState.members);
      mc.querySelectorAll('.filter-member').forEach(b => {
        b.classList.toggle('on', filterState.members.has(b.dataset.id));
      });
      updateMemberAllToggle();
      applyFilter();
    });
    mAll.dataset.inited = '1';
  }
  updateMemberAllToggle();
  const tc = document.getElementById('filterTypes');
  if (tc && !tc.dataset.inited) {
    const filterIconMap = {
      soop: SVG_ICONS.soop,
      chat: SVG_ICONS.chatBubble,
      post: SVG_ICONS.board,
      youtube: SVG_ICONS.youtube,
      cafe: SVG_ICONS.coffee,
    };
    tc.querySelectorAll('.filter-type').forEach(btn => {
      const type = btn.dataset.type;
      if (type === 'all') return;
      const iconEl = btn.querySelector('.filter-icon');
      if (iconEl && filterIconMap[type]) iconEl.innerHTML = filterIconMap[type];
      btn.classList.toggle('on', filterState.types.has(type));
      btn.addEventListener('click', () => {
        if (filterState.types.has(type)) filterState.types.delete(type);
        else filterState.types.add(type);
        btn.classList.toggle('on', filterState.types.has(type));
        lsSetSet(LS_FILTER_TYPES, filterState.types);
        updateTypeAllToggle();
        applyFilter();
      });
    });
    tc.dataset.inited = '1';
  }
  const tAll = document.getElementById('filterTypeToggleAll');
  if (tAll && !tAll.dataset.inited) {
    tAll.addEventListener('click', () => {
      const allSelected = filterState.types.size === ALL_TYPE_KEYS.length;
      filterState.types = allSelected ? new Set() : new Set(ALL_TYPE_KEYS);
      lsSetSet(LS_FILTER_TYPES, filterState.types);
      tc.querySelectorAll('.filter-type').forEach(b => {
        const t = b.dataset.type;
        if (t === 'all') return;
        b.classList.toggle('on', filterState.types.has(t));
      });
      updateTypeAllToggle();
      applyFilter();
    });
    tAll.dataset.inited = '1';
  }
  updateTypeAllToggle();
}

function updateMemberAllToggle() {
  const el = document.getElementById('filterMemberToggleAll');
  if (!el) return;
  el.textContent = filterState.members.size === MEMBERS.length ? '모두 해제' : '모두 선택';
}
function updateTypeAllToggle() {
  const el = document.getElementById('filterTypeToggleAll');
  if (!el) return;
  el.textContent = filterState.types.size === ALL_TYPE_KEYS.length ? '모두 해제' : '모두 선택';
}

function applyFilter() {
  const tl = document.getElementById('timeline');
  if (!tl) return;
  const ew = document.querySelector('.events-wrap');
  if (ew) ew.classList.toggle('evt-sort-asc', eventSortAsc);   // 정렬 따라 필터 위/아래(모바일 CSS order)
  const filtered = allEvents.filter(e => {
    const cat = typeToCat(e.type);
    if (!filterState.types.has(cat)) return false;
    const memberMatch = filterState.members.has(e.member_id);
    const channelMatch = e.channel_id && filterState.members.has(e.channel_id);
    if (cat === 'chat') return memberMatch || channelMatch;
    return memberMatch;
  });
  const sortLabel = eventSortAsc ? '오래된순' : '최신순';
  const arrowSvg = eventSortAsc
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 5 12 19"/><polyline points="5 12 12 19 19 12"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 19 12 5"/><polyline points="5 12 12 5 19 12"/></svg>';
  const scrollDownSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 13 12 18 17 13"/><polyline points="7 6 12 11 17 6"/></svg>';
  const scrollUpSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 11 12 6 7 11"/><polyline points="17 18 12 13 7 18"/></svg>';
  const sortBtnHtml = `<button class="sort-toggle sort-toggle-sync">${arrowSvg}<span>${sortLabel}</span></button>`;
  const markReadBtn = `<button class="timeline-scroll-btn mark-read-btn">${SVG_ICONS.checkAll}<span>모두 읽음</span></button>`;
  const headerHtml = `<div class="timeline-header"><div class="timeline-bar-left">${markReadBtn}</div><div class="timeline-bar-right"><button class="timeline-scroll-btn" id="scrollToBottom">${scrollDownSvg}<span>맨 아래로</span></button>${sortBtnHtml}</div></div>`;
  const footerHtml = `<div class="timeline-footer"><div class="timeline-bar-left">${markReadBtn}</div><div class="timeline-bar-right"><button class="timeline-scroll-btn" id="scrollToTop">${scrollUpSvg}<span>맨 위로</span></button>${sortBtnHtml}</div></div>`;
  if (filtered.length === 0) {
    tl.innerHTML = headerHtml + (allEvents.length === 0
      ? '<div class="timeline-empty">아직 기록된 이벤트가 없어요<br><br>방송, 게시글, 유튜브 영상 등이 올라오면 여기에 표시됩니다</div>'
      : '<div class="timeline-empty">필터 조건에 맞는 이벤트가 없어요</div>');
  } else {
    const sorted = [...filtered].sort((a, b) => eventSortAsc
      ? new Date(a.time) - new Date(b.time)
      : new Date(b.time) - new Date(a.time));
    tl.innerHTML = headerHtml + sorted.map(e => renderEvent(e, sorted)).join('') + footerHtml;
  }
  tl.querySelectorAll('.sort-toggle-sync').forEach(btn => {
    btn.addEventListener('click', () => { eventSortAsc = !eventSortAsc; applyFilter(); });
  });
  tl.querySelectorAll('.mark-read-btn').forEach(btn => {
    btn.addEventListener('click', () => { setLastSeenToNow(); refreshUnreadIndicator(); });
  });
  const scrollBottomBtn = document.getElementById('scrollToBottom');
  if (scrollBottomBtn) scrollBottomBtn.addEventListener('click', () => { tl.scrollIntoView({ block: 'end', behavior: 'smooth' }); });
  const scrollTopBtn = document.getElementById('scrollToTop');

function selectStatsTab(tabId) {
  statsState.selectedTab = tabId;
  if (tabId !== 'all' && tabId !== 'annual') statsState.viewMode = 'monthly';
  document.querySelectorAll('.stats-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tabId);
  });
  if (tabId !== 'all') {
    const latestDate = findLatestActivityDate(tabId);
    if (latestDate) {
      const d = new Date(latestDate);
      statsState.viewMonth = { year: d.getFullYear(), month: d.getMonth() + 1 };
      statsState.selectedDate = isoToKstDateKey(latestDate);
    } else {
      const now = new Date();
      statsState.viewMonth = { year: now.getFullYear(), month: now.getMonth() + 1 };
      statsState.selectedDate = null;
    }
  }
  renderStatsBody();
}

function findLatestActivityDate(memberId) {
  const ms = getMemberStatsForView(memberId);
  if (!ms) return null;
  let latestBroadcast = null;
  for (const s of (ms.sessions || [])) {
    if (!s.start) continue;
    const t = new Date(s.start).getTime();
    if (isNaN(t)) continue;
    if (latestBroadcast === null || t > new Date(latestBroadcast).getTime()) latestBroadcast = s.start;
  }
  if (latestBroadcast) return latestBroadcast;
  let latest = null;
  const candidates = [
    ...(ms.posts || []).map(p => p.time),
    ...(ms.youtube || []).map(y => y.time),
    ...(ms.cafe || []).map(c => c.time),
  ];
  for (const t of candidates) {
    const ms2 = new Date(t).getTime();
    if (isNaN(ms2)) continue;
    if (latest === null || ms2 > new Date(latest).getTime()) latest = t;
  }
  return latest;
}

function computeMonthSummary(memberStats, year, month1) {
  const result = {
    daysWithBroadcast: 0, totalDaysInMonth: daysInMonth(year, month1),
    totalDurationMs: 0, postCount: 0, youtubeCount: 0, cafeCount: 0,
    viewerPeak: 0, viewerSum: 0, viewerCount: 0,
    sessionsByDate: {}, postsByDate: {}, youtubeByDate: {}, cafeByDate: {},
  };
  if (!memberStats) return result;
  const monthStart = new Date(year, month1 - 1, 1, 0, 0, 0).getTime();
  const monthEnd = new Date(year, month1, 1, 0, 0, 0).getTime();
  const dateSet = new Set();
  for (const s of (memberStats.sessions || [])) {
    const startMs = new Date(s.start).getTime();
    if (isNaN(startMs) || startMs < monthStart || startMs >= monthEnd) continue;
    const dateKey = isoToKstDateKey(s.start);
    if (!dateKey) continue;
    dateSet.add(dateKey);
    if (!result.sessionsByDate[dateKey]) result.sessionsByDate[dateKey] = [];
    result.sessionsByDate[dateKey].push(s);
    if (s.end) {
      const endMs = new Date(s.end).getTime();
      if (!isNaN(endMs) && endMs > startMs) result.totalDurationMs += (endMs - startMs);
    }
    if (s.viewer_peak && s.viewer_peak > result.viewerPeak) result.viewerPeak = s.viewer_peak;
    if (s.viewer_sum) result.viewerSum += s.viewer_sum;
    if (s.viewer_count) result.viewerCount += s.viewer_count;
  }
  result.daysWithBroadcast = dateSet.size;
  for (const p of (memberStats.posts || [])) {
    const t = new Date(p.time).getTime();
    if (!isNaN(t) && t >= monthStart && t < monthEnd) {
      result.postCount++;
      const dateKey = isoToKstDateKey(p.time);
      if (dateKey) {
        if (!result.postsByDate[dateKey]) result.postsByDate[dateKey] = [];
        result.postsByDate[dateKey].push(p);
      }
    }
  }
  for (const y of (memberStats.youtube || [])) {
    const t = new Date(y.time).getTime();
    if (!isNaN(t) && t >= monthStart && t < monthEnd) {
      result.youtubeCount++;
      const dateKey = isoToKstDateKey(y.time);
      if (dateKey) {
        if (!result.youtubeByDate[dateKey]) result.youtubeByDate[dateKey] = [];
        result.youtubeByDate[dateKey].push(y);
      }
    }
  }
  for (const c of (memberStats.cafe || [])) {
    const t = new Date(c.time).getTime();
    if (!isNaN(t) && t >= monthStart && t < monthEnd) {
      result.cafeCount++;
      const dateKey = isoToKstDateKey(c.time);
      if (dateKey) {
        if (!result.cafeByDate[dateKey]) result.cafeByDate[dateKey] = [];
        result.cafeByDate[dateKey].push(c);
      }
    }
  }
  // seed 데이터 합산 (서비스 시작 전 수동 입력 데이터)
  if (memberStats.seed) {
    result.totalDurationMs    += memberStats.seed.broadcastMs || 0;
    result.daysWithBroadcast  += memberStats.seed.sessions    || 0;
    result.postCount          += memberStats.seed.posts       || 0;
    result.youtubeCount       += memberStats.seed.youtube     || 0;
    result.cafeCount          += memberStats.seed.cafe        || 0;
    if (memberStats.seed.viewerPeak && memberStats.seed.viewerPeak > result.viewerPeak) result.viewerPeak = memberStats.seed.viewerPeak;
    if (memberStats.seed.viewerSum) result.viewerSum += memberStats.seed.viewerSum;
    if (memberStats.seed.viewerCount) result.viewerCount += memberStats.seed.viewerCount;
    if (memberStats.seed.viewerAvg && !memberStats.seed.viewerSum && result.viewerCount === 0) {
      const seedMin = Math.round((memberStats.seed.broadcastMs || 0) / 60000);
      if (seedMin > 0) { result.viewerSum = memberStats.seed.viewerAvg * seedMin; result.viewerCount = seedMin; }
      else { result.viewerSum = memberStats.seed.viewerAvg; result.viewerCount = 1; }
    }
  }
  return result;
}

function renderStatsBody() {
  const body = document.getElementById('statsBody');
  if (!body) return;
  if (!statsState.viewMonth) {
    const now = new Date();
    statsState.viewMonth = { year: now.getFullYear(), month: now.getMonth() + 1 };
  }
  const ym = currentViewYm();
  if (ym && !statsState.data[ym] && !statsState.loadingMonths.has(ym)) {
    body.innerHTML = '<div class="loading"><div class="spinner"></div><div>통계 불러오는 중...</div></div>';
    loadStatsMonth(ym).then(() => { if (currentPage === 'stats') renderStatsBody(); });
    return;
  }
  if (statsState.loadingMonths.has(ym)) {
    body.innerHTML = '<div class="loading"><div class="spinner"></div><div>통계 불러오는 중...</div></div>';
    return;
  }
  if (statsState.viewMode === 'annual') { renderStatsAnnual(body); return; }
  if (statsState.selectedTab === 'all') renderStatsAll(body);
  else renderStatsMember(body, statsState.selectedTab);
}

// 해당 연도의 모든 월 stats 합산 — 통계 연간 탭과 명예의 전당이 공용 (수치·메달 일관성 보장)
function computeAnnualSums(year) {
  const annualSums = {};
  MEMBERS.forEach(m => {
    annualSums[m.id] = { sessions: 0, totalDurationMs: 0, postCount: 0, youtubeCount: 0, cafeCount: 0, viewerPeak: 0, viewerSum: 0, viewerCount: 0 };
  });
  for (let mo = 1; mo <= 12; mo++) {
    const ym = `${year}-${String(mo).padStart(2,'0')}`;
    MEMBERS.forEach(m => {
      const ms = statsState.data[ym]?.[m.id];
      if (!ms) return;
      const monthStart = new Date(year, mo - 1, 1).getTime();
      const monthEnd = new Date(year, mo, 1).getTime();
      // 자동 수집 데이터
      annualSums[m.id].sessions += (ms.sessions || []).filter(s => {
        const t = new Date(s.start).getTime();
        return !isNaN(t) && t >= monthStart && t < monthEnd;
      }).length;
      (ms.sessions || []).forEach(s => {
        const t = new Date(s.start).getTime();
        if (isNaN(t) || t < monthStart || t >= monthEnd) return;
        if (s.end) {
          const e = new Date(s.end).getTime();
          if (!isNaN(e) && e > t) annualSums[m.id].totalDurationMs += (e - t);
        }
        if (s.viewer_peak && s.viewer_peak > annualSums[m.id].viewerPeak) annualSums[m.id].viewerPeak = s.viewer_peak;
        if (s.viewer_sum) annualSums[m.id].viewerSum += s.viewer_sum;
        if (s.viewer_count) annualSums[m.id].viewerCount += s.viewer_count;
      });
      annualSums[m.id].postCount    += (ms.posts   || []).filter(p => { const t = new Date(p.time).getTime(); return !isNaN(t) && t >= monthStart && t < monthEnd; }).length;
      annualSums[m.id].youtubeCount += (ms.youtube || []).filter(y => { const t = new Date(y.time).getTime(); return !isNaN(t) && t >= monthStart && t < monthEnd; }).length;
      annualSums[m.id].cafeCount    += (ms.cafe    || []).filter(c => { const t = new Date(c.time).getTime(); return !isNaN(t) && t >= monthStart && t < monthEnd; }).length;
      // seed 데이터 합산
      if (ms.seed) {
        annualSums[m.id].sessions        += ms.seed.sessions    || 0;
        annualSums[m.id].totalDurationMs += ms.seed.broadcastMs || 0;
        annualSums[m.id].postCount       += ms.seed.posts       || 0;
        annualSums[m.id].youtubeCount    += ms.seed.youtube     || 0;
        annualSums[m.id].cafeCount       += ms.seed.cafe        || 0;
        if (ms.seed.viewerPeak && ms.seed.viewerPeak > annualSums[m.id].viewerPeak) annualSums[m.id].viewerPeak = ms.seed.viewerPeak;
        if (ms.seed.viewerSum) annualSums[m.id].viewerSum += ms.seed.viewerSum;
        if (ms.seed.viewerCount) annualSums[m.id].viewerCount += ms.seed.viewerCount;
        if (ms.seed.viewerAvg && !ms.seed.viewerSum) { const seedMin = Math.round((ms.seed.broadcastMs || 0) / 60000); if (seedMin > 0) { annualSums[m.id].viewerSum += ms.seed.viewerAvg * seedMin; annualSums[m.id].viewerCount += seedMin; } else { annualSums[m.id].viewerSum += ms.seed.viewerAvg; annualSums[m.id].viewerCount += 1; } }
      }
    });
  }
  return annualSums;
}

// 연간 통계에 필요한 월(1~현재월) 중 미적재분 목록
function annualMonthsToLoad(year, maxMonth) {
  const out = [];
  for (let mo = 1; mo <= maxMonth; mo++) {
    const ym = `${year}-${String(mo).padStart(2,'0')}`;
    if (!statsState.data[ym] && !statsState.loadingMonths.has(ym)) out.push(ym);
  }
  return out;
}

function renderCalendar(year, month1, sum) {
  const { sessionsByDate={}, postsByDate={}, youtubeByDate={}, cafeByDate={} } = sum;
  const totalDays = daysInMonth(year, month1);
  const firstDow = new Date(year, month1 - 1, 1).getDay();
  const todayKey = isoToKstDateKey(new Date().toISOString());
  const weekdays = ['일','월','화','수','목','금','토'];
  let html = `<div class="calendar"><div class="calendar-grid">`;
  weekdays.forEach((w, i) => {
    html += `<div class="calendar-weekday ${i===0?'sun':i===6?'sat':''}">${w}</div>`;
  });
  for (let i = 0; i < firstDow; i++) html += `<div class="calendar-day outside"></div>`;
  for (let day = 1; day <= totalDays; day++) {
    const dateKey = ymdKey(year, month1, day);
    const sessions = sessionsByDate[dateKey] || [];
    const posts = postsByDate[dateKey] || [];
    const youtubes = youtubeByDate[dateKey] || [];
    const cafes = cafeByDate[dateKey] || [];
    const hasBroadcast = sessions.length > 0;
    const hasPost = posts.length > 0;
    const hasYoutube = youtubes.length > 0;
    const hasCafe = cafes.length > 0;
    const hasActivity = hasBroadcast || hasPost || hasYoutube || hasCafe;
    const classes = ['calendar-day'];
    if (hasBroadcast) classes.push('has-broadcast');
    if (hasActivity) classes.push('has-activity');
    if (dateKey === todayKey) classes.push('today');
    if (statsState.selectedDate === dateKey) classes.push('selected');
    let bottomLine = '';
    if (hasBroadcast) {
      bottomLine = `<span class="calendar-daycount">${sessions.length}회</span>`;
    } else if (hasPost || hasYoutube || hasCafe) {
      const dots = [];
      if (hasPost) dots.push('<span class="calendar-day-dot post"></span>');
      if (hasYoutube) dots.push('<span class="calendar-day-dot youtube"></span>');
      if (hasCafe) dots.push('<span class="calendar-day-dot cafe"></span>');
      bottomLine = `<div class="calendar-day-dots">${dots.join('')}</div>`;
    }
    html += `<button class="${classes.join(' ')}" data-date="${dateKey}"><span class="calendar-daynum">${day}</span>${bottomLine}</button>`;
  }
  const trailing = (7 - ((firstDow + totalDays) % 7)) % 7;
  for (let i = 0; i < trailing; i++) html += `<div class="calendar-day outside"></div>`;
  html += `</div></div>`;
  return html;
}

function renderDayDetail(year, month1, sum, memberId) {
  const { sessionsByDate={}, postsByDate={}, youtubeByDate={}, cafeByDate={} } = sum;
  const date = statsState.selectedDate;
  if (!date) return `<div class="day-detail-empty">달력에서 날짜를 선택하면<br>해당 일의 활동 기록을 볼 수 있습니다</div>`;
  const sessions = sessionsByDate[date] || [];
  const posts = postsByDate[date] || [];
  const youtubes = youtubeByDate[date] || [];
  const cafes = cafeByDate[date] || [];
  const totalActivities = sessions.length + posts.length + youtubes.length + cafes.length;
  if (totalActivities === 0) return `<div class="day-detail-title">${date}</div><div class="day-detail-empty">이 날은 활동 기록이 없어요</div>`;
  const summaryParts = [];
  if (sessions.length > 0) summaryParts.push(`방송 ${sessions.length}회`);
  if (posts.length > 0) summaryParts.push(`게시글 ${posts.length}개`);
  if (youtubes.length > 0) summaryParts.push(`유튜브 ${youtubes.length}개`);
  if (cafes.length > 0) summaryParts.push(`카페 ${cafes.length}개`);
  let html = `<div class="day-detail-title">${date} · ${summaryParts.join(' · ')}</div>`;
  const items = [];
  for (const s of sessions) {
    const t = new Date(s.start).getTime();
    if (!isNaN(t)) items.push({ kind: 'session', time: t, data: s });
  }
  for (const p of posts) {
    const t = new Date(p.time).getTime();
    if (!isNaN(t)) items.push({ kind: 'post', time: t, data: p });
  }
  for (const y of youtubes) {
    const t = new Date(y.time).getTime();
    if (!isNaN(t)) items.push({ kind: 'youtube', time: t, data: y });
  }
  for (const c of cafes) {
    const t = new Date(c.time).getTime();
    if (!isNaN(t)) items.push({ kind: 'cafe', time: t, data: c });
  }
  items.sort((a, b) => a.time - b.time);
  for (const item of items) {
    if (item.kind === 'session') {
      const s = item.data;
      const startStr = formatHHMM(s.start);
      const endStr = s.end ? formatHHMM(s.end) : '진행 중';
      let durStr = '';
      if (s.end) {
        const ms = new Date(s.end).getTime() - new Date(s.start).getTime();
        durStr = ` · ${formatDuration(ms)}`;
      }
      const modeBadge = (s.mode && s.mode !== 'normal') ? modeParts(s.mode).map(p => `<span class="day-session-mode ${p}">${MODE_LABEL[p] || ''}</span>`).join('') : '';
      let changesHtml = '';
      if (s.changes && s.changes.length > 0) {
        changesHtml = `<div class="day-session-changes">${s.changes.map(c => {
          let icon, label, valHtml;
          if (c.type === 'title') { icon = SVG_ICONS.pencil; label = '방송 제목'; valHtml = `${escapeHtml(c.before||'')} → ${escapeHtml(c.after||'')}`; }
          else if (c.type === 'category') { icon = SVG_ICONS.tag; label = '카테고리'; valHtml = `${escapeHtml(c.before||'')} → ${escapeHtml(c.after||'')}`; }
          else if (c.type === 'mode_change') { icon = SVG_ICONS.rotate; label = '방송 모드'; valHtml = `${modeLabel(c.before)} → ${modeLabel(c.after)}`; }
          else { icon = '•'; label = c.type; valHtml = `${escapeHtml(c.before||'')} → ${escapeHtml(c.after||'')}`; }
          return `<div class="day-session-change"><span class="day-session-change-time">${formatHHMM(c.time)}</span><span class="day-session-change-icon">${icon}</span><span><b>${label}</b> ${valHtml}</span></div>`;
        }).join('')}</div>`;
      }
      const sessionUrl = s.end
        ? `https://www.sooplive.com/station/${memberId}/vod`
        : `https://play.sooplive.co.kr/${memberId}`;
      const sessionInner = `<div class="day-session-row-head"><span class="day-kind-icon broadcast">${SVG_ICONS.soop}</span><span class="day-session-time">${startStr} ~ ${endStr}${durStr}</span></div><div class="day-session-title">${modeBadge}${escapeHtml(s.title||'')}</div>${changesHtml}`;
      html += memberId
        ? `<a class="day-session" href="${escapeHtml(sessionUrl)}" target="_blank" rel="noopener">${sessionInner}</a>`
        : `<div class="day-session">${sessionInner}</div>`;
    } else if (item.kind === 'post') {
      const p = item.data;
      const inner = `<span class="day-kind-icon post">${SVG_ICONS.board}</span><span class="day-item-time">${formatHHMM(p.time)}</span><span class="day-item-title">${escapeHtml(p.title||'(제목 없음)')}</span>`;
      html += p.url ? `<a class="day-item" href="${escapeHtml(withTextFragment(p.url, p.title))}" target="_blank" rel="noopener">${inner}</a>` : `<div class="day-item">${inner}</div>`;
    } else if (item.kind === 'youtube') {
      const y = item.data;
      const inner = `<span class="day-kind-icon youtube">${SVG_ICONS.youtube}</span><span class="day-item-time">${formatHHMM(y.time)}</span><span class="day-item-title">${escapeHtml(y.title||'(제목 없음)')}</span>`;
      html += y.url ? `<a class="day-item" href="${escapeHtml(y.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="day-item">${inner}</div>`;
    } else if (item.kind === 'cafe') {
      const c = item.data;
      const cafeNameEsc = escapeHtml(c.cafe_name || '');
      const inner = `<span class="day-kind-icon cafe">${SVG_ICONS.coffee}</span><span class="day-item-time">${formatHHMM(c.time)}</span><span class="day-item-title">${cafeNameEsc ? `[${cafeNameEsc}] ` : ''}${escapeHtml(c.title||'(제목 없음)')}</span>`;
      html += c.url ? `<a class="day-item" href="${escapeHtml(c.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="day-item">${inner}</div>`;
    }
  }
  return html;
}

// 시간대별 방송 분포: 세션 [start,end]를 KST 기준 일·3시간밴드 경계로 쪼개 분 단위 누적.
// 자정 넘는 방송은 양일에 나눠 들어가고, 표시 월 밖으로 넘어가는 구간은 잘라낸다(클립). 진행 중 세션은 현재 월에서만 now까지 집계.
function computeTimeOfDayMinutes(sessionsByDate, year, month1, isCurrentMonth) {
  const dim = daysInMonth(year, month1);
  const grid = [];
  for (let i = 0; i < dim; i++) grid.push([0, 0, 0, 0, 0, 0, 0, 0]);
  const nowMs = Date.now();
  const sessions = [];
  for (const arr of Object.values(sessionsByDate || {})) {
    for (const s of arr) sessions.push(s);
  }
  for (const s of sessions) {
    const startMs = new Date(s.start).getTime();
    if (isNaN(startMs)) continue;
    let endMs;
    if (s.end) endMs = new Date(s.end).getTime();
    else if (isCurrentMonth) endMs = nowMs;   // 진행 중 세션은 현재 월에서만 now까지
    else continue;                            // 과거 월의 끝나지 않은 세션(고아)은 제외
    if (isNaN(endMs) || endMs <= startMs) continue;
    let cursor = startMs;
    let guard = 0;
    while (cursor < endMs && guard < 400) {
      guard++;
      const k = new Date(cursor + 9 * 3600 * 1000);   // KST 벽시계 성분
      const yr = k.getUTCFullYear();
      const mo = k.getUTCMonth() + 1;
      const dom = k.getUTCDate();
      const band = Math.floor(k.getUTCHours() / 3);    // 0..7 (3시간 단위, 자정=밴드0 시작과 일치)
      const boundaryKst = Date.UTC(yr, mo - 1, dom, 0, 0, 0) + (band + 1) * 3 * 3600 * 1000;
      const segEnd = Math.min(endMs, boundaryKst - 9 * 3600 * 1000);   // 이 밴드 끝(=다음 경계)까지
      if (yr === year && mo === month1 && dom >= 1 && dom <= dim) {
        grid[dom - 1][band] += (segEnd - cursor) / 60000;
      }
      cursor = segEnd;
    }
  }
  return grid;
}

// 히트맵 렌더: 가로=일(월별, 1fr로 폭은 달력에 맞춤), 세로=3시간 8밴드(경계눈금 00..24), 농도=선형 min(분/180,1).
// 주말만 날짜를 색으로 표기(토 파랑·일 빨강), 간격 없이 연속. 세션이 전혀 없는 달은 '' 반환(숨김).
function renderTimeOfDayHeatmap(year, month1, sum, isCurrentMonth) {
  const grid = computeTimeOfDayMinutes(sum.sessionsByDate, year, month1, isCurrentMonth);
  let hasAny = false;
  for (const day of grid) { for (const v of day) { if (v > 0) { hasAny = true; break; } } if (hasAny) break; }
  if (!hasAny) return '';
  const dim = grid.length;
  const R = 15, H = R * 8;
  const ylab = ['00', '03', '06', '09', '12', '15', '18', '21', '24'];
  let yc = `<div class="toh-yaxis" style="height:${H}px;">`;
  for (let i = 0; i < 9; i++) yc += `<span class="toh-ylabel" style="top:${i * R - 6}px;">${ylab[i]}</span>`;
  yc += `</div>`;
  let cells = `<div class="toh-grid" style="grid-template-columns:repeat(${dim},1fr);grid-auto-rows:${R}px;">`;
  for (let b = 0; b < 8; b++) {
    for (let d = 1; d <= dim; d++) {
      const minutes = grid[d - 1][b];
      const v = Math.min(minutes / 180, 1);
      const bg = v <= 0 ? '#101a2c' : `rgba(97,255,236,${(0.14 + 0.68 * v).toFixed(3)})`;
      const tip = minutes > 0 ? ` title="${month1}/${d} ${ylab[b]}–${ylab[b + 1]}시 · ${Math.round(minutes)}분"` : '';
      cells += `<div${tip} style="background:${bg};"></div>`;
    }
  }
  cells += `</div>`;
  let xa = `<div class="toh-xaxis" style="grid-template-columns:repeat(${dim},1fr);">`;
  for (let d = 1; d <= dim; d++) {
    const g = new Date(year, month1 - 1, d).getDay();
    const c = g === 0 ? '#f87171' : (g === 6 ? '#60a5fa' : '');
    xa += `<div class="toh-xlabel" style="color:${c || 'transparent'};">${c ? d : ''}</div>`;
  }
  xa += `</div>`;
  return `<div class="toh-head"><span class="toh-title">시간대별 방송 분포</span><span class="toh-sub">방송시간 기준</span></div><div class="toh-body">${yc}<div class="toh-right">${cells}${xa}</div></div>`;
}

async function loadEvents() {
  try {
    const res = await fetch(WORKER_URL + '/events');
    if (!res.ok) throw new Error('no events');
    const data = await res.json();
    allEvents = data.events || [];
    processNewEventsForNotification(allEvents);
    initFilterUI();
    applyFilter();
    lastEventsUpdate = new Date();
    updateHeaderCenter();
    refreshUnreadIndicator();
  } catch (e) {
    // 일시적 폴링 실패: 이미 불러온 이벤트가 있으면 기존 화면을 유지하고 이번 실패는 무시
    if (!allEvents || allEvents.length === 0) {
      const tl = document.getElementById('timeline');
      if (tl) tl.innerHTML = '<div class="timeline-empty">이벤트 데이터를 불러올 수 없어요</div>';
    }
  }
}

async function loadStatsMonth(yyyymm) {
  if (!yyyymm) return;
  if (!isCurrentMonth(yyyymm)) {
    const cached = lsGetMonthCache(yyyymm);
    if (cached) { statsState.data[yyyymm] = cached; return; }
  }
  if (statsState.loadingMonths.has(yyyymm)) return;
  statsState.loadingMonths.add(yyyymm);
  try {
    const res = await fetch(`${WORKER_URL}/stats?month=${yyyymm}`);
    if (!res.ok) throw new Error('stats fetch failed');
    const data = await res.json();
    const monthData = data.stats || {};
    statsState.data[yyyymm] = monthData;
    if (!isCurrentMonth(yyyymm)) lsSetMonthCache(yyyymm, monthData);
  } catch (e) {
  } finally {
    statsState.loadingMonths.delete(yyyymm);
  }
}

async function loadLive() {
  try {
    const res = await fetch(WORKER_URL + '/');
    const data = await res.json();
    const infoMap = {};
    data.members.forEach(m => { infoMap[m.id] = m; });
    const sorted = [...MEMBERS].sort((a, b) => {
      const al = (infoMap[a.id] && infoMap[a.id].live) ? 1 : 0;
      const bl = (infoMap[b.id] && infoMap[b.id].live) ? 1 : 0;
      return bl - al;
    });
    const grid = document.createElement('div');
    grid.className = 'grid';
    let liveCount = 0;
    sorted.forEach(m => {
      const info = infoMap[m.id] || { id: m.id, live: false };
      grid.appendChild(buildCard(m, info));
      if (info.live) liveCount++;
    });
    document.getElementById('app').innerHTML = '';
    document.getElementById('app').appendChild(grid);
    const liveBadge = document.getElementById('navLiveBadge');
    const liveCountEl = document.getElementById('navLiveCount');
    if (liveBadge && liveCountEl) {
      liveCountEl.textContent = liveCount;
      liveBadge.classList.toggle('on', liveCount > 0);
      liveBadge.classList.toggle('off', liveCount === 0);
    }
    lastLiveUpdate = new Date();
    updateHeaderCenter();
  } catch (e) {
    // 일시적 폴링 실패: 이미 카드 그리드가 그려져 있으면 유지하고 이번 실패는 무시

      app.innerHTML = '<div class="loading"><div>데이터를 불러올 수 없어요</div></div>';
    }
    console.error(e);
  }
}

function renderLinks() {

  function multiIconLinkCell(items) {
    if (!items || items.length === 0) return emptyCell;

      const color = COLORS[it.kind] || 'var(--text)';

  }
  function inferKindFromLabel(label) {
    if (label === '인스타그램') return 'instagram';
    if (label === 'X') return 'x';
    if (label === '디스코드') return 'discord';
    if (label === '팬심') return 'fancim';
    if (label === '일정표') return 'calendar';
    if (label === '캘린더') return 'calendar';
    if (label === '노래책') return 'music';
    if (label === '팬사이트') return 'site';

    const asLabel = (v, def) => typeof v === 'string' ? def : (v.label || def);
    const out = [];
    const add = (kind, label, url) => {

      const color = COLORS[kind] || 'var(--text)';

    });
    return { main: out.join(''), ogq: ogq.join('') };
  }

  }).join('');
  const rowYoutube = MEMBERS.map(m => {
    const links = MEMBER_LINKS[m.id];
    if (!links || !links.common) return emptyCell;
    const items = [];
    const yt = links.common['유튜브'];
    if (yt) items.push({ kind: 'youtube', label: typeof yt === 'string' ? '유튜브' : (yt.label||'유튜브'), url: typeof yt === 'string' ? yt : yt.url });
    const yt2 = links.common['유튜브2'];
    if (yt2) items.push({ kind: 'youtube', label: typeof yt2 === 'string' ? '유튜브' : (yt2.label||'유튜브'), url: typeof yt2 === 'string' ? yt2 : yt2.url });
    return multiIconLinkCell(items);
  }).join('');
  const rowFancafe = MEMBERS.map(m => {
    const url = MEMBER_LINKS[m.id]?.common?.['팬카페'];
    return iconLinkCell('cafe', '팬카페', typeof url === 'string' ? url : url?.url);
  }).join('');
  const rowNamu = MEMBERS.map(m => {
    const url = MEMBER_LINKS[m.id]?.common?.['나무위키'];
    return iconLinkCell('namuwiki', '나무위키', typeof url === 'string' ? url : url?.url);
  }).join('');
  const rowInsta = MEMBERS.map(m => iconLinkCell('instagram', '인스타그램', MEMBER_LINKS[m.id]?.instagram)).join('');
  const rowX = MEMBERS.map(m => iconLinkCell('x', 'X', MEMBER_LINKS[m.id]?.x)).join('');
  const rowDiscordOrFancim = MEMBERS.map(m => {
    const items = (MEMBER_LINKS[m.id]?.discordOrFancim || []).map(it => ({ kind: inferKindFromLabel(it.label), label: it.label, url: it.url }));
    return multiIconLinkCell(items);
  }).join('');
  const rowEtc = MEMBERS.map(m => {

  body.innerHTML = `

      <div class="links-table-wrap">

          <thead><tr>${memberHeader}</tr></thead>
          <tbody>

            <tr>${rowYoutube}</tr>

    </div>
  `;
}

function parseCSV(text) {
  const rows = [];
  const lines = text.split('\n');
  for (const line of lines) {
    if (!line.trim()) continue;
    const row = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (inQuotes) {
        if (ch === '"' && line[i+1] === '"') { current += '"'; i++; }
        else if (ch === '"') inQuotes = false;
        else current += ch;
      } else {
        if (ch === '"') inQuotes = true;
        else if (ch === ',') { row.push(current.trim()); current = ''; }
        else current += ch;
      }
    }
    row.push(current.trim());
    rows.push(row);
  }
  return rows;
}

function parseBannerDate(url) {
  const match = url.match(/(\d{6})\.webp/);
  if (!match) return null;
  const s = match[1];
  const yy = parseInt(s.substring(0, 2));
  const mm = s.substring(2, 4);
  const dd = s.substring(4, 6);
  return { sort: s, display: koDate(2000 + yy, parseInt(mm), parseInt(dd)) };
}

function membersRowStyle(count) {

function parseContentDate(url) {
  const match = url.match(/(\d{6})(?:-\d+)?\.webp/);
  if (!match) return null;
  const s = match[1];
  const yy = parseInt(s.substring(0, 2));
  const mm = s.substring(2, 4);
  const dd = s.substring(4, 6);
  // sort key: full match including suffix for stable ordering
  const fullMatch = url.match(/(\d{6}(?:-\d+)?)\.webp/);
  return { sort: fullMatch ? fullMatch[1] : s, display: koDate(2000 + yy, parseInt(mm), parseInt(dd)) };
}

            <span class="content-card-date">${c.date?.display || ''}</span>
          </div>
          <div class="content-card-members"${membersRowStyle(c.members.length)}>${memberImgs}</div>
        </div>
      </${cardTag}>
    `;
  }).join('');

  body.innerHTML = `<div class="content-grid">${cardsHtml}</div>`;
}

async function loadChemistry() {
  try {
    if (Object.keys(chemCounts).length === 0) {
      const cached = lsGet(LS_CHEM_CACHE, null);
      if (cached) {
        try { chemCounts = JSON.parse(cached); if (currentPage === 'chemistry') renderChemistry(); } catch (e) {}
      }
    }
    const res = await fetch(WORKER_URL + '/chat-counts');
    if (!res.ok) throw new Error('no data');
    chemCounts = await res.json();
    lsSet(LS_CHEM_CACHE, JSON.stringify(chemCounts));
    lastChemistryUpdate = new Date();
    if (currentPage === 'chemistry') renderChemistry();
    if (currentPage === 'hall') renderHall();
  } catch (e) {}
}

function renderChemistry() {
  const body = document.getElementById('chemistryBody');
  if (!body) return;

  const pairs = [];
  for (let i = 0; i < MEMBERS.length; i++) {
    for (let j = i + 1; j < MEMBERS.length; j++) {
      const m1 = MEMBERS[i], m2 = MEMBERS[j];
      const c1 = chemCounts[`${m1.id}:${m2.id}`] || 0;
      const c2 = chemCounts[`${m2.id}:${m1.id}`] || 0;
      pairs.push({ m1, m2, c1, c2, total: c1 + c2 });
    }
  }
  pairs.sort((a, b) => b.total - a.total);

  // 그룹(N인) 주고받은 채팅 합 — 정렬용 (2인 케미와 동일 산식)
  const groupChatTotal = (g) => {
    let t = 0;
    for (let a = 0; a < g.members.length; a++)
      for (let b = 0; b < g.members.length; b++)
        if (a !== b) t += chemCounts[`${g.members[a]}:${g.members[b]}`] || 0;
    return t;
  };

  // 카드 HTML 빌더 — 상단(모두 포함)·하단(일부 포함) 두 트랙이 동일 카드를 쓰도록 분리(두 경로 드리프트 방지)
  const pairCardHtml = (p) => {
    const chemKey = `${p.m1.id}:${p.m2.id}`;
    const customName = CHEM_NAMES[chemKey];
    const displayName = customName || `${escapeHtml(p.m1.name)} × ${escapeHtml(p.m2.name)}`;
    return `
    <div class="chem-card">
      <div class="chem-name">${customName ? escapeHtml(customName) : displayName}</div>
      <div class="chem-body">
        <div class="chem-member">
          <img src="${p.m1.img}" alt="${escapeHtml(p.m1.name)}">
          <span class="chem-member-name" style="color:${p.m1.color}">${escapeHtml(p.m1.name)}</span>
        </div>
        <div class="chem-arrows">
          <div class="chem-arrow-row"><span class="chem-chat-ico" style="color:${p.m1.color}">${SVG_ICONS.chatBubble}</span><span class="chem-count">${p.c1.toLocaleString()}</span> →</div>
          <div class="chem-arrow-row">← <span class="chem-count">${p.c2.toLocaleString()}</span><span class="chem-chat-ico" style="color:${p.m2.color}">${SVG_ICONS.chatBubble}</span></div>
        </div>
        <div class="chem-member">
          <img src="${p.m2.img}" alt="${escapeHtml(p.m2.name)}">
          <span class="chem-member-name" style="color:${p.m2.color}">${escapeHtml(p.m2.name)}</span>
        </div>
      </div>
    </div>
  `;
  };
  const groupCardHtml = (g) => {
    const membersHtml = g.members.map(id => {
      const m = MEMBER_BY_ID[id];
      if (!m) return '';
      return `<div class="chem-member"><img src="${m.img}" alt="${escapeHtml(m.name)}"><span class="chem-member-name" style="color:${m.color}">${escapeHtml(m.name)}</span></div>`;
    }).join('');
    const memN = g.members.length;
    const memCls = memN >= 7 ? ' large' : memN === 6 ? ' large cols3' : memN === 4 ? ' large n4' : '';
    return `<div class="chem-card"><div class="chem-name">${escapeHtml(g.name)}</div><div class="chem-body"><div class="chem-group-members${memCls}">${membersHtml}</div></div></div>`;
  };

  // 섹션 제목. firstNoBorder=true면 위 구분선·여백 제거 (그리드 첫 줄, 또는 우산 라벨 바로 아래용)
  const sec = (label, firstNoBorder, isTrack) =>
    `<div class="chem-group-section"${firstNoBorder ? ' style="margin-top:0;padding-top:0;border-top:none"' : ''}><div class="chem-group-title${isTrack ? ' chem-track-title' : ''}">${label}</div></div>`;

  // 상단 트랙(모두 포함)은 2~10명 선택일 때만 작동. 1명·전원·0명은 제외 → 그 경우 화면은 기존(일부 포함 OR)과 동일.
  const selArr = [...chemFilterMembers];
  const topActive = selArr.length >= 2 && selArr.length <= MEMBERS.length - 1;
  const allIncluded = (ids) => selArr.every(id => ids.includes(id));   // 선택집합 ⊆ 조합
  const excluded = (ids) => topActive && allIncluded(ids);             // 상단에 올라간 카드는 하단에서 중복 제외

  // ── 상단: 모두 포함 — 선택 멤버가 전부 든 조합만, 2인·그룹 통합 평면 나열(인원수 적은 순 → 같은 인원수면 채팅 합 내림차순) ──
  let topHtml = '';
  if (topActive) {
    const matched = [];
    for (const p of pairs) if (allIncluded([p.m1.id, p.m2.id])) matched.push({ size: 2, total: p.total, html: pairCardHtml(p) });
    for (const g of CHEM_GROUPS) if (allIncluded(g.members)) matched.push({ size: g.members.length, total: groupChatTotal(g), html: groupCardHtml(g) });
    matched.sort((a, b) => a.size - b.size || b.total - a.total);
    // 2명 선택 시 그 쌍이 항상 매칭되므로, '없음'은 사실상 3~10명에서만 발생
    const matchedBody = matched.length > 0
      ? matched.map(x => x.html).join('')
      : '<div class="chem-empty">조건에 맞는 케미가 없어요</div>';
    topHtml = sec('모두 포함', true, true) + matchedBody;
  }

  // ── 하단: 일부 포함 — 기존 OR 결과(상단에 올라간 카드는 제외). 우산 라벨은 상단이 떴을 때만. ──
  const botPairCards = pairs
    .filter(p => (chemFilterMembers.has(p.m1.id) || chemFilterMembers.has(p.m2.id)) && !excluded([p.m1.id, p.m2.id]))
    .map(pairCardHtml).join('');
  const botGroupSections = [...new Set(CHEM_GROUPS.map(g => g.members.length))].sort((a, b) => a - b).map(n => {
    const groups = CHEM_GROUPS
      .filter(g => g.members.length === n && g.members.some(id => chemFilterMembers.has(id)) && !excluded(g.members))
      .sort((a, b) => groupChatTotal(b) - groupChatTotal(a));   // 2인 케미와 동일하게 주고받은 채팅 합 내림차순
    if (groups.length === 0) return '';
    return `<div class="chem-group-section"><div class="chem-group-title">${n}인 케미</div><div class="chem-group-grid">${groups.map(groupCardHtml).join('')}</div></div>`;
  }).join('');

  let botHtml = '';
  if (topActive) botHtml += sec('일부 포함', false, true);   // 우산 라벨(상단과 구분하는 트랙 구분선)
  botHtml += sec('2인 케미', true);                     // 그리드 첫 줄(또는 우산 라벨 바로 아래)이라 구분선 제거
  botHtml += (botPairCards.length > 0 ? botPairCards : '<div class="chem-empty">필터 조건에 맞는 케미가 없어요</div>');
  botHtml += botGroupSections;

  const allOn = chemFilterMembers.size === MEMBERS.length;
  const memberBtns = MEMBERS.map(m => `
    <button class="filter-member ${chemFilterMembers.has(m.id) ? 'on' : ''}" data-id="${m.id}">
      <img src="${m.img}" alt="${escapeHtml(m.name)}">
    </button>
  `).join('');

  body.innerHTML = `
    <div class="chem-content">
      <div class="chem-grid">
        ${topHtml}
        ${botHtml}
      </div>
    </div>
    <div class="chem-filter-panel">
      <div class="filter-title">멤버</div>
      <div class="filter-row">
        <button class="filter-toggle-all" id="chemFilterToggle">${allOn ? '모두 해제' : '모두 선택'}</button>
        <div class="chem-filter-members" id="chemFilterMembers">${memberBtns}</div>
      </div>
    </div>
  `;

  body.querySelectorAll('#chemFilterMembers .filter-member').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      if (chemFilterMembers.has(id)) chemFilterMembers.delete(id); else chemFilterMembers.add(id);
      renderChemistry();
    });
  });
  const toggleBtn = document.getElementById('chemFilterToggle');
  if (toggleBtn) toggleBtn.addEventListener('click', () => {
    if (chemFilterMembers.size === MEMBERS.length) chemFilterMembers.clear(); else MEMBERS.forEach(m => chemFilterMembers.add(m.id));
    renderChemistry();
  });
}

// ── 명예의 전당 ── 전 항목 통산(개시 이래) 집계. 연간 경쟁은 통계 탭 연간 메달이 담당.
// 방송일수·방송시간·게시글·유튜브 = 연간 합(computeAnnualSums, 연간 탭과 동일 산식 + seed 포함)을 전 연도 누적,
// 개근·마라톤·정전 위원회 2종 = 세션 기록 기반이라 seed 미포함(2026-05 개시 이후),
// 멤버 채팅 쌍·컨텐츠·현수막 = 누적 카운터.
// 정전 위원회: 다른 멤버 방송 구간(고아 세션은 48h 상한)과의 시점·구간 겹침으로 판정.

// 구간 목록 병합 (정렬된 비중첩 구간으로)
function mergeIntervals(list) {
  const arr = [...list].sort((a, b) => a.s - b.s);
  const out = [];
  for (const iv of arr) {
    const last = out[out.length - 1];
    if (last && iv.s <= last.e) { if (iv.e > last.e) last.e = iv.e; }
    else out.push({ s: iv.s, e: iv.e });
  }
  return out;
}
// 시각 t가 병합 구간 위에 있는지 (구간은 [s, e) 반개구간)
function coversPoint(merged, t) {
  for (const o of merged) {
    if (o.s <= t && t < o.e) return true;
    if (o.s > t) break;
  }
  return false;
}
// 구간 iv에서 병합 구간과 겹치는 부분을 뺀 길이(ms)
function soloMsOf(iv, merged) {
  let total = iv.e - iv.s;
  for (const o of merged) {
    if (o.e <= iv.s) continue;
    if (o.s >= iv.e) break;
    total -= Math.min(iv.e, o.e) - Math.max(iv.s, o.s);
  }
  return total;
}

// 가장 긴 연속 방송일 (달력 날짜 키 집합 → 최장 연속 구간)
function longestStreak(dateSet) {
  const days = [...dateSet].sort();
  let best = 0, cur = 0, prev = null;
  for (const d of days) {
    const [y, mo, da] = d.split('-').map(Number);
    const t = Date.UTC(y, mo - 1, da);
    cur = (prev !== null && t - prev === 86400000) ? cur + 1 : 1;
    if (cur > best) best = cur;
    prev = t;
  }
  return best;
}

// 명전 토글 상태(세로↔수평). 세션 내 유지, localStorage 저장 안 함(새로고침 시 끔=세로로 복귀)
let hallShowRanks = false;
// 값 내림차순 dense 순위로 상위 3개 그룹 추출(값 같으면 동순위, 0은 제외). [{rank,value,members}] 최대 3개.
function hallTopRanks(getVal) {
  const distinct = [...new Set(MEMBERS.map(m => getVal(m.id)))].filter(v => v > 0).sort((a, b) => b - a);
  return distinct.slice(0, 3).map((v, i) => ({ rank: i + 1, value: v, members: MEMBERS.filter(m => getVal(m.id) === v) }));
}

function renderHall() {
  const body = document.getElementById('hallBody');
  if (!body) return;
  const now = new Date();
  const year = now.getFullYear();
  // 역대 집계(개근·마라톤)를 위해 통계 개시(2026-01)부터 현재까지 전 월을 적재 (과거 월은 localStorage 캐시)
  const monthsToLoad = [];
  const allMonths = [];
  for (let y = STATS_START_YEAR; y <= year; y++) {
    const maxMo = (y === year) ? now.getMonth() + 1 : 12;
    for (let mo = 1; mo <= maxMo; mo++) {
      const ym = `${y}-${String(mo).padStart(2,'0')}`;
      allMonths.push(ym);
      if (!statsState.data[ym] && !statsState.loadingMonths.has(ym)) monthsToLoad.push(ym);
    }
  }
  if (monthsToLoad.length > 0) {
    body.innerHTML = '<div class="loading"><div class="spinner"></div><div>명예의 전당 불러오는 중...</div></div>';
    Promise.all(monthsToLoad.map(ym => loadStatsMonth(ym))).then(() => {
      if (currentPage === 'hall') renderHall();
    });
    return;
  }

  // 통산 합산: 통계 개시 연도부터 현재까지 연간 합을 연도별로 누적 (연간 탭과 동일 산식 computeAnnualSums 재사용, seed 포함)
  const totalSums = {};
  MEMBERS.forEach(m => { totalSums[m.id] = { sessions: 0, totalDurationMs: 0, postCount: 0, cafeCount: 0, youtubeCount: 0 }; });
  for (let y = STATS_START_YEAR; y <= year; y++) {
    const ys = computeAnnualSums(y);
    MEMBERS.forEach(m => {
      const t = totalSums[m.id], s = ys[m.id];
      t.sessions += s.sessions;
      t.totalDurationMs += s.totalDurationMs;
      t.postCount += s.postCount;
      t.cafeCount += s.cafeCount;
      t.youtubeCount += s.youtubeCount;
    });
  }

  // 세션 단위 역대 집계 (개근·마라톤·정전 위원회) — '올해' 항목이 아니므로 연도 제한 없음, 연말~연초 연속 방송도 안 끊김.
  // seed는 세션별 기록이 없어 미포함(서비스 개시 이후 데이터만)
  const ORPHAN_CAP_MS = 48 * 3600000; // 종료 누락 고아 세션이 '영원히 방송 중'으로 남아 전원 판정을 오염시키는 것 방지
  const nowMs = Date.now();
  const extra = {};
  const intervals = {};
  MEMBERS.forEach(m => { extra[m.id] = { marathonMs: 0, dates: new Set() }; intervals[m.id] = []; });
  for (const ym of allMonths) {
    MEMBERS.forEach(m => {
      const ms = statsState.data[ym]?.[m.id];
      if (!ms) return;
      for (const s of (ms.sessions || [])) {
        const t = new Date(s.start).getTime();
        if (isNaN(t)) continue;
        const dk = isoToKstDateKey(s.start);
        if (dk) extra[m.id].dates.add(dk);
        let e = null;
        if (s.end) {
          e = new Date(s.end).getTime();
          if (isNaN(e) || e <= t) e = null;
        } else {
          e = Math.min(nowMs, t + ORPHAN_CAP_MS); // 진행 중 세션은 현재 시각(상한 48h)까지로 간주
          if (e <= t) e = null;
        }
        if (e === null) continue;
        intervals[m.id].push({ s: t, e });
        if (s.end) {
          const dur = e - t;
          if (dur > extra[m.id].marathonMs) extra[m.id].marathonMs = dur;
        }
      }
    });
  }

  // 정전 중단 위원회(아무도 없을 때 시작한 방송 횟수) / 정전 방지 위원회(아무도 없을 때 방송한 시간)
  const solo = {};
  MEMBERS.forEach(m => { solo[m.id] = { starts: 0, ms: 0 }; });
  MEMBERS.forEach(m => {
    const others = [];
    MEMBERS.forEach(o => { if (o.id !== m.id) others.push(...intervals[o.id]); });
    const merged = mergeIntervals(others);
    for (const iv of intervals[m.id]) {
      if (!coversPoint(merged, iv.s)) solo[m.id].starts++;
      const sm = soloMsOf(iv, merged);
      if (sm > 0) solo[m.id].ms += sm;
    }
  });

  // 멤버들을 좋아하는(다른 멤버 방송에 보낸 채팅) / 멤버들이 좋아하는(자기 방송에 받은 멤버 채팅) — chat_counts 양방향 합산
  const chemOut = {};
  const chemIn = {};
  MEMBERS.forEach(m => { chemOut[m.id] = 0; chemIn[m.id] = 0; });
  for (const [key, cnt] of Object.entries(chemCounts || {})) {
    const [fromId, toId] = key.split(':');
    if (chemOut[fromId] !== undefined) chemOut[fromId] += cnt;
    if (chemIn[toId] !== undefined) chemIn[toId] += cnt;
  }

  // 컨텐츠·현수막 왕: 시트 데이터의 멤버 표기 횟수 누적 (각 탭 랭킹과 동일 기준)
  const bannerCounts = {};
  const contentCounts = {};
  MEMBERS.forEach(m => { bannerCounts[m.id] = 0; contentCounts[m.id] = 0; });
  bannerData.forEach(b => b.members.forEach(name => { const m = MEMBERS.find(x => x.name === name); if (m) bannerCounts[m.id]++; }));
  contentData.forEach(c => c.members.forEach(name => { const m = MEMBERS.find(x => x.name === name); if (m) contentCounts[m.id]++; }));

  const categories = [
    { label: '천타버스 공무원',           desc: '방송 일수',          icon: SVG_ICONS.calendar, color: 'var(--ev-start)',   get: id => totalSums[id].sessions,                              fmt: v => `${v}일` },
    { label: '엉덩이가 무거운',           desc: '방송 시간',          icon: SVG_ICONS.clockTime,    color: 'var(--ev-start)',   get: id => totalSums[id].totalDurationMs,                       fmt: v => formatDuration(v) },
    { label: '휴방하는 것을 까먹은',       desc: '연속 방송 일수',          icon: SVG_ICONS.flame,        color: '#FF8C00',           get: id => longestStreak(extra[id].dates),                       fmt: v => `${v}일` },
    { label: '방종하는 것을 까먹은',       desc: '단일 방송 시간',          icon: SVG_ICONS.hourglass,    color: '#FF8C00',           get: id => extra[id].marathonMs,                                 fmt: v => formatDuration(v) },
    { label: '천타버스 정전 중단 위원회',  desc: '아무도 없을 때 시작한 방송',    icon: SVG_ICONS.sun,          color: '#FFDD00',           get: id => solo[id].starts,                                      fmt: v => `${v}회` },
    { label: '천타버스 정전 방지 위원회',  desc: '아무도 없을 때 방송한 시간', icon: SVG_ICONS.moon,         color: '#FFDD00',           get: id => solo[id].ms,                                          fmt: v => formatDuration(v) },
    { label: '팬과 자주 소통하는',         desc: '숲·카페 게시글',     icon: SVG_ICONS.board,        color: 'var(--ev-post)',    icon2: SVG_ICONS.coffee, color2: '#03C75A', get: id => totalSums[id].postCount + totalSums[id].cafeCount, fmt: v => `${v}개` },
    { label: '유튜브도 놓치지 않는',       desc: '유튜브 업로드',      icon: SVG_ICONS.youtube,      color: 'var(--ev-youtube)', get: id => totalSums[id].youtubeCount,                          fmt: v => `${v}개` },
    { label: '멤버들을 좋아하는',          desc: '다른 멤버 방송에서 보낸 채팅',  icon: SVG_ICONS.send,         color: '#a78bfa',           get: id => chemOut[id],                                          fmt: v => `${v.toLocaleString()}회` },
    { label: '멤버들이 좋아하는',          desc: '본인 방송에서 받은 멤버 채팅',  icon: SVG_ICONS.heartBubble,  color: '#a78bfa',           get: id => chemIn[id],                                           fmt: v => `${v.toLocaleString()}회` },
    { label: '천타버스에 충실한',          desc: '천타버스 컨텐츠 참여 횟수',    icon: SVG_ICONS.film,         color: 'var(--accent)',     get: id => contentCounts[id],                                    fmt: v => `${v}회` },
    { label: '천타버스의 위상을 드높인',    desc: '천타버스 현수막 게시 횟수',    icon: SVG_ICONS.flag,         color: 'var(--accent)',     get: id => bannerCounts[id],                                     fmt: v => `${v}회` },
  ];

  const ranksByCat = categories.map(cat => hallTopRanks(cat.get));

  const cards = categories.map((cat, ci) => {
    const ranks = ranksByCat[ci];
    let content;
    if (ranks.length === 0) {
      content = '<div class="hall-empty">아직 집계 전이에요</div>';
    } else {
      const g1 = ranks[0], g2 = ranks[1], g3 = ranks[2];
      const isSolo = g1.members.length === 1;
      const psV = 64;                 // 끔(세로): 단독·공동 모두 64
      const psH = isSolo ? 64 : 48;   // 켬(수평): 단독 64 / 공동 48
      // 끔(세로): 1위 사진+이름 + "설명: 값"
      const vWinners = g1.members.map(w => `
            <div class="hall-v-w">
              <img style="width:${psV}px;height:${psV}px" src="${w.img}" alt="${escapeHtml(w.name)}">
              <span class="hall-v-name" style="color:${w.color}">${escapeHtml(w.name)}</span>
            </div>`).join('');
      const vLayout = `
          <div class="hall-v">
            <div class="hall-v-winners">${vWinners}</div>
            <div class="hall-v-val"><span class="hall-v-desc">${cat.desc}:</span> ${cat.fmt(g1.value)}</div>
          </div>`;
      // 켬(수평): 설명(상단 전체폭, 우측정렬) + [1위 사진 | 금/은/동 1~3위 행(이름 좌·기록 우)]
      const photos = g1.members.map(w => `<img style="width:${psH}px;height:${psH}px" src="${w.img}" alt="${escapeHtml(w.name)}">`).join('');
      const row = (g, cls) => g ? `
            <div class="hall-row ${cls}">
              <span class="hall-r-name">${g.members.map(w => `<span style="color:${w.color}">${escapeHtml(w.name)}</span>`).join(' · ')}</span>
              <span class="hall-r-val">${cat.fmt(g.value)}</span>
            </div>` : '';
      const hLayout = `
          <div class="hall-h">
            <div class="hall-desc">${cat.desc}</div>
            <div class="hall-h-body">
              <div class="hall-photos">${photos}</div>
              <div class="hall-data">
                ${row(g1, 'm1')}${row(g2, 'm2')}${row(g3, 'm3')}
              </div>
            </div>
          </div>`;
      content = vLayout + hLayout;
    }
    return `
      <div class="hall-card">
        <div class="hall-cat"><span class="hall-cat-icon" style="color:${cat.color}">${cat.icon}</span>${cat.icon2 ? `<span class="hall-cat-icon" style="color:${cat.color2}">${cat.icon2}</span>` : ''}<span>${cat.label}</span></div>
        <div class="hall-content">${content}</div>
      </div>
    `;
  }).join('');

  body.innerHTML = `
    <div class="hall-bar">
      <span class="hall-bar-label">2 · 3위 보기</span>
      <button class="notify-switch ${hallShowRanks ? 'on' : ''}" id="hallRankToggle" type="button" aria-label="2 · 3위 보기"></button>
    </div>
    <div class="hall-grid">${cards}</div>
  `;
  // 끔(세로)·켬(수평) 양쪽에서 각 카드 콘텐츠 높이를 실측해, 가장 큰 값을 전 카드 공통 높이로 → 토글해도·카드끼리도 높이 동일
  const contentEls = body.querySelectorAll('.hall-content');
  contentEls.forEach(el => { el.style.minHeight = ''; });
  let maxH = 0;
  body.classList.remove('show-ranks');
  contentEls.forEach(el => { if (el.offsetHeight > maxH) maxH = el.offsetHeight; });
  body.classList.add('show-ranks');
  contentEls.forEach(el => { if (el.offsetHeight > maxH) maxH = el.offsetHeight; });
  contentEls.forEach(el => { el.style.minHeight = maxH + 'px'; });
  body.classList.toggle('show-ranks', hallShowRanks);   // 실제 토글 상태로 복원
  const rankToggle = document.getElementById('hallRankToggle');
  if (rankToggle) rankToggle.addEventListener('click', () => {
    hallShowRanks = !hallShowRanks;
    body.classList.toggle('show-ranks', hallShowRanks);
    rankToggle.classList.toggle('on', hallShowRanks);
  });
  lastHallUpdate = new Date();
  updateHeaderCenter();
}

function initMembersTabs() {
  const wrap = document.getElementById('membersTabsWrap');
  if (!wrap) return;
  const crewTab = `<button class="members-tab members-tab-crew active" data-tab="crew"><img src="Favicon.webp" alt="크루"></button>`;
  const memberTabs = MEMBERS.map(m => `<button class="members-tab" data-tab="${m.id}" title="${m.name}"><img src="${m.img}" alt="${m.name}"></button>`).join('');
  wrap.innerHTML = crewTab + memberTabs;
  wrap.querySelectorAll('.members-tab').forEach(btn => {
    btn.addEventListener('click', () => selectMembersTab(btn.dataset.tab));
  });
  renderMembersBody();
}

function selectMembersTab(tabId) {
  membersState.selectedTab = tabId;
  document.querySelectorAll('.members-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tabId);
  });
  renderMembersBody();
}

function renderMembersBody() {
  const body = document.getElementById('membersBody');
  if (!body) return;
  if (membersState.selectedTab === 'crew') {
    renderMembersCrew(body);
  } else {
    renderMembersProfile(body, membersState.selectedTab);
  }
}

  const ctDays = Math.floor((Date.UTC(k.getUTCFullYear(), k.getUTCMonth(), k.getUTCDate()) - CT_FORMATION.getTime()) / 86400000);   // 출범(2025-11-30) 경과일 — getTodayCelebrations와 동일 산식

    <div class="members-crew">

      </div>

        <div class="crew-act-li"><span class="dot">•</span><span><span class="d">2025년 11월 30일</span> — 결성${ctDays > 0 ? ` <span class="tag">(D+${ctDays}일)</span>` : ''}</span></div>
        <div class="crew-act-li"><span class="dot">•</span><span><span class="d">2026년 6월 27일</span> — 추가멤버 면접</span></div>
        <div class="crew-act-sub">정기 활동</div>
        <div class="crew-act-li"><span class="dot">•</span><span>매월 초 — 천타버스 티타임 <span class="tag">(2026년 1월~)</span></span></div>
        <div class="crew-act-li"><span class="dot">•</span><span>매월 후반 — 강제 모캡합방 <span class="tag">(2026년 3월~)</span></span></div>
        <div class="crew-act-sub">비정기 활동</div>
        <div class="crew-act-li"><span class="dot">•</span><span>VRChat · 풀트래킹 합방</span></div>
        <div class="crew-act-li"><span class="dot">•</span><span>디코 · 종겜 합방 등</span></div>
        <div class="crew-act-sub">크루 대전 전적</div>
        <div class="crew-act-li"><span class="dot">•</span><span><span class="d">2026년 1월 10일</span> — vs 털즈란 패배 (VRC 야구)</span></div>
        <div class="crew-act-li"><span class="dot">•</span><span><span class="d">2026년 1월 15일</span> — vs 버인협회 패배 (롤)</span></div>
        <div class="crew-act-more"><button type="button" onclick="history.replaceState(null,'','#content');switchPage('content')">컨텐츠 더보기 →</button></div>

function renderMembersProfile(body, memberId) {
  const m = MEMBER_BY_ID[memberId];
  if (!m) { body.innerHTML = '<div class="loading"><div>멤버 정보를 찾을 수 없어요</div></div>'; return; }
  const bd = MEMBER_BIRTHDAYS[memberId];
  const info = MEMBER_INFO[memberId];
  const links = MEMBER_LINKS[memberId];

  let quickHtml = '';
  if (links) {
    const qLinks = [];
    const station = links.common?.['방송국'];
    if (station) qLinks.push({ url: typeof station === 'string' ? station : station.url, icon: SVG_ICONS.soop, title: '방송국', cls: 'quick-soop' });
    const yt = links.common?.['유튜브'];
    if (yt) qLinks.push({ url: typeof yt === 'string' ? yt : yt.url, icon: SVG_ICONS.youtube, title: '유튜브', cls: 'quick-youtube' });
    const cafe = links.common?.['팬카페'];
    if (cafe) qLinks.push({ url: typeof cafe === 'string' ? cafe : cafe.url, icon: SVG_ICONS.coffee, title: '팬카페', cls: 'quick-naver' });
    quickHtml = qLinks.map(l => `<a class="members-quick-btn ${l.cls}" href="${escapeHtml(l.url)}" target="_blank" rel="noopener" title="${l.title}">${l.icon}</a>`).join('');
    quickHtml += `<button class="members-quick-btn" id="membersGoLinks" title="관련 링크">${SVG_ICONS.link}</button>`;
  }

  const headerHtml = `
    <div class="members-profile-header">
      <img class="members-profile-avatar" src="${m.img}" alt="${escapeHtml(m.name)}" style="border-color:${m.color}">
      <div class="members-profile-info">
        <div class="members-profile-name" style="color:${m.color}">${escapeHtml(m.name)}</div>
        ${info ? `<div class="members-profile-eng">${escapeHtml(info.engName)}</div>` : ''}
      </div>
      ${quickHtml ? `<div class="members-profile-quick">${quickHtml}</div>` : ''}
    </div>
  `;

  let infoHtml = '';
  if (info) {
    const skip = v => !v || v.includes('해당없음') || v.includes('알려져있지');
    const pairedRows = [
      ['나이', calcAge(memberId, info.age)],
      ['생일', bd ? bd.display : ''],
      ['키', info.height],
      ['MBTI', info.mbti],
      ['팬네임', info.fanName],
      ['다른 소속', info.group],
    ].filter(r => !skip(r[1]));
    const firstStreamVal = calcDaysSince(info.firstStream);
    const pairedHtml = pairedRows.map(([label, value]) => `<div class="members-info-row"><span class="members-info-label">${escapeHtml(label)}</span><span class="members-info-value">${escapeHtml(value)}</span></div>`).join('');
    const firstStreamHtml = !skip(firstStreamVal) ? `<div class="members-info-row-full"><span class="members-info-label">첫 방송일</span><span class="members-info-value">${escapeHtml(firstStreamVal)}</span></div>` : '';
    const interviewHtml = info.vote ? `<div class="members-info-row-full"><span class="members-info-label">면접 득표수/득표율</span><span class="members-info-value">${escapeHtml(info.vote)}</span></div>` : '';
    infoHtml = `<div class="members-info-section"><div class="members-info-title">프로필</div><div class="members-info-grid">${pairedHtml}${firstStreamHtml}${interviewHtml}</div></div>`;
  }

  const photoSrc = m.img.replace('members/', 'profile/');
  body.innerHTML = `
    <div class="members-profile">
      <div class="members-profile-photo"><img src="${photoSrc}" alt="${escapeHtml(m.name)}" onerror="this.parentNode.style.display='none'"></div>
      <div class="members-profile-main">
        ${headerHtml}
        ${infoHtml}
      </div>
    </div>
  `;

  const goLinksBtn = document.getElementById('membersGoLinks');
  if (goLinksBtn) goLinksBtn.addEventListener('click', () => { history.replaceState(null, '', '#links'); switchPage('links'); });

  const photoBox = body.querySelector('.members-profile-photo');
  const mainBox = body.querySelector('.members-profile-main');
  profilePhotoSizer = () => {
    if (!photoBox || !mainBox || !photoBox.isConnected) return;
    if (window.innerWidth <= 640) {
      photoBox.style.height = '';
      photoBox.style.width = '';
      return;
    }
    const h = mainBox.offsetHeight;
    photoBox.style.height = h + 'px';
    photoBox.style.width = Math.round(h * 3 / 4) + 'px';
  };
  profilePhotoSizer();
}
