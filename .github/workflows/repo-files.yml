# 레포 파일 목록(repo-files.json) — 올릴 때마다 레포의 파일 경로·크기를 적어 사이트에 둔다(2026-10-30 Crenop Q1 '가' — 자료 관리 탭 사진부터).
# 시트 스크립트(kv_fix.gs repoFileList)가 이 파일 하나를 받아 사진 탭에 새 사진을 더하고 안 쓰는 사진을 센다. 종전엔 시트 스크립트가 GitHub API에
# 직접 물었는데 느리고 가끔 실패했다(Crenop '너무느리고 실패할때도 있어' — 로그인 없는 조회는 주소마다 시간당 60번이고 구글 서버는 그 주소를 나눠 쓴다).
# 목록이 바뀐 때만 올린다(시각을 적지 않는다 — 적으면 올릴 때마다 한 번 더 올라간다). 이 작업이 올린 것은 이 작업을 다시 부르지 않는다(GitHub 규칙).
# 파일 하나로 둔다 — GitHub 웹 화면에서 'Create new file'로 .github/workflows/repo-files.yml 이름으로 만든다(faces.yml과 같다).
# 손으로 돌리기: 레포의 Actions 탭 → repo-files → Run workflow(처음 한 번은 이것으로 목록을 만든다).
name: repo-files
on:
  push:
    paths-ignore:
      - repo-files.json
  workflow_dispatch:
permissions:
  contents: write   # 바뀐 목록을 레포에 올린다
  pages: write      # 올린 뒤 사이트 다시 만들기를 청한다(아래 마지막 줄)
concurrency: repo-files   # 잇달아 올리면 차례로 — 뒤 차례는 앞 차례가 올린 목록 위에서 돈다
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # 올린 그 판이 아니라 지금 맨 끝 판(앞 차례가 올린 목록 포함 — 올리기가 밀리지 않게)
      - name: 목록 만들기
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          OUT = 'repo-files.json'
          paths = [p for p in subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0') if p and p != OUT]
          files = [{'path': p, 'size': os.path.getsize(p)} for p in sorted(paths) if os.path.isfile(p)]
          with open(OUT, 'w', encoding='utf-8', newline='\n') as f:
              json.dump({'files': files}, f, ensure_ascii=False, separators=(',', ':'))
              f.write('\n')
          print(f'파일 {len(files)}개')
          PY
      - name: 바뀐 때만 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add repo-files.json
          if git diff --cached --quiet; then echo '목록 그대로'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git commit -m '레포 파일 목록 갱신'
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true   # 이 작업이 올린 것으로 사이트가 저절로 다시 만들어지지 않는 설정이어도 다시 만들게
