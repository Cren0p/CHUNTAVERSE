<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>천타버스의 첫 1년</title>
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAAlklEQVR4nO3QsQ2AMBRDQTokahZkf3YIM3wBMSFXvN6+5Whnm7klPSAdgPSAdADSA9IBSA9I1x1g3fZSAAAAGBugehgAAABjA9w9DAAAgLEAqgcAAADwL4CnwQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA3wWoHno7AAAAAAAAAEA/gNEDkB6QDkB6QDoA6QHppge4AIoLkXT2Opv5AAAAAElFTkSuQmCC">
<style>
/* 둘째 판(2026-11-20 Crenop '만들어 줘') — 내용·셈은 첫 판(year_template.html)과 같고 모양만 사이트(chuntaverse.com) 문법으로.
   색·그림자·유리 값은 사이트 :root에서 옮긴 것(사이트가 바꾸면 같이 본다). */
:root {
  --bg: #070a14;
  --surface: #101628;
  --surface2: #171f33;
  --border: #242e4c;
  --divider: rgba(36,46,76,0.6);
  --text: #e2e8f0;
  --text2: #cbd5e1;
  --text3: #94a3b8;
  --muted: #7c8aa3;
  --accent: #61FFEC;
  --amber: #fbbf24;
  --medal-gold: #fbbf24;
  --medal-silver: #cbd5e1;
  --medal-bronze: #d98e4d;
  /* 명전 칸 그림 색 — 사이트 :root의 같은 이름 토큰(사이트가 var(--이름)으로 칠한다) */
  --ev-start: #60a5fa; --ic-orange: #FF8C00; --ev-yellow: #fbbf24; --ev-post: #34d399; --ev-cafe: #03C75A; --ev-youtube: #ef4444; --ev-chat: #a78bfa;
  /* 분야 그림 색 — 사이트 종류 그림(.cal-tag)의 태그별 고유색 */
  --tag-white: #ffffff; --tag-mc-handle: #8B5A2B; --tag-mc-head: #4AEDD9; --tag-steam: #66C0F4; --tag-pubg: #F1AA03; --tag-lol: #C89B3C; --tag-wak: #00C6A7; --tag-music: #fbbf24;
  --cell: #172238;                        /* 잔디의 빈 칸 · 비율 막대 바탕 */
  --cell-future: rgba(255,255,255,0.16);
  --g1: rgba(97,255,236,0.22);
  --g2: rgba(97,255,236,0.42);
  --g3: rgba(97,255,236,0.66);
  --sh-box: 0 1px 2px rgba(0,0,0,0.55), 0 8px 24px rgba(0,0,0,0.38);
  --sh-panel: 0 30px 80px rgba(0,0,0,0.75), 0 4px 14px rgba(0,0,0,0.5);
  --glass-panel: rgba(16,22,40,0.7);
  --glass-sat: 1.7;
  --content-glow: rgba(97,255,236,0.12);
  --lb-overlay: rgba(3,5,10,0.78);        /* 크게 보기 뒤 가림막 — 사진을 보는 창이라 사이트 창(0.5)보다 짙게 */
  --scrub: rgba(97,255,236,0.22);         /* 이동 막대에서 지금 보이는 구간 */
  --scrollbar-thumb: rgba(226,232,240,0.14); --scrollbar-thumb-hover: rgba(226,232,240,0.3);   /* 크게 보기 창의 스크롤바 손잡이 — 사이트 :root의 같은 이름 토큰(다크) */
  --need-lo: rgba(97,255,236,0.2); --need-hi: rgba(97,255,236,0.9); --need-glow: rgba(97,255,236,0.45);   /* 눌러야 할 단추의 번지는 테두리(옅을 때 · 짙을 때 · 번짐) */
  /* 멤버 색 — 사이트 MEMBERS와 같은 값·같은 차례 */
  --m0: #43EAF6; --m1: #FFDE9B; --m2: #DBDCE5; --m3: #F5D3FE; --m4: #8D4BD6; --m5: #FFCFB7; --m6: #EA4335;
  --m7: #BFEF90; --m8: #366CD8; --m9: #F8C24F; --m10: #FFFFFF; --m11: #A8D6FF; --m12: #30BBBA;
}
* { box-sizing: border-box; }
html { background: var(--bg); scrollbar-gutter: stable; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: inherit; text-decoration: none; }
button { font: inherit; }
.wrap { width: min(1560px, calc(100% - 80px)); margin: 0 auto; }
.eyebrow { font-size: 13px; letter-spacing: 0.18em; color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }
.sec { margin: 12px 0 0; font-size: 40px; font-weight: 800; line-height: 1.3; font-variant-numeric: tabular-nums; }
.sec em { font-style: normal; color: var(--accent); }

/* 첫 화면 — 왼쪽 이름, 오른쪽 한 해 잔디 */
/* 첫 화면은 화면 한 장을 다 쓴다 — 사진 구역이 아래로 비치지 않게(2026-11-24 Crenop '첫화면에서는 아래쪽이 안보이고') */
.hero { display: grid; grid-template-columns: 380px minmax(0, 1fr); column-gap: 56px; align-items: center; align-content: center; min-height: 100vh; padding: 64px 0 80px; }
.hero-logo { display: block; width: 100%; height: auto; margin-bottom: 36px; }
h1 { font-size: 46px; font-weight: 800; line-height: 1.2; margin: 10px 0 14px; letter-spacing: -0.01em; white-space: nowrap; }
.today { margin: 0; color: var(--text2); font-variant-numeric: tabular-nums; }
.year { display: grid; row-gap: 4px; }
.row { display: grid; grid-template-columns: 48px repeat(31, minmax(0, 1fr)); column-gap: 4px; align-items: center; }
.row .lab { grid-column: 1; font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1; }
.row .note { font-size: 12px; line-height: 1; color: var(--muted); text-align: right; padding-right: 6px; white-space: nowrap; }
.row.cap { margin-top: 6px; }
.row.cap .note { grid-column: 2 / 32; padding-right: 0; color: var(--amber); font-size: 13px; }
.cell { display: block; aspect-ratio: 1; background: var(--cell); }
.cell.fut { background: transparent; box-shadow: inset 0 0 0 1px var(--cell-future); }
/* 잔디: 그날 방송을 시작한 멤버 ÷ 그날 총원 — 50% 밑 · 50% · 75% · 모두. 오늘 칸은 따로 칠하지 않는다(칠한 칸이 테두리만 남은 칸으로 바뀌는 자리가 오늘) */
.cell.g1 { background: var(--g1); }
.cell.g2 { background: var(--g2); }
.cell.g3 { background: var(--g3); }
.cell.g4 { background: var(--accent); }
.cell.bday { box-shadow: inset 0 0 0 2px var(--amber); }

/* 열세 달 — 왼쪽 달 이름은 그 달을 읽는 동안 붙어 있다. 위에 붙는 띠(로고 · 달 고르기 · 남은 날)는 뺐다(2026-11-21 Crenop '제일위 상단바는 없어도 되지 않나') — 사진 구역으로 가는 길은 첫 화면의 단추뿐이다 */
/* 열세 달이 가로 띠 하나(2026-11-24 Crenop '사진들은 천천히 우측으로 넘어가는 형태로 수동도 되고 자동도 되고 그건 유저가 선택하도록' → 목업을 보고 '괜찮은것 같아' · '코드에 넣어주고').
   사진 구역(.story)은 띠 길이만큼 길고, 그 안의 한 화면(.pin)이 붙어 있는 동안 내린 만큼 띠(.track)가 왼쪽으로 간다. 자동 = 페이지가 스스로 내려가는 것.
   달 머리(.mh — 달 이름 · 머리 문장)는 그 달이 지나가는 동안 왼쪽에 붙어 있다(스크립트가 민다 — 띠를 transform으로 옮겨서 sticky가 안 먹는다) */
.story { position: relative; }
.pin { position: sticky; top: 0; height: 100vh; overflow: hidden; }
.track { position: relative; display: flex; align-items: flex-start; width: max-content; will-change: transform; }
.month { flex: none; }
.month + .month { margin-left: 56px; padding-left: 56px; border-left: 1px solid var(--border); }
/* 달을 넘겨 합친 칸(손 배치 MERGE — 2월의 릴동파 칸에 3월 1일 꼭따라이)이 끝난 다음 달: 칸이 두 달에 걸쳐 있어 달 사이 선을 칸 사이에 둘 수 없다.
   그래서 이 달은 띠에 16px 사이로만 이어 붙이고, 달 머리(달 이름 · 문구)는 스크립트가 그 칸 안의 이 달 사진 왼쪽 끝 위로 옮긴다.
   달 사이 선은 머리 줄에만 짧게 긋는다(--jx = 선 자리, 스크립트가 넣음) — 2026-11-25 Crenop '3월 표식도 꼭다라이 사진 위에 붙이면 될텐데'. 짧은 선은 Claude가 정함 */
.month.join { position: relative; margin-left: 16px; padding-left: 0; border-left: 0; }
.month.join::before { content: ''; position: absolute; left: var(--jx, 0); top: 0; height: 76px; border-left: 1px solid var(--border); }
.mh { position: relative; display: flex; align-items: center; width: max-content; height: 64px; }
.ml { display: flex; flex: none; align-items: baseline; column-gap: 8px; }
.ml b { font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.ml .y { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
/* 상단 문구(달 이름 오른쪽 글) — 문구마다 제 사진 칸의 왼쪽 끝 위에서 그 칸과 같이 들어오고, 달 이름 옆에 닿으면 거기 붙었다가, 칸이 나갈 때(또는 다음 문구가 올 때) 같이 밀려 나간다
   (2026-11-25 Crenop '상단 문구는 그 사진과 같이 등장했다가 같이 사라지는걸로'). .mcaps는 달 머리 줄에 겹친 자리이고, 스크립트가 달 이름 오른쪽부터만 보이게 자른다(clip-path — 문구가 달 이름 밑으로 지나가지 않게).
   이름을 cap · caps로 두면 안 된다 — 잔디 아랫줄(.row.cap '11월 30일, 한 살')에도 걸려 그 줄이 첫 화면 왼쪽 위로 튀어나간다(2026-11-25 Crenop '첫화면 좌상단에 주황색 글씨는 뭐야?') */
.mcaps { position: relative; height: 64px; margin-top: -64px; pointer-events: none; }
.mcap { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; justify-content: center; width: max-content; height: 64px; }
.mcap h3 { margin: 0; font-size: 20px; font-weight: 700; line-height: 28px; white-space: nowrap; }
.said { margin: 0; font-size: 14px; line-height: 22px; color: var(--text2); white-space: nowrap; }
/* 조작부 — 붙은 화면의 오른쪽 위. 바탕을 화면 오른쪽 끝까지 깔아, 다음 달 머리가 오른쪽에서 올 때 이 밑에 가려 있다가 왼쪽 끝에서 나온다(오른쪽 여백은 스크립트가 띠 여백과 맞춘다) */
.ctl { position: absolute; top: 0; right: 0; z-index: 2; display: flex; align-items: center; column-gap: 16px; height: 92px; padding: 16px 40px 12px 24px; background: var(--bg); }
.btn { display: inline-flex; align-items: center; justify-content: center; column-gap: 8px; height: 36px; padding: 0 14px; font-size: 13px; font-weight: 700; line-height: 1; color: var(--text); background: var(--surface2); border: 1px solid var(--border); cursor: pointer; }
.btn:hover, .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.btn svg { display: block; width: 12px; height: 12px; fill: currentColor; }
.spd { display: flex; align-items: center; column-gap: 4px; font-size: 12px; color: var(--muted); }
.spd span { margin-right: 4px; }
.spd .btn { padding: 0 12px; }
#auto { min-width: 88px; }
#auto .i-pause, html.auto #auto .i-play { display: none; }
html.auto #auto .i-pause { display: block; }
/* '추억 돌아보기' — 첫 화면에서는 이것을 눌러야 사진 구역으로 넘어간다(html.gate인 동안 아래로 못 내려간다. 2026-11-24 Crenop '추억 돌아보기를 눌러야만 사진쪽으로 넘어가게 … 버튼을 강조해줘').
   누르기 전에는 민트 테두리가 숨쉬듯 번진다 — 천랜달의 '눌러야 할 단추' 효과(needSelectPulse: 2px 옅게 ↔ 4px 짙게 + 번짐, 1.4초)를 이 페이지의 민트로 옮긴 것(같은 날 '천랜달에서 클릭해야하는 버튼 테두리로 강조하던 효과') */
/* 첫 화면 단추 둘(2026-11-25 Crenop '시작화면 버튼도 2개로 나누고 보통 속도로 추억 회상하기, 빠른 속도로 추억 회상하기 각각 예상 시간을 적어주면 좋을것 같아' · '양식은 버튼 밑에 "예상 시간: NN분"'):
   위아래로 놓고 폭을 같게(긴 쪽에 맞춤), 예상 시간은 단추 밑 왼쪽 — 위아래 배치 · 같은 폭 · 왼쪽 맞춤은 Claude가 정함(왼쪽 기둥 380px에 둘이 옆으로 안 들어간다) */
.hero-go { display: inline-grid; row-gap: 16px; margin-top: 28px; }
.hero-go1 { display: grid; row-gap: 8px; }
.hero-time { margin: 0; font-size: 13px; line-height: 18px; color: var(--text2); font-variant-numeric: tabular-nums; }
.hero-auto { width: 100%; height: 44px; padding: 0 20px; font-size: 14px; color: var(--accent); border-color: var(--accent); }
html.gate { overflow: hidden; }
html.gate .hero-auto { animation: needPress 1.4s ease-in-out infinite; }
@keyframes needPress { 0%, 100% { box-shadow: 0 0 0 2px var(--need-lo); } 50% { box-shadow: 0 0 0 4px var(--need-hi), 0 0 20px var(--need-glow); } }
html.gate.still .hero-auto { animation: none; box-shadow: 0 0 0 3px var(--need-hi); }
/* 배경음악(2026-11-24 Crenop '유튜브 배경음악을 넣었으면 해 음소거 가능하도록 하고' → '그냥 배경음악 음소거랑 볼륨 조절 기능만 있으면 되는데') — 조작은 음소거 단추와 볼륨 막대뿐(.vol).
   유튜브 약관: 플레이어는 200×200 이상으로 페이지에 보여야 하고, 가리거나 숨긴 채 소리만 틀 수 없다 — 그래서 플레이어(.bgm)는 감추지 않고 페이지 맨 아래(한 살 문장 아래)에 가장 작은 200×200으로 둔다
   (같은 날 Crenop '플레이어는 크기는 최소로 두고 어디 숨겨두면 되지 않을까?' — 처음에는 첫 화면에 356×200으로 두었다). 아예 안 보이게 하는 것(display: none · 화면 밖으로 빼기 · 다른 것으로 덮기 · 더 작게)은 약관에 어긋난다.
   조작 칸(.vol)은 화면 오른쪽 아래에 늘 떠 있다. 사진 구역에서는 아래 줄(.nav)의 오른쪽 끝 자리와 겹치게 맞췄다(높이 24 · 아래 10 — 아래 줄은 그만큼 짧아진다) */
/* 플레이어 자리(2026-11-25 Crenop '맨하단에 유튜브 창 나오는거 어떻게 잘 못숨기려나?' → 약관 때문에 숨길 수 없어 케이크 옆 '배경음악' 칸에 두었다가 '마지막은 케잌이 주인공이어야' →
   (가) 맨 끝 · '배경음의 존재를 숨기고 싶어'): 케이크 아래, 끝 구역 다음의 맨 끝에 플레이어만 — 이름표 · 곡 이름은 두지 않는다. 가운데 · 아래 120은 그 전의 맨 아래 자리 그대로 */
.bgm { width: 200px; height: 200px; margin: 0 auto 120px; background: var(--surface2); }
/* 띠 맨 앞의 영상 칸(.pic.vid — 사진 칸과 같은 자리 잡기, 누르면 재생 · 멈춤) */
.pic.vid { cursor: pointer; }
.pic.vid video { display: block; width: 100%; height: 100%; background: var(--surface2); }
.bgm[hidden], .vol[hidden] { display: none; }
.bgm iframe { display: block; }
.vol { position: fixed; right: 40px; bottom: 10px; z-index: 45; display: flex; align-items: center; column-gap: 6px; height: 24px; padding-right: 10px; background: var(--surface2); border: 1px solid var(--border); }
.vol button { display: flex; align-items: center; justify-content: center; width: 26px; height: 22px; padding: 0; color: var(--text2); background: transparent; border: 0; cursor: pointer; }
.vol button:hover, html.snd .vol button { color: var(--accent); }
.vol svg { display: block; width: 14px; height: 14px; fill: currentColor; }
#snd .i-on, html.snd #snd .i-off { display: none; }
html.snd #snd .i-on { display: block; }
.vol input { width: 88px; height: 22px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
.vol input::-webkit-slider-runnable-track { height: 4px; background: var(--border); }
.vol input::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 14px; margin-top: -5px; background: var(--text2); }
.vol input::-moz-range-track { height: 4px; background: var(--border); }
.vol input::-moz-range-thumb { width: 8px; height: 14px; background: var(--text2); border: 0; }
html.snd .vol input::-webkit-slider-thumb { background: var(--accent); }
html.snd .vol input::-moz-range-thumb { background: var(--accent); }
/* 아래 줄 — 왼쪽 끝 '첫 화면'(띠의 앞) · 이동 막대 · 오른쪽 끝 '통계'(띠의 뒤). 이동 막대는 띠 전체를 줄인 것: 칸 = 달(폭은 그 달의 길이만큼), 민트 틀 = 지금 화면에 보이는 구간.
   누르거나 끌면 그 자리로 간다(2026-11-24 Crenop '스크롤바를 두거나 해서 수동으로 원하는 곳으로 이동도 가능하게' · '초기화면과 아래쪽 통계 화면으로 바로 갈수 있는 버튼') */
.nav { position: absolute; left: 40px; right: 40px; bottom: 10px; z-index: 2; display: flex; column-gap: 12px; height: 24px; }
.nav .btn { flex: none; height: 24px; padding: 0 10px; font-size: 12px; }
.bar { position: relative; flex: 1; min-width: 0; display: flex; background: var(--surface); border: 1px solid var(--border); cursor: pointer; touch-action: none; user-select: none; }
.seg { flex: none; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 12px; font-weight: 600; line-height: 1; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none; }
.seg + .seg { border-left: 1px solid var(--border); }

  if (!ytReady || !bgmOn) { const v = introV(); if (v && introOn) v.muted = bgmMute; return; }   // 준비되면 onReady가, 틀기로 하면 startMusic · toggleAuto가 이 상태대로 맞춘다
  if (bgmMute || introOn) yt.mute(); else { yt.unMute(); yt.playVideo(); }   // 첫 화면 단추로 영상이 도는 동안은 배경음악을 줄인다
  const v = introV(); if (v && introOn) v.muted = bgmMute;   // 영상 소리도 음소거를 따른다
}
function setMute(on) { bgmMute = on; byPause = false; applySound(); }
if (BGM_OK) {
  bgm.hidden = vol.hidden = false; applySound();
  window.onYouTubeIframeAPIReady = () => { yt = new YT.Player('bgmP', { width: 200, height: 200, videoId: BGM_ID, host: 'https://www.youtube-nocookie.com',
    playerVars: { start: BGM_FROM, playsinline: 1, rel: 0, origin: location.origin },   // 되풀이는 곡이 끝날 때(상태 0) 스스로 — 곡을 갈아 끼우므로 유튜브의 되풀이(loop · playlist)는 쓰지 않는다
    events: { onReady: () => { ytReady = true; yt.setVolume(+volR.value); applySound(); songSwitch(); },
      // 플레이어를 직접 눌러 틀거나 멈춘 것도 조작 칸에 비춘다: 멈추면 음소거 모양, 다시 틀면 풀린 모양
      onStateChange: e => {
        if (e.data === 0) { yt.seekTo(SONGS[songCur].from, true); yt.playVideo(); }   // 곡이 끝나면 그 곡을 처음(앞의 무음을 건너뛴 자리)부터 되풀이
        else if (e.data === 1) { if (yt.getCurrentTime() < SONGS[songCur].from - 0.5) yt.seekTo(SONGS[songCur].from, true);   // 0초로 돌아왔을 때
          const first = !bgmOn; bgmOn = true; if (byPause) setMute(false); else if (first) applySound(); }
        else if (e.data === 2 && !bgmMute) { bgmMute = byPause = true; applySound(); } },
      // 커버곡 영상을 못 틀면(유튜브가 막음 등) 그 곡은 빼고 처음 곡으로 돌아간다 — 음악이 아예 멈추지 않게
      onError: e => { ytErr = e.data; const g = SONGS[songCur]; if (songCur && !g.bad) { g.bad = true; clearInterval(songFade); songBusy = false; songCur = 0; yt.loadVideoById({ videoId: BGM_ID, startSeconds: songPos[0] }); yt.setVolume(+volR.value); songWant = -1; songCheck(); } } } }); };
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  snd.addEventListener('click', () => setMute(!bgmMute));
  volR.addEventListener('input', () => { if (ytReady) yt.setVolume(+volR.value); if (bgmMute && +volR.value > 0) setMute(false); });
}
// 첫 화면 단추: 띠 맨 앞(영상 칸)으로 내려가 영상을 소리와 함께 틀고, 끝나면 배경음악과 가로 넘김을 시작한다(2026-11-25 Crenop '추가할 영상은 추억회상하기 버튼을 눌렀을때
//   재생되고 나서 기존의 가로스크롤로 연결하면 됨' · '가로스크롤 맨처음에 추가하면 됨'). 영상을 못 읽으면(파일이 없음 등) 곧바로 시작한다.
//   영상이 도는 동안 '자동'을 누르거나 손으로 옮기면 그때부터는 평소대로 — 영상 칸이 화면 밖으로 나가면 영상을 멈춘다(place). 영상 소리는 조작 칸의 음소거를 따르고, 배경음악이 이미 돌고 있으면 영상 동안만 줄인다
function startMusic() { if (BGM_OK && !bgmOn) { bgmOn = true; applySound(); songSwitch(); } }
function startRecall() {
  unlock(); setAuto(false);
  const go = () => { sync(); const v = introV();
    const after = () => { if (!introOn) return; introOn = false; applySound(); startMusic(); if (!auto && sx < 2) setAuto(true); };
    if (!v || v.error) { introOn = true; return after(); }
    introOn = true; v.onended = v.onerror = after; v.currentTime = 0; v.muted = bgmMute; applySound();
    const p = v.play(); if (p) p.catch(() => { v.muted = true; v.play().catch(after); }); };
  if (scrollY < storyTop - 1) { let done = false; const g = () => { if (done) return; done = true; removeEventListener('scrollend', g); go(); };
    addEventListener('scrollend', g); setTimeout(g, 1500); scrollTo({ top: storyTop, behavior: 'smooth' }); }
  else { scrollTo({ top: storyTop, behavior: 'instant' }); go(); }
}
// 띠 밖(첫 화면 · 통계)이거나 띠 끝에서 누르면 띠의 처음으로 간 뒤 시작한다
function toggleAuto() {
  if (auto) return setAuto(false);
  introOn = false; unlock();
  if (BGM_OK && !bgmOn) { bgmOn = true; applySound(); songSwitch(); }   // 음악은 누른 그 자리에서 시작한다(음소거해 두었으면 소리 없이)
  const begin = () => { sync(); setAuto(true); };
  if (scrollY < storyTop - 1) {   // 첫 화면에서: 가까우니 부드럽게 내려간 뒤 시작
    let done = false; const go = () => { if (done) return; done = true; removeEventListener('scrollend', go); begin(); };
    addEventListener('scrollend', go); setTimeout(go, 1500);
    scrollTo({ top: storyTop, behavior: 'smooth' });
  } else { if (scrollY > storyTop + travel + 1 || sx >= travel - 1) scrollTo({ top: storyTop, behavior: 'instant' }); begin(); }
}

function renderStory() {
  // 달마다 칸에 들 줄들을 날짜 차례로 모은다
  const lists = STORY.map(s => {
    const a = mStart(s.ym), z = mEnd(s.ym);
    const inM = x => x.i >= a && x.i <= z;
    // 같은 날은 컨텐츠 · 현수막 · 예정 · 카드 없는 기념 사진 차례(안정 정렬). 지난 사진 없는 줄은 싣지 않는다('그 밖' — 2026-11-15 Crenop '전부 제외').
    //   그 달의 가장 큰 일(main)도 제 날짜 자리에 선다(2026-11-25 Crenop '날짜 자리로 옮기고' — 그 전에는 날짜와 상관없이 달의 맨 왼쪽)
    return C.filter(inM).map(c => ({ x: c, p: c.p, tag: when(c) }))
      .concat(B.filter(inM).map(b => ({ x: b, p: b.p, tag: '' })))
      .concat(X.filter(x => inM(x) && x.i > TODAY).map(x => ({ x, p: null, tag: when(x) })))
      .concat(G.filter(inM).map(g => ({ x: g, p: g.p, tag: '' })))
      .concat(NEWX.map(x => Object.assign(x, { i: idxOf(x.d) })).filter(inM).map(x => ({ x, p: x.p, tag: '' })))
      .sort((u, v) => (u.x.d < v.x.d ? -1 : u.x.d > v.x.d ? 1 : 0))
      .map(o => (o.x.id === s.main ? { x: o.x, p: s.img ? s.img.src : o.p, name: (s.img && s.img.cap) || o.x.t, tag: '', main: true } : { x: o.x, p: o.p, name: o.x.t, tag: o.tag }));
  });
  // 손 배치(ORDER · MERGE): 열세 달의 줄을 한 줄로 이어 놓고 차례를 바꾼 뒤 합친다 — 달을 넘겨 합칠 수 있게(2월의 릴동파 합격 · 메달 + 3월 1일 꼭따라이). 없는 번호가 낀 줄은 건너뛴다.
  //   합친 칸은 그 가운데 가장 앞자리의 달 · 자리에 선다(mis = 자리마다 달 번호)
  lists.forEach((list, mi) => list.forEach(o => { o.mi = mi; }));
  const mis = lists.flatMap((list, mi) => list.map(() => mi)), flat = lists.flat();
  for (const ids of ORDER) { const at = ids.map(id => flat.findIndex(o => o.x.id === id)); if (at.some(k => k < 0)) continue;
    const its = at.map(k => flat[k]); at.slice().sort((p, q) => p - q).forEach((k, n) => { flat[k] = its[n]; }); }
  const groups = flat.map((o, k) => Object.assign([o], { mi: mis[k] }));
  for (const ids of MERGE) { const at = ids.map(id => groups.findIndex(g => g[0].x.id === id)); if (at.some(k => k < 0)) continue;
    const first = MERGE_AT[ids[0]] ? groups.findIndex(g => g[0].x.id === MERGE_AT[ids[0]]) : Math.min(...at); groups[first] = Object.assign(at.map(k => groups[k][0]), { mi: groups[first].mi }); at.filter(k => k !== first).sort((p, q) => q - p).forEach(k => groups.splice(k, 1)); }
  let h = '';
  STORY.forEach((s, mi) => {
    const items = groups.filter(g => g.mi === mi).map(g => tile(g, g.some(o => o.main))).join('');
    const caps = (s.caps || []).map(c => `<div class="mcap"${c.at ? ` data-at="${esc(c.at)}"` : ''}><h3>${esc(c.head)}</h3>${(c.lines || []).map(t => `<p class="said">${esc(t)}</p>`).join('')}</div>`).join('');
    const join = groups.some(g => g.mi === mi - 1 && g.some(o => o.mi === mi));   // 앞 달의 칸에 이 달의 줄이 들었다
    h += `<article class="month${join ? ' join' : ''}" id="m${s.ym}"><header class="mh"><div class="ml"><b>${+s.ym.slice(5, 7)}월</b><span class="y">${s.ym.slice(0, 4)}</span></div></header>`
      + `<div class="mcaps">${caps}</div><div class="tiles">${items}</div></article>`;
  });
  track.innerHTML = h;
  bar.insertAdjacentHTML('afterbegin', STORY.map(s => `<span class="seg" data-t="${+s.ym.slice(5, 7)}월"></span>`).join(''));   // 달 이름 꼴은 바로 위 달 머리와 같게('4월') — 잔디의 '26.04' 꼴은 노트북 폭에서 짧은 달 칸에 안 들어갔다
  SEG = [...bar.querySelectorAll('.seg')];
  layoutStrip(); sync();
}

function stat(v, label) { return `<div class="stat"><b>${String(v).replace(/[^\d\s.]+/g, u => `<small>${u}</small>`)}</b><span>${label}</span></div>`; }

// 모두 오늘까지. 순위는 값이 높은 셋째까지(칸마다 다르면 따로 적음), 공동 순위도 한 사람(짝)에 한 줄. 제목 아래 설명은 두지 않는다(같은 날 '랭킹 제목 아래에 부연설명은 다 빼줘').
// 사이트 컨텐츠·현수막 탭 종류 차례. 천타·와우(1번)·VRC·옵치는 뺀다(2026-11-15 Crenop 'VRC랑 옵치는 빼자')
const KINDS = ['왁타', '풀트', '모캡', '음악', '마크', '롤', '배그', '잔디', '스팀'];   // 2026-11-25 Crenop '음악을 모캡과 마크 사이로 옮기기'
const KLABEL = { 스팀: '종합게임' };   // 화면에 적는 분야 이름(같은 날 '스팀은 종합게임으로 이름 바꾸기' — 셈은 사이트 종류 '스팀' 그대로)
const isBattle = c => /^vs |크루 ?4파전|크루대전/.test(c.t);
// 값이 가장 큰 멤버들과 그다음 값: [[멤버 번호…], 1위 값, 2위 값(없으면 null)]. 값이 없거나(null) 0인 멤버는 빼고 본다
function topOf(vals) { const s = [...new Set(vals.filter(v => v > 0))].sort((a, b) => b - a); return s.length ? [vals.map((v, i) => (v === s[0] ? i : -1)).filter(i => i >= 0), s[0], s.length > 1 ? s[1] : null] : null; }
// 명전 칸 아랫줄(2026-11-21 Crenop '1위만 넣어야 의미가 있다 · 차라리 2위와의 차이만 추가하던가 디테일을 추가해도 좋을듯? 가령 연속기간은 언제부터 언제까지인지'):
//   연속 방송 일수 = 그 기간 · 단일 방송 시간 = 그 방송의 날짜(둘 다 방송 기록에서 다시 찾아, 사이트 값과 길이가 맞을 때만) · 그 밖 = 2위와의 차이(사이트의 2위 값에서)
const hallNum = v => { const t = /(\d+)시간 (\d+)분/.exec(v); return t ? { n: +t[1] * 60 + +t[2], time: true } : { n: parseInt(v), unit: String(v).replace(/^[\d\s]+/, '') }; };
function streakOf(i) {   // 멤버 i의 가장 긴 연속 방송: [일수, 첫날, 끝날]
  let best = [0, '', ''], run = 0, st = '';
  for (let x = 0; x <= Math.min(TODAY, BDAY); x++) { const d = ymd6(x); if ((DATA.days[d] || []).includes(i)) { if (!run) st = d; run++; if (run > best[0]) best = [run, st, d]; } else run = 0; }
  return best;
}
function hallSub(c, ids) {
  const v = hallNum(c.value), span = (a, b) => a === b ? md(a) : md(a) + ' ~ ' + md(b);
  if (c.desc === '연속 방송 일수' && ids.length === 1) { const k = streakOf(ids[0]); if (k[0] === v.n) return span(k[1], k[2]); }
  if (c.desc === '단일 방송 시간' && ids.length === 1) { const L = (DATA.long || [])[ids[0]]; if (L && Math.abs(L[2] - v.n) <= 2) return span(L[0], L[1]); }
  if (!c.value2) return '';
  const d = v.n - hallNum(c.value2).n;
  return '2위와 ' + (v.time ? [d >= 60 ? Math.floor(d / 60) + '시간' : '', d % 60 ? d % 60 + '분' : ''].filter(Boolean).join(' ') : d + v.unit) + ' 차이';
}
// 칸 이름 앞 그림(tag = 분야 그림의 사이트 키 — 색을 .ic[data-tag]가 정한다) · 명전 모양 칸 하나(그림 · 이름 · 얼굴들 · 값 · 아랫줄)
const hcIcon = (svg, color, tag) => svg ? `<span class="hc-ic${tag ? ' ic" data-tag="' + tag : ''}"${color ? ` style="color:${color}"` : ''} aria-hidden="true">${svg}</span>` : '';
const hcFaces = ids => `<div class="hc-w">${ids.map(i => `<span class="hc-p">${face(i, 64, 64, '')}${nameOf(i)}</span>`).join('')}</div>`;
const hc = (icons, label, ids, value, sub) => `<div class="hc"><div class="hc-cat">${icons}<b>${esc(label)}</b></div>${hcFaces(ids)}<div class="hc-val">${esc(value)}</div><div class="hc-sub">${esc(sub)}</div></div>`;

// 1년 통계 = 명전 모양 칸 열여덟(여섯 칸 세 줄) + 분야별 활약 한 줄. 모두 오늘까지, 1위만(2026-11-21 Crenop '1위만 넣어야 의미가 있다').
//   앞 열두 칸 = 사이트 명전 통산 1위(사이트 화면에서 읽은 것 — dl_hall.js). 뒤 여섯 칸 = 사이트 명전에 없는 것(같은 날 Crenop '정기모캡참여, 크루대전출전도 명전스타일로 …
//   비슷한 통계 2개정도 더 생각해내서 4*4로 가거나 4개더 생각해내면 6*3도 가능할듯'): 정기 모캡 참여 · 크루 대전 출전(천양 빼고 — 2026-11-15 Crenop) · 방송 제목 변경 · 오간 카테고리(멤버마다 방송 기록에서 센 것) ·
//   가장 자주 함께한 둘 · 채팅을 가장 많이 나눈 둘. 뺀 칸은 첫1년/CLAUDE.md — 다시 넣지 않는다. 이름은 '통계'('명전'은 잘한 것만 넣어야 할 것 같은 제약 — 2026-11-15 Crenop)
function renderHall() {
  const cs = C.filter(c => c.i <= TODAY), bs = B.filter(b => b.i <= TODAY), all = MEMBERS.map((_, i) => i), ui = DATA.ui || {};
  const count = (list, i) => list.filter(c => c.m.includes(i)).length;
  const gap = (a, b, unit) => b == null ? '' : `2위와 ${a - b}${unit} 차이`;
  const cards = (DATA.site || []).map(c => { const ids = c.names.map(n => MEMBERS.findIndex(m => m.n === n));
    return hc((c.icons || []).map(([svg, col]) => hcIcon(svg, col)).join(''), c.label, ids, c.value, hallSub(c, ids)); });
  const one = (icon, label, vals, unit) => { const t = topOf(vals); if (t) cards.push(hc(icon, label, t[0], t[1] + unit, gap(t[1], t[2], unit))); };
  one(hcIcon((DATA.icons['모캡'] || [])[1], '', 'mocap'), '정기 모캡 참여', all.map(i => count(cs.filter(isMocap), i)), '회');
  one(hcIcon(ui.swords, 'var(--ev-chat)'), '크루 대전 출전', all.map(i => (i ? count(cs.filter(isBattle), i) : null)), '번');
  one(hcIcon(ui.pencil, 'var(--ev-yellow)'), '방송 제목 변경', DATA.x.titleBy, '번');
  one(hcIcon(ui.tag, 'var(--ev-yellow)'), '오간 카테고리', DATA.x.catsBy, '개');
  // 가장 자주 함께한 둘: 둘 다 합류한 뒤, 둘 중 하나라도 나온 컨텐츠 가운데 둘이 함께 나온 비율(아랫줄 = 함께 / 하나라도). 횟수로 세면 컨텐츠에 가장 많이 나온 멤버가 위 짝에 모두 끼었다(2026-11-15 잼).
  // 채팅을 가장 많이 나눈 둘: 둘이 서로의 방송에서 친 채팅의 합(DATA.chat[보낸 멤버][방송 주인]) — '함께한 둘' 곁에(2026-11-21 Crenop '페어링하면 좋겠다')
  let pal = null; const duo = [];
  for (let a = 0; a < 13; a++) for (let b = a + 1; b < 13; b++) {
    const from = [JOIN[a] || '251130', JOIN[b] || '251130'].sort()[1], list = cs.filter(x => x.d >= from);
    const t = list.filter(x => x.m.includes(a) && x.m.includes(b)).length, u = list.filter(x => x.m.includes(a) || x.m.includes(b)).length;
    if (u && (!pal || t / u > pal.r)) pal = { ids: [a, b], r: t / u, t, u };
    const n = DATA.chat[a][b] + DATA.chat[b][a]; if (n) duo.push({ ids: [a, b], n });
  }
  duo.sort((x, y) => y.n - x.n);
  if (pal) cards.push(hc(hcIcon(ui.people), '가장 자주 함께한 둘', pal.ids, Math.round(pal.r * 100) + '%', `${pal.t} / ${pal.u}번`));
  if (duo.length) cards.push(hc(hcIcon(ui.chatBubble, 'var(--ev-chat)'), '채팅을 가장 많이 나눈 둘', duo[0].ids, duo[0].n + '회', gap(duo[0].n, duo[1] ? duo[1].n : null, '회')));
  // 분야별 활약: 분야(종류)마다 그 종류의 컨텐츠·현수막에 가장 많이 나온 멤버만(같으면 모두 — 그 단을 넓혀 옆으로). 2026-11-21 Crenop '각 분야별 1등만' · '명전이랑 비슷하게 수직배치 수평나열'
  const both = cs.concat(bs);
  const kds = KINDS.map(k => { const t = topOf(all.map(i => both.filter(x => x.m.includes(i) && x.ks.includes(k)).length)), ic = DATA.icons[k]; if (!t) return '';
    return `<div class="kdc"${t[0].length > 1 ? ` style="flex-grow:${t[0].length}"` : ''}><div class="hc-cat">${ic ? hcIcon(ic[1], '', ic[0]) : ''}<b>${KLABEL[k] || k}</b></div>${hcFaces(t[0])}<div class="hc-val">${t[1]}회</div></div>`; }).join('');
  document.getElementById('hall').innerHTML = '<h2 class="sec">1년 통계</h2>'
    + `<div class="hgrid fx">${cards.join('')}</div>`   // 열여덟 칸 위의 작은 제목('명전 통산 1위')은 뺐다(2026-11-21 Crenop '제목 빼고' — 뒤 여섯 칸은 사이트 명전이 아니다)
    + `<h3 class="sub">분야별 활약</h3><div class="kds fx">${kds}</div>`;
}

// 사진 크게 보기: 그림(data-ph)을 누르면 창. ← → 로 앞뒤 사진, 닫기 = ✕ · 바깥 누르기 · Esc · 뒤로 가기(창을 열 때 방문 기록 한 칸).
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbBody = document.getElementById('lbBody');
let lbAt = -1, lbFrom = null;
function lbShow(k) {
  lbAt = (k + PH.length) % PH.length;
  const p = PH[lbAt], z = DATA.sizes[p.src] || [1200, 800], r = z[1] / z[0];
  // 화면에 다 들어오게 맞춘다. 그러면 폭이 560보다 좁아지는 긴 그림은 폭 760까지 키우고 창 안에서 내려 본다.
  const availH = innerHeight - 48 - 54, availW = Math.min(1400, innerWidth - 176);
  let w = Math.min(z[0], availW, availH / r);
  if (r > 1.6 && w < 560) w = Math.min(z[0], 760, availW);
  lbImg.removeAttribute('src');   // 앞 사진이 새 크기로 늘어나 보이지 않게
  lbImg.width = Math.round(w); lbImg.height = Math.round(w * r); lbImg.style.width = Math.round(w) + 'px';
  lbImg.src = SITE + p.src; lbImg.alt = p.t;
  lbBody.style.maxHeight = availH + 'px'; lbBody.scrollTop = 0;
  document.getElementById('lbD').textContent = md(p.d);
  document.getElementById('lbT').textContent = p.t;
}
function lbOpen(k, from) {
  lbFrom = from; lbShow(k); lb.hidden = false; document.documentElement.classList.add('lock');
  history.pushState({ lb: 1 }, ''); document.getElementById('lbX').focus();
}
function lbHide() { if (lb.hidden) return; lb.hidden = true; document.documentElement.classList.remove('lock'); lbImg.removeAttribute('src'); if (lbFrom) lbFrom.focus({ preventScroll: true }); lbFrom = null;
  if (lbPaused) { lbPaused = false; sync(); setAuto(true); } }   // 자동 넘김 중에 연 사진이면 닫을 때 이어 간다
const lbClose = () => { if (!lb.hidden) history.back(); };   // 방문 기록 한 칸을 되돌리면 popstate가 창을 닫는다
addEventListener('popstate', lbHide);
document.getElementById('story').addEventListener('click', e => { const t = e.target.closest('[data-ph]'); if (t) lbOpen(+t.dataset.ph, t); });
lb.addEventListener('click', e => { if (e.target === lb) lbClose(); });
document.getElementById('lbX').addEventListener('click', lbClose);
document.getElementById('lbPrev').addEventListener('click', () => lbShow(lbAt - 1));
document.getElementById('lbNext').addEventListener('click', () => lbShow(lbAt + 1));
addEventListener('keydown', e => { if (lb.hidden) return;
  if (e.key === 'Escape') lbClose(); else if (e.key === 'ArrowLeft') lbShow(lbAt - 1); else if (e.key === 'ArrowRight') lbShow(lbAt + 1); });

// 나타나기
const still = /[?&]still\b/.test(location.search) || matchMedia('(prefers-reduced-motion: reduce)').matches;
if (still) document.documentElement.classList.add('still');
const io = !still && 'IntersectionObserver' in window
  ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -12% 0px' })
  : null;

// 첫 화면에서 시작하고 잠근다 — 새로 고쳤을 때 브라우저가 읽던 자리(사진 구역 한가운데)로 되돌리면 잠긴 채 갇힌다
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
document.documentElement.classList.add('gate');
renderToday();
renderYear();
renderStory();
renderTogether();
renderHall();
renderEnd();
heroTimes();
// 띠는 화면 크기가 바뀌면 · 글꼴이 늦게 읽혀 글 폭이 바뀌면 다시 자리 잡는다
if ('ResizeObserver' in window) { let was = pin.clientWidth + 'x' + pin.clientHeight;
  new ResizeObserver(() => { const now = pin.clientWidth + 'x' + pin.clientHeight; if (now !== was) { was = now; layoutStrip(); sync(); } }).observe(pin); }
if (document.fonts) document.fonts.ready.then(() => { layoutStrip(); sync(); });
addEventListener('scroll', () => { if (!auto) sync(); }, { passive: true });
document.getElementById('auto').addEventListener('click', toggleAuto);
// 첫 화면 단추 둘: 그 속도로 바꾸고 시작한다
// 첫 화면 단추 둘: 그 속도로 바꾸고, 영상을 먼저 튼 뒤 가로 넘김(과 배경음악)으로 잇는다
for (const id of ['heroAuto', 'heroFast']) { const el = document.getElementById(id); el.addEventListener('click', () => { setSpeed(+el.dataset.v); startRecall(); }); }
// 영상 칸을 누르면 재생 · 멈춤(첫 화면 단추 없이 손으로 왔을 때도 볼 수 있게)
track.addEventListener('click', e => { const v = e.target.closest('.pic.vid') && introV(); if (!v) return; if (v.paused) { v.muted = bgmMute; v.play().catch(() => {}); } else v.pause(); });
document.getElementById('spd').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return;
  setSpeed(+b.dataset.v); });
// 사진 구역에서 첫 화면 · 통계로(통계 = 띠 바로 아래 '지금까지'부터 — 작은 제목이 위에서 48px에 오게)
document.getElementById('toTop').addEventListener('click', () => jump(0));
document.getElementById('toStats').addEventListener('click', () => jump(statsTop()));
// 이동 막대: 민트 틀을 잡으면 잡은 자리 그대로 끌고, 틀 밖을 누르면 틀 가운데가 그 자리로 온 뒤 끌린다
bar.addEventListener('pointerdown', e => {
  if (e.button || barW <= thumbW) return;
  e.preventDefault();
  const x0 = bar.getBoundingClientRect().left + bar.clientLeft, at = travel ? sx / travel * (barW - thumbW) : 0, px = e.clientX - x0;
  const off = px >= at && px <= at + thumbW ? px - at : thumbW / 2;
  const move = ev => jump(storyTop + Math.min(Math.max((ev.clientX - x0 - off) / (barW - thumbW), 0), 1) * travel);
  move(e); bar.setPointerCapture(e.pointerId);
  bar.onpointermove = move; bar.onlostpointercapture = () => { bar.onpointermove = null; };
});
// 적어 둔 크기와 실제 그림의 비율이 다르면(사이트가 같은 이름으로 그림을 바꿈 — 2026-11-24 content/261125.webp) 실제 비율로 다시 자리 잡는다. 띠는 가로 · 세로를 다 정해 놓아서, 그대로 두면 그림이 찌그러진다
let fixT = 0;
track.addEventListener('load', e => { const i = e.target, b = i.parentElement; if (i.tagName !== 'IMG' || !i.naturalWidth || !b.dataset.a) return;
  const a = i.naturalWidth / i.naturalHeight; if (Math.abs(a / b.dataset.a - 1) <= 0.01) return;
  b.dataset.a = a.toFixed(4); clearTimeout(fixT); fixT = setTimeout(() => { layoutStrip(); sync(); }, 50); }, true);
document.querySelectorAll('.fx').forEach(el => io ? io.observe(el) : el.classList.add('in'));
</script>
