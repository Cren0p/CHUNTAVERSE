<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>천타버스</title>
<link rel="icon" type="image/webp" href="Favicon.webp">
<style>
  :root {
    --bg: #070a14;
    --surface: #0d1120;
    --surface2: #131929;
    --border: #1e2740;
    --live: #ff3b3b;
    --live-glow: rgba(255,59,59,0.25);
    --accent: #61FFEC;
    --accent2: #61FFEC;
    --text: #e2e8f0;
    --muted: #64748b;
    --time: #fbbf24;
    --ev-start: #60a5fa;
    --ev-end: #f87171;
    --ev-yellow: #fbbf24;
    --ev-blue: #60a5fa;
    --ev-comment: #ec4899;
    --ev-post: #34d399;
    --ev-youtube: #ef4444;
    --ev-unread: #61FFEC;
    --mode-adult: #ec4899;
    --mode-subscription: #f59e0b;
    --mode-copyright: #94a3b8;
    --filter-soop: #0388FF;
    --filter-post: #2EF5E1;
    --sidebar-w: 200px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100vh; }
  html { scrollbar-gutter: stable; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 35%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(2px 2px at 15% 50%, rgba(97,255,236,0.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    z-index: 2;
    flex-shrink: 0;
  }
  .sidebar-logo {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    text-align: center;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sidebar-logo img { max-width: 100%; max-height: 32px; height: auto; display: block; }
  .nav-list { padding: 8px 0; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 20px; color: var(--muted);
    cursor: pointer; font-size: 14px; font-weight: 600;
    border: none; background: none; text-align: left;
    width: 100%; font-family: inherit;
    border-left: 3px solid transparent;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
    position: relative;
  }
  .nav-item:hover { color: var(--text); background: var(--surface2); }
  .nav-item.active { color: var(--accent2); background: var(--surface2); border-left-color: var(--accent); }
  .nav-icon {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .nav-icon svg { width: 16px; height: 16px; display: block; }
  .nav-badge {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--ev-unread);
    color: var(--bg);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    min-width: 18px;
    text-align: center;
    line-height: 1.2;
  }
  .nav-live-badge {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    background: var(--surface2);
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    transition: color 0.15s;
  }
  .nav-live-dot {
    width: 7px;
    height: 7px;
    background: var(--muted);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .nav-live-badge.on {
    color: var(--text);
    background: rgba(255,59,59,0.12);
  }
  .nav-live-badge.on .nav-live-dot {
    background: var(--live);
    box-shadow: 0 0 6px var(--live-glow);
    animation: pulse 1.8s ease-in-out infinite;
  }

  .notify-toggle {
    padding: 8px 20px 10px 23px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .notify-toggle-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    user-select: none;
  }
  .notify-switch {
    position: relative;
    width: 36px;
    height: 20px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
    padding: 0;
    box-sizing: border-box;
  }
  .notify-switch::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    background: var(--muted);
    top: 50%;
    left: 2px;
    transform: translateY(-50%);
    transition: transform 0.18s, left 0.18s, background 0.18s;
  }
  .notify-switch.on { border-color: var(--accent); }
  .notify-switch.on::after { left: 19px; transform: translateY(-50%); background: var(--accent); }

  .main {
    flex: 1; min-width: 0;
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
  }
  .main-header {
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(97,255,236,0.05) 0%, transparent 100%);
    display: flex; align-items: center; gap: 16px;
    min-height: 56px;
    position: relative;
  }
  .page-title {
    font-size: 18px; font-weight: 700; letter-spacing: 1px;
    flex-shrink: 0;
    position: absolute;
    left: 24px;
    top: 50%;
    transform: translateY(-50%);
  }
  .header-center {
    flex: 1; text-align: center; color: var(--muted);
    font-size: 12px; min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .header-center-line {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 100%;
  }
  .header-disclaimer {
    font-size: 11px;
    opacity: 0.75;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .page { display: none; flex: 1; flex-direction: column; }
  .page.active { display: flex; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px; padding: 22px 30px;
    max-width: 1520px; width: 100%; margin: 0 auto;
    flex: 1;
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 800px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 500px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    overflow: hidden;
    text-decoration: none; color: inherit;
    display: block;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    opacity: 0;
    animation: fadeIn 0.4s ease forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }


  .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 8px 24px rgba(97,255,236,0.18); }
  .card.live { border-color: var(--accent); }
  .card.live:hover { border-color: var(--accent2); box-shadow: 0 8px 24px rgba(97,255,236,0.18); }


  .card.offline .card-thumb { opacity: 0.4; }
  .card.offline .card-name { color: var(--muted) !important; }

  .card-thumb {
    width: 100%; aspect-ratio: 16/9;
    background: var(--surface2);
    position: relative; overflow: hidden;
  }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-thumb .placeholder {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden; gap: 8px;
  }
  .card-thumb .placeholder img {
    max-width: 50%; max-height: 60%;
    width: auto; height: auto;
    object-fit: contain; opacity: 0.4;
  }
  .placeholder-mode-text {
    font-size: 12px; font-weight: 600;
    color: var(--muted); letter-spacing: 0.5px;
    text-align: center;
  }
  .badge-mode {
    position: absolute; top: 10px; right: 10px;
    color: white; font-size: 11px; font-weight: 700;
    letter-spacing: 0.5px; padding: 4px 10px;
  }
  .badge-mode.adult { background: var(--mode-adult); box-shadow: 0 2px 8px rgba(236,72,153,0.45); }
  .badge-mode.subscription { background: var(--mode-subscription); box-shadow: 0 2px 8px rgba(245,158,11,0.45); }
  .badge-mode.copyright { background: var(--mode-copyright); box-shadow: 0 2px 8px rgba(148,163,184,0.45); }
  .badge-mode.restricted { background: var(--muted); }

  .card-info { padding: 12px 14px 14px; display: flex; align-items: center; gap: 10px; }
  .card-avatar {
    width: 36px; height: 36px;
    object-fit: cover; flex-shrink: 0;
    border: 1.5px solid var(--border);
  }
  .card-text { min-width: 0; flex: 1; }
  .card-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 3px;
    min-width: 0;
  }
  .card-name {
    font-size: 15px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0;
  }
  .card-btime {
    font-size: 11px;
    color: var(--time);
    font-weight: 600;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }
  .card-title {
    font-size: 12px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    line-height: 1.3;
  }
  .card-title.is-live { color: #94a3b8; }

  .loading { text-align: center; padding: 80px 20px; color: var(--muted); flex: 1; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .events-wrap {
    padding: 20px 24px;
    max-width: 1400px; width: 100%; margin: 0 auto;
    flex: 1;
    display: grid; grid-template-columns: 1fr 280px;
    gap: 20px; align-items: start;
  }
  @media (max-width: 900px) {
    .events-wrap { grid-template-columns: 1fr; }
    .filter-panel { position: static !important; }
  }
  .timeline { background: var(--surface); border: 1px solid var(--border); min-width: 0; }
  .timeline-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px; }

  .filter-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px;
    position: sticky; top: 20px;
  }
  .filter-section + .filter-section {
    margin-top: 20px; padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .filter-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .filter-title {
    font-size: 12px; font-weight: 700;
    color: var(--muted); letter-spacing: 1px;
  }
  .filter-toggle-all {
    background: transparent;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .filter-toggle-all:hover { opacity: 0.7; }

  .filter-members { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .filter-member {
    position: relative;
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer; overflow: hidden;
    transition: all 0.15s; padding: 0;
  }
  .filter-member img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: opacity 0.15s;
  }
  .filter-member:not(.on) img { opacity: 0.25; filter: grayscale(1); }
  .filter-member.on { border-color: var(--accent); }
  .filter-member:hover { border-color: var(--accent); }

  .filter-types { display: flex; flex-direction: column; gap: 6px; }
  .filter-type {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer; font-size: 13px; font-weight: 600;
    color: var(--muted); transition: all 0.15s;
    font-family: inherit; text-align: left; width: 100%;
  }
  .filter-type:hover { color: var(--text); border-color: var(--accent); }
  .filter-type.on { border-color: var(--accent); color: var(--text); }
  .filter-type .dot { width: 12px; height: 12px; flex-shrink: 0; }
  .filter-type[data-type="soop"] .dot { background: var(--filter-soop); }
  .filter-type[data-type="post"] .dot { background: var(--filter-post); }
  .filter-type[data-type="youtube"] .dot { background: var(--ev-youtube); }
  .filter-type[data-type="cafe"] .dot { background: #03C75A; }

  .filter-summary {
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted); text-align: center;
  }
  .event {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    transition: background 0.15s;
    border-left: 4px solid transparent;
    position: relative;
  }
  .event:hover { background: var(--surface2); }
  .event + .event { border-top: 1px solid var(--border); }
  .event.unread {
    border-left-color: var(--ev-unread);
    background: rgba(97, 255, 236, 0.10);
    box-shadow: inset 4px 0 12px -4px rgba(97, 255, 236, 0.35);
  }
  .event.unread:hover { background: rgba(97, 255, 236, 0.16); }
  .event-new-badge {
    background: var(--ev-unread);
    color: var(--bg);
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    letter-spacing: 0.5px;
    margin-right: 6px;
    flex-shrink: 0;
  }
  .event-icon {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
    background: var(--surface2); font-weight: 700;
  }
  .event-icon svg {
    width: 16px; height: 16px;
    display: block;
  }
  .event-icon.start { background: rgba(96,165,250,0.15); color: var(--ev-start); }
  .event-icon.end { background: rgba(248,113,113,0.15); color: var(--ev-end); }
  .event-icon.title { background: rgba(251,191,36,0.15); color: var(--ev-yellow); }
  .event-icon.category { background: rgba(251,191,36,0.15); color: var(--ev-yellow); }
  .event-icon.mode_change { background: rgba(251,191,36,0.15); color: var(--ev-yellow); }
  .event-icon.post { background: rgba(52,211,153,0.15); color: var(--ev-post); }
  .event-icon.comment_recommend { background: rgba(52,211,153,0.15); color: var(--ev-post); }
  .event-icon.youtube { background: rgba(239,68,68,0.15); color: var(--ev-youtube); }
  .event-icon.cafe_post { background: rgba(3,199,90,0.15); color: #03C75A; }
  .event a.event-link { color: inherit; text-decoration: none; display: contents; }
  .event a.event-link:hover .event-detail { color: var(--accent2); }
  .event-avatar { width: 28px; height: 28px; object-fit: cover; flex-shrink: 0; }
  .event-body { flex: 1; min-width: 0; font-size: 14px; }
  .event-member { font-weight: 700; margin-right: 6px; }
  .event-action { color: var(--muted); }
  .event-target { color: #cbd5e1; margin-left: 4px; }
  .event-mode-tag {
    display: inline-block; margin-left: 6px;
    padding: 1px 7px; font-size: 11px;
    font-weight: 600; color: white;
    letter-spacing: 0.3px; vertical-align: 1px;
  }
  .event-mode-tag.adult { background: var(--mode-adult); }
  .event-mode-tag.subscription { background: var(--mode-subscription); }
  .event-mode-tag.copyright { background: var(--mode-copyright); }
  .event-mode-tag.restricted { background: var(--muted); }
  .event-detail {
    color: #94a3b8; font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-top: 3px;
  }
  .event-time {
    font-size: 12px; color: var(--muted);
    flex-shrink: 0; text-align: right; line-height: 1.4;
  }
  .event-time-rel { display: block; }
  .event-time-abs {
    display: block; font-size: 10px;
    color: var(--muted); opacity: 0.7;
  }

  .stats-wrap {
    padding: 20px 24px;
    max-width: 1600px; width: 100%; margin: 0 auto;
    flex: 1;
  }

  .stats-tabs-wrap {
    display: flex;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px;
    margin: 0 auto 16px;
    align-items: stretch;
    max-width: 880px;
  }
  .stats-tabs-members {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .stats-tabs-side {
    display: flex;
    align-items: stretch;
  }
  .stats-tab {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    padding: 6px 8px;
    color: var(--muted); cursor: pointer;
    font-size: 13px; font-weight: 700;
    font-family: inherit;
    transition: all 0.15s;
    text-align: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    box-sizing: border-box;
    min-height: 36px;
  }
  .stats-tab:hover { color: var(--text); border-color: var(--accent); }
  .stats-tab.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .stats-tab img {
    width: 18px; height: 18px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .stats-tab-all {
    width: 70px;
    height: 100%;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  @media (max-width: 1100px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 800px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 500px) { .stats-grid { grid-template-columns: 1fr; } }

  .stats-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    text-align: left;
    font-family: inherit;
    color: inherit;
  }
  .stats-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: 0 6px 16px rgba(97,255,236,0.15);
  }
  .stats-card-header { display: flex; align-items: center; gap: 10px; }
  .stats-card-avatar {
    width: 40px; height: 40px;
    object-fit: cover;
    border: 1.5px solid var(--border);
    flex-shrink: 0;
  }
  .stats-card-name { font-size: 16px; font-weight: 700; }
  .stats-card-rows { display: flex; flex-direction: column; gap: 6px; }
  .stats-card-row {
    display: flex; justify-content: space-between;
    align-items: baseline; font-size: 13px;
  }
  .stats-card-label { color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .stats-row-icon { display: inline-flex; align-items: center; flex-shrink: 0; }
  .stats-row-icon svg { width: 11px; height: 11px; display: block; }
  .stats-card-value { color: var(--text); font-weight: 700; }
  .stats-card-value.accent { color: var(--accent); }

  .stats-detail-header {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .stats-detail-month {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 12px;
  }
  .stats-month-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 28px; height: 28px;
    cursor: pointer; font-family: inherit; font-weight: 700;
  }
  .stats-month-btn:hover { border-color: var(--accent); color: var(--accent); }
  .stats-month-btn:disabled { color: var(--muted); cursor: not-allowed; opacity: 0.4; }
  .stats-month-text { font-size: 14px; font-weight: 700; min-width: 110px; text-align: center; }
  .stats-detail-summary {
    display: flex; flex: 1; flex-wrap: wrap; gap: 16px;
    padding: 8px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    align-items: center;
  }
  .stats-summary-item { display: flex; flex-direction: column; gap: 2px; }
  .stats-summary-label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; }

function updateNotifySwitchUI() {
  const sw = document.getElementById('notifySwitch');
  if (!sw) return;
  sw.classList.toggle('on', notifyEnabled);
}

async function setNotifyEnabled(enabled) {
  if (enabled) {
    if ('Notification' in window) {
      if (Notification.permission === 'default') {
        try {
          const result = await Notification.requestPermission();
          if (result !== 'granted') {
            notifyEnabled = false;
            lsSet(LS_NOTIFY, '0');
            updateNotifySwitchUI();
            alert('브라우저 알림 권한이 거부되어 알림을 받을 수 없어요.\n브라우저 설정에서 알림 권한을 허용한 후 다시 시도해주세요.');
            return;
          }
        } catch (e) {}
      } else if (Notification.permission === 'denied') {
        notifyEnabled = false;
        lsSet(LS_NOTIFY, '0');
        updateNotifySwitchUI();
        alert('브라우저 알림 권한이 차단되어 있어요.\n브라우저 주소창 좌측 자물쇠 아이콘 → 알림 허용 후 다시 시도해주세요.');
        return;
      }
    } else {
      alert('이 브라우저는 알림 기능을 지원하지 않아요.');
      return;
    }
  } else {
    stopTitleFlash();
  }
  notifyEnabled = enabled;
  lsSet(LS_NOTIFY, enabled ? '1' : '0');
  updateNotifySwitchUI();
}

function startTitleFlash(count) {
  pendingFlashCount = count;
  if (titleFlashTimer) return;
  titleFlashTimer = setInterval(() => {
    titleFlashOn = !titleFlashOn;
    updateTabTitle();
  }, 1500);
}
function stopTitleFlash() {
  if (titleFlashTimer) {
    clearInterval(titleFlashTimer);
    titleFlashTimer = null;
  }
  titleFlashOn = false;
  pendingFlashCount = 0;
  updateTabTitle();
}
function updateTabTitle() {
  const lastSeen = new Date(getLastSeenTime()).getTime();
  const unreadCount = allEvents.filter(e => {
    const t = new Date(e.time).getTime();
    return !isNaN(t) && t > lastSeen;
  }).length;
  const base = unreadCount > 0 ? `${BASE_TITLE} (${unreadCount})` : BASE_TITLE;
  document.title = (titleFlashTimer && titleFlashOn && pendingFlashCount > 0)
    ? `${base} NEW ◆` : base;
}

function sendBrowserNotification(ev) {
  if (!notifyEnabled) return;
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;
  if (document.visibilityState === 'visible' && currentPage === 'events') return;

  const memberName = ev.member_name || '';
  let body = '';
  switch (ev.type) {
    case 'start':      body = `${memberName} 방송 시작${ev.title ? ' — ' + ev.title : ''}`; break;
    case 'end':        body = `${memberName} 방송 종료`; break;
    case 'title':      body = `${memberName} 방제 변경 — ${ev.after || ''}`; break;
    case 'category':   body = `${memberName} 카테고리 변경 — ${ev.after || ''}`; break;
    case 'mode_change':body = `${memberName} 방송 모드 변경 — ${MODE_LABEL[ev.after] || ev.after}`; break;
    case 'post':       body = `${memberName} 숲 게시글 — ${ev.title || ''}`; break;
    case 'comment_recommend': body = `${memberName} 댓글 추천 — ${ev.target_name || ''} 컨텐츠`; break;
    case 'youtube':    body = `${memberName} 유튜브 업로드 — ${ev.title || ''}`; break;
    case 'cafe_post':  body = `${memberName} 카페 게시글 [${ev.cafe_name || ''}] — ${ev.title || ''}`; break;
    default:           body = `${memberName} ${ev.type}`;
  }
  try {
    const noti = new Notification(BASE_TITLE, {
      body, icon: 'Favicon.webp',
      tag: `${ev.type}-${ev.member_id}-${ev.time}`,
    });
    noti.onclick = () => {
      window.focus();
      history.replaceState(null, '', '#events');
      switchPage('events');
      noti.close();
    };
    setTimeout(() => { try { noti.close(); } catch (e) {} }, 5000);
  } catch (e) {}
}

function processNewEventsForNotification(events) {
  if (!events || events.length === 0) {
    lastSeenEventKeys = new Set();
    lastSeenEventKeysReady = true;
    return;
  }
  const typeToCat = (et) => {
    if (et === 'post' || et === 'comment_recommend') return 'post';
    if (et === 'youtube') return 'youtube';
    if (et === 'cafe_post') return 'cafe';
    return 'soop';
  };
  const eventKey = (e) => `${e.type}|${e.member_id}|${e.time}|${e.url || ''}|${e.after || ''}`;
  if (!lastSeenEventKeysReady) {
    lastSeenEventKeys = new Set(events.map(eventKey));
    lastSeenEventKeysReady = true;
    return;
  }
  const newOnes = events.filter(e => !lastSeenEventKeys.has(eventKey(e)));
  lastSeenEventKeys = new Set(events.map(eventKey));
  if (newOnes.length === 0) return;
  const filtered = newOnes.filter(e => {
    if (!filterState.members.has(e.member_id)) return false;
    if (!filterState.types.has(typeToCat(e.type))) return false;
    return true;
  });
  if (filtered.length === 0) return;
  if (notifyEnabled) {
    const userIsViewingEvents = (document.visibilityState === 'visible' && currentPage === 'events');
    if (!userIsViewingEvents) {
      filtered.forEach(ev => sendBrowserNotification(ev));
      startTitleFlash(filtered.length);
    }
  }
}

function refreshUnreadIndicator() {
  const lastSeen = new Date(getLastSeenTime()).getTime();
  const unread = allEvents.filter(e => {
    const t = new Date(e.time).getTime();
    return !isNaN(t) && t > lastSeen;
  });
  const count = unread.length;
  updateTabTitle();
  const badge = document.getElementById('navBadge');
  if (badge) {
    if (count > 0) {
      badge.style.display = '';
      badge.textContent = count > 99 ? '99+' : count;
    } else {
      badge.style.display = 'none';
    }
  }
  const tl = document.getElementById('timeline');
  if (tl) {
    tl.querySelectorAll('.event').forEach(el => {
      const t = parseInt(el.dataset.time || '0', 10);
      const isUnread = t > lastSeen;
      el.classList.toggle('unread', isUnread);
      const oldBadge = el.querySelector('.event-new-badge');
      if (oldBadge) oldBadge.remove();
      if (isUnread) {
        const timeEl = el.querySelector('.event-time');
        if (timeEl) {
          const badgeEl = document.createElement('span');
          badgeEl.className = 'event-new-badge';
          badgeEl.textContent = 'NEW';
          timeEl.parentNode.insertBefore(badgeEl, timeEl);
        }
      }
    });
  }
}

function switchPage(page) {
  if (!VALID_PAGES.includes(page)) page = 'live';
  if (currentPage === 'events' && page !== 'events') {
    setLastSeenToNow();
    refreshUnreadIndicator();
  }
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.page === page);
  });
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.getElementById('pageTitle').textContent = PAGE_TITLES[page];
  updateHeaderCenter();
  if (page === 'stats' && !statsState.tabsInited) {
    initStatsTabs();
    statsState.tabsInited = true;
  }
  if (page === 'events') {
    stopTitleFlash();
    refreshUnreadIndicator();
  }
}

function formatBtime(seconds) {
  if (!seconds || seconds <= 0) return null;
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (h > 0) return h + '시간 ' + m + '분';
  return m + '분';
}
function formatRelTime(iso) {
  const now = new Date();
  const t = new Date(iso);
  const diff = Math.floor((now - t) / 1000);
  if (diff < 60) return '방금 전';
  if (diff < 3600) return Math.floor(diff / 60) + '분 전';
  if (diff < 86400) return Math.floor(diff / 3600) + '시간 전';
  return Math.floor(diff / 86400) + '일 전';
}
function formatAbsTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd} ${hh}:${mi}`;
}
function formatHHMM(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function formatDuration(ms) {
  if (!ms || ms <= 0) return '0분';
  const totalMin = Math.floor(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h > 0) return `${h}시간 ${m}분`;
  return `${m}분`;
}
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function soopProfileUrl(userId) {
  const prefix = userId.substring(0, 2);
  return `https://profile.img.sooplive.com/LOGO/${prefix}/${userId}/${userId}.jpg`;
}
function isoToKstDateKey(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function ymdKey(year, month1, day) {
  return `${year}-${String(month1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function daysInMonth(year, month1) {
  return new Date(year, month1, 0).getDate();
}

function buildCard(m, info, delay) {
  const tag = info.live ? 'a' : 'div';
  const card = document.createElement(tag);
  card.className = 'card ' + (info.live ? 'live' : 'offline');
  card.dataset.member = info.id;
  card.style.animationDelay = delay + 'ms';
  if (info.live) {
    card.href = 'https://play.sooplive.co.kr/' + info.id;
    card.target = '_blank';
    card.rel = 'noopener';
  }
  const btime = formatBtime(info.btime);
  const mode = info.mode || (info.live ? 'normal' : null);
  const isNormalLive = info.live && mode === 'normal';
  const hasThumb = info.thumb && isNormalLive;
  const thumbHtml = hasThumb
    ? `<img src="${info.thumb}" alt="${m.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : '';
  const placeholderInner = info.live && mode && mode !== 'normal'
    ? `<img src="${m.img}" alt="${m.name}"><div class="placeholder-mode-text">${MODE_PLACEHOLDER_TEXT[mode] || ''}</div>`
    : `<img src="${m.img}" alt="${m.name}">`;
  const modeBadge = info.live && mode && mode !== 'normal'
    ? `<span class="badge-mode ${mode}">${MODE_BADGE_LABEL[mode] || ''}</span>` : '';
  const profileUrl = soopProfileUrl(m.id);
  const avatarHtml = profileUrl
    ? `<img class="card-avatar" src="${profileUrl}" alt="${m.name}" onerror="this.onerror=null;this.src='${m.img}'">`
    : `<img class="card-avatar" src="${m.img}" alt="${m.name}">`;
  let titleText;
  if (!info.live) titleText = '오프라인';
  else if (info.title) titleText = info.title;
  else if (mode && mode !== 'normal') titleText = MODE_PLACEHOLDER_TEXT[mode] || '방송 중';
  else titleText = '방송 중';
  const btimeHtml = btime ? `<span class="card-btime"><span>⏱</span><span>${btime}</span></span>` : '';
  const nameColorStyle = info.live ? `color: ${m.color}` : '';
  card.innerHTML = `
    <div class="card-thumb">
      ${thumbHtml}
      <div class="placeholder" style="display:${hasThumb ? 'none' : 'flex'}">${placeholderInner}</div>
      ${modeBadge}
    </div>
    <div class="card-info">
      ${avatarHtml}
      <div class="card-text">
        <div class="card-name-row">
          <span class="card-name" style="${nameColorStyle}">${m.name}</span>
          ${btimeHtml}
        </div>
        <div class="card-title ${info.live ? 'is-live' : ''}">${escapeHtml(titleText)}</div>
      </div>
    </div>
  `;
  return card;
}

function renderEvent(e) {
  const iconMap = {
    start: SVG_ICONS.infinity, end: SVG_ICONS.infinity,
    title: '✎', category: SVG_ICONS.tag, mode_change: SVG_ICONS.diamond,
    post: SVG_ICONS.board, comment_recommend: SVG_ICONS.thumbsup,
    youtube: SVG_ICONS.youtube, cafe_post: SVG_ICONS.coffee,
  };
  const actionMap = {
    start: '방송 시작', end: '방송 종료',
    title: '방제 변경', category: '카테고리 변경', mode_change: '방송 모드 변경',
    post: '숲 게시글', comment_recommend: '댓글 추천',
    youtube: '유튜브 업로드', cafe_post: '카페 게시글',
  };
  const member = findMember(e.member_id);
  const avatarSrc = member ? member.img : '';
  const memberColor = member ? member.color : '#fff';
  let modeTag = '';
  if ((e.type === 'start' || e.type === 'end') && e.mode && e.mode !== 'normal') {
    const label = MODE_BADGE_LABEL[e.mode] || '';
    if (label) modeTag = `<span class="event-mode-tag ${e.mode}">${label}</span>`;
  }
  let targetTag = '';
  if (e.type === 'comment_recommend' && e.target_name) {
    targetTag = `<span class="event-target">(${escapeHtml(e.target_name)} 컨텐츠)</span>`;
  }
  if (e.type === 'cafe_post' && e.cafe_name) {
    targetTag = `<span class="event-target">(${escapeHtml(e.cafe_name)})</span>`;
  }
  let detail = '';
  if (e.type === 'start' && e.title) {
    detail = `<div class="event-detail">${escapeHtml(e.title)}</div>`;
  } else if (e.type === 'title' || e.type === 'category') {
    detail = `<div class="event-detail">${escapeHtml(e.before)} → ${escapeHtml(e.after)}</div>`;
  } else if (e.type === 'mode_change') {
    detail = `<div class="event-detail">${escapeHtml(MODE_LABEL[e.before] || e.before)} → ${escapeHtml(MODE_LABEL[e.after] || e.after)}</div>`;
  } else if ((e.type === 'post' || e.type === 'youtube' || e.type === 'comment_recommend' || e.type === 'cafe_post') && e.title) {
    detail = `<div class="event-detail">${escapeHtml(e.title)}</div>`;
  }
  if (e.type === 'end' && !e.url && e.member_id) {
    e = { ...e, url: `https://www.sooplive.com/station/${e.member_id}/vod` };
  }
  const eventTime = new Date(e.time).getTime() || 0;
  const iconHtml = iconMap[e.type] || '•';
  const inner = `
    <div class="event-icon ${e.type}">${iconHtml}</div>
    ${avatarSrc ? `<img class="event-avatar" src="${avatarSrc}" alt="${escapeHtml(e.member_name)}">` : ''}
    <div class="event-body">
      <div>
        <span class="event-member" style="color: ${memberColor}">${escapeHtml(e.member_name)}</span>
        <span class="event-action">${actionMap[e.type] || e.type}</span>
        ${targetTag}${modeTag}
      </div>
      ${detail}
    </div>
    <div class="event-time">
      <span class="event-time-rel">${formatRelTime(e.time)}</span>
      <span class="event-time-abs">${formatAbsTime(e.time)}</span>
    </div>
  `;
  const LIVE_NAV_TYPES = new Set(['start', 'title', 'category', 'mode_change']);
  if (LIVE_NAV_TYPES.has(e.type)) {
    const liveUrl = `https://play.sooplive.co.kr/${e.member_id}`;
    return `<div class="event" data-time="${eventTime}"><a class="event-link" href="${escapeHtml(liveUrl)}" target="_blank" rel="noopener">${inner}</a></div>`;
  }
  if (e.url) {
    return `<div class="event" data-time="${eventTime}"><a class="event-link" href="${escapeHtml(e.url)}" target="_blank" rel="noopener">${inner}</a></div>`;
  }
  return `<div class="event" data-time="${eventTime}">${inner}</div>`;
}

function initFilterUI() {
  const mc = document.getElementById('filterMembers');
  if (mc && !mc.dataset.inited) {
    mc.innerHTML = MEMBERS.map(m => `
      <button class="filter-member" data-id="${m.id}" title="${m.name}">
        <img src="${m.img}" alt="${m.name}">
      </button>
    `).join('');
    mc.querySelectorAll('.filter-member').forEach(btn => {
      const id = btn.dataset.id;
      btn.classList.toggle('on', filterState.members.has(id));
      btn.addEventListener('click', () => {
        if (filterState.members.has(id)) filterState.members.delete(id);
        else filterState.members.add(id);
        btn.classList.toggle('on', filterState.members.has(id));
        lsSetSet(LS_FILTER_MEMBERS, filterState.members);
        updateMemberAllToggle();
        applyFilter();
      });
    });
    mc.dataset.inited = '1';
  }
  const mAll = document.getElementById('filterMemberToggleAll');
  if (mAll && !mAll.dataset.inited) {
    mAll.addEventListener('click', () => {
      const allSelected = filterState.members.size === MEMBERS.length;
      filterState.members = allSelected ? new Set() : new Set(MEMBERS.map(m => m.id));
      lsSetSet(LS_FILTER_MEMBERS, filterState.members);
      mc.querySelectorAll('.filter-member').forEach(b => {
        b.classList.toggle('on', filterState.members.has(b.dataset.id));
      });
      updateMemberAllToggle();
      applyFilter();
    });
    mAll.dataset.inited = '1';
  }
  updateMemberAllToggle();
  const tc = document.getElementById('filterTypes');
  if (tc && !tc.dataset.inited) {
    tc.querySelectorAll('.filter-type').forEach(btn => {
      const type = btn.dataset.type;
      if (type === 'all') return;
      btn.classList.toggle('on', filterState.types.has(type));
      btn.addEventListener('click', () => {
        if (filterState.types.has(type)) filterState.types.delete(type);
        else filterState.types.add(type);
        btn.classList.toggle('on', filterState.types.has(type));
        lsSetSet(LS_FILTER_TYPES, filterState.types);
        updateTypeAllToggle();
        applyFilter();
      });
    });
    tc.dataset.inited = '1';
  }
  const tAll = document.getElementById('filterTypeToggleAll');
  if (tAll && !tAll.dataset.inited) {
    tAll.addEventListener('click', () => {
      const allSelected = filterState.types.size === ALL_TYPE_KEYS.length;
      filterState.types = allSelected ? new Set() : new Set(ALL_TYPE_KEYS);
      lsSetSet(LS_FILTER_TYPES, filterState.types);
      tc.querySelectorAll('.filter-type').forEach(b => {
        const t = b.dataset.type;
        if (t === 'all') return;
        b.classList.toggle('on', filterState.types.has(t));
      });
      updateTypeAllToggle();
      applyFilter();
    });
    tAll.dataset.inited = '1';
  }
  updateTypeAllToggle();
}

function applyFilter() {
  const tl = document.getElementById('timeline');
  if (!tl) return;
  const typeToCat = (et) => {
    if (et === 'post' || et === 'comment_recommend') return 'post';
    if (et === 'youtube') return 'youtube';
    if (et === 'cafe_post') return 'cafe';
    return 'soop';
  };
  const filtered = allEvents.filter(e => {
    if (!filterState.members.has(e.member_id)) return false;
    if (!filterState.types.has(typeToCat(e.type))) return false;
    return true;
  });
  if (filtered.length === 0) {
    tl.innerHTML = allEvents.length === 0
      ? '<div class="timeline-empty">아직 기록된 이벤트가 없어요<br><br>방송, 게시글, 유튜브 영상 등이 올라오면 여기에 표시됩니다</div>'
      : '<div class="timeline-empty">필터 조건에 맞는 이벤트가 없어요</div>';
  } else {
    tl.innerHTML = filtered.map(renderEvent).join('');
  }
  const summary = document.getElementById('filterSummary');
  if (summary) summary.textContent = '선택된 멤버/종류만 알림됩니다.';

}

function selectStatsTab(tabId) {
  statsState.selectedTab = tabId;
  document.querySelectorAll('.stats-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tabId);
  });
  if (tabId !== 'all') {
    const latestDate = findLatestActivityDate(tabId);
    if (latestDate) {
      const d = new Date(latestDate);
      statsState.viewMonth = { year: d.getFullYear(), month: d.getMonth() + 1 };
      statsState.selectedDate = isoToKstDateKey(latestDate);
    } else {
      const now = new Date();
      statsState.viewMonth = { year: now.getFullYear(), month: now.getMonth() + 1 };
      statsState.selectedDate = null;
    }
  }
  renderStatsBody();
}

function findLatestActivityDate(memberId) {
  const ms = getMemberStatsForView(memberId);
  if (!ms) return null;
  let latestBroadcast = null;
  for (const s of (ms.sessions || [])) {
    if (!s.start) continue;
    const t = new Date(s.start).getTime();
    if (isNaN(t)) continue;
    if (latestBroadcast === null || t > new Date(latestBroadcast).getTime()) latestBroadcast = s.start;
  }
  if (latestBroadcast) return latestBroadcast;
  let latest = null;
  const candidates = [
    ...(ms.posts || []).map(p => p.time),
    ...(ms.youtube || []).map(y => y.time),
    ...(ms.cafe || []).map(c => c.time),
  ];
  for (const t of candidates) {
    const ms2 = new Date(t).getTime();
    if (isNaN(ms2)) continue;
    if (latest === null || ms2 > new Date(latest).getTime()) latest = t;
  }
  return latest;
}

function computeMonthSummary(memberStats, year, month1) {
  const result = {
    daysWithBroadcast: 0, totalDaysInMonth: daysInMonth(year, month1),
    totalDurationMs: 0, postCount: 0, youtubeCount: 0, cafeCount: 0,
    sessionsByDate: {}, postsByDate: {}, youtubeByDate: {}, cafeByDate: {},
  };
  if (!memberStats) return result;
  const monthStart = new Date(year, month1 - 1, 1, 0, 0, 0).getTime();
  const monthEnd = new Date(year, month1, 1, 0, 0, 0).getTime();
  const dateSet = new Set();
  for (const s of (memberStats.sessions || [])) {
    const startMs = new Date(s.start).getTime();
    if (isNaN(startMs) || startMs < monthStart || startMs >= monthEnd) continue;
    const dateKey = isoToKstDateKey(s.start);
    if (!dateKey) continue;
    dateSet.add(dateKey);
    if (!result.sessionsByDate[dateKey]) result.sessionsByDate[dateKey] = [];
    result.sessionsByDate[dateKey].push(s);
    if (s.end) {
      const endMs = new Date(s.end).getTime();
      if (!isNaN(endMs) && endMs > startMs) result.totalDurationMs += (endMs - startMs);
    }
  }
  result.daysWithBroadcast = dateSet.size;
  for (const p of (memberStats.posts || [])) {
    const t = new Date(p.time).getTime();
    if (!isNaN(t) && t >= monthStart && t < monthEnd) {
      result.postCount++;
      const dateKey = isoToKstDateKey(p.time);
      if (dateKey) {
        if (!result.postsByDate[dateKey]) result.postsByDate[dateKey] = [];
        result.postsByDate[dateKey].push(p);
      }
    }
  }
  for (const y of (memberStats.youtube || [])) {
    const t = new Date(y.time).getTime();
    if (!isNaN(t) && t >= monthStart && t < monthEnd) {
      result.youtubeCount++;
      const dateKey = isoToKstDateKey(y.time);
      if (dateKey) {
        if (!result.youtubeByDate[dateKey]) result.youtubeByDate[dateKey] = [];
        result.youtubeByDate[dateKey].push(y);
      }
    }
  }
  for (const c of (memberStats.cafe || [])) {
    const t = new Date(c.time).getTime();
    if (!isNaN(t) && t >= monthStart && t < monthEnd) {
      result.cafeCount++;
      const dateKey = isoToKstDateKey(c.time);
      if (dateKey) {
        if (!result.cafeByDate[dateKey]) result.cafeByDate[dateKey] = [];
        result.cafeByDate[dateKey].push(c);
      }
    }
  }
  return result;
}

function renderCalendar(year, month1, sum) {
  const { sessionsByDate={}, postsByDate={}, youtubeByDate={}, cafeByDate={} } = sum;
  const totalDays = daysInMonth(year, month1);
  const firstDow = new Date(year, month1 - 1, 1).getDay();
  const todayKey = isoToKstDateKey(new Date().toISOString());
  const weekdays = ['일','월','화','수','목','금','토'];
  let html = `<div class="calendar"><div class="calendar-grid">`;
  weekdays.forEach((w, i) => {
    html += `<div class="calendar-weekday ${i===0?'sun':i===6?'sat':''}">${w}</div>`;
  });
  for (let i = 0; i < firstDow; i++) html += `<div class="calendar-day outside"></div>`;
  for (let day = 1; day <= totalDays; day++) {
    const dateKey = ymdKey(year, month1, day);
    const sessions = sessionsByDate[dateKey] || [];
    const posts = postsByDate[dateKey] || [];
    const youtubes = youtubeByDate[dateKey] || [];
    const cafes = cafeByDate[dateKey] || [];
    const hasBroadcast = sessions.length > 0;
    const hasPost = posts.length > 0;
    const hasYoutube = youtubes.length > 0;
    const hasCafe = cafes.length > 0;
    const hasActivity = hasBroadcast || hasPost || hasYoutube || hasCafe;
    const classes = ['calendar-day'];
    if (hasBroadcast) classes.push('has-broadcast');
    if (hasActivity) classes.push('has-activity');
    if (dateKey === todayKey) classes.push('today');
    if (statsState.selectedDate === dateKey) classes.push('selected');
    let bottomLine = '';
    if (hasBroadcast) {
      bottomLine = `<span class="calendar-daycount">${sessions.length}회</span>`;
    } else if (hasPost || hasYoutube || hasCafe) {
      const dots = [];
      if (hasPost) dots.push('<span class="calendar-day-dot post"></span>');
      if (hasYoutube) dots.push('<span class="calendar-day-dot youtube"></span>');
      if (hasCafe) dots.push('<span class="calendar-day-dot cafe"></span>');
      bottomLine = `<div class="calendar-day-dots">${dots.join('')}</div>`;
    }
    html += `<button class="${classes.join(' ')}" data-date="${dateKey}"><span class="calendar-daynum">${day}</span>${bottomLine}</button>`;
  }
  const trailing = (7 - ((firstDow + totalDays) % 7)) % 7;
  for (let i = 0; i < trailing; i++) html += `<div class="calendar-day outside"></div>`;
  html += `</div></div>`;
  return html;
}

function renderDayDetail(year, month1, sum) {
  const { sessionsByDate={}, postsByDate={}, youtubeByDate={}, cafeByDate={} } = sum;
  const date = statsState.selectedDate;
  if (!date) return `<div class="day-detail-empty">달력에서 날짜를 선택하면<br>해당 일의 활동 기록을 볼 수 있습니다</div>`;
  const sessions = sessionsByDate[date] || [];
  const posts = postsByDate[date] || [];
  const youtubes = youtubeByDate[date] || [];
  const cafes = cafeByDate[date] || [];
  const totalActivities = sessions.length + posts.length + youtubes.length + cafes.length;
  if (totalActivities === 0) return `<div class="day-detail-title">${date}</div><div class="day-detail-empty">이 날은 활동 기록이 없어요</div>`;
  const summaryParts = [];
  if (sessions.length > 0) summaryParts.push(`방송 ${sessions.length}회`);
  if (posts.length > 0) summaryParts.push(`게시글 ${posts.length}개`);
  if (youtubes.length > 0) summaryParts.push(`유튜브 ${youtubes.length}개`);
  if (cafes.length > 0) summaryParts.push(`카페 ${cafes.length}개`);
  let html = `<div class="day-detail-title">${date} · ${summaryParts.join(' · ')}</div>`;
  const items = [];
  for (const s of sessions) {
    const t = new Date(s.start).getTime();
    if (!isNaN(t)) items.push({ kind: 'session', time: t, data: s });
  }
  for (const p of posts) {
    const t = new Date(p.time).getTime();
    if (!isNaN(t)) items.push({ kind: 'post', time: t, data: p });
  }
  for (const y of youtubes) {
    const t = new Date(y.time).getTime();
    if (!isNaN(t)) items.push({ kind: 'youtube', time: t, data: y });
  }
  for (const c of cafes) {
    const t = new Date(c.time).getTime();
    if (!isNaN(t)) items.push({ kind: 'cafe', time: t, data: c });
  }
  items.sort((a, b) => a.time - b.time);
  for (const item of items) {
    if (item.kind === 'session') {
      const s = item.data;
      const startStr = formatHHMM(s.start);
      const endStr = s.end ? formatHHMM(s.end) : '진행 중';
      let durStr = '';
      if (s.end) {
        const ms = new Date(s.end).getTime() - new Date(s.start).getTime();
        durStr = ` · ${formatDuration(ms)}`;
      }
      const modeBadge = `<span class="day-session-mode ${s.mode || 'normal'}">${MODE_LABEL[s.mode] || '일반 방송'}</span>`;
      let changesHtml = '';
      if (s.changes && s.changes.length > 0) {
        changesHtml = `<div class="day-session-changes">${s.changes.map(c => {
          let icon, label, valHtml;
          if (c.type === 'title') { icon = '✎'; label = '방제'; valHtml = `${escapeHtml(c.before||'')} → ${escapeHtml(c.after||'')}`; }
          else if (c.type === 'category') { icon = SVG_ICONS.tag; label = '카테고리'; valHtml = `${escapeHtml(c.before||'')} → ${escapeHtml(c.after||'')}`; }
          else if (c.type === 'mode_change') { icon = SVG_ICONS.diamond; label = '방송 모드'; valHtml = `${MODE_LABEL[c.before]||c.before} → ${MODE_LABEL[c.after]||c.after}`; }
          else { icon = '•'; label = c.type; valHtml = `${escapeHtml(c.before||'')} → ${escapeHtml(c.after||'')}`; }
          return `<div class="day-session-change"><span class="day-session-change-time">${formatHHMM(c.time)}</span><span class="day-session-change-icon">${icon}</span><span><b>${label}</b> ${valHtml}</span></div>`;
        }).join('')}</div>`;
      }
      html += `<div class="day-session"><div class="day-session-row-head"><span class="day-kind-icon broadcast">${SVG_ICONS.infinity}</span><span class="day-session-time">${startStr} ~ ${endStr}${durStr}</span></div><div class="day-session-title">${modeBadge}${escapeHtml(s.title||'(방제 없음)')}</div>${changesHtml}</div>`;
    } else if (item.kind === 'post') {
      const p = item.data;
      const inner = `<span class="day-kind-icon post">${SVG_ICONS.board}</span><span class="day-item-time">${formatHHMM(p.time)}</span><span class="day-item-title">${escapeHtml(p.title||'(제목 없음)')}</span>`;
      html += p.url ? `<a class="day-item" href="${escapeHtml(p.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="day-item">${inner}</div>`;
    } else if (item.kind === 'youtube') {
      const y = item.data;
      const inner = `<span class="day-kind-icon youtube">${SVG_ICONS.youtube}</span><span class="day-item-time">${formatHHMM(y.time)}</span><span class="day-item-title">${escapeHtml(y.title||'(제목 없음)')}</span>`;
      html += y.url ? `<a class="day-item" href="${escapeHtml(y.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="day-item">${inner}</div>`;
    } else if (item.kind === 'cafe') {
      const c = item.data;
      const cafeNameEsc = escapeHtml(c.cafe_name || '');
      const inner = `<span class="day-kind-icon cafe">${SVG_ICONS.coffee}</span><span class="day-item-time">${formatHHMM(c.time)}</span><span class="day-item-title">${cafeNameEsc ? `[${cafeNameEsc}] ` : ''}${escapeHtml(c.title||'(제목 없음)')}</span>`;
      html += c.url ? `<a class="day-item" href="${escapeHtml(c.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="day-item">${inner}</div>`;
    }
  }
  return html;
}

async function loadEvents() {
  try {
    const res = await fetch(WORKER_URL + '/events');
    if (!res.ok) throw new Error('no events');
    const data = await res.json();
    allEvents = data.events || [];
    processNewEventsForNotification(allEvents);
    initFilterUI();
    applyFilter();
    lastEventsUpdate = new Date();
    updateHeaderCenter();
    refreshUnreadIndicator();
  } catch (e) {
    document.getElementById('timeline').innerHTML =
      '<div class="timeline-empty">이벤트 데이터를 불러올 수 없어요</div>';
  }
}

async function loadStatsMonth(yyyymm) {
  if (!yyyymm) return;
  if (!isCurrentMonth(yyyymm)) {
    const cached = lsGetMonthCache(yyyymm);
    if (cached) { statsState.data[yyyymm] = cached; return; }
  }
  if (statsState.loadingMonths.has(yyyymm)) return;
  statsState.loadingMonths.add(yyyymm);
  try {
    const res = await fetch(`${WORKER_URL}/stats?month=${yyyymm}`);
    if (!res.ok) throw new Error('stats fetch failed');
    const data = await res.json();
    const monthData = data.stats || {};
    statsState.data[yyyymm] = monthData;
    if (!isCurrentMonth(yyyymm)) lsSetMonthCache(yyyymm, monthData);
  } catch (e) {
  } finally {
    statsState.loadingMonths.delete(yyyymm);
  }
}

async function loadStats() {
  try {
    const now = new Date();
    const cur = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    await loadStatsMonth(cur);
    if (currentPage === 'stats') renderStatsBody();
    lastStatsUpdate = new Date();
    updateHeaderCenter();
  } catch (e) {
    if (currentPage === 'stats') {
      const body = document.getElementById('statsBody');
      if (body) body.innerHTML = '<div class="loading"><div>통계 데이터를 불러올 수 없어요</div></div>';
    }
  }
}

async function loadLive() {
  try {
    const res = await fetch(WORKER_URL + '/');
    const data = await res.json();
    const infoMap = {};
    data.members.forEach(m => { infoMap[m.id] = m; });
    const sorted = [...MEMBERS].sort((a, b) => {
      const al = (infoMap[a.id] && infoMap[a.id].live) ? 1 : 0;
      const bl = (infoMap[b.id] && infoMap[b.id].live) ? 1 : 0;
      return bl - al;
    });
    const grid = document.createElement('div');
    grid.className = 'grid';
    let liveCount = 0;
    sorted.forEach((m, i) => {
      const info = infoMap[m.id] || { id: m.id, live: false };
      grid.appendChild(buildCard(m, info, i * 35));
      if (info.live) liveCount++;
    });
    document.getElementById('app').innerHTML = '';
    document.getElementById('app').appendChild(grid);
    const liveBadge = document.getElementById('navLiveBadge');
    const liveCountEl = document.getElementById('navLiveCount');
    if (liveBadge && liveCountEl) {
      liveCountEl.textContent = liveCount;
      liveBadge.classList.toggle('on', liveCount > 0);
      liveBadge.classList.toggle('off', liveCount === 0);
    }
    lastLiveUpdate = new Date();
    updateHeaderCenter();
  } catch (e) {
    document.getElementById('app').innerHTML =
      '<div class="loading"><div>데이터를 불러올 수 없어요</div></div>';
    console.error(e);
  }
}

function renderLinks() {
  const body = document.getElementById('linksBody');
  if (!body) return;
  const memberHeader = MEMBERS.map(m => `
    <th>
      <img class="links-th-avatar" src="${m.img}" alt="${escapeHtml(m.name)}">
      <span class="links-th-name" style="color: ${m.color}">${escapeHtml(m.name)}</span>
    </th>
  `).join('');
  const COLORS = {
    soop:'#60a5fa', youtube:'#ef4444', cafe:'#03C75A', namuwiki:'#27a567',
    instagram:'#E1306C', x:'#ffffff', discord:'#5865F2', fancim:'#ffffff',
    calendar:'#4285F4', music:'#fbbf24', site:'#9ca3af',
    naverOgq:'#03C75A', soopOgq:'#60a5fa',
  };
  const ICON_BG = { x:'#000000', fancim:'#000000' };
  const emptyCell = `<td><div class="link-empty">-</div></td>`;
  const ICON_FOR = {
    soop: SVG_ICONS.infinity, youtube: SVG_ICONS.youtube, cafe: SVG_ICONS.coffee,
    namuwiki: SVG_ICONS.book, instagram: SVG_ICONS.instagram, x: SVG_ICONS.x,
    discord: SVG_ICONS.discord, fancim: SVG_ICONS.fancimF, calendar: SVG_ICONS.calendar,
    music: SVG_ICONS.music, site: SVG_ICONS.externalLink,
    naverOgq: SVG_ICONS.naver, soopOgq: SVG_ICONS.infinity,
  };
  function iconLinkCell(kind, label, url) {
    if (!url) return emptyCell;
    const icon = ICON_FOR[kind] || '';
    const color = COLORS[kind] || 'var(--text)';
    const bg = ICON_BG[kind];
    const iconStyle = bg ? `color: ${color}; background: ${bg}; padding: 2px;` : `color: ${color};`;
    return `<td><a class="link-btn" href="${escapeHtml(url)}" target="_blank" rel="noopener"><span class="link-icon" style="${iconStyle}">${icon}</span><span class="link-label">${escapeHtml(label)}</span></a></td>`;
  }
  function multiIconLinkCell(items) {
    if (!items || items.length === 0) return emptyCell;
    const btns = items.map(it => {
      const icon = ICON_FOR[it.kind] || '';
      const color = COLORS[it.kind] || 'var(--text)';
      const bg = ICON_BG[it.kind];
      const iconStyle = bg ? `color: ${color}; background: ${bg}; padding: 2px;` : `color: ${color};`;
      return `<a class="link-btn" href="${escapeHtml(it.url)}" target="_blank" rel="noopener"><span class="link-icon" style="${iconStyle}">${icon}</span><span class="link-label">${escapeHtml(it.label)}</span></a>`;
    }).join('');
    return `<td><div class="links-cell">${btns}</div></td>`;
  }
  function inferKindFromLabel(label) {
    if (label === '인스타그램') return 'instagram';
    if (label === 'X') return 'x';
    if (label === '디스코드') return 'discord';
    if (label === '팬심') return 'fancim';
    if (label === '일정표') return 'calendar';
    if (label === '노래책') return 'music';
    if (label === '팬사이트') return 'site';
    return 'site';
  }
  const rowBangsong = MEMBERS.map(m => {
    const url = MEMBER_LINKS[m.id]?.common?.['방송국'];
    return iconLinkCell('soop', '방송국', typeof url === 'string' ? url : url?.url);
  }).join('');
  const rowYoutube = MEMBERS.map(m => {
    const links = MEMBER_LINKS[m.id];
    if (!links || !links.common) return emptyCell;
    const items = [];
    const yt = links.common['유튜브'];
    if (yt) items.push({ kind: 'youtube', label: typeof yt === 'string' ? '유튜브' : (yt.label||'유튜브'), url: typeof yt === 'string' ? yt : yt.url });
    const yt2 = links.common['유튜브2'];
    if (yt2) items.push({ kind: 'youtube', label: typeof yt2 === 'string' ? '유튜브' : (yt2.label||'유튜브'), url: typeof yt2 === 'string' ? yt2 : yt2.url });
    return multiIconLinkCell(items);
  }).join('');
  const rowFancafe = MEMBERS.map(m => {
    const url = MEMBER_LINKS[m.id]?.common?.['팬카페'];
    return iconLinkCell('cafe', '팬카페', typeof url === 'string' ? url : url?.url);
  }).join('');
  const rowNamu = MEMBERS.map(m => {
    const url = MEMBER_LINKS[m.id]?.common?.['나무위키'];
    return iconLinkCell('namuwiki', '나무위키', typeof url === 'string' ? url : url?.url);
  }).join('');
  const rowInsta = MEMBERS.map(m => iconLinkCell('instagram', '인스타그램', MEMBER_LINKS[m.id]?.instagram)).join('');
  const rowX = MEMBERS.map(m => iconLinkCell('x', 'X', MEMBER_LINKS[m.id]?.x)).join('');
  const rowDiscordOrFancim = MEMBERS.map(m => {
    const items = (MEMBER_LINKS[m.id]?.discordOrFancim || []).map(it => ({ kind: inferKindFromLabel(it.label), label: it.label, url: it.url }));
    return multiIconLinkCell(items);
  }).join('');
  const rowEtc = MEMBERS.map(m => {
    const items = (MEMBER_LINKS[m.id]?.etc || []).map(it => ({ kind: inferKindFromLabel(it.label), label: it.label, url: it.url }));
    return multiIconLinkCell(items);
  }).join('');
  const rowOgq = MEMBERS.map(m => {
    const ogq = MEMBER_LINKS[m.id]?.ogq || [];
    if (ogq.length === 0) return emptyCell;
    const btns = ogq.map(o => {
      const platformKind = o.platform === '네이버' ? 'naverOgq' : 'soopOgq';
      const icon = ICON_FOR[platformKind];
      const color = COLORS[platformKind];
      return `<a class="link-btn ogq-btn" href="${escapeHtml(o.url)}" target="_blank" rel="noopener"><span class="ogq-name">${escapeHtml(o.name)}</span><span class="ogq-platform"><span class="link-icon" style="color: ${color}">${icon}</span>${escapeHtml(o.platform)}</span></a>`;
    }).join('');
    return `<td><div class="links-cell">${btns}</div></td>`;
  }).join('');
  body.innerHTML = `
    <div class="links-section">
      <div class="links-table-wrap">
        <table class="links-table">
          <thead><tr>${memberHeader}</tr></thead>
          <tbody>
            <tr>${rowBangsong}</tr>
            <tr>${rowYoutube}</tr>
            <tr>${rowFancafe}</tr>
            <tr>${rowNamu}</tr>
            <tr>${rowInsta}</tr>
            <tr>${rowX}</tr>
            <tr>${rowDiscordOrFancim}</tr>
            <tr>${rowEtc}</tr>
            <tr>${rowOgq}</tr>
          </tbody>
        </table>
      </div>
    </div>
  `;
}

renderLinks();
loadLive();
loadEvents();
loadStats();
setInterval(loadLive, 60 * 1000);
setInterval(loadEvents, 60 * 1000);
setInterval(loadStats, 60 * 1000);
</script>
</body>
</html>
