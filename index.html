let CHEM_NAMES = {};    // '아이디1:아이디2' → [{name, types[], desc, clip}] — 같은 쌍의 여러 행이 배열로 쌓임(행 순서 유지)
let CHEM_GROUPS = [];   // [{members:[아이디...], entries:[{name, types[], desc, clip}]}]
function applyChemNameRows(rows) {
  const names = {};
  const groups = [];
  const memberIndex = {};
  MEMBERS.forEach((m, i) => { memberIndex[m.id] = i; });
  for (const r of (rows || [])) {
    const name = (r[0] || '').trim().replace(/\s*,\s*/g, ' · ');  // 시트엔 쉼표로 적고 표시는 사이트 규약인 가운뎃점
    if (!name || name === '케미명') continue;  // 빈 행·헤더 행 무시
    // B열 종류: | 구분 다중 허용, 유효값만 통과. 빈 칸·오타는 기타로 흘림(이름이 있는데 미분류일 수는 없음 — 미분류는 '행 없음'의 뜻)
    const types = (r[1] || '').split('|').map(t => t.trim()).filter(t => ['컨텐츠', '프로필', '기타'].includes(t));
    if (types.length === 0) types.push('기타');
    const desc = (r[2] || '').trim();
    const clip = (r[3] || '').trim();
    // E열~ 멤버 칸: 칸에 적힌 이름으로 멤버 매칭(빈 칸·미상 이름은 스킵)
    const ids = r.slice(4)
      .map(c => (c || '').trim())
      .filter(c => c.length > 0)
      .map(nm => (MEMBERS.find(x => x.name === nm) || {}).id)
      .filter(Boolean);
    // 쌍 키는 renderChemistry의 케미 카드 조회 키(`m1.id:m2.id`, MEMBERS 순서라 i<j)와 맞아야 하므로 MEMBERS 인덱스 순으로 정렬
    ids.sort((a, b) => memberIndex[a] - memberIndex[b]);
    const entry = { name, types, desc, clip };
    if (ids.length === 2) {
      const k = `${ids[0]}:${ids[1]}`;
      (names[k] = names[k] || []).push(entry);   // 같은 쌍 여러 행 → 배열에 순서대로(표시는 가운뎃점 나열)
    } else if (ids.length >= 3) {
      const gkey = ids.join(':');
      const ex = groups.find(g => g.members.join(':') === gkey);
      if (ex) ex.entries.push(entry);
      else groups.push({ members: ids, entries: [entry] });
    }
  }
  CHEM_NAMES = names;
  CHEM_GROUPS = groups;
}

async function loadChemNames() {
  if (Object.keys(CHEM_NAMES).length === 0 && CHEM_GROUPS.length === 0) {
    const cached = lsGet(LS_CHEMNAME_CACHE, null);
    if (cached) {
      try { applyChemNameRows(JSON.parse(cached)); if (currentPage === 'chemistry') renderChemistry(); } catch (e) {}
    }
  }
  try {
    const res = await fetch(CHEM_NAME_SHEET_URL);
    if (!res.ok) throw new Error('no data');
    const rows = parseCSV(await res.text());
    applyChemNameRows(rows);
    lsSet(LS_CHEMNAME_CACHE, JSON.stringify(rows));
    if (currentPage === 'chemistry') renderChemistry();
  } catch (e) {}
}

// 유튜브 영상 ID. watch?v= / youtu.be / shorts / live 네 형태를 받는다(embed 포함).
function youtubeVideoId(url) {
  const m = String(url).match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : '';
}

  if (currentPage === 'members') renderMembersBody();
  // 최신 fetch(병렬, 실패 격리) — 실패 시 캐시본 유지(확정: 시트 단일 소스, 첫 방문+장애 조합만 해당 섹션 공백)
  const pull = (url, lsKey, apply) => fetch(url)
    .then(r => { if (!r.ok) throw new Error('no data'); return r.text(); })
    .then(t => { const rows = parseCSV(t); lsSet(lsKey, JSON.stringify(rows)); apply(rows); });
  await Promise.allSettled([
    pull(PROFILE_VIDEO_SHEET_URL, LS_PROFVIDEO_CACHE, rows => { profileVideos = parseProfileVideoRows(rows); }),
    pull(CREW_ACT_SHEET_URL, LS_CREWACT_CACHE, rows => { crewActs = parseCrewActRows(rows); }),
    pull(MEMBER_INFO_SHEET_URL, LS_MEMBERINFO_CACHE, rows => { MEMBER_INFO = parseMemberInfoRows(rows); }),
    pull(VACATION_SHEET_URL, LS_VACATION_CACHE, rows => { VACATION = parseVacationRows(rows); }),   // 카드 반영은 다음 loadFeed 폴링(≤10초)
  ]);
  crewSheetsDone = true;
  if (currentPage === 'members') renderMembersBody();
  updatePageTitle();   // 상단바 축하 박스(N번째 생일·방송 N주년)가 MEMBER_INFO를 읽음 — 시트 도착 후 재구성
}

function calcAge(memberId, ageStr) {
  if (!ageStr) return '';
  if (ageStr === '비공개') return '비공개';
  if (ageStr === '700살') return '700세';
  const match = ageStr.match(/^(\d{4})년생$/);
  if (!match) return ageStr;
  const birthYear = parseInt(match[1]);
  const bd = MEMBER_BIRTHDAYS[memberId];
  const kst = new Date(Date.now() + 9 * 3600 * 1000);
  const cy = kst.getUTCFullYear(), cm = kst.getUTCMonth() + 1, cd = kst.getUTCDate();
  let age = cy - birthYear;
  if (bd && (cm < bd.month || (cm === bd.month && cd < bd.day))) age--;
  return `${age}세 (${ageStr})`;
}

function calcDaysSince(dateStr) {
  if (!dateStr) return '';
  const match = dateStr.match(/^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일$/);
  if (!match) return dateStr;
  const startDate = new Date(Date.UTC(parseInt(match[1]), parseInt(match[2]) - 1, parseInt(match[3])));
  const kst = new Date(Date.now() + 9 * 3600 * 1000);
  const today = new Date(Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), kst.getUTCDate()));
  const diffDays = Math.floor((today - startDate) / 86400000);
  if (diffDays < 0) return dateStr;
  return `${dateStr} (D+${diffDays}일)`;
}

const CT_FORMATION = new Date(Date.UTC(2025, 10, 30));

// 지정색이 어두우면 '글자용'으로만 밝기를 올린다(채도·색상은 유지).
// [배경] #FF0000은 값만 최대치지 실제 밝기는 낮다(휘도 기여 R 21%·G 72%·B 7%). 어두운 배경에서 11px 글씨로 쓰면
//        대비가 4.66에 그치고 서브픽셀 렌더링이 붉은 테두리를 만들어 "깨져 보인다"(2026-08-04 지적).
//        밝기를 62%까지만 올리면 #ff3d3d(대비 5.31) — 여전히 순색 계열로 읽힌다.
// 아이콘(SVG)에는 적용하지 않는다. 큰 도형이라 가독성 문제가 없고, 브랜드 색 정체성은 아이콘이 담당한다.
function lightenForText(hex, minL = 0.62) {
  const h = hex.replace('#', '');
  let r = parseInt(h.substring(0,2),16)/255, g = parseInt(h.substring(2,4),16)/255, b = parseInt(h.substring(4,6),16)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2;
  if (l >= minL || mx === mn) return hex;   // 이미 밝거나 무채색이면 그대로
  const s = (mx-mn) / (1 - Math.abs(2*l-1));
  let hd;
  if (mx === r) hd = ((g-b)/(mx-mn)) % 6; else if (mx === g) hd = (b-r)/(mx-mn) + 2; else hd = (r-g)/(mx-mn) + 4;
  hd *= 60; if (hd < 0) hd += 360;
  const c = (1 - Math.abs(2*minL - 1)) * s, x = c * (1 - Math.abs((hd/60) % 2 - 1)), m = minL - c/2;
  const seg = [[c,x,0],[x,c,0],[0,c,x],[0,x,c],[x,0,c],[c,0,x]][Math.floor(hd/60) % 6];
  return '#' + seg.map(v => Math.round((v+m)*255).toString(16).padStart(2,'0')).join('');
}

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return `${parseInt(h.substring(0,2),16)},${parseInt(h.substring(2,4),16)},${parseInt(h.substring(4,6),16)}`;
}

// 축하박스 아이콘 — 실물은 SVG_ICONS로 통합(산포 정리), 여기는 용도→도형 의미 매핑만 유지(호출부 무변경)
const CELEB_SVG = {
  birthday: SVG_ICONS.birthday,
  chuntaverse: SVG_ICONS.chuntaverse,
  broadcast: SVG_ICONS.soop,
};

function celebBox(svg, pcText, mbName, mbType, hexColor, hash) {
  const rgb = hexToRgb(hexColor);
  // 아이콘 PC·모바일 공통. PC: 전체 문구 / 모바일: "이름 종류" 한 줄(C안 — 높이는 다른 버튼과 동일, 폭만 가변)
  return `<a class="celebration-box" href="#${hash}" style="--cb-rgb:${rgb};color:${hexColor}">${svg}<span class="tb-t-pc">${pcText}</span><span class="tb-t-mb">${mbName} ${mbType}</span></a>`;
}

function getTodayCelebrations() {
  const kst = new Date(Date.now() + 9 * 3600 * 1000);
  const cy = kst.getUTCFullYear(), cm = kst.getUTCMonth() + 1, cd = kst.getUTCDate();
  const todayMs = Date.UTC(cy, cm - 1, cd);
  const results = [];

  for (const m of MEMBERS) {
    const bd = MEMBER_BIRTHDAYS[m.id];
    if (!bd || bd.month !== cm || bd.day !== cd) continue;
    const info = MEMBER_INFO[m.id];
    const birthMatch = info?.age?.match(/^(\d{4})년생$/);
    const nthText = birthMatch ? `${cy - parseInt(birthMatch[1])}번째 ` : '';
    results.push(celebBox(CELEB_SVG.birthday, `${m.name}님의 ${nthText}생일을<br>축하합니다!`, m.name, '생축!', m.color, `members:${m.id}`));
  }

  if (cm === 11 && cd === 30 && cy > 2025) {
    results.push(celebBox(CELEB_SVG.chuntaverse, `천타버스 결성 ${cy - 2025}주년을<br>축하합니다!`, '천타버스', `${cy - 2025}주년!`, '#61FFEC', 'members:crew'));
  }
  const ctDays = Math.floor((todayMs - CT_FORMATION.getTime()) / 86400000);
  if (ctDays > 0 && ctDays % 100 === 0 && !(cm === 11 && cd === 30)) {
    results.push(celebBox(CELEB_SVG.chuntaverse, `천타버스 결성 ${ctDays}일을<br>축하합니다!`, '천타버스', `${ctDays}일!`, '#61FFEC', 'members:crew'));
  }

  // 방송 기산 기준이 멤버마다 다름(2026-07-31 확정): 아래 명단은 '숲 기준일'을 기념하는 멤버 — "숲 방송"으로 표기하고 시트 I열(soopDate) 날짜로 기산(비면 H열 폴백).
  // 그 외(마다옴·나나문·임하밍·문모모·체비·플리)는 '플랫폼 무관 첫 방송일(H열)'이라 "숲"을 빼고 "방송"으로 표기.
  // 2026-08-10 개편: 구 H열의 숲 기준일이 I열로 이동, H열은 전원 실제 첫 방송일 — 명단 멤버의 기산 날짜와 문구는 개편 전과 동일하게 유지된다.
  const SOOP_BASED_START = new Set(['kappuchan', 'kyaang123', 'wellro314', 'mocamu2', 'dalta20', 'tleod1818']);   // 빙밍: 숲 데뷔 2022-10-04 기준(2026-08-02)
  for (const m of MEMBERS) {
    const info = MEMBER_INFO[m.id];
    const isSoop = SOOP_BASED_START.has(m.id);
    const baseDate = isSoop ? (info?.soopDate || info?.firstStream) : info?.firstStream;   // 명단 멤버의 기념 기산일 = 숲 기준일
    if (!baseDate) continue;
    const match = baseDate.match(/^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일$/);
    if (!match) continue;
    const bcWord = isSoop ? '숲 방송' : '방송';
    const fy = parseInt(match[1]), fm = parseInt(match[2]), fd = parseInt(match[3]);
    if (fm === cm && fd === cd && cy > fy) {
      results.push(celebBox(CELEB_SVG.broadcast, `${m.name}님의 ${bcWord} ${cy - fy}주년을<br>축하합니다!`, m.name, `${cy - fy}주년!`, m.color, `members:${m.id}`));
    } else {
      const days = Math.floor((todayMs - Date.UTC(fy, fm - 1, fd)) / 86400000);
      if (days > 0 && days % 100 === 0) {
        results.push(celebBox(CELEB_SVG.broadcast, `${m.name}님의 ${bcWord} ${days}일을<br>축하합니다!`, m.name, `${days}일!`, m.color, `members:${m.id}`));
      }
    }
  }

  return results;
}

// ── 상단바 링크 버튼 (구글 시트 gid=981813639) — 커버곡 하드코딩(구 BV_LINK) 대체: 곡·이벤트 교체를 배포 없이 시트에서 ──
// 열: A=링크(https만) B=아이콘 이름(SVG_ICONS 키, 빈칸/미지=youtube) C=모바일 라벨 D=PC 첫줄 E=PC 둘째줄(빈칸=한 줄) F=hex 색(#RRGGBB, 빈칸/무효=커버곡 핑크)
// 헤더 없음(1행부터 데이터), 행 수만큼 버튼 생성(0행=버튼 없음). 로드는 크루 시트와 동일 정책: 캐시 선표시 → fetch → 실패 시 캐시 유지.
const TOPBAR_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=981813639';
const LS_TOPBAR_CACHE = 'chuntaverse_topbar_links_v1';
let topbarLinks = [];

function parseTopbarRows(rows) {
  const out = [];
  for (const r of (rows || [])) {
    const url = (r[0] || '').trim();
    if (!/^https?:\/\//.test(url)) continue;   // 빈 행·메모성 행 자동 제외 + 프로토콜 화이트리스트(javascript: 등 차단 — 채팅 링크와 동일 정책)
    const iconKey = (r[1] || '').trim();
    const hexRaw = (r[5] || '').trim();
    out.push({
      url,
      icon: Object.prototype.hasOwnProperty.call(SVG_ICONS, iconKey) ? iconKey : 'youtube',
      mb: (r[2] || '').trim(),
      l1: (r[3] || '').trim(),
      l2: (r[4] || '').trim(),
      hex: /^#[0-9A-Fa-f]{6}$/.test(hexRaw) ? hexRaw : '#EC4899',
    });
  }
  return out;
}

function topbarLinksHtml() {
  return topbarLinks.map(b => {
    const pc = escapeHtml(b.l1) + (b.l2 ? '<br>' + escapeHtml(b.l2) : '');
    const tx = lightenForText(b.hex);   // 아이콘은 지정색 원본, 글자만 보정 — 순위 버튼과 동일 규칙(2026-08-04 일괄 적용)
    return `<a class="page-title-link tb-sheet-btn" href="${escapeHtml(b.url)}" target="_blank" rel="noopener" style="--tb-rgb:${hexToRgb(b.hex)};color:${b.hex}">${SVG_ICONS[b.icon] || SVG_ICONS.link}<span class="tb-t-pc" style="color:${tx}">${pc}</span><span class="tb-t-mb" style="color:${tx}">${escapeHtml(b.mb)}</span></a>`;
  }).join('');
}

// 좋아요 순위 버튼 — 시트를 프론트에서도 읽는다.
// 이유: 버튼 색(G열)과 '진행 중인 대회가 있는지'는 모달을 열기 전에 알아야 하는데, /like-ranking은 열 때만 호출하기 때문.
// 워커도 같은 시트를 읽지만 용도가 다르다(워커=수집 대상, 여기=버튼 표시). 활성 행 판정 기준(글번호 숫자·마감일)은 양쪽 동일하게 유지할 것.
const LIKE_RANK_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=1784349823';
const LS_LIKERANK_CACHE = 'chuntaverse_like_rank_btn_v1';
// 활성 대회 목록. 대회마다 버튼이 하나씩 생기고, 버튼은 자기 대회만 연다.
// (한 버튼에 전부 담으면 한 번 열 때 모든 대회를 긁게 되고, 버튼 이름도 하나만 적을 수 없어 구분이 안 된다)
let likeRankBtns = [];

function parseLikeRankBtnRows(rows) {
  const k = new Date(Date.now() + 9 * 3600 * 1000);   // KST 오늘(YYYY-MM-DD) — 워커의 마감 판정과 같은 기준
  const today = `${k.getUTCFullYear()}-${String(k.getUTCMonth() + 1).padStart(2, '0')}-${String(k.getUTCDate()).padStart(2, '0')}`;
  return rows
    .filter(r => (r[0] || '').trim() && /^\d+$/.test((r[1] || '').trim()) && (!(r[5] || '').trim() || (r[5] || '').trim() >= today))
    .map(r => ({
      titleNo: (r[1] || '').trim(),
      label: (r[2] || '').trim() || '천타버스 멤버들의',
      hex: /^#[0-9a-fA-F]{6}$/.test((r[6] || '').trim()) ? (r[6] || '').trim() : '#f0abfc',   // G열 미지정 시 기본색(연보라 — 기존 버튼들과 겹치지 않는 계열)
      // I열: 갱신 주기(초). 워커의 캐시 TTL과 같은 값을 써야 한다 — 폴링이 더 빠르면 캐시에 막혀 헛요청만 늘고,
      // 더 느리면 캐시가 놀아 신선도를 못 살린다. 범위 밖·미지정은 워커와 같은 기본값.
      refresh: (() => { const n = parseInt(r[8], 10); return (n >= RANK_REFRESH_MIN && n <= RANK_REFRESH_MAX) ? n : RANK_REFRESH_DEFAULT; })(),
    }));
}

async function loadLikeRankBtn() {
  try { const c = JSON.parse(lsGet(LS_LIKERANK_CACHE, 'null')); if (c) { likeRankBtns = parseLikeRankBtnRows(c); updatePageTitle(); } } catch (e) {}
  try {
    const res = await fetch(LIKE_RANK_SHEET_URL);
    if (!res.ok) throw new Error('no data');
    const rows = parseCSV(await res.text());
    lsSet(LS_LIKERANK_CACHE, JSON.stringify(rows));
    likeRankBtns = parseLikeRankBtnRows(rows);
    updatePageTitle();
  } catch (e) {}   // 실패 시 캐시본 유지 — 상단바 링크 시트와 동일 정책
}

async function loadTopbarLinks() {
  try { const c = JSON.parse(lsGet(LS_TOPBAR_CACHE, 'null')); if (c) { topbarLinks = parseTopbarRows(c); updatePageTitle(); } } catch (e) {}
  try {
    const res = await fetch(TOPBAR_SHEET_URL);
    if (!res.ok) throw new Error('no data');
    const rows = parseCSV(await res.text());
    lsSet(LS_TOPBAR_CACHE, JSON.stringify(rows));
    topbarLinks = parseTopbarRows(rows);
    updatePageTitle();
  } catch (e) {}   // 실패 시 캐시본 유지 — 첫 방문+시트 장애 조합에서만 버튼 공백(크루 시트와 동일 수용)
}

function updatePageTitle() {
  const el = document.getElementById('pageTitle');
  if (!el) return;
  const scheduleBtn = scheduleBtnHTML();  // 가장 임박한 날짜의 일정 묶음(같은 날 2건+는 열 정렬, 데이터 전엔 셸)
  const likeReqBtn = `<button class="page-title-link like-req-btn" id="likeReqBtn" type="button" onclick="openLikeRequests()">${SVG_ICONS.thumbsup}<span class="tb-t-pc">천타버스 멤버들의<br>좋아요 요청</span><span class="tb-t-mb">좋아요</span></button>`;
  const celebrations = getTodayCelebrations();
  // 아이콘엔 지정색 원본(브랜드 색 정체성), 글자만 lightenForText로 보정(11px 가독성). 둘을 나누는 이유는 헬퍼 주석 참조.
  // 대회 1건 = 버튼 1개. 진행 중인 대회가 없으면 버튼이 아예 안 뜬다(빈 모달을 열게 하지 않기 위해).
  // 모바일은 폭이 좁아 대회명을 못 넣는다 → 문구는 통일하고 구분은 색으로 유도(2026-08-04 확정).
  const rankBtn = likeRankBtns.map(b => {
    const tx = lightenForText(b.hex);   // 아이콘엔 지정색 원본, 글자만 보정 — 헬퍼 주석 참조
    return `<button class="page-title-link tb-sheet-btn rank-btn" type="button" onclick="openLikeRanking('${escapeHtml(b.titleNo)}')" style="--tb-rgb:${hexToRgb(b.hex)};color:${b.hex}">${SVG_ICONS.barChart}<span class="tb-t-pc" style="color:${tx}">${escapeHtml(b.label)}<br>좋아요 순위</span><span class="tb-t-mb" style="color:${tx}">좋아요 순위</span></button>`;
  }).join('');
  el.innerHTML = scheduleBtn + likeReqBtn + rankBtn + topbarLinksHtml() + celebrations.join('');
  // 모달 열기 전 숨김목록을 미리 선로딩(느린 시트 왕복을 클릭 전에 벌어둠). hover/터치 시작 시 1회.
  const btn = document.getElementById('likeReqBtn');
  if (btn) {
    btn.addEventListener('mouseenter', preloadLikeHide);
    btn.addEventListener('touchstart', preloadLikeHide, { passive: true });
  }
  const schBtn = document.getElementById('schBtn');
  if (schBtn) {
    schBtn.addEventListener('mouseenter', preloadSchedule);
    schBtn.addEventListener('touchstart', preloadSchedule, { passive: true });
  }
  refreshLikeDot();   // 상단바 innerHTML 재생성으로 클래스가 날아가므로 점 상태 재적용
}

// ── 좋아요 요청 모아보기 모달 ──
// 좋아요 요청 숨김 목록 — 시트 A열에 게시글 URL(# 앞부분)을 적으면 해당 글의 요청이 모두 숨김.
// 댓글 단위가 아닌 게시글(컨텐츠) 단위 차단 — 같은 글의 추가 요청 댓글도 함께 숨겨짐.
const LIKE_HIDE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=66286785';
const LS_LIKEHIDE_CACHE = 'chuntaverse_like_hide_v3';   // v3: u에 댓글 앵커(#comment_noti) 보존 — v2(앵커 제거)와 저장 의미 달라 무효화. A=URL, B=만료일(YYYY-MM-DD) → {u,d} 객체배열로 캐시
const normLikeUrl = (u) => (u || '').split('#')[0].trim().replace(/\/$/, '');
// dedup·✕·빨간점 키용: 댓글 앵커(#comment_noti…) 보존 — 같은 글이라도 서로 다른 댓글/링크는 별개 요청으로 취급(이벤트 탭과 동일). CSV 숨김은 앵커 있으면 그 댓글만(fullLikeUrl 매칭), 앵커 없으면 글 전체(normLikeUrl 매칭) 숨김.
const fullLikeUrl = (u) => (u || '').trim().replace(/\/$/, '');
// ── 유저 단위 좋아요 요청 상태(localStorage) — CSV 숨김(글 단위·Crenop 관리)과 별개 ──
const LS_LIKE_DISMISS = 'chuntaverse_like_dismiss_v1';    // (구) ✕ 숨김 키 — 2026-08-10 체크박스 전환으로 신규 기록 중단, 모달 열 때 CHECKED로 이관(멱등)하는 원본으로만 유지
const LS_LIKE_CHECKED = 'chuntaverse_like_checked_v1';    // 유저가 '확인함/좋아요 눌러줌' 체크한 요청(멤버+URL 단위) — ✕와 달리 목록에 남고 재클릭으로 해제 가능
const LS_LIKE_SEEN = 'chuntaverse_like_seen_v1';          // 유저가 모달에서 본 댓글(멤버+URL 단위, 빨간 점 끔용)
const LS_LIKEREQ_CACHE = 'chuntaverse_like_req_cache_v1'; // 점 계산용 마지막 목록 캐시
let likeReqCache = [];   // 마지막으로 받은 like_requests(빨간 점 계산용)
const likeReqKey = (e) => `${e.member_id || ''}|${fullLikeUrl(e.url)}`;   // dedup과 동일 키(멤버+전체 URL, 댓글 앵커 포함). dismiss·seen·빨간점이 '같은 링크'를 시간 무관 동일 취급 → X했거나 본 링크는 재요청돼도 다시 안 켜짐
function lsKeySet(key) { try { return new Set(JSON.parse(lsGet(key, '[]'))); } catch (e) { return new Set(); } }
function lsKeyAdd(key, keys) { const s = lsKeySet(key); let ch = false; keys.forEach(k => { if (!s.has(k)) { s.add(k); ch = true; } }); if (ch) lsSet(key, JSON.stringify([...s])); }
// 좋아요 숨김 B열(만료일) 판정: B 비었거나 날짜 형식 밖이면 즉시 숨김, 날짜면 그날(KST)까지 노출하고 지나면 숨김.
// 날짜는 일정 시트와 동일 YYYY-MM-DD 기준(. / 구분·한 자리 월일·뒤따르는 구분자 허용). B엔 날짜만 적을 것(여분 텍스트는 형식 밖→즉시 숨김).
function likeHideActiveOn(dateRaw, todayKst) {
  const m = String(dateRaw || '').trim().replace(/\s+/g, '').replace(/[.\/]/g, '-').replace(/-+$/, '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (!m) return true;
  const due = `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  return todayKst > due;
}
// 캐시 엔트리({u: 정규화URL, d: 만료일})에서 "지금 숨겨야 할" URL Set 생성. 날짜는 호출 시점 KST로 매번 재평가(자정 넘기면 자동 반영).
function buildLikeHideSet(entries) {
  const kst = new Date(Date.now() + 9 * 3600 * 1000);
  const todayKst = `${kst.getUTCFullYear()}-${String(kst.getUTCMonth() + 1).padStart(2, '0')}-${String(kst.getUTCDate()).padStart(2, '0')}`;
  const s = new Set();
  for (const e of (entries || [])) {
    if (e && e.u && likeHideActiveOn(e.d, todayKst)) s.add(e.u);
  }
  return s;
}
function lsHideSet() {
  try { return buildLikeHideSet(JSON.parse(lsGet(LS_LIKEHIDE_CACHE, '[]'))); } catch (e) { return new Set(); }
}
// 같은 멤버가 같은 링크에 보낸 좋아요 요청만 dedup: 멤버 + fullLikeUrl(댓글 앵커 #comment_noti 포함) 기준 최신 1건(과거 건 숨김). 한 글에 링크 여러 개면 각각 별개 요청으로 모두 유지(이벤트 탭과 동일).
// 다른 멤버가 같은 링크를 요청한 건은 별개 요청이므로 각각 유지(달타·캬앙이 같은 컨텐츠 좋아요를 요청한 경우 둘 다 노출).
function dedupeLikeReqs(list) {
  const byKey = new Map();
  for (const e of (list || [])) {
    const k = `${e.member_id || ''}|${fullLikeUrl(e.url)}`;
    const prev = byKey.get(k);
    if (!prev || new Date(e.time) > new Date(prev.time)) byKey.set(k, e);
  }
  return [...byKey.values()].sort((a, b) => new Date(b.time) - new Date(a.time));
}
async function loadLikeHideSet() {
  let entries = [];
  try {
    const res = await fetch(LIKE_HIDE_SHEET_URL);
    if (!res.ok) throw new Error('no data');
    entries = parseCSV(await res.text())
      .map(r => ({ u: fullLikeUrl((r[0] || '').trim()), d: (r[1] || '').trim() }))   // 앵커 보존: 앵커 있으면 그 댓글만, 없으면 글 URL(글단위 매칭은 대조 시 normLikeUrl로)
      .filter(e => e.u.startsWith('http'));
    lsSet(LS_LIKEHIDE_CACHE, JSON.stringify(entries));
  } catch (e) {
    try { entries = JSON.parse(lsGet(LS_LIKEHIDE_CACHE, '[]')); } catch (e2) { entries = []; }
  }
  return buildLikeHideSet(entries);
}

// 숨김목록 선로딩분(모달 1회용). hover/클릭에서 호출하되 한 번 받기 시작하면 그 약속을 재사용(중복 fetch 방지).
// 모달을 닫을 때 폐기 → 다음 열기는 그 시점 시트를 새로 읽음(stale 없음). loadLikeHideSet은 실패해도 Set을 돌려주므로 reject 없음.
let likeHidePreload = null;
function preloadLikeHide() {
  if (!likeHidePreload) likeHidePreload = loadLikeHideSet();
  return likeHidePreload;
}

// 좋아요 요청 모달 v2(2026-08-10 전면 개편, 정렬 토글 폐지): 항상 같은 글끼리 묶어 [컨텐츠 헤더]+[요청 행]으로 표시.
// 행은 '누구 요청 · 누구 댓글'만 — 컨텐츠 정보는 헤더로 병합(이벤트 탭은 이벤트가 섞여 있어 요청마다 전체 정보가 필요하지만, 모달은 요청만 모여 행마다 중복이라 제거).
let likeReqShown = null;         // 모달이 현재 그리는 목록(시트 숨김 적용분). null=아직 못 받음/실패
let likeReqNewSet = new Set();   // 이번 열림에서 '신규'였던 요청 키 스냅샷 — 직후 seen 처리로 버튼 점은 꺼지되, 행 표시는 모달 세션 동안 유지

// 같은 글(normLikeUrl — 댓글 앵커 무시) 묶음. 입력이 최신순이라 묶음 순서 = 각 묶음의 최신 요청 순, 묶음 안도 최신순 유지.
function buildLikeReqGroups(list) {
  const buckets = new Map();
  for (const e of (list || [])) {
    const k = normLikeUrl(e.url);
    if (!buckets.has(k)) buckets.set(k, { url: k, entries: [] });
    buckets.get(k).entries.push(e);
  }
  return [...buckets.values()];
}

// 묶음 헤더 문구: 'OOO 컨텐츠 - "글제목"'. 못 읽어온 조각은 빠짐(익명으로 제목을 못 읽는 게시판 존재 — renderEvent [한계] 참조),
// 대상·제목은 묶음 내 첫 확보값 사용(요청마다 조회 성공 여부가 다를 수 있음). 둘 다 없으면 일반 문구.
function likeReqGroupTitle(entries) {
  const tn = (entries.find(e => e.target_name) || {}).target_name;
  const pt = (entries.find(e => e.post_title) || {}).post_title;
  return [tn ? `${tn} 컨텐츠` : '', pt ? `"${pt}"` : ''].filter(Boolean).join(' - ') || '숲 게시글';
}

const LRQ_CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><polyline points="4 12.5 10 18.5 20 6.5"/></svg>';

function renderLikeReqBody() {
  const body = document.getElementById('lrBody');
  if (!body || !likeReqShown) return;
  if (likeReqShown.length === 0) {
    body.innerHTML = '<div class="lr-msg">기록된 좋아요 요청이 없습니다.</div>';
    return;
  }
  const checked = lsKeySet(LS_LIKE_CHECKED);
  body.innerHTML = buildLikeReqGroups(likeReqShown).map(g => {
    const title = escapeHtml(likeReqGroupTitle(g.entries));
    const head = `<div class="lrg-head">` + (g.url
      ? `<a class="lrg-head-txt" href="${escapeHtml(g.url)}" target="_blank" rel="noopener">${title}</a>`
      : `<span class="lrg-head-txt">${title}</span>`) + `</div>`;
    const rows = g.entries.map(e => {
      const key = likeReqKey(e);
      const m = findMember(e.member_id);
      const cm = e.comment_member_id ? findMember(e.comment_member_id) : null;
      const l2 = [cm ? `<span style="color:${cm.color}">${escapeHtml(cm.name)}</span> 댓글` : '', e.title ? escapeHtml(e.title) : ''].filter(Boolean).join(' · ');
      const cls = 'lrq-row' + (likeReqNewSet.has(key) ? ' unread' : '') + (checked.has(key) ? ' checked' : '');
      return `<div class="${cls}" data-lrkey="${escapeHtml(key)}">`
        + `<a class="lrq-link" href="${escapeHtml(withTextFragment(e.url, e.title))}" target="_blank" rel="noopener">`
        + (m ? `<img class="lrq-avatar" src="${m.img}" alt="${escapeHtml(e.member_name)}">` : '')
        + `<span class="lrq-main"><span class="lrq-l1"><span style="color:${m ? m.color : '#fff'}">${escapeHtml(e.member_name)}</span><span class="lrq-label">좋아요 요청</span></span>`
        + (l2 ? `<span class="lrq-l2">${l2}</span>` : '')
        + `</span><span class="event-time"><span class="event-time-rel">${formatRelTime(e.time)}</span><span class="event-time-abs">${formatAbsTime(e.time)}</span></span></a>`
        + `<button class="lrq-check" type="button" aria-label="확인 표시" aria-pressed="${checked.has(key)}">${LRQ_CHECK_SVG}</button></div>`;
    }).join('');
    return head + rows;
  }).join('');
}

async function openLikeRequests() {
  const ov = document.getElementById('lrOverlay');
  const head = document.getElementById('lrHead');
  const body = document.getElementById('lrBody');
  if (!ov || !body) return;
  head.innerHTML = `<span>${SVG_ICONS.thumbsup}멤버들의 좋아요 요청 모아보기</span><button class="lr-close" type="button" onclick="closeLikeRequests()">✕</button>`;
  ov.hidden = false;
  syncBodyScrollLock();
  likeReqShown = null;
  body.innerHTML = '<div class="lr-msg">불러오는 중…</div>';
  try {
    // hover로 이미 받는 중/받아둔 게 있으면 그걸, 아니면 지금 시작. 숨김목록을 손에 쥔 뒤 렌더하므로 "보였다 사라짐" 없음.
    const [res, hideSet] = await Promise.all([fetch(WORKER_URL + '/like-requests'), preloadLikeHide()]);
    const data = await res.json();
    likeReqCache = dedupeLikeReqs(data.like_requests || []);          // 점 계산용 갱신(같은 글 최신만)
    lsSet(LS_LIKEREQ_CACHE, JSON.stringify(likeReqCache));
    lsKeyAdd(LS_LIKE_CHECKED, [...lsKeySet(LS_LIKE_DISMISS)]);        // 구 ✕ 숨김 → 체크로 이관(멱등): '처리함' 의미 승계 + 이제 목록에 보이고 해제 가능
    likeReqShown = likeReqCache.filter(e => !(hideSet.has(fullLikeUrl(e.url)) || hideSet.has(normLikeUrl(e.url))));
    const seen = lsKeySet(LS_LIKE_SEEN);
    likeReqNewSet = new Set(likeReqShown.map(likeReqKey).filter(k => !seen.has(k)));   // 신규 스냅샷 — 이벤트 탭 안읽음과 같은 표시(민트 좌선+배경)를 행에 적용
    renderLikeReqBody();
    lsKeyAdd(LS_LIKE_SEEN, likeReqShown.map(likeReqKey));             // 본 것으로 표시 → 버튼 점 끔(기존 동작 유지)
    refreshLikeDot();
  } catch (err) {
    body.innerHTML = '<div class="lr-msg">불러오기에 실패했습니다. 잠시 후 다시 시도해주세요.</div>';
  }
}
// 모달 열림 중 배경 스크롤 잠금 — 열린 오버레이(lrOverlay=좋아요·일정 공용, statGraphOverlay=그래프)가
// 하나라도 있으면 body 스크롤 차단, 모두 닫히면 복원. open/close 5지점에서 호출.
function syncBodyScrollLock() {
  const anyOpen = ['lrOverlay', 'statGraphOverlay'].some(id => { const el = document.getElementById(id); return el && !el.hidden; });
  document.body.style.overflow = anyOpen ? 'hidden' : '';
}

// ── 좋아요 순위 모달 (2026-08-04) ────────────────────────────────────────────
// 워커 /like-ranking은 호출될 때 그 자리에서 숲을 긁는다(상시 수집 없음). 그래서 신선도 = 이 폴링 주기.
// 열려 있을 때만 10초로 돌리고 닫으면 완전히 멈춘다 — 백그라운드에서 볼 사람이 없는데 돌릴 이유가 없다.
// 탭이 숨겨졌을 때도 건너뛴다(모달은 열려 있어도 화면에 없으면 마찬가지).
// 갱신 주기는 시트 I열에서 온다(대회별). 아래는 워커와 맞춘 기본값·허용 범위 — 양쪽이 어긋나면 캐시와 폴링이 엇박이 난다.
const RANK_REFRESH_DEFAULT = 30, RANK_REFRESH_MIN = 5, RANK_REFRESH_MAX = 600;
let rankPollSec = RANK_REFRESH_DEFAULT;   // 현재 열려 있는 대회의 주기(헤더 표시와 실제 폴링이 같은 값을 쓰도록)
let rankOpenPost = null;                  // 현재 모달이 보고 있는 대회(글번호). 폴링이 같은 대회를 계속 갱신하도록 붙잡아 둔다
let rankTimer = null;
function stopRankPoll() { if (rankTimer) { clearInterval(rankTimer); rankTimer = null; } }

async function openLikeRanking(titleNo) {
  const ov = document.getElementById('lrOverlay');
  const head = document.getElementById('lrHead');
  const body = document.getElementById('lrBody');
  if (!ov || !body) return;
  rankOpenPost = titleNo || null;
  const btn = likeRankBtns.find(b => b.titleNo === rankOpenPost) || likeRankBtns[0] || null;
  rankPollSec = (btn && btn.refresh) || RANK_REFRESH_DEFAULT;
  const panel = ov.querySelector('.lr-panel');
  if (panel) {   // 테두리·헤더가 버튼과 같은 색을 쓰도록. 다른 모달과 오버레이를 공유하므로 닫을 때 반드시 되돌린다.
    panel.classList.add('rk-modal');
    if (btn) {
      panel.style.setProperty('--rk-c', lightenForText(btn.hex));   // 글자용(밝기 보정본)
      panel.style.setProperty('--rk-rgb', hexToRgb(btn.hex));       // 테두리용(원색을 40%로 깔기 위해 rgb 삼원색)
    }
  }
  head.innerHTML = `<span>${SVG_ICONS.barChart}좋아요 순위</span>`
    + `<span class="rk-head-right"><span class="rk-refresh">${rankPollSec}초마다 갱신</span>`
    + `<button class="lr-close" type="button" onclick="closeLikeRequests()">✕</button></span>`;
  ov.hidden = false;
  syncBodyScrollLock();
  body.innerHTML = '<div class="lr-msg">불러오는 중…</div>';
  await loadLikeRanking();
  stopRankPoll();
  rankTimer = setInterval(() => {
    // lrOverlay는 좋아요 요청·일정·항목 모아보기와 공유한다. '열려 있는지'만 보면 다른 모달이 떠 있을 때
    // 순위 데이터가 그 내용을 덮어쓴다 → 순위 모달임을 표시하는 rk-modal 클래스로 판정한다.
    const p = document.querySelector('#lrOverlay .lr-panel');
    if (document.getElementById('lrOverlay').hidden || !p || !p.classList.contains('rk-modal')) { stopRankPoll(); return; }
    if (document.visibilityState === 'visible') loadLikeRanking();
  }, rankPollSec * 1000);
}

async function loadLikeRanking() {
  const body = document.getElementById('lrBody');
  if (!body) return;
  try {
    // no-store: 응답에 max-age=10이 붙어 있어 기본 모드면 브라우저 캐시가 10초 더 붙잡는다(엣지 10초 + 브라우저 10초 = 최대 20초 지연).
    // 엣지 캐시는 워커가 Cache API로 직접 조회하므로 이 옵션과 무관 — 즉 숲/유튜브 부하는 그대로 두고 신선도만 회복한다.
    const res = await fetch(WORKER_URL + '/like-ranking' + (rankOpenPost ? `?post=${encodeURIComponent(rankOpenPost)}` : ''), { cache: 'no-store' });
    const data = await res.json();
    const events = data.events || [];
    if (events.length === 0) { body.innerHTML = '<div class="lr-msg">진행 중인 순위 집계가 없습니다.</div>'; return; }
    body.innerHTML = events.map(renderRankEvent).join('');
  } catch (err) {
    // 폴링 중 실패는 화면을 비우지 않는다 — 직전 값을 두고 다음 주기를 기다린다(깜빡임 방지)
    if (body.querySelector('.rk-ev')) return;
    body.innerHTML = '<div class="lr-msg">불러오기에 실패했습니다. 잠시 후 다시 시도해주세요.</div>';
  }
}

function renderRankEvent(ev) {
  // ★ 사이트 고유 멤버 순서가 아니라 좋아요 순으로 정렬 — 순위표에서 의미 있는 배열은 성적순이다.
  //   (워커가 이미 좋아요 순으로 내려주지만, 순서를 응답에 의존하지 않는다.)
  const sorted = [...(ev.members || [])].sort((a, b) => (b.like ?? -1) - (a.like ?? -1));
  const grouped = ev.grouped !== false;   // 시트 D열(전형규칙)이 비면 전형 열 자체를 그리지 않는다
  // 컷을 '행'으로 끼워 넣는다. 우리 멤버가 속한 전형만 — 신입처럼 아무도 없는 전형은 자리를 차지할 이유가 없다.
  // 위치는 그 컷 값이 좋아요 내림차순에서 놓일 자리. 같은 값이면 멤버가 먼저(컷과 동점이면 통과이므로 컷 위에 있어야 한다).
  const usedGroups = new Set(sorted.map(m => m.group));
  const cutRows = (ev.groups || [])
    .filter(g => g.cut !== null && usedGroups.has(g.name))
    .map(g => ({ _cut: true, group: g.name, cut: g.cut, like: g.cut }));
  const merged = [...sorted, ...cutRows]
    .sort((a, b) => ((b.like ?? -1) - (a.like ?? -1)) || ((a._cut ? 1 : 0) - (b._cut ? 1 : 0)));
  const rows = merged.map(m => {
    if (m._cut) {
      // 멤버 행과 같은 클래스를 써서 열이 자동으로 맞는다. '컷'이라는 단어는 넣지 않는다 —
      // 상단에 "33위 컷 기준"이 있고 색·경계선이 이미 그 뜻이라, 넣으면 등수 칸의 좌우 정렬만 깨진다.
      return `<div class="rk-row rk-cut-row">`
        + (grouped && m.group ? `<span class="rk-grp">${escapeHtml(m.group)}</span>` : '')
        + `<span class="rk-rank">${ev.quota ? ev.quota + '위' : '컷'}</span>`
        + `<span class="rk-like">${m.cut.toLocaleString()}</span></div>`;
    }
    const mem = findMember(m.member_id);
    const av = mem ? `<img class="rk-av" src="${mem.img}" alt="${escapeHtml(m.name)}">` : '<span></span>';
    const nm = `<span class="rk-name" style="color:${mem ? mem.color : '#fff'}">${escapeHtml(m.name)}</span>`;
    // [상태 분기 제거 · 2026-08-07] '시트 이름 확인 필요'·'댓글 미확인' 두 줄이 있던 자리.
    //   워커가 시트 구 F열(참여멤버)이 아니라 실제 댓글에서 멤버를 찾게 바뀌어(computeLikeRanking) 두 상태가 발생하지 않는다
    //   — 목록에 있다는 것 자체가 댓글이 있다는 뜻이다. 미신청 멤버는 아예 행이 안 생긴다.
    // 안정/탈락은 행 단위 클래스로 — 순위와 컷이 같은 의미색을 공유해야 한 눈에 읽힌다
    const zone = m.gap === null ? '' : (m.gap >= 0 ? ' in' : ' out');
    const gap = m.gap === null ? '' : `컷 ${m.gap >= 0 ? '+' : ''}${m.gap.toLocaleString()}`;
    // 워커가 그 멤버의 댓글 앵커(pCommentNo)를 실어 보내면 행 전체를 링크로. 못 실었으면 div 그대로.
    const inner = `${av}${nm}`
      + (grouped ? `<span class="rk-grp">${m.group ? escapeHtml(m.group) : ''}</span>` : '')
      + `<span class="rk-rank">${m.rank}위</span>`
      + `<span class="rk-like">${m.like.toLocaleString()}</span>`
      + `<span class="rk-gap">${gap}</span>`;
    return m.url
      ? `<a class="rk-row${zone}" href="${escapeHtml(m.url)}" target="_blank" rel="noopener">${inner}</a>`
      : `<div class="rk-row${zone}">${inner}</div>`;
  }).join('');
  // 상단에는 기준(몇 위까지 뽑는지)만. 전형별 컷 숫자는 각 멤버 행으로 내려갔다.
  const sub = ev.quota ? `${ev.quota}위 컷 기준` : '';
  const note = ev.unclassified > 0 ? `<div class="rk-note">전형을 판별하지 못한 신청 ${ev.unclassified}건이 있어 실제 순위가 조금 더 낮을 수 있습니다.</div>` : '';
  const tone = ev.color ? ` style="--rk-c:${lightenForText(ev.color)}"` : '';   // 시트 G열 색을 제목·순위에 반영(글자라 보정본 사용)
  return `<div class="rk-ev${grouped ? '' : ' no-group'}"${tone}><div class="rk-ev-head"><span class="rk-ev-title">${escapeHtml(ev.label || '좋아요 순위')}</span>`
    + (sub ? `<span class="rk-ev-sub">${escapeHtml(sub)}</span>` : '')
    + `</div>` + rows + note + `</div>`;
}

function closeLikeRequests() {
  const ov = document.getElementById('lrOverlay');
  if (ov) ov.hidden = true;
  stopRankPoll();          // 순위 모달과 오버레이를 공유 — 닫히면 폴링도 반드시 멈춘다
  const rkPanel = ov && ov.querySelector('.lr-panel');
  rankOpenPost = null;
  if (rkPanel) { rkPanel.classList.remove('rk-modal'); rkPanel.style.removeProperty('--rk-c'); rkPanel.style.removeProperty('--rk-rgb'); }   // 좋아요 요청·일정 모달이 순위 색을 물려받지 않게 원복
  syncBodyScrollLock();
  likeHidePreload = null;  // 선로딩분은 모달 1회용 — 다음 열기는 그 시점 최신으로
  schedulePreload = null;  // 일정 모달도 lrOverlay를 공유 — 선로딩분 동일하게 폐기
}
// 빨간 점: 안 숨김(dismiss)·안 가려짐(CSV 캐시)·안 본(seen) 요청이 1개+면 표시
function computeLikeDot() {
  // 점 = 아직 안 본 요청 존재(시트 숨김 제외). 체크(확인함)는 무관 — 신규는 정의상 미체크. 구 ✕(dismiss) 조건은 체크 전환(2026-08-10)으로 폐지(이관분은 모달에서 이미 seen 처리된 키들).
  const seen = lsKeySet(LS_LIKE_SEEN), hide = lsHideSet();
  return likeReqCache.some(e => {
    const k = likeReqKey(e);
    return !seen.has(k) && !(hide.has(fullLikeUrl(e.url)) || hide.has(normLikeUrl(e.url)));
  });
}
function refreshLikeDot() {
  const btn = document.getElementById('likeReqBtn');
  if (btn) btn.classList.toggle('has-new', computeLikeDot());
}
// 페이지 로드 시 점 계산용 목록 1회 로드(엣지 캐시 max-age=60 → 대부분 히트, 비용 미미). 캐시 우선으로 점 즉시 반영.
async function loadLikeReqForDot() {
  try { likeReqCache = dedupeLikeReqs(JSON.parse(lsGet(LS_LIKEREQ_CACHE, '[]'))); } catch (e) { likeReqCache = []; }
  refreshLikeDot();
  try {
    const res = await fetch(WORKER_URL + '/like-requests');
    const data = await res.json();
    likeReqCache = dedupeLikeReqs(data.like_requests || []);
    lsSet(LS_LIKEREQ_CACHE, JSON.stringify(likeReqCache));
    refreshLikeDot();
  } catch (e) {}
}
// 체크 토글(구 ✕ 대체) — '확인함/좋아요 눌러줌'을 요청 키 단위로 localStorage 저장. 행은 목록에 남고 재클릭으로 해제(✕의 캐시 삭제 없인 복구 불가 문제 해소).
// 해당 행만 제자리 갱신(전체 재렌더 없음 — 스크롤 위치 보존).
function toggleLikeReqChecked(key, row, btn) {
  const s = lsKeySet(LS_LIKE_CHECKED);
  if (s.has(key)) s.delete(key); else s.add(key);
  lsSet(LS_LIKE_CHECKED, JSON.stringify([...s]));
  row.classList.toggle('checked', s.has(key));
  if (s.has(key)) { row.classList.remove('unread'); likeReqNewSet.delete(key); }   // 체크 = 그 자리에서 읽음 처리(2026-08-10) — 모달을 나가지 않아도 신규 표시가 꺼진다. 체크 해제로 되살리진 않음(읽음은 단방향)
  if (btn) btn.setAttribute('aria-pressed', String(s.has(key)));
}
document.addEventListener('click', (e) => {
  const ov = document.getElementById('lrOverlay');
  if (ov && !ov.hidden && e.target === ov) closeLikeRequests();  // 패널 바깥(배경) 클릭 시 닫기
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeLikeRequests(); closeStatGraph(); }   // 좋아요/일정 모달 + 그래프 모달 모두 ESC로 닫기
});
// 요청 행 체크박스(확인/좋아요 완료 표시) — 위임. 링크(.lrq-link)의 형제라 클릭이 링크로 새지 않음.
document.addEventListener('click', (e) => {
  const c = e.target.closest && e.target.closest('.lrq-check');
  if (!c) return;
  const row = c.closest('.lrq-row');
  if (row && row.dataset.lrkey) toggleLikeReqChecked(row.dataset.lrkey, row, c);
});

// ── 다가오는 일정 (구글 시트 gid=2043421724 — 컨텐츠와 통합 시트) ──
// 열: A=YYYY-MM-DD(또는 YYMMDD) / B=HH:MM(빈칸 가능) / C=링크(빈칸 가능) / D=간략제목(버튼용·빈칸 가능) / E=상세제목(모달용) / F~=참가 멤버 이름(컨텐츠 행과 동일 열·빈칸 가능 — 모달에서 아바타로 표시). D·E 중 하나라도 있으면 행 유지(버튼=D 우선, 모달=E 우선, 한쪽 비면 다른 쪽). 모든 시각은 KST 기준.
// 상단바 버튼: 가장 임박한 일정 1개만 표시 — 당일이고 시간 있으면 D-time(D-HH:MM:SS 초 카운트다운), 그 외(미래 날짜)는 D-day.
// 숨김 기준: 시간 유무와 무관하게 그날 자정(KST)을 넘겨야 빠짐. 시간 있는 일정도 그 시각이 지나면 사라지지 않고 D-DAY로 그날 자정까지 유지(시간 없는 일정과 동일·합방 중에도 상단 노출) → 자정 넘으면 다음 일정으로. 시트 행은 그대로 둠.
// CSV: 페이지 로드 시 1회(버튼 표시용) + 모달 열 때 재풀링(최신 반영). 좋아요 모달과 동일한 lrOverlay·선로딩 패턴 재사용.
// 컨텐츠 시트와 통합(같은 gid). 일정 행 = A열이 날짜(YYMMDD 또는 YYYY-MM-DD)인 행. 컨텐츠 행(A=http URL)은 parseScheduleRows의 날짜 정규화에서 null→자동 제외.
const SCHEDULE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=2043421724';
const LS_SCHEDULE_CACHE = 'chuntaverse_schedule_cache_v2';  // v2: 통합 시트 칼럼 재배치(C=링크/D=간략/E=상세)로 구 캐시(raw rows) 무효화
let scheduleData = [];   // 파싱·정렬 완료된 일정
let scheduleSig = '';    // 버튼 구조(headline·개수) 식별자 — 변할 때만 상단바 전체 재구성, 평소엔 카운트다운 숫자만 갱신
let schedulePreload = null;

function parseScheduleRows(rows) {
  const out = [];
  for (const r of rows) {
    // A열: YYMMDD(통합 시트 일정 행) 또는 YYYY-MM-DD 둘 다 허용 → YYYY-MM-DD로 정규화.
    // A가 http(컨텐츠 카드 행)·헤더·빈칸이면 null → 자동 제외(한 시트를 일정/컨텐츠 두 필터로 가르는 기준).
    const rawDate = (r[0] || '').trim();
    let date = null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(rawDate)) date = rawDate;
    else if (/^\d{6}$/.test(rawDate)) date = `20${rawDate.slice(0, 2)}-${rawDate.slice(2, 4)}-${rawDate.slice(4, 6)}`;
    if (!date) continue;
    const brief = (r[3] || '').trim();   // D=간략제목(버튼)
    const detail = (r[4] || '').trim();  // E=상세제목(모달)
    if (!brief && !detail) continue;     // 제목이 둘 다 없으면 무효 행
    const timeRaw = (r[1] || '').trim(); // B=시간
    const hasTime = /^\d{1,2}:\d{2}$/.test(timeRaw);
    const hhmm = hasTime ? timeRaw.padStart(5, '0') : '00:00';
    const target = new Date(`${date}T${hhmm}:00+09:00`).getTime();
    const dayStart = new Date(`${date}T00:00:00+09:00`).getTime();
    out.push({
      date, time: hasTime ? hhmm : '',
      title: detail || brief,        // 모달·기준 제목(상세 우선)
      shortTitle: brief || detail,   // 버튼 제목(간략 우선)
      link: (r[2] || '').trim(),     // C=링크
      members: r.slice(5).filter(c => c.length > 0),  // F~ 멤버 (loadContent와 동일 열·동일 방식)
      hasTime, target,
      hideAfter: dayStart + 86400000,  // 시간 유무 무관 그날 자정까지 유지(시간 지나면 D-DAY로 표기)
    });
  }
  // 날짜 오름차순 → 같은 날은 시간 있는 것 먼저(시간순), 시간 없는 것은 맨 아래
  out.sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    if (a.hasTime !== b.hasTime) return a.hasTime ? -1 : 1;
    return a.target - b.target;
  });
  return out;
}

function visibleSchedule() {
  const now = Date.now();
  return scheduleData.filter(s => now < s.hideAfter);
}

// KST 기준 D-day 일수(오늘=0). 자정끼리의 차이라 시:분과 무관.
function ddayNum(item) {
  const dayMs = 86400000;
  const nowMid = Math.floor((Date.now() + 9 * 3600 * 1000) / dayMs);
  const tgtMid = Math.floor((new Date(`${item.date}T00:00:00+09:00`).getTime() + 9 * 3600 * 1000) / dayMs);
  return tgtMid - nowMid;
}
function ddayText(item) {
  const d = ddayNum(item);
  return d <= 0 ? 'D-DAY' : `D-${d}`;
}
// D-time: 당일에만 호출(남은 시간 < 24h) → D-HH:MM:SS. D-day와 머리글자('D-') 통일.
function dtimeText(item) {
  let sec = Math.floor((item.target - Date.now()) / 1000);
  if (sec <= 0) return 'D-DAY';
  const h = Math.floor(sec / 3600); sec -= h * 3600;
  const m = Math.floor(sec / 60); sec -= m * 60;
  return `D-${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

// 가장 임박한 날짜의 일정 묶음 + 표기 상태(버튼·틱 공통). dtime이 전부 같으면 병합(M), 다르면 분리(S).
// sig엔 카운트다운 숫자(매초 변동) 대신 묶음 구성·단일(1)/병합/분리만 담아 → 구조가 바뀔 때만 재렌더.
function scheduleHead() {
  const vis = visibleSchedule();
  if (!vis.length) return { vis, group: [], dtimes: [], allSame: true, sig: '∅' };
  const d0 = vis[0].date;
  const group = vis.filter(s => s.date === d0);   // vis는 정렬됨 → 같은 날짜는 시간순 prefix
  const dtimes = group.map(e => (e.hasTime && ddayNum(e) === 0) ? dtimeText(e) : ddayText(e));
  const allSame = dtimes.every(x => x === dtimes[0]);
  const state = group.length >= 2 ? (allSame ? 'M' : 'S') : '1';
  const sig = group.map(e => `${e.date}T${e.time}`).join(',') + '|' + state;
  return { vis, group, dtimes, allSame, sig };
}

// 상단바 일정 버튼 HTML. 호출 시 scheduleSig도 갱신(tick이 구조 변화를 감지하는 기준).
function scheduleBtnHTML() {
  const h = scheduleHead();
  scheduleSig = h.sig;
  // 버튼 상시 노출 — 데이터 로드 전 첫 페인트 순간만 셸(일정이 비는 경우는 전제상 없음).
  if (!h.vis.length) {
    return `<button class="page-title-link sch-btn" id="schBtn" type="button" onclick="openSchedule()">${SVG_ICONS.calendar}<span class="tb-t-pc">다가오는 일정<br><span class="sch-btn-dday">불러오는 중</span></span><span class="tb-t-mb">일정</span></button>`;
  }
  const head = h.vis[0];
  // 단일 일정 — 현행: 제목 + (당일부터 D-time, 그 전 D-day). 모바일은 항상 D-day.
  if (h.group.length < 2) {
    const second = (head.hasTime && ddayNum(head) === 0) ? dtimeText(head) : ddayText(head);
    return `<button class="page-title-link sch-btn" id="schBtn" type="button" onclick="openSchedule()">${SVG_ICONS.calendar}<span class="tb-t-pc">${escapeHtml(head.shortTitle)}<br><span class="sch-btn-dday">${second}</span></span><span class="tb-t-mb">${ddayText(head)}</span></button>`;
  }
  // 같은 날 2건+ (C): 제목 행 + dtime 행(열 정렬), 사이에 가운뎃점(·)으로 분리 표시. dtime 전부 같으면 한 칸 병합.
  const sep = `<span class="sch-sep">·</span>`;
  const titleCells = h.group.map(e => `<span class="sch-col-title">${escapeHtml(e.shortTitle)}</span>`).join(sep);
  const dtimeRow = h.allSame
    ? `<span class="sch-btn-dtime sch-dtime-merged">${h.dtimes[0]}</span>`
    : h.dtimes.map(d => `<span class="sch-btn-dtime">${d}</span>`).join(sep);
  const cols = 2 * h.group.length - 1;   // 이벤트 N칸 + 구분점 N-1칸
  const pc = `<span class="tb-t-pc sch-grid" style="grid-template-columns:repeat(${cols},auto)">${titleCells}${dtimeRow}</span>`;
  return `<button class="page-title-link sch-btn" id="schBtn" type="button" onclick="openSchedule()">${SVG_ICONS.calendar}${pc}<span class="tb-t-mb">${ddayText(head)}</span></button>`;
}

// 1초마다: 구조(묶음 구성·병합/분리)가 바뀌었으면 상단바 전체 재구성, 아니면 카운트다운 숫자만 교체.
function tickSchedule() {
  const h = scheduleHead();
  if (h.sig !== scheduleSig) { updatePageTitle(); return; }
  if (!h.vis.length) return;
  const elM = document.querySelector('#schBtn .tb-t-mb');            // 모바일: 항상 가장 임박 일정의 D-day
  if (elM) elM.textContent = ddayText(h.vis[0]);
  const elS = document.querySelector('#schBtn .sch-btn-dday');       // 단일 일정(현행): D-time/D-day 한 칸
  if (elS) elS.textContent = (h.vis[0].hasTime && ddayNum(h.vis[0]) === 0) ? dtimeText(h.vis[0]) : ddayText(h.vis[0]);
  const cells = document.querySelectorAll('#schBtn .sch-btn-dtime'); // 그룹(C): 병합 1칸 또는 열별 N칸
  cells.forEach((c, i) => { c.textContent = cells.length === 1 ? h.dtimes[0] : h.dtimes[i]; });
}

async function loadSchedule() {
  // 캐시 우선: 재방문 시 버튼이 첫 페인트부터 실제 내용으로 뜸(loadBanners와 동일 패턴)
  if (scheduleData.length === 0) {
    try {
      const cached = JSON.parse(lsGet(LS_SCHEDULE_CACHE, '[]'));
      if (cached.length) { scheduleData = parseScheduleRows(cached); updatePageTitle(); }
    } catch (e) {}
  }
  // 최신 fetch로 갱신
  try {
    const res = await fetch(SCHEDULE_SHEET_URL);
    if (!res.ok) throw new Error('no data');
    const rows = parseCSV(await res.text());
    lsSet(LS_SCHEDULE_CACHE, JSON.stringify(rows));
    scheduleData = parseScheduleRows(rows);
    updatePageTitle();
  } catch (e) {
    // fetch 실패 시: 위에서 캐시를 이미 그렸으면 유지. 캐시도 없으면 셸 버튼 유지.
  }
}

// 모달용 선로딩(hover/터치 시 1회). 실패 시 null을 돌려주고, openSchedule이 기존 데이터로 폴백.
function preloadSchedule() {
  if (!schedulePreload) {
    schedulePreload = fetch(SCHEDULE_SHEET_URL)
      .then(r => { if (!r.ok) throw new Error('no data'); return r.text(); })
      .then(t => parseCSV(t))
      .catch(() => null);
  }
  return schedulePreload;
}

async function openSchedule() {

  ov.hidden = false;

// 모달 리스트 항목: 절대 날짜·시간 + 제목(+링크) + D-day 배지(목록은 날짜 단위 D-day로 고정 — 똑딱이는 D-time은 상단바 버튼 전용).
function renderScheduleItem(item) {
  const [schY, schMo, schD] = item.date.split('-').map(Number);
  const dateDisp = koDate(schY, schMo, schD);   // YYYY년 M월 D일 (한글 통일)
  const dowIdx = new Date(Date.UTC(schY, schMo - 1, schD)).getUTCDay();   // 달력 요일(UTC 고정 계산 → 브라우저 타임존 무관)
  const dowChar = ['일','월','화','수','목','금','토'][dowIdx];
  const dowColor = dowIdx === 0 ? '#f87171' : (dowIdx === 6 ? '#60a5fa' : '');   // 일=빨강·토=파랑 (달력 주말색과 동일), 요일 글자에만
  const dowHtml = dowColor ? `<span style="color:${dowColor}">${dowChar}</span>` : dowChar;
  const when = item.hasTime ? `${dateDisp} (${dowHtml}) ${item.time}` : `${dateDisp} (${dowHtml})`;
  const inner = `${escapeHtml(item.title)}${item.link ? ' ' + SVG_ICONS.externalLink : ''}`;
  const titleEl = item.link
    ? `<a class="sch-item-title" href="${escapeHtml(item.link)}" target="_blank" rel="noopener">${inner}</a>`
    : `<span class="sch-item-title">${inner}</span>`;
  // 참가 멤버 아바타(F~열) — 컨텐츠 카드와 동일 스타일. 6명 초과 시 max-width+wrap으로 2행(membersRowStyle 공용).
  // 멤버 없는 행은 div 자체를 생략 — 빈 div가 끼면 flex gap(12px)이 이중으로 붙어 제목~D-day 간격이 벌어짐.
  const memberImgs = (item.members || []).map(name => {
    const m = MEMBERS.find(x => x.name === name);
    return m ? `<img src="${m.img}" alt="${escapeHtml(name)}" title="${escapeHtml(name)}">` : '';
  }).join('');
  const membersEl = memberImgs ? `<div class="sch-item-members"${membersRowStyle(item.members.length)}>${memberImgs}</div>` : '';
  return `<div class="sch-item"><div class="sch-item-main"><span class="sch-item-when">${when}</span>${titleEl}</div>${membersEl}<span class="sch-item-dday">${ddayText(item)}</span></div>`;
}

const LS_NOTIFY = 'chuntaverse_notify_enabled';
const LS_LAST_SEEN = 'chuntaverse_last_seen_event_time';

function lsGet(k, fallback) {
  try { const v = localStorage.getItem(k); return v === null ? fallback : v; }
  catch (e) { return fallback; }
}
function lsSet(k, v) {

}

function getLastSeenTime() {

function updateNotifySwitchUI() {

async function setNotifyEnabled(enabled) {
  if (enabled) {
    if ('Notification' in window) {
      if (Notification.permission === 'default') {
        try {
          const result = await Notification.requestPermission();
          if (result !== 'granted') {
            notifyEnabled = false;
            lsSet(LS_NOTIFY, '0');
            updateNotifySwitchUI();
            alert('브라우저 알림 권한이 거부되어 알림을 받을 수 없어요.\n브라우저 설정에서 알림 권한을 허용한 후 다시 시도해주세요.');
            return;
          }
        } catch (e) {}
      } else if (Notification.permission === 'denied') {
        notifyEnabled = false;
        lsSet(LS_NOTIFY, '0');
        updateNotifySwitchUI();
        alert('브라우저 알림 권한이 차단되어 있어요.\n브라우저 주소창 좌측 자물쇠 아이콘 → 알림 허용 후 다시 시도해주세요.');
        return;
      }
    } else {
      alert('이 브라우저는 알림 기능을 지원하지 않아요.');
      return;
    }
  } else {
    stopTitleFlash();
  }
  notifyEnabled = enabled;
  lsSet(LS_NOTIFY, enabled ? '1' : '0');
  updateNotifySwitchUI();
}

function startTitleFlash(count) {
  pendingFlashCount = count;
  if (titleFlashTimer) return;
  titleFlashTimer = setInterval(() => {
    titleFlashOn = !titleFlashOn;
    updateTabTitle();
  }, 1500);
}
function stopTitleFlash() {
  if (titleFlashTimer) {
    clearInterval(titleFlashTimer);
    titleFlashTimer = null;
  }
  titleFlashOn = false;
  pendingFlashCount = 0;
  updateTabTitle();
}
function updateTabTitle() {
  const lastSeen = new Date(getLastSeenTime()).getTime();
  const unreadCount = dedupBattleNotices(allEvents.filter(e => {
    const t = new Date(e.time).getTime();
    if (isNaN(t) || t <= lastSeen) return false;
    const cat = typeToCat(e.type);
    if (!filterState.types.has(cat)) return false;
    const memberMatch = filterState.members.has(e.member_id);
    const channelMatch = e.channel_id && filterState.members.has(e.channel_id);
    if (cat === 'chat') return memberMatch || channelMatch;
    return memberMatch;
  })).length;
  const base = unreadCount > 0 ? `${BASE_TITLE} (${unreadCount})` : BASE_TITLE;
  if (unreadCount === 0 && titleFlashTimer) {
    clearInterval(titleFlashTimer);
    titleFlashTimer = null;
    titleFlashOn = false;
    pendingFlashCount = 0;
  }
  document.title = (titleFlashTimer && titleFlashOn && pendingFlashCount > 0)
    ? `${base} NEW ◆` : base;
}

function sendBrowserNotification(ev) {
  if (!notifyEnabled) return;
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;
  if (document.visibilityState === 'visible' && currentPage === 'events') return;

  const memberName = ev.member_name || '';
  let body = '';
  switch (ev.type) {
    case 'start':      body = `${memberName} 방송 시작${ev.title ? ' — ' + ev.title : ''}`; break;
    case 'end':        body = `${memberName} 방송 종료`; break;
    case 'title':      body = `${memberName} 방송 제목 변경 — ${ev.after || ''}`; break;
    case 'category':   body = `${memberName} 카테고리 변경 — ${ev.after || ''}`; break;
    case 'mode_change':body = `${memberName} 방송 모드 변경 — ${modeLabel(ev.after)}`; break;
    case 'post':       body = `${memberName} 숲 게시글 — ${ev.title || ''}`; break;
    case 'comment_recommend': body = `${memberName} 좋아요 요청 — ${ev.target_name || ''} 컨텐츠`; break;
    case 'youtube':    body = `${memberName} 유튜브 업로드 — ${ev.title || ''}`; break;
    case 'cafe_post':  body = `${memberName} 카페 게시글 [${ev.cafe_name || ''}] — ${ev.title || ''}`; break;
    case 'chat':       body = `${memberName} 채팅 (${ev.channel_name || ''}) — ${ev.message || ''}`; break;
    case 'chat_emoticon': body = `${memberName} 채팅 (${ev.channel_name || ''}) — (이모티콘)`; break;
    case 'donation':   body = `${memberName} 후원 (${ev.channel_name || ''}) — 별풍선 ${ev.amount || ''}개`; break;
    case 'sanction':   body = `${memberName} ${ev.kind === 'kick' ? '강제퇴장' : `채팅금지 ${ev.seconds || 0}초`} (${ev.channel_name || ''} 방송)`; break;
    case 'mission_gift': body = `${memberName} ${ev.mission === 'battle' ? '대결' : '도전'}미션 후원 ${ev.amount || 0}개 (${ev.channel_name || ''} 방송)`; break;
    case 'battle_notice': body = `${memberName} 대결미션 종료${ev.title ? ' — ' + ev.title : ''}`; break;
    default:           body = `${memberName} ${ev.type}`;
  }
  try {
    const noti = new Notification(BASE_TITLE, {
      body, icon: 'Favicon.webp',
      tag: `${ev.type}-${ev.member_id}-${ev.time}`,
    });
    noti.onclick = () => {
      window.focus();
      history.replaceState(null, '', '#events');
      switchPage('events');
      noti.close();
    };
    setTimeout(() => { try { noti.close(); } catch (e) {} }, 5000);
  } catch (e) {}
}

const NOTIFY_RECENT_MS = 10 * 60 * 1000;   // 알림 대상 = 발생 10분 이내 이벤트만 (재편입 폭주 가드 — 아래 주석)
// [유튜브만 넓힘 · 2026-08-07] 다른 타입은 e.time이 감지 시각과 거의 같지만(방송 시작/종료) 유튜브는
//   '영상 게시 시각'이라 태생적으로 뒤처진다. RSS 피드에 영상이 올라오기까지 걸리는 시간이 그대로 얹히기 때문.
//   캐시 우회(bust) 적용 후 실측 4건: 150.1 / 390.8 / 403.6 / 649.4초 — 마지막 건이 10분 창을 넘겨 알림이 빠졌다.
//   (캐시 몫은 이제 ≤120초로 묶였다. 남은 변동은 유튜브가 자기 피드에 올리는 시간이라 우리가 못 줄인다.)
// 30분인 이유: 최대 표본의 2.8배. 표본이 4건뿐이라 여유를 크게 잡는다.
//   넓혀도 폭주 위험이 거의 없다 — 재편입이 나도 '30분 내에 게시된 영상'만 통과하는데, 13인이 30분 안에
//   올리는 영상은 많아야 한두 개다. 반면 이 창을 안 넓히면 늦게 잡힌 업로드가 조용히 알림 없이 지나간다.
const NOTIFY_RECENT_YOUTUBE_MS = 30 * 60 * 1000;
const notifyWindowMs = (e) => (e.type === 'youtube' ? NOTIFY_RECENT_YOUTUBE_MS : NOTIFY_RECENT_MS);

function processNewEventsForNotification(events) {
  // 빈 배열(KV 장애 등 일시적 빈 응답)에 키를 리셋하면 다음 정상 폴링에서 전체가 '새 이벤트'로 판정돼 알림 폭주 → 무시하고 기존 키 유지.
  // 최초 로드가 빈 배열인 경우도 ready=false 유지 → 이후 첫 정상 응답이 조용히 시드(아래 !ready 분기).
  if (!events || events.length === 0) return;
  // 키의 url은 불변이어야 함 — cafe_post는 즉시 해석 실패 시 워커가 사후에 url을 글 직링크로 교체(retryPendingCafeResolves)하는
  // 유일한 타입이라, url을 키에 쓰면 교체 순간 같은 이벤트가 '새 이벤트'로 재판정돼 중복 알림 발생 → 불변인 cafe_name+title로 대체.
  // (같은 초·같은 멤버의 서로 다른 카페 동시 게재도 cafe_name으로 구분 유지. 같은 카페·같은 제목은 워커 ingest가 2분 dedup)
  const eventKey = (e) => `${e.type}|${e.member_id}|${e.time}|${e.type === 'cafe_post' ? `${e.cafe_name || ''}|${e.title || ''}` : (e.url || '')}|${e.after || ''}`;
  if (!lastSeenEventKeysReady) {
    lastSeenEventKeys = new Set(events.map(eventKey));
    lastSeenEventKeysReady = true;
    return;
  }
  // '키에 없음' ≠ '새 이벤트': 키 셋은 매 폴링 현재 응답으로 교체되므로, 옛 이벤트가 응답에 재편입되면
  // (병합 상한 상향 재배포, KV 일시 장애로 리스트 하나가 빠졌다 복귀 등) 통째로 키-신규가 돼 알림이 폭주한다.
  // → 발생 시각이 최근(10분)인 것만 알림 대상. 정상 전달 지연은 감지 10s+flush 5s+폴링 10s 수준이라 충분히 관대하고,
  //   재편입분은 시간상 오래돼 자연 차단. 미확인 뱃지가 시간 기반이라 폭주 없는 것과 같은 원리.
  const nowMs = Date.now();
  const newOnes = events.filter(e => !lastSeenEventKeys.has(eventKey(e)) && (nowMs - new Date(e.time).getTime()) < notifyWindowMs(e));
  lastSeenEventKeys = new Set(events.map(eventKey));
  if (newOnes.length === 0) return;
  const filtered = dedupBattleNotices(newOnes.filter(e => {
    const cat = typeToCat(e.type);
    if (!filterState.types.has(cat)) return false;
    const memberMatch = filterState.members.has(e.member_id);
    const channelMatch = e.channel_id && filterState.members.has(e.channel_id);
    if (cat === 'chat') return memberMatch || channelMatch;
    return memberMatch;
  }));
  if (filtered.length === 0) return;
  if (notifyEnabled) {
    const userIsViewingEvents = (document.visibilityState === 'visible' && currentPage === 'events');
    if (!userIsViewingEvents) {
      filtered.forEach(ev => sendBrowserNotification(ev));
      startTitleFlash(filtered.length);
    }
  }
}

function refreshUnreadIndicator() {
  const lastSeen = new Date(getLastSeenTime()).getTime();
  const unread = dedupBattleNotices(allEvents.filter(e => {
    const t = new Date(e.time).getTime();
    if (isNaN(t) || t <= lastSeen) return false;
    const cat = typeToCat(e.type);
    if (!filterState.types.has(cat)) return false;
    const memberMatch = filterState.members.has(e.member_id);
    const channelMatch = e.channel_id && filterState.members.has(e.channel_id);
    if (cat === 'chat') return memberMatch || channelMatch;
    return memberMatch;
  }));
  const count = unread.length;
  updateTabTitle();
  const badge = document.getElementById('navBadge');
  if (badge) {
    if (count > 0) {
      badge.style.display = '';
      badge.innerHTML = navBadgeSvg(count);
      badge.setAttribute('aria-label', `새 이벤트 ${count}건`);
    } else {
      badge.style.display = 'none';
    }
  }
  const tl = document.getElementById('timeline');
  if (tl) {
    tl.querySelectorAll('.event').forEach(el => {
      const t = parseInt(el.dataset.time || '0', 10);
      const isUnread = t > lastSeen;
      el.classList.toggle('unread', isUnread);
    });
  }
}

if (notifyBellEl) {

  } else if (currentPage === 'events') {

  } else if (currentPage === 'stats') {
    topLine = lastStatsUpdate ? '1분마다 자동 갱신 · ' + lastStatsUpdate.toLocaleTimeString('ko-KR') + ' 기준' : '';
  } else if (currentPage === 'chemistry') {
    topLine = lastChemistryUpdate ? '1분마다 자동 갱신 · ' + lastChemistryUpdate.toLocaleTimeString('ko-KR') + ' 기준' : '';
  } else if (currentPage === 'content') {
    topLine = lastContentUpdate ? '열람 시 자동 갱신 · ' + lastContentUpdate.toLocaleTimeString('ko-KR') + ' 기준' : '';
  } else if (currentPage === 'banner') {
    topLine = lastBannerUpdate ? '열람 시 자동 갱신 · ' + lastBannerUpdate.toLocaleTimeString('ko-KR') + ' 기준' : '';
  } else if (currentPage === 'hall') {
    topLine = lastHallUpdate ? '열람 시 자동 갱신 · ' + lastHallUpdate.toLocaleTimeString('ko-KR') + ' 기준' : '';
  } else if (currentPage === 'members') {
    topLine = '';
  }
  // 감지 지연 경고: 심장박동(last_detect_at)이 임계 이상 늙으면 감지가 시간 단위로 도는 4탭의 주기 문구를 교체.
  // 시각도 클라이언트 fetch 시각 대신 서버 마지막 감지 시각으로(감지가 죽어도 fetch는 성공해 시각이 계속 새것처럼 보이는 문제 방지).
  const detectWarn = !!lastServerDetect && (Date.now() - lastServerDetect.getTime() > DETECT_STALE_MS)
    && ['live', 'events', 'stats', 'chemistry'].includes(currentPage);
  if (detectWarn) {
    topLine = '감지 지연 중 · ' + lastServerDetect.toLocaleTimeString('ko-KR') + ' 기준';
  }
  // topLine은 "{주기} · {시각} 기준" 형태. 모바일에서 '·' 기준 2줄 분리를 위해 주기/시각을 스팬으로 감쌈(PC는 inline이라 1줄 동일).
  let topLineHtml = '';
  if (topLine) {
    const sepIdx = topLine.indexOf(' · ');

      ? `<div class="header-center-line"><span class="hc-period${detectWarn ? ' hc-stale' : ''}">${topLine.slice(0, sepIdx)}</span><span class="hc-mid"> · </span><span class="hc-stamp">${topLine.slice(sepIdx + 3)}</span></div>`
      : `<div class="header-center-line">${topLine}</div>`;

  el.innerHTML = `

function switchPage(page) {
  if (!VALID_PAGES.includes(page)) page = 'live';
  if (currentPage === 'events' && page !== 'events') {
    setLastSeenToNow();
    refreshUnreadIndicator();
  }
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.page === page);
  });
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  updateHeaderCenter();
  if (page === 'stats' && !statsState.tabsInited) {
    initStatsTabs();
    statsState.tabsInited = true;
  }
  if (page === 'members' && !membersState.tabsInited) {
    initMembersTabs();
    membersState.tabsInited = true;
  }
  if (page === 'members') {
    preloadProfileSet();  // 크루 소개를 읽는 동안 멤버 상세 사진 13장을 백그라운드 적재
    // 시트(크루활동·멤버정보·휴방) 첫 로드 실패 상태면 재진입을 재시도 기회로 — 배너·컨텐츠와 동일 패턴(진입당 1회)
    if (crewActs.length === 0 && crewSheetsDone) { crewSheetsDone = false; loadCrewSheets(); }
    renderMembersBody();
  }
  if (page === 'events') {
    stopTitleFlash();
    refreshUnreadIndicator();
  }
  if (page === 'live') {
    // 생방송 탭에 다시 들어오면 정전 타이머를 되살린다(여전히 전원 오프라인일 때만).
    // 직전 폴링 값(lastLiveCount)을 재사용하므로 재조회는 없다.
    blackoutDismissed = false;
    applyBlackout();
  }
  if (page === 'chemistry') {
    renderChemistry();
  }
  if (page === 'banner') {
    // 데이터 없음 = 첫 로드 실패(시트 간헐 오류 등) 상태 — 재진입을 재시도 기회로. 결과 렌더는 loadBanners 내부가 수행
    // (bannerData 선언은 이 함수의 초기 호출보다 앞이라 TDZ 없음. 로드 성공 후 진짜 0건이면 loadBanners가 '없어요'를 그림)
    if (bannerData.length === 0) {
      const body = document.getElementById('bannerBody');
      if (body) body.innerHTML = '<div class="loading"><div class="spinner"></div><div>현수막 데이터 불러오는 중...</div></div>';
      loadBanners();
    } else renderBanners();
  }
  if (page === 'hall') {
    refreshHallChem();   // '열람 시 갱신' 정합: 캐시로 즉시 렌더하고 현재 기간 채팅 데이터를 배경 재조회(도착분이 다르면 재렌더)
    renderHall();
  }
  if (page === 'content') {
    // banner와 동일: 데이터 없음 = 첫 로드 실패 상태 — 재진입 재시도, 결과 렌더는 loadContent 내부가 수행
    if (contentData.length === 0) {
      const body = document.getElementById('contentBody');
      if (body) body.innerHTML = '<div class="loading"><div class="spinner"></div><div>컨텐츠 데이터 불러오는 중...</div></div>';
      loadContent();
    } else renderContent();
  }
  window.scrollTo(0, 0);   // 탭 전환은 항상 최상단에서 — 이전 탭의 스크롤 깊이가 새 탭에 이월되는 것 방지
}

function formatBtime(seconds) {
  if (!seconds || seconds <= 0) return null;
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (h > 0) return h + '시간 ' + m + '분';
  return m + '분';
}
function formatRelTime(iso) {
  const now = new Date();
  const t = new Date(iso);
  const diff = Math.floor((now - t) / 1000);
  if (diff < 60) return '방금 전';
  if (diff < 3600) return Math.floor(diff / 60) + '분 전';
  if (diff < 86400) return Math.floor(diff / 3600) + '시간 전';
  return Math.floor(diff / 86400) + '일 전';
}
// 사이트 날짜 표시 통일(한글 'YYYY년 M월 D일'). 연도 없는 생일(M월 D일)·월 단위 라벨(YYYY년 M월)은 별도 범주라 미적용.
function koDate(y, m, d) { return `${y}년 ${m}월 ${d}일`; }
function kstNow() { return new Date(Date.now() + 9 * 3600 * 1000); }   // 뷰어 TZ 무관 현재 KST — getUTC*로 읽음
function kstMonthStartMs(year, month1) { return Date.UTC(year, month1 - 1, 1) - 9 * 3600 * 1000; }   // KST YYYY-MM-01 00:00의 epoch ms (월 경계 필터)
function formatAbsTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const k = new Date(d.getTime() + 9 * 3600 * 1000);
  const hh = String(k.getUTCHours()).padStart(2, '0');
  const mi = String(k.getUTCMinutes()).padStart(2, '0');
  return `<span class="ev-abs-d">${koDate(k.getUTCFullYear(), k.getUTCMonth() + 1, k.getUTCDate())}</span> <span class="ev-abs-t">${hh}:${mi}</span>`;   // 날짜·시간 분리 span. 기본 1줄, 좁은 화면(≤480px)에서만 CSS로 2줄
}
function formatHHMM(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const k = new Date(d.getTime() + 9 * 3600 * 1000);
  return `${String(k.getUTCHours()).padStart(2,'0')}:${String(k.getUTCMinutes()).padStart(2,'0')}`;
}
function formatDuration(ms) {
  if (!ms || ms <= 0) return '0분';
  const totalMin = Math.floor(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h > 0) return `${h}시간 ${m}분`;
  return `${m}분`;
}
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
// SOOP 게시판(/board) 폴백 링크에 텍스트 조각(#:~:text=)을 부착 → 브라우저가 게시판 목록에서 해당 글 제목으로 스크롤·강조.
// 대상: 애청자 전용 글 등 정밀 링크로 업그레이드되지 않는 board형 링크. 미지원 브라우저·제목 미표시 시 fragment는 조용히 무시됨.
function withTextFragment(url, title) {
  if (!url || !title || !/\/board$/.test(url)) return url;
  const frag = encodeURIComponent(title).replace(/-/g, '%2D');  // '-'는 텍스트 조각 문법의 prefix/suffix 구분자라 추가 인코딩 필요
  return `${url}#:~:text=${frag}`;
}
function soopProfileUrl(userId) {
  const prefix = userId.substring(0, 2);
  return `https://profile.img.sooplive.com/LOGO/${prefix}/${userId}/${userId}.jpg`;
}
function isoToKstDateKey(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  const k = new Date(d.getTime() + 9 * 3600 * 1000);
  return `${k.getUTCFullYear()}-${String(k.getUTCMonth()+1).padStart(2,'0')}-${String(k.getUTCDate()).padStart(2,'0')}`;
}
// ── 방송 일수 걸침 규칙(2026-07-16 확정) ─────────────────────────────
// 자정을 걸쳐도 24시간 미만이면 1일 — 24시간 이상 2일, 48시간 이상 3일…
// = 시작일 + floor(방송길이/24h)개의 '다음 날짜' 키 (일반 저녁 방송의 자정 걸침은 1일 유지).
// 진행 중 세션은 nowMs까지 경과를 그대로 인정 — 48h 상한 없음(120h+ 마라톤 실사례가 상한에 물린 2026-07-20 제보로 제거).
// 고아 방어는 두 겹이 대신함: ① monthPrefix가 그 달 밖 날짜를 끊음(월간·연간·명전합산) ② 프리픽스 없는 스트릭 호출자는
// 라이브 확인(broad_no 일치)으로 게이트하고, 불일치 고아에는 유사-now(시작+48h)를 넘겨 상한을 재현.
// monthPrefix('YYYY-MM')를 주면 그 달 밖 날짜는 버림. 세션은 시작월 키에만 있어 월경계 마라톤의
// 다음 달 조각은 다음 달이 셀 수 없는 알려진 한계(발생 시 수동 보정).
function sessionDateKeys(s, monthPrefix, nowMs) {
  const t = new Date(s.start).getTime();
  if (isNaN(t)) return [];
  let e;
  if (s.end) {
    e = new Date(s.end).getTime();
    if (isNaN(e) || e < t) e = t;
  } else {
    e = nowMs;
    if (e < t) e = t;
  }
  const keys = [];
  const extraDays = Math.floor((e - t) / 86400000);
  for (let i = 0; i <= extraDays; i++) {
    const dk = isoToKstDateKey(new Date(t + i * 86400000).toISOString());
    if (!dk) continue;
    if (monthPrefix && !dk.startsWith(monthPrefix)) break;
    keys.push(dk);
  }
  return keys;
}
function ymdKey(year, month1, day) {
  return `${year}-${String(month1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function daysInMonth(year, month1) {
  return new Date(year, month1, 0).getDate();
}

    <div class="card-thumb">
      ${thumbHtml}
      <div class="placeholder" style="display:${hasThumb ? 'none' : 'flex'}">${placeholderInner}</div>
      ${modeBadge}
    </div>
    <div class="card-info">
      ${avatarHtml}
      <div class="card-text">
        <div class="card-name-row">
          <span class="card-name" style="${nameColorStyle}">${m.name}</span>
          ${btimeHtml}
        </div>
        <div class="card-title ${info.live ? 'is-live' : ''}">${escapeHtml(titleText)}</div>
      </div>
    </div>
  `;
  return card;
}

function getBroadcastElapsed(e, allEvents) {
  const targets = ['title', 'category', 'mode_change', 'end', 'chat', 'chat_emoticon', 'donation', 'sanction', 'mission_gift'];   // 제재·미션도 broad_start를 수집하므로 채팅류와 동일하게 ⏱ 표시(묶음 첫 이벤트가 제재일 때의 비대칭 해소)
  if (!targets.includes(e.type)) return '';
  const evTime = new Date(e.time).getTime();
  let startTime = null;
  if (e.broad_start) {
    startTime = new Date(e.broad_start).getTime();
  } else {
    const isChat = ['chat', 'chat_emoticon', 'donation', 'sanction', 'mission_gift'].includes(e.type);
    const targetMemberId = isChat ? e.channel_id : e.member_id;
    let startEv = null;
    for (const ev of allEvents) {
      if (ev.type === 'start' && ev.member_id === targetMemberId) {
        const t = new Date(ev.time).getTime();
        if (t <= evTime && (!startEv || t > new Date(startEv.time).getTime())) startEv = ev;
      }
    }
    if (!startEv) return '';
    startTime = new Date(startEv.time).getTime();
  }
  const diff = Math.floor((evTime - startTime) / 1000);
  if (diff < 0) return '';
  if (diff < 60) return `${diff}초`;
  const h = Math.floor(diff / 3600);
  const m = Math.floor((diff % 3600) / 60);
  return h > 0 ? `${h}시간 ${m}분` : `${m}분`;
}

function renderEvent(e, allEvents) {
  const iconMap = {
    start: SVG_ICONS.soop, end: SVG_ICONS.soop,
    title: SVG_ICONS.pencil, category: SVG_ICONS.tag, mode_change: SVG_ICONS.rotate,
    post: SVG_ICONS.board, comment_recommend: SVG_ICONS.thumbsup,
    youtube: SVG_ICONS.youtube, cafe_post: SVG_ICONS.coffee,
    chat: SVG_ICONS.chatBubble, chat_emoticon: SVG_ICONS.chatBubble,
    donation: SVG_ICONS.starBalloon, mission_gift: SVG_ICONS.flame,
  };
  const actionMap = {
    start: '방송 시작', end: '방송 종료',
    title: '방송 제목 변경', category: '카테고리 변경', mode_change: '방송 모드 변경',
    post: '숲 게시글', comment_recommend: '좋아요 요청',
    youtube: '유튜브 업로드', cafe_post: '카페 게시글',
    chat: '채팅', chat_emoticon: '채팅',
    donation: '후원',
  };
  // 제재·미션은 kind/필드에 따라 라벨이 달라 정적 맵 대신 계산 — 문구는 "내용 (XX 방송)" 확정 문법
  let actionLabel = actionMap[e.type] || e.type;
  if (e.type === 'sanction') actionLabel = e.kind === 'kick' ? '강제퇴장' : `채팅금지 ${e.seconds || 0}초`;
  else if (e.type === 'mission_gift') actionLabel = `${e.mission === 'battle' ? '대결' : '도전'}미션 후원 ${e.amount || 0}개`;
  const member = findMember(e.member_id);
  const avatarSrc = member ? member.img : '';
  const memberColor = member ? member.color : '#fff';
  let modeTag = '';
  if ((e.type === 'start' || e.type === 'end') && e.mode && e.mode !== 'normal') {
    modeTag = modeParts(e.mode)
      .map(p => { const label = MODE_LABEL[p] || ''; return label ? `<span class="event-mode-tag ${p}" role="img" aria-label="${label}">${modeBadgeSvg(p)}</span>` : ''; })
      .join('');
  }
  let targetTag = '';
  if (e.type === 'comment_recommend' && e.target_name) {
    // 대상 글 제목을 여기(헤더)에 붙인다 — '어디에 다는 요청인지'가 한눈에 보인다.
    //   못 가져온 글은 그냥 빠진다: 애청자 공개 게시판은 익명으로 제목을 못 읽는다(아래 [한계] 참조).
    //   .event-target이 inline-block이라 제목이 길어도 덩어리 안에서 줄바꿈된다(모바일 가로 overflow 방지).
    const at = e.post_title ? ` - "${escapeHtml(e.post_title)}"` : '';
    targetTag = `<span class="event-target">(${escapeHtml(e.target_name)} 컨텐츠${at})</span>`;
  }
  if (e.type === 'cafe_post' && e.cafe_name) {
    targetTag = `<span class="event-target">(${escapeHtml(e.cafe_name)})</span>`;
  }
  if (['chat', 'chat_emoticon', 'donation', 'sanction', 'mission_gift'].includes(e.type) && e.channel_name) {
    const channelMember = MEMBERS.find(m => m.id === e.channel_id);
    const channelColor = channelMember ? channelMember.color : '#cbd5e1';
    targetTag = `<span class="event-target">(<span style="color: ${channelColor}">${escapeHtml(e.channel_name)}</span> 방송)</span>`;
  }
  let detail = '';
  if (e.type === 'start') {
    const titleText = e.title ? escapeHtml(e.title) : '';
    detail = `<div class="event-detail">${modeTag}${modeTag && titleText ? ' ' : ''}${titleText}</div>`;
  } else if (e.type === 'end') {
    const evTime = new Date(e.time).getTime();
    let lastTitleEv = null;
    for (const ev of (allEvents || [])) {
      if (ev.member_id === e.member_id && (ev.type === 'title' || ev.type === 'start')) {
        const t = new Date(ev.time).getTime();
        if (t <= evTime && (!lastTitleEv || t > new Date(lastTitleEv.time).getTime())) lastTitleEv = ev;
      }
    }
    const lastTitle = lastTitleEv ? (lastTitleEv.type === 'title' ? lastTitleEv.after : lastTitleEv.title) : '';
    const titleText2 = lastTitle ? escapeHtml(lastTitle) : '';
    detail = `<div class="event-detail">${modeTag}${modeTag && titleText2 ? ' ' : ''}${titleText2}</div>`;
  } else if (e.type === 'title' || e.type === 'category') {
    detail = `<div class="event-detail">${escapeHtml(e.before)} → ${escapeHtml(e.after)}</div>`;
  } else if (e.type === 'mode_change') {
    detail = `<div class="event-detail">${escapeHtml(modeLabel(e.before))} → ${escapeHtml(modeLabel(e.after))}</div>`;
  } else if (e.type === 'comment_recommend' && e.title) {
    // '누구 댓글 · 원본 숲 게시글 제목'. e.title은 링크를 담고 있던 멤버 글의 제목이다.
    //   [이벤트 탭] 그 게시글 이벤트가 타임라인에 따로 있으므로 둘의 연결이 보인다.
    //   (좋아요 요청 모달은 2026-08-10부터 renderEvent를 쓰지 않는다 — 전용 렌더 renderLikeReqBody가 같은 정보를 행 2줄째로 표시)
    // comment_member_id가 없으면(외부인 댓글·이 기능 이전 항목) 앞 조각만 빠지고 제목은 그대로 나온다 — 무회귀.
    const cm = e.comment_member_id ? findMember(e.comment_member_id) : null;
    const who = cm ? `<span style="color: ${cm.color}">${escapeHtml(cm.name)}</span> 댓글 · ` : '';
    detail = `<div class="event-detail">${who}${escapeHtml(e.title)}</div>`;
  } else if ((e.type === 'post' || e.type === 'youtube' || e.type === 'cafe_post') && e.title) {
    detail = `<div class="event-detail">${escapeHtml(e.title)}</div>`;
  } else if (e.type === 'chat' && e.message) {
    detail = `<div class="event-detail">${escapeHtml(e.message)}</div>`;
  } else if (e.type === 'chat_emoticon') {
    detail = `<div class="event-detail">(이모티콘)</div>`;
  } else if (e.type === 'donation' && e.amount) {
    detail = `<div class="event-detail">별풍선 ${e.amount}개</div>`;
  } else if (e.type === 'mission_gift' && e.title) {
    detail = `<div class="event-detail">“${escapeHtml(e.title)}”</div>`;
  }
  if (e.type === 'end' && !e.url && e.member_id) {
    e = { ...e, url: `https://www.sooplive.com/station/${e.member_id}/vod` };
  }
  const eventTime = new Date(e.time).getTime() || 0;
  const iconHtml = e.type === 'sanction' ? (e.kind === 'kick' ? SVG_ICONS.kickOut : SVG_ICONS.ban) : (iconMap[e.type] || '•');
  const inner = `
    <div class="event-icon ${e.type}">${iconHtml}</div>
    ${avatarSrc ? `<img class="event-avatar" src="${avatarSrc}" alt="${escapeHtml(e.member_name)}">` : ''}
    <div class="event-body">
      <div>
        <span class="event-member" style="color: ${memberColor}">${escapeHtml(e.member_name)}</span>
        <span class="event-action"><span class="event-action-label">${actionLabel}</span>${(() => { const el = getBroadcastElapsed(e, allEvents||[]); return el ? ` <span class="event-elapsed">${SVG_ICONS.clockTime} ${el}</span>` : ''; })()}</span>
        ${targetTag}
      </div>
      ${detail}
    </div>
    <div class="event-time">
      <span class="event-time-rel">${formatRelTime(e.time)}</span>
      <span class="event-time-abs">${formatAbsTime(e.time)}</span>
    </div>
  `;
  const LIVE_NAV_TYPES = new Set(['start', 'title', 'category', 'mode_change']);
  if (LIVE_NAV_TYPES.has(e.type)) {
    const liveUrl = `https://play.sooplive.co.kr/${e.member_id}`;
    return `<div class="event" data-time="${eventTime}"><a class="event-link" href="${escapeHtml(liveUrl)}" target="_blank" rel="noopener">${inner}</a></div>`;
  }
  if (['chat', 'chat_emoticon', 'donation', 'sanction', 'mission_gift'].includes(e.type) && e.channel_id) {
    // 채팅 본문이 http(s) 링크로 시작하면 방송이 아니라 그 링크로 연결 (뒤에 글자가 붙어 있으면 앞 URL 토큰만)
    if (e.type === 'chat' && e.message) {
      const urlMatch = e.message.match(/^(https?:\/\/\S+)/);
      if (urlMatch) {
        return `<div class="event" data-time="${eventTime}"><a class="event-link" href="${escapeHtml(urlMatch[1])}" target="_blank" rel="noopener">${inner}</a></div>`;
      }
    }
    const liveUrl = `https://play.sooplive.co.kr/${e.channel_id}`;
    return `<div class="event" data-time="${eventTime}"><a class="event-link" href="${escapeHtml(liveUrl)}" target="_blank" rel="noopener">${inner}</a></div>`;
  }
  if (e.url) {
    return `<div class="event" data-time="${eventTime}"><a class="event-link" href="${escapeHtml(withTextFragment(e.url, e.title))}" target="_blank" rel="noopener">${inner}</a></div>`;
  }
  return `<div class="event" data-time="${eventTime}">${inner}</div>`;
}

// 채팅 묶음 gap — "감지 주기 연속" 규칙의 시간 근사: 같은 채널의 직전 채팅과 이 간격 이내면 같은 대화, 넘으면 종결.
// 채팅 시각은 Oracle 수신 순간 기준이고 폴링(10초) 배치 경계는 클라이언트가 알 수 없어, 배치 규칙
// "다음 감지에 이어지면 붙이고 빈 주기가 나오면 종결"을 시간으로 옮기면 10~20초 범위지만 짧은 쉼까지 넉넉히 묶으려 25초.
const CHAT_BUNDLE_GAP_MS = 25 * 1000;

// 채팅류(chat/chat_emoticon/donation)를 채널 단위로 묶어 타임라인 아이템 목록을 만든다.
// 같은 채널의 직전 채팅과 CHAT_BUNDLE_GAP_MS 이내면 같은 묶음 — 사이에 낀 다른 채널 채팅·비채팅 이벤트는 묶음을 끊지 않음(채널별 독립).
// 필터 통과분만 받으므로 필터와 정방향으로 맞물린다. 2건부터 묶음, 1건은 개별 표시.
// 정렬 앵커: 개별=자기 시각, 묶음=오래된순이면 첫 채팅·최신순이면 마지막 채팅 시각(마지막 활동 위치에 노출).
// 타임라인 표시 순서: 앵커 시각 우선, 동시각 동률은 타입으로 — 리방 합성(같은 시각의 종료+시작)은
// 시간 흐름상 종료→시작이므로 최신순에선 '시작'이 위(최근 쪽), 오래된순에선 '종료'가 위(2026-07-17 확정).
// 그 외 동시각 조합(제목·카테고리 변경 쌍 등)은 랭크 0 → 안정 정렬이 기존 순서 유지. 데이터(KV) 순서는 불변 — 표시만 교정.
function timelineOrderCompare(a, b, asc) {
  const d = asc ? a.aAsc - b.aAsc : b.aDesc - a.aDesc;
  if (d !== 0) return d;
  const rank = it => it.ev ? (it.ev.type === 'start' ? 1 : it.ev.type === 'end' ? -1 : 0) : 0;
  return asc ? rank(a) - rank(b) : rank(b) - rank(a);
}
function buildTimelineItems(filtered, all) {
  const items = [];
  const chatFam = [];
  const battleSeen = new Set();   // 필터를 통과한 대결 key만 노출 대상
  for (const e of filtered) {
    if (e.type === 'battle_notice') { if (e.mkey != null) battleSeen.add(e.mkey); continue; }   // mkey 결손분은 조인 불가 — undefined끼리 허위 조인 방지
    if ((e.type === 'chat' || e.type === 'chat_emoticon' || e.type === 'donation' || e.type === 'sanction' || e.type === 'mission_gift') && e.channel_id) chatFam.push(e);
    else { const t = new Date(e.time).getTime() || 0; items.push({ ev: e, aAsc: t, aDesc: t }); }
  }
  // 대결 종료: 같은 key의 NOTICE(참가 멤버 채널마다 1건)를 조인해 한 아이템으로.
  // 참가 명단은 전체 이벤트 기준(멤버 필터로 일부 참가자가 가려져도 명단은 불변), 노출 여부는 필터 통과분 기준.
  // 멤버 2인 이상만 이벤트화 — 1인은 외부인과의 대결(범위 밖)이거나 수신 누락 케이스라 미발화가 안전.
  if (battleSeen.size > 0) {
    const byKey = {};
    for (const e of (all || filtered)) {
      if (e.type === 'battle_notice' && battleSeen.has(e.mkey)) (byKey[e.mkey] = byKey[e.mkey] || []).push(e);
    }
    for (const key in byKey) {
      const g = byKey[key];
      if (new Set(g.map(e => e.member_id)).size < 2) continue;
      const ts = g.map(e => new Date(e.time).getTime() || 0);
      items.push({ battle: g, aAsc: Math.min(...ts), aDesc: Math.max(...ts) });
    }
  }
  chatFam.sort((a, b) => new Date(a.time) - new Date(b.time));
  const open = {};   // channel_id → { t: 마지막 채팅 시각, arr: 진행 중 묶음 }
  const bundles = [];
  for (const e of chatFam) {
    const t = new Date(e.time).getTime() || 0;
    const o = open[e.channel_id];
    if (o && t - o.t <= CHAT_BUNDLE_GAP_MS) { o.arr.push(e); o.t = t; }
    else { const arr = [e]; bundles.push(arr); open[e.channel_id] = { t, arr }; }
  }
  for (const arr of bundles) {
    if (arr.length === 1) {
      const t = new Date(arr[0].time).getTime() || 0;
      items.push({ ev: arr[0], aAsc: t, aDesc: t });
    } else {
      items.push({ bundle: arr, aAsc: new Date(arr[0].time).getTime() || 0, aDesc: new Date(arr[arr.length - 1].time).getTime() || 0 });
    }
  }
  return items;
}

// 채팅 묶음 아이템 — 클릭 펼침 없이 내용 전체를 인라인 노출, 내부는 과거→최신 고정(확정 사양).
// 헤더는 개별 이벤트와 같은 골격: [채팅 아이콘][발화자 아바타들][발화자들 채팅 (⏱) (채널 방송)][시간]. 라벨은 "채팅"만(건수 없음 — 확정).
function renderChatBundle(items, allEvents) {
  const first = items[0], last = items[items.length - 1];
  const channelMember = MEMBERS.find(m => m.id === first.channel_id);
  const channelColor = channelMember ? channelMember.color : '#cbd5e1';
  const senderIds = [...new Set(items.map(i => i.member_id))];
  const senderHtml = senderIds.map(id => {
    const m = findMember(id);
    const it = items.find(x => x.member_id === id);
    return `<span style="color: ${m ? m.color : '#fff'}">${escapeHtml(it.member_name || '')}</span>`;
  }).join('·');
  const el = getBroadcastElapsed(first, allEvents || []);
  const absRange = formatAbsTime(first.time) + (formatHHMM(last.time) !== formatHHMM(first.time) ? ` ~ ${formatHHMM(last.time)}` : '');
  const liveUrl = `https://play.sooplive.co.kr/${first.channel_id}`;
  const rows = items.map(i => {
    const m = findMember(i.member_id);
    let msg, rowUrl = liveUrl;   // 개별 채팅과 동일 동선: 행 전체가 방송으로 이동, 메시지가 http 링크로 시작하면 그 링크로
    if (i.type === 'donation') msg = `<span class="cbr-don">${SVG_ICONS.starBalloon}별풍선 ${i.amount || ''}개</span>`;
    else if (i.type === 'sanction') msg = i.kind === 'kick'
      ? `<span class="cbr-sanction">${SVG_ICONS.kickOut}강제퇴장</span>`
      : `<span class="cbr-sanction">${SVG_ICONS.ban}채팅금지 ${i.seconds || 0}초</span>`;
    else if (i.type === 'mission_gift') msg = `<span class="cbr-mission">${SVG_ICONS.flame}${i.mission === 'battle' ? '대결' : '도전'}미션 후원 ${i.amount || 0}개</span>${i.title ? ` <span class="cbr-mtitle">“${escapeHtml(i.title)}”</span>` : ''}`;
    else if (i.type === 'chat_emoticon') msg = '(이모티콘)';
    else {
      msg = escapeHtml(i.message || '');
      const um = (i.message || '').match(/^(https?:\/\/\S+)/);
      if (um) rowUrl = um[1];
    }
    return `<a class="chat-bundle-row" href="${escapeHtml(rowUrl)}" target="_blank" rel="noopener"><span class="cbr-time">${formatHHMM(i.time)}</span><span class="cbr-name" style="color: ${m ? m.color : '#fff'}">${escapeHtml(i.member_name || '')}</span><span class="cbr-msg">${msg}</span></a>`;
  }).join('');
  // 아바타 = 발화자들(첫 발화 순, 헤더 이름 나열과 동일 순서) 세로 나열 — 단건 채팅(발화자 사진)과 의미 통일. 장소(채널)는 헤더의 '(X 방송)' 링크가 담당
  const avatarsHtml = senderIds.map(id => {
    const m = findMember(id);
    return m ? `<img class="event-avatar" src="${m.img}" alt="${escapeHtml(m.name)}">` : '';
  }).join('');
  const inner = `
    <div class="event-icon chat">${SVG_ICONS.chatBubble}</div>
    ${avatarsHtml ? `<div class="chat-bundle-avatars">${avatarsHtml}</div>` : ''}
    <div class="event-body">
      <div>
        <span class="event-member">${senderHtml}</span>
        <span class="event-action"><span class="event-action-label">채팅</span>${el ? ` <span class="event-elapsed">${SVG_ICONS.clockTime} ${el}</span>` : ''}</span>
        <span class="event-target">(<a class="cbr-chan" href="${escapeHtml(liveUrl)}" target="_blank" rel="noopener" style="color: ${channelColor}">${escapeHtml(first.channel_name || '')}</a> 방송)</span>
      </div>
      <div class="chat-bundle-rows">${rows}</div>
    </div>
    <div class="event-time">
      <span class="event-time-rel">${formatRelTime(last.time)}</span>
      <span class="event-time-abs">${absRange}</span>
    </div>
  `;
  return `<div class="event chat-bundle" data-time="${new Date(last.time).getTime() || 0}">${inner}</div>`;
}

// 대결 종료 아이템: 같은 key의 NOTICE 묶음(참가 멤버 채널당 1건) → "[팀별 멤버] 승/패(또는 무승부)" 한 행.
// 표시는 감지된 멤버만(외부 참가자는 원리적으로 비가시). 여러 채널에 걸친 사건이라 (XX 방송) 표기는 예외적으로 생략(확정).
// 아바타 = 크루 로고(Favicon) 고정 — 크루 차원 사건 + 참가자 나열은 인원 과다(확정), 공통 골격([아이콘][아바타][본문][시간]) 유지.
function renderBattleItem(g) {
  const first = g[0];
  const teams = {};   // 팀명 → 멤버 id들(채널 내 중복 수신 대비 중복 제거)
  for (const e of g) {
    if (!teams[e.my_team]) teams[e.my_team] = [];
    if (!teams[e.my_team].includes(e.member_id)) teams[e.my_team].push(e.member_id);
  }
  const nameHtml = id => { const m = findMember(id); return `<span style="color: ${m ? m.color : '#fff'}">${escapeHtml(m ? m.name : id)}</span>`; };
  const teamHtml = ids => ids.map(nameHtml).join('·');
  let resultHtml;
  if (first.draw) {
    resultHtml = Object.values(teams).map(teamHtml).join(' <span class="battle-sep">/</span> ') + ' <span class="battle-draw">무승부</span>';
  } else {
    const win = [], lose = [];
    for (const t in teams) (t === first.winner ? win : lose).push(...teams[t]);
    const parts = [];
    if (win.length) parts.push(`${teamHtml(win)} <span class="battle-win">승</span>`);
    if (lose.length) parts.push(`${teamHtml(lose)} <span class="battle-lose">패</span>`);
    resultHtml = parts.join(' <span class="battle-sep">/</span> ');
  }
  const last = g.reduce((a, b) => new Date(a.time) > new Date(b.time) ? a : b);
  const t = new Date(last.time).getTime() || 0;
  return `<div class="event" data-time="${t}">
    <div class="event-icon battle">${SVG_ICONS.swords}</div>
    <img class="event-avatar" src="Favicon.webp" alt="천타버스">
    <div class="event-body">
      <div>
        <span class="event-action"><span class="event-action-label">대결미션 종료</span></span>
        <span class="battle-result">— ${resultHtml}</span>
      </div>
      ${first.title ? `<div class="event-detail">“${escapeHtml(first.title)}”</div>` : ''}
    </div>
    <div class="event-time">
      <span class="event-time-rel">${formatRelTime(last.time)}</span>
      <span class="event-time-abs">${formatAbsTime(last.time)}</span>
    </div>
  </div>`;
}
