function applyFilter() {
  const tl = document.getElementById('timeline');
  if (!tl) return;
  const ew = document.querySelector('.events-wrap');
  if (ew) ew.classList.toggle('evt-sort-asc', eventSortAsc);   // 정렬 따라 필터 위/아래(모바일 CSS order)
  // 폴링 무변화 스킵: 렌더 입력(이벤트 집합·정렬·필터)이 직전과 같으면 innerHTML 재생성 생략 —
  // 10초마다 전체 DOM을 다시 만들면 사용자의 텍스트 선택이 풀리고 조용한 시간에도 수백 노드가 낭비 재생성됨.
  // 이벤트 집합 동등성은 길이+양끝 시각으로 판정(/events는 append-only 롤링이라 충분). 산출물 중 시간이 흐르면
  // 변하는 건 상대시각("N분 전")뿐이므로 그것만 data-time(각 아이템의 상대시각 기준과 동일한 epoch ms)으로 부분 갱신.
  // timeline-header 존재 조건: 초기/에러 상태의 빈 tl에서 스킵하는 것 방지(정상 렌더 산출물에만 존재).
  const tlSig = [allEvents.length, allEvents[0]?.time || '', allEvents[allEvents.length - 1]?.time || '',
    eventSortAsc, [...filterState.types].sort().join(','), [...filterState.members].sort().join(',')].join('|');
  if (tlSig === lastTimelineSig && tl.querySelector('.timeline-header')) {
    tl.querySelectorAll('.event[data-time]').forEach(evEl => {
      const rel = evEl.querySelector('.event-time-rel');
      if (rel) rel.textContent = formatRelTime(Number(evEl.dataset.time));   // dataset은 문자열 — new Date("숫자문자열")은 Invalid Date라 Number 필수
    });
    refreshUnreadIndicator();
    return;
  }
  lastTimelineSig = tlSig;
  const filtered = allEvents.filter(e => {
    const cat = typeToCat(e.type);
    if (!filterState.types.has(cat)) return false;
    const memberMatch = filterState.members.has(e.member_id);
    const channelMatch = e.channel_id && filterState.members.has(e.channel_id);
    if (cat === 'chat') return memberMatch || channelMatch;
    return memberMatch;
  });
  const sortLabel = eventSortAsc ? '과거순' : '최신순';   // 두 라벨 3자 등장(2026-08-09) — 토글해도 버튼 폭·아이콘-글자 간격이 그대로, 옆 버튼들과 위화감 없음
  const arrowSvg = eventSortAsc ? SVG_ICONS.arrowLineDown : SVG_ICONS.arrowLineUp;   // SVG_ICONS로 통합(2026-08-08)
  const scrollDownSvg = SVG_ICONS.chevronsDown;
  const scrollUpSvg = SVG_ICONS.chevronsUp;
  const sortBtnHtml = `<button class="sort-toggle sort-toggle-sync">${arrowSvg}<span>${sortLabel}</span></button>`;
  const markReadBtn = `<button class="timeline-scroll-btn mark-read-btn">${SVG_ICONS.checkAll}<span>모두 읽음</span></button>`;
  // 상단바 sticky(2026-08-09): 스크롤 내내 붙어 다니므로 모두 읽음·맨 위/아래·정렬을 여기 다 모은다.
  // 하단바는 완전 중복이 되어 폐지 — 맨 위로 버튼이 이리로 이사(맨 아래로 왼쪽).
  const headerHtml = `<div class="timeline-header"><div class="timeline-bar-left">${markReadBtn}</div><div class="timeline-bar-right"><button class="timeline-scroll-btn" id="scrollToTop">${scrollUpSvg}<span>맨 위로</span></button><button class="timeline-scroll-btn" id="scrollToBottom">${scrollDownSvg}<span>맨 아래로</span></button>${sortBtnHtml}</div></div>`;
  if (filtered.length === 0) {
    tl.innerHTML = headerHtml + (allEvents.length === 0
      ? '<div class="timeline-empty">아직 기록된 이벤트가 없어요<br><br>방송, 게시글, 유튜브 영상 등이 올라오면 여기에 표시됩니다</div>'
      : '<div class="timeline-empty">필터 조건에 맞는 이벤트가 없어요</div>');
  } else {
    const sorted = [...filtered].sort((a, b) => eventSortAsc
      ? new Date(a.time) - new Date(b.time)
      : new Date(b.time) - new Date(a.time));
    // 채팅류는 채널 단위 묶음으로 변환 후 앵커 시각으로 정렬. sorted는 renderEvent의 종료 제목·⏱ 경과 조회용 원본 유지.
    const items = buildTimelineItems(filtered, allEvents);
    items.sort((a, b) => timelineOrderCompare(a, b, eventSortAsc));   // 동시각 동률: 리방 종료·시작 순서 교정
    tl.innerHTML = headerHtml + items.map(it => it.bundle ? renderChatBundle(it.bundle, sorted) : it.battle ? renderBattleItem(it.battle) : renderEvent(it.ev, sorted)).join('');
  }
  tl.querySelectorAll('.sort-toggle-sync').forEach(btn => {
    btn.addEventListener('click', () => { eventSortAsc = !eventSortAsc; applyFilter(); });
  });
  tl.querySelectorAll('.mark-read-btn').forEach(btn => {
    btn.addEventListener('click', () => { setLastSeenToNow(); refreshUnreadIndicator(); });
  });
  const scrollBottomBtn = document.getElementById('scrollToBottom');
  if (scrollBottomBtn) scrollBottomBtn.addEventListener('click', () => { tl.scrollIntoView({ block: 'end' }); });
  const scrollTopBtn = document.getElementById('scrollToTop');
  if (scrollTopBtn) scrollTopBtn.addEventListener('click', () => { tl.scrollIntoView({ block: 'start' }); });
  const summary = document.getElementById('filterSummary');
  if (summary) summary.textContent = '선택된 멤버/종류만 알림됩니다.';

  refreshUnreadIndicator();
}

function findLatestActivityDate(memberId) {
  const ms = getMemberStatsForView(memberId);
  if (!ms) return null;
  let latestBroadcast = null;
  for (const s of (ms.sessions || [])) {
    if (!s.start) continue;
    const t = new Date(s.start).getTime();
    if (isNaN(t)) continue;
    if (latestBroadcast === null || t > new Date(latestBroadcast).getTime()) latestBroadcast = s.start;
  }
  if (latestBroadcast) return latestBroadcast;
  let latest = null;
  const candidates = [
    ...(ms.posts || []).map(p => p.time),
    ...(ms.youtube || []).map(y => y.time),
    ...(ms.cafe || []).map(c => c.time),
  ];
  for (const t of candidates) {
    const ms2 = new Date(t).getTime();
    if (isNaN(ms2)) continue;
    if (latest === null || ms2 > new Date(latest).getTime()) latest = t;
  }
  return latest;
}

// 애청자(즐겨찾기) 일별 누적을 /fancnt에서 1회 로드. 카드 표시·그래프 공용.
let fancntLoadedDate = null;   // 로드 시점의 KST 날짜 — 자정 넘겨 열어둔 탭에서 팬 수가 하루 낡는 것 방지(날짜 바뀌면 1회 재조회)
async function loadFancnt() {
  const today = kstNow().toISOString().slice(0, 10);
  if (statsState.fancnt && fancntLoadedDate === today) return;
  try {
    const res = await fetch(WORKER_URL + '/fancnt');
    if (res.ok) statsState.fancnt = await res.json();
    else if (!statsState.fancnt) statsState.fancnt = {};   // 재조회 실패는 기존 값 유지({}로 덮지 않음)
  } catch (e) { if (!statsState.fancnt) statsState.fancnt = {}; }
  fancntLoadedDate = today;   // 실패 포함 — 기존처럼 같은 날 재시도 없음(다음 날짜 전환 때 1회 재시도)
}
// 해당 멤버·해당 월의 월말 누적 애청자(그 달 일별 중 가장 늦은 날짜 값). 없으면 null.
function fancntMonthEnd(memberId, year, month1) {
  const days = statsState.fancnt && statsState.fancnt[memberId];
  if (!days) return null;
  const prefix = `${year}-${String(month1).padStart(2, '0')}-`;
  let best = null;
  for (const ymd in days) { if (ymd.indexOf(prefix) === 0 && (!best || ymd > best)) best = ymd; }
  return best ? days[best] : null;
}
// 해당 멤버·해당 연도의 연말 누적(그 해 일별 중 가장 늦은 날짜 값). 없으면 null.
function fancntYearEnd(memberId, year) {
  const days = statsState.fancnt && statsState.fancnt[memberId];
  if (!days) return null;
  const prefix = `${year}-`;
  let best = null;
  for (const ymd in days) { if (ymd.indexOf(prefix) === 0 && (!best || ymd > best)) best = ymd; }
  return best ? days[best] : null;
}
// 그래프 종류(메트릭) 정의. fan은 fancnt에서 별도 산출(special), 나머지는 computeMonthSummary 결과에서.
const GRAPH_METRICS = [
  // ic/icColor = 카드 지표행과 동일한 아이콘·색(모달 제목용). fan은 SVG_ICONS가 아닌 FAN_ICON(조회 시 분기)

];
const FAN_ICON = SVG_ICONS.fan;   // 실물은 SVG_ICONS.fan으로 통합(산포 정리) — 별칭 유지로 호출부 무변경
function fanCellMonth(memberId, year, month1) { const v = fancntMonthEnd(memberId, year, month1); return v != null ? v.toLocaleString() + '명' : '-'; }
function fanCellYear(memberId, year) { const v = fancntYearEnd(memberId, year); return v != null ? v.toLocaleString() + '명' : '-'; }

// 메달 계산 — 월간 전체탭·멤버탭·연간탭 공용(과거 3중 복사 → 단일화). dense rank: 값 같으면 공동, 0은 무메달.
// 표기는 트로피 SVG 3색(명전 순위색 재사용 — 금·은·동). 구 🥇🥈🥉 이모지는 이모지 배제 방침으로 교체(2026-07-13).
// 키 목록만 다름: 월간=daysWithBroadcast(computeMonthSummary 결과), 연간=sessions(computeAnnualSums 결과, 의미는 동일하게 방송 일수).
const MEDAL_ICONS = ['#fbbf24', '#cbd5e1', '#d98e4d'].map(c => `<span class="medal-ico" style="color:${c}">${SVG_ICONS.trophy}</span>`);
const MONTHLY_MEDAL_KEYS = [
  { key: 'daysWithBroadcast', get: s => s.daysWithBroadcast },
  { key: 'totalDurationMs',   get: s => s.totalDurationMs },
  { key: 'postCount',         get: s => s.postCount },
  { key: 'youtubeCount',      get: s => s.youtubeCount },
  { key: 'cafeCount',         get: s => s.cafeCount },
];
const ANNUAL_MEDAL_KEYS = [
  { key: 'sessions',        get: s => s.sessions },
  { key: 'totalDurationMs', get: s => s.totalDurationMs },
  { key: 'postCount',       get: s => s.postCount },
  { key: 'youtubeCount',    get: s => s.youtubeCount },
  { key: 'cafeCount',       get: s => s.cafeCount },
];
function computeMedals(sums, medalKeys) {
  const medals = {};
  MEMBERS.forEach(m => { medals[m.id] = {}; });
  medalKeys.forEach(({ key, get }) => {
    const vals = MEMBERS.map(m => ({ id: m.id, v: get(sums[m.id]) }));
    const sorted = [...new Set(vals.map(x => x.v))].sort((a, b) => b - a);
    let rank = 0;
    sorted.forEach(v => {
      const medal = v > 0 ? (MEDAL_ICONS[rank] || '') : '';
      vals.filter(x => x.v === v).forEach(x => { medals[x.id][key] = medal; });
      if (v > 0) rank++;
    });
  });
  return medals;
}

function computeMonthSummary(memberStats, year, month1, nowMs = Date.now()) {
  const result = {
    daysWithBroadcast: 0, totalDaysInMonth: daysInMonth(year, month1),
    totalDurationMs: 0, postCount: 0, youtubeCount: 0, cafeCount: 0,
    viewerPeak: 0, viewerSum: 0, viewerCount: 0,
    sessionsByDate: {}, postsByDate: {}, youtubeByDate: {}, cafeByDate: {},
  };
  if (!memberStats) return result;
  const monthStart = kstMonthStartMs(year, month1);
  const monthEnd = kstMonthStartMs(year, month1 + 1);
  const ymPrefix = `${year}-${String(month1).padStart(2, '0')}`;   // 걸침 규칙 월 필터용
  const dateSet = new Set();
  for (const s of (memberStats.sessions || [])) {
    const startMs = new Date(s.start).getTime();
    if (isNaN(startMs) || startMs < monthStart || startMs >= monthEnd) continue;
    const dayKeys = sessionDateKeys(s, ymPrefix, nowMs);   // 걸침 규칙: 방송 일수·달력 채움 공용(24h당 +1일)
    if (!dayKeys.length) continue;
    for (const dk of dayKeys) dateSet.add(dk);
    const dateKey = dayKeys[0];                             // 회수 라벨·일별 상세는 시작일 기준 유지
    if (!result.sessionsByDate[dateKey]) result.sessionsByDate[dateKey] = [];
    result.sessionsByDate[dateKey].push(s);
    if (s.end) {
      const endMs = new Date(s.end).getTime();
      if (!isNaN(endMs) && endMs > startMs) result.totalDurationMs += (endMs - startMs);
    }
    if (s.viewer_peak && s.viewer_peak > result.viewerPeak) result.viewerPeak = s.viewer_peak;
    if (s.viewer_sum) result.viewerSum += s.viewer_sum;
    if (s.viewer_count) result.viewerCount += s.viewer_count;
  }
  result.daysWithBroadcast = dateSet.size;
  result.broadcastDateSet = dateSet;   // 달력 채움용(걸친 날 포함) — 회수 라벨은 sessionsByDate(시작일) 기준
  for (const p of (memberStats.posts || [])) {
    const t = new Date(p.time).getTime();
    if (!isNaN(t) && t >= monthStart && t < monthEnd) {
      result.postCount++;
      const dateKey = isoToKstDateKey(p.time);
      if (dateKey) {
        if (!result.postsByDate[dateKey]) result.postsByDate[dateKey] = [];
        result.postsByDate[dateKey].push(p);
      }
    }
  }
  for (const y of (memberStats.youtube || [])) {
    const t = new Date(y.time).getTime();
    if (!isNaN(t) && t >= monthStart && t < monthEnd) {
      result.youtubeCount++;
      const dateKey = isoToKstDateKey(y.time);
      if (dateKey) {
        if (!result.youtubeByDate[dateKey]) result.youtubeByDate[dateKey] = [];
        result.youtubeByDate[dateKey].push(y);
      }
    }
  }
  for (const c of (memberStats.cafe || [])) {
    const t = new Date(c.time).getTime();
    if (!isNaN(t) && t >= monthStart && t < monthEnd) {
      result.cafeCount++;
      const dateKey = isoToKstDateKey(c.time);
      if (dateKey) {
        if (!result.cafeByDate[dateKey]) result.cafeByDate[dateKey] = [];
        result.cafeByDate[dateKey].push(c);
      }
    }
  }
  // seed 데이터 합산 (서비스 시작 전 수동 입력 데이터)
  if (memberStats.seed) {
    result.totalDurationMs    += memberStats.seed.broadcastMs || 0;
    result.daysWithBroadcast  += memberStats.seed.sessions    || 0;
    result.postCount          += memberStats.seed.posts       || 0;
    result.youtubeCount       += memberStats.seed.youtube     || 0;
    result.cafeCount          += memberStats.seed.cafe        || 0;
    if (memberStats.seed.viewerPeak && memberStats.seed.viewerPeak > result.viewerPeak) result.viewerPeak = memberStats.seed.viewerPeak;
    if (memberStats.seed.viewerSum) result.viewerSum += memberStats.seed.viewerSum;
    if (memberStats.seed.viewerCount) result.viewerCount += memberStats.seed.viewerCount;
    if (memberStats.seed.viewerAvg && !memberStats.seed.viewerSum && result.viewerCount === 0) {
      const seedMin = Math.round((memberStats.seed.broadcastMs || 0) / 60000);
      if (seedMin > 0) { result.viewerSum = memberStats.seed.viewerAvg * seedMin; result.viewerCount = seedMin; }
      else { result.viewerSum = memberStats.seed.viewerAvg; result.viewerCount = 1; }
    }
  }
  return result;
}

// 기간 선택줄(‹연도› 스테퍼 + [전체][1월..12월]) — 통합탭(includeAll=true)·멤버 개별탭(false, 전체 없음) 공용.
// 경계: 연도 [STATS_START_YEAR..올해]. 월 버튼은 시작월 미만·미래 월 disabled. 연 이동으로 선택월이 범위를 벗어나면 클램프.
function periodStartMonth(includeAll) { return includeAll ? STATS_ALL_START_MONTH : STATS_START_MONTH; }
function periodSelectorHtml(includeAll) {
  const now = kstNow();
  const { year, month } = statsState.viewMonth;
  const curY = now.getUTCFullYear(), curM = now.getUTCMonth() + 1;
  const maxM = (year === curY) ? curM : 12;
  const minM = (year === STATS_START_YEAR) ? periodStartMonth(includeAll) : 1;

  const chevPrev = `<button class="stats-month-btn" data-ydir="prev" ${year <= STATS_START_YEAR ? 'disabled' : ''}>${SVG_ICONS.chevronLeft}</button>`;
  const chevNext = `<button class="stats-month-btn" data-ydir="next" ${year >= curY ? 'disabled' : ''}>${SVG_ICONS.chevronRight}</button>`;
  const btns = [];
  if (includeAll) btns.push(`<button class="stats-period-btn${isAll ? ' active' : ''}" data-period="all">전체</button>`);
  for (let mo = 1; mo <= 12; mo++) {
    const dis = mo < minM || mo > maxM;
    btns.push(`<button class="stats-period-btn${!isAll && mo === month ? ' active' : ''}" data-period="${mo}" ${dis ? 'disabled' : ''}>${mo}월</button>`);
  }
  if (!includeAll) {
    // 멤버 개별탭: 전폭 스테퍼 줄 + 6열 2행 월 버튼 — 블록 외곽만 달력·요약과 정렬
    return `
    <div class="stats-member-period">
      <div class="stats-detail-month">${chevPrev}<span class="stats-month-text">${year}년</span>${chevNext}</div>
      <div class="stats-period-wrap no-all">${btns.join('')}</div>
    </div>`;
  }
  return `
    <div class="stats-period-bar">
      <div class="stats-detail-month">
        ${chevPrev}
        <span class="stats-month-text">${year}년</span>
        ${chevNext}
      </div>
      <div class="stats-period-wrap">${btns.join('')}</div>
    </div>`;
}
function bindPeriodSelector(body, includeAll) {
  const afterChange = () => {
    statsState.medals = null;   // 기준 기간이 바뀌었으니 메달 재계산(멤버탭 medalsYm 가드와 동일 취지)
    if (statsState.selectedTab !== 'all') statsState.selectedDate = null;
    renderStatsBody();
  };
  body.querySelectorAll('.stats-month-btn[data-ydir]').forEach(btn => {
    btn.addEventListener('click', () => {
      const now = kstNow();
      const y = statsState.viewMonth.year + (btn.dataset.ydir === 'prev' ? -1 : 1);
      if (y < STATS_START_YEAR || y > now.getUTCFullYear()) return;
      statsState.viewMonth.year = y;
      const maxM = (y === now.getUTCFullYear()) ? now.getUTCMonth() + 1 : 12;
      const minM = (y === STATS_START_YEAR) ? periodStartMonth(includeAll) : 1;
      if (statsState.viewMonth.month > maxM) statsState.viewMonth.month = maxM;
      if (statsState.viewMonth.month < minM) statsState.viewMonth.month = minM;
      afterChange();
    });
  });
  body.querySelectorAll('.stats-period-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.period === 'all') {
        statsState.periodAll = true;
      } else {
        statsState.periodAll = false;
        statsState.viewMonth.month = parseInt(btn.dataset.period, 10);
      }
      afterChange();
    });
  });
}

function renderStatsBody() {
  const body = document.getElementById('statsBody');
  if (!body) return;

  if (!statsState.viewMonth) {
    const now = kstNow();
    statsState.viewMonth = { year: now.getUTCFullYear(), month: now.getUTCMonth() + 1 };
  }

  // 전체(연간) 뷰는 renderStatsAnnual이 해당 연도 월들을 자체 로딩하므로 단일월 가드 생략. 월간/멤버만 현재 보는 월을 선로딩.
  if (!(statsState.selectedTab === 'all' && statsState.periodAll)) {
    const ym = currentViewYm();
    if (ym && !statsState.data[ym] && !statsState.loadingMonths.has(ym)) {
      body.innerHTML = '<div class="loading"><div class="spinner"></div><div>통계 불러오는 중...</div></div>';
      loadStatsMonth(ym).then(() => { if (currentPage === 'stats') renderStatsBody(); });
      return;
    }
    if (statsState.loadingMonths.has(ym)) {
      body.innerHTML = '<div class="loading"><div class="spinner"></div><div>통계 불러오는 중...</div></div>';
      return;
    }
  }

  if (statsState.selectedTab === 'all') {
    if (statsState.periodAll) renderStatsAnnual(body); else renderStatsAll(body);
    return;
  }
  renderStatsMember(body, statsState.selectedTab);
}

// 해당 연도의 모든 월 stats 합산 — 통계 연간 탭과 명예의 전당이 공용 (수치·메달 일관성 보장)
function computeAnnualSums(year, nowMs = Date.now()) {
  const annualSums = {};
  MEMBERS.forEach(m => {
    annualSums[m.id] = { sessions: 0, totalDurationMs: 0, postCount: 0, youtubeCount: 0, cafeCount: 0, viewerPeak: 0, viewerSum: 0, viewerCount: 0 };
  });
  for (let mo = 1; mo <= 12; mo++) {
    const ym = `${year}-${String(mo).padStart(2,'0')}`;
    MEMBERS.forEach(m => {
      const ms = statsState.data[ym]?.[m.id];
      if (!ms) return;
      const monthStart = kstMonthStartMs(year, mo);
      const monthEnd = kstMonthStartMs(year, mo + 1);
      // 자동 수집 데이터 — sessions는 '방송 일수'(그 달 방송한 날짜 수, 월간 daysWithBroadcast와 동일 기준·걸침 규칙 공용). 하루 2회 방송도 1일. 월끼리는 날짜가 안 겹치므로(월 프리픽스 필터) 월별 합 = 연간 일수.
      const daySet = new Set();
      (ms.sessions || []).forEach(s => {
        const t = new Date(s.start).getTime();
        if (isNaN(t) || t < monthStart || t >= monthEnd) return;
        for (const dk of sessionDateKeys(s, ym, nowMs)) daySet.add(dk);
      });
      annualSums[m.id].sessions += daySet.size;
      (ms.sessions || []).forEach(s => {
        const t = new Date(s.start).getTime();
        if (isNaN(t) || t < monthStart || t >= monthEnd) return;
        if (s.end) {
          const e = new Date(s.end).getTime();
          if (!isNaN(e) && e > t) annualSums[m.id].totalDurationMs += (e - t);
        }
        if (s.viewer_peak && s.viewer_peak > annualSums[m.id].viewerPeak) annualSums[m.id].viewerPeak = s.viewer_peak;
        if (s.viewer_sum) annualSums[m.id].viewerSum += s.viewer_sum;
        if (s.viewer_count) annualSums[m.id].viewerCount += s.viewer_count;
      });
      annualSums[m.id].postCount    += (ms.posts   || []).filter(p => { const t = new Date(p.time).getTime(); return !isNaN(t) && t >= monthStart && t < monthEnd; }).length;
      annualSums[m.id].youtubeCount += (ms.youtube || []).filter(y => { const t = new Date(y.time).getTime(); return !isNaN(t) && t >= monthStart && t < monthEnd; }).length;
      annualSums[m.id].cafeCount    += (ms.cafe    || []).filter(c => { const t = new Date(c.time).getTime(); return !isNaN(t) && t >= monthStart && t < monthEnd; }).length;
      // seed 데이터 합산
      if (ms.seed) {
        annualSums[m.id].sessions        += ms.seed.sessions    || 0;
        annualSums[m.id].totalDurationMs += ms.seed.broadcastMs || 0;
        annualSums[m.id].postCount       += ms.seed.posts       || 0;
        annualSums[m.id].youtubeCount    += ms.seed.youtube     || 0;
        annualSums[m.id].cafeCount       += ms.seed.cafe        || 0;
        if (ms.seed.viewerPeak && ms.seed.viewerPeak > annualSums[m.id].viewerPeak) annualSums[m.id].viewerPeak = ms.seed.viewerPeak;
        if (ms.seed.viewerSum) annualSums[m.id].viewerSum += ms.seed.viewerSum;
        if (ms.seed.viewerCount) annualSums[m.id].viewerCount += ms.seed.viewerCount;
        if (ms.seed.viewerAvg && !ms.seed.viewerSum) { const seedMin = Math.round((ms.seed.broadcastMs || 0) / 60000); if (seedMin > 0) { annualSums[m.id].viewerSum += ms.seed.viewerAvg * seedMin; annualSums[m.id].viewerCount += seedMin; } else { annualSums[m.id].viewerSum += ms.seed.viewerAvg; annualSums[m.id].viewerCount += 1; } }
      }
    });
  }
  return annualSums;
}

// 연간 통계에 필요한 월(1~현재월) 중 미적재분 목록
function annualMonthsToLoad(year, maxMonth) {
  const out = [];
  for (let mo = 1; mo <= maxMonth; mo++) {
    const ym = `${year}-${String(mo).padStart(2,'0')}`;
    if (!statsState.data[ym] && !statsState.loadingMonths.has(ym)) out.push(ym);
  }
  return out;
}

// ── 그래프 표시 범위 산정 (순수 함수 — verify_graph_range 스위트가 검증) ──
function ymShift(ym, k) {   // 'yyyy-mm'을 k개월 이동(음수 가능)
  const [y, m] = ym.split('-').map(Number);
  const t = y * 12 + (m - 1) + k;
  return `${Math.floor(t / 12)}-${String(((t % 12) + 12) % 12 + 1).padStart(2, '0')}`;
}
function ymDiff(a, b) {   // a - b (개월 수)
  const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number);
  return (ay * 12 + am) - (by * 12 + bm);
}
// 그래프에 표시할 연속 n개월 산정. 연 단위로 자르지 않음(추세 연속성) — 2026-07-06 확정.
// anchor: { center: ym } 선택 달 중심(경계에 닿으면 시프트) | { end: ym } 그 달을 오른쪽 끝으로(왼쪽을 과거 달로 채움 — '전체'용)
// n: 표시 개수(화면 폭에서 산정). 가용(minYm~maxYm) 총 개월이 n 미만이면 전부 반환.
function computeGraphRange(anchor, n, minYm, maxYm) {
  const total = ymDiff(maxYm, minYm) + 1;
  if (n > total) n = total;
  let start = anchor.center
    ? ymShift(anchor.center, -Math.floor((n - 1) / 2))
    : ymShift(anchor.end, -(n - 1));
  if (ymDiff(ymShift(start, n - 1), maxYm) > 0) start = ymShift(maxYm, -(n - 1));   // 우경계 초과 → 좌로 밀기
  if (ymDiff(start, minYm) < 0) start = minYm;                                      // 좌경계 미달 → min으로
  const out = [];
  for (let i = 0; i < n; i++) out.push(ymShift(start, i));
  return out;
}

// 그래프 탭: 멤버 다중 필터 + 종류 단일 필터 → 켠 멤버들의 월별 추이 라인(SVG). 연 단위.
// 월별 추이 라인 차트(SVG). 단일 멤버 라인(멤버 색). x=range의 연속 개월('yyyy-mm' 배열, 해 걸침 가능), y=메트릭값. 값 없는 월은 라인 끊김. (그래프 모달에서 호출)
function drawGraphChart(wrap, memberId, range, metric) {
  if (!wrap) return;
  const id = memberId;
  const m = MEMBER_BY_ID[id];
  if (!m) { wrap.innerHTML = ''; return; }
  const color = m.color;

  const valueOf = (ym) => {
    const [y, mo] = ym.split('-').map(Number);
    if (metric.special) return fancntMonthEnd(id, y, mo);   // 애청자(월말 누적), 없으면 null → 라인 끊김
    const ms = statsState.data[ym] && statsState.data[ym][id];
    if (!ms) return 0;
    return metric.get(computeMonthSummary(ms, y, mo));
  };
  const pts = range.map(ym => valueOf(ym));
  const showVal = (v) => metric.fmt ? metric.fmt(v) : (v.toLocaleString() + (metric.unit || ''));

  // Y축: 데이터 min~max 기준으로 살짝 여유(변화폭 강조). 최소값이 0보다 높게 잡힐 수 있음.
  const vals = pts.filter(v => v != null);
  let minV = vals.length ? Math.min(...vals) : 0;
  let maxV = vals.length ? Math.max(...vals) : 1;
  if (minV === maxV) { minV = Math.max(0, minV - 1); maxV = maxV + 1; }
  const span = maxV - minV;
  const step = niceNum(span / 4);
  let yMin = Math.floor((minV - span * 0.12) / step) * step;
  let yMax = Math.ceil((maxV + span * 0.12) / step) * step;
  if (yMin < 0) yMin = 0;
  if (yMax <= yMin) yMax = yMin + step;

  // 폭 실측(viewBox 1:1) — 표시 개수(n)는 호출부가 같은 폭으로 산정했으므로 라벨은 솎지 않고 전 표시
  const W = wrap.clientWidth || (typeof window !== 'undefined' && window.innerWidth <= 900 ? 380 : 720);
  const narrow = W < 500;
  const H = narrow ? 300 : 380;
  const padL = narrow ? 16 : 32, padR = narrow ? 16 : 32, padT = narrow ? 22 : 30, padB = 36;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const xOf = (i) => range.length <= 1 ? padL + plotW / 2 : padL + (i / (range.length - 1)) * plotW;
  const yOf = (v) => padT + (1 - (v - yMin) / (yMax - yMin)) * plotH;

  // 그리드 가로선만(Y축 숫자는 없음 — 값은 점마다 표기)
  let grid = '';
  for (let v = yMin; v <= yMax + step * 0.001; v += step) {
    const y = yOf(v);
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" class="g-grid"/>`;
  }
  // X라벨: 범위가 해를 걸치면 1월(및 첫 점)에 연도 병기("'27 1월") — 어느 해인지 모호함 방지
  const spansYears = range[0].slice(0, 4) !== range[range.length - 1].slice(0, 4);
  let xlab = '';
  range.forEach((ym, i) => {
    const [y, mo] = ym.split('-').map(Number);
    const withYear = spansYears && (mo === 1 || i === 0);
    xlab += `<text x="${xOf(i).toFixed(1)}" y="${H - padB + 22}" class="g-xlabel">${withYear ? `'${String(y).slice(2)} ` : ''}${mo}월</text>`;
  });

  // 라인 + 각진 마커 + 값 텍스트(멤버색, 상시 표시). 양끝 점은 앵커로 잘림 방지.
  let d = '', started = false, marks = '', vlabels = '';
  pts.forEach((v, i) => {
    if (v == null) { started = false; return; }
    const x = xOf(i), y = yOf(v);
    d += (started ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    started = true;
    marks += `<rect x="${(x - 3).toFixed(1)}" y="${(y - 3).toFixed(1)}" width="6" height="6" fill="${color}"/>`;
    const anchor = i === 0 ? 'start' : (i === range.length - 1 ? 'end' : 'middle');
    vlabels += `<text x="${x.toFixed(1)}" y="${(y - 11).toFixed(1)}" text-anchor="${anchor}" class="g-vlabel" fill="${color}">${showVal(v)}</text>`;
  });
  const line = d ? `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : '';

  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="graph-svg" preserveAspectRatio="xMidYMid meet">${grid}${line}${marks}${vlabels}${xlab}</svg>`;
}

// 카드 지표 행·멤버탭 요약 항목 클릭 → 그 멤버 × 그 지표의 월별 추이 모달. 연 단위로 자르지 않음(2026-07-06 확정):
// 표시 개수 n = 화면 폭에서 산정(점 간격이 값 라벨 최악 폭 이상 — 라벨 솎기 없이 데이터 개수 자체를 줄임).
// 앵커 = 월 선택 상태면 그 달 중심 / '전체'(통합탭 연간 뷰)면 그 연도 마지막 가용 달을 오른쪽 끝으로(부족분은 과거 달로 채움).
// 그래프 좌우 ‹ ›로 한 달씩 이동(가용 경계에서 disabled).
function openStatGraphModal(memberId, metricKey) {
  const m = MEMBER_BY_ID[memberId];
  const metric = GRAPH_METRICS.find(g => g.key === metricKey);
  if (!m || !metric) return;
  const ov = document.getElementById('statGraphOverlay');
  const head = document.getElementById('statGraphHead');
  const body = document.getElementById('statGraphBody');
  if (!ov || !head || !body) return;
  ov.hidden = false;   // clientWidth 측정을 위해 먼저 표시
  syncBodyScrollLock();
  body.innerHTML = `
    <button class="stats-month-btn sg-nav" data-dir="-1" type="button">${SVG_ICONS.chevronLeft}</button>
    <div class="sg-chart"></div>
    <button class="stats-month-btn sg-nav" data-dir="1" type="button">${SVG_ICONS.chevronRight}</button>`;
  const chart = body.querySelector('.sg-chart');

  // 표시 개수: 점 간격(plotW/(n-1))이 슬롯 폭 이상이 되는 최대 n. 슬롯 = 값 라벨 최악 "12,345"(6자)의
  // 근사 폭(폰트×0.6×6: 14px≈50 / 12px≈43) + 최소 간극 8. 폰트 분기는 g-vlabel 미디어쿼리(900px)와 동일 기준.
  const narrow = window.innerWidth <= 900;
  const SLOT = narrow ? 58 : 51;
  const cw = chart.clientWidth || (narrow ? 380 : 720);
  const plotW = cw - (cw < 500 ? 16 : 32) * 2;
  const n = Math.max(3, Math.min(12, Math.floor(plotW / SLOT) + 1));

  const now = kstNow();
  const maxYm = `${now.getUTCFullYear()}-${String(now.getUTCMonth() + 1).padStart(2, '0')}`;
  const minYm = `${STATS_START_YEAR}-${String(STATS_START_MONTH).padStart(2, '0')}`;
  const vm = statsState.viewMonth || { year: now.getUTCFullYear(), month: now.getUTCMonth() + 1 };
  const isAll = statsState.periodAll && statsState.selectedTab === 'all';
  let range = isAll
    ? computeGraphRange({ end: vm.year >= now.getUTCFullYear() ? maxYm : `${vm.year}-12` }, n, minYm, maxYm)
    : computeGraphRange({ center: `${vm.year}-${String(vm.month).padStart(2, '0')}` }, n, minYm, maxYm);

  const iconSvg = metric.key === 'fan' ? FAN_ICON : SVG_ICONS[metric.ic];
  const btns = body.querySelectorAll('.sg-nav');
  const sync = () => {
    // 'yyyy-mm' 사전순 = 시간순이라 문자열 비교로 경계 판정
    btns[0].disabled = range[0] <= minYm;
    btns[1].disabled = range[range.length - 1] >= maxYm;
    head.innerHTML = `<span><span class="sg-dot" style="background:${m.color}"></span><span>${m.name}</span><span>·</span><span class="stats-row-icon" style="color:${metric.icColor}">${iconSvg}</span><span>${metric.label}</span><span>·</span><span>${range[0].replace('-', '.')} ~ ${range[range.length - 1].replace('-', '.')}</span></span><button class="lr-close" type="button" onclick="closeStatGraph()">✕</button>`;
  };
  const draw = () => {
    if (ov.hidden) return;
    sync();
    // special(애청자)=fancnt 전체 1회, 그 외=범위 내 미보유 월만 로드(해 걸침 가능 — annualMonthsToLoad 대신 범위 기반)
    const pending = metric.special
      ? (statsState.fancnt ? [] : [loadFancnt()])
      : range.filter(ym => !statsState.data[ym] && !statsState.loadingMonths.has(ym)).map(ym => loadStatsMonth(ym));
    if (pending.length) {
      chart.innerHTML = '<div class="lr-msg">불러오는 중...</div>';
      const cur = range;
      Promise.all(pending).then(() => { if (!ov.hidden && range === cur) drawGraphChart(chart, memberId, range, metric); });
    } else {
      drawGraphChart(chart, memberId, range, metric);
    }
  };
  btns.forEach(b => b.addEventListener('click', () => {
    const d = Number(b.dataset.dir);
    const s2 = ymShift(range[0], d);
    if (ymDiff(s2, minYm) < 0 || ymDiff(ymShift(s2, range.length - 1), maxYm) > 0) return;
    range = range.map(ym => ymShift(ym, d));
    draw();
  }));
  draw();
}
function closeStatGraph() {
  const ov = document.getElementById('statGraphOverlay');
  if (ov) ov.hidden = true;
  syncBodyScrollLock();
}

// 축 눈금 간격을 보기 좋은 값(1·2·2.5·5·10 ×10ⁿ)으로
function niceNum(v) {
  if (v <= 0) return 1;
  const exp = Math.floor(Math.log10(v));
  const base = Math.pow(10, exp);
  const f = v / base;
  const nice = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
  return nice * base;
}
function renderCalendar(year, month1, sum) {
  const { sessionsByDate={}, postsByDate={}, youtubeByDate={}, cafeByDate={}, broadcastDateSet } = sum;
  const totalDays = daysInMonth(year, month1);
  const firstDow = new Date(year, month1 - 1, 1).getDay();
  const todayKey = isoToKstDateKey(new Date().toISOString());
  const weekdays = ['일','월','화','수','목','금','토'];
  let html = `<div class="calendar"><div class="calendar-grid">`;
  weekdays.forEach((w, i) => {
    html += `<div class="calendar-weekday ${i===0?'sun':i===6?'sat':''}">${w}</div>`;
  });
  for (let i = 0; i < firstDow; i++) html += `<div class="calendar-day outside"></div>`;
  for (let day = 1; day <= totalDays; day++) {
    const dateKey = ymdKey(year, month1, day);
    const sessions = sessionsByDate[dateKey] || [];
    const posts = postsByDate[dateKey] || [];
    const youtubes = youtubeByDate[dateKey] || [];
    const cafes = cafeByDate[dateKey] || [];
    const hasBroadcast = broadcastDateSet ? broadcastDateSet.has(dateKey) : sessions.length > 0;   // 걸친 날도 채움
    const hasPost = posts.length > 0;
    const hasYoutube = youtubes.length > 0;
    const hasCafe = cafes.length > 0;
    const hasActivity = hasBroadcast || hasPost || hasYoutube || hasCafe;
    const classes = ['calendar-day'];
    if (hasBroadcast) classes.push('has-broadcast');
    if (hasActivity) classes.push('has-activity');
    if (dateKey === todayKey) classes.push('today');
    if (statsState.selectedDate === dateKey) classes.push('selected');
    let bottomLine = '';
    if (sessions.length > 0) {                     // 회수 라벨은 그날 '시작'한 방송 수 — 이어진 날은 채움만
      bottomLine = `<span class="calendar-daycount">${sessions.length}회</span>`;
    } else if (!hasBroadcast && (hasPost || hasYoutube || hasCafe)) {
      const dots = [];
      if (hasPost) dots.push('<span class="calendar-day-dot post"></span>');
      if (hasYoutube) dots.push('<span class="calendar-day-dot youtube"></span>');
      if (hasCafe) dots.push('<span class="calendar-day-dot cafe"></span>');
      bottomLine = `<div class="calendar-day-dots">${dots.join('')}</div>`;
    }
    html += `<button class="${classes.join(' ')}" data-date="${dateKey}"><span class="calendar-daynum">${day}</span>${bottomLine}</button>`;
  }
  const trailing = (7 - ((firstDow + totalDays) % 7)) % 7;
  for (let i = 0; i < trailing; i++) html += `<div class="calendar-day outside"></div>`;
  html += `</div></div>`;
  return html;
}

function renderDayDetail(year, month1, sum, memberId) {
  const { sessionsByDate={}, postsByDate={}, youtubeByDate={}, cafeByDate={} } = sum;
  const date = statsState.selectedDate;
  if (!date) return `<div class="day-detail-empty">달력에서 날짜를 선택하면<br>해당 일의 활동 기록을 볼 수 있습니다</div>`;
  const sessions = sessionsByDate[date] || [];
  const posts = postsByDate[date] || [];
  const youtubes = youtubeByDate[date] || [];
  const cafes = cafeByDate[date] || [];
  const totalActivities = sessions.length + posts.length + youtubes.length + cafes.length;
  if (totalActivities === 0) return `<div class="day-detail-title">${date}</div><div class="day-detail-empty">이 날은 활동 기록이 없어요</div>`;
  const summaryParts = [];
  if (sessions.length > 0) summaryParts.push(`방송 ${sessions.length}회`);
  if (posts.length > 0) summaryParts.push(`게시글 ${posts.length}개`);
  if (youtubes.length > 0) summaryParts.push(`유튜브 ${youtubes.length}개`);
  if (cafes.length > 0) summaryParts.push(`카페 ${cafes.length}개`);
  let html = `<div class="day-detail-title">${date} · ${summaryParts.join(' · ')}</div>`;
  const items = [];
  for (const s of sessions) {
    const t = new Date(s.start).getTime();
    if (!isNaN(t)) items.push({ kind: 'session', time: t, data: s });
  }
  for (const p of posts) {
    const t = new Date(p.time).getTime();
    if (!isNaN(t)) items.push({ kind: 'post', time: t, data: p });
  }
  for (const y of youtubes) {
    const t = new Date(y.time).getTime();
    if (!isNaN(t)) items.push({ kind: 'youtube', time: t, data: y });
  }
  for (const c of cafes) {
    const t = new Date(c.time).getTime();
    if (!isNaN(t)) items.push({ kind: 'cafe', time: t, data: c });
  }
  items.sort((a, b) => a.time - b.time);
  for (const item of items) {
    if (item.kind === 'session') {
      const s = item.data;
      const startStr = formatHHMM(s.start);
      const endStr = s.end ? formatHHMM(s.end) : '진행 중';
      let durStr = '';
      if (s.end) {
        const ms = new Date(s.end).getTime() - new Date(s.start).getTime();
        durStr = ` · ${formatDuration(ms)}`;
      }
      const modeBadge = (s.mode && s.mode !== 'normal') ? modeParts(s.mode).map(p => `<span class="day-session-mode ${p}" role="img" aria-label="${MODE_LABEL[p] || ''}">${modeBadgeSvg(p)}</span>`).join('') : '';
      // 세션별 시청자(최고=viewer_peak, 평균=viewer_sum/viewer_count) — 표본 없는 세션(진행 중·감지 공백)은 항목 생략
      const vp = s.viewer_peak > 0 ? `<span class="day-session-viewer"><span class="stats-row-icon" style="color:#FF8C00">${SVG_ICONS.arrowUp}</span>${s.viewer_peak.toLocaleString()}명</span>` : '';
      const va = s.viewer_count > 0 ? `<span class="day-session-viewer"><span class="stats-row-icon" style="color:#FF8C00">${SVG_ICONS.barChart}</span>${Math.round(s.viewer_sum / s.viewer_count).toLocaleString()}명</span>` : '';
      let changesHtml = '';
      if (s.changes && s.changes.length > 0) {
        changesHtml = `<div class="day-session-changes">${s.changes.map(c => {
          let icon, label, valHtml;
          if (c.type === 'title') { icon = SVG_ICONS.pencil; label = '방송 제목'; valHtml = `${escapeHtml(c.before||'')} → ${escapeHtml(c.after||'')}`; }
          else if (c.type === 'category') { icon = SVG_ICONS.tag; label = '카테고리'; valHtml = `${escapeHtml(c.before||'')} → ${escapeHtml(c.after||'')}`; }
          else if (c.type === 'mode_change') { icon = SVG_ICONS.rotate; label = '방송 모드'; valHtml = `${modeLabel(c.before)} → ${modeLabel(c.after)}`; }
          else { icon = '•'; label = c.type; valHtml = `${escapeHtml(c.before||'')} → ${escapeHtml(c.after||'')}`; }
          return `<div class="day-session-change"><span class="day-session-change-time">${formatHHMM(c.time)}</span><span class="day-session-change-icon">${icon}</span><span><b>${label}</b> ${valHtml}</span></div>`;
        }).join('')}</div>`;
      }
      const sessionUrl = s.end
        ? `https://www.sooplive.com/station/${memberId}/vod`
        : `https://play.sooplive.co.kr/${memberId}`;
      const sessionInner = `<div class="day-session-row-head"><span class="day-kind-icon broadcast">${SVG_ICONS.soop}</span><span class="day-session-time"><span class="stats-row-icon" style="color:var(--ev-start)">${SVG_ICONS.clockTime}</span>${startStr} ~ ${endStr}${durStr}</span>${vp}${va}</div><div class="day-session-title">${modeBadge}${escapeHtml(s.title||'')}</div>${changesHtml}`;
      html += memberId
        ? `<a class="day-session" href="${escapeHtml(sessionUrl)}" target="_blank" rel="noopener">${sessionInner}</a>`
        : `<div class="day-session">${sessionInner}</div>`;
    } else if (item.kind === 'post') {
      const p = item.data;
      const inner = `<span class="day-kind-icon post">${SVG_ICONS.board}</span><span class="day-item-time">${formatHHMM(p.time)}</span><span class="day-item-title">${escapeHtml(p.title||'(제목 없음)')}</span>`;
      html += p.url ? `<a class="day-item" href="${escapeHtml(withTextFragment(p.url, p.title))}" target="_blank" rel="noopener">${inner}</a>` : `<div class="day-item">${inner}</div>`;
    } else if (item.kind === 'youtube') {
      const y = item.data;
      const inner = `<span class="day-kind-icon youtube">${SVG_ICONS.youtube}</span><span class="day-item-time">${formatHHMM(y.time)}</span><span class="day-item-title">${escapeHtml(y.title||'(제목 없음)')}</span>`;
      html += y.url ? `<a class="day-item" href="${escapeHtml(y.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="day-item">${inner}</div>`;
    } else if (item.kind === 'cafe') {
      const c = item.data;
      const cafeNameEsc = escapeHtml(c.cafe_name || '');
      const inner = `<span class="day-kind-icon cafe">${SVG_ICONS.coffee}</span><span class="day-item-time">${formatHHMM(c.time)}</span><span class="day-item-title">${cafeNameEsc ? `[${cafeNameEsc}] ` : ''}${escapeHtml(c.title||'(제목 없음)')}</span>`;
      html += c.url ? `<a class="day-item" href="${escapeHtml(c.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="day-item">${inner}</div>`;
    }
  }
  return html;
}

// 시간대별 방송 분포: 세션 [start,end]를 KST 기준 일·3시간밴드 경계로 쪼개 분 단위 누적.
// 자정 넘는 방송은 양일에 나눠 들어가고, 표시 월 밖으로 넘어가는 구간은 잘라낸다(클립). 진행 중 세션은 현재 월에서만 now까지 집계.
function computeTimeOfDayMinutes(sessionsByDate, year, month1, isCurrentMonth) {
  const dim = daysInMonth(year, month1);
  const grid = [];
  for (let i = 0; i < dim; i++) grid.push([0, 0, 0, 0, 0, 0, 0, 0]);
  const nowMs = Date.now();
  const sessions = [];
  for (const arr of Object.values(sessionsByDate || {})) {
    for (const s of arr) sessions.push(s);
  }
  for (const s of sessions) {
    const startMs = new Date(s.start).getTime();
    if (isNaN(startMs)) continue;
    let endMs;
    if (s.end) endMs = new Date(s.end).getTime();
    else if (isCurrentMonth) endMs = nowMs;   // 진행 중 세션은 현재 월에서만 now까지
    else continue;                            // 과거 월의 끝나지 않은 세션(고아)은 제외
    if (isNaN(endMs) || endMs <= startMs) continue;
    let cursor = startMs;
    let guard = 0;
    while (cursor < endMs && guard < 400) {
      guard++;
      const k = new Date(cursor + 9 * 3600 * 1000);   // KST 벽시계 성분
      const yr = k.getUTCFullYear();
      const mo = k.getUTCMonth() + 1;
      const dom = k.getUTCDate();
      const band = Math.floor(k.getUTCHours() / 3);    // 0..7 (3시간 단위, 자정=밴드0 시작과 일치)
      const boundaryKst = Date.UTC(yr, mo - 1, dom, 0, 0, 0) + (band + 1) * 3 * 3600 * 1000;
      const segEnd = Math.min(endMs, boundaryKst - 9 * 3600 * 1000);   // 이 밴드 끝(=다음 경계)까지
      if (yr === year && mo === month1 && dom >= 1 && dom <= dim) {
        grid[dom - 1][band] += (segEnd - cursor) / 60000;
      }
      cursor = segEnd;
    }
  }
  return grid;
}

// 방송 성향(월별): 방송 시간을 KST 시각 기준 3구간(새벽 1~9 / 낮 9~17 / 저녁 17~익일 1)에 분 단위 배분 —
// computeTimeOfDayMinutes와 동일한 세션 클립 규칙(진행 중 세션은 현재 월만 now까지, 과거 월 고아 제외, 타월 분 미산입)을 1시간 경계로 걷는다.
// 우세 구간이 그 달 방송 시간의 과반(50%) 이상이면 그 성향, 미만(동률 포함)이면 무작위형. 방송 0분이면 null(라벨 미표시).
function computeBroadcastTendency(sessionsByDate, year, month1, isCurrentMonth) {
  const buckets = { dawn: 0, day: 0, evening: 0 };
  const nowMs = Date.now();
  for (const arr of Object.values(sessionsByDate || {})) {
    for (const s of arr) {
      const startMs = new Date(s.start).getTime();
      if (isNaN(startMs)) continue;
      let endMs;
      if (s.end) endMs = new Date(s.end).getTime();
      else if (isCurrentMonth) endMs = nowMs;
      else continue;
      if (isNaN(endMs) || endMs <= startMs) continue;
      let cursor = startMs;
      let guard = 0;
      while (cursor < endMs && guard < 999) {
        guard++;
        const k = new Date(cursor + 9 * 3600 * 1000);   // KST 벽시계 성분
        const yr = k.getUTCFullYear(), mo = k.getUTCMonth() + 1, hr = k.getUTCHours();
        const boundaryKst = Date.UTC(yr, mo - 1, k.getUTCDate(), hr + 1, 0, 0);
        const segEnd = Math.min(endMs, boundaryKst - 9 * 3600 * 1000);   // 다음 정시(KST)까지
        if (yr === year && mo === month1) {
          const key = (hr >= 1 && hr < 9) ? 'dawn' : (hr >= 9 && hr < 17) ? 'day' : 'evening';
          buckets[key] += (segEnd - cursor) / 60000;
        }
        cursor = segEnd;
      }
    }
  }
  const total = buckets.dawn + buckets.day + buckets.evening;
  if (total <= 0) return null;
  const top = Object.entries(buckets).sort((a, b) => b[1] - a[1])[0];
  return top[1] / total >= 0.5 ? top[0] : 'random';
}

// 히트맵 렌더: 가로=일(월별, 1fr로 폭은 달력에 맞춤), 세로=3시간 8밴드(경계눈금 00..24), 농도=선형 min(분/180,1).
// 주말만 날짜를 색으로 표기(토 파랑·일 빨강), 간격 없이 연속. 세션이 전혀 없는 달은 '' 반환(숨김).
function renderTimeOfDayHeatmap(year, month1, sum, isCurrentMonth) {
  const grid = computeTimeOfDayMinutes(sum.sessionsByDate, year, month1, isCurrentMonth);
  let hasAny = false;
  for (const day of grid) { for (const v of day) { if (v > 0) { hasAny = true; break; } } if (hasAny) break; }
  if (!hasAny) return '';
  const dim = grid.length;
  const R = 15, H = R * 8;
  const ylab = ['00', '03', '06', '09', '12', '15', '18', '21', '24'];
  let yc = `<div class="toh-yaxis" style="height:${H}px;">`;
  for (let i = 0; i < 9; i++) yc += `<span class="toh-ylabel" style="top:${i * R - 6}px;">${ylab[i]}</span>`;
  yc += `</div>`;
  let cells = `<div class="toh-grid" style="grid-template-columns:repeat(${dim},1fr);grid-auto-rows:${R}px;">`;
  for (let b = 0; b < 8; b++) {
    for (let d = 1; d <= dim; d++) {
      const minutes = grid[d - 1][b];
      const v = Math.min(minutes / 180, 1);
      const bg = v <= 0 ? '#101a2c' : `rgba(97,255,236,${(0.14 + 0.68 * v).toFixed(3)})`;
      const tip = minutes > 0 ? ` title="${month1}/${d} ${ylab[b]}–${ylab[b + 1]}시 · ${Math.round(minutes)}분"` : '';
      cells += `<div${tip} style="background:${bg};"></div>`;
    }
  }
  cells += `</div>`;
  let xa = `<div class="toh-xaxis" style="grid-template-columns:repeat(${dim},1fr);">`;
  for (let d = 1; d <= dim; d++) {
    const g = new Date(year, month1 - 1, d).getDay();
    const c = g === 0 ? '#f87171' : (g === 6 ? '#60a5fa' : '');
    xa += `<div class="toh-xlabel" style="color:${c || 'transparent'};">${c ? d : ''}</div>`;
  }
  xa += `</div>`;
  // 방송 성향 라벨 — 비활성화(2026-07-04, Crenop): 실데이터가 거의 전원 저녁형이라 변별력 없음. 컷오프 재설계 시 재활성 후보라 계산 함수·아이콘·CSS 포함 보존.
  const tendHtml = '';
  /*
  const tendency = computeBroadcastTendency(sum.sessionsByDate, year, month1, isCurrentMonth);
  const TENDENCY = {
    dawn: { icon: SVG_ICONS.moon, label: '새벽형' },
    day: { icon: SVG_ICONS.sun, label: '낮방형' },
    evening: { icon: SVG_ICONS.flame, label: '저녁형' },
    random: { icon: SVG_ICONS.help, label: '무작위형' },
  };
  const tendHtml = tendency ? `<span class="toh-tendency" title="새벽 1~9시 · 낮 9~17시 · 저녁 17~익일 1시 — 방송 시간의 과반을 차지한 구간">${TENDENCY[tendency].icon}${TENDENCY[tendency].label}</span>` : '';
  */
  return `<div class="toh-head"><span class="toh-title">시간대별 방송 분포</span><span class="toh-headright">${tendHtml}<span class="toh-sub">방송시간 기준</span></span></div><div class="toh-body">${yc}<div class="toh-right">${cells}${xa}</div></div>`;
}

// ── 통합 피드 폴러(2026-08-09): 생방송 스냅샷 + 이벤트를 /feed 한 요청으로 ──
// 구 loadLive(/)·loadEvents(/events)가 각자 타이머로 돌며 생기던 탭 간 위상차(한쪽만 갱신된 최대 10초 창,
// 특히 백그라운드 복귀 후 두 타이머가 갈라진 뒤) 제거 — 같은 감지 사이클 데이터가 한 응답으로 오므로
// 생방송·이벤트 탭이 항상 같은 말을 한다. 정전 타이머도 판정 재료 둘이 동시 도착이라 첫 로드 공백이 구조적으로 소멸.
async function loadFeed() {
  let data = null;
  try {
    const res = await fetch(WORKER_URL + '/feed');
    if (!res.ok) throw new Error('no feed');
    data = await res.json();
  } catch (e) {
    // 일시적 폴링 실패: 이미 그려진 화면은 유지. 한 번도 못 그린 탭에만 안내
    const app = document.getElementById('app');
    if (app && !app.querySelector('.grid')) {
      app.innerHTML = '<div class="loading"><div>데이터를 불러올 수 없어요</div></div>';
    }
    if (!allEvents || allEvents.length === 0) {
      const tl = document.getElementById('timeline');
      if (tl) tl.innerHTML = '<div class="timeline-empty">이벤트 데이터를 불러올 수 없어요</div>';
    }
    console.error(e);
    updateHeaderCenter();   // fetch 자체가 죽어도 10초마다 감지 지연 판정이 다시 그려지게(성공 경로에만 있으면 경고가 안 뜸)
    return;
  }
  // ── 생방송 카드(구 loadLive 본문) ──
  const infoMap = {};
  data.members.forEach(m => { infoMap[m.id] = m; });
  const sorted = [...MEMBERS].sort((a, b) => {
    const al = (infoMap[a.id] && infoMap[a.id].live) ? 1 : 0;
    const bl = (infoMap[b.id] && infoMap[b.id].live) ? 1 : 0;
    return bl - al;
  });
  const grid = document.createElement('div');
  grid.className = 'grid';
  let liveCount = 0;
  sorted.forEach(m => {
    const info = infoMap[m.id] || { id: m.id, live: false };
    grid.appendChild(buildCard(m, info));
    if (info.live) liveCount++;
  });
  document.getElementById('app').innerHTML = '';
  document.getElementById('app').appendChild(grid);
  const liveBadge = document.getElementById('navLiveBadge');
  const liveCountEl = document.getElementById('navLiveCount');
  if (liveBadge && liveCountEl) {
    liveCountEl.innerHTML = liveCountSvg(liveCount);
    liveCountEl.setAttribute('aria-label', `방송 중 ${liveCount}명`);
    liveBadge.classList.toggle('on', liveCount > 0);
    liveBadge.classList.toggle('off', liveCount === 0);
  }
  lastLiveUpdate = new Date();
  if (data.last_detect_at) lastServerDetect = new Date(data.last_detect_at);
  // 누가 켜면 정전 타이머 해제 상태도 푼다 — 그 방송이 끝나면 새 정전이라 다시 떠야 한다.
  if (liveCount > 0) blackoutDismissed = false;
  lastLiveCount = liveCount;
  // ── 이벤트(구 loadEvents 본문) ──
  allEvents = data.events || [];
  processNewEventsForNotification(allEvents);
  initFilterUI();
  applyFilter();
  lastEventsUpdate = lastLiveUpdate;   // 같은 응답 = 같은 시각
  refreshUnreadIndicator();
  // ── 공통 마무리: 정전 타이머(카드 렌더 직후 매번 재부착 — #app을 새로 그리므로) + 헤더 갱신 ──
  applyBlackout();
  updateHeaderCenter();
}

async function loadStatsMonth(yyyymm) {
  if (!yyyymm) return;
  if (!isCurrentMonth(yyyymm)) {
    const cached = lsGetMonthCache(yyyymm);
    if (cached) { statsState.data[yyyymm] = cached; return; }
  }
  if (statsState.loadingMonths.has(yyyymm)) return;
  statsState.loadingMonths.add(yyyymm);
  try {
    const res = await fetch(`${WORKER_URL}/stats?month=${yyyymm}`);
    if (!res.ok) throw new Error('stats fetch failed');
    const data = await res.json();
    const monthData = data.stats || {};
    statsState.data[yyyymm] = monthData;
    // 미종료 세션(end 없음)이 하나라도 있으면 캐시 보류 — 자정 걸친 방송이 끝나기 전에 월이 바뀌어 이 달을 받으면
    // '진행 중' 상태로 영구 동결됨(그 사용자 화면에서 방송 시간 누락 + 명전 정전위원회 최대 48h 오염).
    // 서버가 세션을 닫은 뒤의 응답부터 캐시(보류 동안의 재요청 비용은 60s 엣지캐시가 흡수).
    const hasOpenSession = Object.values(monthData).some(ms => (ms.sessions || []).some(s => s.start && !s.end));
    if (!isCurrentMonth(yyyymm) && !hasOpenSession) lsSetMonthCache(yyyymm, monthData);
  } catch (e) {
  } finally {
    statsState.loadingMonths.delete(yyyymm);
  }
}

async function loadStats() {
  try {
    const now = kstNow();
    const cur = `${now.getUTCFullYear()}-${String(now.getUTCMonth() + 1).padStart(2, '0')}`;
    await Promise.all([loadStatsMonth(cur), loadFancnt()]);
    // 무변화 스킵: 현재월 데이터가 직전 렌더 시점과 같으면 재구축 생략(타임라인·배너와 정책 통일 — 무변화 틱마다 텍스트 선택 풀림·DOM 낭비 방지).
    // 미종료 세션이 있으면 분 버킷을 sig에 섞음 — '진행 중' 시간 합계는 렌더 시점 now까지 집계라, 뷰어 표본이 안 잡히는 방송
    // (fetchStationInfo null 지속)이나 전월 시작 자정 걸친 방송(표본이 전월 키에 기록돼 당월 무변)에서 표시가 동결되는 것 방지.
    // 즉 생방송 중엔 기존처럼 매 틱 렌더, 전원 오프라인일 때만 스킵. sig는 stats 탭에 있을 때만 갱신 —
    // 탭 밖에서의 변화를 재진입 후 첫 틱이 감지해 렌더(switchPage는 stats 재진입 시 렌더하지 않고 DOM 유지에 의존).
    if (currentPage === 'stats') {
      const hasOpen = Object.values(statsState.data[cur] || {}).some(ms => (ms.sessions || []).some(s => s.start && !s.end));
      const sig = JSON.stringify(statsState.data[cur] || null) + '|' + fancntLoadedDate + (hasOpen ? '|' + Math.floor(Date.now() / 60000) : '');   // fancntLoadedDate: 자정 fancnt 재조회가 sig를 1회 바꿔 애청자 셀·그래프에 반영되게(월 데이터만 보면 fancnt 갱신이 화면에 안 실림)
      if (sig !== lastStatsSig) renderStatsBody();
      lastStatsSig = sig;
    }
    lastStatsUpdate = new Date();
    updateHeaderCenter();
  } catch (e) {
    if (currentPage === 'stats') {
      const body = document.getElementById('statsBody');
      if (body) body.innerHTML = '<div class="loading"><div>통계 데이터를 불러올 수 없어요</div></div>';
    }
  }
}

// ── 정전 타이머 (2026-08-07) ─────────────────────────────────────────────────
// 전원 오프라인이면 카드 묶음을 흐리고 마지막 방송 종료 이후 경과 시간을 얹는다.
// [기준 시각] 이벤트 목록의 가장 최근 '방송 종료'. 이미 화면이 들고 있는 데이터라 추가 조회가 없다.
//   이벤트가 아직 안 왔거나(첫 로드) 목록에 종료가 하나도 없으면 아무것도 안 띄운다 — 카드는 평소대로.
//   목록은 최근 1000건이라 전원이 며칠씩 안 켜면 종료 기록이 밀려날 수 있는데, 그때는 조용히 안 뜬다.
// [해제] 아무 데나 한 번 클릭하면 사라지고 그 뒤로는 평소 동작. 생방송 탭에 다시 들어오면 되살아나고,
//   누군가 켰다 다시 전원이 꺼져도 되살아난다(그때는 새로운 정전이므로).
function lastEndTime() {
  let best = null;
  for (const e of allEvents) {
    if (e.type !== 'end') continue;
    const t = new Date(e.time).getTime();
    if (!isNaN(t) && (best === null || t > best)) best = t;
  }
  return best;
}
// 24시간을 넘기면 '1일 3시간 4분 5초', 그 아래는 '3시간 4분 5초'
function formatBlackout(ms) {
  let sec = Math.floor(Math.max(0, ms) / 1000);
  const d = Math.floor(sec / 86400); sec -= d * 86400;
  const h = Math.floor(sec / 3600);  sec -= h * 3600;
  const m = Math.floor(sec / 60);    sec -= m * 60;
  return (d > 0 ? `${d}일 ` : '') + `${h}시간 ${m}분 ${sec}초`;
}
function tickBlackout() {
  const el = document.getElementById('blackoutTime');
  if (!el) return;
  const t = lastEndTime();
  if (t !== null) el.textContent = formatBlackout(Date.now() - t);
}
// 현재 상태에 맞춰 오버레이를 붙이거나 뗀다. loadFeed 렌더 직후와 생방송 탭 진입 때 호출.
function applyBlackout() {
  const app = document.getElementById('app');
  const grid = app && app.querySelector('.grid');
  if (!grid) return;
  const existing = document.getElementById('blackoutOverlay');
  const t = lastEndTime();
  if (!(lastLiveCount === 0 && t !== null && !blackoutDismissed)) {
    if (existing) existing.remove();
    grid.classList.remove('blackout');
    return;
  }
  grid.classList.add('blackout');
  if (existing) { tickBlackout(); return; }   // 이미 떠 있으면 숫자만 갱신
  const ov = document.createElement('div');
  ov.className = 'blackout-overlay';
  ov.id = 'blackoutOverlay';
  ov.innerHTML = `<div class="blackout-msg">천타버스 정전된지<span class="blackout-time" id="blackoutTime">${formatBlackout(Date.now() - t)}</span></div>`;
  ov.addEventListener('click', () => {
    blackoutDismissed = true;
    ov.remove();
    grid.classList.remove('blackout');
  });
  app.appendChild(ov);
}

  }
  function multiIconLinkCell(items, tdClass) {
    if (!items || items.length === 0) return emptyCell;

      const icon = ICON_FOR[it.kind] || '';
      const color = COLORS[it.kind] || 'var(--text)';

  }
  function inferKindFromLabel(label) {
    if (label === '인스타그램') return 'instagram';
    if (label === 'X') return 'x';
    if (label === '디스코드') return 'discord';
    if (label === '팬심') return 'fancim';
    if (label === '일정표') return 'calendar';
    if (label === '캘린더') return 'calendar';
    if (label === '노래책') return 'music';
    if (label === '팬사이트') return 'site';
    return 'site';
  }
  // 모바일 멤버블록용: 한 멤버의 링크 버튼을 {main: 일반, ogq: OGQ}로 분리 반환(OGQ는 모양이 달라 별도 행). 표 행 빌더(rowBangsong~rowOgq)와 동일 소스·순서·라벨 규칙(둘 중 하나만 바꾸면 데스크톱/모바일이 어긋나니 함께 유지).
  function memberLinkButtons(m) {

    const asUrl = (v) => typeof v === 'string' ? v : v?.url;
    const asLabel = (v, def) => typeof v === 'string' ? def : (v.label || def);
    const out = [];
    const add = (kind, label, url) => {
      if (!url) return;
      const icon = ICON_FOR[kind] || '';
      const color = COLORS[kind] || 'var(--text)';

    });
    return { main: out.join(''), ogq: ogq.join('') };
  }
  const rowBangsong = MEMBERS.map(m => {
    const url = MEMBER_LINKS[m.id]?.common?.['방송국'];
    return iconLinkCell('soop', '방송국', typeof url === 'string' ? url : url?.url);
  }).join('');
  const rowYoutube = MEMBERS.map(m => {
    const links = MEMBER_LINKS[m.id];
    if (!links || !links.common) return emptyCell;

  }).join('');
  const rowEtc = MEMBERS.map(m => {
    const items = (MEMBER_LINKS[m.id]?.etc || []).map(it => ({ kind: inferKindFromLabel(it.label), label: it.label, url: it.url }));

  const rowOgq = MEMBERS.map(m => {
    const ogq = MEMBER_LINKS[m.id]?.ogq || [];

    const btns = ogq.map(o => {

    }).join('');
    return `<td><div class="links-cell">${btns}</div></td>`;
  }).join('');
  const mobileBlocks = MEMBERS.map(m => {
    const lb = memberLinkButtons(m);
    return `

      <div class="links-m-head">
        <img class="links-m-avatar" src="${m.img}" alt="${escapeHtml(m.name)}">
        <span class="links-m-name" style="color: ${m.color}">${escapeHtml(m.name)}</span>
      </div>
      <div class="links-m-btns">${lb.main}</div>
      ${lb.ogq ? `<div class="links-m-ogq">${lb.ogq}</div>` : ''}

  }).join('');
  body.innerHTML = `
    <div class="links-section">
      <div class="links-table-wrap">
        <table class="links-table">
          <thead><tr>${memberHeader}</tr></thead>
          <tbody>

}

// ── 폴링 제어: 숨김 탭에서 도달 경로 없는 요청 정지 ──
// 숨김 중 사용자에게 실제로 닿는 건 탭 제목의 미읽음 수와 브라우저 알림뿐이고, 둘 다 loadFeed(이벤트분)에서만 나온다.
// 통계·케미는 숨김 중 표시 경로가 없으므로 알림 여부와 무관하게 멈춘다.
//   보임 → 3개 전부 / 숨김+알림ON → loadFeed만 / 숨김+알림OFF → 전부 정지
// 숨김 중 주기는 10초 그대로 둔다 — 브라우저가 백그라운드 타이머를 이미 분당 1회로 조이므로 별도 완화는 중복이다.
const POLLERS = [
  { fn: loadFeed,      ms: 10 * 1000, bg: true  },   // bg: 알림 ON이면 숨김 중에도 유지(알림·미읽음 배지의 유일한 공급원 — 구 loadEvents). 스냅샷은 같은 응답에 동승이라 추가 요청 없음
  { fn: loadStats,     ms: 60 * 1000, bg: false },
  { fn: loadChemistry, ms: 60 * 1000, bg: false },
];
const pollTimers = new Map();

// runNow: 정지돼 있던 폴러만 재가동 직전에 1회 즉시 실행 — 없으면 복귀 직후 최대 한 주기만큼 낡은 화면을 본다.
function applyPollingState(runNow) {
  const hidden = document.visibilityState === 'hidden';
  for (const p of POLLERS) {
    const want = !hidden || (p.bg && notifyEnabled);
    const running = pollTimers.has(p.fn);
    if (want && !running) {
      if (runNow) p.fn();
      pollTimers.set(p.fn, setInterval(p.fn, p.ms));
    } else if (!want && running) {
      clearInterval(pollTimers.get(p.fn));
      pollTimers.delete(p.fn);
    }
  }
}
applyPollingState(false);   // 부트 직후 — 위에서 4개를 이미 1회씩 호출했으므로 즉시 재실행 불필요

// ── 텍스트 잉크 세로중심 실측(캔버스 픽셀 스캔) — calibrateBadgeValign()의 제목 잉크 계측용 ──
// (구 모드 배지 내부 보정(--badge-vnudge)은 2026-07-13 SVG 전환으로 소멸 — 지금은 줄 정렬 축만 이 함수를 씀)
// 잉크 위치는 measureText(아웃라인 메트릭)를 쓰지 않고 캔버스에 실제로 그려 픽셀을 스캔 —
// Windows에서 actualBoundingBox가 래스터라이즈 결과와 ~0.8px 어긋나는 것이 실측됨(vnudge 0.50px 주입 상태에서 잔차 -0.79px 역산).
// 반환: 베이스라인 대비 잉크 세로중심(CSS px, +=베이스라인 아래). 실패 시 null.
function scanInkCenter(fontDecl, text, fontPx) {
  const SCALE = 8;   // 스캔 정밀도 ≈ 1/8 px
  const cv = document.createElement('canvas');
  const w = Math.min(4000, Math.ceil((fontPx * text.length * 1.3 + 20) * SCALE));
  const h = Math.ceil(fontPx * 3 * SCALE);
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.scale(SCALE, SCALE);
  ctx.font = fontDecl;
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#fff';
  const baselineY = fontPx * 1.5;
  ctx.fillText(text, 5, baselineY);
  const data = ctx.getImageData(0, 0, w, h).data;
  let top = -1, bot = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (data[(y * w + x) * 4 + 3] > 16) { if (top < 0) top = y; bot = y; break; }
    }
  }
  if (top < 0) return null;
  return (top + bot + 1) / 2 / SCALE - baselineY;
}
// ── 모드 배지 줄 정렬 실측 ──
// 배지 자체는 SVG(박스 19px 고정·내부는 기하 중앙)라 내부 보정 축은 소멸(2026-07-13 SVG 전환 — 구 --badge-vnudge·measureLineInkOffset 제거).
// 남은 축은 "배지 박스 중심을 이웃 제목 텍스트의 잉크 중심에 맞추는 vertical-align" 하나:
// 배지(inline-block, 자식 svg는 block → 인라인 라인박스 없음)는 하단 모서리가 베이스라인 → v만큼 올리면 박스 중심 = 베이스라인 위 (v + 9.5).
// 제목 잉크 중심(베이스라인 위) = -scanInkCenter(캔버스 y-down 부호 반전). ∴ v = -ink - 9.5.
// 한계(정직 고지): 제목은 여전히 폰트 텍스트라 캔버스-화면 래스터 갭 ±0.5px가 남음 — 제목까지 SVG화하지 않는 한 물리적 바닥.
function calibrateBadgeValign() {
  try {
    const fam = getComputedStyle(document.body).fontFamily;
    const evtInk = scanInkCenter(`400 12px ${fam}`, '방송제목가힣19+', 12);   // .event-detail 문맥(400·12px) — CSS 변경 시 함께 갱신
    const dayInk = scanInkCenter(`600 13px ${fam}`, '방송제목가힣19+', 13);   // .day-session-title 문맥(600·13px)
    if (evtInk !== null) document.documentElement.style.setProperty('--tag-valign', Math.max(-12, Math.min(0, -evtInk - 9.5)).toFixed(2) + 'px');
    if (dayInk !== null) document.documentElement.style.setProperty('--daytag-valign', Math.max(-12, Math.min(0, -dayInk - 9.5)).toFixed(2) + 'px');
  } catch (e) { /* 계측 실패 시 CSS 폴백(정적 근사) 유지 */ }
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(calibrateBadgeValign);   // 웹폰트 적용 후 계측(폴백 폰트 오계측 방지)

function parseCSV(text) {
  // 문자 스트림 파서 — 따옴표 셀 안의 줄바꿈(시트 셀 내 Alt+Enter)을 셀 내용으로 처리.
  // (구현 주의: 줄 단위로 먼저 쪼개는 방식은 그런 셀에서 행이 두 동강 나 조용히 소실됐음)
  const rows = [];
  let row = [];
  let current = '';
  let inQuotes = false;
  const endRow = () => {
    row.push(current.trim());
    current = '';
    if (!(row.length === 1 && row[0] === '')) rows.push(row);   // 빈 줄 스킵 (기존 line.trim() 스킵과 동치)
    row = [];
  };
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"' && text[i+1] === '"') { current += '"'; i++; }
      else if (ch === '"') inQuotes = false;
      else current += ch;
    } else {
      if (ch === '"' && current === '') inQuotes = true;   // 여는 따옴표는 셀 시작에서만 — 셀 중간의 낱개 따옴표(비표준 인코딩)는 리터럴로 통과시켜 행 파괴 방지
      else if (ch === ',') { row.push(current.trim()); current = ''; }
      else if (ch === '\n') endRow();
      else current += ch;
    }
  }
  if (row.length > 0 || current !== '') endRow();
  return rows;
}

function parseBannerDate(url) {
  const match = url.match(/(\d{6})(?:-\d+)?\.webp/);
  if (!match) return null;
  const s = match[1];
  const yy = parseInt(s.substring(0, 2));
  const mm = s.substring(2, 4);
  const dd = s.substring(4, 6);
  // sort key: full match including suffix for stable ordering (컨텐츠와 동일 — 같은 날짜 YYMMDD-N 중복 대비)
  const fullMatch = url.match(/(\d{6}(?:-\d+)?)\.webp/);
  return { sort: fullMatch ? fullMatch[1] : s, display: koDate(2000 + yy, parseInt(mm), parseInt(dd)) };
}

function membersRowStyle(count) {

  return '';
