    .topbar { flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 10px; }
    .topbar-logo { flex: 1 1 0; justify-content: center; padding: 0; }
    .topbar-right { order: 3; width: 100%; flex: 0 0 auto; justify-content: center; padding: 0; }
    .topbar-right .header-center { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 10px; text-align: center; }
    .main-header { display: none; }   /* 보조바 폐지 — 내용물은 기둥의 우측 칸으로 내려간다 */

    .sidebar {
      position: fixed; top: var(--strip-h, 44px); left: 0; bottom: 0;
      width: max-content; min-width: 244px; max-width: 300px;   /* 필요한 만큼만 — 본문 폭 고정은 아래 .main이 맡는다 */
      display: grid; grid-template-columns: 1fr; align-content: start; row-gap: 2px;
      padding: 2px 0;
      background: var(--surface); border-right: 1px solid var(--border); border-bottom: none;
      overflow-y: auto; overscroll-behavior: contain;   /* contain 없으면 끝까지 민 뒤 뒤 본문이 따라 움직인다 */
      z-index: 40;
    }
    /* 2열: 좌 = 탭 목록 / 우 = 부속(보조바 가운데 묶음이 통째로 내려온 것).
       두 열이 같은 행 높이(--nav-row-h)를 써야 부속이 자기 탭과 같은 줄에 선다. */
    /* 탭 목록과 부속을 같은 칸에 겹친다(2026-09-02) — '사이드바 | 보조바' 두 칸의 경계를 없앤다.
       두 컨테이너를 display:contents로 풀어 자식들이 곧바로 사이드바 격자의 칸이 되고, 탭과 그 부속에
       같은 행을 지정한다. 배지가 라벨을 덮는 것과 같은 문법이고, 부속은 행의 오른쪽 끝에 선다. */
    .nav-list, .subbar-mid { display: contents; }
    #drawerClose { grid-row: 1; justify-self: start; }
    /* 가이드 줄(2026-09-04): 맨 아래 묶음의 마지막 줄 — 왼쪽 묶음(시트 왼쪽 버튼)은 왼쪽 정렬, 가이드는 오른쪽 끝. 줄 폭 전체를 쓴다(묶음의 justify-items: end를 이 줄만 stretch) */
    /* 가이드 줄 = [왼쪽 열: 일정 → 시트 왼쪽 버튼 세로 쌓기(2026-09-06 Crenop) | 가이드(첫 행 높이에 맞춰 위)]. 왼쪽 열은 오른쪽 묶음의 행 리듬(행 높이·간격 2px)을 그대로 쓴다 */
    .subbar-guide-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; width: 100%; justify-self: stretch; min-width: 0; }
    /* padding-left 19 = 탭의 아이콘 시작선(왼쪽 테두리 3 + 패딩 16). 종전 16은 테두리를 빠뜨려 3px 어긋났다(2026-09-06 실측).
       .subbar-right의 justify-content: stretch(위) 없이는 PC 규칙(flex-end)이 격자 열을 내용 폭으로 줄여 이 열이 왼쪽 끝에서 떨어져 섰다. */
    .subbar-guide-row .subbar-lead { flex: 1 1 0; display: grid; grid-auto-rows: var(--nav-row-h); row-gap: 2px; align-items: center; justify-items: start; justify-content: start; padding-left: 19px; overflow: hidden; }   /* justify-content: start — 아래 공통 규칙(.subbar-lead flex-end)이 격자 열을 오른쪽으로 보내지 않게 */   /* 탭의 아이콘 시작선(왼쪽 패딩 16)과 맞춘다 */
    .subbar-guide-row .subbar-lead > * { max-width: 100%; }
    .subbar-guide-slot { height: var(--nav-row-h); display: flex; align-items: center; flex: none; }   /* 가이드 버튼은 자연 크기 그대로, 첫 행(일정) 높이의 칸 가운데에(2026-09-06 Crenop: 버튼만 커 보였다) */
    /* 배지·점의 기준을 라벨로 되돌린다 — 상단바에서는 칸 우상단이 맞지만, 세로 목록에서는 행 오른쪽 끝에
       붙어 라벨에서 한참 떨어졌다(2026-09-02 실사고). 좋아요 점도 같은 기준으로 옮긴다. */
    .nav-lbl { position: relative; }
    /* 배포본(2026-08-31a)과 같은 자리 — 라벨 우상단에 얹혀 글자를 상당 부분 덮는다.
       자릿수가 늘면 왼쪽(글자 쪽)으로 자라므로 벨을 밀어낼 일이 없다(Crenop 확인). */
    .nav-badge { top: -6px; right: -10px; left: auto; margin-left: 0; }
    .nav-item.has-new::after { top: 50%; right: auto; left: 100%; margin: -4px 0 0 6px; }
    .nav-item[data-page="members"],    .tab-aux[data-for="members"]    { grid-row: 2; }
    .nav-item[data-page="live"],       .tab-aux[data-for="live"]       { grid-row: 3; }
    .nav-item[data-page="events"],     .tab-aux[data-for="events"]     { grid-row: 4; }
    .nav-item[data-page="stats"],      .tab-aux[data-for="stats"]      { grid-row: 5; }
    .nav-item[data-page="chemistry"],  .tab-aux[data-for="chemistry"]  { grid-row: 6; }
    .nav-item[data-page="hall"],       .tab-aux[data-for="hall"]       { grid-row: 7; }
    .nav-item[data-page="thumbs"],     .tab-aux[data-for="thumbs"]     { grid-row: 8; }
    .nav-item[data-page="content"],    .tab-aux[data-for="content"]    { grid-row: 9; }
    .nav-item[data-page="banner"],     .tab-aux[data-for="banner"]     { grid-row: 10; }
    .nav-item[data-page="disco"],      .tab-aux[data-for="disco"]      { grid-row: 11; }
    .nav-item[data-page="apply"],      .tab-aux[data-for="apply"]      { grid-row: 12; }
    .nav-item[data-page="links"],      .tab-aux[data-for="links"]      { grid-row: 13; }
    .nav-item, .tab-aux, #drawerClose, .subbar-lead { grid-column: 1; }
    /* 부속(PC 보조바에 있던 것 전부: 시트 버튼·기념일·생방송 수·알림 종·일정·가이드)은 행 오른쪽 끝에 선다(2026-09-03 세션 70 Crenop 지정).
       09-02에 "라벨 바로 뒤"로 두며 행마다 손으로 넣던 왼쪽 여백 11개(고정값·실측 아님)는 폐지 — 탭 이름이 바뀌어도 손댈 것이 없다.
       그때 오른쪽 끝을 철회한 사유(라벨과 너무 벌어짐)는 서랍이 244px로 쥐어짜였을 때였고, 지금은 우측 서랍과 같은 폭이라 빈자리가 구조로 읽힌다.
       PC 탭에 붙어 있던 것(안읽음 배지)은 그대로 라벨에 남는다. 오른쪽 여백 = 탭 왼쪽 패딩(16px)과 대칭(--aux-right-gap). */
    /* 칸 자체는 클릭을 통과시킨다 — 행 위에 겹쳐 있어 라벨 쪽 클릭을 가로채고 있었다(2026-09-02 실사고).
       실제 부속(벨·기념일·일정)만 클릭을 받는다. */
    .sidebar { --aux-right-gap: 16px; }
    .tab-aux { justify-self: end; padding-right: var(--aux-right-gap); position: relative; z-index: 1; pointer-events: none; }
    /* 누를 것만 클릭을 받는다 — 생방송 카운터·일정 줄은 표시라 눌릴 이유가 없고,
       칸이 클릭을 먹으면 그 자리에서 탭 자체가 안 눌린다(2026-09-02). */
    .tab-aux .nav-notify-bell, .tab-aux .celebration-box, .tab-aux #guideLink { pointer-events: auto; }   /* 일정 줄(#schBtn)은 2026-09-06부터 왼쪽 묶음에 있어 여기 안 든다 */
    .subbar-lead, .tab-aux { flex: none; justify-content: flex-end; }
    /* 보조바 오른쪽 묶음(시트 오른쪽 버튼·최애·가이드)은 탭 목록 아래 마지막 줄 — 어느 탭에도 속하지 않는 것들이라 관련 링크 행에서 뗐다(세션 70).
       PC 띠의 '오른쪽 끝'이 세로 목록에선 '끝'이다. 탭과 조금 띄워(6px) 다른 종류의 줄임을 보인다 */
    .subbar-right { grid-row: 14; grid-column: 1; justify-self: stretch; align-self: start; display: grid; justify-content: stretch; grid-auto-rows: minmax(var(--nav-row-h), auto); row-gap: 2px; justify-items: end; align-items: center; margin-top: 2px; padding: 0 var(--aux-right-gap) 0 0; max-width: 100%; overflow: visible; }   /* 세로 쌓기(Crenop): 위→아래 = 시트 오른쪽 버튼·최애·가이드(가이드가 맨 아래). 줄 높이·간격은 탭 줄과 같게 이어 붙인다(2026-09-04) */
    .tab-aux { height: var(--nav-row-h); }
    /* 일정 줄은 흐름 안으로 되돌린다 — 가로 보조바에서 '양옆 빈 탭 자리를 빌리는' 절대배치가
       세로 목록에도 남아 있어 줄이 칸 밖으로 나가 사이드 목록을 넘쳤다(반복 지적된 자리). */
    .tab-aux[data-for="members"] { overflow: hidden; position: static; }
    /* 세로 배치에서는 흐름 안에서 왼쪽부터 오른쪽으로 나열된다 */
    .tab-aux[data-for="members"] .celeb-wrap { position: static; transform: none; }
    /* 세로 배치는 제목 없이 D-day만(2026-09-02 Crenop 지정). 두 줄 예외는 함께 철회한다 —
       세로에서 일정 제목을 주지 않던 종전 규칙으로 돌아가는 것이고, 두 줄이 필요했던 이유(제목이 길다)도 같이 사라진다.
       일정 줄은 서랍 맨 아래 가이드 줄의 왼쪽 묶음에 선다(2026-09-06 — 종전 달력 탭 행). */
    .subbar-lead .sch-line { max-width: 100%; }
    .subbar-lead .sch-line-txt,
    .subbar-lead .sch-line-when { display: none; }
    .subbar-lead .sch-line-mb { display: inline; }
    .page-title-link, .celebration-box { padding: 4px 10px; }
    /* 아이콘 -1px 되감기(선언부)는 여기서도 그대로 둔다(2026-09-03 세션 70, Crenop 실사고: 세로 배치에서만 글자와 아이콘의 위아래가 어긋남).
       -1px은 패딩 비대칭 보정이 아니라 아이콘 그림이 16px 상자 아래쪽에 치우친 것(잉크 위 1.3/아래 0.7)을 되감는 값이라 배치와 무관하게 필요하다.
       종전 '여기는 패딩이 대칭이라 보정할 것이 없다'는 6/4 패딩 시절(-2px)의 사유였고, PC가 5/5 + -1px로 바뀐 뒤엔 되레 이 리셋이 어긋남을 만들었다. */
    /* 기념일만 짧은 요약('이름 종류')으로 — PC 문구는 길어 세로형 행 폭을 넘긴다(2026-09-01) */
    .celebration-box .tb-t-pc { display: none; }
    /* 종전 2px 8px('행 높이를 넘지 않게')는 행이 40px가 되기 전 값 — 4px 10px 25px 상자도 행 안에 넉넉히 든다. 다른 버튼(알림 종·일정·최애·가이드)과 같은 높이로(2026-09-06 Crenop: 혼자 작았다) */
    .tab-aux .celebration-box { padding: 4px 10px; font-size: 11px; }
    .celebration-box .tb-t-mb { display: inline; }
    #guideLink .tb-t-pc { display: none; }   /* 세로 배치의 가이드는 짧은 글자('가이드') — 아이콘만으론 설명이 모자랐다(2026-09-03 Crenop). 긴 문구는 기둥 폭을 이 버튼이 정하게 만들었다 */
    #guideLink .tb-t-mb { display: inline; }
    .nav-notify-bell { padding: 4px 8px; }   /* 세로 배치의 .page-title-link과 같은 위아래 4px. 종 아이콘의 -1px 되감기도 위와 같은 이유로 그대로 */
    .nav-item {
      flex-direction: row; align-items: center; justify-content: flex-start; gap: 12px;
      padding: 0 8px 0 16px; height: var(--nav-row-h); font-size: 14px; text-align: left; width: 100%;   /* 오른쪽을 좁혀 부속을 바짝 붙인다 */
      border-bottom: none; border-left: 3px solid transparent;
    }
    .nav-item.active { border-bottom-color: transparent; border-left-color: var(--accent); }
    /* 세로 목록에서도 배지는 라벨을 덮는다(2026-09-02 회귀) — 부속을 탭 줄 안으로 들이는 방향과 같다.
       옆에 두면 배지 자릿수가 기둥 폭을 밀어 '1000'일 때 기둥이 통째로 넓어졌다. */

    /* 우측 서랍: PC의 우측 기둥이 그대로 서랍이 된 것. 좌=탭 전환 / 우=탭 내부 조작 대응이 PC와 1:1 */
    .side-pick, .filter-panel, .chem-filter-panel {
      position: fixed; top: var(--strip-h, 44px); right: 0; bottom: 0;
      width: 300px; max-width: 88vw; padding: 16px 12px 16px 16px;   /* 조작부 폭은 버튼 격자가 정한 값 — 좁히면 칸이 뭉개진다(2026-09-01 되돌림) */
      background: var(--surface); border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform 0.22s ease;
      overflow-y: auto; overscroll-behavior: contain;
      z-index: 40;
    }
    body.drawer-r .side-pick, body.drawer-r .filter-panel, body.drawer-r .chem-filter-panel { transform: none; }
    /* 필터·기둥이 서랍으로 빠지는 폭이므로 격자의 280px 칸도 여기서 함께 없앤다 — 탭마다 다른 값을 쓰면
       그 사이 폭에서 그 탭만 본문이 좁아진다(2026-09-02: 최근 활동·케미가 1100px으로 따로 놀던 것을 합침) */
    .members-wrap, .stats-wrap, .hall-wrap, .cal-wrap, .events-wrap, .chem-wrap { grid-template-columns: 1fr; }
    .members-wrap > #membersBody, .stats-wrap > #statsBody, .hall-main, .cal-main, .disco-main { padding-left: 0; }   /* 기둥이 서랍으로 빠지면 왼쪽 44px도 뜻이 없다 */
    .events-wrap > .timeline, .chem-wrap > .chem-content { margin-left: 0; }
    .drawer-btn#drawerBtnR { display: inline-flex; }   /* 고르는 기둥이 서랍이므로 태블릿에서도 필요하다 */
  }

  /* 태블릿: 기둥이 상시 보이고 본문을 밀어낸다(덮지 않는다) */
  @media (min-width: 701px) and (max-width: 1150px) {
    .sidebar { transform: none; transition: transform 0.22s ease; }
    /* 본문이 쓰는 폭을 '더 넓은 서랍' 기준으로 고정한다(2026-09-02) — 좌우 서랍 폭이 다르면 어느 쪽이
       열렸느냐에 따라 본문 폭이 달라져 케미·명전 격자의 열 수가 3↔2로 널뛰었다. 서랍 폭은 각자 두고,
       좁은 쪽이 열렸을 때 그 차액만큼 반대편을 비워 본문 폭을 같게 만든다. */
    .main { margin-left: var(--drawer-w); min-width: 0; transition: margin-left 0.22s ease;
      padding-left: calc((max(var(--drawer-w, 300px), 300px) - var(--drawer-w, 300px)) / 2);
      padding-right: calc((max(var(--drawer-w, 300px), 300px) - var(--drawer-w, 300px)) / 2); }
    /* 좌우 중 하나만 자리를 차지한다(2026-09-01, Crenop 제안). 탭을 고르고 나면 조작부가 더 자주 쓰이므로
       조작부를 열 때 탭 기둥이 물러나 본문 폭을 지킨다. 다시 부르는 길은 좌상단 ☰. */
    .drawer-btn#drawerBtnL { display: inline-flex; }
    /* 기둥을 접어 두는 상태(2026-09-02) — 우측 조작부가 열렸을 때와 같은 자리·같은 모양으로 좌측도 대칭이 된다.
       버튼 모양(☰↔✕)은 JS가 갈아끼운다: 기둥이 보이면 ✕(닫기), 접혀 있으면 ☰(열기). */
    /* 기둥이 접혔는지는 side-off 하나로만 정한다(2026-09-02). 종전엔 drawer-r에도 얹혀 있어서
       조작부를 닫는 순간 기둥이 저절로 돌아왔다 — 닫기가 반대쪽을 여는 셈이었다. */
    body.side-off .sidebar { transform: translateX(-100%); }
    body.side-off .main { margin-left: 0; padding-left: 0; padding-right: 0; }
    body.drawer-r .main { margin-right: 300px; }   /* 조작부도 덮지 않고 밀어낸다 */
    /* 이 폭에서는 좌우가 '자리를 주고받는' 관계다(하나만 상시). 덮는 게 아니라 밀어내므로 가림막을 쓰지 않는다. */
    .drawer-scrim { display: none; }
  }

  /* 모바일: 같은 기둥이 화면 밖으로 나가 ☰로 여는 서랍이 된다 */
  @media (max-width: 700px) {
    /* top: 0 — 서랍이 띠를 덮어야 안의 ✕가 ☰와 같은 자리에 온다. 띠 아래에서 시작하면 두 버튼이 어긋난다(실사고) */
    .sidebar { top: 0; transform: translateX(-100%); transition: transform 0.22s ease; max-width: 90vw; }   /* 모바일은 덮으므로 화면 폭까지 허용 */
    .side-pick, .filter-panel, .chem-filter-panel { top: 0; }
    body.drawer-l .sidebar { transform: none; }
    .drawer-btn#drawerBtnL { display: inline-flex; }
    #drawerClose { display: flex; }   /* 왼쪽(메뉴) 닫기만 — 공용 클래스로 켜면 우측 서랍의 ✕까지 상시 노출된다(우상단 점거 사고) */
    /* ✕가 왼쪽 칸의 첫 행을 차지하므로 부속 칸도 같은 행에서 시작해야 한다(그래서 여기서 행을 덮어쓰지 않는다).
       일정 버튼의 두 줄 격자는 2026-09-02에 폐지 — 세로 배치는 D-day 한 칸뿐이라 행이 어긋날 여지가 없다. */

  }
  /* 통합탭 카드: 지표 행 클릭=그래프 모달 (헤더→멤버 이동은 폐지 — 멤버 상세는 상단 아바타 탭이 유일 동선).
     hover 민트 테두리 = 사이트 공통 '클릭 가능' 문법. 투명 기본 테두리+마진 보정으로 레이아웃 시프트 없음 */
  .stats-card-row-link { cursor:pointer; padding:2px 6px; margin:-3px -7px; border:1px solid transparent; transition: background 0.15s, border-color 0.15s; }
  .stats-card-row-link:hover { background:var(--surface2); border-color:var(--accent); }
  /* 차트(SVG) — 그래프 모달에서 사용 */
  .graph-svg { width:100%; height:auto; display:block; }
  .g-grid { stroke:rgba(255,255,255,0.08); stroke-width:1; }
  .g-xlabel { fill:var(--muted); font-size:12px; text-anchor:middle; }
  .g-vlabel { font-size:12px; font-weight:700; paint-order:stroke; stroke:var(--bg); stroke-width:4px; stroke-linejoin:round; }

  /* evt-type-spacer: 종류 5칸을 [채팅·생방송·빈칸]/[게시글·카페·유튜브]로 나누는 빈칸(방송/글 묶음 — Crenop 의도, 2026-09-03 재확인). 어느 폭에서나 3열이므로 상시 유지 */
  /* 모바일(narrow viewBox 380×300): 차트 월·값 글씨 키움(작은 화면 가독성) */
  @media (max-width:900px){ .g-xlabel { font-size:14px; } .g-vlabel { font-size:14px; } }
  /* 그래프 모달 (좋아요 모달 lr-panel 골격 재사용, 폭·글씨 키움) */
  .graph-modal-panel { max-width:740px; max-height:90vh; }
  .graph-modal-panel .lr-head { color:var(--text); font-size:14px; padding:14px 18px; }
  .graph-modal-panel .lr-head > span:first-child { flex-wrap: wrap; row-gap: 2px; min-width: 0; }   /* 제목(이름·지표·기간)이 좁은 폭에서 ✕를 밀지 않고 줄바꿈되게 */
  .graph-modal-panel .lr-body { padding:22px 20px; }
  .graph-modal-panel .sg-dot { width:11px; height:11px; display:inline-block; }
  /* 그래프 모달 본문: [‹][차트][›] — ‹›는 한 달 이동(기간줄 스테퍼와 동일 버튼 문법) */
  .graph-modal-panel .lr-body { display: flex; align-items: center; gap: 2px; }
  .graph-modal-panel .sg-chart { flex: 1; min-width: 0; }
  .graph-modal-panel .sg-nav { flex-shrink: 0; }
  .graph-modal-panel .sg-nav:disabled { color: var(--border); cursor: not-allowed; }
  /* 차트가 뷰포트 높이를 넘지 않게(세로 스크롤 방지). meet라 비율 유지하며 축소 */
  .graph-modal-panel .graph-svg { max-height: calc(90vh - 100px); }
</style>

// ══ 드로어 (2026-08-31 탐색 UI 맞바꾸기) ═══════════════════════════════════════════
// 1100px 이하에서 탭 목록은 좌측 서랍, 탭 내부 조작(필터)은 우측 서랍이 된다.

// 닫힘 규칙이 좌우로 갈리는 이유: 탭은 하나만 고르면 끝나지만(스트립), 필터는 여러 개를 이어서
// 조작한다. 자동으로 닫는 쪽은 예측이 빗나갔을 때 대가가 크므로 확실한 좌측에만 적용한다.
(function () {
  const body = document.body;
  const btnL = document.getElementById('drawerBtnL');
  const btnR = document.getElementById('drawerBtnR');
  // 기둥 폭이 내용에 따라 달라지므로 본문을 밀어낼 값도 실측해서 넣는다(--strip-h와 같은 방식).
  const sideEl = document.getElementById('sidebar');
  function syncDrawerW() {
    if (!sideEl) return;
    // 세로형(기둥)일 때만 잰다. 상단바 배치에서 재면 가로로 누운 탭 줄의 폭(화면 전체)이 들어가고,
    // 폭을 줄여 세로형으로 돌아오는 순간 그 값이 본문 왼쪽 여백이 되어 본문이 극단적으로 좁아진다(실사고).
    if (window.innerWidth > 1150) { document.documentElement.style.setProperty('--drawer-w', '300px'); return; }
    const w = sideEl.getBoundingClientRect().width;
    if (w > 0) document.documentElement.style.setProperty('--drawer-w', Math.round(w) + 'px');
  }
  // 붙어 있는 머리(띠+보조바) 높이 — 기둥·버튼바가 그 아래에서 멈추도록 실측해 넘긴다.
  // 반올림하지 않는다(2026-09-03 세션 70, Crenop 실사고): 브라우저 배율에 따라 띠 높이가 54.4px처럼 소수가 되는데, 올림된 값에 보조바를
  // 붙이면 그 차이만큼 띠와 보조바 사이가 벌어져 본문이 비친다. 실측값 그대로(소수 2자리) 넘기면 보조바 윗변 = 띠 아랫변.
  // 다시 재는 때: 크기 변화(ResizeObserver — 시트 스트립과 같은 방식)와 웹폰트 적용 뒤(폴백 폰트로 잰 높이가 어긋나던 것 방지).
  function syncHeadH() {
    const tb = document.querySelector('.topbar');
    const mh = document.querySelector('.main-header');
    const th = tb ? tb.getBoundingClientRect().height : 0;
    const mhH = (mh && getComputedStyle(mh).display !== 'none') ? mh.getBoundingClientRect().height : 0;
    document.documentElement.style.setProperty('--topbar-h', th.toFixed(2) + 'px');
    document.documentElement.style.setProperty('--head-h', (th + mhH).toFixed(2) + 'px');
  }
  window.addEventListener('resize', syncHeadH);
  window.addEventListener('resize', () => { if (window.syncLeadGap) syncLeadGap(); });
  setTimeout(syncHeadH, 0);
  setTimeout(syncHeadH, 400);
  if (window.ResizeObserver) { const ro = new ResizeObserver(syncHeadH); ['.topbar', '.main-header'].forEach(sel => { const el = document.querySelector(sel); if (el) ro.observe(el); }); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeadH);
  window.syncHeadH = syncHeadH;
  window.addEventListener('resize', syncDrawerW);
  setTimeout(syncDrawerW, 0);
  window.syncDrawerW = syncDrawerW;
  const scrim = document.getElementById('drawerScrim');

  function setDrawer(side, on) {
    // 여는 것은 명시적 행동이라 반대쪽을 접는다. 닫을 때는 아무것도 되돌리지 않는다(닫기는 닫기만).
    if (side === 'r' && on && innerWidth > 700 && innerWidth <= 1150) body.classList.add('side-off');
    // 지정한 쪽만 건드린다. 종전엔 부를 때마다 양쪽을 다시 칠해서, 조작부 버튼 동기화가 부르는
    // setDrawer('r', false) 한 번에 열려 있던 좌측 서랍까지 닫혔다(모바일에서 스크롤로 주소창이
    // 접힐 때 resize가 나 '아무 것도 안 했는데' 닫히던 실사고 — 2026-09-02).
    body.classList.toggle('drawer-' + side, !!on);
    // 한 번에 하나만 — 양쪽이 동시에 열리면 가림막을 눌러도 무엇이 닫히는지 알 수 없다
    if (on) body.classList.remove(side === 'l' ? 'drawer-r' : 'drawer-l');
    if (btnL) btnL.setAttribute('aria-expanded', String(body.classList.contains('drawer-l')));
    if (btnR) btnR.setAttribute('aria-expanded', String(body.classList.contains('drawer-r')));
    if (window.syncBtnL) window.syncBtnL();
  }
  function closeAll() { setDrawer('l', false); setDrawer('r', false); }
  window.closeDrawers = closeAll;

  // 태블릿(기둥 상시 표시)에서는 좌측 버튼이 '기둥 접기/펴기'다 — 우측 조작부와 같은 대칭을 만든다.
  // 스마트폰에서는 종전대로 서랍 여닫기.
  function tabletPinned() { return innerWidth > 700 && innerWidth <= 1150; }
  function syncBtnL() {
    if (!btnL) return;
    const closed = tabletPinned() ? body.classList.contains('side-off')
                                  : !body.classList.contains('drawer-l');
    // 아이콘 표는 이 블록보다 아래에서 만들어진다(const라 그 전엔 접근 자체가 예외 — 부팅이 통째로 멈춘다).
    // 그래서 여기서는 실패를 삼키고, 표가 준비된 뒤 아이콘 주입 블록이 한 번 더 부른다.
    try { btnL.innerHTML = closed ? SVG_ICONS.menu : SVG_ICONS.close; } catch (e) {}
    btnL.setAttribute('aria-label', closed ? '메뉴 열기' : '메뉴 닫기');
    btnL.setAttribute('aria-expanded', String(!closed));
  }
  window.syncBtnL = syncBtnL;
  if (btnL) btnL.addEventListener('click', () => {
    if (tabletPinned()) {
      // 닫기는 닫기만 한다: 반대쪽을 자동으로 열면 둘 중 하나가 늘 열려 있어
      // '양쪽 다 치우고 본문만 크게 보기'라는 선택지가 사라진다.
      // 펴는 것은 여는 행동이라 그때만 조작부를 닫는다.
      const opening = body.classList.contains('side-off');
      body.classList.toggle('side-off');
      if (opening) setDrawer('r', false);
      syncBtnL();
      return;
    }
    setDrawer('l', !body.classList.contains('drawer-l'));
  });
  if (btnR) btnR.addEventListener('click', () => setDrawer('r', !body.classList.contains('drawer-r')));
  if (scrim) scrim.addEventListener('click', closeAll);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });

  // 탭을 고르면 좌측 서랍은 닫힌다. 벨은 탭 안에 있지만 탭 전환이 아니므로 제외.
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', e => { if (!e.target.closest('.nav-notify-bell')) closeAll(); });   // 탭을 옮기면 양쪽 서랍 다 닫는다
  });

  // 우측 버튼은 필터가 있는 탭에서만. 걸린 개수는 '꺼둔 칸 수' — 서랍에 숨은 필터를 잊는 것을 막는다.
  // 주소를 보고 판단하지 않는다: 탭 전환은 syncHash()가 pushState로 처리하는데 pushState는 hashchange를
  // 발생시키지 않아 버튼이 첫 화면 이후로 갱신되지 않았다(실제 사고). 지금 열려 있는 화면을 직접 본다.
  window.syncDrawerFilterBtn = function () {
    if (!btnR) return;
    const panel = document.querySelector('.page.active .filter-panel, .page.active .chem-filter-panel, .page.active .side-pick');
    // 자리는 늘 차지하고 보이기만 끈다 — display:none으로 빼면 그 폭만큼 로고가 왼쪽으로 밀린다(가운데 어긋남).
    btnR.style.visibility = panel ? '' : 'hidden';
    // 여는 버튼이 없으면 서랍 상태도 반드시 내린다 — 안 그러면 겹쳐 뜨는 ✕만 화면에 남는다(실사고)
    if (!panel) { setDrawer('r', false); return; }
    // 걸러짐 여부만 본다(2026-09-03 Crenop 확정 — 비율 계산 폐지): 화면에 남은 항목 수 < 원래 수. 전부 꺼져 0이어도 같은 '걸러짐'.
    // 각 탭이 그리면서 filterCounts에 남긴 수를 쓴다. 고르는 기둥(.side-pick)만 있는 탭은 기록이 없어 걸러짐 아님.
    const pageId = (document.querySelector('.page.active') || {}).id || '';
    const c = filterCounts[pageId.replace('page-', '')];
    btnR.classList.toggle('filtered', !!(c && c.total && c.shown < c.total));
  };

  //  PC   : [기념일·링크] [탭별 부속 11칸] [가이드]  — 보조바 한 줄
  //  모바일: 드로어 우측 칸에 같은 순서로 세로 배치 — 기념일은 닫기 버튼 행, 가이드는 관련 링크 행.
  // 두 배치의 대응이 1:1이라 한쪽을 고치면 다른 쪽 자리가 자동으로 정해진다.
  let wasMobile = null, wasOverlay = null;
  function syncBarPlacement() {
    // 세 상태: 상단바(>1150) · 도킹 사이드바(701~1150) · 겹쳐 뜨는 서랍(≤700)
    const mobile = innerWidth <= 1150;
    const overlay = innerWidth <= 700;
    // 폭이 넓어져 서랍이 사라졌는데 열림 상태가 남으면 가림막·닫기 버튼만 화면에 떠 있게 된다(실사고)
    if (!overlay && document.body.classList.contains('drawer-l')) setDrawer('l', false);
    if (!mobile && document.body.classList.contains('drawer-r')) setDrawer('r', false);
    if (mobile === wasMobile && overlay === wasOverlay) return;
    wasMobile = mobile; wasOverlay = overlay;
    const bar = document.querySelector('.main-header');
    const mid = document.getElementById('subbarMid');
    const lead = document.getElementById('subbarLead');
    const right = document.getElementById('subbarRight');
    const side = document.getElementById('sidebar');
    if (!bar || !mid || !lead || !right || !side) return;
    if (mobile) {
      side.appendChild(mid);        // 드로어 우측 칸 = 보조바 가운데 묶음 그대로
      // 세로 배치(태블릿·모바일 공통, 2026-09-04 Crenop): 보조바 오른쪽 묶음(시트 오른쪽 버튼·최애·가이드)은 서랍 맨 아래 묶음으로, 왼쪽 묶음(시트 왼쪽 버튼)은
      // 그 묶음의 가이드 줄 왼쪽에 왼쪽 정렬로 선다 — 태블릿 띠·모바일 ✕ 줄에 따로 두던 것을 한 자리로(공간 제약·규칙 단순화).
      const row = guideRow();
      row.appendChild(lead);
      let slot = row.querySelector('.subbar-guide-slot');
      if (!slot) { slot = document.createElement('div'); slot.className = 'subbar-guide-slot'; row.appendChild(slot); }
      slot.appendChild(document.getElementById('guideLink'));   // 첫 행 높이의 칸 안에 자연 크기로(2026-09-06)
      right.appendChild(row);
      side.appendChild(right);
    } else {
      bar.appendChild(mid);
      bar.insertBefore(lead, mid);
      right.appendChild(document.getElementById('guideLink'));   // 가이드는 오른쪽 묶음의 맨 끝으로 복귀
      const row = document.getElementById('subbarGuideRow'); if (row) row.remove();
      bar.appendChild(right);
    }

  // 상단 띠 높이를 실측해 --strip-h에 넣는다 — 기둥이 그 아래에서 시작해야 띠를 덮지도, 뜨지도 않는다.
  // 문구가 줄바꿈되면 높이가 달라지므로 고정값을 쓸 수 없다.
  const stripEl = document.querySelector('.topbar');

    if (!stripEl) return;

  // 다시 본다(묶어서 60ms). 감시 대상은 .main 안쪽이고 버튼은 상단바에 있어 되먹임이 생기지 않는다.
  let syncT;
  // 화면이 바뀌면 서랍 버튼 채움과 함께 아이콘 여백도 다시 맞춘다 — 필터·기둥 버튼은 렌더에서 새로 만들어진다(2026-09-02)
  const kick = () => { clearTimeout(syncT); syncT = setTimeout(() => { syncDrawerFilterBtn(); if (window.fitBtnIcons) fitBtnIcons(); }, 60); };

  if (mainEl && window.MutationObserver) new MutationObserver(kick).observe(mainEl, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
  document.addEventListener('click', e => { if (e.target.closest('.filter-member, .filter-type, .filter-toggle-all')) setTimeout(syncDrawerFilterBtn, 0); });
  syncDrawerFilterBtn();

  // 드래그는 보조 수단이다(표시가 없어 발견되지 않으므로 버튼이 주 경로).
  // 가장자리 20px는 브라우저 뒤로가기 제스처에 양보하고, 가로 이동이 세로의 1.5배를 넘을 때만
  // 서랍으로 판정한다 — 그러지 않으면 세로로 훑다가 서랍이 튀어나온다.
  let sx = 0, sy = 0, track = false;
  // 가로로 미는 목록(프로필·음악 탭의 영상 스트립, 보조바, 관련 링크 표 등) 안에서 시작한 손짓은 그 목록 것이다 —
  // 종전엔 목록을 옆으로 미는 것만으로 서랍이 같이 튀어나왔다(2026-09-04 Crenop 신고).
  // 클래스 이름을 나열하지 않고 '실제로 가로로 넘치면서 스크롤이 켜져 있는가'로 가린다 — 앞으로 생기는 가로 목록도 저절로 포함된다.
  // 넘치지 않는 줄(스크롤이 켜져 있어도 내용이 짧은 보조바 등)은 걸리지 않으므로 그 위에서는 서랍이 종전대로 열린다.
  const inHScroller = el => {
    for (let n = el; n && n !== body && n.nodeType === 1; n = n.parentElement) {
      if (n.scrollWidth - n.clientWidth < 4) continue;   // 1~3px은 반올림 찌꺼기 — 스크롤로 치지 않는다
      const ox = getComputedStyle(n).overflowX;
      if (ox === 'auto' || ox === 'scroll') return true;
    }
    return false;
  };
  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || innerWidth > 700) { track = false; return; }   // 드래그는 서랍이 겹쳐 뜨는 폭에서만
    if (inHScroller(e.target)) { track = false; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    track = sx > 20 && sx < innerWidth - 20;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!track) return;
    track = false;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const openL = body.classList.contains('drawer-l'), openR = body.classList.contains('drawer-r');
    if (dx > 0) { if (openR) setDrawer('r', false); else if (!openL) setDrawer('l', true); }
    // 우측 서랍이 없는 탭(버튼이 visibility:hidden)에서는 열지 않는다 — 종전엔 display만 봐서 가림막과 ✕만 떴다(2026-09-03 실사고)
    else { if (openL) setDrawer('l', false); else if (!openR && btnR && btnR.style.visibility !== 'hidden') setDrawer('r', true); }
  }, { passive: true });
})();

const MODE_LABEL = {
  normal: '일반', adult: '19+',
  subscription: '구독+', copyright: '저작권', password: '비번', restricted: '기타',
};
const MODE_PLACEHOLDER_TEXT = {
  adult: '19금 방송', subscription: '구독플러스 전용 방송',
  copyright: '저작권 방송', password: '비밀번호 방송', restricted: '기타 제한 방송',
};
// mode는 활성 속성 조합 문자열('adult_subscription' 등) — '_'로 분해해 각각 배지로. 단일/normal/레거시 'adult_copyright'도 그대로 분해됨.
function modeParts(mode) {
  return (mode || 'normal').split('_');
}
// 조합 문자열을 사람이 읽는 라벨로(예: 'adult_subscription' → '19+ · 구독+'). mode_change before/after 표시용.
function modeLabel(mode) {
  return modeParts(mode).map(p => MODE_LABEL[p] || p).join(' · ');
}
// 썸네일 없는 제한방송의 안내 텍스트(조합 대응). 예: 'adult_password' → '19금 방송 · 비밀번호 방송'.
function modePlaceholder(mode) {
  if (!mode || mode === 'normal') return '';
  return modeParts(mode).map(p => MODE_PLACEHOLDER_TEXT[p] || MODE_LABEL[p] || p).join(' · ');
}

function findMember(id) { return MEMBERS.find(m => m.id === id); }

// ── 칩 합성 v12(2026-08-29): 숫자는 기존 자산 BADGE_GLYPHS(2026-07-13, 잉크 경계 동봉)로 그린다 ──
// v11에서 fontkit으로 새로 추출했던 SVG_DIGITS는 '이미 있던 자산의 중복'이라 삭제 — 코드 정독 실패의 산물.
// BADGE_GLYPHS는 세로 스냅 문제(폰트 힌팅의 ±1px 착지)를 도형 렌더로 푼 검증된 체계고, nav 배지·라이브
// 카운트·모드 배지가 전부 이걸 쓴다. 칩도 같은 등록부·같은 함수(navDigitsGroup)를 쓴다.
// 구조: 한 SVG(뷰박스 높이 24) 안에 [아이콘 24박스(글리프 좌단 1u 정렬)] + [숫자(잉크 높이 15u, 세로중심 12)].
// 마크업엔 컴팩트용 아이콘 단독본(.cd-ic)을 병기 — 크롭 방식 폐기(Crenop 지정), CSS가 폼별로 하나만 보인다.
const CHIP_ICON_PAD = { soop: [1.1, 0.9], board: [3.1, 3.1], coffee: [0.9, 0.9], youtube: [0, 0], film: [5.0, 3.1] };   // [좌, 우] 글리프 여백(24단위, path 실측)
function chipHtml(cls, iconKey, n) {
  const pad = CHIP_ICON_PAD[iconKey] || [0, 0];
  const ix = 1 - pad[0];
  const startX = ix + 24 - pad[1] + 4.5;                    // 아이콘 글리프 우단 + 4.5u(≈2px@11px)
  const s = 15 / (DIGIT_INK.y1 - DIGIT_INK.y0);             // 숫자 잉크 높이 15u — '0' 기준 6.9px@11px
  const str = String(n);
  let aw = 0, first = null, last = null;
  for (const ch of str) { const g = BADGE_GLYPHS.g[ch]; if (!g) continue; aw += g.a; if (!first) first = g; last = g; }
  const inkW = first ? (aw - first.x0 - (last.a - last.x1)) * s : 0;
  const yBase = 12 + (DIGIT_INK.y0 + DIGIT_INK.y1) / 2 * s;
  const digits = first ? `<g class="cd-digits" fill="currentColor">${navDigitsGroup(str, s, startX - first.x0 * s, yBase)}</g>` : '';
  const W = Math.ceil(startX + inkW + 1);
  const src = SVG_ICONS[iconKey] || '';
  const inner = src.replace(/^<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '');
  // v13: 루트 태그의 표시 속성(fill="currentColor"·stroke 계열)을 중첩 svg에 승계 — 벗기기만 하면 fill 없는
  // path가 기본 '검정'으로 떨어진다(PC 폼 유튜브 검정의 원인. 컴팩트는 원본 그대로 써서 정상이었음 — 관찰 일치).
  const rootAttrs = ((src.match(/^<svg([^>]*)>/) || ['', ''])[1] || '').replace(/\s(?:width|height|viewBox|xmlns)="[^"]*"/g, '');
  return `<span class="cd-chip ${cls}" data-n="${n}">` +
    `<span class="cd-ic" aria-hidden="true">${src}</span>` +
    `<svg class="cd-full" viewBox="0 0 ${W} 24" aria-label="${n}"><svg x="${ix.toFixed(2)}" y="0" width="24" height="24" viewBox="0 0 24 24" overflow="visible"${rootAttrs}>${inner}</svg>${digits}</svg></span>`;
}

const DIGIT_INK = (() => { let y0 = Infinity, y1 = -Infinity; for (const c of '0123456789') { y0 = Math.min(y0, BADGE_GLYPHS.g[c].y0); y1 = Math.max(y1, BADGE_GLYPHS.g[c].y1); } return { y0, y1 }; })();
// numStr을 advance 폭대로 나열한 <g>. s=CSSpx/upem, (x0,yBase)=SVG 좌표의 시작 x·베이스라인 y(SVG는 y-down이라 scale Y 반전)
function navDigitsGroup(numStr, s, x0, yBase) {
  let x = 0;
  const parts = [];
  for (const ch of String(numStr)) {
    parts.push(`<path d="${BADGE_GLYPHS.g[ch].d}"${x ? ` transform="translate(${x} 0)"` : ''}/>`);
    x += BADGE_GLYPHS.g[ch].a;
  }
  return `<g transform="translate(${x0.toFixed(3)} ${yBase.toFixed(3)}) scale(${s} ${-s})">${parts.join('')}</g>`;
}
// 민트 안읽음 배지 전체(rect 박스 + 숫자). 크기 문법은 구 CSS 동일: 높이14 · min-width16 · 좌우패딩5 · 숫자 10px 상당. 색은 CSS(.nav-badge rect/path)가 담당.
function navBadgeSvg(n) {
  const s = 10 / BADGE_GLYPHS.upem;
  const str = String(n);
  let aw = 0, first = null, last = null;
  for (const ch of str) { const g = BADGE_GLYPHS.g[ch]; aw += g.a; if (!first) first = g; last = g; }
  const H = 14;
  const W = Math.max(16, aw * s + 10);
  const yBase = H / 2 + (DIGIT_INK.y0 + DIGIT_INK.y1) / 2 * s;   // 잉크(union) 중심 = 박스 중심
  const inkAdj = first ? (first.x0 - (last.a - last.x1)) / 2 * s : 0;   // 잉크 수평 중앙(2026-08-24): 첫 글자 좌베어링·끝 글자 우베어링 차를 보정 — '1' 단독 −0.31px 치우침 실측 교정
  return `<svg width="${W.toFixed(2)}" height="${H}" viewBox="0 0 ${W.toFixed(2)} ${H}" aria-hidden="true"><rect width="${W.toFixed(2)}" height="${H}"/>${navDigitsGroup(str, s, (W - aw * s) / 2 - inkAdj, yBase)}</svg>`;
}

const CHEM_NAME_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=574378390';
const LS_CHEMNAME_CACHE = 'chuntaverse_chem_names_v2';   // v1은 구 형식 행 캐시 — 신 파서가 읽으면 오독하므로 키를 올려 자연 폐기
try { localStorage.removeItem('chuntaverse_chem_names_v1'); } catch (e) {}   // 방치된 구 키 청소(2026-08-08 리뷰)
let CHEM_NAMES = {};    // '아이디1:아이디2' → [{name, types[], desc, clip}] — 같은 쌍의 여러 행이 배열로 쌓임(행 순서 유지)
let CHEM_GROUPS = [];   // [{members:[아이디...], entries:[{name, types[], desc, clip}]}]
function applyChemNameRows(rows) {
  const names = {};
  const groups = [];
  const memberIndex = {};
  MEMBERS.forEach((m, i) => { memberIndex[m.id] = i; });
  for (const r of (rows || [])) {
    const name = (r[0] || '').trim().replace(/\s*,\s*/g, ' · ');  // 시트엔 쉼표로 적고 표시는 사이트 규약인 가운뎃점
    if (!name || name === '케미명') continue;  // 빈 행·헤더 행 무시
    // B열 종류: | 구분 다중 허용, 유효값만 통과. 빈 칸·오타는 기타로 흘림(이름이 있는데 미분류일 수는 없음 — 미분류는 '행 없음'의 뜻)
    const types = (r[1] || '').split(/[|,/]/).map(t => t.trim()).filter(t => ['컨텐츠', '프로필', '기타'].includes(t));   // 구분자 |·쉼표·/ 겸용(2026-08-21 Crenop): 가운데줄은 입력이 번거로워 시트엔 쉼표·슬래시를 허용 — 이름 칸의 쉼표→가운뎃점과 같은 취지
    if (types.length === 0) types.push('기타');
    const desc = (r[2] || '').trim();
    const clip = (r[3] || '').trim();
    // E열~ 멤버 칸: 칸에 적힌 이름으로 멤버 매칭(빈 칸·미상 이름은 스킵)
    const ids = r.slice(4)
      .map(c => (c || '').trim())
      .filter(c => c.length > 0)
      .map(nm => (MEMBERS.find(x => x.name === nm) || {}).id)
      .filter(Boolean);
    // 쌍 키는 renderChemistry의 케미 카드 조회 키(`m1.id:m2.id`, MEMBERS 순서라 i<j)와 맞아야 하므로 MEMBERS 인덱스 순으로 정렬
    ids.sort((a, b) => memberIndex[a] - memberIndex[b]);
    const entry = { name, types, desc, clip };
    if (ids.length === 2) {
      const k = `${ids[0]}:${ids[1]}`;
      (names[k] = names[k] || []).push(entry);   // 같은 쌍 여러 행 → 배열에 순서대로(표시는 가운뎃점 나열)
    } else if (ids.length >= 3) {
      const gkey = ids.join(':');
      const ex = groups.find(g => g.members.join(':') === gkey);
      if (ex) ex.entries.push(entry);
      else groups.push({ members: ids, entries: [entry] });
    }
  }
  CHEM_NAMES = names;
  CHEM_GROUPS = groups;
}

async function loadChemNames() {
  if (Object.keys(CHEM_NAMES).length === 0 && CHEM_GROUPS.length === 0) {
    const cached = lsGet(LS_CHEMNAME_CACHE, null);
    if (cached) {
      try { applyChemNameRows(JSON.parse(cached)); if (currentPage === 'chemistry') renderChemistry(); } catch (e) {}
    }
  }
  try {
    const res = await fetch(CHEM_NAME_SHEET_URL);
    if (!res.ok) throw new Error('no data');
    const rows = parseCSV(await res.text());
    applyChemNameRows(rows);
    lsSet(LS_CHEMNAME_CACHE, JSON.stringify(rows));
    if (currentPage === 'chemistry') renderChemistry();
  } catch (e) {}
}

// 유튜브 영상 ID. watch?v= / youtu.be / shorts / live 네 형태를 받는다(embed 포함).
function youtubeVideoId(url) {
  const m = String(url).match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : '';
}

  const pull = (url, lsKey, apply) => fetch(url)

  ]);

}

function calcAge(memberId, ageStr) {
  if (!ageStr) return '';
  if (ageStr === '비공개') return '비공개';
  if (ageStr === '700살') return '700세';
  const match = ageStr.match(/^(\d{4})년생$/);
  if (!match) return ageStr;
  const birthYear = parseInt(match[1]);
  const bd = MEMBER_BIRTHDAYS[memberId];
  const kst = new Date(Date.now() + 9 * 3600 * 1000);
  const cy = kst.getUTCFullYear(), cm = kst.getUTCMonth() + 1, cd = kst.getUTCDate();
  let age = cy - birthYear;
  if (bd && (cm < bd.month || (cm === bd.month && cd < bd.day))) age--;
  return `${age}세 (${ageStr})`;
}

function calcDaysSince(dateStr) {
  if (!dateStr) return '';
  const match = dateStr.match(/^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일$/);
  if (!match) return dateStr;
  const startDate = new Date(Date.UTC(parseInt(match[1]), parseInt(match[2]) - 1, parseInt(match[3])));
  const kst = new Date(Date.now() + 9 * 3600 * 1000);
  const today = new Date(Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), kst.getUTCDate()));
  const diffDays = Math.floor((today - startDate) / 86400000);
  if (diffDays < 0) return dateStr;
  return `${dateStr} (D+${diffDays}일)`;
}


// 지정색이 어두우면 '글자용'으로만 밝기를 올린다(채도·색상은 유지).
// [배경] #FF0000은 값만 최대치지 실제 밝기는 낮다(휘도 기여 R 21%·G 72%·B 7%). 어두운 배경에서 11px 글씨로 쓰면
//        대비가 4.66에 그치고 서브픽셀 렌더링이 붉은 테두리를 만들어 "깨져 보인다"(2026-08-04 지적).
//        밝기를 62%까지만 올리면 #ff3d3d(대비 5.31) — 여전히 순색 계열로 읽힌다.
// 아이콘(SVG)에는 적용하지 않는다. 큰 도형이라 가독성 문제가 없고, 브랜드 색 정체성은 아이콘이 담당한다.
function lightenForText(hex, minL = 0.62) {
  const h = hex.replace('#', '');
  let r = parseInt(h.substring(0,2),16)/255, g = parseInt(h.substring(2,4),16)/255, b = parseInt(h.substring(4,6),16)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2;
  if (l >= minL || mx === mn) return hex;   // 이미 밝거나 무채색이면 그대로
  const s = (mx-mn) / (1 - Math.abs(2*l-1));
  let hd;
  if (mx === r) hd = ((g-b)/(mx-mn)) % 6; else if (mx === g) hd = (b-r)/(mx-mn) + 2; else hd = (r-g)/(mx-mn) + 4;
  hd *= 60; if (hd < 0) hd += 360;
  const c = (1 - Math.abs(2*minL - 1)) * s, x = c * (1 - Math.abs((hd/60) % 2 - 1)), m = minL - c/2;
  const seg = [[c,x,0],[x,c,0],[0,c,x],[0,x,c],[x,0,c],[c,0,x]][Math.floor(hd/60) % 6];
  return '#' + seg.map(v => Math.round((v+m)*255).toString(16).padStart(2,'0')).join('');
}

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return `${parseInt(h.substring(0,2),16)},${parseInt(h.substring(2,4),16)},${parseInt(h.substring(4,6),16)}`;
}

// 축하박스 아이콘 — 실물은 SVG_ICONS로 통합(산포 정리), 여기는 용도→도형 의미 매핑만 유지(호출부 무변경)
const CELEB_SVG = {
  birthday: SVG_ICONS.birthday,
  chuntaverse: SVG_ICONS.chuntaverse,
  broadcast: SVG_ICONS.soop,
};

function celebBox(svg, pcText, mbName, mbType, hexColor, hash) {
  const rgb = hexToRgb(hexColor);
  // 아이콘 PC·모바일 공통. PC: 전체 문구 / 모바일: "이름 종류" 한 줄(C안 — 높이는 다른 버튼과 동일, 폭만 가변)
  return `<a class="celebration-box" href="#${hash}" style="--btn-rgb:${rgb};color:${hexColor}">${svg}<span class="tb-t-pc">${pcText}</span><span class="tb-t-mb">${mbName} ${mbType}</span></a>`;
}

function getTodayCelebrations() {
  const kst = new Date(Date.now() + 9 * 3600 * 1000);
  const cy = kst.getUTCFullYear(), cm = kst.getUTCMonth() + 1, cd = kst.getUTCDate();
  const results = [];

  for (const m of MEMBERS) {
    const bd = MEMBER_BIRTHDAYS[m.id];
    if (!bd || bd.month !== cm || bd.day !== cd) continue;
    const info = MEMBER_INFO[m.id];
    const birthMatch = info?.age?.match(/^(\d{4})년생$/);
    // '만 N세'로 못박는다(2026-08-11): 구 'N번째 생일'은 태어난 날을 첫 번째로 세는 감각과 충돌해 해석이 갈렸다.
    // 값 자체는 동일(cy - 출생연도 = 만 나이). 출생연도를 모르면 나이 조각을 통째로 뺀다.
    const nthText = birthMatch ? `만 ${cy - parseInt(birthMatch[1])}세 ` : '';
    results.push(celebBox(CELEB_SVG.birthday, `${m.name}님의 ${nthText}생일을 축하합니다!`, m.name, '생축!', m.color, `members:${m.en}`));
  }

  if (cm === 11 && cd === 30 && cy > 2025) {
    results.push(celebBox(CELEB_SVG.chuntaverse, `천타버스 결성 ${cy - 2025}주년을 축하합니다!`, '천타버스', `${cy - 2025}주년!`, '#61FFEC', 'members:crew'));
  }
  // N00일 기념은 폐지(2026-08-11): 경과일(시작일=0) 기준이라 시작일을 1일차로 세는 실제 기념 방식과 하루 어긋난다.
  // 기준을 바꾸면 프로필의 (D+N일) 표기와 어긋나므로, 해석이 갈리지 않는 연 단위(주년)만 남긴다.

  // 방송 기산 기준이 멤버마다 다름(2026-07-31 확정): 아래 명단은 '숲 기준일'을 기념하는 멤버 — "숲 방송"으로 표기하고 시트 I열(soopDate) 날짜로 기산(비면 H열 폴백).
  // 그 외(마다옴·나나문·임하밍·문모모·체비·플리)는 '플랫폼 무관 첫 방송일(H열)'이라 "숲"을 빼고 "방송"으로 표기.
  // 천양은 어느 쪽도 아니다(2026-08-11 명시): 시트 H열이 '2009년 (정확한 날짜는 알려져 있지 않음)'처럼 연도만 있는 서술형이라
  // 위 날짜 정규식(YYYY년 M월 D일)에 걸리지 않아 이 루프가 조용히 건너뛴다 — 명단 누락이 아니라 월·일 미상.
  // (모아보기 정렬은 miSortKey가 연도만으로도 읽어 2009-01-01로 취급하므로 고참 위치가 유지된다.)
  // 2026-08-10 개편: 구 H열의 숲 기준일이 I열로 이동, H열은 전원 실제 첫 방송일 — 명단 멤버의 기산 날짜와 문구는 개편 전과 동일하게 유지된다.
  const SOOP_BASED_START = new Set(['kappuchan', 'kyaang123', 'wellro314', 'mocamu2', 'dalta20', 'tleod1818']);   // 빙밍: 숲 데뷔 2022-10-04 기준(2026-08-02)
  for (const m of MEMBERS) {
    const info = MEMBER_INFO[m.id];
    const isSoop = SOOP_BASED_START.has(m.id);
    const baseDate = isSoop ? (info?.soopDate || info?.firstStream) : info?.firstStream;   // 명단 멤버의 기념 기산일 = 숲 기준일
    if (!baseDate) continue;
    const match = baseDate.match(/^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일$/);
    if (!match) continue;
    const bcWord = isSoop ? '숲 방송' : '방송';
    const fy = parseInt(match[1]), fm = parseInt(match[2]), fd = parseInt(match[3]);
    if (fm === cm && fd === cd && cy > fy) {
      results.push(celebBox(CELEB_SVG.broadcast, `${m.name}님의 ${bcWord} ${cy - fy}주년을 축하합니다!`, m.name, `${cy - fy}주년!`, m.color, `members:${m.en}`));
    }
  }

  return results;
}

// ── 상단바 링크 버튼 (구글 시트 gid=981813639) — 커버곡 하드코딩(구 BV_LINK) 대체: 곡·이벤트 교체를 배포 없이 시트에서 ──
// 열: A=링크(https) 또는 모달 gid(숫자) B=아이콘 이름(SVG_ICONS 키, 빈칸/미지=externalLink) C=모바일 라벨 D=PC 라벨(한 줄) E=hex 색(#RRGGBB, 빈칸/무효=흰색) F=만료 G=좌/우 (기본값은 2026-09-04 Crenop 지정)
// 헤더 없음(1행부터 데이터), 행 수만큼 버튼 생성(0행=버튼 없음). 로드는 크루 시트와 동일 정책: 캐시 선표시 → fetch → 실패 시 캐시 유지.
const TOPBAR_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=981813639';
const LS_TOPBAR_CACHE = 'chuntaverse_topbar_links_v2';   // v2: E열 삭제로 색·만료·좌우가 한 칸 당겨짐(2026-09-02) — 구 캐시를 새 파서로 읽으면 어긋난다
let topbarLinks = [];

function parseTopbarRows(rows) {
  const out = [];
  for (const r of (rows || [])) {
    const a = (r[0] || '').trim();
    // A열 세 갈래(2026-08-13, 2026-08-19): 주소면 새 창 링크, 숫자면 그 gid 탭을 내용으로 읽는 모달.
    //   예약어 'title'은 버튼이 아니라 좌상단 로고 교체 행(parseTitleOverride가 따로 읽음) — 여기서는 아래 판정으로 자연 제외된다.
    //   셋 다 아니면 빈 행·메모성 행으로 보고 제외 — 주소 판정은 프로토콜 화이트리스트 유지(javascript: 등 차단, 채팅 링크와 동일 정책).
    //   B~E(아이콘·모바일 라벨·라벨·색)는 링크·모달이 같은 값을 쓴다. 버튼 생김새가 같아야 하므로 여기서 갈라지지 않는다.
    const isUrl = /^https?:\/\//.test(a);
    const gid = /^\d+$/.test(a) ? a : '';
    if (!isUrl && !gid) continue;
    // F열(구 G, 만료일 · 2026-08-19): 값이 해석되면 그 시각까지만 노출(kstExpiryMs — 날짜=그날 자정, +HH:mm=그 분). 지나면 버튼 숨김.
    //   빈 칸·형식 밖은 무기한 노출 — hex 무효→기본색과 같은 관대 관례(G에 메모를 적어도 버튼이 사라지지 않게).
    // E열(2행 라벨) 삭제(2026-09-02, Crenop 지정) — 한 줄 버튼이라 2행이 없다. 이후 열이 한 칸씩 당겨졌다: E=색 F=만료 G=좌/우.
    const until = (r[5] || '').trim();
    if (until) { const ex = kstExpiryMs(until); if (ex !== null && Date.now() > ex) continue; }
    const iconKey = (r[1] || '').trim();
    const hexRaw = (r[4] || '').trim();
    out.push({
      url: isUrl ? a : '',
      gid,
      icon: Object.prototype.hasOwnProperty.call(SVG_ICONS, iconKey) ? iconKey : 'externalLink',   // 기본 = 바깥으로 나감(2026-09-04, 구 youtube)
      mb: (r[2] || '').trim(),
      l1: (r[3] || '').trim(),   // D=라벨(한 줄)
      hex: /^#[0-9A-Fa-f]{6}$/.test(hexRaw) ? hexRaw : '#FFFFFF',   // 기본 = 흰색(2026-09-04, 구 커버곡 핑크)
      // G열(구 H, 2026-08-31): 보조바에서 어느 쪽에 설지(2026-09-04 정리). PC: '우'/'right'/'r'이면 오른쪽 묶음(최애·가이드 왼쪽), 그 밖(빈칸 포함)은 왼쪽 묶음(기념일 바로 왼쪽에 붙어 선다).
      // 세로 배치(서랍): 오른쪽 묶음은 맨 아래 묶음에서 최애 위에 쌓이고, 왼쪽 묶음은 가이드와 같은 줄의 왼쪽(왼쪽 정렬).
      side: /^(우|right|r)$/i.test((r[6] || '').trim()) ? 'right' : 'left',
    });
  }
  return out;
}

function topbarLinksHtml(side) {
  return topbarLinks.filter(b => (b.side || 'left') === side).map(b => {
    const pc = escapeHtml(b.l1);   // 라벨 한 줄(2026-09-02 E열 삭제) — 두 줄짜리 버튼은 사이트 어디에도 없다
    const tx = lightenForText(b.hex);   // 아이콘은 지정색 원본, 글자만 보정 — 순위 버튼과 동일 규칙(2026-08-04 일괄 적용)
    const inner = `${SVG_ICONS[b.icon] || SVG_ICONS.link}<span class="tb-t-pc" style="color:${tx}">${pc}</span><span class="tb-t-mb" style="color:${tx}">${escapeHtml(b.mb)}</span>`;
    const style = `--btn-rgb:${hexToRgb(b.hex)};color:${b.hex}`;   // 버튼 색 공통 변수(2026-09-04)
    return b.gid
      ? `<button class="page-title-link tb-sheet-btn tbm-btn" type="button" onclick="openSheetModal('${escapeHtml(b.gid)}')" style="${style}">${inner}</button>`
      : `<a class="page-title-link tb-sheet-btn" href="${escapeHtml(b.url)}" target="_blank" rel="noopener" style="${style}">${inner}</a>`;
  }).join('');
}

// ── 상단바 시트 모달 (상단바 시트 A열에 gid를 적은 행) ──
// 내용은 그 gid의 탭에서 읽는다. 1행 = 항목 하나: A=제목 B=설명(셀 안 줄바꿈 가능) C=이미지 URL D=이동 링크.
// 유형 열은 두지 않는다 — 채운 칸이 곧 유형이다(이미지만=사진, 제목+링크=링크 항목, 제목+설명=안내문). 배너 시트(gid=0)와 같은 방식.
// 모달을 늘릴 땐 시트 탭을 만들고 gid만 상단바 A열에 적으면 된다(배포 불필요). 내용은 열 때 1회 읽는다 — 상시 필요한 데이터가 아니라 캐시하지 않는다.
const TB_MODAL_SHEET_BASE = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=';

function parseTbModalRows(rows) {
  const out = [];
  for (const r of (rows || [])) {
    const img = (r[2] || '').trim();
    const link = (r[3] || '').trim();
    const item = {
      title: (r[0] || '').trim(),
      desc: (r[1] || '').trim(),
      img: /^https?:\/\//.test(img) ? img : '',     // 상단바 A열과 같은 프로토콜 화이트리스트
      link: /^https?:\/\//.test(link) ? link : '',
    };
    if (item.title || item.desc || item.img || item.link) out.push(item);   // 네 칸이 모두 비면 빈 행·머리말 행으로 보고 제외
  }
  return out;
}

function tbModalHtml(items) {
  return items.map(it => {
    const tag = it.link ? 'a' : 'div';
    const attrs = it.link ? ` href="${escapeHtml(it.link)}" target="_blank" rel="noopener"` : '';
    // 링크가 있으면 제목 줄 끝에 externalLink — 사이트 공통 '바깥으로 나감' 표시 문법.
    // 링크는 있는데 제목이 비면 아이콘만 있는 줄이 된다. 누를 수 있다는 신호는 어떤 조합에서도 남긴다.
    const title = (it.title || it.link)
      ? `<span class="tbm-title">${escapeHtml(it.title)}${it.link ? ' ' + SVG_ICONS.externalLink : ''}</span>` : '';
    const desc = it.desc ? `<span class="tbm-desc">${escapeHtml(it.desc)}</span>` : '';
    const img = it.img ? `<img class="tbm-img" src="${escapeHtml(it.img)}" alt="${escapeHtml(it.title)}" loading="lazy">` : '';
    return `<${tag} class="tbm-item"${attrs}>${title}${desc}${img}</${tag}>`;
  }).join('');
}

async function openSheetModal(gid) {
  const ov = document.getElementById('lrOverlay');
  const head = document.getElementById('lrHead');
  const body = document.getElementById('lrBody');
  if (!ov || !body) return;
  const btn = topbarLinks.find(b => b.gid === gid) || null;
  // 버튼 색을 테두리·헤더에 물린다(순위 모달과 같은 훅 --rk-c/--rk-rgb). 원복은 다음 modalPanel 호출이 통째로 한다.
  const panel = modalPanel('tbm-modal', btn ? { '--rk-c': lightenForText(btn.hex), '--rk-rgb': hexToRgb(btn.hex) } : null);
  const label = btn ? (btn.l1 || btn.mb) : '';
  head.innerHTML = `<span>${(btn && SVG_ICONS[btn.icon]) || SVG_ICONS.link}${escapeHtml(label)}</span>`
    + `<button class="lr-close" type="button" onclick="closeModal()">✕</button>`;
  body.innerHTML = '<div class="lr-msg">불러오는 중…</div>';
  showModal();
  // 응답이 늦게 와도 이미 닫혔거나 다른 모달로 바뀌었으면 본문을 덮지 않는다(lrOverlay 공유 — 순위 모달 폴링 가드와 같은 사유).
  const stillMine = () => !ov.hidden && panel && panel.classList.contains('tbm-modal');
  try {
    const res = await fetch(TB_MODAL_SHEET_BASE + encodeURIComponent(gid));
    if (!res.ok) throw new Error('no data');
    const items = parseTbModalRows(parseCSV(await res.text()));
    if (!stillMine()) return;
    body.innerHTML = items.length ? tbModalHtml(items) : '<div class="lr-msg">표시할 내용이 없습니다.</div>';
  } catch (e) {
    if (stillMine()) body.innerHTML = '<div class="lr-msg">내용을 불러올 수 없습니다</div>';
  }
}

// 좋아요 순위 버튼 — 시트를 프론트에서도 읽는다.
// 이유: 버튼 색(G열)과 '진행 중인 대회가 있는지'는 모달을 열기 전에 알아야 하는데, /like-ranking은 열 때만 호출하기 때문.
// 워커도 같은 시트를 읽지만 용도가 다르다(워커=수집 대상, 여기=버튼 표시). 활성 행 판정 기준(글번호 숫자·마감일)은 양쪽 동일하게 유지할 것.
const LIKE_RANK_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=1784349823';
const LS_LIKERANK_CACHE = 'chuntaverse_like_rank_btn_v1';
// 활성 대회 목록. 대회마다 버튼이 하나씩 생기고, 버튼은 자기 대회만 연다.
// (한 버튼에 전부 담으면 한 번 열 때 모든 대회를 긁게 되고, 버튼 이름도 하나만 적을 수 없어 구분이 안 된다)
let likeRankBtns = [];

function parseLikeRankBtnRows(rows) {
  const k = new Date(Date.now() + 9 * 3600 * 1000);   // KST 오늘(YYYY-MM-DD) — 워커의 마감 판정과 같은 기준
  const today = `${k.getUTCFullYear()}-${String(k.getUTCMonth() + 1).padStart(2, '0')}-${String(k.getUTCDate()).padStart(2, '0')}`;
  return rows
    .filter(r => (r[0] || '').trim() && /^\d+$/.test((r[1] || '').trim()) && (!(r[5] || '').trim() || (r[5] || '').trim() >= today))
    .map(r => ({
      titleNo: (r[1] || '').trim(),
      label: (r[2] || '').trim() || '천타버스 멤버들의',
      hex: /^#[0-9a-fA-F]{6}$/.test((r[6] || '').trim()) ? (r[6] || '').trim() : '#f0abfc',   // G열 미지정 시 기본색(연보라 — 기존 버튼들과 겹치지 않는 계열)
      // I열: 갱신 주기(초). 워커의 캐시 TTL과 같은 값을 써야 한다 — 폴링이 더 빠르면 캐시에 막혀 헛요청만 늘고,
      // 더 느리면 캐시가 놀아 신선도를 못 살린다. 범위 밖·미지정은 워커와 같은 기본값.
      refresh: (() => { const n = parseInt(r[8], 10); return (n >= RANK_REFRESH_MIN && n <= RANK_REFRESH_MAX) ? n : RANK_REFRESH_DEFAULT; })(),
    }));
}

async function loadLikeRankBtn() {
  try { const c = JSON.parse(lsGet(LS_LIKERANK_CACHE, 'null')); if (c) { likeRankBtns = parseLikeRankBtnRows(c); updatePageTitle(); } } catch (e) {}
  try {
    const res = await fetch(LIKE_RANK_SHEET_URL);
    if (!res.ok) throw new Error('no data');
    const rows = parseCSV(await res.text());
    lsSet(LS_LIKERANK_CACHE, JSON.stringify(rows));
    likeRankBtns = parseLikeRankBtnRows(rows);
    updatePageTitle();
  } catch (e) {}   // 실패 시 캐시본 유지 — 상단바 링크 시트와 동일 정책
}

// ── 좌상단 로고 교체(2026-08-19) — 상단바 시트에 A열 예약어 'title' 행 하나로 제어 ─────────
// Title.webp 파일은 그대로 두고 표시만 전환한다: B열=이미지 주소, G열=만료일(버튼과 동일 규칙 — 지나면 기본 로고 복귀).
// 주소는 https:// 또는 레포 상대경로(이미지 확장자)만 허용. '//호스트' 형태(프로토콜 상속 외부행)와 javascript: 류는 형식에서 차단.
// 행이 없거나 주소가 형식 밖이거나 만료가 지났으면 null → 기본 Title.webp. 여러 title 행이면 첫 행만 쓴다.
function parseTitleOverride(rows) {
  for (const r of (rows || [])) {
    if ((r[0] || '').trim().toLowerCase() !== 'title') continue;
    const img = (r[1] || '').trim();
    const ok = /^https:\/\/[^\s"'<>]+$/.test(img) || /^(?!\/\/)[\w\-./]+\.(webp|png|jpe?g|gif|svg)$/i.test(img);
    if (!ok) return null;
    const until = (r[6] || '').trim();
    if (until) { const ex = kstExpiryMs(until); if (ex !== null && Date.now() > ex) return null; }
    return img;
  }
  return null;
}
function applyTitleOverride(rows) {
  const el = document.getElementById('siteLogoImg');
  if (!el) return;
  const img = parseTitleOverride(rows);
  if (img) el.src = img;
  // 값이 없으면 손대지 않는다(2026-08-20 수정): 이 요소의 기본 상태는 정적 src(Title.webp)와 생일 장식 즉시실행부가
  // 소유한다 — 종전의 무조건 복귀가 달타 생일 로고를 덮어버렸다(부트 순서: 생일 즉시실행 → 상단바 로드 → 여기).
  // 만료·행 삭제 복귀는 다음 방문 부트에서 자연 적용(부트가 기본 상태를 다시 만들고 여긴 무개입).
  // 시트 title 행과 생일이 겹치면 시트가 이긴다(명시적 지시 우선 — 나중에 실행되는 쪽).
}

async function loadTopbarLinks() {
  try { const c = JSON.parse(lsGet(LS_TOPBAR_CACHE, 'null')); if (c) { topbarLinks = parseTopbarRows(c); applyTitleOverride(c); updatePageTitle(); } } catch (e) {}
  try {
    const res = await fetch(TOPBAR_SHEET_URL);
    if (!res.ok) throw new Error('no data');
    const rows = parseCSV(await res.text());
    lsSet(LS_TOPBAR_CACHE, JSON.stringify(rows));
    topbarLinks = parseTopbarRows(rows);
    applyTitleOverride(rows);
    updatePageTitle();
  } catch (e) {}   // 실패 시 캐시본 유지 — 첫 방문+시트 장애 조합에서만 버튼 공백(크루 시트와 동일 수용)
}

// 버튼 안 여백은 아이콘 '상자'가 아니라 '그림'에 대고 잰다(2026-09-02 Crenop 지정).
// 왜: padding은 다 같은 10px인데 보이는 왼쪽 간격이 11~13.3px로 벌어져 있었다(픽셀 실측). 아이콘마다 24칸 안에서
// 그림이 차지하는 크기가 달라서다 — 유튜브는 꽉 차고(0px), 달력은 좌우 1.35px, 화살표는 5.2px씩 비어 있다.
// 그림이 비운 만큼 음수 여백으로 걷어내면 아이콘의 배치 상자가 곧 그림이 되어, padding 10px이 그림에 걸린다.
// 배지 정렬이 잉크 bbox를 쓰는 것과 같은 원칙(2026-08-24 확정)을 버튼 여백에 확장한 것이다.
// 잰 값은 아이콘 종류마다 한 번만 계산해 재사용한다(같은 그림이 여러 버튼에 쓰인다).
// 세로는 건드리지 않는다 — 줄 높이를 글자 라인박스가 정하므로 아이콘 상자를 줄여도 글자 위치가 안 변한다(실측 확인).
const btnIconInk = {};
window.fitBtnIcons = fitBtnIcons;
function fitBtnIcons(root) {
  (root || document).querySelectorAll('.page-title-link svg:not([data-ink]), .celebration-box svg:not([data-ink])').forEach(sv => {
    sv.setAttribute('data-ink', '1');   // 한 번 잰 요소는 다시 만지지 않는다(렌더마다 새로 생기면 새 요소라 다시 잰다)
    const key = sv.getAttribute('viewBox') + '|' + sv.innerHTML.length + '|' + sv.innerHTML.slice(0, 40);
    let m = btnIconInk[key];
    if (!m) {
      let bb; try { bb = sv.getBBox(); } catch (e) { return; }   // 화면에 없으면 잴 수 없다 — 그대로 둔다
      const vb = sv.viewBox.baseVal;
      if (!vb || !vb.width || !bb.width) return;
      // getBBox는 선 굵기를 안 세므로 절반씩 더한다(선으로 그린 아이콘은 그만큼 더 넓게 보인다)
      const strokeEl = sv.getAttribute('stroke') ? sv : sv.querySelector('[stroke]:not([stroke="none"])');
      const sw = strokeEl ? parseFloat(strokeEl.getAttribute('stroke-width') || 0) : 0;
      const half = (strokeEl && (strokeEl.getAttribute('stroke') || '') !== 'none') ? sw / 2 : 0;
      const box = sv.getBoundingClientRect();
      const sx = (box.width || 16) / vb.width;
      m = [Math.max(0, bb.x - half - vb.x) * sx, Math.max(0, vb.x + vb.width - (bb.x + bb.width + half)) * sx];
      btnIconInk[key] = m;
    }
    if (m[0] > 0.05) sv.style.marginLeft = `-${m[0].toFixed(2)}px`;
    if (m[1] > 0.05) sv.style.marginRight = `-${m[1].toFixed(2)}px`;
  });
  // 칸 안에 놓인 아이콘(탭 줄·기둥 종류 버튼·필터)은 상자를 줄이지 않고 그림만 칸 가운데로 민다.
  // 상자를 줄이면 그 뒤에 오는 라벨이 아이콘마다 다른 만큼 밀려 줄이 들쭉날쭉해진다 — 여기선 라벨 정렬이 우선이다.
  // 남는 어긋남(그림 너비가 아이콘마다 다른 것)은 그림 자체의 성질이라 여백으로 못 없앤다.
  // 필터 정사각 칸(아이콘 위·글자 아래, .filter-type): 그림을 잉크 테두리에 딱 맞춰 잘라(viewBox) 칸의 40%를 꽉 채운다(2026-09-03 Crenop 지적 —
  // 아이콘마다 여백이 달라 잉크 크기 12~21px로 들쭉날쭉했고 그 아래 글자와의 간격도 제각각이었다). 잘라 낸 그림은 칸 가운데에 저절로 선다(meet).
  // 글자는 그림 아래 자기 줄에 있어 그림 크기가 바뀌어도 자리가 흔들리지 않는다.
  (root || document).querySelectorAll('.filter-type svg:not([data-ink])').forEach(sv => {
    let bb; try { bb = sv.getBBox(); } catch (e) { return; }
    if (!bb || !bb.width || !bb.height) return;   // 화면에 없으면(탭이 안 열림) 잴 수 없다 — 표시를 남기지 않아 다음 그리기(탭 열림 → 관찰자 kick)에서 다시 잰다
    sv.setAttribute('data-ink', '1');
    const strokeEl = sv.getAttribute('stroke') ? sv : sv.querySelector('[stroke]:not([stroke="none"])');
    const half = strokeEl ? parseFloat(strokeEl.getAttribute('stroke-width') || 0) / 2 : 0;
    sv.setAttribute('viewBox', `${(bb.x - half).toFixed(3)} ${(bb.y - half).toFixed(3)} ${(bb.width + half * 2).toFixed(3)} ${(bb.height + half * 2).toFixed(3)}`);
  });
  (root || document).querySelectorAll('.nav-item svg:not([data-ink]), .hall-kind-btn svg:not([data-ink])').forEach(sv => {
    sv.setAttribute('data-ink', '1');
    let bb; try { bb = sv.getBBox(); } catch (e) { return; }
    const vb = sv.viewBox.baseVal;
    if (!vb || !vb.width || !bb.width) return;
    const box = sv.getBoundingClientRect();
    const sx = (box.width || 16) / vb.width;
    const sy = (box.height || 16) / vb.height;
    const l = (bb.x - vb.x) * sx, r = (vb.x + vb.width - bb.x - bb.width) * sx;
    const t = (bb.y - vb.y) * sy, bo = (vb.y + vb.height - bb.y - bb.height) * sy;
    const shift = (r - l) / 2, vshift = (bo - t) / 2;   // 비어 있는 쪽으로 당긴다(상자 크기는 그대로)
    if (Math.abs(shift) > 0.05) { sv.style.marginLeft = `${shift.toFixed(2)}px`; sv.style.marginRight = `${(-shift).toFixed(2)}px`; }
    if (Math.abs(vshift) > 0.05) { sv.style.marginTop = `${vshift.toFixed(2)}px`; sv.style.marginBottom = `${(-vshift).toFixed(2)}px`; }
  });
}

// 가로 배치의 왼쪽 묶음(.subbar-lead)은 기념일 바로 왼쪽에 붙어 선다(2026-09-04 Crenop). 기념일 상자는 프로필 칸 오른쪽 끝에서 왼쪽으로 뻗는 절대 배치라
// 칸(--tab-w)보다 길면 왼쪽 묶음 자리를 덮는다 — 넘친 폭 + 8px를 묶음의 오른쪽 여백으로 비운다. 기념일이 없으면 여백 0(묶음은 프로필 칸 왼쪽 경계에 붙는다).
// 창 크기·글자 로드로 폭이 바뀌면 다시 잰다(syncHeadH와 같은 관찰).
// 왼쪽 묶음(일정 → 시트 버튼, 왼쪽 정렬)과 기념일 상자(프로필 칸 오른쪽 끝에서 왼쪽으로 넘침)가 부딪히는지 실측해 푼다(2026-09-06 Crenop):
// ① 부딪히면 기념일을 약식 문구로(celeb-tight) ② 그래도 겹치면 넘친 폭만큼 묶음의 오른쪽 끝에 빈 칸(.lead-gap)을 두어 버튼이 줄어들게(시트 버튼 먼저, 말줄임).
// 종전(2026-09-04)엔 묶음이 오른쪽 정렬이라 ②만 있었고, 그것도 묶음의 padding-right로 했다 — 그게 선재 버그였다(2026-09-06 실측):
//   왼쪽·오른쪽 묶음은 flex 1 1 0으로 남는 폭을 반씩 나누는데 패딩은 그 몫 밖에 더해져 왼쪽 묶음이 패딩만큼 넓어지고, 가운데 탭 칸 줄 전체가
//   그 절반만큼 오른쪽으로 밀렸다(기념일 134px → 67px 밀림). 그러면 기념일 상자의 오른쪽 경계가 프로필 탭이 아니라 옆 탭에 걸리고 생방송 수·알림 종도
//   한 칸씩 어긋났다(기념일이 있는 날에만 드러난다 — 옛 배포본 2026-09-05a에서도 같은 값으로 재현). 안쪽 빈 칸은 flex 몫(0 기준)에 안 들어간다.
// 세로 배치(≤1150)는 기념일이 자기 행에 있어 부딪힐 일이 없다.
function syncLeadGap() {
  const lead = document.getElementById('subbarLead'), wrap = document.querySelector('.tab-aux[data-for="members"] .celeb-wrap');
  if (!lead) return;
  const aux = wrap && wrap.parentElement;
  if (aux) aux.classList.remove('celeb-tight');
  lead.querySelectorAll('.lead-gap').forEach(n => n.remove());
  if (!wrap || innerWidth <= 1150) return;
  const last = lead.lastElementChild;
  const contentRight = last ? last.getBoundingClientRect().right : lead.getBoundingClientRect().left;
  if (wrap.getBoundingClientRect().left < contentRight + 8) aux.classList.add('celeb-tight');
  const over = Math.max(0, lead.getBoundingClientRect().right - wrap.getBoundingClientRect().left);
  if (over > 0) lead.insertAdjacentHTML('beforeend', `<span class="lead-gap" style="flex:none;width:${Math.ceil(over) + 8}px"></span>`);
}
function updatePageTitle() {
  const scheduleBtn = scheduleBtnHTML();  // 가장 임박한 날짜의 일정 묶음(같은 날 2건+는 열 정렬, 데이터 전엔 셸)
  const celebrations = getTodayCelebrations();
  // 자리 규칙(2026-08-31, 2026-09-06 일정 이동): 왼쪽 묶음 = 일정 → 상단바 왼쪽 링크(기념일 왼쪽에 붙어 선다) ·
  // 기념일 → 프로필 탭 칸 · 가이드 → 맨 오른쪽(갱신 문구 아래, 마크업 고정).
  // 좋아요 요청·순위 버튼은 폐지 — 컨텐츠 신청 탭이 그 둘을 다 담는다.
  // 기념일은 가로·세로 어느 배치에서나 자기 동선(프로필)의 탭 칸에 산다 — 별도 보조바 자리를 두지 않는다(2026-09-02).
  // 가로 배치에서는 그 칸에서 오른쪽 끝에 맞춰 서므로, 기념일의 오른쪽 경계가 프로필 탭의 오른쪽 경계와 일치한다.
  const auxMembers = document.querySelector('.tab-aux[data-for="members"]');
  // 여럿일 때를 위해 한 묶음으로 싼다 — 낱개를 절대배치하면 서로 겹친다.
  // 가로 배치에서 둘 이상이면 긴 문구가 옆 칸을 침범하므로 약식('이름 종류')으로 줄인다.
  if (auxMembers) {
    auxMembers.innerHTML = celebrations.length ? `<span class="celeb-wrap">${celebrations.join('')}</span>` : '';
    auxMembers.classList.toggle('celeb-many', celebrations.length > 1);
    syncLeadGap();   // 기념일 상자가 왼쪽 묶음과 부딪히면 약식 문구로, 그래도 겹치면 묶음을 비운다(2026-09-06 — 종전 2026-09-04엔 비우기만: 왼쪽 묶음이 기념일에 붙어 서게 되면서 겹칠 수 있다)
  }
  // 일정 줄은 왼쪽 묶음 맨 앞(2026-09-06 Crenop): 어느 탭에도 속하지 않는 '다가올 것'이라 탭 칸이 아니라 묶음에 산다 —
  // 가로 배치에선 묶음의 왼쪽 끝(로고 왼쪽 선)부터 시트 버튼과 차례로, 세로 배치(서랍)에선 가이드 줄 왼쪽 열에 위에서부터 세로로. 2026-08-31~09-05엔 달력 탭 칸에 있었다.
  const lead = document.getElementById('subbarLead');
  if (lead) { lead.innerHTML = scheduleBtn + topbarLinksHtml('left'); syncLeadGap(); }
  const sbRight = document.getElementById('subbarRight');
  if (sbRight) {   // 오른쪽 묶음은 어느 배치에서나 같은 상자(세션 70: 세로 배치도 이 상자째 서랍 맨 아래로 내려간다) — 시트 버튼은 최애·가이드 왼쪽
    // 직속 자식만 지운다(:scope >) — 세로 배치에선 왼쪽 묶음(subbarLead)이 이 상자 안 가이드 줄에 들어와 있어, 종전 선택자는 방금 채운
    // 왼쪽 묶음의 버튼(시트 왼쪽 버튼·일정)까지 지웠다(2026-09-06 헤드리스 실측 — 세로 배치에서 왼쪽 시트 버튼이 사라지던 선재 버그).
    sbRight.querySelectorAll(':scope > .page-title-link:not(#guideLink):not(#favBtn), :scope > .celebration-box').forEach(n => n.remove());
    sbRight.insertAdjacentHTML('afterbegin', topbarLinksHtml('right'));
  }
  refreshLikeDot();   // 상단바 innerHTML 재생성으로 클래스가 날아가므로 점 상태 재적용
  fitBtnIcons();      // 새로 그린 버튼의 아이콘 여백을 그림 기준으로 맞춘다
}

// ── 좋아요 요청 모아보기 모달 ──
// 좋아요 요청 숨김 목록 — 시트 A열에 게시글 URL(# 앞부분)을 적으면 해당 글의 요청이 모두 숨김.
// 댓글 단위가 아닌 게시글(컨텐츠) 단위 차단 — 같은 글의 추가 요청 댓글도 함께 숨겨짐.
const LIKE_HIDE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=66286785';
const LS_LIKEHIDE_CACHE = 'chuntaverse_like_hide_v3';   // v3: u에 댓글 앵커(#comment_noti) 보존 — v2(앵커 제거)와 저장 의미 달라 무효화. A=URL, B=만료일(YYYY-MM-DD) → {u,d} 객체배열로 캐시
const normLikeUrl = (u) => (u || '').split('#')[0].trim().replace(/\/$/, '');
// dedup·✕·빨간점 키용: 댓글 앵커(#comment_noti…) 보존 — 같은 글이라도 서로 다른 댓글/링크는 별개 요청으로 취급(이벤트 탭과 동일). CSV 숨김은 앵커 있으면 그 댓글만(fullLikeUrl 매칭), 앵커 없으면 글 전체(normLikeUrl 매칭) 숨김.
const fullLikeUrl = (u) => (u || '').trim().replace(/\/$/, '');
// ── 유저 단위 좋아요 요청 상태(localStorage) — CSV 숨김(글 단위·Crenop 관리)과 별개 ──
const LS_LIKE_DISMISS = 'chuntaverse_like_dismiss_v1';    // (구) ✕ 숨김 키 — 2026-08-10 체크박스 전환으로 신규 기록 중단, 모달 열 때 CHECKED로 이관(멱등)하는 원본으로만 유지
const LS_LIKE_CHECKED = 'chuntaverse_like_checked_v1';    // 유저가 '확인함/좋아요 눌러줌' 체크한 요청(멤버+URL 단위) — ✕와 달리 목록에 남고 재클릭으로 해제 가능
const LS_LIKE_SEEN = 'chuntaverse_like_seen_v1';          // 유저가 모달에서 본 댓글(멤버+URL 단위, 빨간 점 끔용)
const LS_LIKEREQ_CACHE = 'chuntaverse_like_req_cache_v1'; // 점 계산용 마지막 목록 캐시
let likeReqCache = [];   // 마지막으로 받은 like_requests(빨간 점 계산용)
const likeReqKey = (e) => `${e.member_id || ''}|${fullLikeUrl(e.url)}`;   // dedup과 동일 키(멤버+전체 URL, 댓글 앵커 포함). dismiss·seen·빨간점이 '같은 링크'를 시간 무관 동일 취급 → X했거나 본 링크는 재요청돼도 다시 안 켜짐
function lsKeySet(key) { try { return new Set(JSON.parse(lsGet(key, '[]'))); } catch (e) { return new Set(); } }
function lsKeyAdd(key, keys) { const s = lsKeySet(key); let ch = false; keys.forEach(k => { if (!s.has(k)) { s.add(k); ch = true; } }); if (ch) lsSet(key, JSON.stringify([...s])); }
// 좋아요 숨김 B열(만료일) 판정: B 비었거나 형식 밖이면 즉시 숨김, 날짜면 그날(KST)까지 노출하고 지나면 숨김.
// 2026-08-19: 해석을 kstExpiryMs 공통 파서로 위임 — 'YYYY-MM-DD HH:mm'도 받는다(그 분까지 노출). 날짜만 적으면 종전과 동일한 자정 경계.
function likeHideActiveOn(dateRaw, nowMs) {
  const ex = kstExpiryMs(dateRaw);
  return ex === null || nowMs > ex;
}
// 캐시 엔트리({u: 정규화URL, d: 만료일})에서 "지금 숨겨야 할" URL Set 생성. 호출 시점마다 재평가(자정·지정 시각을 넘기면 자동 반영).
function buildLikeHideSet(entries) {
  const nowMs = Date.now();
  const s = new Set();
  for (const e of (entries || [])) {
    if (e && e.u && likeHideActiveOn(e.d, nowMs)) s.add(e.u);
  }
  return s;
}
function lsHideSet() {
  try { return buildLikeHideSet(JSON.parse(lsGet(LS_LIKEHIDE_CACHE, '[]'))); } catch (e) { return new Set(); }
}
// 같은 멤버가 같은 링크에 보낸 좋아요 요청만 dedup: 멤버 + fullLikeUrl(댓글 앵커 #comment_noti 포함) 기준 최신 1건(과거 건 숨김). 한 글에 링크 여러 개면 각각 별개 요청으로 모두 유지(이벤트 탭과 동일).
// 다른 멤버가 같은 링크를 요청한 건은 별개 요청이므로 각각 유지(달타·캬앙이 같은 컨텐츠 좋아요를 요청한 경우 둘 다 노출).
function dedupeLikeReqs(list) {
  const byKey = new Map();
  for (const e of (list || [])) {
    const k = `${e.member_id || ''}|${fullLikeUrl(e.url)}`;
    const prev = byKey.get(k);
    if (!prev || new Date(e.time) > new Date(prev.time)) byKey.set(k, e);
  }
  return [...byKey.values()].sort((a, b) => new Date(b.time) - new Date(a.time));
}
async function loadLikeHideSet() {
  let entries = [];
  try {
    const res = await fetch(LIKE_HIDE_SHEET_URL);
    if (!res.ok) throw new Error('no data');
    entries = parseCSV(await res.text())
      .map(r => ({ u: fullLikeUrl((r[0] || '').trim()), d: (r[1] || '').trim() }))   // 앵커 보존: 앵커 있으면 그 댓글만, 없으면 글 URL(글단위 매칭은 대조 시 normLikeUrl로)
      .filter(e => e.u.startsWith('http'));
    lsSet(LS_LIKEHIDE_CACHE, JSON.stringify(entries));
  } catch (e) {
    try { entries = JSON.parse(lsGet(LS_LIKEHIDE_CACHE, '[]')); } catch (e2) { entries = []; }
  }
  return buildLikeHideSet(entries);
}

// 숨김목록 선로딩분(모달 1회용). hover/클릭에서 호출하되 한 번 받기 시작하면 그 약속을 재사용(중복 fetch 방지).
// 모달을 닫을 때 폐기 → 다음 열기는 그 시점 시트를 새로 읽음(stale 없음). loadLikeHideSet은 실패해도 Set을 돌려주므로 reject 없음.
let likeHidePreload = null;
function preloadLikeHide() {
  if (!likeHidePreload) likeHidePreload = loadLikeHideSet();
  return likeHidePreload;
}

// 좋아요 요청 모달 v2(2026-08-10 전면 개편, 정렬 토글 폐지): 항상 같은 글끼리 묶어 [컨텐츠 헤더]+[요청 행]으로 표시.
// 행은 '누구 요청 · 누구 댓글'만 — 컨텐츠 정보는 헤더로 병합(이벤트 탭은 이벤트가 섞여 있어 요청마다 전체 정보가 필요하지만, 모달은 요청만 모여 행마다 중복이라 제거).
let likeReqShown = null;         // 모달이 현재 그리는 목록(시트 숨김 적용분). null=아직 못 받음/실패
let likeReqNewSet = new Set();   // 이번 열림에서 '신규'였던 요청 키 스냅샷 — 직후 seen 처리로 버튼 점은 꺼지되, 행 표시는 모달 세션 동안 유지

// 같은 글(normLikeUrl — 댓글 앵커 무시) 묶음. 입력이 최신순이라 묶음 순서 = 각 묶음의 최신 요청 순, 묶음 안도 최신순 유지.
function buildLikeReqGroups(list) {
  const buckets = new Map();
  for (const e of (list || [])) {
    const k = normLikeUrl(e.url);
    if (!buckets.has(k)) buckets.set(k, { url: k, entries: [] });
    buckets.get(k).entries.push(e);
  }
  return [...buckets.values()];
}

// 묶음 헤더 문구: 'OOO 컨텐츠 - "글제목"'. 못 읽어온 조각은 빠짐(익명으로 제목을 못 읽는 게시판 존재 — renderEvent [한계] 참조),
// 대상·제목은 묶음 내 첫 확보값 사용(요청마다 조회 성공 여부가 다를 수 있음). 둘 다 없으면 일반 문구.
function likeReqGroupTitle(entries) {
  const tn = (entries.find(e => e.target_name) || {}).target_name;
  const pt = (entries.find(e => e.post_title) || {}).post_title;
  return [tn ? `${tn} 컨텐츠` : '', pt ? `"${pt}"` : ''].filter(Boolean).join(' - ') || '숲 게시글';
}

const LRQ_CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><polyline points="4 12.5 10 18.5 20 6.5"/></svg>';

// 렌더 대상(2026-08-31): 종전엔 공용 모달 본문(#lrBody)에 박혀 있었다. 컨텐츠 신청 탭이 같은 목록을
// 자기 화면에 그리므로 대상만 갈아끼운다 — 목록을 만드는 규칙은 한 벌로 유지한다.
let likeReqTarget = 'lrBody';
let likeRankTarget = 'lrBody';
function renderLikeReqBody() {

    // 매칭은 시트의 글번호가 그 묶음 주소에 들어 있는지로 본다. 카페 글은 숲 글번호가 없어 자연히 버튼이 안 생긴다
    // (네이버 카페 좋아요 수를 받아올 수 있는지는 미확인 — 가능해지면 여기 조건을 넓히면 된다).
    const rb = likeRankBtns.find(b => b.titleNo && g.url && g.url.includes('/' + b.titleNo));
    // 시트 색을 버튼에 입히던 것 폐지(2026-09-01): 색으로 대회를 구분하던 건 모바일에서 이름을 못 넣던 시절의 방편이고,
    // 이제 각 묶음 머리에 이름이 붙어 있어 색이 할 일이 없다. 사이트 공통 버튼 문법으로 통일한다.
    const rankBtn = rb

    const rows = g.entries.map(e => {

      const cls = 'lrq-row' + (likeReqNewSet.has(key) ? ' unread' : '') + (checked.has(key) ? ' checked' : '');
      return `<div class="${cls}" data-lrkey="${escapeHtml(key)}">`

    }).join('');
    // 좁은 폭에서 이 묶음의 순위를 보는 중이면, 댓글 자리에 순위 자리를 대신 찍는다(다른 묶음의 댓글은 그대로).
    const rankHere = window.matchMedia('(max-width: 1100px)').matches && rb && applyRankPost === rb.titleNo;
    return head + (rankHere ? '<div class="apply-rank apply-rank-slot"></div>' : rows);

// ── 사이트 공용 모달 (2026-08-31 단일화) ──────────────────────────────────────
// 종전엔 오버레이 3개를 여는 함수 8개가 제각각 다뤘고, 패널에 붙인 클래스는 닫기 함수가 '제거 목록'
// (tbm-modal·cc-modal)을 들고 지웠다. 모달을 하나 더 만들 때 그 목록에
// 추가하는 걸 잊으면 이전 모달의 색·여백이 새 모달에 묻어나는 구조였다.
// 지금은 modalPanel()이 열 때마다 className과 인라인 style을 통째로 새로 지정한다 — 지울 목록이라는
// 개념 자체가 없어서, 모달을 추가할 때 닫기 쪽을 손댈 일이 없다.
// 닫는 방법 3종(✕ · ESC · 배경 클릭)도 전부 closeModal() 하나를 거친다.

// 패널 초기화 + 이번 모달의 옷 입히기. cls는 붙일 클래스, vars는 CSS 변수({'--rk-c': '#fff'} 꼴).
// 모든 여는 함수가 본문을 채우기 전에 한 번 부른다 — 클래스가 필요 없는 모달도 잔재를 지우려면 불러야 한다.
function modalPanel(cls, vars) {
  const el = document.querySelector('#lrOverlay .lr-panel');
  if (!el) return null;
  el.className = 'lr-panel' + (cls ? ' ' + cls : '');
  el.style.cssText = '';
  if (vars) for (const k in vars) el.style.setProperty(k, vars[k]);
  return el;
}
// 본문을 다 채운 뒤 표시. onClose를 주면 그 모달만의 뒷정리를 닫을 때 실행한다(공통 정리는 closeModal 참고).
function showModal(onClose) {
  modalOnClose = onClose || null;
  const ov = document.getElementById('lrOverlay');
  if (ov) ov.hidden = false;
  syncBodyScrollLock();
}
let modalOnClose = null;
function closeModal() {
  const ov = document.getElementById('lrOverlay');
  if (!ov || ov.hidden) return;
  ov.hidden = true;
  const fn = modalOnClose; modalOnClose = null;
  if (fn) { try { fn(); } catch (e) {} }
  // 공통 뒷정리 — 어느 모달을 닫든 되돌린다(종전 closeLikeRequests와 같은 범위 유지).
  rankOpenPost = null;
  likeHidePreload = null;  // 선로딩분은 모달 1회용 — 다음 열기는 그 시점 최신으로
  schedulePreload = null;
  syncBodyScrollLock();
}
// 배경 스크롤 잠금 — 모달이 떠 있으면 body 스크롤 차단, 닫히면 복원
function syncBodyScrollLock() {
  const el = document.getElementById('lrOverlay');
  document.body.style.overflow = (el && !el.hidden) ? 'hidden' : '';
}

// ── 좋아요 순위 모달 (2026-08-04) ────────────────────────────────────────────
// 워커 /like-ranking은 호출될 때 그 자리에서 숲을 긁는다(상시 수집 없음). 그래서 신선도 = 이 폴링 주기.
// 열려 있을 때만 10초로 돌리고 닫으면 완전히 멈춘다 — 백그라운드에서 볼 사람이 없는데 돌릴 이유가 없다.
// 탭이 숨겨졌을 때도 건너뛴다(모달은 열려 있어도 화면에 없으면 마찬가지).
// 갱신 주기는 시트 I열에서 온다(대회별). 아래는 워커와 맞춘 기본값·허용 범위 — 양쪽이 어긋나면 캐시와 폴링이 엇박이 난다.
const RANK_REFRESH_DEFAULT = 30, RANK_REFRESH_MIN = 5, RANK_REFRESH_MAX = 600;
let rankOpenPost = null;                  // 현재 모달이 보고 있는 대회(글번호). 폴링이 같은 대회를 계속 갱신하도록 붙잡아 둔다


async function loadLikeRanking() {
  const body = document.getElementById(likeRankTarget);
  if (!body) return;
  try {
    // no-store: 응답에 max-age=10이 붙어 있어 기본 모드면 브라우저 캐시가 10초 더 붙잡는다(엣지 10초 + 브라우저 10초 = 최대 20초 지연).
    // 엣지 캐시는 워커가 Cache API로 직접 조회하므로 이 옵션과 무관 — 즉 숲/유튜브 부하는 그대로 두고 신선도만 회복한다.
    const res = await fetch(WORKER_URL + '/like-ranking' + (rankOpenPost ? `?post=${encodeURIComponent(rankOpenPost)}` : ''), { cache: 'no-store' });
    const data = await res.json();
    const events = data.events || [];
    if (events.length === 0) { body.innerHTML = '<div class="lr-msg">진행 중인 순위 집계가 없습니다.</div>'; return; }
    body.innerHTML = events.map(renderRankEvent).join('');
  } catch (err) {
    // 폴링 중 실패는 화면을 비우지 않는다 — 직전 값을 두고 다음 주기를 기다린다(깜빡임 방지)
    if (body.querySelector('.rk-ev')) return;
    body.innerHTML = '<div class="lr-msg">불러오기에 실패했습니다. 잠시 후 다시 시도해 주십시오.</div>';
  }
}

function renderRankEvent(ev) {
  // ★ 사이트 고유 멤버 순서가 아니라 좋아요 순으로 정렬 — 순위표에서 의미 있는 배열은 성적순이다.
  //   (워커가 이미 좋아요 순으로 내려주지만, 순서를 응답에 의존하지 않는다.)
  const sorted = [...(ev.members || [])].sort((a, b) => (b.like ?? -1) - (a.like ?? -1));
  const grouped = ev.grouped !== false;   // 시트 D열(전형규칙)이 비면 전형 열 자체를 그리지 않는다
  // 컷을 '행'으로 끼워 넣는다. 우리 멤버가 속한 전형만 — 신입처럼 아무도 없는 전형은 자리를 차지할 이유가 없다.
  // 위치는 그 컷 값이 좋아요 내림차순에서 놓일 자리. 같은 값이면 멤버가 먼저(컷과 동점이면 통과이므로 컷 위에 있어야 한다).
  const usedGroups = new Set(sorted.map(m => m.group));
  const cutRows = (ev.groups || [])
    .filter(g => g.cut !== null && usedGroups.has(g.name))
    .map(g => ({ _cut: true, group: g.name, cut: g.cut, like: g.cut }));
  const merged = [...sorted, ...cutRows]
    .sort((a, b) => ((b.like ?? -1) - (a.like ?? -1)) || ((a._cut ? 1 : 0) - (b._cut ? 1 : 0)));
  const rows = merged.map((m, mi, arr) => {
    if (m._cut) {
      // 멤버 행과 같은 클래스를 써서 열이 자동으로 맞는다. '컷'이라는 단어는 넣지 않는다 —
      // 상단에 "33위 컷 기준"이 있고 색·경계선이 이미 그 뜻이라, 넣으면 등수 칸의 좌우 정렬만 깨진다.
      return `<div class="rk-row rk-cut-row">`
        + (grouped && m.group ? `<span class="rk-grp">${escapeHtml(m.group)}</span>` : '')
        + `<span class="rk-rank">${ev.quota ? ev.quota + '위' : '컷'}</span>`
        + `<span class="rk-like">${m.cut.toLocaleString()}</span></div>`;
    }
    const mem = findMember(m.member_id);
    const av = mem ? `<img class="rk-av" src="${mem.img}" alt="${escapeHtml(m.name)}">` : '<span></span>';
    const nm = `<span class="rk-name" style="color:${mem ? mem.color : '#fff'}">${escapeHtml(m.name)}</span>`;
    // [상태 분기 제거 · 2026-08-07] '시트 이름 확인 필요'·'댓글 미확인' 두 줄이 있던 자리.
    //   워커가 시트 구 F열(참여멤버)이 아니라 실제 댓글에서 멤버를 찾게 바뀌어(computeLikeRanking) 두 상태가 발생하지 않는다
    //   — 목록에 있다는 것 자체가 댓글이 있다는 뜻이다. 미신청 멤버는 아예 행이 안 생긴다.
    // 안정/탈락은 행 단위 클래스로 — 순위와 컷이 같은 의미색을 공유해야 한 눈에 읽힌다
    const zone = m.gap === null ? '' : (m.gap >= 0 ? ' in' : ' out');
    const gap = m.gap === null ? '' : `컷 ${m.gap >= 0 ? '+' : ''}${m.gap.toLocaleString()}`;
    // 워커가 그 멤버의 댓글 앵커(pCommentNo)를 실어 보내면 행 전체를 링크로. 못 실었으면 div 그대로.
    // [팀 병합 표시 · 2026-08-20 Crenop] 같은 팀의 연속 행(판정: 직전 행과 같은 대표 댓글 링크)은 한 덩어리로 —
    //   이어지는 행은 아바타·이름만 남기고 전형·순위·좋아요·컷차이를 비운다(숫자는 팀당 한 번, 첫 행에만).
    //   좋아요 동률로 묶지 않는 이유: 남남끼리도 동률이 실제로 난다(특히 초반 0·1개 구간) — 링크 동일성이 팀의 확정 신호다.
    //   빈 span은 grid 열 자리 유지용(빼면 칸이 밀린다). 동점 컷 행은 정렬 규칙상 팀 아래에 서므로 사이에 끼지 않는다.
    const prevM = arr[mi - 1];
    const teamCont = !!m.url && !!prevM && !prevM._cut && prevM.url === m.url;
    const inner = teamCont
      ? `${av}${nm}`
        + (grouped ? `<span class="rk-grp"></span>` : '')
        + `<span class="rk-rank"></span><span class="rk-like"></span><span class="rk-gap"></span>`
      : `${av}${nm}`
        + (grouped ? `<span class="rk-grp">${m.group ? escapeHtml(m.group) : ''}</span>` : '')
        + `<span class="rk-rank">${m.rank}위</span>`
        + `<span class="rk-like">${m.like.toLocaleString()}</span>`
        + `<span class="rk-gap">${gap}</span>`;
    const rowCls = `rk-row${zone}${teamCont ? ' rk-teamcont' : ''}`;
    return m.url
      ? `<a class="${rowCls}" href="${escapeHtml(m.url)}" target="_blank" rel="noopener">${inner}</a>`
      : `<div class="${rowCls}">${inner}</div>`;
  }).join('');
  // 상단에는 기준(몇 위까지 뽑는지)만. 전형별 컷 숫자는 각 멤버 행으로 내려갔다.
  const sub = ev.quota ? `${ev.quota}위 컷 기준` : '';
  const note = ev.unclassified > 0 ? `<div class="rk-note">전형을 판별하지 못한 신청 ${ev.unclassified}건이 있어 실제 순위가 조금 더 낮을 수 있습니다.</div>` : '';
  const tone = ev.color ? ` style="--rk-c:${lightenForText(ev.color)}"` : '';   // 시트 G열 색을 제목·순위에 반영(글자라 보정본 사용)
  return `<div class="rk-ev${grouped ? '' : ' no-group'}"${tone}><div class="rk-ev-head"><span class="rk-ev-title">${escapeHtml(ev.label || '좋아요 순위')}</span>`
    + (sub ? `<span class="rk-ev-sub">${escapeHtml(sub)}</span>` : '')
    + `</div>` + rows + note + `</div>`;
}

// 빨간 점: 안 숨김(dismiss)·안 가려짐(CSV 캐시)·안 본(seen) 요청이 1개+면 표시
function computeLikeDot() {
  // 점 = 아직 안 본 요청 존재(시트 숨김 제외). 체크(확인함)는 무관 — 신규는 정의상 미체크. 구 ✕(dismiss) 조건은 체크 전환(2026-08-10)으로 폐지(이관분은 모달에서 이미 seen 처리된 키들).
  const seen = lsKeySet(LS_LIKE_SEEN), hide = lsHideSet();
  return likeReqCache.some(e => {
    const k = likeReqKey(e);
    return !seen.has(k) && !(hide.has(fullLikeUrl(e.url)) || hide.has(normLikeUrl(e.url)));
  });
}
// 새 요청 표시가 보조바 버튼에서 탭으로 옮겨졌다(2026-08-31). 생방송 점·이벤트 안읽음과 같은 자리 문법.
function refreshLikeDot() {
  const tab = document.querySelector('.nav-item[data-page="apply"]');
  if (tab) tab.classList.toggle('has-new', computeLikeDot());
}
// 페이지 로드 시 점 계산용 목록 1회 로드(엣지 캐시 max-age=60 → 대부분 히트, 비용 미미). 캐시 우선으로 점 즉시 반영.
async function loadLikeReqForDot() {
  try { likeReqCache = dedupeLikeReqs(JSON.parse(lsGet(LS_LIKEREQ_CACHE, '[]'))); } catch (e) { likeReqCache = []; }
  refreshLikeDot();
  try {
    const res = await fetch(WORKER_URL + '/like-requests');
    const data = await res.json();
    likeReqCache = dedupeLikeReqs(data.like_requests || []);
    lsSet(LS_LIKEREQ_CACHE, JSON.stringify(likeReqCache));
    refreshLikeDot();
  } catch (e) {}
}
// 체크 토글(구 ✕ 대체) — '확인함/좋아요 눌러줌'을 요청 키 단위로 localStorage 저장. 행은 목록에 남고 재클릭으로 해제(✕의 캐시 삭제 없인 복구 불가 문제 해소).
// 해당 행만 제자리 갱신(전체 재렌더 없음 — 스크롤 위치 보존).
function toggleLikeReqChecked(key, row, btn) {
  const s = lsKeySet(LS_LIKE_CHECKED);
  if (s.has(key)) s.delete(key); else s.add(key);
  lsSet(LS_LIKE_CHECKED, JSON.stringify([...s]));
  row.classList.toggle('checked', s.has(key));
  if (s.has(key)) { row.classList.remove('unread'); likeReqNewSet.delete(key); }   // 체크 = 그 자리에서 읽음 처리(2026-08-10) — 모달을 나가지 않아도 신규 표시가 꺼진다. 체크 해제로 되살리진 않음(읽음은 단방향)
  if (btn) btn.setAttribute('aria-pressed', String(s.has(key)));
}
document.addEventListener('click', (e) => {
  const ov = document.getElementById('lrOverlay');
  if (ov && !ov.hidden && e.target === ov) closeModal();  // 패널 바깥(배경) 클릭 시 닫기
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();   // 모달이 하나뿐이라 닫는 곳도 하나
});
// 요청 행 체크박스(확인/좋아요 완료 표시) — 위임. 링크(.lrq-link)의 형제라 클릭이 링크로 새지 않음.
document.addEventListener('click', (e) => {
  const c = e.target.closest && e.target.closest('.lrq-check');
  if (!c) return;
  const row = c.closest('.lrq-row');
  if (row && row.dataset.lrkey) toggleLikeReqChecked(row.dataset.lrkey, row, c);
});

// ── 다가오는 일정 (구글 시트 gid=2043421724 — 컨텐츠와 통합 시트) ──
// 열: A=YYYY-MM-DD(또는 YYMMDD) / B=HH:MM(빈칸 가능) / C=링크(빈칸 가능) / D=간략제목(버튼용·빈칸 가능) / E=상세제목(모달용) / F~=참가 멤버 이름(컨텐츠 행과 동일 열·빈칸 가능 — 모달에서 아바타로 표시). D·E 중 하나라도 있으면 행 유지(버튼=D 우선, 모달=E 우선, 한쪽 비면 다른 쪽). 모든 시각은 KST 기준.
// 상단바 버튼: 가장 임박한 일정 1개만 표시 — 당일이고 시간 있으면 D-time(D-HH:MM:SS 초 카운트다운), 그 외(미래 날짜)는 D-day.
// 숨김 기준: 시간 유무와 무관하게 그날 자정(KST)을 넘겨야 빠짐. 시간 있는 일정도 그 시각이 지나면 사라지지 않고 D-DAY로 그날 자정까지 유지(시간 없는 일정과 동일·합방 중에도 상단 노출) → 자정 넘으면 다음 일정으로. 시트 행은 그대로 둠.
// CSV: 페이지 로드 시 1회(버튼 표시용) + 모달 열 때 재풀링(최신 반영). 좋아요 모달과 동일한 lrOverlay·선로딩 패턴 재사용.
// 컨텐츠 시트와 통합(같은 gid). 일정 행 = A열이 날짜(YYMMDD 또는 YYYY-MM-DD)인 행. 컨텐츠 행(A=http URL)은 parseScheduleRows의 날짜 정규화에서 null→자동 제외.
const SCHEDULE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=2043421724';
const LS_SCHEDULE_CACHE = 'chuntaverse_schedule_cache_v3';   // v3: F=종류 신설로 멤버가 G~로 밀림(2026-09-02) — 구 캐시는 종류 칸을 멤버로 읽는다  // v2: 통합 시트 칼럼 재배치(C=링크/D=간략/E=상세)로 구 캐시(raw rows) 무효화
let scheduleData = [];   // 파싱·정렬 완료된 일정
let scheduleSig = '';    // 버튼 구조(headline·개수) 식별자 — 변할 때만 상단바 전체 재구성, 평소엔 카운트다운 숫자만 갱신
let schedulePreload = null;

// 종류 태그 칸(컨텐츠·일정 시트 F열) — 쉼표·|·/ 다중(케미 시트 종류 칸과 같은 구분자 관례). 빈 칸이면 [].
function parseTags(cell) { return String(cell || '').split(/[,|/]/).map(t => t.trim()).filter(Boolean); }
function parseScheduleRows(rows) {
  const out = [];
  for (const r of rows) {
    // 날짜·시각을 A·B 어느 칸에서든 찾는다: 옛 형식 A=날짜·B=시각, 새 형식 B='날짜 시각' 둘 다 그대로 읽힌다.
    // 사진 행(A=사진 주소)도 B에 날짜를 적었으면 여기에 걸린다 — 사진 붙은 예고도 보조바 D-DAY·일정 목록에 떠야 하기 때문(2026-09-04 Crenop).
    //   B가 비어 파일 이름으로만 날짜를 아는 옛 그림 행은 여기서 날짜를 못 얻어 자동으로 빠진다(종전과 같음).
    //   한 행이 두 번 세어지지 않게 fromImage 표를 단다 — contentAll()이 그 표를 보고 컨텐츠 쪽에서 한 번만 세운다.
    const fromImage = contentPhotos(r[0]).length > 0;   // content 폴더 사진이 있는 행만 사진 행(2026-09-06)
    // A에 주소가 있는데 content 폴더 사진이 아니면(현수막 등) 그 행은 통째로 뺀다(2026-09-06 Crenop 2차): 컨텐츠도 아니고 일정도 아니다 —
    // B에 날짜가 있어도 글자 카드로 살려 두지 않는다(축하만 받은 합방을 현수막 사진과 함께 적어 둔 행이 그 예 — 9/4의 컨텐츠 세기 기준과 같은 뜻).
    if (!fromImage && /^https?:\/\//i.test(String(r[0] || '').trim())) continue;
    const when = pickWhen(r[0], r[1]);
    const date = when.ymd;
    if (!date) continue;
    const brief = (r[3] || '').trim();   // D=간략제목(버튼)
    const detail = (r[4] || '').trim();  // E=상세제목(모달)
    if (!brief && !detail) continue;     // 제목이 둘 다 없으면 무효 행
    const hasTime = !!when.time;
    const hhmm = hasTime ? when.time : '00:00';
    const target = new Date(`${date}T${hhmm}:00+09:00`).getTime();
    const dayStart = new Date(`${date}T00:00:00+09:00`).getTime();
    out.push({
      date, time: hasTime ? hhmm : '',
      title: detail || brief,        // 달력 칸·상세·목록 모달 제목(상세 우선) — 보조바 밖의 모든 자리(2026-09-03 정리)
      shortTitle: brief || detail,   // 보조바 버튼 전용(간략 우선) — 달력 칸은 2줄을 잡아 두었으므로 여기서 쓰지 않는다
      link: (r[2] || '').trim(),     // C=링크
      tags: parseTags(r[5]),         // F=종류(2026-09-02 신설, 쉼표·|·/ 다중) — 아이콘 별칭표(CAL_TAG_ICON)로 그림이 된다
      members: r.slice(6).filter(c => c.length > 0),  // G~ 멤버 (loadContent와 동일 열·동일 방식)
      imgs: fromImage ? contentPhotos(r[0]) : [],
      fromImage,
      hasTime, target,
      hideAfter: dayStart + 86400000,  // 시간 유무 무관 그날 자정까지 유지(시간 지나면 D-DAY로 표기)
    });
  }
  // 날짜 오름차순 → 같은 날은 시간 있는 것 먼저(시간순), 시간 없는 것은 맨 아래
  out.sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    if (a.hasTime !== b.hasTime) return a.hasTime ? -1 : 1;
    return a.target - b.target;
  });
  return out;
}

function visibleSchedule() {
  const now = Date.now();
  return scheduleData.filter(s => now < s.hideAfter);
}
// ── 지난 일정 = 컨텐츠(2026-09-04 Crenop 지정) ──
// 일정 행(A열이 날짜)은 컨텐츠가 아니다(2026-09-06 Crenop: "A열 = content 폴더 사진만" — 9/4의 '지난 일정도 컨텐츠' 규칙 철회).
// 컨텐츠 탭·모아보기·통계 컨텐츠 수는 전부 contentData(content 폴더 사진 행)만 본다. 일정은 보조바 버튼·다가올 일정 목록(visibleSchedule)에서만 산다.
function schedulePast(s) { return Date.now() >= (s.hasTime ? s.target : s.hideAfter); }
function contentPast(c) { return !c.until || Date.now() >= c.until; }   // B에 날짜를 적은 그림 행만 '아직 안 온 것'이 될 수 있다
// 컨텐츠 = 지난(시각이 온) content 폴더 사진 행뿐(2026-09-06). 일정 행은 안 든다.
function contentAll() { return contentData.filter(contentPast); }
// 통계에서 '컨텐츠'로 세는 기준(2026-09-04 Crenop 재지정): A열 사진이 content 폴더에 있는 행만.
// [왜] 종전 기준은 '그림이 있거나 링크가 있으면'이었는데, 현수막 사진(banner 폴더)을 컨텐츠 행에 붙이기 시작하면 축하만 받은 합방까지 컨텐츠로 세어진다.
//   'Crenop이 컨텐츠 사진을 만들어 content 폴더에 올렸다'가 곧 '천타버스가 차린 컨텐츠'라는 표시다. 링크는 남이 올린 편집본일 수도 있어 기준이 흐려진다.

// KST 기준 D-day 일수(오늘=0). 자정끼리의 차이라 시:분과 무관.

// 가장 임박한 날짜의 일정 묶음 + 표기 상태(버튼·틱 공통). 표기(D-day)가 전부 같으면 병합(M), 다르면 분리(S) — D-time 폐지(2026-09-04) 뒤엔 같은 날이면 늘 같다.
// sig엔 묶음 구성·단일(1)/병합/분리만 담아 → 구조가 바뀔 때만 재렌더.
function scheduleHead() {
  const vis = visibleSchedule();
  if (!vis.length) return { vis, group: [], dtimes: [], allSame: true, sig: '∅' };
  const d0 = vis[0].date;
  const group = vis.filter(s => s.date === d0);   // vis는 정렬됨 → 같은 날짜는 시간순 prefix
  const dtimes = group.map(e => ddayText(e));
  const allSame = dtimes.every(x => x === dtimes[0]);
  const state = group.length >= 2 ? (allSame ? 'M' : 'S') : '1';
  const sig = group.map(e => `${e.date}T${e.time}`).join(',') + '|' + state;
  return { vis, group, dtimes, allSame, sig };
}

async function setNotifyEnabled(enabled) {
  if (enabled) {
    if ('Notification' in window) {
      if (Notification.permission === 'default') {
        try {
          const result = await Notification.requestPermission();
          if (result !== 'granted') {
            notifyEnabled = false;
            lsSet(LS_NOTIFY, '0');
            updateNotifySwitchUI();
            alert('브라우저 알림 권한이 거부되어 알림을 받을 수 없습니다.\n브라우저 설정에서 알림 권한을 허용한 후 다시 시도해 주십시오.');
            return;
          }
        } catch (e) {}
      } else if (Notification.permission === 'denied') {
        notifyEnabled = false;
        lsSet(LS_NOTIFY, '0');
        updateNotifySwitchUI();
        alert('브라우저 알림 권한이 차단되어 있습니다.\n브라우저 주소창 좌측 자물쇠 아이콘 → 알림 허용 후 다시 시도해 주십시오.');
        return;
      }
    } else {
      alert('이 브라우저는 알림 기능을 지원하지 않아요.');
      return;
    }
  } else {
    stopTitleFlash();
  }
  notifyEnabled = enabled;
  lsSet(LS_NOTIFY, enabled ? '1' : '0');
  updateNotifySwitchUI();
}

function startTitleFlash(count) {
