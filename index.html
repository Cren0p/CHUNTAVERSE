  }, 1500);
}
function stopTitleFlash() {
  if (titleFlashTimer) {
    clearInterval(titleFlashTimer);
    titleFlashTimer = null;
  }
  titleFlashOn = false;
  pendingFlashCount = 0;
  updateTabTitle();
}
function updateTabTitle() {
  const lastSeen = new Date(getLastSeenTime()).getTime();
  const unreadCount = dedupBattleNotices(allEvents.filter(e => {
    const t = new Date(e.time).getTime();
    if (isNaN(t) || t <= lastSeen) return false;
    const cat = typeToCat(e.type);
    if (!filterState.types.has(cat)) return false;
    const memberMatch = filterState.members.has(e.member_id);
    const channelMatch = e.channel_id && filterState.members.has(e.channel_id);
    if (cat === 'chat') return memberMatch || channelMatch;
    return memberMatch;
  })).length;
  const base = unreadCount > 0 ? `${BASE_TITLE} (${unreadCount})` : BASE_TITLE;
  if (unreadCount === 0 && titleFlashTimer) {
    clearInterval(titleFlashTimer);
    titleFlashTimer = null;
    titleFlashOn = false;
    pendingFlashCount = 0;
  }
  document.title = (titleFlashTimer && titleFlashOn && pendingFlashCount > 0)
    ? `${base} NEW ◆` : base;
}

function sendBrowserNotification(ev) {
  if (!notifyEnabled) return;
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;
  if (document.visibilityState === 'visible' && currentPage === 'events') return;

  const memberName = ev.member_name || '';
  let body = '';
  switch (ev.type) {
    case 'start':      body = `${memberName} 방송 시작${ev.title ? ' — ' + ev.title : ''}`; break;
    case 'end':        body = `${memberName} 방송 종료`; break;
    case 'title':      body = `${memberName} 방송 제목 변경 — ${ev.after || ''}`; break;
    case 'category':   body = `${memberName} 카테고리 변경 — ${ev.after || ''}`; break;
    case 'mode_change':body = `${memberName} 방송 모드 변경 — ${modeLabel(ev.after)}`; break;
    case 'post':       body = `${memberName} 숲 게시글 — ${ev.title || ''}`; break;
    case 'comment_recommend': body = `${memberName} 좋아요 요청 — ${ev.target_name || ''} 컨텐츠`; break;
    case 'youtube':    body = `${memberName} 유튜브 업로드 — ${ev.title || ''}`; break;
    case 'cafe_post':  body = `${memberName} 카페 게시글 [${ev.cafe_name || ''}] — ${ev.title || ''}`; break;
    case 'chat':       body = `${memberName} 채팅 (${ev.channel_name || ''}) — ${ev.message || ''}`; break;
    case 'chat_emoticon': body = `${memberName} 채팅 (${ev.channel_name || ''}) — (이모티콘)`; break;
    case 'donation':   body = `${memberName} 후원 (${ev.channel_name || ''}) — 별풍선 ${ev.amount || ''}개`; break;
    case 'sanction':   body = `${memberName} ${ev.kind === 'kick' ? '강제퇴장' : `채팅금지 ${ev.seconds || 0}초`} (${ev.channel_name || ''} 방송)`; break;
    case 'mission_gift': body = `${memberName} ${ev.mission === 'battle' ? '대결' : '도전'}미션 후원 ${ev.amount || 0}개 (${ev.channel_name || ''} 방송)`; break;
    case 'battle_notice': body = `${memberName} 대결미션 종료${ev.title ? ' — ' + ev.title : ''}`; break;
    default:           body = `${memberName} ${ev.type}`;
  }
  try {
    const noti = new Notification(BASE_TITLE, {
      body, icon: 'Favicon.webp',
      tag: `${ev.type}-${ev.member_id}-${ev.time}`,
    });
    noti.onclick = () => {
      window.focus();
      history.replaceState(null, '', '#events');
      switchPage('events');
      noti.close();
    };
    setTimeout(() => { try { noti.close(); } catch (e) {} }, 5000);
  } catch (e) {}
}

const NOTIFY_RECENT_MS = 10 * 60 * 1000;   // 알림 대상 = 발생 10분 이내 이벤트만 (재편입 폭주 가드 — 아래 주석)
// [유튜브만 넓힘 · 2026-08-07] 다른 타입은 e.time이 감지 시각과 거의 같지만(방송 시작/종료) 유튜브는
//   '영상 게시 시각'이라 태생적으로 뒤처진다. RSS 피드에 영상이 올라오기까지 걸리는 시간이 그대로 얹히기 때문.
//   캐시 우회(bust) 적용 후 실측 4건: 150.1 / 390.8 / 403.6 / 649.4초 — 마지막 건이 10분 창을 넘겨 알림이 빠졌다.
//   (캐시 몫은 이제 ≤120초로 묶였다. 남은 변동은 유튜브가 자기 피드에 올리는 시간이라 우리가 못 줄인다.)
// 30분인 이유: 최대 표본의 2.8배. 표본이 4건뿐이라 여유를 크게 잡는다.
//   넓혀도 폭주 위험이 거의 없다 — 재편입이 나도 '30분 내에 게시된 영상'만 통과하는데, 13인이 30분 안에
//   올리는 영상은 많아야 한두 개다. 반면 이 창을 안 넓히면 늦게 잡힌 업로드가 조용히 알림 없이 지나간다.
// [원복 · 2026-08-17] 본선을 UU 피드로 바꾸며 위 실측의 근거가 소멸 — 새 본선 실측 3건은 9.7~30.4초로
//   10분 창에 넉넉히 든다. 30분 유지의 이득은 없고 재편입 사고 때 묵은 알림만 넓게 통과시키므로 기본과 같은
//   10분으로 되돌린다. 분기 구조는 남긴다 — 피드가 다시 늦어지면 이 상수만 다시 넓히면 된다.
const NOTIFY_RECENT_YOUTUBE_MS = 10 * 60 * 1000;
const notifyWindowMs = (e) => (e.type === 'youtube' ? NOTIFY_RECENT_YOUTUBE_MS : NOTIFY_RECENT_MS);

function processNewEventsForNotification(events) {
  // 빈 배열(KV 장애 등 일시적 빈 응답)에 키를 리셋하면 다음 정상 폴링에서 전체가 '새 이벤트'로 판정돼 알림 폭주 → 무시하고 기존 키 유지.
  // 최초 로드가 빈 배열인 경우도 ready=false 유지 → 이후 첫 정상 응답이 조용히 시드(아래 !ready 분기).
  if (!events || events.length === 0) return;
  // 키의 url은 불변이어야 함 — cafe_post는 즉시 해석 실패 시 워커가 사후에 url을 글 직링크로 교체(retryPendingCafeResolves)하는
  // 유일한 타입이라, url을 키에 쓰면 교체 순간 같은 이벤트가 '새 이벤트'로 재판정돼 중복 알림 발생 → 불변인 cafe_name+title로 대체.
  // (같은 초·같은 멤버의 서로 다른 카페 동시 게재도 cafe_name으로 구분 유지. 같은 카페·같은 제목은 워커 ingest가 2분 dedup)
  const eventKey = (e) => `${e.type}|${e.member_id}|${e.time}|${e.type === 'cafe_post' ? `${e.cafe_name || ''}|${e.title || ''}` : (e.url || '')}|${e.after || ''}`;
  if (!lastSeenEventKeysReady) {
    lastSeenEventKeys = new Set(events.map(eventKey));
    lastSeenEventKeysReady = true;
    return;
  }
  // '키에 없음' ≠ '새 이벤트': 키 셋은 매 폴링 현재 응답으로 교체되므로, 옛 이벤트가 응답에 재편입되면
  // (병합 상한 상향 재배포, KV 일시 장애로 리스트 하나가 빠졌다 복귀 등) 통째로 키-신규가 돼 알림이 폭주한다.
  // → 발생 시각이 최근(10분)인 것만 알림 대상. 정상 전달 지연은 감지 10s+flush 5s+폴링 10s 수준이라 충분히 관대하고,
  //   재편입분은 시간상 오래돼 자연 차단. 미확인 뱃지가 시간 기반이라 폭주 없는 것과 같은 원리.
  const nowMs = Date.now();
  const newOnes = events.filter(e => !lastSeenEventKeys.has(eventKey(e)) && (nowMs - new Date(e.time).getTime()) < notifyWindowMs(e));
  lastSeenEventKeys = new Set(events.map(eventKey));
  if (newOnes.length === 0) return;
  const filtered = dedupBattleNotices(newOnes.filter(e => {
    const cat = typeToCat(e.type);
    if (!filterState.types.has(cat)) return false;
    const memberMatch = filterState.members.has(e.member_id);
    const channelMatch = e.channel_id && filterState.members.has(e.channel_id);
    if (cat === 'chat') return memberMatch || channelMatch;
    return memberMatch;
  }));
  if (filtered.length === 0) return;
  if (notifyEnabled) {
    const userIsViewingEvents = (document.visibilityState === 'visible' && currentPage === 'events');
    if (!userIsViewingEvents) {
      filtered.forEach(ev => sendBrowserNotification(ev));
      startTitleFlash(filtered.length);
    }
  }
}

    const cat = typeToCat(e.type);
    if (!filterState.types.has(cat)) return false;
    const memberMatch = filterState.members.has(e.member_id);
    const channelMatch = e.channel_id && filterState.members.has(e.channel_id);
    if (cat === 'chat') return memberMatch || channelMatch;

}

function updateHeaderCenter() {
  const el = document.getElementById('headerCenter');
  if (!el) return;
  let topLine = '';
  if (currentPage === 'live') {
    topLine = lastLiveUpdate ? '10초마다 자동 갱신 · ' + lastLiveUpdate.toLocaleTimeString('ko-KR') + ' 기준' : '';
  } else if (currentPage === 'events') {
    topLine = lastEventsUpdate ? '10초마다 자동 확인 · ' + lastEventsUpdate.toLocaleTimeString('ko-KR') + ' 기준' : '';
  } else if (currentPage === 'stats') {
    topLine = lastStatsUpdate ? '1분마다 자동 갱신 · ' + lastStatsUpdate.toLocaleTimeString('ko-KR') + ' 기준' : '';
  } else if (currentPage === 'chemistry') {
    topLine = lastChemistryUpdate ? '1분마다 자동 갱신 · ' + lastChemistryUpdate.toLocaleTimeString('ko-KR') + ' 기준' : '';
  } else if (currentPage === 'thumbs') {
    topLine = lastStatsUpdate ? '1분마다 자동 갱신 · ' + lastStatsUpdate.toLocaleTimeString('ko-KR') + ' 기준' : '';   // 당월 통계·다시보기 목록은 지난 활동과 같은 1분 폴러가 맡는다
  } else if (currentPage === 'content') {
    topLine = lastContentUpdate ? '열람 시 자동 갱신 · ' + lastContentUpdate.toLocaleTimeString('ko-KR') + ' 기준' : '';
  } else if (currentPage === 'banner') {
    topLine = lastBannerUpdate ? '열람 시 자동 갱신 · ' + lastBannerUpdate.toLocaleTimeString('ko-KR') + ' 기준' : '';
  } else if (currentPage === 'hall') {
    topLine = lastHallUpdate ? '열람 시 자동 갱신 · ' + lastHallUpdate.toLocaleTimeString('ko-KR') + ' 기준' : '';
  } else if (currentPage === 'members') {
    topLine = '';
  }
  // 감지 지연 경고: 심장박동(last_detect_at)이 임계 이상 늙으면 감지가 시간 단위로 도는 4탭의 주기 문구를 교체.
  // 시각도 클라이언트 fetch 시각 대신 서버 마지막 감지 시각으로(감지가 죽어도 fetch는 성공해 시각이 계속 새것처럼 보이는 문제 방지).
  const detectWarn = !!lastServerDetect && (Date.now() - lastServerDetect.getTime() > DETECT_STALE_MS)
    && ['live', 'events', 'stats', 'chemistry'].includes(currentPage);
  if (detectWarn) {
    topLine = '감지 지연 중 · ' + lastServerDetect.toLocaleTimeString('ko-KR') + ' 기준';
  }
  // topLine은 "{주기} · {시각} 기준" 형태. 모바일에서 '·' 기준 2줄 분리를 위해 주기/시각을 스팬으로 감쌈(PC는 inline이라 1줄 동일).
  let topLineHtml = '';
  if (topLine) {
    const sepIdx = topLine.indexOf(' · ');
    topLineHtml = sepIdx >= 0
      ? `<div class="header-center-line"><span class="hc-period${detectWarn ? ' hc-stale' : ''}">${topLine.slice(0, sepIdx)}</span><span class="hc-mid"> · </span><span class="hc-stamp">${topLine.slice(sepIdx + 3)}</span></div>`
      : `<div class="header-center-line">${topLine}</div>`;
  }
  el.innerHTML = `
    ${topLineHtml}
    <div class="header-center-line header-disclaimer">비공식 팬사이트입니다.</div>
  `;
}

// 기둥 — 버튼은 자료(곡이 있는 멤버)가 바뀔 때만 다시 만들고 평소엔 켜짐만 바꾼다(썸네일 탭 멤버 스트립과 같은 태도)
function renderDiscoSide(targets) {
  const box = document.getElementById('discoMembersSide');
  if (!box) return;

  box.querySelectorAll('.cal-tab').forEach(b => b.classList.toggle('active', b.dataset.member === discoState.member));
}

function ensureCalMonth() {
  const ym = calYm();
  if (!statsState.data[ym] && !statsState.loadingMonths.has(ym) && Date.now() - (calStatsFailAt[ym] || 0) > 30000) {
    loadStatsMonth(ym).then(() => { if (!statsState.data[ym]) { calStatsFailAt[ym] = Date.now(); calLoadingSettle(); return; } queueCalRender(); });
  }
  if (calState.type === 'vod') ensureVodMonth(calMember().id, ym);   // 유튜브 종류는 월 통계에 업로드 목록이 들어 있어 따로 받을 것이 없다
}
// 자료 도착에 따른 재렌더를 한 프레임에 한 번으로 합친다(2026-09-02) — 통계와 다시보기 목록이 잇따라 도착해도 한 번만 그린다
// (깜빡임 + 그 사이 클릭 유실 방지). 썸네일 탭이 아니면 그리지 않는다(다음 진입 때 그린다).
let calRenderQueued = false;
let lastCalStatsSig = '';   // 1분 폴러가 썸네일 탭을 다시 그릴지 판단하는 직전 당월 통계 모습
function queueCalRender() {
  if (calRenderQueued) return;
  calRenderQueued = true;
  requestAnimationFrame(() => { calRenderQueued = false; if (currentPage === 'thumbs') renderCalendarTab(); });
}
// 이 달 자료가 아직 오는 중인가(통계 또는 그 멤버의 다시보기 목록) — 요일 머리줄의 '불러오는 중…' 표시용
function calMonthLoading() {
  const ym = calYm();
  if (statsState.loadingMonths.has(ym)) return true;
  return calState.type === 'vod' && vodState.loading.has(vodKey(calMember().id, ym));
}
// 요청이 실패로 끝났을 때 — 더 오는 것이 없으면 표시만 떼어낸다. 다시 그리지 않는 이유: 그리면 ensureCalMonth가 실패한 목록을
// 곧바로 다시 요청해 '실패 → 그림 → 재요청 → 실패'가 맴돈다(도착 성공 때만 다시 그린다는 종전 규칙 유지).
function calLoadingSettle() {
  if (calMonthLoading()) return;
  document.querySelectorAll('#thumbsBody .cal-loading').forEach(el => el.remove());   // 격자 폼·목록 폼에 하나씩 있다
}

// 날짜 → { vods:[{v,at}], youtube:[{y,at}], vodPending, vodFail, count }. 고른 종류만 담는다(칩·대표 그림·상세 모두 그 종류만).
// vodPending = 그날 방송했는데 다시보기 목록이 아직 안 온 상태(상세에 '불러오는 중…'), vodFail = 연달아 실패(상세에 '불러오지 못했습니다').
function calItemsByDate() {
  const ym = calYm(), { year, month } = calState;
  const map = {};
  const day = d => (map[d] = map[d] || { vods: [], youtube: [], vodPending: false, vodFail: false, count: 0 });
  const monthData = statsState.data[ym];
  const m = calMember();
  if (monthData) {
    const sum = computeMonthSummary(monthData[m.id], year, month);   // 첫 달(2025-12)은 결성일 11/30 세션·유튜브도 포함(kstMonthStartMs)
    if (calState.type === 'vod') {
      const seenVod = {};   // 날짜별 이미 센 다시보기 — 두 방송이 같은 다시보기를 가리켜도 한 번만
      for (const [dk, sessions] of Object.entries(sum.sessionsByDate)) {
        const seen = seenVod[dk] || (seenVod[dk] = new Set());
        for (const s of sessions) {
          const parts = vodsForBroad(m.id, ym, s.broad_no);   // null = 목록 미도착 → 칩·그림 보류, 도착 시 재렌더로 채움
          if (parts === null) {
            if (!vodState.data[vodKey(m.id, ym)]) {   // 목록 미도착만 기다린다 — 방송번호 없는 세션은 목록이 와도 못 찾으니 '없음'(세션 70)
              day(dk).vodPending = true;
              if ((vodState.fails[vodKey(m.id, ym)] || 0) >= VOD_FAIL_LIMIT) day(dk).vodFail = true;   // 연달아 실패 — '불러오는 중'이 아니라 '불러오지 못함'
            }
            continue;
          }
          const at = new Date(s.start).getTime();   // 정렬 기준(시각 → 파트)
          for (const v of parts) {
            if (seen.has(v.title_no)) continue;
            seen.add(v.title_no);
            day(dk).vods.push({ v, at });
          }
        }
      }
    } else {
      for (const [dk, ys] of Object.entries(sum.youtubeByDate)) {
        for (const y of ys) day(dk).youtube.push({ y, at: new Date(y.time).getTime() });
      }
    }
  }
  for (const d of Object.values(map)) {
    d.vods.sort((a, b) => a.at - b.at || (a.v.part || 0) - (b.v.part || 0));   // 시각 → 파트(2026-09-02 Crenop 지정 순서에서 멤버 축만 뺀 것)
    d.youtube.sort((a, b) => a.at - b.at);
    d.count = d.vods.length + d.youtube.length;
  }
  return map;
}

// 대표 그림 — 다시보기는 그날 가장 긴 파트(2026-09-06 Crenop: 본방을 잘라 둔 짧은 파트·클립보다 긴 것이 그날의 얼굴),
// 유튜브는 첫 업로드: 길이(롱폼/숏츠)로 고르고 싶었으나 워커의 유튜브 감지(RSS)에는 길이가 없고 주소도 전부 watch?v= 꼴이라 가를 수 없다.
// 다시보기·유튜브 썸네일은 밖에서 오는 그림이라 그대로 쓴다.
function calRepImg(d) {
  if (d.vods.length) {
    const longest = d.vods.reduce((a, b) => ((b.v.duration_ms || 0) > (a.v.duration_ms || 0) ? b : a));   // 같은 길이면 앞 것(시각·파트 순)
    if (longest.v.thumb) return escapeHtml(longest.v.thumb);
  }
  if (d.youtube.length) { const id = ytVideoId(d.youtube[0].y.url); if (id) return `https://i.ytimg.com/vi/${id}/mqdefault.jpg`; }
  return '';
}
function calRepImgTag(d) {
  const img = calRepImg(d);
  return img ? `<img src="${img}" alt="" loading="lazy">` : '';
}
function calChips(d) {   // 고른 종류의 개수 칩 하나
  if (d.vods.length) return chipHtml('vod', CAL_TYPE_ICON.vod, d.vods.length);
  if (d.youtube.length) return chipHtml('youtube', CAL_TYPE_ICON.youtube, d.youtube.length);
  return '';
}

// 달 버튼 잠김 규칙 — 첫 해는 첫 달(12월) 아래를 막고(2025년은 12월 하나, 결성일 11/30 포함), 오지 않은 달은 막는다.
// 지난 활동 기간 선택기(periodSelectorHtml의 minM·maxM)와 같은 규칙 — 시트가 빠져 미래 달을 열 이유가 없어졌다(2026-09-06).
function calMonthDisabled(year, mo) {
  const now = kstNow(), curY = now.getUTCFullYear(), curM = now.getUTCMonth() + 1;
  if (year === STATS_START_YEAR && mo < STATS_START_MONTH) return true;
  return year > curY || (year === curY && mo > curM);
}
function calPeriodHtml() {
  const now = kstNow();
  const curY = now.getUTCFullYear();
  const prevDis = calState.year <= STATS_START_YEAR ? 'disabled' : '';
  const nextDis = calState.year >= curY ? 'disabled' : '';
  const btns = [];
  for (let mo = 1; mo <= 12; mo++) {
    const dis = calMonthDisabled(calState.year, mo) ? 'disabled' : '';
    btns.push(`<button class="stats-period-btn${mo === calState.month ? ' active' : ''}" data-calmonth="${mo}" ${dis}><span class="pb-y">${String(calState.year).slice(2)}년</span><span class="pb-m">${mo}월</span></button>`);
  }
  return `
    <div class="stats-period-row"><button class="stats-month-btn" data-calydir="prev" ${prevDis}>${SVG_ICONS.chevronLeft}</button><div class="stats-period-wrap no-all">${btns.join('')}</div><button class="stats-month-btn" data-calydir="next" ${nextDis}>${SVG_ICONS.chevronRight}</button></div>`;
}

// 고른 날의 타일 전부 — 고른 종류만(다시보기면 그날 다시보기, 유튜브면 그날 유튜브). 한 멤버 화면이라 타일 위 이름줄은 없다.
function calDetailHtml(items) {
  const d = items[calState.selected];
  const head = `<div class="day-detail-title"><span class="ddt-date">${calState.selected}</span></div>`;
  if (!d || !d.count) {
    if (d && d.vodPending) return head + `<div class="ds-vod-none">${d.vodFail ? '다시보기 목록을 불러오지 못했습니다' : '다시보기 목록 불러오는 중'}</div>`;
    return head + `<div class="day-detail-empty">${calState.type === 'vod' ? '그날 다시보기가 없습니다' : '그날 유튜브 업로드가 없습니다'}</div>`;
  }
  const tiles = calState.type === 'vod'
    ? d.vods.map(({ v }) => `<div class="cal-vod">${vodTileHtml(v)}</div>`)
    : d.youtube.map(({ y }) => {
      const id = ytVideoId(y.url);
      return `<div class="cal-vod"><a class="ds-vod" href="${escapeHtml(y.url)}" target="_blank" rel="noopener">` +
        `<span class="ds-vod-thumb">${id ? `<img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt="" loading="lazy">` : ''}</span>` +
        `<span class="ds-vod-title"><span class="ds-vod-tt">${escapeHtml(y.title || '')}</span></span></a></div>`;
    });
  return head + `<div class="cal-vods">${tiles.join('')}</div>`;
}

function renderCalendarTab() {
  const body = document.getElementById('thumbsBody');
  if (!body) return;
  ensureCalMonth();
  const items = calItemsByDate();
  const { year, month } = calState;
  const ym = calYm();
  const t = kstNow();
  const todayKey = `${t.getUTCFullYear()}-${String(t.getUTCMonth() + 1).padStart(2, '0')}-${String(t.getUTCDate()).padStart(2, '0')}`;
  const gridCells = monthGridCells(year, month);   // 앞 빈칸·날짜·첫 달의 결성일(11/30) — 지난 활동 멤버 달력과 같은 배열
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  // 고른 날이 없어도 상세 자리는 늘 잡아 둔다 — 누를 때마다 폭이 변하면 칸이 움직인다(오른쪽 열일 때).
  const detail = calState.selected ? calDetailHtml(items) : '<div class="cal-di-none">날짜를 누르면 그날 썸네일이 전부 나옵니다.</div>';
  const stateCls = (key, d) => [d && d.count ? 'has' : '', calState.selected === key ? 'selected' : '', key === todayKey ? 'today' : ''].filter(Boolean).join(' ');

  // ① 7열 썸네일 칸 — 상단 [날짜 | 칩], 아래 16:9 상자에 대표 그림. 그림 없는 날도 상자를 예약해 행 높이가 안 흔들린다.
  // 앞쪽 빈칸도 .cal-cell — .calendar-day의 정사각 비율(aspect-ratio 1)이 남으면 첫 주 행이 그 높이로 늘어난다(2026-09-02 실측)
  const cells = gridCells.map(c => {
    if (!c) return '<div class="calendar-day cal-cell outside"></div>';
    const { key, dow } = c;
    const d = items[key];
    return `<button class="calendar-day cal-cell ${stateCls(key, d)}" data-caldate="${key}"><span class="cd-top"><span class="calendar-daynum${dow === 0 ? ' sun' : dow === 6 ? ' sat' : ''}">${c.label}</span><span class="cd-chips">${d ? calChips(d) : ''}</span></span><span class="cal-thumb">${d ? calRepImgTag(d) : ''}</span></button>`;
  });
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  const selPos = calState.selected ? gridCells.findIndex(c => c && c.key === calState.selected) : -1;   // 고른 날의 칸 위치(없으면 -1)
  const selIdx = selPos < 0 ? -1 : Math.floor(selPos / 7);
  const weekRows = weeks.map((w, i) => {
    const grid = `<div class="calendar-grid">${w.join('')}</div>`;
    return i === selIdx ? grid + `<div class="cal-detail cal-detail-week">${detail}</div>` : grid;   // 고른 날이 속한 주 바로 아래
  }).join('');
  // 자료가 오는 중이면 요일 머리줄 위 오른쪽(목록 폼은 목록 위)에 '불러오는 중…' — 달력은 막지 않는다(2026-09-02 Crenop 지정). 진행 표시 명사형 규칙.
  const loadingTag = calMonthLoading() ? '<div class="cal-loading">불러오는 중…</div>' : '';
  const gridForm = `<div class="cal-grid-form"><div class="calendar">${loadingTag}`
    + `<div class="calendar-grid cal-head">${WD.map((w, i) => `<div class="calendar-weekday${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}">${w}</div>`).join('')}</div>`
    + weekRows + `</div></div>`;

  // ② 1열 목록 — 그림이 있는 날만 한 행씩. 눌러야 그날 전부(좁으면 그 행 아래, 폭이 남으면 오른쪽 열)
  const dayKeys = Object.keys(items).filter(k => dayInStatsMonth(k, ym) && items[k].count).sort();
  const listRows = dayKeys.map(key => {
    const d = items[key]; const dow = new Date(key + 'T00:00:00Z').getUTCDay();
    const row = `<button class="cal-row ${stateCls(key, d)}" data-caldate="${key}">`
      + `<span class="cal-row-date${dow === 0 ? ' sun' : dow === 6 ? ' sat' : ''}">${Number(key.slice(5, 7))}월 ${Number(key.slice(8))}일 (${WD[dow]})</span>`
      + `<span class="cal-row-thumb">${calRepImgTag(d)}</span>`
      + `<span class="cal-row-body"><span class="cd-chips">${calChips(d)}</span></span></button>`;
    return row + (key === calState.selected ? `<div class="cal-detail cal-detail-row">${detail}</div>` : '');   // 좁은 폭에서만 보이는 자리
  }).join('');
  const listForm = `<div class="cal-list-form">${loadingTag}<div class="cal-rows">${listRows || `<div class="cal-di-none">${calState.type === 'vod' ? '이 달에는 다시보기가 없습니다.' : '이 달에는 유튜브 업로드가 없습니다.'}</div>`}</div><div class="cal-detail cal-list-side">${detail}</div></div>`;

  body.innerHTML = gridForm + listForm;
  body.querySelectorAll('[data-caldate]').forEach(btn => btn.addEventListener('click', () => {
    const k = btn.dataset.caldate;
    calState.selected = (calState.selected === k) ? null : k;
    renderCalendarTab();
  }));
  renderCalSide();
}
// 링크 고르기 모달(세션 70) — 최근 활동의 다시보기 고르기(openVodPickModal)와 같은 패널·타일. 유튜브면 썸네일, 아니면 빈 틀.
// 여는 곳(2026-09-06): 컨텐츠 탭 카드·컨텐츠 모아보기 모달 — 링크가 둘 이상인 카드를 누르면.
// 타일 제목(2026-09-04 Crenop): ① 시트 C열에 적은 제목('주소 제목') ② 없으면 이미 불러온 멤버 유튜브 업로드 자료에서 같은 영상을 찾아 그 제목 + 멤버 이름줄
// ③ 그것도 없으면 사이트 이름(유튜브면 '유튜브 n'). 바깥 조회(유튜브 API) 없음 — 그 채널 영상이 아니면 시트에 제목을 적는 것이 답.
function findLoadedYoutube(videoId) {
  if (!videoId) return null;
  for (const monthData of Object.values(statsState.data || {})) for (const m of MEMBERS) {
    const y = ((monthData[m.id] || {}).youtube || []).find(v => ytVideoId(v.url) === videoId);
    if (y) return { m, y };
  }
  return null;
}
// 숲 다시보기 주소에서 영상 번호(title_no) — 플레이어 주소(vodPlayerUrl과 같은 꼴)만. 아니면 ''.
function soopVodTitleNo(u) { const m = String(u || '').match(/vod\.sooplive\.(?:com|co\.kr)\/player\/(\d+)/i); return m ? m[1] : ''; }   // 앞의 '-'(제외 표시)는 무시하고 번호만
// 컨텐츠 카드의 다시보기 재료: 날짜(YYYY-MM-DD·YYYY-MM)와 참여 멤버 id(G~ 이름을 사이트 멤버로 — 미등록 이름은 뺀다). 날짜나 멤버가 없으면 null.
// exclude(있으면) = C열로 알려 준 제외 영상 번호들.
function contentPickInfo(c) {
  if (!c.date || !c.date.sort) return null;
  const ymd = ymdOf(c.date);
  const members = (c.members || []).map(n => { const m = MEMBERS.find(x => x.name === String(n).trim()); return m ? m.id : ''; }).filter(Boolean);
  return members.length ? { ymd, ym: ymd.slice(0, 7), members } : null;
}
// 그날 참여 멤버들의 다시보기 타일 — 재료는 썸네일 탭과 같다(월 통계의 세션 → 방송번호 → 다시보기 목록). 멤버마다 이름줄을 단다.
// 순서 = 사이트 멤버 순서 → 시각·파트(2026-09-06 Crenop: 시트로 뒤늦게 넣은 것도 제 멤버 자리에). 시트 포함(pick.include)의 멤버는
//   ① 불러온 목록 어디든(참여자·달을 안 가림) 같은 번호가 있으면 그 멤버·그 자료(온전한 타일) — 자동 목록에서 빠진 이유가 날짜(방송 시작일이 컨텐츠 날짜와 다름,
//      달이 바뀌는 밤)일 때 이 길로 잡힌다. 그 달에 없으면 여는 쪽이 참여자들의 전달 목록도 받는다(prevYmOf).
//   ② 없으면 시트 제목의 첫 낱말이 멤버 이름일 때 그 멤버(이름은 제목에서 뗀다 — 19금·구독+처럼 목록 자체에 안 잡히는 것) ③ 그도 아니면 맨 뒤.
// pending = 월 통계나 누군가의 목록(전달 포함)이 아직 안 왔다(요청은 여는 쪽이 한다).
function prevYmOf(ym) { const [y, m] = ym.split('-').map(Number); return m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, '0')}`; }
// 불러온 다시보기 목록 전부(멤버·달 안 가림)에서 영상 번호로 찾는다 — { m: 멤버, v: 항목 } 또는 null
function findLoadedVod(titleNo) {
  for (const [key, list] of Object.entries(vodState.data || {})) {
    const v = (list || []).find(x => String(x.title_no) === String(titleNo));
    if (v) { const m = MEMBER_BY_ID[key.split('|')[0]]; if (m) return { m, v }; }
  }
  return null;
}
function pickVodTiles(pick) {
  const monthData = pick.ym ? statsState.data[pick.ym] : null;
  if (pick.ym && !monthData) return { html: '', pending: true };
  const [y, mo] = pick.ym ? pick.ym.split('-').map(Number) : [0, 0];
  const mi = id => { const k = MEMBERS.findIndex(x => x.id === id); return k < 0 ? 999 : k; };
  const whoLine = m => `<span class="cal-vod-who"><img src="${m.img}" alt="">${escapeHtml(m.name)}</span>`;
  const items = [];   // { mi: 멤버 순서, k: 같은 멤버 안 순서, html }
  const shown = new Set();   // 이미 그린 영상 번호 — 시트 포함이 자동 목록과 겹치면 한 번만
  let pending = false;
  const members = [...pick.members].sort((a, b) => mi(a) - mi(b));
  if (monthData) for (const id of members) {
    const m = MEMBER_BY_ID[id]; if (!m) continue;
    const sessions = computeMonthSummary(monthData[id], y, mo).sessionsByDate[pick.ymd] || [];
    const seen = new Set();
    for (const s of sessions) {
      const parts = vodsForBroad(id, pick.ym, s.broad_no);
      if (parts === null) { if (!vodState.data[vodKey(id, pick.ym)]) pending = true; continue; }
      for (const v of parts) {
        if (seen.has(v.title_no)) continue;
        seen.add(v.title_no);
        if ((pick.exclude || []).includes(String(v.title_no))) continue;   // 시트가 뺀 것('-' 표시)
        shown.add(String(v.title_no));
        items.push({ mi: mi(id), k: items.length, html: `<div class="cal-vod">${whoLine(m)}${vodTileHtml(v)}</div>` });
      }
    }
  }
  (pick.include || []).forEach((it, i) => {
    if (shown.has(String(it.no))) return;
    shown.add(String(it.no));
    const hit = findLoadedVod(it.no);   // ① 불러온 목록 어디든
    if (hit) { items.push({ mi: mi(hit.m.id), k: items.length, html: `<div class="cal-vod">${whoLine(hit.m)}${vodTileHtml(hit.v)}</div>` }); return; }
    if (pick.ym && members.some(id => vodState.loading.has(vodKey(id, prevYmOf(pick.ym))))) pending = true;   // 전달 목록이 오는 중이면 기다린다
    const words = String(it.title || '').trim().split(/\s+/);
    const named = MEMBERS.find(x => x.name === words[0]);   // ② 제목 첫 낱말 = 멤버 이름
    const label = named ? (words.slice(1).join(' ') || '다시보기') : (it.title || `다시보기 ${i + 1}`);
    // 목록 밖(19금·구독+ 등)은 시트 제목만 단 빈 틀 — 링크 고르기의 유튜브 아닌 링크와 같은 모양
    items.push({ mi: named ? mi(named.id) : 999, k: items.length, html: `<div class="cal-vod">${named ? whoLine(named) : ''}<a class="ds-vod" href="${escapeHtml(it.url)}" target="_blank" rel="noopener"><span class="ds-vod-thumb"></span><span class="ds-vod-title"><span class="ds-vod-tt">${escapeHtml(label)}</span></span></a></div>` });
  });
  items.sort((a, b) => a.mi - b.mi || a.k - b.k);
  return { html: items.map(x => x.html).join(''), pending };
}
let linkPickToken = 0;   // 열 때마다 하나씩 — 도착 감시가 닫힌 모달이나 다른 내용의 모달을 건드리지 않게
// 숲 게시글 주소(sooplive.com/station/아이디/post/번호) — 일정 행이 예고 글을 C열에 달아 두는 꼴(2026-09-06 Crenop). 번호만 돌려준다.
function soopPostNo(u) { const m = String(u || '').match(/sooplive\.(?:com|co\.kr)\/station\/[^/]+\/post\/(\d+)/i); return m ? m[1] : ''; }
// 불러온 월 통계(멤버 글 목록)에서 같은 게시글을 찾는다 — 제목·멤버 이름줄용(findLoadedYoutube와 같은 태도, 바깥 조회 없음)
function findLoadedPost(postNo) {
  if (!postNo) return null;
  for (const monthData of Object.values(statsState.data || {})) for (const m of MEMBERS) {
    const p = ((monthData[m.id] || {}).posts || []).find(x => soopPostNo(x.url) === postNo);
    if (p) return { m, p };
  }
  return null;
}
function openLinkPickModal(links, title, pick) {
  const head = document.getElementById('lrHead'), body = document.getElementById('lrBody');
  if (!head || !body) return;
  modalPanel('vod-pick-panel');
  head.innerHTML = `<span>영상 선택${title ? ` — ${escapeHtml(title)}` : ''}</span><button class="lr-close" type="button" onclick="closeModal()">✕</button>`;
  // 수동 링크는 종류별 구획(2026-09-06 Crenop: 게시글 링크가 '유튜브'로 묶이던 것): 유튜브(썸네일) · 게시글(숲 글 — 제목은 시트 > 불러온 글 목록 > '게시글') · 링크(그 밖).
  // 구획 그림·색 = 최근 활동의 종류 그림·색(유튜브 빨강 · 게시글 board 에메랄드 · 링크 사슬 무채).
  const groups = { youtube: [], post: [], link: [] };
  (links || []).forEach((it, i) => {
    const u = typeof it === 'string' ? it : it.url, manual = typeof it === 'string' ? '' : (it.title || '');
    const id = ytVideoId(u), postNo = id ? '' : soopPostNo(u);
    const found = manual ? null : (id ? findLoadedYoutube(id) : (postNo ? findLoadedPost(postNo) : null));
    let host = ''; try { host = new URL(u).hostname.replace(/^www\./, ''); } catch (e) {}
    const label = manual || (found && (found.y ? found.y.title : found.p.title)) || (id ? `유튜브 ${i + 1}` : postNo ? '게시글' : (host || `링크 ${i + 1}`));
    const who = found ? `<span class="cal-vod-who"><img src="${found.m.img}" alt="">${escapeHtml(found.m.name)}</span>` : '';
    groups[id ? 'youtube' : postNo ? 'post' : 'link'].push(`<div class="cal-vod">${who}<a class="ds-vod" href="${escapeHtml(u)}" target="_blank" rel="noopener"><span class="ds-vod-thumb">${id ? `<img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt="" loading="lazy">` : ''}</span>`
      + `<span class="ds-vod-title"><span class="ds-vod-tt">${escapeHtml(label)}</span></span></a></div>`);
  });
  const SEC = { youtube: ['youtube', '유튜브'], post: ['board', '게시글'], link: ['link', '링크'] };
  const secHtml = (k) => groups[k].length ? `<div class="vod-pick-sec" data-kind="${k}">${SVG_ICONS[SEC[k][0]]}<span>${SEC[k][1]}</span></div><div class="ds-vods">${groups[k].join('')}</div>` : '';
  const tiles = secHtml('youtube') + secHtml('post') + secHtml('link');
  if (!pick) { body.innerHTML = tiles || '<div class="vod-pick-empty">링크가 없습니다.</div>'; showModal(); return; }
  // 수동 링크(유튜브 편집본 등) 위, 그날 다시보기 아래. 다시보기 재료는 지금 요청하고 도착하는 대로 그 칸만 다시 그린다(0.4초마다 최대 15초).
  const token = ++linkPickToken;
  const paint = (gaveUp) => {
    const r = pickVodTiles(pick);
    const vodBody = r.html ? `<div class="ds-vods">${r.html}</div>`
      : `<div class="vod-pick-empty">${r.pending ? (gaveUp ? '다시보기 목록을 불러오지 못했습니다.' : '다시보기 목록 불러오는 중') : '그날 다시보기가 없습니다.'}</div>`;
    body.innerHTML = tiles + `<div class="vod-pick-sec" data-kind="vod">${SVG_ICONS.soop}<span>다시보기</span></div>` + vodBody;
    return r.pending;
  };
  // 시트 포함 중 불러온 목록에 없는 번호가 있으면 참여자들의 전달 목록도 받는다(월경 밤 방송 — 컨텐츠 날짜와 방송 시작일의 달이 다르다)
  const unresolved = (pick.include || []).some(it => !findLoadedVod(it.no));
  if (paint(false) || (unresolved && pick.ym)) {
    if (pick.ym && !statsState.data[pick.ym] && !statsState.loadingMonths.has(pick.ym)) loadStatsMonth(pick.ym);
    pick.members.forEach(id => ensureVodMonth(id, pick.ym));
    if (unresolved && pick.ym) pick.members.forEach(id => ensureVodMonth(id, prevYmOf(pick.ym)));
    let n = 0;
    const iv = setInterval(() => {
      const ov = document.getElementById('lrOverlay');
      if (token !== linkPickToken || !ov || ov.hidden) { clearInterval(iv); return; }
      if (!paint(++n >= 37)) clearInterval(iv);
      else if (n >= 37) clearInterval(iv);
    }, 400);
  }
  showModal();
}
// 링크가 둘 이상인 카드(data-links)를 누르면 고르기 모달 — 컨텐츠 탭·컨텐츠 모아보기 모달 공용 배선(그린 뒤 한 번 부른다)
function bindLinkPicks(root) {
  if (!root) return;
  root.querySelectorAll('[data-links]').forEach(el => el.addEventListener('click', () => {
    let links = [], pick = null; try { links = JSON.parse(el.dataset.links); } catch (e) {}

}

// 기둥 — 멤버 스트립(13, 한 번만 만들고 활성만 갱신) · 종류 버튼(통계 탭 종류 버튼 문법, 한 번만 만들고 활성만 갱신) · 연/월(해가 바뀔 때만 다시 만듦)
function renderCalSide() {
  const mBox = document.getElementById('calMembersSide');
  if (mBox && !mBox.dataset.inited) {
    mBox.dataset.inited = '1';
    mBox.innerHTML = MEMBERS.map(m =>
      `<button class="cal-tab" data-member="${m.id}" title="${escapeHtml(m.name)}"><img src="${m.img}" alt="${escapeHtml(m.name)}"></button>`).join('');
    mBox.querySelectorAll('.cal-tab').forEach(b => b.addEventListener('click', () => {
      calState.member = b.dataset.member;
      calState.selected = null;   // 다른 사람의 달로 옮기면 고른 날도 푼다 — 그 사람 그날 타일이 열려 있는 것처럼 보이지 않게
      renderCalendarTab();
    }));
  }
  if (mBox) mBox.querySelectorAll('.cal-tab').forEach(b => b.classList.toggle('active', b.dataset.member === calState.member));
  const kBox = document.getElementById('calKindBox');
  if (kBox && !kBox.dataset.inited) {
    kBox.dataset.inited = '1';
    kBox.innerHTML = CAL_KINDS.map(k => `<button class="hall-kind-btn" data-kind="${k.key}" type="button">${SVG_ICONS[k.icon]}<span>${k.label}</span></button>`).join('');
    kBox.querySelectorAll('.hall-kind-btn').forEach(b => b.addEventListener('click', () => {
      if (b.dataset.kind === calState.type) return;
      calState.type = b.dataset.kind;
      renderCalendarTab();
    }));
  }
  if (kBox) kBox.querySelectorAll('.hall-kind-btn').forEach(b => b.classList.toggle('active', b.dataset.kind === calState.type));
  // 기간 버튼은 연도가 바뀔 때만 다시 만든다(2026-09-02, 69번). 종전엔 그릴 때마다 통째로 새로 만들었는데, 처음 여는 달은
  // 통계·다시보기 목록이 도착할 때마다 다시 그려져 그 1~2초 사이의 클릭이 갈아끼워진 버튼과 함께 사라졌다
  // (Crenop: "특정 월로 넘어갈 때 한 번에 안 넘어간다"). 멤버·종류 버튼처럼 한 번 만들고 켜짐·잠김만 바꾼다.
  const side = document.getElementById('calPeriodSide');
  if (side && side.dataset.year === String(calState.year)) {
    side.querySelectorAll('[data-calmonth]').forEach(b => {
      const mo = Number(b.dataset.calmonth);
      b.classList.toggle('active', mo === calState.month);
      b.disabled = calMonthDisabled(calState.year, mo);
    });
  } else if (side) {
    side.dataset.year = String(calState.year);
    side.innerHTML = calPeriodHtml();
    side.querySelectorAll('[data-calmonth]').forEach(b => b.addEventListener('click', () => {
      calState.month = Number(b.dataset.calmonth); calState.selected = null; renderCalendarTab();
    }));
    side.querySelectorAll('[data-calydir]').forEach(b => b.addEventListener('click', () => {
      const now = kstNow();
      const y = calState.year + (b.dataset.calydir === 'prev' ? -1 : 1);
      if (y < STATS_START_YEAR || y > now.getUTCFullYear()) return;
      calState.year = y; calState.selected = null;
      if (y === STATS_START_YEAR && calState.month < STATS_START_MONTH) calState.month = STATS_START_MONTH;   // 2025년으로 내려가면 12월로
      else if (y === now.getUTCFullYear() && calState.month > now.getUTCMonth() + 1) calState.month = now.getUTCMonth() + 1;   // 올해로 올라오면 오지 않은 달은 이번 달로
      renderCalendarTab();
    }));
  }
}

// ══ 컨텐츠 신청 (2026-08-31) ═══════════════════════════════════════════════
// 흐름: 신청 → 좋아요가 필요 → 순위로 충분한지 판단. 그래서 한 탭에 요청 목록과 순위를 같이 둔다.
// 좌: 멤버들의 좋아요 요청 댓글, 우: 컨텐츠별 버튼 → 누르면 그 컨텐츠의 우리 멤버 순위.
// 좋아요 요청·순위 모달은 2026-08-31 폐지 — 여는 곳이 여기 하나뿐이어야 '어느 쪽이 본체인가'가 안 갈린다.
let applyRankPost = null;
let applyTimer = null;
function stopApplyPoll() { if (applyTimer) { clearInterval(applyTimer); applyTimer = null; } }


// 순위 내용을 목록 안의 '자리'에 그대로 옮겨 적는다. 요소 자체를 옮기지 않는 이유는, 목록을 다시 그릴 때
// 그 부모의 내용이 통째로 새로 쓰여 옮겨 둔 요소가 함께 사라지기 때문이다(순위가 영영 안 나오던 원인).
function placeApplyRank() {
  const src = document.getElementById('applyRankBody');
  const slot = document.querySelector('.apply-rank-slot');
  if (src && slot && slot.innerHTML !== src.innerHTML) slot.innerHTML = src.innerHTML;
}
window.addEventListener('resize', () => { if (likeReqShown) renderLikeReqBody(); placeApplyRank(); });
// 우측 칸의 순위가 바뀌면(불러오는 중 → 표) 자리도 따라 바뀐다
(function () {
  const src = document.getElementById('applyRankBody');
  if (src && window.MutationObserver) new MutationObserver(placeApplyRank).observe(src, { childList: true, subtree: true });
})();

function clearApplyRank() {
  applyRankPost = null;
  stopApplyPoll();
  const body = document.getElementById('applyRankBody');
  if (body) body.innerHTML = '<div class="lr-msg">컨텐츠를 고르면 순위가 나옵니다.</div>';
  document.body.classList.remove('apply-rank-on');
  renderLikeReqBody();

}

function selectApplyRank(titleNo) {
  applyRankPost = titleNo;
  document.body.classList.add('apply-rank-on');
  rankOpenPost = titleNo;
  likeRankTarget = 'applyRankBody';
  if (likeReqShown) renderLikeReqBody();   // 고른 표시를 행 버튼에 반영
  placeApplyRank();

  if (body) body.innerHTML = '<div class="lr-msg">불러오는 중…</div>';
  loadLikeRanking();
  stopApplyPoll();
  const btn = likeRankBtns.find(b => b.titleNo === titleNo);
  const sec = (btn && btn.refresh) || RANK_REFRESH_DEFAULT;
  // 탭이 화면에 없으면 멈춘다 — 모달 쪽 폴링이 '순위 모달이 떠 있는가'로 판단하는 것과 같은 역할.
  applyTimer = setInterval(() => {
    const p = document.getElementById('page-apply');

}

function renderApply() {
  const body = document.getElementById('applyReqBody');
  if (!body) return;
  likeReqTarget = 'applyReqBody';
  body.innerHTML = '<div class="lr-msg">불러오는 중…</div>';
  Promise.all([fetch(WORKER_URL + '/like-requests').then(r => r.json()), preloadLikeHide()])
    .then(([data, hideSet]) => {
      if (likeReqTarget !== 'applyReqBody') return;   // 그 사이 모달이 열려 대상이 바뀌었으면 덮어쓰지 않는다
      likeReqCache = dedupeLikeReqs(data.like_requests || []);
      lsSet(LS_LIKEREQ_CACHE, JSON.stringify(likeReqCache));
      likeReqShown = likeReqCache.filter(e => !(hideSet.has(fullLikeUrl(e.url)) || hideSet.has(normLikeUrl(e.url))));
      const seen = lsKeySet(LS_LIKE_SEEN);
      likeReqNewSet = new Set(likeReqShown.map(likeReqKey).filter(k => !seen.has(k)));
      renderLikeReqBody();
      placeApplyRank();   // 목록을 다시 그리면 머리 요소가 새로 나므로 순위도 다시 그 아래로
      lsKeyAdd(LS_LIKE_SEEN, likeReqShown.map(likeReqKey));
      refreshLikeDot();
    })
    .catch(() => { if (likeReqTarget === 'applyReqBody') body.innerHTML = '<div class="lr-msg">불러오기에 실패했습니다. 잠시 후 다시 시도해 주십시오.</div>'; });
}

document.addEventListener('click', e => {
  const b = e.target.closest('.lrg-rank-btn');

function switchPage(page, opts) {
  if (!VALID_PAGES.includes(page)) page = 'live';
  if (currentPage === 'events' && page !== 'events') {
    setLastSeenToNow();
    refreshUnreadIndicator();
  }
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.page === page);
  });
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  updateHeaderCenter();
  // 최애 기본 선택(세션 70, Crenop 확정): 탭에 들어올 때마다 최애로 맞춘다 — 손으로 다른 멤버를 골랐어도 나갔다 돌아오면 다시 최애.
  // 예외는 명시 주소(#members:crew·#stats:chebi 등 공유 링크·뒤로가기)뿐. 최애가 없으면 종전 기본값 그대로.
  const favNow = favMemberId(), keepPick = !!(opts && opts.fromHash && opts.explicit);
  if (favNow && !keepPick) {
    if (page === 'members') membersState.selectedTab = favNow;
    if (page === 'stats' && statsState.selectedTab !== favNow) selectStatsTab(favNow, { fromHash: true });   // 그 멤버의 최근 활동 달·날짜도 같이 잡는다
    if (page === 'thumbs' && calState.member !== favNow) { calState.member = favNow; calState.selected = null; }
    if (page === 'disco') discoState.member = favNow;   // 곡이 없는 최애면 renderDisco가 크루로 되돌린다(2026-09-06)
  }
  // 최애 강조·자동 스크롤(2단계): 멤버별 구획이 늘어서는 탭은 그려진 뒤 최애 자리로 한 번 내려간다(favScrollPending)
  if (favNow && FAV_SCROLL_PAGES.includes(page)) favArm(page); else favScrollPending = '';
  if (page === 'stats' && !statsState.tabsInited) {
    initStatsTabs();
    statsState.tabsInited = true;

  // 지난 활동은 들어올 때마다 다시 그린다(2026-09-03): 보는 달(statsState.viewMonth)을 통계 탭과 나눠 쓰므로 거기서 달을 바꾸면

// 주소 형식: #<탭>  또는  #members:<영문명> / #stats:<영문명>  (예: #members:dalta, #stats:chunyang)
// 하위탭 없음/전체는 접미사 없이 #members · #stats. 대소문자는 무시하고 읽는다.
// 옛 형식(#members:dalta20 — 숲 아이디)도 계속 해석한다: 기념일 박스가 2026-08-31 이전까지 그 형식을 링크로
// 뿌려왔기 때문. 다만 legacy=true로 표시해 두고, 화면을 띄운 직후 주소를 영문명 형식으로 바꿔 쓴다
// (syncHash) — 주소창에 아이디가 남지 않고, 앞으로 복사되는 주소는 전부 영문명 형식이 된다.
// 지난 활동의 기본값이 'all'이던 것을 첫 멤버로 바로잡음(2026-09-02): '통합' 하위탭은 2026-08-31에 통계 탭으로 옮기며
// 없어졌는데 이 표만 남아, #stats로 새로고침하면 selectStatsTab('all') → 있지도 않은 멤버 'all'을 그리려다
// 본문이 통째로 비었다(탭을 눌러 들어가면 selectedTab이 비어 있어 첫 멤버로 그려져 멀쩡했다 — 헤드리스 대조로 확인).
const SUBTAB_PAGES = { members: 'crew', stats: MEMBERS[0].id };   // 하위탭을 가진 탭 → 그 탭의 '접미사 없음' 기본값(주소 문법의 기준)
// ── 최애 멤버(2026-09-03 세션 70 1단계) ── 크루 팬이 아니라 한 멤버의 팬을 위한 선택 사항. 이 브라우저에만 저장(서버에 안 보냄).
// 효과(1단계): 한 명을 고르는 화면의 첫 선택이 최애가 된다 — 지난 활동(구 첫 멤버 고정)·프로필(구 크루)·달력(구 전체).
// 주소로 들어온 지정(공유 링크 #stats:chebi 등)은 최애보다 우선. 최애가 크루에서 빠지면 없는 것으로 본다.
// 2단계(예정): 멤버별 구획이 세로로 늘어서는 화면(통계 지표·시간대·음악·생방송·케미)에서 그 자리 강조 + 자동 스크롤.
// 하위탭의 '기본값' = 최애가 있으면 최애, 없으면 주소 문법의 기준값. 접미사 없는 주소(#stats·#members)와 첫 진입이 이걸 쓴다.
function defaultSubTab(page) { const fav = favMemberId(); return (fav && SUBTAB_PAGES[page]) ? fav : (SUBTAB_PAGES[page] || null); }
function parseHash(hash) {
  const raw = decodeURIComponent((hash || '').replace('#', ''));
  const i = raw.indexOf(':');
  const page = (i === -1 ? raw : raw.slice(0, i)) || 'live';
  if (i === -1 || !SUBTAB_PAGES[page]) return { page, subTab: defaultSubTab(page), legacy: false, explicit: false };
  const key = raw.slice(i + 1).trim();
  const lower = key.toLowerCase();
  if (!key) return { page, subTab: defaultSubTab(page), legacy: false, explicit: false };
  if (lower === SUBTAB_PAGES[page]) return { page, subTab: SUBTAB_PAGES[page], legacy: false, explicit: true };   // #members:crew — 최애가 있어도 크루로(명시 접미사)
  if (MEMBER_BY_EN[lower]) return { page, subTab: MEMBER_BY_EN[lower].id, legacy: lower !== key, explicit: true };
  if (MEMBER_BY_ID[key]) return { page, subTab: key, legacy: true, explicit: true };   // 옛 아이디 형식 — 뜬 뒤 주소 교체
  return { page, subTab: defaultSubTab(page), legacy: true, explicit: false };         // 알 수 없는 값은 기본 하위탭으로
}

// 현재 화면(탭 + 하위탭)에 해당하는 주소 문자열. 하위탭이 기준값이면 접미사를 붙이지 않는다 —
// 단 최애가 있으면 늘 붙인다(#stats:chebi·#members:crew): 접미사 없는 주소는 '내 최애'라는 뜻이 되어, 공유 링크와 뒤로가기가 사람마다 다르게 열리면 안 된다.
function hashFor(page, subTab) {
  const base = SUBTAB_PAGES[page];
  if (!base || !subTab) return '#' + page;
  if (subTab === base && !favMemberId()) return '#' + page;
  const m = MEMBER_BY_ID[subTab];
  return '#' + page + ':' + (m ? m.en : subTab);
}
// 주소 기록. push=true면 뒤로가기로 되돌아올 수 있게 한 칸 쌓고, false면 현재 칸을 덮어쓴다.
// 같은 주소면 아무것도 하지 않는다 — 같은 탭을 다시 눌러 뒤로가기가 헛도는 것 방지.
function syncHash(push) {
  const want = hashFor(currentPage, currentPage === 'members' ? membersState.selectedTab
    : currentPage === 'stats' ? statsState.selectedTab : null);
  if (location.hash === want) return;
  if (push) history.pushState(null, '', want);
  else history.replaceState(null, '', want);
}

// 주소가 가리키는 화면으로 이동(부팅·뒤로가기 공용). 하위탭은 값이 없어도 기본값으로 되돌린다 —
// #members:dalta 에서 #members 로 뒤로 갔을 때 크루 탭으로 돌아오지 않던 문제.
function applyHash(h) {
  const sub = h.subTab || SUBTAB_PAGES[h.page] || null;
  // 명시 접미사(#members:crew·#stats:chebi)는 최애보다 우선(세션 70) — switchPage에 explicit을 넘겨 진입 시 최애로 되돌리지 않게 한다
  if (h.page === 'members') {
    membersState.selectedTab = sub;            // 상태를 먼저 — switchPage의 초기화·렌더가 이 값을 읽는다
    switchPage(h.page, { fromHash: true, explicit: !!h.explicit });
    syncSubTabActive('.members-tab', sub);     // 남은 건 버튼 활성 표시뿐(다시 그리지 않음)
  } else if (h.page === 'stats') {
    switchPage(h.page, { fromHash: true, explicit: !!h.explicit });
    selectStatsTab(sub, { fromHash: true });   // 멤버별 최근 활동월·날짜를 잡아주는 로직이 여기 있어 그대로 태운다
  } else {
    switchPage(h.page, { fromHash: true });
  }
}
function syncSubTabActive(sel, tabId) {
  document.querySelectorAll(sel).forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
}

function preloadImages(srcs) {
  const list = (srcs || []).filter(Boolean);
  if (list.length === 0) return;
  const run = () => list.forEach(src => { const im = new Image(); im.src = src; });

  else setTimeout(run, 1500);
}

function formatBtime(seconds) {
  if (!seconds || seconds <= 0) return null;
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (h > 0) return h + '시간 ' + m + '분';
  return m + '분';
}
function formatRelTime(iso) {
  const now = new Date();
  const t = new Date(iso);
  const diff = Math.floor((now - t) / 1000);
  if (diff < 60) return '방금 전';
  if (diff < 3600) return Math.floor(diff / 60) + '분 전';
  if (diff < 86400) return Math.floor(diff / 3600) + '시간 전';
  return Math.floor(diff / 86400) + '일 전';
}
// 사이트 날짜 표시 통일(한글 'YYYY년 M월 D일'). 연도 없는 생일(M월 D일)·월 단위 라벨(YYYY년 M월)은 별도 범주라 미적용.
function koDate(y, m, d) { return `${y}년 ${m}월 ${d}일`; }
function kstNow() { return new Date(Date.now() + 9 * 3600 * 1000); }   // 뷰어 TZ 무관 현재 KST — getUTC*로 읽음
// ── 만료형 날짜 공통 파서(2026-08-19) ────────────────────────────────────────────
// 시트의 만료·기한 칸을 한 곳에서 해석한다: 'YYYY-MM-DD' = 그날 KST 자정(23:59:59.999)까지, 'YYYY-MM-DD HH:mm' = 그 분까지.
// 반환은 만료 시각 epoch ms, 형식 밖·빈 값은 null — "빈 칸을 어떻게 볼지"는 시트마다 달라(숨김=즉시 숨김, 상단바=무기한 노출,
// 휴방=미표시) 여기서 정하지 않고 호출부가 정한다. 날짜부 관대 규칙은 종전 숨김 B열과 동일(. / 구분·한 자리 월일·구분자 주변 공백).
// 비교는 항상 Date.now() vs 반환값. +09:00 접미 ISO로 만들어 뷰어 TZ 무관(로컬 게터 미사용) — 워커에 이식해도 그대로 동작.
function kstExpiryMs(raw) {
  const v = String(raw || '').trim().replace(/\s*([.\/-])\s*/g, '$1');
  const m = v.replace(/[.\/]/g, '-').replace(/-+(?= |$)/, '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?$/);
  if (!m) return null;
  const mo = m[2].padStart(2, '0'), da = m[3].padStart(2, '0');
  const hh = m[4] === undefined ? '23' : m[4].padStart(2, '0');
  const mi = m[4] === undefined ? '59' : m[5];
  if (+mo < 1 || +mo > 12 || +da < 1 || +da > 31 || +hh > 23 || +mi > 59) return null;
  const t = new Date(`${m[1]}-${mo}-${da}T${hh}:${mi}:59.999+09:00`).getTime();
  if (Number.isNaN(t)) return null;
  const k = new Date(t + 9 * 3600 * 1000);   // 달력 검증: V8은 2/31을 NaN이 아니라 3/3으로 굴린다(실측) → KST로 되읽어 일치 확인
  if (k.getUTCFullYear() !== +m[1] || k.getUTCMonth() + 1 !== +mo || k.getUTCDate() !== +da) return null;
  return t;
}
// KST YYYY-MM-01 00:00의 epoch ms (월 경계 필터). 첫 달(STATS_FIRST_YM)만 결성일로 하루 앞당긴다 — [11/30 00:00, 1/1 00:00).
// month1은 13도 받는다(다음 해 1월 = 그 달의 끝). 워커 kstMonthStartMs와 같은 규칙.
function kstMonthStartMs(year, month1) {
  const ms = Date.UTC(year, month1 - 1, 1) - 9 * 3600 * 1000;
  return (`${year}-${String(month1).padStart(2, '0')}` === STATS_FIRST_YM) ? ms - 86400000 : ms;
}
// 날짜 키('YYYY-MM-DD')가 'YYYY-MM' 달에 속하나 — 결성일만 첫 달에 얹힌다. 문자열 접두 비교를 이 함수로 통일(월 소속 판정 4곳).
function dayInStatsMonth(dk, ym) { return dk === CREW_START_DAY ? ym === STATS_FIRST_YM : dk.startsWith(ym); }
// 그 달의 일수 — 첫 달은 결성일 하루가 더해져 32일('방송 일수 N일 / 32일').
function statsDaysInMonth(year, month1) { return daysInMonth(year, month1) + (`${year}-${String(month1).padStart(2, '0')}` === STATS_FIRST_YM ? 1 : 0); }
// 달력 칸 배열 — 앞 빈칸(null) + 그 달의 날짜 {key, label, dow}. 첫 달은 결성일 11/30을 앞 빈칸 자리에 넣는다:
// 2025-12-01이 월요일이라 앞 빈칸이 일요일 하나뿐이고 결성일이 바로 그 일요일이다(줄이 늘지 않는다). 칸 글자는 '11/30' —
// 1 왼쪽에 '30'만 있으면 오타로 읽힌다(2026-09-02 Crenop 동의). 지난 활동 멤버 달력과 달력 탭이 같은 배열을 쓴다.
function monthGridCells(year, month1) {
  const ym = `${year}-${String(month1).padStart(2, '0')}`;
  const lead = new Date(Date.UTC(year, month1 - 1, 1)).getUTCDay();
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(null);
  if (ym === STATS_FIRST_YM) {
    const d = new Date(CREW_START_DAY + 'T00:00:00Z');
    if (d.getUTCDay() < lead) cells[d.getUTCDay()] = { key: CREW_START_DAY, label: `${d.getUTCMonth() + 1}/${d.getUTCDate()}`, dow: d.getUTCDay() };
  }
  for (let dn = 1; dn <= daysInMonth(year, month1); dn++) cells.push({ key: ymdKey(year, month1, dn), label: String(dn), dow: (lead + dn - 1) % 7 });
  return cells;
}
function formatAbsTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const k = new Date(d.getTime() + 9 * 3600 * 1000);
  const hh = String(k.getUTCHours()).padStart(2, '0');
  const mi = String(k.getUTCMinutes()).padStart(2, '0');
  return `<span class="ev-abs-d">${koDate(k.getUTCFullYear(), k.getUTCMonth() + 1, k.getUTCDate())}</span> <span class="ev-abs-t">${hh}:${mi}</span>`;   // 날짜·시간 분리 span. 기본 1줄, 좁은 화면(≤480px)에서만 CSS로 2줄
}
function formatHHMM(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const k = new Date(d.getTime() + 9 * 3600 * 1000);
  return `${String(k.getUTCHours()).padStart(2,'0')}:${String(k.getUTCMinutes()).padStart(2,'0')}`;
}
function formatDuration(ms) {
  if (!ms || ms <= 0) return '0분';
  const totalMin = Math.floor(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h > 0) return `${h}시간 ${m}분`;
  return `${m}분`;
}
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
// SOOP 게시판(/board) 폴백 링크에 텍스트 조각(#:~:text=)을 부착 → 브라우저가 게시판 목록에서 해당 글 제목으로 스크롤·강조.
// 대상: 애청자 전용 글 등 정밀 링크로 업그레이드되지 않는 board형 링크. 미지원 브라우저·제목 미표시 시 fragment는 조용히 무시됨.
function withTextFragment(url, title) {
  if (!url || !title || !/\/board$/.test(url)) return url;
  const frag = encodeURIComponent(title).replace(/-/g, '%2D');  // '-'는 텍스트 조각 문법의 prefix/suffix 구분자라 추가 인코딩 필요
  return `${url}#:~:text=${frag}`;
}
function soopProfileUrl(userId) {
  const prefix = userId.substring(0, 2);
  return `https://profile.img.sooplive.com/LOGO/${prefix}/${userId}/${userId}.jpg`;
}
function isoToKstDateKey(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  const k = new Date(d.getTime() + 9 * 3600 * 1000);
  return `${k.getUTCFullYear()}-${String(k.getUTCMonth()+1).padStart(2,'0')}-${String(k.getUTCDate()).padStart(2,'0')}`;
}
// ── 방송 일수 걸침 규칙(2026-07-16 확정) ─────────────────────────────
// 자정을 걸쳐도 24시간 미만이면 1일 — 24시간 이상 2일, 48시간 이상 3일…
// = 시작일 + floor(방송길이/24h)개의 '다음 날짜' 키 (일반 저녁 방송의 자정 걸침은 1일 유지).
// 진행 중 세션은 nowMs까지 경과를 그대로 인정 — 48h 상한 없음(120h+ 마라톤 실사례가 상한에 물린 2026-07-20 제보로 제거).
// 고아 방어는 두 겹이 대신함: ① monthPrefix가 그 달 밖 날짜를 끊음(월간·연간·명전합산) ② 프리픽스 없는 스트릭 호출자는
// 라이브 확인(broad_no 일치)으로 게이트하고, 불일치 고아에는 유사-now(시작+48h)를 넘겨 상한을 재현.
// monthPrefix('YYYY-MM')를 주면 그 달 밖 날짜는 버림. 세션은 시작월 키에만 있어 월경계 마라톤의
// 다음 달 조각은 다음 달이 셀 수 없는 알려진 한계(발생 시 수동 보정).
// 방송 날짜 bdate(2026-09-03 세션 70): 다시보기가 잘려 계산 시작이 자정을 넘긴 소급 기록(start_cut)은 실제 시작 '날짜'만 따로 갖는다.
// 시각·길이는 못 믿는 채로 두고 날짜만 바로잡는다 — 첫 날짜 키를 bdate로, 이어지는 날짜는 거기서 하루씩(개수는 기록된 길이대로).
// bdate가 시작 날짜보다 앞일 때만 뜻이 있다(같거나 뒤면 무시). 첫 키가 곧 '이 달에 속하는가'의 기준이라 월 게이트도 이 함수의 결과로 판단한다.
function sessionDateKeys(s, monthPrefix, nowMs) {
  const t = new Date(s.start).getTime();
  if (isNaN(t)) return [];
  let e;
  if (s.end) {
    e = new Date(s.end).getTime();
    if (isNaN(e) || e < t) e = t;
  } else {
    e = nowMs;
    if (e < t) e = t;
  }
  const keys = [];
  const extraDays = Math.floor((e - t) / 86400000);
  const startKey = isoToKstDateKey(new Date(t).toISOString());
  const base = (typeof s.bdate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s.bdate) && s.bdate < startKey) ? Date.parse(s.bdate + 'T00:00:00+09:00') : t;
  for (let i = 0; i <= extraDays; i++) {
    const dk = isoToKstDateKey(new Date(base + i * 86400000).toISOString());
    if (!dk) continue;
    if (monthPrefix && !dayInStatsMonth(dk, monthPrefix)) break;   // 결성일은 첫 달에 속한다(dayInStatsMonth)
    keys.push(dk);
  }
  return keys;
}
function ymdKey(year, month1, day) {
  return `${year}-${String(month1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function daysInMonth(year, month1) {
  return new Date(year, month1, 0).getDate();
}

// 휴방 이미지 여부 — until 당일(HH:mm 적으면 그 분)까지 표시. kstExpiryMs 공통 해석(2026-08-19).
// 형식 밖 until은 미표시(종전 문자열 비교의 우연 통과 차단). 카드 생성부와 변화 감지부(liveGridSig)가 공용.
function vacationSrc(m, info) {
  if (info.live) return null;
  const v = VACATION[m.id];
  if (!v) return null;
  const ex = kstExpiryMs(v.until);
  return (ex !== null && Date.now() <= ex) ? v.img : null;
}

function buildCard(m, info) {
  const tag = 'a';   // 생방송=시청 페이지, 오프라인=방송국 페이지 — 둘 다 SOOP 새 탭 링크
  const card = document.createElement(tag);
  const vacSrc = vacationSrc(m, info);
  card.className = 'card ' + (info.live ? 'live' : 'offline') + (vacSrc ? ' vacation' : '');
  card.dataset.member = info.id;
  card.href = info.live
    ? 'https://play.sooplive.co.kr/' + info.id           // 방송 중: 시청 페이지
    : 'https://www.sooplive.com/station/' + info.id;     // 오프라인: 방송국(다시보기·게시판)
  card.target = '_blank';
  card.rel = 'noopener';
  const btime = formatBtime(info.btime);
  const mode = info.mode || (info.live ? 'normal' : null);
  const isNormalLive = info.live && mode === 'normal';
  const hasThumb = info.thumb && isNormalLive;
  const thumbTs = Math.floor(Date.now() / 60000);
  const thumbHtml = hasThumb
    ? `<img src="${info.thumb}?t=${thumbTs}" alt="${m.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : '';
  const placeholderInner = info.live && mode && mode !== 'normal'
    ? `<img src="${m.img}" alt="${m.name}"><div class="placeholder-mode-text">${modePlaceholder(mode)}</div>`
    : `<img src="${vacSrc || m.img}" alt="${m.name}">`;
  let modeBadge = '';
  if (info.live && mode && mode !== 'normal') {
    const parts = modeParts(mode);
    const spans = parts.map(p => `<span class="badge-mode ${p}" role="img" aria-label="${MODE_LABEL[p] || ''}">${modeBadgeSvg(p)}</span>`).join('');
    modeBadge = parts.length > 1 ? `<span class="badge-mode-wrap">${spans}</span>` : spans;
  }
  const profileUrl = soopProfileUrl(m.id);
  const avatarHtml = profileUrl
    ? `<img class="card-avatar" src="${profileUrl}" alt="${m.name}" onerror="this.onerror=null;this.src='${m.img}'">`
    : `<img class="card-avatar" src="${m.img}" alt="${m.name}">`;
  let titleText;
  if (!info.live) titleText = '오프라인';
  else if (info.title) titleText = info.title;
  else if (mode && mode !== 'normal') titleText = modePlaceholder(mode) || '방송 중';
  else titleText = '방송 중';
  const btimeHtml = btime ? `<span class="card-btime">${SVG_ICONS.clockTime}<span>${btime}</span></span>` : '';   // 시계 = SVG 아이콘(구 ⏱ 이모지 — 이모지 배제, 2026-07-13)
  const nameColorStyle = info.live ? `color: ${m.color}` : '';
  card.innerHTML = `
    <div class="card-thumb">
      ${thumbHtml}
      <div class="placeholder" style="display:${hasThumb ? 'none' : 'flex'}">${placeholderInner}</div>
      ${modeBadge}
    </div>
    <div class="card-info">
      ${avatarHtml}
      <div class="card-text">
        <div class="card-name-row">
          <span class="card-name" style="${nameColorStyle}">${m.name}</span>
          ${btimeHtml}
        </div>
        <div class="card-title ${info.live ? 'is-live' : ''}">${escapeHtml(titleText)}</div>
      </div>
    </div>
  `;
  return card;
}

function getBroadcastElapsed(e, allEvents) {
  const targets = ['title', 'category', 'mode_change', 'end', 'chat', 'chat_emoticon', 'donation', 'sanction', 'mission_gift'];   // 제재·미션도 broad_start를 수집하므로 채팅류와 동일하게 ⏱ 표시(묶음 첫 이벤트가 제재일 때의 비대칭 해소)
  if (!targets.includes(e.type)) return '';
  const evTime = new Date(e.time).getTime();
  let startTime = null;
  if (e.broad_start) {
    startTime = new Date(e.broad_start).getTime();
  } else {
    const isChat = ['chat', 'chat_emoticon', 'donation', 'sanction', 'mission_gift'].includes(e.type);
    const targetMemberId = isChat ? e.channel_id : e.member_id;
    let startEv = null;
    for (const ev of allEvents) {
      if (ev.type === 'start' && ev.member_id === targetMemberId) {
        const t = new Date(ev.time).getTime();
        if (t <= evTime && (!startEv || t > new Date(startEv.time).getTime())) startEv = ev;
      }
    }
    if (!startEv) return '';
    startTime = new Date(startEv.time).getTime();
  }
  const diff = Math.floor((evTime - startTime) / 1000);
  if (diff < 0) return '';
  if (diff < 60) return `${diff}초`;
  const h = Math.floor(diff / 3600);
  const m = Math.floor((diff % 3600) / 60);
  return h > 0 ? `${h}시간 ${m}분` : `${m}분`;
}

function renderEvent(e, allEvents) {
  const iconMap = {
    start: SVG_ICONS.soop, end: SVG_ICONS.soop,
    title: SVG_ICONS.pencil, category: SVG_ICONS.tag, mode_change: SVG_ICONS.rotate,
    post: SVG_ICONS.board, comment_recommend: SVG_ICONS.thumbsup,
    youtube: SVG_ICONS.youtube, cafe_post: SVG_ICONS.coffee,
    chat: SVG_ICONS.chatBubble, chat_emoticon: SVG_ICONS.chatBubble,
    donation: SVG_ICONS.starBalloon, mission_gift: SVG_ICONS.flame,
  };
  const actionMap = {
    start: '방송 시작', end: '방송 종료',
    title: '방송 제목 변경', category: '카테고리 변경', mode_change: '방송 모드 변경',
    post: '숲 게시글', comment_recommend: '좋아요 요청',
    youtube: '유튜브 업로드', cafe_post: '카페 게시글',
    chat: '채팅', chat_emoticon: '채팅',
    donation: '후원',
  };
  // 제재·미션은 kind/필드에 따라 라벨이 달라 정적 맵 대신 계산 — 문구는 "내용 (XX 방송)" 확정 문법
  let actionLabel = actionMap[e.type] || e.type;
  if (e.type === 'sanction') actionLabel = e.kind === 'kick' ? '강제퇴장' : `채팅금지 ${e.seconds || 0}초`;
  else if (e.type === 'mission_gift') actionLabel = `${e.mission === 'battle' ? '대결' : '도전'}미션 후원 ${e.amount || 0}개`;
  const member = findMember(e.member_id);
  const avatarSrc = member ? member.img : '';
  const memberColor = member ? member.color : '#fff';
  let modeTag = '';
  if ((e.type === 'start' || e.type === 'end') && e.mode && e.mode !== 'normal') {
    modeTag = modeParts(e.mode)
      .map(p => { const label = MODE_LABEL[p] || ''; return label ? `<span class="event-mode-tag ${p}" role="img" aria-label="${label}">${modeBadgeSvg(p)}</span>` : ''; })
      .join('');
  }
  let targetTag = '';
  if (e.type === 'comment_recommend' && e.target_name) {
    // 대상 글 제목을 여기(헤더)에 붙인다 — '어디에 다는 요청인지'가 한눈에 보인다.
    //   못 가져온 글은 그냥 빠진다: 애청자 공개 게시판은 익명으로 제목을 못 읽는다(아래 [한계] 참조).
    //   .event-target이 inline-block이라 제목이 길어도 덩어리 안에서 줄바꿈된다(모바일 가로 overflow 방지).
    const at = e.post_title ? ` - "${escapeHtml(e.post_title)}"` : '';
    targetTag = `<span class="event-target">(${escapeHtml(e.target_name)} 컨텐츠${at})</span>`;
  }
  if (e.type === 'cafe_post' && e.cafe_name) {
    targetTag = `<span class="event-target">(${escapeHtml(e.cafe_name)})</span>`;
  }
  if (['chat', 'chat_emoticon', 'donation', 'sanction', 'mission_gift'].includes(e.type) && e.channel_name) {
    const channelMember = MEMBERS.find(m => m.id === e.channel_id);
    const channelColor = channelMember ? channelMember.color : '#cbd5e1';
    targetTag = `<span class="event-target">(<span style="color: ${channelColor}">${escapeHtml(e.channel_name)}</span> 방송)</span>`;
  }
  let detail = '';
  if (e.type === 'start') {
    const titleText = e.title ? escapeHtml(e.title) : '';
    detail = `<div class="event-detail">${modeTag}${modeTag && titleText ? ' ' : ''}${titleText}</div>`;
  } else if (e.type === 'end') {
    const evTime = new Date(e.time).getTime();
    let lastTitleEv = null;
    for (const ev of (allEvents || [])) {
      if (ev.member_id === e.member_id && (ev.type === 'title' || ev.type === 'start')) {
        const t = new Date(ev.time).getTime();
        if (t <= evTime && (!lastTitleEv || t > new Date(lastTitleEv.time).getTime())) lastTitleEv = ev;
      }
    }
    const lastTitle = lastTitleEv ? (lastTitleEv.type === 'title' ? lastTitleEv.after : lastTitleEv.title) : '';
    const titleText2 = lastTitle ? escapeHtml(lastTitle) : '';
    detail = `<div class="event-detail">${modeTag}${modeTag && titleText2 ? ' ' : ''}${titleText2}</div>`;
  } else if (e.type === 'title' || e.type === 'category') {
    detail = `<div class="event-detail">${escapeHtml(e.before)} → ${escapeHtml(e.after)}</div>`;
  } else if (e.type === 'mode_change') {
    detail = `<div class="event-detail">${escapeHtml(modeLabel(e.before))} → ${escapeHtml(modeLabel(e.after))}</div>`;
  } else if (e.type === 'comment_recommend' && e.title) {
    // '누구 댓글 · 원본 숲 게시글 제목'. e.title은 링크를 담고 있던 멤버 글의 제목이다.
    //   [이벤트 탭] 그 게시글 이벤트가 타임라인에 따로 있으므로 둘의 연결이 보인다.
    //   (좋아요 요청 모달은 2026-08-10부터 renderEvent를 쓰지 않는다 — 전용 렌더 renderLikeReqBody가 같은 정보를 행 2줄째로 표시)
    // comment_member_id가 없으면(외부인 댓글·이 기능 이전 항목) 앞 조각만 빠지고 제목은 그대로 나온다 — 무회귀.
    const cm = e.comment_member_id ? findMember(e.comment_member_id) : null;
    const who = cm ? `<span style="color: ${cm.color}">${escapeHtml(cm.name)}</span> 댓글 · ` : '';
    detail = `<div class="event-detail">${who}${escapeHtml(e.title)}</div>`;
  } else if ((e.type === 'post' || e.type === 'youtube' || e.type === 'cafe_post') && e.title) {
    detail = `<div class="event-detail">${escapeHtml(e.title)}</div>`;
  } else if (e.type === 'chat' && e.message) {
    detail = `<div class="event-detail">${escapeHtml(e.message)}</div>`;
  } else if (e.type === 'chat_emoticon') {
    detail = `<div class="event-detail">(이모티콘)</div>`;
  } else if (e.type === 'donation' && e.amount) {
    detail = `<div class="event-detail">별풍선 ${e.amount}개</div>`;
  } else if (e.type === 'mission_gift' && e.title) {
    detail = `<div class="event-detail">“${escapeHtml(e.title)}”</div>`;
  }
  if (e.type === 'end' && !e.url && e.member_id) {
    e = { ...e, url: `https://www.sooplive.com/station/${e.member_id}/vod` };
  }
  const eventTime = new Date(e.time).getTime() || 0;
  const iconHtml = e.type === 'sanction' ? (e.kind === 'kick' ? SVG_ICONS.kickOut : SVG_ICONS.ban) : (iconMap[e.type] || '•');
  const inner = `
    <div class="event-icon ${e.type}">${iconHtml}</div>
    ${avatarSrc ? `<img class="event-avatar" src="${avatarSrc}" alt="${escapeHtml(e.member_name)}">` : ''}
    <div class="event-body">
      <div>
        <span class="event-member" style="color: ${memberColor}">${escapeHtml(e.member_name)}</span>
        <span class="event-action"><span class="event-action-label">${actionLabel}</span>${(() => { const el = getBroadcastElapsed(e, allEvents||[]); return el ? ` <span class="event-elapsed">${SVG_ICONS.clockTime} ${el}</span>` : ''; })()}</span>
        ${targetTag}
      </div>
      ${detail}
    </div>
    <div class="event-time">
      <span class="event-time-rel">${formatRelTime(e.time)}</span>
      <span class="event-time-abs">${formatAbsTime(e.time)}</span>
    </div>
  `;
  // v12(2026-08-29, Crenop 지정): 종료된 방송의 "모든" 이벤트(시작·제목/카테고리/모드 변경·채팅류·종료)를
  // 그 방송의 VOD로 연결한다. 방송 중 세션은 종전대로 생방송 링크. 해석은 렌더 시점(resolveEventSession) —
  // href 폴백은 VOD 목록이고, 목록 도착 시 applyVodLinks가 1개=플레이어 직링크 / 2개↑=선택 모달 표식으로 확정.
  const vodTypes = new Set(['start', 'title', 'category', 'mode_change', 'end', 'chat', 'chat_emoticon', 'donation', 'sanction', 'mission_gift']);
  const chatUrlMatch = (e.type === 'chat' && e.message) ? e.message.match(/^(https?:\/\/\S+)/) : null;   // 링크 채팅은 그 링크 우선(종전 규칙 유지)
  if (vodTypes.has(e.type) && !chatUrlMatch) {
    const sess = resolveEventSession(e, allEvents || []);
    if (sess && sess.ended) {
      const listUrl = `https://www.sooplive.com/station/${sess.memberId}/vod`;
      return `<div class="event" data-time="${eventTime}"><a class="event-link ev-vod" data-member="${escapeHtml(sess.memberId)}" data-broad="${escapeHtml(sess.broadNo || '')}" data-off="${sess.offSec != null ? sess.offSec : ''}" href="${escapeHtml(listUrl)}" target="_blank" rel="noopener">${inner}</a></div>`;
    }
  }
  const LIVE_NAV_TYPES = new Set(['start', 'title', 'category', 'mode_change']);
  if (LIVE_NAV_TYPES.has(e.type)) {
    const liveUrl = `https://play.sooplive.co.kr/${e.member_id}`;
    return `<div class="event" data-time="${eventTime}"><a class="event-link" href="${escapeHtml(liveUrl)}" target="_blank" rel="noopener">${inner}</a></div>`;
  }
  if (['chat', 'chat_emoticon', 'donation', 'sanction', 'mission_gift'].includes(e.type) && e.channel_id) {
    // 채팅 본문이 http(s) 링크로 시작하면 방송이 아니라 그 링크로 연결 (뒤에 글자가 붙어 있으면 앞 URL 토큰만)
    if (chatUrlMatch) {
      return `<div class="event" data-time="${eventTime}"><a class="event-link" href="${escapeHtml(chatUrlMatch[1])}" target="_blank" rel="noopener">${inner}</a></div>`;
    }
    const liveUrl = `https://play.sooplive.co.kr/${e.channel_id}`;
    return `<div class="event" data-time="${eventTime}"><a class="event-link" href="${escapeHtml(liveUrl)}" target="_blank" rel="noopener">${inner}</a></div>`;
  }
  if (e.url) {
    return `<div class="event" data-time="${eventTime}"><a class="event-link" href="${escapeHtml(withTextFragment(e.url, e.title))}" target="_blank" rel="noopener">${inner}</a></div>`;
  }
  return `<div class="event" data-time="${eventTime}">${inner}</div>`;
}

// 채팅 묶음 gap — "감지 주기 연속" 규칙의 시간 근사: 같은 채널의 직전 채팅과 이 간격 이내면 같은 대화, 넘으면 종결.
// 채팅 시각은 Oracle 수신 순간 기준이고 폴링(10초) 배치 경계는 클라이언트가 알 수 없어, 배치 규칙
// "다음 감지에 이어지면 붙이고 빈 주기가 나오면 종결"을 시간으로 옮기면 10~20초 범위지만 짧은 쉼까지 넉넉히 묶으려 25초.
const CHAT_BUNDLE_GAP_MS = 25 * 1000;

// 채팅류(chat/chat_emoticon/donation)를 채널 단위로 묶어 타임라인 아이템 목록을 만든다.
// 같은 채널의 직전 채팅과 CHAT_BUNDLE_GAP_MS 이내면 같은 묶음 — 사이에 낀 다른 채널 채팅·비채팅 이벤트는 묶음을 끊지 않음(채널별 독립).
// 필터 통과분만 받으므로 필터와 정방향으로 맞물린다. 2건부터 묶음, 1건은 개별 표시.
// 정렬 앵커: 개별=자기 시각, 묶음=오래된순이면 첫 채팅·최신순이면 마지막 채팅 시각(마지막 활동 위치에 노출).
// 타임라인 표시 순서: 앵커 시각 우선, 동시각 동률은 타입으로 — 리방 합성(같은 시각의 종료+시작)은
// 시간 흐름상 종료→시작이므로 최신순에선 '시작'이 위(최근 쪽), 오래된순에선 '종료'가 위(2026-07-17 확정).
// 그 외 동시각 조합(제목·카테고리 변경 쌍 등)은 랭크 0 → 안정 정렬이 기존 순서 유지. 데이터(KV) 순서는 불변 — 표시만 교정.
function timelineOrderCompare(a, b, asc) {
  const d = asc ? a.aAsc - b.aAsc : b.aDesc - a.aDesc;
  if (d !== 0) return d;
  const rank = it => it.ev ? (it.ev.type === 'start' ? 1 : it.ev.type === 'end' ? -1 : 0) : 0;
  return asc ? rank(a) - rank(b) : rank(b) - rank(a);
}
function buildTimelineItems(filtered, all) {
  const items = [];
  const chatFam = [];
  const battleSeen = new Set();   // 필터를 통과한 대결 key만 노출 대상
  for (const e of filtered) {
    if (e.type === 'battle_notice') { if (e.mkey != null) battleSeen.add(e.mkey); continue; }   // mkey 결손분은 조인 불가 — undefined끼리 허위 조인 방지
    if ((e.type === 'chat' || e.type === 'chat_emoticon' || e.type === 'donation' || e.type === 'sanction' || e.type === 'mission_gift') && e.channel_id) chatFam.push(e);
    else { const t = new Date(e.time).getTime() || 0; items.push({ ev: e, aAsc: t, aDesc: t }); }
  }
  // 대결 종료: 같은 key의 NOTICE(참가 멤버 채널마다 1건)를 조인해 한 아이템으로.
  // 참가 명단은 전체 이벤트 기준(멤버 필터로 일부 참가자가 가려져도 명단은 불변), 노출 여부는 필터 통과분 기준.
  // 멤버 2인 이상만 이벤트화 — 1인은 외부인과의 대결(범위 밖)이거나 수신 누락 케이스라 미발화가 안전.
  if (battleSeen.size > 0) {
    const byKey = {};
    for (const e of (all || filtered)) {
      if (e.type === 'battle_notice' && battleSeen.has(e.mkey)) (byKey[e.mkey] = byKey[e.mkey] || []).push(e);
    }
    for (const key in byKey) {
      const g = byKey[key];
      if (new Set(g.map(e => e.member_id)).size < 2) continue;
      const ts = g.map(e => new Date(e.time).getTime() || 0);
      items.push({ battle: g, aAsc: Math.min(...ts), aDesc: Math.max(...ts) });
    }
  }
  chatFam.sort((a, b) => new Date(a.time) - new Date(b.time));
  const open = {};   // channel_id → { t: 마지막 채팅 시각, arr: 진행 중 묶음 }
  const bundles = [];
  for (const e of chatFam) {
    const t = new Date(e.time).getTime() || 0;
    const o = open[e.channel_id];
    if (o && t - o.t <= CHAT_BUNDLE_GAP_MS) { o.arr.push(e); o.t = t; }
    else { const arr = [e]; bundles.push(arr); open[e.channel_id] = { t, arr }; }
  }
  for (const arr of bundles) {
    if (arr.length === 1) {
      const t = new Date(arr[0].time).getTime() || 0;
      items.push({ ev: arr[0], aAsc: t, aDesc: t });
    } else {
      items.push({ bundle: arr, aAsc: new Date(arr[0].time).getTime() || 0, aDesc: new Date(arr[arr.length - 1].time).getTime() || 0 });
    }
  }
  return items;
}

// 채팅 묶음 아이템 — 클릭 펼침 없이 내용 전체를 인라인 노출, 내부는 과거→최신 고정(확정 사양).
// 헤더는 개별 이벤트와 같은 골격: [채팅 아이콘][발화자 아바타들][발화자들 채팅 (⏱) (채널 방송)][시간]. 라벨은 "채팅"만(건수 없음 — 확정).
function renderChatBundle(items, allEvents) {
  const first = items[0], last = items[items.length - 1];
  const channelMember = MEMBERS.find(m => m.id === first.channel_id);
  const channelColor = channelMember ? channelMember.color : '#cbd5e1';
  const senderIds = [...new Set(items.map(i => i.member_id))];
  const senderHtml = senderIds.map(id => {
    const m = findMember(id);
    const it = items.find(x => x.member_id === id);
    return `<span style="color: ${m ? m.color : '#fff'}">${escapeHtml(it.member_name || '')}</span>`;
  }).join('·');
  const el = getBroadcastElapsed(first, allEvents || []);
  const absRange = formatAbsTime(first.time) + (formatHHMM(last.time) !== formatHHMM(first.time) ? ` ~ ${formatHHMM(last.time)}` : '');
  const liveUrl = `https://play.sooplive.co.kr/${first.channel_id}`;
  const bundleSess = resolveEventSession(first, allEvents || []);   // v13: 묶음도 개별 채팅과 같은 규칙 — 종료 세션이면 행마다 그 시각의 VOD 지점으로
  const listUrl = bundleSess && bundleSess.ended ? `https://www.sooplive.com/station/${bundleSess.memberId}/vod` : null;
  const rows = items.map(i => {
    const m = findMember(i.member_id);
    let msg, rowUrl = liveUrl;   // 개별 채팅과 동일 동선: 행 전체가 방송으로 이동, 메시지가 http 링크로 시작하면 그 링크로
    if (i.type === 'donation') msg = `<span class="cbr-don">${SVG_ICONS.starBalloon}별풍선 ${i.amount || ''}개</span>`;
    else if (i.type === 'sanction') msg = i.kind === 'kick'
      ? `<span class="cbr-sanction">${SVG_ICONS.kickOut}강제퇴장</span>`
      : `<span class="cbr-sanction">${SVG_ICONS.ban}채팅금지 ${i.seconds || 0}초</span>`;
    else if (i.type === 'mission_gift') msg = `<span class="cbr-mission">${SVG_ICONS.flame}${i.mission === 'battle' ? '대결' : '도전'}미션 후원 ${i.amount || 0}개</span>${i.title ? ` <span class="cbr-mtitle">“${escapeHtml(i.title)}”</span>` : ''}`;
    else if (i.type === 'chat_emoticon') msg = '(이모티콘)';
    else {
      msg = escapeHtml(i.message || '');
      const um = (i.message || '').match(/^(https?:\/\/\S+)/);
      if (um) rowUrl = um[1];
    }
    if (rowUrl === liveUrl && listUrl) {   // URL 채팅이 아니고 세션 종료 → VOD 앵커(행별 시각 오프셋)
      const rt = new Date(i.time).getTime();
      const sMs = i.broad_start ? new Date(i.broad_start).getTime() : NaN;
      const off = !isNaN(sMs) && rt >= sMs ? Math.floor((rt - sMs) / 1000) : (bundleSess.offSec != null ? bundleSess.offSec : '');
      return `<a class="chat-bundle-row ev-vod" data-member="${escapeHtml(bundleSess.memberId)}" data-broad="${escapeHtml(bundleSess.broadNo || '')}" data-off="${off}" href="${escapeHtml(listUrl)}" target="_blank" rel="noopener"><span class="cbr-time">${formatHHMM(i.time)}</span><span class="cbr-name" style="color: ${m ? m.color : '#fff'}">${escapeHtml(i.member_name || '')}</span><span class="cbr-msg">${msg}</span></a>`;
    }
    return `<a class="chat-bundle-row" href="${escapeHtml(rowUrl)}" target="_blank" rel="noopener"><span class="cbr-time">${formatHHMM(i.time)}</span><span class="cbr-name" style="color: ${m ? m.color : '#fff'}">${escapeHtml(i.member_name || '')}</span><span class="cbr-msg">${msg}</span></a>`;
  }).join('');
  // 아바타 = 발화자들(첫 발화 순, 헤더 이름 나열과 동일 순서) 세로 나열 — 단건 채팅(발화자 사진)과 의미 통일. 장소(채널)는 헤더의 '(X 방송)' 링크가 담당
  const avatarsHtml = senderIds.map(id => {
    const m = findMember(id);
    return m ? `<img class="event-avatar" src="${m.img}" alt="${escapeHtml(m.name)}">` : '';
  }).join('');
  const inner = `
    <div class="event-icon chat">${SVG_ICONS.chatBubble}</div>
    ${avatarsHtml ? `<div class="chat-bundle-avatars">${avatarsHtml}</div>` : ''}
    <div class="event-body">
      <div>
        <span class="event-member">${senderHtml}</span>
        <span class="event-action"><span class="event-action-label">채팅</span>${el ? ` <span class="event-elapsed">${SVG_ICONS.clockTime} ${el}</span>` : ''}</span>
        <span class="event-target">(<a class="cbr-chan" href="${escapeHtml(liveUrl)}" target="_blank" rel="noopener" style="color: ${channelColor}">${escapeHtml(first.channel_name || '')}</a> 방송)</span>
      </div>
      <div class="chat-bundle-rows">${rows}</div>
    </div>
    <div class="event-time">
      <span class="event-time-rel">${formatRelTime(last.time)}</span>
      <span class="event-time-abs">${absRange}</span>
    </div>
  `;
  return `<div class="event chat-bundle" data-time="${new Date(last.time).getTime() || 0}">${inner}</div>`;
}

// 대결 종료 아이템: 같은 key의 NOTICE 묶음(참가 멤버 채널당 1건) → "[팀별 멤버] 승/패(또는 무승부)" 한 행.
// 표시는 감지된 멤버만(외부 참가자는 원리적으로 비가시). 여러 채널에 걸친 사건이라 (XX 방송) 표기는 예외적으로 생략(확정).
// 아바타 = 크루 로고(Favicon) 고정 — 크루 차원 사건 + 참가자 나열은 인원 과다(확정), 공통 골격([아이콘][아바타][본문][시간]) 유지.
function renderBattleItem(g) {
  const first = g[0];
  const teams = {};   // 팀명 → 멤버 id들(채널 내 중복 수신 대비 중복 제거)
  for (const e of g) {
    if (!teams[e.my_team]) teams[e.my_team] = [];
    if (!teams[e.my_team].includes(e.member_id)) teams[e.my_team].push(e.member_id);
  }
  const nameHtml = id => { const m = findMember(id); return `<span style="color: ${m ? m.color : '#fff'}">${escapeHtml(m ? m.name : id)}</span>`; };
  const teamHtml = ids => ids.map(nameHtml).join('·');
  let resultHtml;
  if (first.draw) {
    resultHtml = Object.values(teams).map(teamHtml).join(' <span class="battle-sep">/</span> ') + ' <span class="battle-draw">무승부</span>';
  } else {
    const win = [], lose = [];
    for (const t in teams) (t === first.winner ? win : lose).push(...teams[t]);
    const parts = [];
    if (win.length) parts.push(`${teamHtml(win)} <span class="battle-win">승</span>`);
    if (lose.length) parts.push(`${teamHtml(lose)} <span class="battle-lose">패</span>`);
    resultHtml = parts.join(' <span class="battle-sep">/</span> ');
  }
  const last = g.reduce((a, b) => new Date(a.time) > new Date(b.time) ? a : b);
  const t = new Date(last.time).getTime() || 0;
  return `<div class="event" data-time="${t}">
    <div class="event-icon battle">${SVG_ICONS.swords}</div>
    <img class="event-avatar" src="Favicon.webp" alt="천타버스">
    <div class="event-body">
      <div>
        <span class="event-action"><span class="event-action-label">대결미션 종료</span></span>
        <span class="battle-result">— ${resultHtml}</span>
      </div>
      ${first.title ? `<div class="event-detail">“${escapeHtml(first.title)}”</div>` : ''}
    </div>
    <div class="event-time">
      <span class="event-time-rel">${formatRelTime(last.time)}</span>
      <span class="event-time-abs">${formatAbsTime(last.time)}</span>
    </div>
  </div>`;
}

function initFilterUI() {
  const mc = document.getElementById('filterMembers');
  if (mc && !mc.dataset.inited) {
    mc.innerHTML = MEMBERS.map(m => `
      <button class="filter-member" data-id="${m.id}" title="${m.name}">
        <img src="${m.img}" alt="${m.name}">
      </button>
    `).join('');
    mc.querySelectorAll('.filter-member').forEach(btn => {
      const id = btn.dataset.id;
      btn.classList.toggle('on', filterState.members.has(id));
      btn.addEventListener('click', () => {
        if (filterState.members.has(id)) filterState.members.delete(id);
        else filterState.members.add(id);
        btn.classList.toggle('on', filterState.members.has(id));
        saveEventFilters();

      });
    });

  }
  const mAll = document.getElementById('filterMemberToggleAll');
  if (mAll && !mAll.dataset.inited) {
    mAll.addEventListener('click', () => {
      const allSelected = filterState.members.size === MEMBERS.length;
      filterState.members = allSelected ? new Set() : new Set(MEMBERS.map(m => m.id));
      saveEventFilters();
      mc.querySelectorAll('.filter-member').forEach(b => {
        b.classList.toggle('on', filterState.members.has(b.dataset.id));
      });
      updateMemberAllToggle();
      applyFilter();
    });

  updateMemberAllToggle();
  const tc = document.getElementById('filterTypes');
  if (tc && !tc.dataset.inited) {
    const filterIconMap = {
      soop: SVG_ICONS.soop,
      chat: SVG_ICONS.chatBubble,
      post: SVG_ICONS.board,
      youtube: SVG_ICONS.youtube,
      cafe: SVG_ICONS.coffee,
    };
    tc.querySelectorAll('.filter-type').forEach(btn => {
      const type = btn.dataset.type;
      if (type === 'all') return;
      const iconEl = btn.querySelector('.filter-icon');
      if (iconEl && filterIconMap[type]) iconEl.innerHTML = filterIconMap[type];
      btn.classList.toggle('on', filterState.types.has(type));
      btn.addEventListener('click', () => {
        if (filterState.types.has(type)) filterState.types.delete(type);
        else filterState.types.add(type);
        btn.classList.toggle('on', filterState.types.has(type));
        saveEventFilters();
        updateTypeAllToggle();
        applyFilter();
      });
    });
    tc.dataset.inited = '1';
  }
  const tAll = document.getElementById('filterTypeToggleAll');
  if (tAll && !tAll.dataset.inited) {
    tAll.addEventListener('click', () => {
      const allSelected = filterState.types.size === ALL_TYPE_KEYS.length;
      filterState.types = allSelected ? new Set() : new Set(ALL_TYPE_KEYS);

      tc.querySelectorAll('.filter-type').forEach(b => {

      applyFilter();
    });

  updateTypeAllToggle();

function applyFilter() {
  const tl = document.getElementById('timeline');
  if (!tl) return;
  // 폴링 무변화 스킵: 렌더 입력(이벤트 집합·정렬·필터)이 직전과 같으면 innerHTML 재생성 생략 —
  // 10초마다 전체 DOM을 다시 만들면 사용자의 텍스트 선택이 풀리고 조용한 시간에도 수백 노드가 낭비 재생성됨.
  // 이벤트 집합 동등성은 길이+양끝 시각으로 판정(/events는 append-only 롤링이라 충분). 산출물 중 시간이 흐르면
  // 변하는 건 상대시각("N분 전")뿐이므로 그것만 data-time(각 아이템의 상대시각 기준과 동일한 epoch ms)으로 부분 갱신.
  // timeline-header 존재 조건: 초기/에러 상태의 빈 tl에서 스킵하는 것 방지(정상 렌더 산출물에만 존재).
  const tlSig = [allEvents.length, allEvents[0]?.time || '', allEvents[allEvents.length - 1]?.time || '',
    eventSortAsc, [...filterState.types].sort().join(','), [...filterState.members].sort().join(',')].join('|');
  if (tlSig === lastTimelineSig && tl.querySelector('.timeline-header')) {
    tl.querySelectorAll('.event[data-time]').forEach(evEl => {
      const rel = evEl.querySelector('.event-time-rel');
      if (rel) rel.textContent = formatRelTime(Number(evEl.dataset.time));   // dataset은 문자열 — new Date("숫자문자열")은 Invalid Date라 Number 필수
    });
    refreshUnreadIndicator();
    return;
  }
  lastTimelineSig = tlSig;
  const filtered = allEvents.filter(e => {
    const cat = typeToCat(e.type);
    if (!filterState.types.has(cat)) return false;
    const memberMatch = filterState.members.has(e.member_id);
    const channelMatch = e.channel_id && filterState.members.has(e.channel_id);
    if (cat === 'chat') return memberMatch || channelMatch;
    return memberMatch;
  });
  filterCounts.events = { shown: filtered.length, total: allEvents.length };   // 서랍 버튼 채움용(2026-09-02)
  const sortLabel = eventSortAsc ? '과거순' : '최신순';   // 두 라벨 3자 등장(2026-08-09) — 토글해도 버튼 폭·아이콘-글자 간격이 그대로, 옆 버튼들과 위화감 없음
  const arrowSvg = eventSortAsc ? SVG_ICONS.arrowLineDown : SVG_ICONS.arrowLineUp;   // SVG_ICONS로 통합(2026-08-08)
  const scrollDownSvg = SVG_ICONS.chevronsDown;
  const scrollUpSvg = SVG_ICONS.chevronsUp;
  const sortBtnHtml = `<button class="sort-toggle sort-toggle-sync">${arrowSvg}<span>${sortLabel}</span></button>`;
  const markReadBtn = `<button class="timeline-scroll-btn mark-read-btn">${SVG_ICONS.checkAll}<span>모두 읽음</span></button>`;
  // 상단바 sticky(2026-08-09): 스크롤 내내 붙어 다니므로 모두 읽음·맨 위/아래·정렬을 여기 다 모은다.
  // 하단바는 완전 중복이 되어 폐지 — 맨 위로 버튼이 이리로 이사(맨 아래로 왼쪽).
  const headerHtml = `<div class="timeline-header"><div class="timeline-bar-left">${markReadBtn}</div><div class="timeline-bar-right"><button class="timeline-scroll-btn" id="scrollToTop">${scrollUpSvg}<span>맨 위로</span></button><button class="timeline-scroll-btn" id="scrollToBottom">${scrollDownSvg}<span>맨 아래로</span></button>${sortBtnHtml}</div></div>`;
  if (filtered.length === 0) {
    tl.innerHTML = headerHtml + (allEvents.length === 0
      ? '<div class="timeline-empty">아직 기록된 이벤트가 없습니다<br><br>방송, 게시글, 유튜브 영상 등이 올라오면 여기에 표시됩니다</div>'
      : '<div class="timeline-empty">필터 조건에 맞는 이벤트가 없습니다</div>');
  } else {
    const sorted = [...filtered].sort((a, b) => eventSortAsc
      ? new Date(a.time) - new Date(b.time)
      : new Date(b.time) - new Date(a.time));
    // 채팅류는 채널 단위 묶음으로 변환 후 앵커 시각으로 정렬. sorted는 renderEvent의 종료 제목·⏱ 경과 조회용 원본 유지.
    const items = buildTimelineItems(filtered, allEvents);
    items.sort((a, b) => timelineOrderCompare(a, b, eventSortAsc));   // 동시각 동률: 리방 종료·시작 순서 교정
    tl.innerHTML = headerHtml + items.map(it => it.bundle ? renderChatBundle(it.bundle, sorted) : it.battle ? renderBattleItem(it.battle) : renderEvent(it.ev, sorted)).join('');
  }
  tl.querySelectorAll('.sort-toggle-sync').forEach(btn => {
    btn.addEventListener('click', () => { eventSortAsc = !eventSortAsc; applyFilter(); });
  });
  tl.querySelectorAll('.mark-read-btn').forEach(btn => {
    btn.addEventListener('click', () => { setLastSeenToNow(); refreshUnreadIndicator(); });
  });
  // v12: VOD 링크 확정 패스 + 복수 파트 모달(위임 1개 — 도착 후 표식이 붙어도 동작)
  applyVodLinks(tl);
  tl.addEventListener('click', (ev) => {
    const a = ev.target.closest('a.ev-vodmulti, a.ev-vodnone');
    if (!a || !tl.contains(a)) return;
    ev.preventDefault();
    const parts = a.classList.contains('ev-vodnone') ? [] : (endVodResolve(a.dataset.member, a.dataset.broad) || []);
    openVodPickModal(parts, a.getAttribute('href'));   // 없음 확정 → "다시보기가 없습니다." 알림(목록 링크는 모달 안 보조)
  });
  // 맨 위/아래 = 페이지 끝(2026-09-03 세션 70, Crenop 실사고): 종전 scrollIntoView는 목록 상자의 위·아랫변을 화면에 맞추는 것이라
  // 위쪽은 붙어 있는 머리(띠+보조바 ≈ --head-h) 아래로 들어가 가려지고, 아래쪽은 상자 밑 여백(20px)만큼 못 갔다. 목록은 어느 폭에서도
  // 창 자체가 스크롤하므로(안쪽 스크롤 상자 없음) 창 기준 0·문서 끝으로 간다. 즉시 점프(탭 전환 window.scrollTo(0, 0)와 같은 방식).
  const scrollBottomBtn = document.getElementById('scrollToBottom');
  if (scrollBottomBtn) scrollBottomBtn.addEventListener('click', () => { window.scrollTo(0, document.documentElement.scrollHeight); });
  const scrollTopBtn = document.getElementById('scrollToTop');
  if (scrollTopBtn) scrollTopBtn.addEventListener('click', () => { window.scrollTo(0, 0); });
  const summary = document.getElementById('filterSummary');
  if (summary) summary.textContent = '선택된 멤버/종류만 알림됩니다.';

  refreshUnreadIndicator();
}
