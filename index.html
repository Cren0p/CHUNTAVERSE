<style>
  :root {
    --bg: #070a14;
    --surface: #0d1120;
    --surface2: #131929;
    --border: #1e2740;
    --live: #ff3b3b;
    --live-glow: rgba(255,59,59,0.25);
    --accent: #61FFEC;
    --accent2: #61FFEC;
    --text: #e2e8f0;
    --muted: #64748b;
    --time: #fbbf24;
    --ev-start: #60a5fa;
    --ev-end: #f87171;
    --ev-yellow: #fbbf24;
    --ev-blue: #60a5fa;
    --ev-comment: #ec4899;
    --ev-post: #34d399;
    --ev-youtube: #ef4444;
    --ev-unread: #61FFEC;
    --mode-adult: #f87171;
    --mode-subscription: #f59e0b;
    --mode-copyright: #38bdf8;
    --mode-password: #cbd5e1;
    --mode-restricted: #a78bfa;
    --filter-soop: #0388FF;
    --filter-post: #2EF5E1;
    --sidebar-w: 200px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 전역 미니멀 스크롤바 (초미니 6px·거의 안 보이다 hover 시 진해짐). webkit=Edge/Chrome/Safari, scrollbar-*=Firefox */
  * { scrollbar-width: thin; scrollbar-color: rgba(226,232,240,0.14) transparent; }
  *::-webkit-scrollbar { width: 6px; height: 6px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: rgba(226,232,240,0.14); border-radius: 6px; }
  *::-webkit-scrollbar-thumb:hover { background: rgba(226,232,240,0.3); }
  html, body { min-height: 100vh; }
  html { scrollbar-gutter: stable; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 35%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(2px 2px at 15% 50%, rgba(97,255,236,0.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    z-index: 2;
    flex-shrink: 0;
  }
  .sidebar-logo {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    text-align: center;
    min-height: 66px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sidebar-logo img { max-width: 100%; max-height: 32px; height: auto; display: block; cursor: pointer; }
  .nav-list { padding: 8px 0; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 20px; color: var(--muted);
    cursor: pointer; font-size: 14px; font-weight: 600;
    border: none; background: none; text-align: left;
    width: 100%; font-family: inherit;
    border-left: 3px solid transparent;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
    position: relative;
  }
  .nav-item:hover { color: var(--text); background: var(--surface2); }
  .nav-item.active { color: var(--accent2); background: var(--surface2); border-left-color: var(--accent); }
  .nav-icon {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    vertical-align: middle;
  }
  .nav-icon svg { width: 16px; height: 16px; display: block; vertical-align: middle; }
  .nav-events-label { position: relative; display: inline-flex; align-items: center; }
  .nav-badge {
    position: absolute;
    top: -6px; right: -10px;   /* 라벨 우상단 위로(superscript) — 흐름을 차지하지 않아 라벨이 밀리거나 줄바꿈되지 않음 */
    background: var(--ev-unread);
    color: var(--bg);
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    min-width: 16px;
    text-align: center;
    line-height: 1.2;
  }
  .nav-live-badge {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    background: var(--surface2);
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    transition: color 0.15s;
  }
  .nav-live-dot {
    width: 7px;
    height: 7px;
    background: var(--muted);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .nav-live-badge.on {
    color: var(--text);
    background: rgba(255,59,59,0.12);
  }
  .nav-live-badge.on .nav-live-dot {
    background: var(--live);
    box-shadow: 0 0 6px var(--live-glow);
    animation: pulse 1.8s ease-in-out infinite;
  }

  .nav-notify-bell {
    margin-left: auto;            /* events 행 우측 끝으로 */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--muted);         /* 무채색 = 알림 꺼짐 */
    cursor: pointer;
    transition: color 0.15s;
  }
  .nav-notify-bell svg { width: 20px; height: 20px; display: block; overflow: visible; }
  /* ON/OFF를 색(앰버↔무채)·모양(웨이브 선 유무)으로 구별 + 켤 때 1회 애니메이션 */
  .nav-notify-bell .ring-wave { opacity: 0; }                   /* OFF: 양옆 웨이브 선 숨김 (모양 단서) */
  .nav-notify-bell.on { color: #fbbf24; }                       /* ON: 앰버색 (색 단서, 민트 아닌 별도색) */
  .nav-notify-bell.on .ring-wave { opacity: 1; }                /* ON 정지: 양옆 웨이브 선 정적 표시 (currentColor=앰버) */
  .nav-notify-bell:not(.on):hover { color: var(--text); }
  /* 클릭으로 켤 때 1회만 (.ringing은 JS가 붙였다 뗌) — 상시 흔들리지 않음 */
  .nav-notify-bell.ringing svg { transform-origin: 50% 12%; animation: bell-ring 0.9s ease-in-out; }
  .nav-notify-bell.ringing .ring-wave { animation: ring-wave-flash 0.9s ease-out; }
  @keyframes bell-ring {
    0%   { transform: rotate(0); }
    15%  { transform: rotate(17deg); }
    30%  { transform: rotate(-15deg); }
    45%  { transform: rotate(11deg); }
    60%  { transform: rotate(-7deg); }
    75%  { transform: rotate(4deg); }
    88%  { transform: rotate(-2deg); }
    100% { transform: rotate(0); }
  }
  @keyframes ring-wave-flash {
    0%   { opacity: 0; }
    20%  { opacity: 1; }
    60%  { opacity: 0.8; }
    100% { opacity: 1; }                                        /* ON 정지값(1)으로 안착 — 끝에서 사라졌다 튀지 않게 */
  }
  @media (prefers-reduced-motion: reduce) {
    .nav-notify-bell.ringing svg, .nav-notify-bell.ringing .ring-wave { animation: none; }
  }
  .notify-switch {
    position: relative;
    width: 36px;
    height: 20px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
    padding: 0;
    box-sizing: border-box;
  }
  .notify-switch::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    background: var(--muted);
    top: 50%;
    left: 2px;
    transform: translateY(-50%);
    transition: transform 0.18s, left 0.18s, background 0.18s;
  }
  .notify-switch.on { border-color: var(--accent); }
  .notify-switch.on::after { left: 19px; transform: translateY(-50%); background: var(--accent); }

  .main {
    flex: 1; min-width: 0;
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
  }
  .main-header {
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(97,255,236,0.05) 0%, transparent 100%);
    display: flex; align-items: center; gap: 16px;
    min-height: 66px;
  }
  .page-title {
    flex-shrink: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .page-title-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: rgba(96,165,250,0.12);
    border: 1px solid rgba(96,165,250,0.4);
    color: #93c5fd;
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
    transition: background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .page-title-link:hover { background: rgba(96,165,250,0.22); border-color: rgba(96,165,250,0.7); }
  .page-title-link svg { width: 16px; height: 16px; flex-shrink: 0; }
  /* 좋아요 요청 모아보기 버튼: page-title-link 골격에 comment_recommend 색(에메랄드, --ev-post 계열) 적용 */
  button.page-title-link.like-req-btn {
    background: rgba(52,211,153,0.12);
    border: 1px solid rgba(52,211,153,0.4);
    color: #6ee7b7;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    position: relative;
  }
  button.page-title-link.like-req-btn:hover { background: rgba(52,211,153,0.22); border-color: rgba(52,211,153,0.7); }
  /* 안 본 새 좋아요 요청이 있으면 버튼 우상단 빨간 점 */
  .like-req-btn.has-new::after {
    content: ''; position: absolute; top: -3px; right: -3px;
    width: 9px; height: 9px; border-radius: 50%;
    background: #f87171; box-shadow: 0 0 0 1.5px var(--bg);
  }
  /* 일정 버튼: 천타버스 메인 민트(--accent) 박스 — 좋아요(에메랄드)·블루발(파랑)과 색으로 구분 */
  button.page-title-link.sch-btn {
    background: rgba(97,255,236,0.12);
    border: 1px solid rgba(97,255,236,0.4);
    color: var(--accent);
    cursor: pointer;
    font-family: inherit;
    text-align: left;
  }
  button.page-title-link.sch-btn:hover { background: rgba(97,255,236,0.22); border-color: rgba(97,255,236,0.7); }
  .lr-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.65);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .lr-overlay[hidden] { display: none; }
  .lr-panel {
    background: var(--surface);
    border: 1px solid rgba(52,211,153,0.4);
    width: 100%; max-width: 560px;
    max-height: 80vh;
    display: flex; flex-direction: column;
  }
  .lr-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px; font-weight: 700; color: var(--ev-post);
  }
  .lr-head > span:first-child { display: inline-flex; align-items: center; gap: 6px; }
  .lr-head svg { width: 15px; height: 15px; display: block; }
  .lr-close {
    background: none; border: none; color: var(--muted);
    font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 6px;
  }
  .lr-close:hover { color: var(--text); }
  .lr-body { overflow-y: auto; }
  .lr-msg { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 12px; }
  /* 좋아요 요청 개별 숨김 ✕ (카드 우상단 오버레이) */
  .lr-item { position: relative; }
  .lr-item .event { padding-right: 38px; }   /* ✕(우상단) 자리 확보 — 상대시간과 겹침 방지 */
  .lr-item .event-icon { display: none; }   /* 모달엔 좋아요 요청만 모이므로 타입 구분용 따봉 아이콘 불필요(이벤트 탭은 유지). flex 항목 제거라 좌측 빈칸·gap 안 남음 */
  .lr-dismiss {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(7,10,20,0.72); border: 1px solid var(--border);
    color: var(--muted); font-size: 12px; line-height: 1; cursor: pointer;
  }
  .lr-dismiss:hover { color: var(--text); background: var(--surface2); border-color: var(--muted); }
  /* 다가오는 일정: 버튼 카운트다운 + 모달 리스트(좋아요 모달의 lr-overlay 골격 재사용) */
  .sch-btn-dday { color: var(--accent); font-variant-numeric: tabular-nums; }
  /* 같은 날 2건+ 일정 묶음: 제목 행 위 / 각 제목 아래 같은 열에 그 일정의 dtime(열 정렬). 폭은 내용으로 관리(컷·말줄임 없음). */
  .sch-grid { display: grid; column-gap: 6px; row-gap: 1px; }   /* 점이 자체 칸 → gap이 점 양옆에 붙으므로 6px(점 포함 총 ~16px, 점 추가 전 간격과 동일) */
  .sch-grid .sch-col-title { white-space: nowrap; }   /* 색 미지정 = 버튼 기본색(민트) 상속, 단일 일정 제목과 동일 */
  .sch-grid .sch-btn-dtime { color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sch-grid .sch-dtime-merged { grid-column: 1 / -1; }   /* dtime이 전부 같을 때 한 칸으로 병합(전 열 span) */
  .sch-grid .sch-sep { opacity: .55; }   /* 일정 사이 가운뎃점 — 민트 상속, 구분자로 읽히게 약간 옅게 */
  .sch-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sch-item:last-child { border-bottom: none; }
  .sch-item-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .sch-item-when { font-size: 11px; color: var(--muted); font-weight: 600; }
  .sch-item-title {
    font-size: 14px; color: var(--text); font-weight: 700;
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-width: 0;
  }
  a.sch-item-title:hover { color: var(--accent); }
  .sch-item-title svg { width: 12px; height: 12px; opacity: 0.7; flex-shrink: 0; }
  .sch-item-dday {
    font-size: 13px; color: var(--accent); font-weight: 700;
    white-space: nowrap; flex-shrink: 0; font-variant-numeric: tabular-nums;
  }
  .celebration-box {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
    flex-shrink: 0;
    text-decoration: none;
    cursor: pointer;
    background: rgba(var(--cb-rgb), 0.12);
    border: 1px solid rgba(var(--cb-rgb), 0.4);
    transition: background 0.15s, border-color 0.15s;
  }
  .celebration-box:hover { background: rgba(var(--cb-rgb), 0.22); border-color: rgba(var(--cb-rgb), 0.7); }
  .celebration-box svg { width: 16px; height: 16px; flex-shrink: 0; }
  /* 상단바/사이드바 PC↔모바일 변형 토글 (기본=PC, 모바일 변형은 700px 미디어쿼리에서 표시) */
  .tb-t-mb { display: none; }
  .nav-label-mb { display: none; }
  .nav-live-dot-m { display: none; }
  .header-center {
    margin-left: auto; text-align: right; color: var(--muted);
    font-size: 12px; min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }
  .header-center-line {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 100%;
  }
  .header-disclaimer {
    font-size: 11px;
    opacity: 0.75;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .page { display: none; flex: 1; flex-direction: column; }
  .page.active { display: flex; }

  /* 컨테이너 쿼리 기준점: 각 탭 콘텐츠 영역(뷰포트가 아닌 실제 폭) 기준으로 열 수/전환 판단 → 좌측 사이드바·패딩 자동 반영 + 멤버 증가 대응 */
  #app, #statsBody, #linksBody, #membersBody, .hall-wrap { container-type: inline-size; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px; padding: 22px 30px;
    max-width: 1520px; width: 100%; margin: 0 auto;
    flex: 1;
  }
  @container (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @container (max-width: 800px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @container (max-width: 520px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    overflow: hidden;
    text-decoration: none; color: inherit;
    display: block;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  }

  .card.live { border-color: var(--accent); }
  .card.live:hover { border-color: var(--accent2); box-shadow: 0 8px 24px rgba(97,255,236,0.18); }


  .card.offline .card-thumb { opacity: 0.4; }
  .card.offline .card-name { color: var(--muted) !important; }
  .card.vacation .card-thumb { opacity: 0.85; filter: saturate(0.75); }
  .card.vacation .card-thumb .placeholder img { max-width: 100%; max-height: 100%; opacity: 1; object-fit: cover; }

  .card-thumb {
    width: 100%; aspect-ratio: 16/9;
    background: var(--surface2);
    position: relative; overflow: hidden;
  }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-thumb .placeholder {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden; gap: 8px;
  }
  .card-thumb .placeholder img {
    max-width: 50%; max-height: 60%;
    width: auto; height: auto;
    object-fit: contain; opacity: 0.4;
  }
  .placeholder-mode-text {
    font-size: 12px; font-weight: 600;
    color: var(--muted); letter-spacing: 0.5px;
    text-align: center;
  }
  .badge-mode {
    position: absolute; top: 10px; right: 10px;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.5px; padding: 3px 8px; min-width: 46px; box-sizing: border-box;
    background: transparent; border: 1.5px solid currentColor;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1;

  .events-wrap {

    .events-wrap.evt-sort-asc .filter-panel { order: 0; }        /* 오래된순: 필터를 아래로(DOM 순서 복귀) */
  }
  .timeline { background: var(--surface); border: 1px solid var(--border); min-width: 0; }

  .filter-panel {

  }
  /* 멤버/종류 그리드 좌측에 '모두 선택/해제' 버튼 — 버튼은 그리드 높이만큼 stretch. 전체 관련 액션이라 좌측 배치(크루소개 등과 동일 패턴) */
  .filter-row { display: flex; gap: 6px; align-items: stretch; }
  /* 외곽선 알약 버튼. 좁은 세로 버튼 — 폭 좁으면 '모두/선택' 2줄(keep-all) 자동 분리. 이벤트·케미 필터 공용 */
  .filter-toggle-all {
    width: 38px;
    flex-shrink: 0;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    color: var(--accent);
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 2px;
    line-height: 1.25;
    white-space: normal;
    word-break: keep-all;
    transition: all 0.15s;
  }

  .filter-members { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1; min-width: 0; }
  @media (max-width: 900px) { .filter-members { grid-template-columns: repeat(6, 1fr); } }   /* 모바일 strip: 6열(12명=6×2) */
  .filter-member {
    position: relative;
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer; overflow: hidden;
    transition: all 0.15s; padding: 0;
  }
  .filter-member img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: opacity 0.15s;
  }
  .filter-member:not(.on) img { opacity: 0.25; filter: grayscale(1); }
  .filter-member:not(.on) { border-color: transparent; }
  .filter-member.on { border-color: var(--accent); }
  .filter-member:hover { border-color: var(--accent); }

  /* 종류 필터: 멤버와 동일한 정사각 셀(아이콘 위·라벨 아래). 열 수를 멤버와 맞춰 셀 크기 일치(PC 3열/모바일 6열). 5종 + 모두선택 좌측 */
  /* 종류 필터: 아이콘 전용(텍스트 제거). 정사각 셀에 SVG만 크게 강조, 의미는 title 툴팁으로 보존. PC 3열·모바일 6열로 멤버 그리드와 셀 크기 동일 */
  .filter-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1; min-width: 0; }
  .filter-type {
    display: flex; align-items: center; justify-content: center;
    aspect-ratio: 1;
    min-height: 0; overflow: hidden;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer; transition: all 0.15s;

  .filter-type:hover { border-color: var(--accent); }
  .filter-type.on { border-color: var(--accent); }
  .filter-type:not(.on) { opacity: 0.35; }
  .filter-type:not(.on):hover { opacity: 0.6; }
  .filter-type .filter-icon { width: 55%; height: 55%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .filter-type .filter-icon svg { width: 100%; height: 100%; }   /* SVG에 박힌 width/height 무시하고 셀 비례로 스케일(비율은 meet로 유지) */
  /* 모바일 strip: 종류도 멤버와 동일 6열(5종 + 우측 빈칸 1) */
  @media (max-width: 900px) { .filter-types { grid-template-columns: repeat(6, 1fr); } }
  .filter-type[data-type="soop"] .filter-icon { color: var(--ev-start); }
  .filter-type[data-type="chat"] .filter-icon { color: #a78bfa; }
  .filter-type[data-type="post"] .filter-icon { color: var(--ev-post); }
  .filter-type[data-type="youtube"] .filter-icon { color: var(--ev-youtube); }
  .filter-type[data-type="cafe"] .filter-icon { color: #03C75A; }

  .filter-summary {
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid var(--border);

  }
  .event {

  .event-icon {

  .event-icon.end { background: rgba(248,113,113,0.15); color: var(--ev-end); }
  .event-icon.title { background: rgba(251,191,36,0.15); color: var(--ev-yellow); }
  .event-icon.category { background: rgba(251,191,36,0.15); color: var(--ev-yellow); }
  .event-icon.mode_change { background: rgba(251,191,36,0.15); color: var(--ev-yellow); }
  .event-icon.post { background: rgba(52,211,153,0.15); color: var(--ev-post); }
  .event-icon.comment_recommend { background: rgba(52,211,153,0.15); color: var(--ev-post); }
  .event-icon.youtube { background: rgba(239,68,68,0.15); color: var(--ev-youtube); }
  .event-icon.cafe_post { background: rgba(3,199,90,0.15); color: #03C75A; }
  .event-icon.chat { background: rgba(167,139,250,0.15); color: #a78bfa; }
  .event-icon.chat_emoticon { background: rgba(167,139,250,0.15); color: #a78bfa; }
  .event-icon.donation { background: rgba(167,139,250,0.15); color: #a78bfa; }
  .event a.event-link { color: inherit; text-decoration: none; display: contents; }
  .event a.event-link:hover .event-detail { color: var(--accent2); }
  .event-avatar { width: 28px; height: 28px; object-fit: cover; flex-shrink: 0; }
  .event-body { flex: 1; min-width: 0; font-size: 14px; min-height: 38px; display: flex; flex-direction: column; justify-content: center; }
  .event-member { font-weight: 700; margin-right: 6px; }
  .event-elapsed { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .event-action { color: var(--muted); }
  .event-target { color: #cbd5e1; margin-left: 4px; display: inline-block; }   /* 괄호는 하나의 덩어리 — inline이면 앞 텍스트와 섞여 중간에서 끊기므로 inline-block으로 묶음. 한 줄에 안 들어가면 통째로 다음 줄로, 카페명처럼 길면 본문 폭 안에서 덩어리 내부 줄바꿈(좁은 모바일 가로 overflow 방지). 짧은 '(X 방송)'은 공간 되면 앞 조각과 같은 줄. */
  /* 멤버명·액션라벨·경과시간은 짧으니 각각 한 줄 고정(조각 내부 중간이 안 끊김). */
  .event-member, .event-action-label, .event-elapsed { white-space: nowrap; }
  .event-mode-tag {
    display: inline-flex; align-items: center; justify-content: center;

  .event-mode-tag.adult { color: var(--mode-adult); }

  .event-detail {

  /* 좁은 화면(≤480px)에서만 날짜·시간 2줄 분리. '좁을때'를 480px로 정의 — 이 숫자만 바꾸면 조정됨 */

  .timeline-header {

  .sort-toggle {

  @container (max-width: 480px) { .stats-grid { grid-template-columns: 1fr; } }   /* 카드 행이 nowrap이라 셀이 ~220px 밑이면 그리드가 넘쳐 가로스크롤 → 항상 그 이상 유지되도록 열 감소 */

  /* 모바일: 멤버 가로 매트릭스 대신 멤버별 세로 블록 (가로 스크롤 제거). 데스크톱은 .links-table-wrap 유지 */

  /* 표 min-width 720px + .links-wrap 좌우 패딩 48px → 뷰포트 768px 미만에서 표가 넘침. 그 지점에서 블록으로 전환 */
  /* 콘텐츠가 테이블 최소폭(720px) 밑으로 가기 전에 모바일 세로 블록으로 전환 → 가로스크롤 방지. 멤버=열이라 멤버 증가 시 테이블 min-width와 이 임계값을 함께 올려야 함 */

  /* === 케미 탭 === */
  .chem-wrap {
    padding: 20px 24px;
    max-width: 1400px; width: 100%; margin: 0 auto;
    flex: 1;
    display: grid; grid-template-columns: 1fr 280px;
    gap: 20px; align-items: start;
  }
  @media (max-width: 900px) {
    .chem-wrap { grid-template-columns: 1fr; }
    .chem-filter-panel { position: static !important; order: -1; }   /* 모바일: 필터를 케미 위 strip으로 */
  }
  .chem-content { container-type: inline-size; min-width: 0; }   /* 카드 열 수를 뷰포트가 아닌 이 콘텐츠 칸 폭 기준으로 판단(컨테이너 쿼리) */
  /* 케미 필터: 이벤트 .filter-panel과 동일 — 우측 사이드 sticky. 스크롤이 길어(2인+그룹) 필터 상시 노출이 이득 */
  .chem-filter-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px;
    position: sticky; top: 20px;
  }
  .chem-filter-members {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    flex: 1; min-width: 0;
  }
  @media (max-width: 900px) { .chem-filter-members { grid-template-columns: repeat(6, 1fr); } }   /* 모바일 strip: 6열 */
  .chem-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  /* 콘텐츠 칸 실제 폭 기준 — 필터 사이드바(280px) 제외분에 맞춰 줄어듦. 콘텐츠 최대폭이 ~1050px(1400-280-gap)라 4열은 가장 넓을 때만 */
  @container (max-width: 1000px) { .chem-grid { grid-template-columns: repeat(3, 1fr); } }
  @container (max-width: 700px) { .chem-grid { grid-template-columns: repeat(2, 1fr); } }
  @container (max-width: 480px) { .chem-grid { grid-template-columns: 1fr; } }
  .chem-card {

  }

  .chem-name {
    font-size: 13px; font-weight: 700;
    text-align: center; margin-bottom: 12px;
    color: var(--text);
  }
  .chem-body {
    display: flex; align-items: center;
    gap: 10px; justify-content: center;

  .chem-chat-ico svg { width: 12px; height: 12px; }
  .chem-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px; grid-column: 1 / -1; }

  /* 트랙 헤더(모두 포함·일부 포함): 하위 섹션 라벨(2인/3인 케미)보다 위계 ↑ — 더 크고 밝게 + 민트 바 */

  @media (max-width: 800px) { .chem-group-grid { grid-template-columns: repeat(2, 1fr); } }

    gap: 2px;
    flex-wrap: wrap;
    flex-shrink: 0;
    justify-content: flex-end;
    max-width: 132px;
  }
  .banner-card-members img {
    width: 20px; height: 20px;
    object-fit: cover;
    border: 1px solid var(--border);
  }

  /* === 명예의 전당 탭 === */
  .hall-wrap {
    padding: 20px 24px;
    max-width: 1400px; width: 100%; margin: 0 auto;
    flex: 1;
    display: flex; flex-direction: column;
    gap: 16px;
  }
  .hall-bar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .hall-bar-label { font-size: 13px; font-weight: 600; color: var(--muted); user-select: none; }
  .hall-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  /* 열 수는 2·3위 보기(수평형: 사진104px+순위행, 더 넓은 카드 필요) 켜진 상태 기준으로 통일 → 토글해도 열이 안 바뀜. 세로형은 같은 열수에서 카드만 더 여유 */
  @container (max-width: 1200px) { .hall-grid { grid-template-columns: repeat(3, 1fr); } }
  @container (max-width: 740px) { .hall-grid { grid-template-columns: repeat(2, 1fr); } }
  @container (max-width: 550px) { .hall-grid { grid-template-columns: 1fr; } }
  .hall-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px 14px;
    display: flex; flex-direction: column;
    gap: 10px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .hall-card:hover { border-color: var(--time); box-shadow: 0 4px 12px rgba(251,191,36,0.12); }
  .hall-cat {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 14px; font-weight: 700;
    color: var(--text); letter-spacing: 0.5px;
    text-align: center;
  }
  .hall-cat-icon { display: inline-flex; align-items: center; flex-shrink: 0; }
  .hall-cat-icon svg { width: 15px; height: 15px; display: block; }
  /* 카드 본문: 두 레이아웃 공존. 끔=세로(hall-v, 1위만), 켬=수평(hall-h, 1~3위). 토글로 전환, 높이는 JS 실측으로 통일 */
  .hall-content { display: flex; flex-direction: column; justify-content: center; }
  .hall-h { display: none; flex-direction: column; gap: 3px; padding-right: 20px; }   /* 우측 여백: 토글 ON에서 카드 간 기록 값(우측 정렬) 열을 맞추기 위해 단독·공동 모두 동일 적용 */
  .hall-h-body { display: flex; align-items: center; gap: 12px; }   /* 설명 제외 [사진 | 1·2·3행] — 사진 수직중앙이 행 블록(=2등 행) 중앙과 맞음 */
  .hall-wrap.show-ranks .hall-v { display: none; }
  .hall-wrap.show-ranks .hall-h { display: flex; }
  /* 끔: 세로 (사진 + 이름 + 설명:값) — 기존의 그 화면 */
  .hall-v { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .hall-v-winners { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: flex-end; }
  .hall-v-w { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .hall-v-w img { object-fit: cover; box-sizing: border-box; border: 2px solid var(--time); }
  .hall-v-name { font-size: 13px; font-weight: 700; }
  .hall-v-val { font-size: 13px; font-weight: 700; color: var(--time); text-align: center; line-height: 1; }
  .hall-v-desc { color: var(--muted); font-weight: 600; font-size: 11px; }
  /* 켬: 수평 [좌: 1위 사진 | 우: 설명 헤더 + 금/은/동 1~3위 행] */
  .hall-photos {
    display: flex; flex-wrap: wrap; gap: 8px;
    width: 104px; flex-shrink: 0;            /* 사진 칸 고정폭: 단독 64px 또는 공동 48px 2개. 3~4명은 2줄(아래로) */
    justify-content: center; align-content: center;
  }
  .hall-photos img {
    object-fit: cover; box-sizing: border-box;
    border: 2px solid var(--time);           /* 공동 1위 = 금 테두리. 크기는 단독 64/공동 48, JS에서 인라인 지정 */
  }
  .hall-data { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .hall-desc { color: var(--muted); font-weight: 600; font-size: 11px; text-align: right; }
  .hall-row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    font-size: 13px; font-weight: 700; line-height: 1.4;
  }
  .hall-r-name { text-align: left; word-break: keep-all; }
  .hall-r-val { text-align: right; white-space: nowrap; flex-shrink: 0; }
  .hall-row.m1 .hall-r-val { color: var(--time); }
  .hall-row.m2 .hall-r-val { color: #cbd5e1; }
  .hall-row.m3 .hall-r-val { color: #d98e4d; }
  .hall-empty {
    flex: 1; display: flex; align-items: center;
    color: var(--muted); font-size: 12px; padding: 16px 0;
  }

  /* === 구성원 탭 === */
  .members-wrap {
    padding: 20px 24px;
    max-width: 1600px; width: 100%; margin: 0 auto;
    flex: 1;
  }
  .members-tabs-wrap {
    display: grid;
    grid-template-columns: repeat(13, 1fr);
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px;
    margin: 0 auto 16px;
    max-width: 920px;
  }
  .members-tab {
    position: relative;
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1.5px solid transparent;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.15s;
    padding: 0;
    font-family: inherit;
    box-sizing: border-box;
  }
  .members-tab img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: opacity 0.15s, filter 0.15s;
  }
  .members-tab:not(.active) img { opacity: 0.25; filter: grayscale(1); }
  .members-tab:not(.active) { border-color: transparent; }
  .members-tab.active { border-color: var(--accent); }
  .members-tab:hover { border-color: var(--accent); }
  .members-tab-crew {
    position: relative;
  }
  .members-tab-crew img {
    width: 100%; height: 100%;
    object-fit: contain;
  }

  .members-crew {
    display: flex; gap: 16px;
    max-width: 1300px;   /* 전체폭 확대 — 비율 2.4:1 유지한 채 우측 활동 패널 절대폭 확보(가장 긴 줄 한 줄 수용). 좌측 소개도 함께 넓어짐 */
    margin: 0 auto;
    align-items: stretch;
  }
  /* 우측 활동/연혁 패널이 좁아져 가독성 무너지기 전에 세로 스택 — 콘텐츠 900px 밑(활동 패널 ~265px 밑)에서 전환(뷰포트 아닌 실제 폭 기준) */
  @container (max-width: 900px) {
    .members-crew { flex-direction: column; }
    .members-crew-intro, .members-crew-activities { flex: none; }
  }
  .members-crew-intro {
    flex: 2.4; min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 28px 32px;
    text-align: center;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  .members-crew-intro-img {
    max-width: 380px;
    width: 100%;
    margin: 0 auto 32px;
    display: block;
  }
  .members-crew-intro p {
    font-size: 15px; color: var(--muted);
    line-height: 1.8; max-width: 720px;
    margin: 0 auto; word-break: keep-all;
  }
  .members-crew-activities {
    flex: 1; min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 22px 24px;
    display: flex; flex-direction: column;
  }
  .crew-act-sub {
    font-size: 12px; font-weight: 700; color: var(--accent);
    letter-spacing: 1.5px; margin: 16px 0 7px;
  }
  .crew-act-sub:first-child { margin-top: 0; }
  .crew-act-li {
    display: flex; gap: 9px;
    font-size: 14px; color: #94a3b8;
    line-height: 1.5; padding: 4px 0;
  }
  .crew-act-li .dot { color: var(--accent); flex: none; }
  .crew-act-li .d { color: #cbd5e1; font-weight: 700; }
  .crew-act-li .tag { color: var(--muted); font-size: 12px; }
  .crew-act-more { margin-top: auto; padding-top: 16px; text-align: right; }
  .crew-act-more button {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 700; color: var(--accent);
    background: rgba(97,255,236,0.08); border: 1px solid rgba(97,255,236,0.35);
    padding: 7px 14px; cursor: pointer; font-family: inherit;
  }
  .crew-act-more button:hover { background: rgba(97,255,236,0.16); border-color: rgba(97,255,236,0.6); }

  .members-profile {
    display: flex; gap: 16px;
    max-width: 1000px;
    margin: 0 auto;
    align-items: stretch;
  }
  .members-profile-photo {
    position: relative;
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
  }
  .members-profile-photo img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .members-profile-main {
    display: flex; flex-direction: column; gap: 16px;
    flex: 1;
    min-width: 0;
    container-type: inline-size;   /* 헤더 버튼 2×2 전환을 정보 컬럼 폭 기준으로(뷰포트 아님) */
  }
  @media (max-width: 640px) {
    .members-profile { flex-direction: column; }
    .members-profile-photo { width: 70%; max-width: 300px; margin: 0 auto; aspect-ratio: 3 / 4; }
  }
  .members-profile-header {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px;
    display: flex; align-items: center; gap: 20px;
  }
  .members-profile-avatar {
    width: 72px; height: 72px;
    object-fit: cover;
    border: 3px solid var(--border);
    flex-shrink: 0;
  }
  .members-profile-info { display: flex; flex-direction: column; gap: 4px; }
  .members-profile-name { font-size: 22px; font-weight: 800; }
  .members-profile-eng {
    font-size: 12px; color: var(--muted); font-weight: 600;
    letter-spacing: 1.5px; opacity: 0.7;
  }
  .members-profile-quick {
    margin-left: auto;
    display: flex; gap: 6px;
    flex-shrink: 0;
  }
  .members-quick-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    padding: 0;
    font-family: inherit;
  }
  .members-quick-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(97,255,236,0.08);
  }
  .members-quick-btn.quick-soop:hover { border-color: #0388FF; color: #0388FF; background: rgba(3,136,255,0.10); }
  .members-quick-btn.quick-youtube:hover { border-color: #FF0000; color: #FF0000; background: rgba(255,0,0,0.10); }
  .members-quick-btn.quick-naver:hover { border-color: #03C75A; color: #03C75A; background: rgba(3,199,90,0.10); }
  .members-quick-btn svg { width: 16px; height: 16px; display: block; }
  @container (max-width: 520px) { .members-profile-quick { display: grid; grid-template-columns: repeat(2, auto); } }   /* 정보 컬럼 ≤520px면(폰/태블릿 2단 무관) 이름 우측 버튼 2×2 */
  .members-profile-id {
    font-size: 11px; color: var(--muted); font-weight: 500;
    opacity: 0.5;
  }
  .members-info-section {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 20px 24px;
  }
  .members-info-title {
    font-size: 12px; font-weight: 700;
    color: var(--muted); letter-spacing: 1px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .members-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    column-gap: 24px;
  }
  @media (max-width: 500px) { .members-info-grid { grid-template-columns: 1fr; column-gap: 0; } }
  .members-info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(30,39,64,0.5);
    gap: 8px;
    min-height: 36px;
  }
  .members-info-row-full {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(30,39,64,0.5);
    gap: 8px;
    grid-column: 1 / -1;
    min-height: 36px;
  }
  .members-info-label {
    font-size: 13px; color: var(--muted); font-weight: 600;
    flex-shrink: 0; line-height: 20px;
  }
  .members-info-value {
    font-size: 14px; color: var(--text); font-weight: 700;
    text-align: right; white-space: nowrap; line-height: 20px;
  }

  /* 프로필/통계 상단 셀렉터: 1행(11~12칸, max-width 800/880)이 폭 좁아지면 버튼이 ~67px 밑으로 작아짐. 메인 사이드바가 상단으로 가는 700px보다 앞서, 1100px부터 2행으로 전환(버튼 크게 유지). 멤버=크루(좌측 2행)+12를 7열, 통계=연간/월간 좌측 세로 스택 */
  @media (max-width: 1100px) {
    .stats-tabs-wrap { grid-template-columns: repeat(7, 1fr); }
    .members-tabs-wrap { grid-template-columns: repeat(7, 1fr); }
    .stats-tab-all[data-mode="annual"]  { grid-column: 1; grid-row: 1; }
    .stats-tab-all[data-mode="monthly"] { grid-column: 1; grid-row: 2; }
    .members-tab-crew { grid-column: 1; grid-row: 1 / span 2; aspect-ratio: auto; }
  }

  @media (max-width: 700px) {
    body { flex-direction: column; }
    /* 상단바 모달(모바일): PC처럼 중앙 + 내부 스크롤 유지(패널 max-height:80vh, lr-body 스크롤). 헤더(X)가 고정돼야 내용 스크롤 중에도 닫기 가능 → 페이지 스크롤 대신 내부 스크롤. 짧으면 중앙 정렬 */
    .lr-overlay { align-items: center; }
    .sidebar {
      width: 100%; height: auto;
      position: relative;
      flex-direction: column; padding: 0;
    }
    .sidebar-logo { padding: 8px; min-height: 0; }
    .nav-list { flex-direction: row; flex: none; padding: 8px; flex-wrap: wrap; align-items: center; justify-content: center; }
    .nav-item {
      flex-direction: column; gap: 4px;
      border-left: none;
      border-bottom: 3px solid transparent;
      padding: 8px 2px; white-space: nowrap;
      flex: 1 1 0;   /* 9칸 균등폭으로 가로 꽉 채움 — 기본 min-width:auto라 라벨보다 좁아지진 않고, 320px 미만 등 극협폭이면 flex-wrap으로 잘림 없이 다음 줄로 */
      font-size: 10px; line-height: 1.2;
    }
    .nav-item.active { border-left: none; border-bottom-color: var(--accent); }
    .nav-events-label { position: static; }   /* 모바일: 뱃지를 nav-item(아이콘 위 우상단)에 앵커 — 현행 유지 */
    .nav-badge { position: absolute; right: 6px; top: 4px; }
    .nav-notify-bell { display: none; }
    .main-header { padding: 12px 16px; min-height: 0; flex-wrap: wrap; gap: 10px; }
    /* 3열(상단바): 버튼 좌 · 설명 우 — width:100% 스택 해제, header-center는 base의 margin-left:auto로 우측. 좁으면 wrap으로 설명이 아래로 */
    .page-title { gap: 6px; align-items: stretch; }
    /* 상단바 우측 갱신정보: 좁은 모바일에선 '주기 · 시각'을 2줄로 분리(주기/시각/비공식문구=3줄). PC는 스팬 inline이라 1줄 유지. */
    .header-center-line { white-space: normal; }
    .header-center-line .hc-period, .header-center-line .hc-stamp { display: block; }
    .header-center-line .hc-mid { display: none; }
    /* 탭별 상단바 높이 통일: 갱신줄 유무로 1~3줄 차가 나 높이가 변하던 문제 → 3줄 높이 예약(모든 탭 동일 클램프) + 세로 가운데정렬(짧은 탭은 비공식문구가 중앙). PC는 main-header min-height:66px로 이미 통일. */
    .header-center { min-height: 52px; justify-content: center; }
    /* 상단바 버튼: 세로 미니(아이콘 위 · 짧은 텍스트 아래) + PC/모바일 토글 */
    .page-title-link, .celebration-box {
      flex-direction: column; gap: 2px; justify-content: center;
      padding: 6px 8px; font-size: 9px;
      text-align: center; line-height: 1.3;
      min-width: 60px;   /* 전 버튼 동일 폭 — 가장 긴 라벨 기준 floor (좋아요·커버곡·N주년!·N일! 등 모두 수용) */
    }
    .tb-t-pc { display: none; }
    .tb-t-mb { display: block; }
    /* 기념일 박스 모바일(C안): 아이콘 + "이름 종류" 한 줄, 폭 가변(긴 이름은 넓어짐) */
    .celebration-box .tb-t-mb { white-space: nowrap; font-weight: 700; }
    /* 사이드바 라벨: 긴 것만 축약본으로 교체 */
    .nav-label-pc { display: none; }
    .nav-label-mb { display: inline; }
    /* 라이브: PC 뱃지 제거 → 생방송 아이콘 우상단 점(회색=없음 / 빨강=방송중) */
    .nav-live-badge { display: none; }
    .nav-live-dot-m {
      display: block; position: absolute; top: 4px; right: 8px;
      width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
    }
    .nav-live-badge.on ~ .nav-live-dot-m {
      background: var(--live); box-shadow: 0 0 5px var(--live-glow);
    }
    .grid, .events-wrap, .stats-wrap, .chem-wrap, .content-wrap, .members-wrap, .hall-wrap { padding: 16px; }
    .stats-tabs-members, .stats-tabs-side { display: contents; }
  }
</style>

const MODE_LABEL = {
  normal: '일반', adult: '19+',
  subscription: '구독+', copyright: '저작권', password: '비번', restricted: '기타',
};
const MODE_PLACEHOLDER_TEXT = {
  adult: '19금 방송', subscription: '구독플러스 전용 방송',
  copyright: '저작권 방송', password: '비밀번호 방송', restricted: '기타 제한 방송',
};
// mode는 활성 속성 조합 문자열('adult_subscription' 등) — '_'로 분해해 각각 배지로. 단일/normal/레거시 'adult_copyright'도 그대로 분해됨.
function modeParts(mode) {
  return (mode || 'normal').split('_');
}
// 조합 문자열을 사람이 읽는 라벨로(예: 'adult_subscription' → '19+ · 구독+'). mode_change before/after 표시용.
function modeLabel(mode) {
  return modeParts(mode).map(p => MODE_LABEL[p] || p).join(' · ');
}
// 썸네일 없는 제한방송의 안내 텍스트(조합 대응). 예: 'adult_password' → '19금 방송 · 비밀번호 방송'.
function modePlaceholder(mode) {
  if (!mode || mode === 'normal') return '';
  return modeParts(mode).map(p => MODE_PLACEHOLDER_TEXT[p] || MODE_LABEL[p] || p).join(' · ');
}

const CHEM_NAME_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=574378390';
const LS_CHEMNAME_CACHE = 'chuntaverse_chem_names_v1';
let CHEM_NAMES = {};
let CHEM_GROUPS = [];
function applyChemNameRows(rows) {
  const names = {};
  const groups = [];
  const memberIndex = {};
  MEMBERS.forEach((m, i) => { memberIndex[m.id] = i; });
  for (const r of (rows || [])) {
    const name = (r[0] || '').trim().replace(/\s*,\s*/g, ' · ');  // 시트엔 쉼표로 적고 표시는 사이트 규약인 가운뎃점
    if (!name || name === '케미명') continue;  // 빈 행·헤더 행 무시
    // B열~ 멤버 칸: 현수막·컨텐츠와 동일하게 칸에 적힌 이름으로 멤버 매칭(열 위치 무관, 빈 칸·미상 이름은 스킵)
    const ids = r.slice(1)
      .map(c => (c || '').trim())
      .filter(c => c.length > 0)
      .map(nm => (MEMBERS.find(x => x.name === nm) || {}).id)
      .filter(Boolean);
    // 쌍 키는 renderChemistry의 케미 카드 조회 키(`m1.id:m2.id`, MEMBERS 순서라 i<j)와 맞아야 하므로 MEMBERS 인덱스 순으로 정렬
    ids.sort((a, b) => memberIndex[a] - memberIndex[b]);
    if (ids.length === 2) names[`${ids[0]}:${ids[1]}`] = name;
    else if (ids.length >= 3) groups.push({ members: ids, name });
  }
  CHEM_NAMES = names;
  CHEM_GROUPS = groups;
}

async function loadChemNames() {
  if (Object.keys(CHEM_NAMES).length === 0 && CHEM_GROUPS.length === 0) {
    const cached = lsGet(LS_CHEMNAME_CACHE, null);
    if (cached) {
      try { applyChemNameRows(JSON.parse(cached)); if (currentPage === 'chemistry') renderChemistry(); } catch (e) {}
    }
  }
  try {
    const res = await fetch(CHEM_NAME_SHEET_URL);
    if (!res.ok) throw new Error('no data');
    const rows = parseCSV(await res.text());
    applyChemNameRows(rows);
    lsSet(LS_CHEMNAME_CACHE, JSON.stringify(rows));
    if (currentPage === 'chemistry') renderChemistry();
  } catch (e) {}
}

function calcAge(memberId, ageStr) {
  if (!ageStr) return '';
  if (ageStr === '비공개') return '비공개';
  if (ageStr === '700살') return '700세';
  const match = ageStr.match(/^(\d{4})년생$/);
  if (!match) return ageStr;
  const birthYear = parseInt(match[1]);
  const bd = MEMBER_BIRTHDAYS[memberId];
  const kst = new Date(Date.now() + 9 * 3600 * 1000);
  const cy = kst.getUTCFullYear(), cm = kst.getUTCMonth() + 1, cd = kst.getUTCDate();
  let age = cy - birthYear;
  if (bd && (cm < bd.month || (cm === bd.month && cd < bd.day))) age--;
  return `${age}세 (${ageStr})`;
}

function calcDaysSince(dateStr) {
  if (!dateStr) return '';
  const match = dateStr.match(/^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일$/);
  if (!match) return dateStr;
  const startDate = new Date(Date.UTC(parseInt(match[1]), parseInt(match[2]) - 1, parseInt(match[3])));
  const kst = new Date(Date.now() + 9 * 3600 * 1000);
  const today = new Date(Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), kst.getUTCDate()));
  const diffDays = Math.floor((today - startDate) / 86400000);
  if (diffDays < 0) return dateStr;
  return `${dateStr} (D+${diffDays}일)`;
}

function getTodayCelebrations() {
  const kst = new Date(Date.now() + 9 * 3600 * 1000);
  const cy = kst.getUTCFullYear(), cm = kst.getUTCMonth() + 1, cd = kst.getUTCDate();
  const todayMs = Date.UTC(cy, cm - 1, cd);
  const results = [];

  for (const m of MEMBERS) {
    const bd = MEMBER_BIRTHDAYS[m.id];
    if (!bd || bd.month !== cm || bd.day !== cd) continue;
    const info = MEMBER_INFO[m.id];
    const birthMatch = info?.age?.match(/^(\d{4})년생$/);
    const nthText = birthMatch ? `${cy - parseInt(birthMatch[1])}번째 ` : '';
    results.push(celebBox(CELEB_SVG.birthday, `${m.name}님의 ${nthText}생일을<br>축하합니다!`, m.name, '생축!', m.color, `members:${m.id}`));
  }

  if (cm === 11 && cd === 30 && cy > 2025) {
    results.push(celebBox(CELEB_SVG.chuntaverse, `천타버스 결성 ${cy - 2025}주년을<br>축하합니다!`, '천타버스', `${cy - 2025}주년!`, '#61FFEC', 'members:crew'));
  }
  const ctDays = Math.floor((todayMs - CT_FORMATION.getTime()) / 86400000);
  if (ctDays > 0 && ctDays % 100 === 0 && !(cm === 11 && cd === 30)) {
    results.push(celebBox(CELEB_SVG.chuntaverse, `천타버스 결성 ${ctDays}일을<br>축하합니다!`, '천타버스', `${ctDays}일!`, '#61FFEC', 'members:crew'));
  }

  for (const m of MEMBERS) {
    const info = MEMBER_INFO[m.id];
    if (!info?.firstStream) continue;
    const match = info.firstStream.match(/^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일$/);
    if (!match) continue;
    const fy = parseInt(match[1]), fm = parseInt(match[2]), fd = parseInt(match[3]);
    if (fm === cm && fd === cd && cy > fy) {
      results.push(celebBox(CELEB_SVG.broadcast, `${m.name}님의 숲 방송 ${cy - fy}주년을<br>축하합니다!`, m.name, `${cy - fy}주년!`, m.color, `members:${m.id}`));
    } else {
      const days = Math.floor((todayMs - Date.UTC(fy, fm - 1, fd)) / 86400000);
      if (days > 0 && days % 100 === 0) {
        results.push(celebBox(CELEB_SVG.broadcast, `${m.name}님의 숲 방송 ${days}일을<br>축하합니다!`, m.name, `${days}일!`, m.color, `members:${m.id}`));
      }
    }
  }

  return results;
}

function lsKeySet(key) { try { return new Set(JSON.parse(lsGet(key, '[]'))); } catch (e) { return new Set(); } }
function lsKeyAdd(key, keys) { const s = lsKeySet(key); let ch = false; keys.forEach(k => { if (!s.has(k)) { s.add(k); ch = true; } }); if (ch) lsSet(key, JSON.stringify([...s])); }
// 좋아요 숨김 B열(만료일) 판정: B 비었거나 날짜 형식 밖이면 즉시 숨김, 날짜면 그날(KST)까지 노출하고 지나면 숨김.
// 날짜는 일정 시트와 동일 YYYY-MM-DD 기준(. / 구분·한 자리 월일·뒤따르는 구분자 허용). B엔 날짜만 적을 것(여분 텍스트는 형식 밖→즉시 숨김).
function likeHideActiveOn(dateRaw, todayKst) {
  const m = String(dateRaw || '').trim().replace(/\s+/g, '').replace(/[.\/]/g, '-').replace(/-+$/, '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (!m) return true;
  const due = `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  return todayKst > due;
}
// 캐시 엔트리({u: 정규화URL, d: 만료일})에서 "지금 숨겨야 할" URL Set 생성. 날짜는 호출 시점 KST로 매번 재평가(자정 넘기면 자동 반영).
function buildLikeHideSet(entries) {
  const kst = new Date(Date.now() + 9 * 3600 * 1000);
  const todayKst = `${kst.getUTCFullYear()}-${String(kst.getUTCMonth() + 1).padStart(2, '0')}-${String(kst.getUTCDate()).padStart(2, '0')}`;
  const s = new Set();
  for (const e of (entries || [])) {
    if (e && e.u && likeHideActiveOn(e.d, todayKst)) s.add(e.u);
  }
  return s;
}
function lsHideSet() {
  try { return buildLikeHideSet(JSON.parse(lsGet(LS_LIKEHIDE_CACHE, '[]'))); } catch (e) { return new Set(); }
}
// 같은 멤버가 같은 글에 보낸 좋아요 요청만 dedup: 멤버 + normLikeUrl(SOOP은 #comment 제거, 카페는 글 URL) 기준 최신 1건(과거 건 숨김).
// 다른 멤버가 같은 글을 요청한 건은 별개 요청이므로 각각 유지(달타·캬앙이 같은 컨텐츠 좋아요를 요청한 경우 둘 다 노출).
function dedupeLikeReqs(list) {
  const byKey = new Map();
  for (const e of (list || [])) {
    const k = `${e.member_id || ''}|${normLikeUrl(e.url)}`;
    const prev = byKey.get(k);
    if (!prev || new Date(e.time) > new Date(prev.time)) byKey.set(k, e);
  }
  return [...byKey.values()].sort((a, b) => new Date(b.time) - new Date(a.time));
}
async function loadLikeHideSet() {
  let entries = [];
  try {
    const res = await fetch(LIKE_HIDE_SHEET_URL);
    if (!res.ok) throw new Error('no data');
    entries = parseCSV(await res.text())
      .map(r => ({ u: normLikeUrl((r[0] || '').trim()), d: (r[1] || '').trim() }))
      .filter(e => e.u.startsWith('http'));
    lsSet(LS_LIKEHIDE_CACHE, JSON.stringify(entries));
  } catch (e) {
    try { entries = JSON.parse(lsGet(LS_LIKEHIDE_CACHE, '[]')); } catch (e2) { entries = []; }
  }
  return buildLikeHideSet(entries);
}

// 숨김목록 선로딩분(모달 1회용). hover/클릭에서 호출하되 한 번 받기 시작하면 그 약속을 재사용(중복 fetch 방지).
// 모달을 닫을 때 폐기 → 다음 열기는 그 시점 시트를 새로 읽음(stale 없음). loadLikeHideSet은 실패해도 Set을 돌려주므로 reject 없음.
let likeHidePreload = null;
function preloadLikeHide() {
  if (!likeHidePreload) likeHidePreload = loadLikeHideSet();
  return likeHidePreload;
}

async function openLikeRequests() {
  const ov = document.getElementById('lrOverlay');
  const head = document.getElementById('lrHead');
  const body = document.getElementById('lrBody');
  if (!ov || !body) return;
  head.innerHTML = `<span>${SVG_ICONS.thumbsup}멤버들의 좋아요 요청 모아보기</span><button class="lr-close" type="button" onclick="closeLikeRequests()">✕</button>`;
  ov.hidden = false;
  body.innerHTML = '<div class="lr-msg">불러오는 중…</div>';
  try {
    // hover로 이미 받는 중/받아둔 게 있으면 그걸, 아니면 지금 시작. 숨김목록을 손에 쥔 뒤 렌더하므로 "보였다 사라짐" 없음.
    const [res, hideSet] = await Promise.all([fetch(WORKER_URL + '/like-requests'), preloadLikeHide()]);
    const data = await res.json();
    likeReqCache = dedupeLikeReqs(data.like_requests || []);          // 점 계산용 갱신(같은 글 최신만)
    lsSet(LS_LIKEREQ_CACHE, JSON.stringify(likeReqCache));
    const dismiss = lsKeySet(LS_LIKE_DISMISS);
    const list = likeReqCache.filter(e => !hideSet.has(normLikeUrl(e.url)) && !dismiss.has(likeReqKey(e)));
    if (list.length === 0) {
      body.innerHTML = '<div class="lr-msg">기록된 좋아요 요청이 없습니다.</div>';
    } else {
      body.innerHTML = list.map(e => `<div class="lr-item" data-lrkey="${escapeHtml(likeReqKey(e))}">${renderEvent(e, [])}<button class="lr-dismiss" type="button" aria-label="숨기기">✕</button></div>`).join('');
    }
    lsKeyAdd(LS_LIKE_SEEN, list.map(likeReqKey));                     // 본 것으로 표시 → 점 끔
    refreshLikeDot();
  } catch (err) {
    body.innerHTML = '<div class="lr-msg">불러오기에 실패했습니다. 잠시 후 다시 시도해주세요.</div>';
  }
}
function closeLikeRequests() {
  const ov = document.getElementById('lrOverlay');
  if (ov) ov.hidden = true;
  likeHidePreload = null;  // 선로딩분은 모달 1회용 — 다음 열기는 그 시점 최신으로
  schedulePreload = null;  // 일정 모달도 lrOverlay를 공유 — 선로딩분 동일하게 폐기
}
// 빨간 점: 안 숨김(dismiss)·안 가려짐(CSV 캐시)·안 본(seen) 요청이 1개+면 표시
function computeLikeDot() {
  const dismiss = lsKeySet(LS_LIKE_DISMISS), seen = lsKeySet(LS_LIKE_SEEN), hide = lsHideSet();
  return likeReqCache.some(e => {
    const k = likeReqKey(e);
    return !dismiss.has(k) && !seen.has(k) && !hide.has(normLikeUrl(e.url));
  });
}
function refreshLikeDot() {
  const btn = document.getElementById('likeReqBtn');
  if (btn) btn.classList.toggle('has-new', computeLikeDot());
}
// 페이지 로드 시 점 계산용 목록 1회 로드(엣지 캐시 max-age=60 → 대부분 히트, 비용 미미). 캐시 우선으로 점 즉시 반영.
async function loadLikeReqForDot() {
  try { likeReqCache = dedupeLikeReqs(JSON.parse(lsGet(LS_LIKEREQ_CACHE, '[]'))); } catch (e) { likeReqCache = []; }
  refreshLikeDot();
  try {
    const res = await fetch(WORKER_URL + '/like-requests');
    const data = await res.json();
    likeReqCache = dedupeLikeReqs(data.like_requests || []);
    lsSet(LS_LIKEREQ_CACHE, JSON.stringify(likeReqCache));
    refreshLikeDot();
  } catch (e) {}
}
// ✕ 개별 숨김 — localStorage에 요청 키 저장(영구), 열린 모달에서 해당 카드 제거
function dismissLikeRequest(key) {
  lsKeyAdd(LS_LIKE_DISMISS, [key]);
  const body = document.getElementById('lrBody');
  if (body) {
    body.querySelectorAll('.lr-item').forEach(it => { if (it.dataset.lrkey === key) it.remove(); });
    if (!body.querySelector('.lr-item') && !body.querySelector('.lr-msg')) {
      body.innerHTML = '<div class="lr-msg">기록된 좋아요 요청이 없습니다.</div>';
    }
  }
  refreshLikeDot();
}
document.addEventListener('click', (e) => {
  const ov = document.getElementById('lrOverlay');
  if (ov && !ov.hidden && e.target === ov) closeLikeRequests();  // 패널 바깥(배경) 클릭 시 닫기
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLikeRequests();
});
// 좋아요 요청 카드의 ✕(개별 숨김) — 위임. ✕는 .event 링크의 형제라 클릭이 링크로 새지 않음.
document.addEventListener('click', (e) => {
  const x = e.target.closest && e.target.closest('.lr-dismiss');
  if (!x) return;
  const item = x.closest('.lr-item');
  if (item && item.dataset.lrkey) dismissLikeRequest(item.dataset.lrkey);
});

// ── 다가오는 일정 (구글 시트 gid=1374057594) ──
// 열: A=YYYY-MM-DD / B=HH:MM(빈칸 가능) / C=간략제목(버튼용·빈칸 가능) / D=상세제목(모달용) / E=링크(빈칸 가능). C·D 중 하나라도 있으면 행 유지(버튼=C 우선, 모달=D 우선, 한쪽 비면 다른 쪽). 모든 시각은 KST 기준.
// 상단바 버튼: 가장 임박한 일정 1개만 표시 — 당일이고 시간 있으면 D-time(D-HH:MM:SS 초 카운트다운), 그 외(미래 날짜)는 D-day.
// 숨김 기준: 시간 유무와 무관하게 그날 자정(KST)을 넘겨야 빠짐. 시간 있는 일정도 그 시각이 지나면 사라지지 않고 D-DAY로 그날 자정까지 유지(시간 없는 일정과 동일·합방 중에도 상단 노출) → 자정 넘으면 다음 일정으로. 시트 행은 그대로 둠.
// CSV: 페이지 로드 시 1회(버튼 표시용) + 모달 열 때 재풀링(최신 반영). 좋아요 모달과 동일한 lrOverlay·선로딩 패턴 재사용.
// 컨텐츠 시트와 통합(같은 gid). 일정 행 = A열이 날짜(YYMMDD 또는 YYYY-MM-DD)인 행. 컨텐츠 행(A=http URL)은 parseScheduleRows의 날짜 정규화에서 null→자동 제외.
const SCHEDULE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HfDukpvqq9UfFYpT0JMTlX6V0UK95kimxP8EuABERr4/export?format=csv&gid=2043421724';
const LS_SCHEDULE_CACHE = 'chuntaverse_schedule_cache_v2';  // v2: 통합 시트 칼럼 재배치(C=링크/D=간략/E=상세)로 구 캐시(raw rows) 무효화
let scheduleData = [];   // 파싱·정렬 완료된 일정
let scheduleSig = '';    // 버튼 구조(headline·개수) 식별자 — 변할 때만 상단바 전체 재구성, 평소엔 카운트다운 숫자만 갱신
let schedulePreload = null;

function parseScheduleRows(rows) {
  const out = [];
  for (const r of rows) {
    // A열: YYMMDD(통합 시트 일정 행) 또는 YYYY-MM-DD 둘 다 허용 → YYYY-MM-DD로 정규화.
    // A가 http(컨텐츠 카드 행)·헤더·빈칸이면 null → 자동 제외(한 시트를 일정/컨텐츠 두 필터로 가르는 기준).
    const rawDate = (r[0] || '').trim();
    let date = null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(rawDate)) date = rawDate;
    else if (/^\d{6}$/.test(rawDate)) date = `20${rawDate.slice(0, 2)}-${rawDate.slice(2, 4)}-${rawDate.slice(4, 6)}`;
    if (!date) continue;
    const brief = (r[3] || '').trim();   // D=간략제목(버튼)
    const detail = (r[4] || '').trim();  // E=상세제목(모달)
    if (!brief && !detail) continue;     // 제목이 둘 다 없으면 무효 행
    const timeRaw = (r[1] || '').trim(); // B=시간
    const hasTime = /^\d{1,2}:\d{2}$/.test(timeRaw);
    const hhmm = hasTime ? timeRaw.padStart(5, '0') : '00:00';
    const target = new Date(`${date}T${hhmm}:00+09:00`).getTime();
    const dayStart = new Date(`${date}T00:00:00+09:00`).getTime();
    out.push({
      date, time: hasTime ? hhmm : '',
      title: detail || brief,        // 모달·기준 제목(상세 우선)
      shortTitle: brief || detail,   // 버튼 제목(간략 우선)
      link: (r[2] || '').trim(),     // C=링크
      hasTime, target,
      hideAfter: dayStart + 86400000,  // 시간 유무 무관 그날 자정까지 유지(시간 지나면 D-DAY로 표기)
    });
  }
  // 날짜 오름차순 → 같은 날은 시간 있는 것 먼저(시간순), 시간 없는 것은 맨 아래
  out.sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    if (a.hasTime !== b.hasTime) return a.hasTime ? -1 : 1;
    return a.target - b.target;
  });
  return out;
}

function visibleSchedule() {
  const now = Date.now();
  return scheduleData.filter(s => now < s.hideAfter);
}

// KST 기준 D-day 일수(오늘=0). 자정끼리의 차이라 시:분과 무관.
function ddayNum(item) {
  const dayMs = 86400000;
  const nowMid = Math.floor((Date.now() + 9 * 3600 * 1000) / dayMs);
  const tgtMid = Math.floor((new Date(`${item.date}T00:00:00+09:00`).getTime() + 9 * 3600 * 1000) / dayMs);
  return tgtMid - nowMid;
}
function ddayText(item) {
  const d = ddayNum(item);
  return d <= 0 ? 'D-DAY' : `D-${d}`;
}
// D-time: 당일에만 호출(남은 시간 < 24h) → D-HH:MM:SS. D-day와 머리글자('D-') 통일.
function dtimeText(item) {
  let sec = Math.floor((item.target - Date.now()) / 1000);
  if (sec <= 0) return 'D-DAY';
  const h = Math.floor(sec / 3600); sec -= h * 3600;
  const m = Math.floor(sec / 60); sec -= m * 60;
  return `D-${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

// 가장 임박한 날짜의 일정 묶음 + 표기 상태(버튼·틱 공통). dtime이 전부 같으면 병합(M), 다르면 분리(S).
// sig엔 카운트다운 숫자(매초 변동) 대신 묶음 구성·단일(1)/병합/분리만 담아 → 구조가 바뀔 때만 재렌더.
function scheduleHead() {
  const vis = visibleSchedule();
  if (!vis.length) return { vis, group: [], dtimes: [], allSame: true, sig: '∅' };
  const d0 = vis[0].date;
  const group = vis.filter(s => s.date === d0);   // vis는 정렬됨 → 같은 날짜는 시간순 prefix
  const dtimes = group.map(e => (e.hasTime && ddayNum(e) === 0) ? dtimeText(e) : ddayText(e));
  const allSame = dtimes.every(x => x === dtimes[0]);
  const state = group.length >= 2 ? (allSame ? 'M' : 'S') : '1';
  const sig = group.map(e => `${e.date}T${e.time}`).join(',') + '|' + state;
  return { vis, group, dtimes, allSame, sig };
}

// 상단바 일정 버튼 HTML. 호출 시 scheduleSig도 갱신(tick이 구조 변화를 감지하는 기준).
function scheduleBtnHTML() {
  const h = scheduleHead();
  scheduleSig = h.sig;
  // 버튼 상시 노출 — 데이터 로드 전 첫 페인트 순간만 셸(일정이 비는 경우는 전제상 없음).
  if (!h.vis.length) {
    return `<button class="page-title-link sch-btn" id="schBtn" type="button" onclick="openSchedule()">${SVG_ICONS.calendar}<span class="tb-t-pc">다가오는 일정<br><span class="sch-btn-dday">불러오는 중</span></span><span class="tb-t-mb">일정</span></button>`;
  }
  const head = h.vis[0];
  // 단일 일정 — 현행: 제목 + (당일부터 D-time, 그 전 D-day). 모바일은 항상 D-day.
  if (h.group.length < 2) {
    const second = (head.hasTime && ddayNum(head) === 0) ? dtimeText(head) : ddayText(head);
    return `<button class="page-title-link sch-btn" id="schBtn" type="button" onclick="openSchedule()">${SVG_ICONS.calendar}<span class="tb-t-pc">${escapeHtml(head.shortTitle)}<br><span class="sch-btn-dday">${second}</span></span><span class="tb-t-mb">${ddayText(head)}</span></button>`;
  }
  // 같은 날 2건+ (C): 제목 행 + dtime 행(열 정렬), 사이에 가운뎃점(·)으로 분리 표시. dtime 전부 같으면 한 칸 병합.
  const sep = `<span class="sch-sep">·</span>`;
  const titleCells = h.group.map(e => `<span class="sch-col-title">${escapeHtml(e.shortTitle)}</span>`).join(sep);
  const dtimeRow = h.allSame
    ? `<span class="sch-btn-dtime sch-dtime-merged">${h.dtimes[0]}</span>`
    : h.dtimes.map(d => `<span class="sch-btn-dtime">${d}</span>`).join(sep);
  const cols = 2 * h.group.length - 1;   // 이벤트 N칸 + 구분점 N-1칸
  const pc = `<span class="tb-t-pc sch-grid" style="grid-template-columns:repeat(${cols},auto)">${titleCells}${dtimeRow}</span>`;
  return `<button class="page-title-link sch-btn" id="schBtn" type="button" onclick="openSchedule()">${SVG_ICONS.calendar}${pc}<span class="tb-t-mb">${ddayText(head)}</span></button>`;
}

// 1초마다: 구조(묶음 구성·병합/분리)가 바뀌었으면 상단바 전체 재구성, 아니면 카운트다운 숫자만 교체.
function tickSchedule() {
  const h = scheduleHead();
  if (h.sig !== scheduleSig) { updatePageTitle(); return; }
  if (!h.vis.length) return;
  const elM = document.querySelector('#schBtn .tb-t-mb');            // 모바일: 항상 가장 임박 일정의 D-day
  if (elM) elM.textContent = ddayText(h.vis[0]);
  const elS = document.querySelector('#schBtn .sch-btn-dday');       // 단일 일정(현행): D-time/D-day 한 칸
  if (elS) elS.textContent = (h.vis[0].hasTime && ddayNum(h.vis[0]) === 0) ? dtimeText(h.vis[0]) : ddayText(h.vis[0]);
  const cells = document.querySelectorAll('#schBtn .sch-btn-dtime'); // 그룹(C): 병합 1칸 또는 열별 N칸
  cells.forEach((c, i) => { c.textContent = cells.length === 1 ? h.dtimes[0] : h.dtimes[i]; });
}

async function loadSchedule() {
  // 캐시 우선: 재방문 시 버튼이 첫 페인트부터 실제 내용으로 뜸(loadBanners와 동일 패턴)
  if (scheduleData.length === 0) {
    try {
      const cached = JSON.parse(lsGet(LS_SCHEDULE_CACHE, '[]'));
      if (cached.length) { scheduleData = parseScheduleRows(cached); updatePageTitle(); }
    } catch (e) {}
  }
  // 최신 fetch로 갱신
  try {
    const res = await fetch(SCHEDULE_SHEET_URL);
    if (!res.ok) throw new Error('no data');
    const rows = parseCSV(await res.text());
    lsSet(LS_SCHEDULE_CACHE, JSON.stringify(rows));
    scheduleData = parseScheduleRows(rows);
    updatePageTitle();
  } catch (e) {
    // fetch 실패 시: 위에서 캐시를 이미 그렸으면 유지. 캐시도 없으면 셸 버튼 유지.
  }
}

function preloadSchedule() {

      .then(r => { if (!r.ok) throw new Error('no data'); return r.text(); })
      .then(t => parseCSV(t))

}

// 모달 리스트 항목: 절대 날짜·시간 + 제목(+링크) + D-day 배지(목록은 날짜 단위 D-day로 고정 — 똑딱이는 D-time은 상단바 버튼 전용).
function renderScheduleItem(item) {
  const [schY, schMo, schD] = item.date.split('-').map(Number);
  const dateDisp = koDate(schY, schMo, schD);   // YYYY년 M월 D일 (한글 통일)
  const dowIdx = new Date(Date.UTC(schY, schMo - 1, schD)).getUTCDay();   // 달력 요일(UTC 고정 계산 → 브라우저 타임존 무관)
  const dowChar = ['일','월','화','수','목','금','토'][dowIdx];
  const dowColor = dowIdx === 0 ? '#f87171' : (dowIdx === 6 ? '#60a5fa' : '');   // 일=빨강·토=파랑 (달력 주말색과 동일), 요일 글자에만
  const dowHtml = dowColor ? `<span style="color:${dowColor}">${dowChar}</span>` : dowChar;
  const when = item.hasTime ? `${dateDisp} (${dowHtml}) ${item.time}` : `${dateDisp} (${dowHtml})`;
  const inner = `${escapeHtml(item.title)}${item.link ? ' ' + SVG_ICONS.externalLink : ''}`;
  const titleEl = item.link
    ? `<a class="sch-item-title" href="${escapeHtml(item.link)}" target="_blank" rel="noopener">${inner}</a>`
    : `<span class="sch-item-title">${inner}</span>`;
  return `<div class="sch-item"><div class="sch-item-main"><span class="sch-item-when">${when}</span>${titleEl}</div><span class="sch-item-dday">${ddayText(item)}</span></div>`;
}

const LS_NOTIFY = 'chuntaverse_notify_enabled';
const LS_LAST_SEEN = 'chuntaverse_last_seen_event_time';

function lsGet(k, fallback) {
  try { const v = localStorage.getItem(k); return v === null ? fallback : v; }
  catch (e) { return fallback; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, v); } catch (e) {}
}

function getLastSeenTime() {

  if (!v) {

  }

}

async function setNotifyEnabled(enabled) {
  if (enabled) {
    if ('Notification' in window) {
      if (Notification.permission === 'default') {
        try {
          const result = await Notification.requestPermission();
          if (result !== 'granted') {
            notifyEnabled = false;
            lsSet(LS_NOTIFY, '0');
            updateNotifySwitchUI();
            alert('브라우저 알림 권한이 거부되어 알림을 받을 수 없어요.\n브라우저 설정에서 알림 권한을 허용한 후 다시 시도해주세요.');
            return;
          }
        } catch (e) {}
      } else if (Notification.permission === 'denied') {
        notifyEnabled = false;
        lsSet(LS_NOTIFY, '0');
        updateNotifySwitchUI();
        alert('브라우저 알림 권한이 차단되어 있어요.\n브라우저 주소창 좌측 자물쇠 아이콘 → 알림 허용 후 다시 시도해주세요.');
        return;
      }
    } else {
      alert('이 브라우저는 알림 기능을 지원하지 않아요.');
      return;
    }
  } else {
    stopTitleFlash();
  }
  notifyEnabled = enabled;
  lsSet(LS_NOTIFY, enabled ? '1' : '0');
  updateNotifySwitchUI();
}

function startTitleFlash(count) {
  pendingFlashCount = count;
  if (titleFlashTimer) return;
  titleFlashTimer = setInterval(() => {
    titleFlashOn = !titleFlashOn;
    updateTabTitle();
  }, 1500);
}
function stopTitleFlash() {
  if (titleFlashTimer) {
    clearInterval(titleFlashTimer);
    titleFlashTimer = null;
  }
  titleFlashOn = false;
  pendingFlashCount = 0;
  updateTabTitle();
}
function updateTabTitle() {
  const lastSeen = new Date(getLastSeenTime()).getTime();
  const unreadCount = allEvents.filter(e => {
    const t = new Date(e.time).getTime();
    if (isNaN(t) || t <= lastSeen) return false;
    const cat = typeToCat(e.type);
    if (!filterState.types.has(cat)) return false;
    const memberMatch = filterState.members.has(e.member_id);
    const channelMatch = e.channel_id && filterState.members.has(e.channel_id);
    if (cat === 'chat') return memberMatch || channelMatch;
    return memberMatch;
  }).length;
  const base = unreadCount > 0 ? `${BASE_TITLE} (${unreadCount})` : BASE_TITLE;
  if (unreadCount === 0 && titleFlashTimer) {
    clearInterval(titleFlashTimer);
    titleFlashTimer = null;
    titleFlashOn = false;
    pendingFlashCount = 0;
  }
  document.title = (titleFlashTimer && titleFlashOn && pendingFlashCount > 0)
    ? `${base} NEW ◆` : base;
}

function sendBrowserNotification(ev) {
  if (!notifyEnabled) return;
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;
  if (document.visibilityState === 'visible' && currentPage === 'events') return;

  const memberName = ev.member_name || '';
  let body = '';
  switch (ev.type) {
    case 'start':      body = `${memberName} 방송 시작${ev.title ? ' — ' + ev.title : ''}`; break;
    case 'end':        body = `${memberName} 방송 종료`; break;
    case 'title':      body = `${memberName} 방송 제목 변경 — ${ev.after || ''}`; break;
    case 'category':   body = `${memberName} 카테고리 변경 — ${ev.after || ''}`; break;
    case 'mode_change':body = `${memberName} 방송 모드 변경 — ${modeLabel(ev.after)}`; break;
    case 'post':       body = `${memberName} 숲 게시글 — ${ev.title || ''}`; break;
    case 'comment_recommend': body = `${memberName} 좋아요 요청 — ${ev.target_name || ''} 컨텐츠`; break;
    case 'youtube':    body = `${memberName} 유튜브 업로드 — ${ev.title || ''}`; break;
    case 'cafe_post':  body = `${memberName} 카페 게시글 [${ev.cafe_name || ''}] — ${ev.title || ''}`; break;
    case 'chat':       body = `${memberName} 채팅 (${ev.channel_name || ''}) — ${ev.message || ''}`; break;
    case 'chat_emoticon': body = `${memberName} 채팅 (${ev.channel_name || ''}) — (이모티콘)`; break;
    case 'donation':   body = `${memberName} 후원 (${ev.channel_name || ''}) — 별풍선 ${ev.amount || ''}개`; break;
    default:           body = `${memberName} ${ev.type}`;
  }
  try {
    const noti = new Notification(BASE_TITLE, {
      body, icon: 'Favicon.webp',
      tag: `${ev.type}-${ev.member_id}-${ev.time}`,
    });
    noti.onclick = () => {
      window.focus();
      history.replaceState(null, '', '#events');
      switchPage('events');
      noti.close();
    };
    setTimeout(() => { try { noti.close(); } catch (e) {} }, 5000);
  } catch (e) {}
}

function processNewEventsForNotification(events) {
  if (!events || events.length === 0) {
    lastSeenEventKeys = new Set();
    lastSeenEventKeysReady = true;
    return;
  }
  const eventKey = (e) => `${e.type}|${e.member_id}|${e.time}|${e.url || ''}|${e.after || ''}`;
  if (!lastSeenEventKeysReady) {
    lastSeenEventKeys = new Set(events.map(eventKey));
    lastSeenEventKeysReady = true;
    return;
  }
  const newOnes = events.filter(e => !lastSeenEventKeys.has(eventKey(e)));
  lastSeenEventKeys = new Set(events.map(eventKey));
  if (newOnes.length === 0) return;
  const filtered = newOnes.filter(e => {
    const cat = typeToCat(e.type);
    if (!filterState.types.has(cat)) return false;
    const memberMatch = filterState.members.has(e.member_id);
    const channelMatch = e.channel_id && filterState.members.has(e.channel_id);
    if (cat === 'chat') return memberMatch || channelMatch;
    return memberMatch;
  });
  if (filtered.length === 0) return;
  if (notifyEnabled) {
    const userIsViewingEvents = (document.visibilityState === 'visible' && currentPage === 'events');
    if (!userIsViewingEvents) {
      filtered.forEach(ev => sendBrowserNotification(ev));
      startTitleFlash(filtered.length);
    }
  }
}

function refreshUnreadIndicator() {
  const lastSeen = new Date(getLastSeenTime()).getTime();
  const unread = allEvents.filter(e => {
    const t = new Date(e.time).getTime();
    if (isNaN(t) || t <= lastSeen) return false;
    const cat = typeToCat(e.type);
    if (!filterState.types.has(cat)) return false;
    const memberMatch = filterState.members.has(e.member_id);
    const channelMatch = e.channel_id && filterState.members.has(e.channel_id);
    if (cat === 'chat') return memberMatch || channelMatch;
    return memberMatch;
  });
  const count = unread.length;
  updateTabTitle();
  const badge = document.getElementById('navBadge');
  if (badge) {
    if (count > 0) {
      badge.style.display = '';
      badge.textContent = count;
    } else {
      badge.style.display = 'none';
    }
  }
  const tl = document.getElementById('timeline');
  if (tl) {
    tl.querySelectorAll('.event').forEach(el => {
      const t = parseInt(el.dataset.time || '0', 10);
      const isUnread = t > lastSeen;
      el.classList.toggle('unread', isUnread);
    });
  }
}
