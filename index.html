<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>천타버스</title>
<meta name="description" content="천타버스(CHUNTAVERSE) 비공식 팬사이트 - 천양, 마다옴, 나나문, 임하밍, 문모모, 카푸, 캬앙, 김웰로, 모카, 달타, 파니의 생방송 현황, 최근 이벤트, 월별 통계를 한눈에 확인하세요.">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:title" content="천타버스">
<meta property="og:description" content="천타버스(CHUNTAVERSE) 비공식 팬사이트 - 생방송 현황, 최근 이벤트, 월별 통계">
<meta property="og:url" content="https://chuntaverse.com">
<meta property="og:image" content="https://chuntaverse.com/Favicon.webp">
<meta property="og:locale" content="ko_KR">
<link rel="canonical" href="https://chuntaverse.com">
<link rel="icon" type="image/webp" href="Favicon.webp">
<style>
  :root {
    --bg: #070a14;
    --surface: #0d1120;
    --surface2: #131929;
    --border: #1e2740;
    --live: #ff3b3b;
    --live-glow: rgba(255,59,59,0.25);
    --accent: #61FFEC;
    --accent2: #61FFEC;
    --text: #e2e8f0;
    --muted: #64748b;
    --time: #fbbf24;
    --ev-start: #60a5fa;
    --ev-end: #f87171;
    --ev-yellow: #fbbf24;
    --ev-blue: #60a5fa;
    --ev-comment: #ec4899;
    --ev-post: #34d399;
    --ev-youtube: #ef4444;
    --ev-unread: #61FFEC;
    --mode-adult: #f87171;
    --mode-subscription: #f59e0b;
    --mode-copyright: #cbd5e1;
    --filter-soop: #0388FF;
    --filter-post: #2EF5E1;
    --sidebar-w: 200px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100vh; }
  html { scrollbar-gutter: stable; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 35%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(2px 2px at 15% 50%, rgba(97,255,236,0.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    z-index: 2;
    flex-shrink: 0;
  }
  .sidebar-logo {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    text-align: center;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sidebar-logo img { max-width: 100%; max-height: 32px; height: auto; display: block; }
  .nav-list { padding: 8px 0; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 20px; color: var(--muted);
    cursor: pointer; font-size: 14px; font-weight: 600;
    border: none; background: none; text-align: left;
    width: 100%; font-family: inherit;
    border-left: 3px solid transparent;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
    position: relative;
  }
  .nav-item:hover { color: var(--text); background: var(--surface2); }
  .nav-item.active { color: var(--accent2); background: var(--surface2); border-left-color: var(--accent); }
  .nav-icon {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    vertical-align: middle;
  }
  .nav-icon svg { width: 16px; height: 16px; display: block; vertical-align: middle; }
  .nav-badge {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--ev-unread);
    color: var(--bg);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    min-width: 18px;
    text-align: center;
    line-height: 1.2;
  }
  .nav-live-badge {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    background: var(--surface2);
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    transition: color 0.15s;
  }
  .nav-live-dot {
    width: 7px;
    height: 7px;
    background: var(--muted);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .nav-live-badge.on {
    color: var(--text);
    background: rgba(255,59,59,0.12);
  }
  .nav-live-badge.on .nav-live-dot {
    background: var(--live);
    box-shadow: 0 0 6px var(--live-glow);
    animation: pulse 1.8s ease-in-out infinite;
  }

  .notify-toggle {
    padding: 8px 20px 10px 23px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .notify-toggle-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    user-select: none;
  }
  .notify-switch {
    position: relative;
    width: 36px;
    height: 20px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
    padding: 0;
    box-sizing: border-box;
  }
  .notify-switch::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    background: var(--muted);
    top: 50%;
    left: 2px;
    transform: translateY(-50%);
    transition: transform 0.18s, left 0.18s, background 0.18s;
  }
  .notify-switch.on { border-color: var(--accent); }
  .notify-switch.on::after { left: 19px; transform: translateY(-50%); background: var(--accent); }

  .main {
    flex: 1; min-width: 0;
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
  }
  .main-header {
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(97,255,236,0.05) 0%, transparent 100%);
    display: flex; align-items: center; gap: 16px;
    min-height: 56px;
    position: relative;
  }
  .page-title {
    font-size: 18px; font-weight: 700; letter-spacing: 1px;
    flex-shrink: 0;
    position: absolute;
    left: 24px;
    top: 50%;
    transform: translateY(-50%);
  }
  .header-center {
    flex: 1; text-align: center; color: var(--muted);
    font-size: 12px; min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .header-center-line {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 100%;
  }
  .header-disclaimer {
    font-size: 11px;
    opacity: 0.75;
  }
  .header-yt-btn {
    position: absolute;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: rgba(96,165,250,0.12);
    border: 1px solid rgba(96,165,250,0.4);
    color: #93c5fd;
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
    transition: background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .header-yt-btn:hover { background: rgba(96,165,250,0.22); border-color: rgba(96,165,250,0.7); }
  .header-yt-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .page { display: none; flex: 1; flex-direction: column; }
  .page.active { display: flex; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px; padding: 22px 30px;
    max-width: 1520px; width: 100%; margin: 0 auto;
    flex: 1;
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 800px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 500px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    overflow: hidden;
    text-decoration: none; color: inherit;
    display: block;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    opacity: 0;
    animation: fadeIn 0.4s ease forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }


  .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 8px 24px rgba(97,255,236,0.18); }
  .card.live { border-color: var(--accent); }
  .card.live:hover { border-color: var(--accent2); box-shadow: 0 8px 24px rgba(97,255,236,0.18); }


  .card.offline .card-thumb { opacity: 0.4; }
  .card.offline .card-name { color: var(--muted) !important; }

  .card-thumb {
    width: 100%; aspect-ratio: 16/9;
    background: var(--surface2);
    position: relative; overflow: hidden;
  }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-thumb .placeholder {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden; gap: 8px;
  }
  .card-thumb .placeholder img {
    max-width: 50%; max-height: 60%;
    width: auto; height: auto;
    object-fit: contain; opacity: 0.4;
  }
  .placeholder-mode-text {
    font-size: 12px; font-weight: 600;
    color: var(--muted); letter-spacing: 0.5px;
    text-align: center;
  }
  .badge-mode {
    position: absolute; top: 10px; right: 10px;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.5px; padding: 3px 8px;
    background: transparent; border: 1.5px solid currentColor;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .badge-mode.adult { color: var(--mode-adult); }
  .badge-mode.subscription { color: var(--mode-subscription); }
  .badge-mode.copyright { color: var(--mode-copyright); }
  .badge-mode.restricted { color: var(--muted); }

  .card-info { padding: 12px 14px 14px; display: flex; align-items: center; gap: 10px; }
  .card-avatar {
    width: 36px; height: 36px;
    object-fit: cover; flex-shrink: 0;
    border: 1.5px solid var(--border);
  }
  .card-text { min-width: 0; flex: 1; }
  .card-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 3px;
    min-width: 0;
  }
  .card-name {
    font-size: 15px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0;
  }
  .card-btime {
    font-size: 11px;
    color: var(--time);
    font-weight: 600;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }
  .card-title {
    font-size: 12px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    line-height: 1.3;
  }
  .card-title.is-live { color: #94a3b8; }

  .loading { text-align: center; padding: 80px 20px; color: var(--muted); flex: 1; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .events-wrap {
    padding: 20px 24px;
    max-width: 1400px; width: 100%; margin: 0 auto;
    flex: 1;
    display: grid; grid-template-columns: 1fr 280px;
    gap: 20px; align-items: start;
  }
  @media (max-width: 900px) {
    .events-wrap { grid-template-columns: 1fr; }
    .filter-panel { position: static !important; }
  }
  .timeline { background: var(--surface); border: 1px solid var(--border); min-width: 0; }
  .timeline-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px; }

  .filter-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px;
    position: sticky; top: 20px;
  }
  .filter-section + .filter-section {
    margin-top: 20px; padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .filter-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .filter-title {
    font-size: 12px; font-weight: 700;
    color: var(--muted); letter-spacing: 1px;
  }
  .filter-toggle-all {
    background: transparent;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .filter-toggle-all:hover { opacity: 0.7; }

  .filter-members { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .filter-member {
    position: relative;
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer; overflow: hidden;
    transition: all 0.15s; padding: 0;
  }
  .filter-member img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: opacity 0.15s;
  }
  .filter-member:not(.on) img { opacity: 0.25; filter: grayscale(1); }
  .filter-member:not(.on) { border-color: transparent; }
  .filter-member.on { border-color: var(--accent); }
  .filter-member:hover { border-color: var(--accent); }

  .filter-types { display: flex; flex-direction: column; gap: 6px; }
  .filter-type {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer; font-size: 13px; font-weight: 600;
    color: var(--muted); transition: all 0.15s;
    font-family: inherit; text-align: left; width: 100%;
  }
  .filter-type:hover { color: var(--text); border-color: var(--accent); }
  .filter-type.on { border-color: var(--accent); color: var(--text); }
  .filter-type:not(.on) { opacity: 0.35; }
  .filter-type:not(.on):hover { opacity: 0.6; }
  .filter-type .filter-icon { width: 14px; height: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .filter-type[data-type="soop"] .filter-icon { color: var(--ev-start); }
  .filter-type[data-type="chat"] .filter-icon { color: #a78bfa; }
  .filter-type[data-type="post"] .filter-icon { color: var(--ev-post); }
  .filter-type[data-type="youtube"] .filter-icon { color: var(--ev-youtube); }
  .filter-type[data-type="cafe"] .filter-icon { color: #03C75A; }

  .filter-summary {
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted); text-align: center;
  }
  .event {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    transition: background 0.15s;
    border-left: 4px solid transparent;
    position: relative;
  }
  .event:hover { background: var(--surface2); }
  .event + .event { border-top: 1px solid var(--border); }
  .event.unread {
    border-left-color: var(--ev-unread);
    background: rgba(97, 255, 236, 0.10);
    box-shadow: inset 4px 0 12px -4px rgba(97, 255, 236, 0.35);
  }
  .event.unread:hover { background: rgba(97, 255, 236, 0.16); }
  .event-new-badge {
    background: var(--ev-unread);
    color: var(--bg);
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    letter-spacing: 0.5px;
    margin-right: 6px;
    flex-shrink: 0;
  }
  .event-icon {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
    background: var(--surface2); font-weight: 700;
  }
  .event-icon svg {
    width: 16px; height: 16px;
    display: block;
  }
  .event-icon.start { background: rgba(96,165,250,0.15); color: var(--ev-start); }
  .event-icon.end { background: rgba(248,113,113,0.15); color: var(--ev-end); }
  .event-icon.title { background: rgba(251,191,36,0.15); color: var(--ev-yellow); }
  .event-icon.category { background: rgba(251,191,36,0.15); color: var(--ev-yellow); }
  .event-icon.mode_change { background: rgba(251,191,36,0.15); color: var(--ev-yellow); }
  .event-icon.post { background: rgba(52,211,153,0.15); color: var(--ev-post); }
  .event-icon.comment_recommend { background: rgba(52,211,153,0.15); color: var(--ev-post); }
  .event-icon.youtube { background: rgba(239,68,68,0.15); color: var(--ev-youtube); }
  .event-icon.cafe_post { background: rgba(3,199,90,0.15); color: #03C75A; }
  .event-icon.chat { background: rgba(167,139,250,0.15); color: #a78bfa; }
  .event-icon.chat_emoticon { background: rgba(167,139,250,0.15); color: #a78bfa; }
  .event-icon.donation { background: rgba(167,139,250,0.15); color: #a78bfa; }
  .event a.event-link { color: inherit; text-decoration: none; display: contents; }
  .event a.event-link:hover .event-detail { color: var(--accent2); }
  .event-avatar { width: 28px; height: 28px; object-fit: cover; flex-shrink: 0; }
  .event-body { flex: 1; min-width: 0; font-size: 14px; min-height: 38px; display: flex; flex-direction: column; justify-content: center; }
  .event-member { font-weight: 700; margin-right: 6px; }
  .event-elapsed { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .event-action { color: var(--muted); }
  .event-target { color: #cbd5e1; margin-left: 4px; }
  .event-mode-tag {
    display: inline-flex; align-items: center; justify-content: center;
    margin-left: 0; margin-right: 6px;
    padding: 2px 6px 3px; font-size: 11px;
    font-weight: 700; letter-spacing: 0.3px;
    background: transparent; border: 1.5px solid currentColor;
    line-height: 1; vertical-align: 1px;
  }
  .event-mode-tag.adult { color: var(--mode-adult); }
  .event-mode-tag.subscription { color: var(--mode-subscription); }
  .event-mode-tag.copyright { color: var(--mode-copyright); }
  .event-mode-tag.restricted { color: var(--muted); }
  .event-detail {
    color: #94a3b8; font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-top: 3px;
  }
  .event-time {
    font-size: 12px; color: var(--muted);
    flex-shrink: 0; text-align: right; line-height: 1.4;
  }
  .event-time-rel { display: block; }
  .event-time-abs {
    display: block; font-size: 10px;
    color: var(--muted); opacity: 0.7;
  }
  .timeline-header {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
  }
  .sort-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    transition: color 0.15s, border-color 0.15s;
  }
  .sort-toggle:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .sort-toggle svg { width: 12px; height: 12px; display: block; flex-shrink: 0; }

  .stats-wrap {
    padding: 20px 24px;
    max-width: 1600px; width: 100%; margin: 0 auto;
    flex: 1;
  }

  .stats-tabs-wrap {
    display: grid;
    grid-template-columns: repeat(13, 1fr);
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px;
    margin: 0 auto 16px;
    max-width: 880px;
  }
  .stats-tabs-side {
    display: contents;
  }
  .stats-tabs-members {
    display: contents;
  }
  .stats-tab {
    position: relative;
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1.5px solid transparent;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.15s;
    padding: 0;
    font-family: inherit;
    box-sizing: border-box;
  }
  .stats-tab img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.15s, filter 0.15s;
  }

async function setNotifyEnabled(enabled) {
  if (enabled) {
    if ('Notification' in window) {
      if (Notification.permission === 'default') {
        try {
          const result = await Notification.requestPermission();
          if (result !== 'granted') {
            notifyEnabled = false;
            lsSet(LS_NOTIFY, '0');
            updateNotifySwitchUI();
            alert('브라우저 알림 권한이 거부되어 알림을 받을 수 없어요.\n브라우저 설정에서 알림 권한을 허용한 후 다시 시도해주세요.');
            return;
          }
        } catch (e) {}
      } else if (Notification.permission === 'denied') {
        notifyEnabled = false;
        lsSet(LS_NOTIFY, '0');
        updateNotifySwitchUI();
        alert('브라우저 알림 권한이 차단되어 있어요.\n브라우저 주소창 좌측 자물쇠 아이콘 → 알림 허용 후 다시 시도해주세요.');
        return;
      }
    } else {
      alert('이 브라우저는 알림 기능을 지원하지 않아요.');
      return;
    }
  } else {
    stopTitleFlash();
  }
  notifyEnabled = enabled;
  lsSet(LS_NOTIFY, enabled ? '1' : '0');
  updateNotifySwitchUI();
}

function startTitleFlash(count) {

function stopTitleFlash() {
  if (titleFlashTimer) {
    clearInterval(titleFlashTimer);

  pendingFlashCount = 0;

}
function updateTabTitle() {
  const lastSeen = new Date(getLastSeenTime()).getTime();
  const unreadCount = allEvents.filter(e => {
    const t = new Date(e.time).getTime();
    if (isNaN(t) || t <= lastSeen) return false;
    const cat = typeToCat(e.type);
    if (!filterState.types.has(cat)) return false;
    const memberMatch = filterState.members.has(e.member_id);
    const channelMatch = e.channel_id && filterState.members.has(e.channel_id);
    if (cat === 'chat') return memberMatch || channelMatch;
    return memberMatch;
  }).length;
  const base = unreadCount > 0 ? `${BASE_TITLE} (${unreadCount})` : BASE_TITLE;
  if (unreadCount === 0 && titleFlashTimer) {
    clearInterval(titleFlashTimer);
    titleFlashTimer = null;
    titleFlashOn = false;
    pendingFlashCount = 0;
  }
  document.title = (titleFlashTimer && titleFlashOn && pendingFlashCount > 0)
    ? `${base} NEW ◆` : base;
}

function sendBrowserNotification(ev) {
  if (!notifyEnabled) return;
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;
  if (document.visibilityState === 'visible' && currentPage === 'events') return;

  const memberName = ev.member_name || '';
  let body = '';
  switch (ev.type) {
    case 'start':      body = `${memberName} 방송 시작${ev.title ? ' — ' + ev.title : ''}`; break;
    case 'end':        body = `${memberName} 방송 종료`; break;
    case 'title':      body = `${memberName} 방송 제목 변경 — ${ev.after || ''}`; break;
    case 'category':   body = `${memberName} 카테고리 변경 — ${ev.after || ''}`; break;
    case 'mode_change':body = `${memberName} 방송 모드 변경 — ${MODE_LABEL[ev.after] || ev.after}`; break;
    case 'post':       body = `${memberName} 숲 게시글 — ${ev.title || ''}`; break;
    case 'comment_recommend': body = `${memberName} 좋아요 요청 — ${ev.target_name || ''} 컨텐츠`; break;
    case 'youtube':    body = `${memberName} 유튜브 업로드 — ${ev.title || ''}`; break;
    case 'cafe_post':  body = `${memberName} 카페 게시글 [${ev.cafe_name || ''}] — ${ev.title || ''}`; break;
    case 'chat':       body = `${memberName} 채팅 (${ev.channel_name || ''}) — ${ev.message || ''}`; break;
    case 'chat_emoticon': body = `${memberName} 채팅 (${ev.channel_name || ''}) — (이모티콘)`; break;
    case 'donation':   body = `${memberName} 후원 (${ev.channel_name || ''}) — 별풍선 ${ev.amount || ''}개`; break;
    default:           body = `${memberName} ${ev.type}`;
  }
  try {
    const noti = new Notification(BASE_TITLE, {
      body, icon: 'Favicon.webp',
      tag: `${ev.type}-${ev.member_id}-${ev.time}`,
    });
    noti.onclick = () => {
      window.focus();
      history.replaceState(null, '', '#events');
      switchPage('events');
      noti.close();
    };
    setTimeout(() => { try { noti.close(); } catch (e) {} }, 5000);
  } catch (e) {}
}

function processNewEventsForNotification(events) {
  if (!events || events.length === 0) {
    lastSeenEventKeys = new Set();
    lastSeenEventKeysReady = true;
    return;
  }
  const eventKey = (e) => `${e.type}|${e.member_id}|${e.time}|${e.url || ''}|${e.after || ''}`;
  if (!lastSeenEventKeysReady) {
    lastSeenEventKeys = new Set(events.map(eventKey));
    lastSeenEventKeysReady = true;
    return;
  }
  const newOnes = events.filter(e => !lastSeenEventKeys.has(eventKey(e)));
  lastSeenEventKeys = new Set(events.map(eventKey));
  if (newOnes.length === 0) return;
  const filtered = newOnes.filter(e => {
    const cat = typeToCat(e.type);
    if (!filterState.types.has(cat)) return false;
    const memberMatch = filterState.members.has(e.member_id);
    const channelMatch = e.channel_id && filterState.members.has(e.channel_id);
    if (cat === 'chat') return memberMatch || channelMatch;
    return memberMatch;
  });
  if (filtered.length === 0) return;
  if (notifyEnabled) {
    const userIsViewingEvents = (document.visibilityState === 'visible' && currentPage === 'events');
    if (!userIsViewingEvents) {
      filtered.forEach(ev => sendBrowserNotification(ev));
      startTitleFlash(filtered.length);
    }
  }
}

function refreshUnreadIndicator() {

  const unread = allEvents.filter(e => {

    if (isNaN(t) || t <= lastSeen) return false;
    const cat = typeToCat(e.type);
    if (!filterState.types.has(cat)) return false;
    const memberMatch = filterState.members.has(e.member_id);
    const channelMatch = e.channel_id && filterState.members.has(e.channel_id);
    if (cat === 'chat') return memberMatch || channelMatch;
    return memberMatch;
  });
  const count = unread.length;
  updateTabTitle();
  const badge = document.getElementById('navBadge');
  if (badge) {
    if (count > 0) {
      badge.style.display = '';
      badge.textContent = count;
    } else {
      badge.style.display = 'none';
    }
  }
  const tl = document.getElementById('timeline');
  if (tl) {
    tl.querySelectorAll('.event').forEach(el => {
      const t = parseInt(el.dataset.time || '0', 10);
      const isUnread = t > lastSeen;
      el.classList.toggle('unread', isUnread);

          badgeEl.textContent = 'NEW';
          timeEl.parentNode.insertBefore(badgeEl, timeEl);

}

function formatBtime(seconds) {
  if (!seconds || seconds <= 0) return null;
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (h > 0) return h + '시간 ' + m + '분';
  return m + '분';
}
function formatRelTime(iso) {
  const now = new Date();
  const t = new Date(iso);
  const diff = Math.floor((now - t) / 1000);
  if (diff < 60) return '방금 전';
  if (diff < 3600) return Math.floor(diff / 60) + '분 전';
  if (diff < 86400) return Math.floor(diff / 3600) + '시간 전';
  return Math.floor(diff / 86400) + '일 전';
}
function formatAbsTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd} ${hh}:${mi}`;
}
function formatHHMM(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function formatDuration(ms) {
  if (!ms || ms <= 0) return '0분';
  const totalMin = Math.floor(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h > 0) return `${h}시간 ${m}분`;
  return `${m}분`;
}
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function soopProfileUrl(userId) {
  const prefix = userId.substring(0, 2);
  return `https://profile.img.sooplive.com/LOGO/${prefix}/${userId}/${userId}.jpg`;
}
function isoToKstDateKey(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function ymdKey(year, month1, day) {
  return `${year}-${String(month1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function daysInMonth(year, month1) {

}

function buildCard(m, info, delay) {
  const tag = info.live ? 'a' : 'div';
  const card = document.createElement(tag);
  card.className = 'card ' + (info.live ? 'live' : 'offline');
  card.dataset.member = info.id;
  card.style.animationDelay = delay + 'ms';
  if (info.live) {
    card.href = 'https://play.sooplive.co.kr/' + info.id;
    card.target = '_blank';
    card.rel = 'noopener';
  }
  const btime = formatBtime(info.btime);
  const mode = info.mode || (info.live ? 'normal' : null);
  const isNormalLive = info.live && mode === 'normal';
  const hasThumb = info.thumb && isNormalLive;
  const thumbTs = Math.floor(Date.now() / 60000);
  const thumbHtml = hasThumb
    ? `<img src="${info.thumb}?t=${thumbTs}" alt="${m.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : '';
  const placeholderInner = info.live && mode && mode !== 'normal'
    ? `<img src="${m.img}" alt="${m.name}"><div class="placeholder-mode-text">${MODE_PLACEHOLDER_TEXT[mode] || ''}</div>`
    : `<img src="${m.img}" alt="${m.name}">`;
  const modeBadge = info.live && mode && mode !== 'normal'
    ? `<span class="badge-mode ${mode}">${MODE_LABEL[mode] || ''}</span>` : '';
  const profileUrl = soopProfileUrl(m.id);
  const avatarHtml = profileUrl
    ? `<img class="card-avatar" src="${profileUrl}" alt="${m.name}" onerror="this.onerror=null;this.src='${m.img}'">`
    : `<img class="card-avatar" src="${m.img}" alt="${m.name}">`;
  let titleText;
  if (!info.live) titleText = '오프라인';
  else if (info.title) titleText = info.title;
  else if (mode && mode !== 'normal') titleText = MODE_PLACEHOLDER_TEXT[mode] || '방송 중';
  else titleText = '방송 중';
  const btimeHtml = btime ? `<span class="card-btime"><span>⏱</span><span>${btime}</span></span>` : '';
  const nameColorStyle = info.live ? `color: ${m.color}` : '';
  card.innerHTML = `
    <div class="card-thumb">
      ${thumbHtml}
      <div class="placeholder" style="display:${hasThumb ? 'none' : 'flex'}">${placeholderInner}</div>
      ${modeBadge}
    </div>
    <div class="card-info">
      ${avatarHtml}
      <div class="card-text">
        <div class="card-name-row">
          <span class="card-name" style="${nameColorStyle}">${m.name}</span>
          ${btimeHtml}
        </div>
        <div class="card-title ${info.live ? 'is-live' : ''}">${escapeHtml(titleText)}</div>
      </div>
    </div>
  `;
  return card;
}

function getBroadcastElapsed(e, allEvents) {

  const evTime = new Date(e.time).getTime();
  const isChat = ['chat', 'chat_emoticon', 'donation'].includes(e.type);
  const targetMemberId = isChat ? e.channel_id : e.member_id;
  const startEv = allEvents.find(ev =>
    ev.type === 'start' && ev.member_id === targetMemberId && new Date(ev.time).getTime() <= evTime
  );
  if (!startEv) return '';
  const diff = Math.floor((evTime - new Date(startEv.time).getTime()) / 1000);
  if (diff < 60) return `${diff}초`;
  const h = Math.floor(diff / 3600);
  const m = Math.floor((diff % 3600) / 60);
  return h > 0 ? `${h}시간 ${m}분` : `${m}분`;
}

    targetTag = `<span class="event-target">(${escapeHtml(e.target_name)} 컨텐츠)</span>`;
  }
  if (e.type === 'cafe_post' && e.cafe_name) {
    targetTag = `<span class="event-target">(${escapeHtml(e.cafe_name)})</span>`;
  }
  if (['chat', 'chat_emoticon', 'donation'].includes(e.type) && e.channel_name) {
    const channelMember = MEMBERS.find(m => m.id === e.channel_id);
    const channelColor = channelMember ? channelMember.color : '#cbd5e1';
    targetTag = `<span class="event-target">(<span style="color: ${channelColor}">${escapeHtml(e.channel_name)}</span> 방송)</span>`;
  }
  let detail = '';
  if (e.type === 'start') {
    const titleText = e.title ? escapeHtml(e.title) : '';
    detail = `<div class="event-detail">${modeTag}${modeTag && titleText ? ' ' : ''}${titleText}</div>`;
  } else if (e.type === 'end') {
    const evTime = new Date(e.time).getTime();
    const lastTitleEv = (allEvents || []).find(ev =>
      ev.member_id === e.member_id && (ev.type === 'title' || ev.type === 'start') && new Date(ev.time).getTime() <= evTime
    );
    const lastTitle = lastTitleEv ? (lastTitleEv.type === 'title' ? lastTitleEv.after : lastTitleEv.title) : '';
    const titleText2 = lastTitle ? escapeHtml(lastTitle) : '';
    detail = `<div class="event-detail">${modeTag}${modeTag && titleText2 ? ' ' : ''}${titleText2}</div>`;
  } else if (e.type === 'title' || e.type === 'category') {
    detail = `<div class="event-detail">${escapeHtml(e.before)} → ${escapeHtml(e.after)}</div>`;
  } else if (e.type === 'mode_change') {
    detail = `<div class="event-detail">${escapeHtml(MODE_LABEL[e.before] || e.before)} → ${escapeHtml(MODE_LABEL[e.after] || e.after)}</div>`;
  } else if ((e.type === 'post' || e.type === 'youtube' || e.type === 'comment_recommend' || e.type === 'cafe_post') && e.title) {
    detail = `<div class="event-detail">${escapeHtml(e.title)}</div>`;
  } else if (e.type === 'chat' && e.message) {
    detail = `<div class="event-detail">${escapeHtml(e.message)}</div>`;
  } else if (e.type === 'chat_emoticon') {
    detail = `<div class="event-detail">(이모티콘)</div>`;
  } else if (e.type === 'donation' && e.amount) {
    detail = `<div class="event-detail">별풍선 ${e.amount}개</div>`;
  }
  if (e.type === 'end' && !e.url && e.member_id) {
    e = { ...e, url: `https://www.sooplive.com/station/${e.member_id}/vod` };
  }
  const eventTime = new Date(e.time).getTime() || 0;
  const iconHtml = iconMap[e.type] || '•';
  const inner = `
    <div class="event-icon ${e.type}">${iconHtml}</div>
    ${avatarSrc ? `<img class="event-avatar" src="${avatarSrc}" alt="${escapeHtml(e.member_name)}">` : ''}
    <div class="event-body">
      <div>
        <span class="event-member" style="color: ${memberColor}">${escapeHtml(e.member_name)}</span>
        <span class="event-action">${actionMap[e.type] || e.type}${(() => { const el = getBroadcastElapsed(e, allEvents||[]); return el ? ` <span class="event-elapsed">⏱ ${el}</span>` : ''; })()}</span>
        ${targetTag}
      </div>
      ${detail}
    </div>
    <div class="event-time">
      <span class="event-time-rel">${formatRelTime(e.time)}</span>
      <span class="event-time-abs">${formatAbsTime(e.time)}</span>
    </div>
  `;
  const LIVE_NAV_TYPES = new Set(['start', 'title', 'category', 'mode_change']);
  if (LIVE_NAV_TYPES.has(e.type)) {
    const liveUrl = `https://play.sooplive.co.kr/${e.member_id}`;
    return `<div class="event" data-time="${eventTime}"><a class="event-link" href="${escapeHtml(liveUrl)}" target="_blank" rel="noopener">${inner}</a></div>`;
  }
  if (['chat', 'chat_emoticon', 'donation'].includes(e.type) && e.channel_id) {
    const liveUrl = `https://play.sooplive.co.kr/${e.channel_id}`;
    return `<div class="event" data-time="${eventTime}"><a class="event-link" href="${escapeHtml(liveUrl)}" target="_blank" rel="noopener">${inner}</a></div>`;
  }
  if (e.url) {
    return `<div class="event" data-time="${eventTime}"><a class="event-link" href="${escapeHtml(e.url)}" target="_blank" rel="noopener">${inner}</a></div>`;
  }
  return `<div class="event" data-time="${eventTime}">${inner}</div>`;
}

function applyFilter() {
  const tl = document.getElementById('timeline');
  if (!tl) return;
  const filtered = allEvents.filter(e => {
    const cat = typeToCat(e.type);
    if (!filterState.types.has(cat)) return false;
    const memberMatch = filterState.members.has(e.member_id);
    const channelMatch = e.channel_id && filterState.members.has(e.channel_id);
    if (cat === 'chat') return memberMatch || channelMatch;
    return memberMatch;
  });
  const sortLabel = eventSortAsc ? '오래된순' : '최신순';
  const arrowSvg = eventSortAsc
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 5 12 19"/><polyline points="5 12 12 19 19 12"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 19 12 5"/><polyline points="5 12 12 5 19 12"/></svg>';
  const headerHtml = `<div class="timeline-header"><button class="sort-toggle" id="sortToggleBtn">${arrowSvg}<span>${sortLabel}</span></button></div>`;
  if (filtered.length === 0) {
    tl.innerHTML = headerHtml + (allEvents.length === 0
      ? '<div class="timeline-empty">아직 기록된 이벤트가 없어요<br><br>방송, 게시글, 유튜브 영상 등이 올라오면 여기에 표시됩니다</div>'
      : '<div class="timeline-empty">필터 조건에 맞는 이벤트가 없어요</div>');
  } else {
    const sorted = [...filtered].sort((a, b) => eventSortAsc
      ? new Date(a.time) - new Date(b.time)
      : new Date(b.time) - new Date(a.time));
    tl.innerHTML = headerHtml + sorted.map(e => renderEvent(e, sorted)).join('');
  }
  const sortBtn = document.getElementById('sortToggleBtn');
  if (sortBtn) sortBtn.addEventListener('click', () => { eventSortAsc = !eventSortAsc; applyFilter(); });
  const summary = document.getElementById('filterSummary');
  if (summary) summary.textContent = '선택된 멤버/종류만 알림됩니다.';

  tl.dataset.clickInit = '1';
  refreshUnreadIndicator();
}

function selectStatsTab(tabId) {
  statsState.selectedTab = tabId;
  if (tabId !== 'all' && tabId !== 'annual') statsState.viewMode = 'monthly';
  document.querySelectorAll('.stats-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tabId);
  });
  if (tabId !== 'all') {
    const latestDate = findLatestActivityDate(tabId);
    if (latestDate) {
      const d = new Date(latestDate);
      statsState.viewMonth = { year: d.getFullYear(), month: d.getMonth() + 1 };
      statsState.selectedDate = isoToKstDateKey(latestDate);
    } else {
      const now = new Date();
      statsState.viewMonth = { year: now.getFullYear(), month: now.getMonth() + 1 };
      statsState.selectedDate = null;
    }
  }
  renderStatsBody();
}

function findLatestActivityDate(memberId) {
  const ms = getMemberStatsForView(memberId);
  if (!ms) return null;
  let latestBroadcast = null;
  for (const s of (ms.sessions || [])) {
    if (!s.start) continue;
    const t = new Date(s.start).getTime();
    if (isNaN(t)) continue;
    if (latestBroadcast === null || t > new Date(latestBroadcast).getTime()) latestBroadcast = s.start;
  }
  if (latestBroadcast) return latestBroadcast;
  let latest = null;
  const candidates = [
    ...(ms.posts || []).map(p => p.time),
    ...(ms.youtube || []).map(y => y.time),
    ...(ms.cafe || []).map(c => c.time),
  ];
  for (const t of candidates) {
    const ms2 = new Date(t).getTime();
    if (isNaN(ms2)) continue;
    if (latest === null || ms2 > new Date(latest).getTime()) latest = t;
  }
  return latest;
}

function computeMonthSummary(memberStats, year, month1) {
  const result = {
    daysWithBroadcast: 0, totalDaysInMonth: daysInMonth(year, month1),
    totalDurationMs: 0, postCount: 0, youtubeCount: 0, cafeCount: 0,
    viewerPeak: 0, viewerSum: 0, viewerCount: 0,
    sessionsByDate: {}, postsByDate: {}, youtubeByDate: {}, cafeByDate: {},
  };
  if (!memberStats) return result;
  const monthStart = new Date(year, month1 - 1, 1, 0, 0, 0).getTime();
  const monthEnd = new Date(year, month1, 1, 0, 0, 0).getTime();
  const dateSet = new Set();
  for (const s of (memberStats.sessions || [])) {
    const startMs = new Date(s.start).getTime();
    if (isNaN(startMs) || startMs < monthStart || startMs >= monthEnd) continue;
    const dateKey = isoToKstDateKey(s.start);
    if (!dateKey) continue;
    dateSet.add(dateKey);
    if (!result.sessionsByDate[dateKey]) result.sessionsByDate[dateKey] = [];
    result.sessionsByDate[dateKey].push(s);
    if (s.end) {
      const endMs = new Date(s.end).getTime();
      if (!isNaN(endMs) && endMs > startMs) result.totalDurationMs += (endMs - startMs);
    }
    if (s.viewer_peak && s.viewer_peak > result.viewerPeak) result.viewerPeak = s.viewer_peak;
    if (s.viewer_sum) result.viewerSum += s.viewer_sum;
    if (s.viewer_count) result.viewerCount += s.viewer_count;
  }
  result.daysWithBroadcast = dateSet.size;
  for (const p of (memberStats.posts || [])) {
    const t = new Date(p.time).getTime();
    if (!isNaN(t) && t >= monthStart && t < monthEnd) {
      result.postCount++;
      const dateKey = isoToKstDateKey(p.time);
      if (dateKey) {
        if (!result.postsByDate[dateKey]) result.postsByDate[dateKey] = [];
        result.postsByDate[dateKey].push(p);
      }
    }
  }
  for (const y of (memberStats.youtube || [])) {
    const t = new Date(y.time).getTime();
    if (!isNaN(t) && t >= monthStart && t < monthEnd) {
      result.youtubeCount++;
      const dateKey = isoToKstDateKey(y.time);
      if (dateKey) {
        if (!result.youtubeByDate[dateKey]) result.youtubeByDate[dateKey] = [];
        result.youtubeByDate[dateKey].push(y);
      }
    }
  }
  for (const c of (memberStats.cafe || [])) {
    const t = new Date(c.time).getTime();
    if (!isNaN(t) && t >= monthStart && t < monthEnd) {
      result.cafeCount++;
      const dateKey = isoToKstDateKey(c.time);
      if (dateKey) {
        if (!result.cafeByDate[dateKey]) result.cafeByDate[dateKey] = [];
        result.cafeByDate[dateKey].push(c);
      }
    }
  }
  // seed 데이터 합산 (서비스 시작 전 수동 입력 데이터)
  if (memberStats.seed) {
    result.totalDurationMs    += memberStats.seed.broadcastMs || 0;
    result.daysWithBroadcast  += memberStats.seed.sessions    || 0;
    result.postCount          += memberStats.seed.posts       || 0;
    result.youtubeCount       += memberStats.seed.youtube     || 0;
    result.cafeCount          += memberStats.seed.cafe        || 0;
    if (memberStats.seed.viewerPeak && memberStats.seed.viewerPeak > result.viewerPeak) result.viewerPeak = memberStats.seed.viewerPeak;
    if (memberStats.seed.viewerSum) result.viewerSum += memberStats.seed.viewerSum;
    if (memberStats.seed.viewerCount) result.viewerCount += memberStats.seed.viewerCount;
    if (memberStats.seed.viewerAvg && !memberStats.seed.viewerSum && result.viewerCount === 0) {
      result.viewerSum = memberStats.seed.viewerAvg;
      result.viewerCount = 1;
    }
  }
  return result;
}

function renderStatsBody() {
  const body = document.getElementById('statsBody');
  if (!body) return;
  if (!statsState.viewMonth) {
    const now = new Date();
    statsState.viewMonth = { year: now.getFullYear(), month: now.getMonth() + 1 };
  }
  const ym = currentViewYm();
  if (ym && !statsState.data[ym] && !statsState.loadingMonths.has(ym)) {
    body.innerHTML = '<div class="loading"><div class="spinner"></div><div>통계 불러오는 중...</div></div>';
    loadStatsMonth(ym).then(() => { if (currentPage === 'stats') renderStatsBody(); });
    return;
  }
  if (statsState.loadingMonths.has(ym)) {
    body.innerHTML = '<div class="loading"><div class="spinner"></div><div>통계 불러오는 중...</div></div>';
    return;
  }
  if (statsState.viewMode === 'annual') { renderStatsAnnual(body); return; }
  if (statsState.selectedTab === 'all') renderStatsAll(body);
  else renderStatsMember(body, statsState.selectedTab);
}

function renderStatsAnnual(body) {
  const now = new Date();
  if (!statsState.viewYear) statsState.viewYear = now.getFullYear();
  const year = statsState.viewYear;
  const isCurrentYear = (year === now.getFullYear());
  const isStartYear = (year === STATS_START_YEAR);

  // 해당 연도 모든 월이 로드됐는지 확인, 없으면 로드 후 재렌더
  const maxMonth = isCurrentYear ? now.getMonth() + 1 : 12;
  const monthsToLoad = [];
  for (let mo = 1; mo <= maxMonth; mo++) {
    const ym = `${year}-${String(mo).padStart(2,'0')}`;
    if (!statsState.data[ym] && !statsState.loadingMonths.has(ym)) monthsToLoad.push(ym);
  }
  if (monthsToLoad.length > 0) {
    body.innerHTML = '<div class="loading"><div class="spinner"></div><div>연간 통계 불러오는 중...</div></div>';
    Promise.all(monthsToLoad.map(ym => loadStatsMonth(ym))).then(() => {
      if (currentPage === 'stats') renderStatsBody();
    });
    return;
  }

  // 해당 연도의 모든 월 stats 합산
  const annualSums = {};
  MEMBERS.forEach(m => {
    annualSums[m.id] = { sessions: 0, totalDurationMs: 0, postCount: 0, youtubeCount: 0, cafeCount: 0, viewerPeak: 0, viewerSum: 0, viewerCount: 0 };
  });
  for (let mo = 1; mo <= 12; mo++) {
    const ym = `${year}-${String(mo).padStart(2,'0')}`;
    MEMBERS.forEach(m => {
      const ms = statsState.data[ym]?.[m.id];
      if (!ms) return;
      const monthStart = new Date(year, mo - 1, 1).getTime();
      const monthEnd = new Date(year, mo, 1).getTime();
      // 자동 수집 데이터
      annualSums[m.id].sessions += (ms.sessions || []).filter(s => {
        const t = new Date(s.start).getTime();
        return !isNaN(t) && t >= monthStart && t < monthEnd;
      }).length;
      (ms.sessions || []).forEach(s => {
        const t = new Date(s.start).getTime();
        if (isNaN(t) || t < monthStart || t >= monthEnd) return;
        if (s.end) {
          const e = new Date(s.end).getTime();
          if (!isNaN(e) && e > t) annualSums[m.id].totalDurationMs += (e - t);
        }
        if (s.viewer_peak && s.viewer_peak > annualSums[m.id].viewerPeak) annualSums[m.id].viewerPeak = s.viewer_peak;
        if (s.viewer_sum) annualSums[m.id].viewerSum += s.viewer_sum;
        if (s.viewer_count) annualSums[m.id].viewerCount += s.viewer_count;
      });
      annualSums[m.id].postCount    += (ms.posts   || []).filter(p => { const t = new Date(p.time).getTime(); return !isNaN(t) && t >= monthStart && t < monthEnd; }).length;
      annualSums[m.id].youtubeCount += (ms.youtube || []).filter(y => { const t = new Date(y.time).getTime(); return !isNaN(t) && t >= monthStart && t < monthEnd; }).length;
      annualSums[m.id].cafeCount    += (ms.cafe    || []).filter(c => { const t = new Date(c.time).getTime(); return !isNaN(t) && t >= monthStart && t < monthEnd; }).length;
      // seed 데이터 합산
      if (ms.seed) {
        annualSums[m.id].sessions        += ms.seed.sessions    || 0;
        annualSums[m.id].totalDurationMs += ms.seed.broadcastMs || 0;
        annualSums[m.id].postCount       += ms.seed.posts       || 0;
        annualSums[m.id].youtubeCount    += ms.seed.youtube     || 0;
        annualSums[m.id].cafeCount       += ms.seed.cafe        || 0;
        if (ms.seed.viewerPeak && ms.seed.viewerPeak > annualSums[m.id].viewerPeak) annualSums[m.id].viewerPeak = ms.seed.viewerPeak;
        if (ms.seed.viewerSum) annualSums[m.id].viewerSum += ms.seed.viewerSum;
        if (ms.seed.viewerCount) annualSums[m.id].viewerCount += ms.seed.viewerCount;
        if (ms.seed.viewerAvg && !ms.seed.viewerSum) { annualSums[m.id].viewerSum += ms.seed.viewerAvg; annualSums[m.id].viewerCount += 1; }
      }
    });
  }


  // 순위 계산
  const MEDAL_KEYS = [
    { key: 'sessions',       get: s => s.sessions },
    { key: 'totalDurationMs',get: s => s.totalDurationMs },
    { key: 'postCount',      get: s => s.postCount },
    { key: 'youtubeCount',   get: s => s.youtubeCount },
    { key: 'cafeCount',      get: s => s.cafeCount },
  ];
  const MEDALS = ['🥇','🥈','🥉'];
  const medals = {};
  MEMBERS.forEach(m => { medals[m.id] = {}; });
  MEDAL_KEYS.forEach(({ key, get }) => {
    const vals = MEMBERS.map(m => ({ id: m.id, v: get(annualSums[m.id]) }));
    const sorted = [...new Set(vals.map(x => x.v))].sort((a, b) => b - a);
    let rank = 0;
    sorted.forEach(v => {
      const medal = v > 0 ? (MEDALS[rank] || '') : '';
      vals.filter(x => x.v === v).forEach(x => { medals[x.id][key] = medal; });
      if (v > 0) rank++;
    });
  });

  const cards = MEMBERS.map(m => {
    const sum = annualSums[m.id];
    const md = medals[m.id];
    const mv = (k) => md[k] ? `<span style="margin-right:3px">${md[k]}</span>` : '';

function renderCalendar(year, month1, sum) {
  const { sessionsByDate={}, postsByDate={}, youtubeByDate={}, cafeByDate={} } = sum;
  const totalDays = daysInMonth(year, month1);
  const firstDow = new Date(year, month1 - 1, 1).getDay();
  const todayKey = isoToKstDateKey(new Date().toISOString());
  const weekdays = ['일','월','화','수','목','금','토'];
  let html = `<div class="calendar"><div class="calendar-grid">`;
  weekdays.forEach((w, i) => {
    html += `<div class="calendar-weekday ${i===0?'sun':i===6?'sat':''}">${w}</div>`;
  });
  for (let i = 0; i < firstDow; i++) html += `<div class="calendar-day outside"></div>`;
  for (let day = 1; day <= totalDays; day++) {
    const dateKey = ymdKey(year, month1, day);
    const sessions = sessionsByDate[dateKey] || [];
    const posts = postsByDate[dateKey] || [];
    const youtubes = youtubeByDate[dateKey] || [];
    const cafes = cafeByDate[dateKey] || [];
    const hasBroadcast = sessions.length > 0;
    const hasPost = posts.length > 0;
    const hasYoutube = youtubes.length > 0;
    const hasCafe = cafes.length > 0;
    const hasActivity = hasBroadcast || hasPost || hasYoutube || hasCafe;
    const classes = ['calendar-day'];
    if (hasBroadcast) classes.push('has-broadcast');
    if (hasActivity) classes.push('has-activity');
    if (dateKey === todayKey) classes.push('today');
    if (statsState.selectedDate === dateKey) classes.push('selected');
    let bottomLine = '';
    if (hasBroadcast) {
      bottomLine = `<span class="calendar-daycount">${sessions.length}회</span>`;
    } else if (hasPost || hasYoutube || hasCafe) {
      const dots = [];
      if (hasPost) dots.push('<span class="calendar-day-dot post"></span>');
      if (hasYoutube) dots.push('<span class="calendar-day-dot youtube"></span>');
      if (hasCafe) dots.push('<span class="calendar-day-dot cafe"></span>');
      bottomLine = `<div class="calendar-day-dots">${dots.join('')}</div>`;
    }
    html += `<button class="${classes.join(' ')}" data-date="${dateKey}"><span class="calendar-daynum">${day}</span>${bottomLine}</button>`;
  }
  const trailing = (7 - ((firstDow + totalDays) % 7)) % 7;
  for (let i = 0; i < trailing; i++) html += `<div class="calendar-day outside"></div>`;
  html += `</div></div>`;
  return html;
}

function renderDayDetail(year, month1, sum, memberId) {
  const { sessionsByDate={}, postsByDate={}, youtubeByDate={}, cafeByDate={} } = sum;
  const date = statsState.selectedDate;
  if (!date) return `<div class="day-detail-empty">달력에서 날짜를 선택하면<br>해당 일의 활동 기록을 볼 수 있습니다</div>`;
  const sessions = sessionsByDate[date] || [];
  const posts = postsByDate[date] || [];
  const youtubes = youtubeByDate[date] || [];
  const cafes = cafeByDate[date] || [];
  const totalActivities = sessions.length + posts.length + youtubes.length + cafes.length;
  if (totalActivities === 0) return `<div class="day-detail-title">${date}</div><div class="day-detail-empty">이 날은 활동 기록이 없어요</div>`;
  const summaryParts = [];
  if (sessions.length > 0) summaryParts.push(`방송 ${sessions.length}회`);
  if (posts.length > 0) summaryParts.push(`게시글 ${posts.length}개`);
  if (youtubes.length > 0) summaryParts.push(`유튜브 ${youtubes.length}개`);
  if (cafes.length > 0) summaryParts.push(`카페 ${cafes.length}개`);
  let html = `<div class="day-detail-title">${date} · ${summaryParts.join(' · ')}</div>`;
  const items = [];
  for (const s of sessions) {
    const t = new Date(s.start).getTime();
    if (!isNaN(t)) items.push({ kind: 'session', time: t, data: s });
  }
  for (const p of posts) {
    const t = new Date(p.time).getTime();
    if (!isNaN(t)) items.push({ kind: 'post', time: t, data: p });
  }
  for (const y of youtubes) {
    const t = new Date(y.time).getTime();
    if (!isNaN(t)) items.push({ kind: 'youtube', time: t, data: y });
  }
  for (const c of cafes) {
    const t = new Date(c.time).getTime();
    if (!isNaN(t)) items.push({ kind: 'cafe', time: t, data: c });
  }
  items.sort((a, b) => a.time - b.time);
  for (const item of items) {
    if (item.kind === 'session') {
      const s = item.data;
      const startStr = formatHHMM(s.start);
      const endStr = s.end ? formatHHMM(s.end) : '진행 중';
      let durStr = '';
      if (s.end) {
        const ms = new Date(s.end).getTime() - new Date(s.start).getTime();
        durStr = ` · ${formatDuration(ms)}`;
      }
      const modeBadge = `<span class="day-session-mode ${s.mode || 'normal'}">${MODE_LABEL[s.mode] || '일반 방송'}</span>`;
      let changesHtml = '';
      if (s.changes && s.changes.length > 0) {
        changesHtml = `<div class="day-session-changes">${s.changes.map(c => {
          let icon, label, valHtml;
          if (c.type === 'title') { icon = '✎'; label = '방송 제목'; valHtml = `${escapeHtml(c.before||'')} → ${escapeHtml(c.after||'')}`; }
          else if (c.type === 'category') { icon = SVG_ICONS.tag; label = '카테고리'; valHtml = `${escapeHtml(c.before||'')} → ${escapeHtml(c.after||'')}`; }
          else if (c.type === 'mode_change') { icon = SVG_ICONS.rotate; label = '방송 모드'; valHtml = `${MODE_LABEL[c.before]||c.before} → ${MODE_LABEL[c.after]||c.after}`; }
          else { icon = '•'; label = c.type; valHtml = `${escapeHtml(c.before||'')} → ${escapeHtml(c.after||'')}`; }
          return `<div class="day-session-change"><span class="day-session-change-time">${formatHHMM(c.time)}</span><span class="day-session-change-icon">${icon}</span><span><b>${label}</b> ${valHtml}</span></div>`;
        }).join('')}</div>`;
      }
      const sessionUrl = s.end
        ? `https://www.sooplive.com/station/${memberId}/vod`
        : `https://play.sooplive.co.kr/${memberId}`;
      const sessionInner = `<div class="day-session-row-head"><span class="day-kind-icon broadcast">${SVG_ICONS.infinity}</span><span class="day-session-time">${startStr} ~ ${endStr}${durStr}</span></div><div class="day-session-title">${modeBadge}${escapeHtml(s.title||'')}</div>${changesHtml}`;
      html += memberId
        ? `<a class="day-session" href="${escapeHtml(sessionUrl)}" target="_blank" rel="noopener">${sessionInner}</a>`
        : `<div class="day-session">${sessionInner}</div>`;
    } else if (item.kind === 'post') {
      const p = item.data;
      const inner = `<span class="day-kind-icon post">${SVG_ICONS.board}</span><span class="day-item-time">${formatHHMM(p.time)}</span><span class="day-item-title">${escapeHtml(p.title||'(제목 없음)')}</span>`;
      html += p.url ? `<a class="day-item" href="${escapeHtml(p.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="day-item">${inner}</div>`;
    } else if (item.kind === 'youtube') {
      const y = item.data;
      const inner = `<span class="day-kind-icon youtube">${SVG_ICONS.youtube}</span><span class="day-item-time">${formatHHMM(y.time)}</span><span class="day-item-title">${escapeHtml(y.title||'(제목 없음)')}</span>`;
      html += y.url ? `<a class="day-item" href="${escapeHtml(y.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="day-item">${inner}</div>`;
    } else if (item.kind === 'cafe') {
      const c = item.data;
      const cafeNameEsc = escapeHtml(c.cafe_name || '');
      const inner = `<span class="day-kind-icon cafe">${SVG_ICONS.coffee}</span><span class="day-item-time">${formatHHMM(c.time)}</span><span class="day-item-title">${cafeNameEsc ? `[${cafeNameEsc}] ` : ''}${escapeHtml(c.title||'(제목 없음)')}</span>`;
      html += c.url ? `<a class="day-item" href="${escapeHtml(c.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="day-item">${inner}</div>`;
    }
  }
  return html;
}

async function loadStatsMonth(yyyymm) {
  if (!yyyymm) return;
  if (!isCurrentMonth(yyyymm)) {
    const cached = lsGetMonthCache(yyyymm);
    if (cached) { statsState.data[yyyymm] = cached; return; }
  }
  if (statsState.loadingMonths.has(yyyymm)) return;
  statsState.loadingMonths.add(yyyymm);
  try {
    const res = await fetch(`${WORKER_URL}/stats?month=${yyyymm}`);
    if (!res.ok) throw new Error('stats fetch failed');
    const data = await res.json();
    const monthData = data.stats || {};
    statsState.data[yyyymm] = monthData;
    if (!isCurrentMonth(yyyymm)) lsSetMonthCache(yyyymm, monthData);
  } catch (e) {
  } finally {
    statsState.loadingMonths.delete(yyyymm);
  }
}

async function loadLive() {
  try {
    const res = await fetch(WORKER_URL + '/');
    const data = await res.json();
    const infoMap = {};
    data.members.forEach(m => { infoMap[m.id] = m; });
    const sorted = [...MEMBERS].sort((a, b) => {
      const al = (infoMap[a.id] && infoMap[a.id].live) ? 1 : 0;
      const bl = (infoMap[b.id] && infoMap[b.id].live) ? 1 : 0;
      return bl - al;
    });
    const grid = document.createElement('div');
    grid.className = 'grid';
    let liveCount = 0;
    sorted.forEach((m, i) => {
      const info = infoMap[m.id] || { id: m.id, live: false };
      grid.appendChild(buildCard(m, info, i * 35));
      if (info.live) liveCount++;
    });
    document.getElementById('app').innerHTML = '';
    document.getElementById('app').appendChild(grid);
    const liveBadge = document.getElementById('navLiveBadge');
    const liveCountEl = document.getElementById('navLiveCount');
    if (liveBadge && liveCountEl) {
      liveCountEl.textContent = liveCount;
      liveBadge.classList.toggle('on', liveCount > 0);
      liveBadge.classList.toggle('off', liveCount === 0);
    }
    lastLiveUpdate = new Date();
    updateHeaderCenter();
  } catch (e) {
    document.getElementById('app').innerHTML =
      '<div class="loading"><div>데이터를 불러올 수 없어요</div></div>';

function parseCSV(text) {
  const rows = [];
  const lines = text.split('\n');
  for (const line of lines) {
    if (!line.trim()) continue;
    const row = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (inQuotes) {
        if (ch === '"' && line[i+1] === '"') { current += '"'; i++; }
        else if (ch === '"') inQuotes = false;
        else current += ch;
      } else {
        if (ch === '"') inQuotes = true;
        else if (ch === ',') { row.push(current.trim()); current = ''; }
        else current += ch;
      }
    }
    row.push(current.trim());
    rows.push(row);
  }
  return rows;
}

function parseBannerDate(url) {
  const match = url.match(/(\d{6})\.webp/);
  if (!match) return null;
  const s = match[1];
  const yy = parseInt(s.substring(0, 2));
  const mm = s.substring(2, 4);
  const dd = s.substring(4, 6);
  return { sort: s, display: `20${yy}.${mm}.${dd}` };
}

function renderBanners() {
  const body = document.getElementById('bannerBody');
  if (!body) return;
  if (bannerData.length === 0) {
    body.innerHTML = '<div class="loading"><div>현수막 데이터가 없어요</div></div>';
    return;
  }

  const counts = {};
  MEMBERS.forEach(m => { counts[m.name] = 0; });
  bannerData.forEach(b => b.members.forEach(name => { if (counts[name] !== undefined) counts[name]++; }));
  const ranked = MEMBERS.map(m => ({ ...m, count: counts[m.name] || 0 })).sort((a, b) => b.count - a.count);
  const MEDALS = ['🥇','🥈','🥉'];
  let medalIdx = 0;
  let prevCount = -1;
  ranked.forEach(r => {
    if (r.count > 0 && r.count !== prevCount) { r.medal = MEDALS[medalIdx] || ''; medalIdx++; prevCount = r.count; }
    else if (r.count > 0) { r.medal = MEDALS[medalIdx - 1] || ''; }
    else { r.medal = ''; }
  });

  const rankHtml = ranked.map(r => `
    <div class="banner-rank-item ${r.medal ? 'top' : ''}">
      ${r.medal ? `<span class="banner-rank-medal">${r.medal}</span>` : ''}

      <span class="banner-rank-count" style="color:${r.color}">${r.count}회</span>

      const m = MEMBERS.find(x => x.name === name);
      return m ? `<img src="${m.img}" alt="${escapeHtml(name)}" title="${escapeHtml(name)}">` : '';
    }).join('');

  body.innerHTML = `

  `;
}

function membersRowStyle(count) {
  if (count >= 7 && count <= 8) return ' style="max-width:86px"';
  if (count >= 9 && count <= 10) return ' style="max-width:108px"';
  return '';
}

function parseContentDate(url) {
  const match = url.match(/(\d{6})(?:-\d+)?\.webp/);
  if (!match) return null;
  const s = match[1];
  const yy = parseInt(s.substring(0, 2));
  const mm = s.substring(2, 4);
  const dd = s.substring(4, 6);
  // sort key: full match including suffix for stable ordering
  const fullMatch = url.match(/(\d{6}(?:-\d+)?)\.webp/);
  return { sort: fullMatch ? fullMatch[1] : s, display: `20${yy}.${mm}.${dd}` };
}

      const m1 = MEMBERS[i], m2 = MEMBERS[j];
      const c1 = chemCounts[`${m1.id}:${m2.id}`] || 0;
      const c2 = chemCounts[`${m2.id}:${m1.id}`] || 0;
      pairs.push({ m1, m2, c1, c2, total: c1 + c2 });
    }
  }
  pairs.sort((a, b) => b.total - a.total);

  const filtered = pairs.filter(p => chemFilterMembers.has(p.m1.id) || chemFilterMembers.has(p.m2.id));

  const cards = filtered.map(p => {
    const chemKey = `${p.m1.id}:${p.m2.id}`;
    const customName = CHEM_NAMES[chemKey];
    const displayName = customName || `${escapeHtml(p.m1.name)} × ${escapeHtml(p.m2.name)}`;
    return `
    <div class="chem-card">
      <div class="chem-name">${customName ? escapeHtml(customName) : displayName}</div>
      <div class="chem-body">
        <div class="chem-member">
          <img src="${p.m1.img}" alt="${escapeHtml(p.m1.name)}">
          <span class="chem-member-name" style="color:${p.m1.color}">${escapeHtml(p.m1.name)}</span>
        </div>
        <div class="chem-arrows">
          <div class="chem-arrow-row"><span class="chem-count">${p.c1.toLocaleString()}</span> →</div>
          <div class="chem-arrow-row">← <span class="chem-count">${p.c2.toLocaleString()}</span></div>
        </div>
        <div class="chem-member">
          <img src="${p.m2.img}" alt="${escapeHtml(p.m2.name)}">
          <span class="chem-member-name" style="color:${p.m2.color}">${escapeHtml(p.m2.name)}</span>
        </div>
      </div>
    </div>
  `;
  }).join('');

  const allOn = chemFilterMembers.size === MEMBERS.length;
  const memberBtns = MEMBERS.map(m => `
    <button class="filter-member ${chemFilterMembers.has(m.id) ? 'on' : ''}" data-id="${m.id}">
      <img src="${m.img}" alt="${escapeHtml(m.name)}">
    </button>
  `).join('');

  body.innerHTML = `
    <div class="chem-filter-bar">
      <div class="chem-filter-members" id="chemFilterMembers">${memberBtns}</div>
      <button class="chem-filter-toggle" id="chemFilterToggle">${allOn ? '모두 해제' : '모두 선택'}</button>
    </div>
    <div class="chem-grid">
      <div class="chem-group-section" style="margin-top:0;padding-top:0;border-top:none"><div class="chem-group-title">2인 케미</div></div>
      ${cards.length > 0 ? cards : '<div class="chem-empty">필터 조건에 맞는 케미가 없어요</div>'}
      ${[...new Set(CHEM_GROUPS.map(g => g.members.length))].sort((a, b) => a - b).map(n => {
        const groups = CHEM_GROUPS.filter(g => g.members.length === n && g.members.some(id => chemFilterMembers.has(id)));
        if (groups.length === 0) return '';
        const groupCards = groups.map(g => {
          const membersHtml = g.members.map(id => {
            const m = MEMBER_BY_ID[id];
            if (!m) return '';
            return `<div class="chem-member"><img src="${m.img}" alt="${escapeHtml(m.name)}"><span class="chem-member-name" style="color:${m.color}">${escapeHtml(m.name)}</span></div>`;
          }).join('');
          return `<div class="chem-card"><div class="chem-name">${escapeHtml(g.name)}</div><div class="chem-body"><div class="chem-group-members${g.members.length >= 7 ? ' large' : ''}">${membersHtml}</div></div></div>`;
        }).join('');
        return `<div class="chem-group-section"><div class="chem-group-title">${n}인 케미</div><div class="chem-group-grid">${groupCards}</div></div>`;
      }).join('')}
    </div>
  `;

  body.querySelectorAll('#chemFilterMembers .filter-member').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      if (chemFilterMembers.has(id)) chemFilterMembers.delete(id); else chemFilterMembers.add(id);
      renderChemistry();
    });
  });
  const toggleBtn = document.getElementById('chemFilterToggle');
  if (toggleBtn) toggleBtn.addEventListener('click', () => {
    if (chemFilterMembers.size === MEMBERS.length) chemFilterMembers.clear(); else MEMBERS.forEach(m => chemFilterMembers.add(m.id));
    renderChemistry();
  });
}
</script>
</body>
</html>
